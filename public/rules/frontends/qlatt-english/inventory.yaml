  # adult male averages for F1-F3. B1-B3 use Kent & Vorperian (2018) typical
  # adult-male bandwidth ranges. Unstressed variants keep the same spectral
  # targets; vowel reduction is handled by duration/formant rules rather than
  # baked into the lexicon.
