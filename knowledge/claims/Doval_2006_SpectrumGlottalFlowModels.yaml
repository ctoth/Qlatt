source:
  paper: Doval_2006_SpectrumGlottalFlowModels

claims:
  - id: claim_0039
    type: equation
    expression: "Fg = fg_alpha_m * F0 / Oq"
    variables:
      - symbol: Fg
        concept: speech_0015
      - symbol: F0
        concept: speech_0001
      - symbol: Oq
        concept: speech_0002
    concepts:
      - speech_0015
      - speech_0011
      - speech_0001
      - speech_0002
    provenance:
      paper: Doval_2006_SpectrumGlottalFlowModels
      page: 9
      section: "Glottal Formant Frequency"

  - id: claim_0040
    type: observation
    statement: >
      The glottal formant bandwidth depends ONLY on alpha_m, not on E, T0, or Oq.
      The quality coefficient Qg = Amax/Ag = qg(alpha_m) is a function of
      asymmetry coefficient alone.
    concepts:
      - speech_0015
      - speech_0011
    provenance:
      paper: Doval_2006_SpectrumGlottalFlowModels
      page: 10
      section: "Quality Coefficient"

  - id: claim_0041
    type: observation
    statement: >
      H1-H2 depends on BOTH Oq AND alpha_m, not just Oq.
      Cannot determine Oq from H1-H2 alone without knowing alpha_m.
      Multiple (Oq, alpha_m) pairs produce identical H1-H2 values.
    concepts:
      - speech_0012
      - speech_0002
      - speech_0011
    provenance:
      paper: Doval_2006_SpectrumGlottalFlowModels
      page: 15
      figure: "Fig. 18"

  - id: claim_0042
    type: equation
    expression: "alpha_m = SQ / (1 + SQ)"
    variables:
      - symbol: alpha_m
        concept: speech_0011
      - symbol: SQ
        concept: speech_0003
    concepts:
      - speech_0011
      - speech_0003
    provenance:
      paper: Doval_2006_SpectrumGlottalFlowModels
      page: 3
      section: "Parameter Relationships"

  - id: claim_0043
    type: equation
    expression: "Rk = (1 - alpha_m) / alpha_m"
    variables:
      - symbol: Rk
        concept: speech_0007
      - symbol: alpha_m
        concept: speech_0011
    concepts:
      - speech_0007
      - speech_0011
    provenance:
      paper: Doval_2006_SpectrumGlottalFlowModels
      page: 3
      section: "Conversion to Other Parameter Sets"

  - id: claim_0044
    type: equation
    expression: "NAQ = av_alpha_m * Oq"
    variables:
      - symbol: Oq
        concept: speech_0002
    concepts:
      - speech_0002
      - speech_0011
    provenance:
      paper: Doval_2006_SpectrumGlottalFlowModels
      page: 8
      section: "NAQ Parameter"
