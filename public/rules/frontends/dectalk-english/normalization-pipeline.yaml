# Text normalization pipeline for dectalk-english frontend.
#
# Mirrors the qlatt-english pipeline, with one DECtalk-specific addition: a
# year-reading step (`expand_years`) inserted before the generic cardinal
# number step. DECtalk reads a bare 4-digit string that satisfies its year
# predicate as two 2-digit halves ("1984" -> "nineteen eighty four") rather than
# as a cardinal. The predicate parameters and the speaking form are DATA here;
# the readYearInline builtin is a generic, config-driven handler.
#
# Step types:
#   builtin        — calls a named TypeScript function (algorithmic, not declarative)
#   regex_replace  — applies a regex pattern with a replacement string or named handler
#   table_replace  — word-boundary-aware substitution from a lookup table
#
# Citations:
#   - Allen, Hunnicutt & Klatt 1987 Ch.3 (MITalk text analysis pipeline order)
#   - Ebden & Sproat 2015 (Kestrel TN framework, semiotic class ordering)
#   - DECtalk 4.63 ls_util.c:598-622 (ls_util_is_year predicate)
#   - DECtalk 4.63 l_us_pr1.c:367-398 (ls_proc_do_4_digits year speaking)

steps:
  - name: lowercase
    type: builtin
    handler: lowercase
    citations:
      - Allen, Hunnicutt & Klatt 1987 Ch.3

  - name: normalize_quotes
    type: regex_replace
    description: "Normalize typographic/smart quotes to ASCII equivalents"
    rules:
      - pattern: "[\\u2018\\u2019\\u201A\\u2032]"
        replacement: "'"
        flags: "g"
      - pattern: "[\\u201C\\u201D\\u201E]"
        replacement: "\""
        flags: "g"
      - pattern: "\\u2026"
        replacement: "..."
        flags: "g"
    citations:
      - Allen, Hunnicutt & Klatt 1987 Ch.3

  - name: expand_abbreviations
    type: table_replace
    table: abbreviations
    description: "Expand common abbreviations before punctuation stripping"
    citations:
      - Allen, Hunnicutt & Klatt 1987 Ch.3

  - name: expand_initialisms
    type: regex_replace
    description: "Expand dotted initialisms (U.S.A. -> u s a)"
    rules:
      - pattern: "\\b(?:[a-z]\\.){2,}[a-z]?\\.?"
        handler: expandInitialism
        flags: "gi"
    citations:
      - Allen, Hunnicutt & Klatt 1987 Ch.3

  - name: expand_dates_slash
    type: builtin
    handler: dateToWords
    pattern: "\\b([0-1]?[0-9])/([0-3]?[0-9])/([0-9]{4})\\b"
    flags: "g"
    citations:
      - Ebden & Sproat 2015

  - name: expand_dates_iso
    type: builtin
    handler: isoDateToWords
    pattern: "\\b([0-9]{4})-([0-1][0-9])-([0-3][0-9])\\b"
    flags: "g"
    citations:
      - Ebden & Sproat 2015

  - name: expand_time_meridiem
    type: builtin
    handler: timeToWords
    pattern: "\\b([0-2]?[0-9]):([0-5][0-9])\\s*([ap]\\.?m\\.?)\\b"
    flags: "gi"
    citations:
      - Ebden & Sproat 2015

  - name: expand_time_24h
    type: builtin
    handler: timeToWords
    pattern: "\\b([0-2]?[0-9]):([0-5][0-9])\\b"
    flags: "g"
    citations:
      - Ebden & Sproat 2015

  - name: expand_currency
    type: builtin
    handler: currencyToWords
    pattern: "\\$([0-9]{1,3}(?:,[0-9]{3})*|[0-9]+)(?:\\.([0-9]{1,2}))?"
    flags: "g"
    citations:
      - Ebden & Sproat 2015

  - name: expand_decimals
    type: builtin
    handler: decimalToWords
    pattern: "\\b([0-9]{1,3}(?:,[0-9]{3})*|[0-9]+)\\.([0-9]+)\\b"
    flags: "g"
    citations:
      - Ebden & Sproat 2015

  # DECtalk-specific: read "N/D" fractions before the cardinal/ordinal number
  # steps so the slash form is consumed as a single fraction. Detection mirrors
  # ls_proc_is_frac (l_us_pr1.c:980-1015): numerator 1-2 digits no leading 0,
  # '/', denominator 1-3 digits no leading 0 (a 3-digit denominator must equal
  # max_3digit_denominator = 100), optional trailing '%'. Speaking mirrors
  # ls_proc_do_frac (l_us_pr1.c:1034-1069): numerator cardinal; denominator as an
  # ordinal (with a plural "s" when the numerator is plural), except the
  # special_denominators below ("2" -> half/halves). Per the source, only "2" is
  # special — "3/4" reads "three fourths", NOT the colloquial "three quarters".
  - name: expand_fractions
    type: builtin
    handler: readFractionInline
    pattern: "\\b(\\d{1,2})/(\\d{1,3})(%?)"
    flags: "g"
    fraction_policy:
      special_denominators:
        "2":
          singular: "half"
          plural: "halves"
      percent_word: "percent"
      max_3digit_denominator: 100
    citations:
      - "DECtalk 4.63 l_us_pr1.c:980-1015 (ls_proc_is_frac)"
      - "DECtalk 4.63 l_us_pr1.c:1034-1069 (ls_proc_do_frac)"

  - name: expand_ordinals
    type: builtin
    handler: ordinalToWordsInline
    pattern: "\\b(\\d+)(?:st|nd|rd|th)\\b"
    flags: "gi"
    citations:
      - Allen, Hunnicutt & Klatt 1987 Ch.3

  # DECtalk-specific: read a bare 4-digit year before the generic cardinal step.
  # A token qualifies as a year iff it is exactly `min_digits` long, its first
  # digit is not '0', and its middle two digits are not both '0'. Tokens that do
  # NOT qualify (e.g. 2000, 2005) are left untouched and read as cardinals by
  # expand_numbers below. Citation: DECtalk 4.63 ls_util.c:598-622 (is_year),
  # l_us_pr1.c:367-398 (do_4_digits two-halves speaking; leading-zero half is
  # digit-spelled, e.g. 1905 -> "nineteen zero five").
  - name: expand_years
    type: builtin
    handler: readYearInline
    pattern: "\\b(\\d{4})\\b"
    flags: "g"
    year_policy:
      min_digits: 4
      reject_leading_zero: true
      reject_middle_00: true
    citations:
      - "DECtalk 4.63 ls_util.c:598-622 (ls_util_is_year)"
      - "DECtalk 4.63 l_us_pr1.c:367-398 (ls_proc_do_4_digits)"

  - name: expand_numbers
    type: builtin
    handler: numberToWordsInline
    pattern: "\\b(\\d+)\\b"
    flags: "g"
    # DECtalk's digit-group reader emits phundred immediately followed by pand
    # for a non-round hundreds group. Keep that phone-list constant as one
    # internal word so postlexical flapping does not treat "hundred" as
    # word-final before an ordinary lexical "and".
    number_policy:
      hundreds_remainder_compound_word: "hundredand"
    citations:
      - "DECtalk 4.63 l_us_pr1.c:422-440 (ls_proc_do_digit_group emits pand after non-round hundreds)"
      - "DECtalk 4.63 l_us_con.c:745-747,895-897 (phundred + pand phone-list constants)"
      - Allen, Hunnicutt & Klatt 1987 Ch.3

  - name: punctuation_cleanup
    type: builtin
    handler: punctuationCleanup
    description: >
      Protect lexical apostrophes, separate the selected frontend's
      transcription.punctuation_tokens, and strip remaining punctuation.
    punctuation_policy:
      preserved_character_pattern: "[\\w\\s]"
      strip_unlisted: true
      lexical_apostrophe:
        symbol: "'"
        word_character_pattern: "[a-z]"
        word_character_flags: "i"
        preserve_between_word_characters: true
        preserve_trailing_after_word_character: true
    citations:
      - Allen, Hunnicutt & Klatt 1987 Ch.3

  - name: collapse_whitespace
    type: regex_replace
    description: "Collapse whitespace and trim"
    rules:
      - pattern: "\\s+"
        replacement: " "
        flags: "g"
    post: trim
    citations:
      - Allen, Hunnicutt & Klatt 1987 Ch.3
