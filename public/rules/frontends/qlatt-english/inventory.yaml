  # the frontend clamped klsyn88 ~13 dB below its published reference level (the
  # "klsyn88 sounds quiet" defect) while klatt80-baseline is calibrated around
  # its own GO=47 default (ndbScale -47). Omitting GO lets each experiment use
  # its own semantics default: klatt80-baseline=47 (byte-identical/golden-safe),
  # klsyn88=60 (published g0; Klatt&Klatt 1990 / KLSYN88 manual Table I).
