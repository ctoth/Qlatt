version: v1

# Projection order preserves the original speaker/source operations.
# Sources: Fant 1997 Table 1; Gobl 2003; Klatt & Klatt 1990; Burkhardt 2009.
projection:
  - {field: source_mode, target_param: sourceMode, op: baseline_const, order: 1}
  - {field: rd, target_param: Rd, op: override_or_baseline, baseline_field: rd, order: 2}
  - {field: rd_ref, target_param: RdRef, op: baseline_const, order: 3}
  - {field: oq, target_param: OQ, op: override_if_set, order: 4}
  - {field: tl, target_param: TL, op: override_or_current_plus_baseline, baseline_field: spectral_tilt_offset_db, order: 5}
  - {field: ah_offset_db, target_param: AH, op: current_plus_override_if_set, order: 6}
  - {field: flutter, target_param: flutter, op: override_if_set, order: 7}
  - {field: jitter, target_param: jitter, op: override_if_set, order: 8}
  # Klatt & Klatt 1990 Tables VII/XII; values and citations belong to the preset.
  - {field: ftp, target_param: FTP, op: override_if_set, order: 9}
  - {field: ftz, target_param: FTZ, op: override_if_set, order: 10}
  - {field: btp, target_param: BTP, op: override_if_set, order: 11}
  - {field: btz, target_param: BTZ, op: override_if_set, order: 12}
  - {field: df1, target_param: DF1, op: override_if_set, order: 13}
  - {field: db1, target_param: DB1, op: override_if_set, order: 14}

# Canonical source contour policy for the current English frontend.
# Citations:
# - Fant 1997 Table 1
# - Gobl 2003
# - Klatt & Klatt 1990
# - Burkhardt 2009
citations:
  - Fant 1997 Table 1
  - Gobl 2003
  - Klatt & Klatt 1990
  - Burkhardt 2009

baseline:
  source_mode: 1
  citations:
    - Fant 1997 Table 1
    - Klatt & Klatt 1990

default_voice_quality: modal
voice_quality_presets:
  modal:
    rd: 0.7
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 0
    jitter: 0
    f0_scale: 1.0
    citations:
      - Fant 1997 Table 1
  breathy:
    rd: 2.0
    oq: 0
    tl: 24  # Klatt & Klatt 1990 speaker LK breathy setting
    # Table VII female second tracheal resonance medians; Table XII bandwidths.
    ftp: 1650
    ftz: 1800
    btp: 180
    btz: 180
    # Engineering estimates within Table XII ranges: moderate open-phase changes.
    df1: 50
    db1: 200
    ah_offset_db: 20
    flutter: 0
    jitter: 0
    f0_scale: 1.0
    citations:
      - Fant 1997 Table 1
      - Gobl 2003
      - Klatt & Klatt 1990
      - Klatt & Klatt 1990 Table VII and Table XII
  pressed:
    rd: 0.5
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 0
    jitter: 0
    f0_scale: 1.0
    citations:
      - Fant 1997 Table 1
  creaky:
    rd: 0.8
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 0
    # Engineering migration of Fraj control 20 at F0=110 Hz, Fs=44100 Hz:
    # CV% = control * 4.5 * sqrt(F0/Fs), rounded to 4.5%.
    jitter: 4.5
    f0_scale: 1.0
    citations:
      - Gobl 2003
      - Burkhardt 2009
      - Schoentgen 2001 Model II
      - Titze 1991 Eq. 10
  whispery:
    rd: 2.0
    oq: 0
    tl: 10
    ah_offset_db: 30
    flutter: 0
    # Same reference conversion as creaky: Fraj control 5 -> 1.125% CV.
    jitter: 1.125
    f0_scale: 1.0
    citations:
      - Gobl 2003
      - Schoentgen 2001 Model II
      - Titze 1991 Eq. 10
  falsetto:
    rd: 2.5
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 50
    jitter: 0
    f0_scale: 1.5
    citations:
      - Burkhardt 2009
      - Fant 1997 Table 1
