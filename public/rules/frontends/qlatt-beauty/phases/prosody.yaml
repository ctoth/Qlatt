version: v2-pierrehumbert
rules:
  # ==========================================================================
  # Pierrehumbert-Style Intonation Model
  #
  # Replaces the O'Shaughnessy 1976 exponential-declination F0 model with a
  # Pierrehumbert 1980 / Ladd 2008 pitch-range model using:
  #   - Accent-type-specific F0 targets (H*, L*, L+H*, L*+H, H+!H*, H*+L, H+L*, H*+H)
  #   - Iterative downstep (k^n) instead of global declination
  #   - ToBI-compatible initial boundary %H plus phrase accents (H-, L-) and boundary tones (L%, H%)
  #   - Register reset at IP boundaries (breakIndex >= 4)
  #
  # Citations:
  #   - Pierrehumbert 1980 (original pitch accent inventory, downstep formula, boundary tones)
  #   - Ladd 2008 (pitch range normalization, final lowering, sagging transitions)
  #   - Silverman et al. 1992 (break-index and edge-tone notation conventions)
  # ==========================================================================

  # Inherited from qlatt-english/phases/prosody.yaml (phased in pipeline.yaml, not defined here): tobi_baseline_init, tobi_initial_boundary_high, tobi_phrase_accent_high, tobi_phrase_accent_low, tobi_boundary_low, tobi_boundary_rise, tobi_register_reset, f0_voiceless_onset_perturbation, f0_voiced_onset_perturbation, f0_continuation_rise.

  # --------------------------------------------------------------------------
  # ToBI pitch accents. Each point selects its symbolic tone by realization role
  # and validates alignment within the associated syllable. Inline insertion (no by_point)
  # lets the leading-H accents (H+!H*, H+L*) read the previous accent's peak via
  # prev_point('F0Point').
  #
  # Interpretation note (unchanged): Ladd 2008 / Pierrehumbert 1980 treat final
  # lowering as a separate phrase-final effect; downstep is suppressed on the
  # nuclear accent only for the H*/H*+L families. The fall is carried by the
  # trailing tone / phrase accent, not by lowering the H* peak.
  # --------------------------------------------------------------------------
  tobi_accent:
    kind: point
    select:
      relation: Segment
      where: "assoc(current, 'tones').exists(t, t.starred)"
    define:
      accent_idx: "has(current.accentIndexInPhrase) && current.accentIndexInPhrase >= 0 ? current.accentIndexInPhrase : 0"
      # Nuclear suppression applies only to the H*/H*+L families; all others
      # downstep unconditionally (reduces to pow(downstep_k, accent_idx)).
      downstep_factor: >-
        ((current.accentType in ['H*', 'H*+L']) && has(current.isNuclearAccent) && current.isNuclearAccent == true)
        ? 1.0 : pow(params.policy.f0.downstep_k, accent_idx)
      clamped_height: >-
        max([params.policy.f0.h_star_height * downstep_factor, params.policy.f0.downstep_floor_fraction])
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * clamped_height
      low_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.l_star_height
      high_floor_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      prev_f0: prev_point('F0Point')
      lead_hz: >-
        prev_f0 == null ? high_floor_hz : max([prev_f0.value, high_floor_hz])
      # Yes/no-question final rise, realized on the accented final VOWEL because the
      # ToBI H-/H% tones live on the acoustically-silent boundary token.
      q_rise_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.question_rise_fraction
    insert_points:
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_star }, at: "at_ratio(current, 0.45)", value: target_hz, tag: f0_h_star }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_star_plus_l_peak }, at: "at_ratio(current, 0.45)", value: target_hz, tag: f0_h_star_plus_l_peak }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_star_plus_l_tail }, at: "at_sync(current.sync_right)", value: low_hz, tag: f0_h_star_plus_l_tail }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_l_leading }, at: "at_sync(current.sync_left)", value: low_hz, tag: f0_l_leading }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_l_plus_h_star }, at: "at_ratio(current, 0.45)", value: target_hz, tag: f0_l_plus_h_star }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_leading }, at: "at_sync(current.sync_left)", value: lead_hz, tag: f0_h_leading }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_plus_downstepped_h_star }, at: "at_ratio(current, 0.45)", value: target_hz, tag: f0_h_plus_downstepped_h_star }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_star_plus_h_peak }, at: "at_ratio(current, 0.45)", value: target_hz, tag: f0_h_star_plus_h_peak }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_star_plus_h_tail }, at: "at_sync(current.sync_right)", value: "max([target_hz, high_floor_hz])", tag: f0_h_star_plus_h_tail }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_plus_l_star_lead }, at: "at_sync(current.sync_left)", value: lead_hz, tag: f0_h_plus_l_star_lead }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_h_plus_l_star }, at: "at_ratio(current, 0.45)", value: low_hz, tag: f0_h_plus_l_star }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_l_star }, at: "at_ratio(current, 0.45)", value: low_hz, tag: f0_l_star }
      - { relation: F0Point, tone: { association: tones, bearer: tone_bearer, within: SylStructure, role: f0_l_star_plus_h }, at: "at_sync(current.sync_right)", value: high_floor_hz, tag: f0_l_star_plus_h }
      # Question final rise on the accented vowel that precedes an H% IP boundary
      # (within the last few segments). Last entry => last-wins at sync_right so it
      # supersedes any lower boundary target on this token. Also stamped mid-vowel
      # so the rise climbs through the nucleus rather than jumping at the edge.
      - { relation: F0Point, when: "(next != null && next.phoneme == 'SIL' && get(next, 'boundaryTone', null) == 'H%') || (ahead(current, 2) != null && ahead(current, 2).phoneme == 'SIL' && get(ahead(current, 2), 'boundaryTone', null) == 'H%') || (ahead(current, 3) != null && ahead(current, 3).phoneme == 'SIL' && get(ahead(current, 3), 'boundaryTone', null) == 'H%')", at: "at_ratio(current, 0.3)", value: low_hz, tag: f0_question_rise_onset }
      - { relation: F0Point, when: "(next != null && next.phoneme == 'SIL' && get(next, 'boundaryTone', null) == 'H%') || (ahead(current, 2) != null && ahead(current, 2).phoneme == 'SIL' && get(ahead(current, 2), 'boundaryTone', null) == 'H%') || (ahead(current, 3) != null && ahead(current, 3).phoneme == 'SIL' && get(ahead(current, 3), 'boundaryTone', null) == 'H%')", at: "at_ratio(current, 0.65)", value: q_rise_hz, tag: f0_question_final_rise }
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"
      - "O'Shaughnessy 1976"

  # Rule 15: Unaccented voiced interpolation anchor
  # --------------------------------------------------------------------------
  tobi_unaccented_declination:
    kind: point
    select:
      relation: Segment
      where: >-
        current.phoneme != 'SIL'
        && (has(current.isAccented) ? current.isAccented != true : true)
        && has_voiced_formants(current)
    define:
      prev_f0: prev_point('F0Point')
      base: params.policy.f0.base_hz
      fallback: "prev_f0 == null ? base : prev_f0.value"
      decl_target: >-
        max([fallback * 0.98, base])
      # --- Intrinsic vowel pitch (segmental micro-prosody; THE aliveness overlay) ---
      # High vowels (/iy/,/ih/,/uw/,/uh/) ride higher than low vowels (/aa/,/ae/,/ah/).
      # O'Shaughnessy 1976; Ladd 1985 (+0.5 st /i/, -1.0 st /a/). A small per-vowel
      # nudge of the declination anchor — what makes a contour sound spoken not drawn.
      intrinsic_offset: >-
        (has(current.hi) && current.hi == true)
          ? params.policy.f0.intrinsic_pitch_high_hz
          : ((has(current.low) && current.low == true)
              ? params.policy.f0.intrinsic_pitch_low_hz
              : params.policy.f0.intrinsic_pitch_mid_hz)
      # --- Boundary-tone realization on the final VOICED vowel ---
      # ToBI boundary tones live on the trailing-silence token, which is acoustically
      # silent. A deaccented nuclear vowel therefore drops to baseline and the
      # yes/no-question rise (H%) is never phonated. Detect an upcoming H%/L% IP
      # boundary within the last few segments and shape THIS vowel's tail so the
      # rise (question) or final-lowering (statement) is actually heard.
      # Only a silence that stands for a punctuation mark has a boundary tone
      # (assign_phrase_edge_tones); a silence inside a word has none (the
      # letter-to-sound rules speak a lone "_" as one), so the tone is read
      # with a default.
      pre_h_pct: >-
        (next != null && next.phoneme == 'SIL' && get(next, 'boundaryTone', null) == 'H%')
        || (ahead(current, 2) != null && ahead(current, 2).phoneme == 'SIL' && get(ahead(current, 2), 'boundaryTone', null) == 'H%')
        || (ahead(current, 3) != null && ahead(current, 3).phoneme == 'SIL' && get(ahead(current, 3), 'boundaryTone', null) == 'H%')
      pre_l_pct: >-
        (next != null && next.phoneme == 'SIL' && get(next, 'boundaryTone', null) == 'L%')
        || (ahead(current, 2) != null && ahead(current, 2).phoneme == 'SIL' && get(ahead(current, 2), 'boundaryTone', null) == 'L%')
        || (ahead(current, 3) != null && ahead(current, 3).phoneme == 'SIL' && get(ahead(current, 3), 'boundaryTone', null) == 'L%')
      # Yes/no-question final rise, near the top of the range (Pierrehumbert 1980 H-H%).
      rise_target: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.question_rise_fraction
      # Statement final lowering: dip below the floor for spoken finality (Ladd 2008).
      final_low_target: >-
        max([params.policy.f0.base_hz - params.policy.f0.range_hz * params.policy.f0.final_lowering_pull,
             params.policy.f0.base_hz * params.policy.f0.intrinsic_floor_fraction])
      # Normal unaccented anchor with the intrinsic overlay, clamped to stay voiced.
      body_target: >-
        max([decl_target + intrinsic_offset,
             params.policy.f0.base_hz * params.policy.f0.intrinsic_floor_fraction])
      target: "pre_h_pct ? rise_target : (pre_l_pct ? final_low_target : body_target)"
    insert_point:
      relation: F0Point
      at: at_sync(current.sync_right)
      value: target
      tag: f0_unaccented
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"
      - "O'Shaughnessy 1976 (intrinsic vowel pitch; boundary-tone realization on the final sonorant)"
      - "Ladd 1985 (intrinsic vowel pitch offsets)"

  # --------------------------------------------------------------------------
  # Rule 25: Connected-speech source contour (Fant 1997)
  #
  # Applies phrase-local Ee source shaping on voiced segments:
  # - slight onset rise
  # - slow declination
  # - stronger final-window fall
  #
  # Owns the EePhraseDb (Ee/loudness) contour only. Phrase-final Rd softening
  # (breathiness) is owned SOLELY by the voice-quality phase's phrase_rd_contour
  # rule (RdPhraseOffset) — see voice-quality.yaml. This rule formerly also
  # op-added a small (<=~0.06) phrase-final term into RdPhraseOffset, which
  # double-tuned phrase-final breathiness on two axes; that add is removed so the
  # Rd phrase contour has a single owner (TRACK PROS/VQ reconciliation).
  # --------------------------------------------------------------------------
  connected_speech_source_contour:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme != 'SIL'
        && has_voiced_formants(current)
    contour:
      domain: phrase
      # Silverman et al. 1992 ToBI: BI=3 marks intermediate phrase boundaries.
      reset_break_index: 3
      apply:
        - field: EePhraseDb
          op: add
          value: ee_total_db
          tag: source_contour
    define:
      onset_rise_db: >-
        contour.elapsed_sec < params.policy.source_contour.ee_onset_rise_sec
        ? -params.policy.source_contour.ee_onset_rise_db
          * (1.0 - contour.elapsed_sec / params.policy.source_contour.ee_onset_rise_sec)
        : 0.0
      declination_db: >-
        -params.policy.source_contour.ee_declination_db_per_sec * contour.elapsed_sec
      final_window_sec: >-
        min([
          params.policy.source_contour.ee_final_window_max_sec,
          max([
            params.policy.source_contour.ee_final_window_min_sec,
            contour.phrase_duration_sec * params.policy.source_contour.ee_final_window_ratio
          ])
        ])
      final_window_start_sec: >-
        max([
          params.policy.source_contour.ee_onset_rise_sec,
          contour.phrase_duration_sec - final_window_sec
        ])
      final_fall_db: >-
        contour.elapsed_sec > final_window_start_sec
        ? -(params.policy.source_contour.ee_final_fall_db_per_sec
            - params.policy.source_contour.ee_declination_db_per_sec)
          * (contour.elapsed_sec - final_window_start_sec)
        : 0.0
      ee_total_db: >-
        onset_rise_db + declination_db + final_fall_db
    citations:
      - Fant 1997
      - Hanson et al. 2001
      - Silverman et al. 1992
      - "Engineering estimate: conservative qlatt contour magnitudes for stable long-phrase loudness"

  # --------------------------------------------------------------------------
  # Rule 26: Spectral tilt reduction for stressed vowels
  #
  # Stressed vowels have flatter spectral tilt (lower TL), reflecting
  # increased vocal effort. Sluijter & van Heuven 1996 showed spectral
  # tilt is a primary acoustic correlate of linguistic stress, more
  # reliable than F0 or intensity alone.
  # --------------------------------------------------------------------------
  stress_spectral_tilt:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'vowel' && has(current.stress) && current.stress >= 1"
    apply:
      - field: TL
        op: add
        value: "-(params.policy.effort.stress_tilt_reduction_db)"
        tag: stress
    citations:
      - "Sluijter & van Heuven 1996"
