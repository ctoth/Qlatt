version: v1

# Projection order preserves the original speaker/source operations.
# Sources: Fant 1997 Table 1; Gobl 2003; Klatt & Klatt 1990; Burkhardt 2009.
projection:
  - {field: source_mode, target_param: sourceMode, op: baseline_const, order: 1}
  - {field: rd, target_param: Rd, op: override_or_baseline, baseline_field: rd, order: 2}
  - {field: rd_ref, target_param: RdRef, op: baseline_const, order: 3}
  - {field: oq, target_param: OQ, op: override_if_set, order: 4}
  - {field: tl, target_param: TL, op: override_or_current_plus_baseline, baseline_field: spectral_tilt_offset_db, order: 5}
  - {field: ah_offset_db, target_param: AH, op: current_plus_override_if_set, order: 6}
  - {field: flutter, target_param: flutter, op: override_if_set, order: 7}
  - {field: jitter, target_param: jitter, op: override_if_set, order: 8}

# DECtalk-specific source contour. Unlike the shared qlatt-english contour
# (/rules/policy/source-contour.yaml, source_mode: 1 = LF glottal source), this
# frontend keeps the browser-audible impulse fallback as the default while the
# KLGLOTT88 runtime worklet is blocked.
#
# DECtalk's actual voicing source is KLGLOTT88 — a differentiated parabolic pulse
# (at²−bt³) generated at 4x sample rate and 2-pole decimated, with internal
# spectral tilt and open-phase breathiness (DECtalk 4.63 VTM/vtm3.c). The current
# mode 3 runtime path receives valid F0/AV/source controls, but source telemetry
# shows klglottSource.voiceRms is effectively zero while noiseRms is large. That
# leaves only /h/ hiss and release energy audible, so source_mode 0 remains the
# default until the worklet voice-output bug is fixed.
#
# Citations:
# - Klatt & Klatt 1990 (KLGLOTT88 voicing source)
# - DECtalk 4.63 VTM/vtm3.c (KLGLOTT88 4x-oversampled glottal source)
# - klsyn88 parwv.c (natural source coefficients)
citations:
  - Klatt & Klatt 1990
  - DECtalk 4.63 VTM/vtm3.c KLGLOTT88 source

baseline:
  # KLGLOTT88 is the DECtalk VTM source, but mode 3 is not yet the runtime
  # default because its worklet voice output is silent. Keep mode 0 as the
  # browser-audible fallback until that source-output bug is fixed.
  source_mode: 0
  citations:
    - Klatt & Klatt 1990 (KLGLOTT88 voicing source)
    - "DECtalk 4.63 VTM/vtm3.c: KLGLOTT88 oversampled glottal source (the real DECtalk source)"

# Voice-quality presets carried over from the shared contour so the
# `voiceQuality` option still resolves. Rd-based shaping has limited effect on
# the impulse fallback, but TL/flutter/jitter remain meaningful for mode 3.
default_voice_quality: modal
voice_quality_presets:
  modal:
    rd: 0.7
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 0
    jitter: 0
    f0_scale: 1.0
    citations:
      - Fant 1997 Table 1
  breathy:
    rd: 2.0
    oq: 0
    tl: 0
    ah_offset_db: 20
    flutter: 0
    jitter: 0
    f0_scale: 1.0
    citations:
      - Fant 1997 Table 1
      - Gobl 2003
      - Klatt & Klatt 1990
  pressed:
    rd: 0.5
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 0
    jitter: 0
    f0_scale: 1.0
    citations:
      - Fant 1997 Table 1
  creaky:
    rd: 0.8
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 0
    # Engineering Fraj-control migration at 110 Hz / 44100 Hz (see source-perturbation.md).
    jitter: 4.5
    f0_scale: 1.0
    citations:
      - Gobl 2003
      - Burkhardt 2009
      - Schoentgen 2001 Model II
      - Titze 1991 Eq. 10
  whispery:
    rd: 2.0
    oq: 0
    tl: 10
    ah_offset_db: 30
    flutter: 0
    # Engineering Fraj-control migration at 110 Hz / 44100 Hz.
    jitter: 1.125
    f0_scale: 1.0
    citations:
      - Gobl 2003
      - Schoentgen 2001 Model II
      - Titze 1991 Eq. 10
  falsetto:
    rd: 2.5
    oq: 0
    tl: 0
    ah_offset_db: 0
    flutter: 50
    jitter: 0
    f0_scale: 1.5
    citations:
      - Burkhardt 2009
      - Fant 1997 Table 1
