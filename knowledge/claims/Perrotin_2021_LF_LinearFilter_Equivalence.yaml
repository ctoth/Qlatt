- id: claim2007
  type: equation
  expression: '\begin{cases}

    R_a = (-1 + 4.8 R_d) / 100 \\

    R_k = (22.4 + 11.8 R_d) / 100 \\

    R_g = \frac{R_k(0.5 + 1.2 R_k)}{0.44 R_d - 4 R_a(0.5 + 1.2 R_k)}

    \end{cases}

    \Rightarrow

    \begin{cases}

    O_q = \frac{1 + R_k}{2 R_g} \\

    \alpha_m = \frac{1}{1 + R_k} \\

    T_a = R_a T_0

    \end{cases}'
  variables:
  - symbol: R_a
    concept: r_a
  - symbol: R_d
    concept: r_d
  - symbol: R_k
    concept: r_k
  - symbol: R_g
    concept: r_g
  - symbol: O_q
    concept: o_q
  - symbol: T_a
    concept: t_a
  - symbol: T_0
    concept: t_0
  - symbol: cases
    concept: cases
  - symbol: Rightarrow
    concept: rightarrow
  - symbol: alpha_m
    concept: alpha_m
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim2008
  type: equation
  expression: '\begin{cases}

    F_g = \frac{1}{2 O_q T_0} \\

    B_g = \frac{1}{O_q T_0 \tan(\pi(1-\alpha_m))} \\

    A_g = E

    \end{cases}'
  variables:
