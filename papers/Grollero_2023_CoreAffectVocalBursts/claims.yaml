claims:
- id: claim1
  type: equation
  expression: $$\text{PAQ}_{\text{valence}} = -5.85 + 1.18 \cdot \text{CA}_{\text{valence}}
    \quad (R^2_{\text{adj}} = 0.71, \text{Study 2})$$
  provenance:
    paper: Grollero_2023_CoreAffectVocalBursts
    page: 0
- id: claim2
  type: observation
  statement: Arousal ratings for vocal bursts should follow a quadratic (V-shaped)
    function of valence, with minimum arousal near neutral valence (50 on 0-100 scale)
  concepts: []
  provenance:
    paper: Grollero_2023_CoreAffectVocalBursts
    page: 0
- id: claim3
  type: observation
  statement: The quadratic model should explain more variance than a linear model
    for the valence-arousal relationship in vocal bursts
  concepts: []
  provenance:
    paper: Grollero_2023_CoreAffectVocalBursts
    page: 0
- id: claim4
  type: observation
  statement: PAQ ratings should be systematically more extreme than CA ratings (regression
    slope > 1.0)
  concepts: []
  provenance:
    paper: Grollero_2023_CoreAffectVocalBursts
    page: 0
- id: claim5
  type: observation
  statement: PAQ ratings should show lower between-participant coefficient of variation
    than CA ratings
  concepts: []
  provenance:
    paper: Grollero_2023_CoreAffectVocalBursts
    page: 0
- id: claim6
  type: observation
  statement: Stimuli with high between-participant variance in valence (ambiguous)
