version: v1
rules:
  # ==========================================================================
  # DECtalk Hat-Pattern F0 Model (Klatt 1982)
  #
  # Generates F0 layer commands for the layered additive F0 engine.
  # Four components:
  #   1. Baseline declination (profile layer) -- 17-point integer source recurrence
  #   2. Hat rise (persistent/hat layer) -- STEP at first stressed vowel
  #   3. Stress impulses (impulse/stress layer) -- at each stressed vowel
  #   4. Boundary reset (persistent/hat layer) -- reset at SIL boundaries
  #
  # All values are in DECtalk internal units (Hz*10).  Speaker scaling in
  # renderLayeredF0() converts to final Hz via the DECtalk formula:
  #   Hz = (f0minimum + frac4mul(total - 1300, f0scalefac)) / 10
  #
  # Citations:
  #   - Klatt 1982 "The KLATTalk text-to-speech conversion system"
  #   - DECtalk 4.63 ph_inton1.c (hat-pattern command generation)
  #   - DECtalk 4.63 Ph_drwt02.c (baseline profiles, frame-level realization)
  #   - Fujisaki, H. "Information, Prosody, and Modeling" (additive F0 layers)
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Rule 1: Baseline Declination Profile (long declaratives)
  #
  # Fires at the first phoneme of each phrase (first non-SIL after SIL, or
  # the very first phoneme).  Inserts a 17-point piecewise-linear profile
  # into the baseline layer that spans the entire utterance duration.
  #
  # Source: Ph_drwt02.c f0basetypes[0][] (declarative clause type,
  # number_words > 3).
  # Values are in DECtalk internal units (Hz*10); speaker scaling converts
  # to final Hz.
  #
  # Citations:
  #   - DECtalk 4.63 Ph_drwt02.c (17-point baseline profile)
  #   - Klatt 1982 (declination as baseline component)
  # --------------------------------------------------------------------------
  #
  # Which of the five baselines a clause gets is decided where pht0draw starts
  # the clause (Ph_drwt02.c:1657-1700) from the clause's closing mark
  # (clausetype, ph_sort.c:1513-1567) and its word count:
  #   period:       f0basetypes[0] with more than 3 words, else [4]
  #   comma:        [1]
  #   exclamation:  [0] with more than 2 words, else [2]
  #   question:     [3]
  # The tables are the ENGLISH_US block, Ph_drwt02.c:1293-1392.
  #
  # number_words is counted once for each clause, on its first phone; the
  # rules below read it there.
  dectalk_clause_number_words:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    apply:
      - field: number_words
        op: set
        # One for each word that comes in with a word boundary; a verb-phrase
        # start replaces that boundary, so its word is not counted, except the
        # clause's first word. A clause-final "to", "and" or "for" has two
        # boundaries and counts twice.
        value: >-
          (dectalk_word_start(current) ? 1.0 : 0.0)
          + count_ahead_pred(current, 1000, 'is_clause_silence', 'is_number_word_start')
          + (dectalk_phrase_state(current) == 'word' ? 1.0 : 0.0)
          + count_ahead_pred(current, 1000, 'is_clause_silence', 'is_twice_counted_word_start')
        tag: boundary
    citations:
      - "DECtalk 4.63 ph_sort.c:439-441, 1462-1464 (number_words: reset for a clause, one more at each WBOUND)"
      - "DECtalk 4.63 ph_sort.c:1055-1070 (a clause-final PPSTART becomes a second WBOUND)"
  dectalk_baseline_declination:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: &baseline_clause
      clause_end: >-
        look_ahead_where(current, 1000,
          'candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null')
      mark: "clause_end == null ? '.' : clause_end.punctuationSymbol"
      # number_words, as dectalk_clause_number_words counted it.
      words: "get(current, 'number_words', 0.0)"
      # pht0draw is two routines, one for each sex (Ph_drwt02.c:771, 2445).
      male: "params.policy.voice.sex == 'male'"
      comma: "mark in [',', ';', ':']"
      # dcommacnt (Ph_drwt02.c:3231-3256): comma clauses since the last clause
      # that ended otherwise. This is the first when the clause before it did
      # not end in a comma.
      first_comma: >-
        !(prev != null && get(prev, 'punctuationSymbol', '') in [',', ';', ':'])
    constraint: >-
      male && ((mark == '.' && words > params.policy.f0.baseline_long_declarative_words)
      || (mark == '!' && words > params.policy.f0.baseline_long_exclamation_words))
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points:
        - 1157
        - 1145
        - 1139
        - 1127
        - 1113
        - 1109
        - 1095
        - 1082
        - 1079
        - 1065
        - 1053
        - 1040
        - 1038
        - 1024
        - 980
        - 952
        - 863
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c f0basetypes[0][] (declarative baseline, number_words > 3)"
      - "Klatt 1982 (baseline declination component)"

  # --------------------------------------------------------------------------
  # Rule 1b: Short Declarative Baseline
  #
  # DECtalk uses a separate, flatter profile for declarative clauses with one
  # to three words: clausetype 0 selects f0basetypes[4][] when number_words <= 3.
  # --------------------------------------------------------------------------
  dectalk_short_declarative_baseline_declination:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: "male && mark == '.' && words <= params.policy.f0.baseline_long_declarative_words"
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points:
        - 1160
        - 1150
        - 1140
        - 1152
        - 1132
        - 1140
        - 1130
        - 1124
        - 1110
        - 1100
        - 1080
        - 1060
        - 1040
        - 1020
        - 980
        - 960
        - 950
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c f0basetypes[4][] (short declarative baseline, number_words <= 3)"
      - "Klatt 1982 (baseline declination component)"

  # A clause that ends in a comma (clausetype COMMACLAUSE). DECtalk's text
  # stage sends a semicolon and a colon to the phonetic stage as commas, as
  # dectalk_pause_duration assumes; that is not re-verified here.
  dectalk_comma_baseline:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: "male && comma"
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points: [1157, 1145, 1139, 1127, 1113, 1109, 1085, 1062, 1049, 1035, 1023, 1015, 1005, 1010, 1057, 1124, 1040]
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:1335-1352 f0basetypes[1][] (comma clause)"
      - "DECtalk 4.63 Ph_drwt02.c:1669-1681 (clausetype 1 selects f0basetypes[1])"

  # An exclamation of one or two words. The source writes each entry as a
  # value plus 50 (1057+50, 1085+50, ...); the sums are given here.
  dectalk_short_exclamation_baseline:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: "male && mark == '!' && words <= params.policy.f0.baseline_long_exclamation_words"
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points: [1107, 1135, 1159, 1167, 1163, 1199, 1145, 1132, 1129, 1115, 1103, 1090, 1088, 1074, 1030, 902, 893]
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:1354-1373 f0basetypes[2][] (exclamatory clause)"
      - "DECtalk 4.63 Ph_drwt02.c:1683-1692 (clausetype 2: f0basetypes[2] unless number_words > 2)"

  dectalk_question_baseline:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: "male && mark == '?'"
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points: [1187, 1165, 1139, 1127, 1113, 1109, 1095, 1082, 1079, 1065, 1053, 940, 938, 924, 1010, 1014, 1018]
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:1375-1391 f0basetypes[3][] (question)"
      - "DECtalk 4.63 Ph_drwt02.c:1695-1699 (clausetype 3 selects f0basetypes[3])"

  # --------------------------------------------------------------------------
  # The baselines of a female voice: the second copy of pht0draw
  # (Ph_drwt02.c:2445 on) fills f0basetypes with other numbers (2462-2556)
  # and chooses among them otherwise (3223-3257):
  #   period:       [0] whatever the word count
  #   comma:        [1] for the first comma clause in a row, unless it has more
  #                 than 4 words; [0] for that one and for the later ones
  #   exclamation:  [0] with more than 2 words, else [2]
  #   question:     [3]
  # Rows 0, 2 and 3 hold the same seventeen numbers.
  #
  # Each list below has an eighteenth number. The female copy steps its
  # baseline counter while `basecntr <= 15` (3530; the male copy has 14,
  # 2013), so at the clause's end it reads f0baseline[17], one past the row:
  # in f0basetypes[5][17] (ph_data.h:863) that is the next row's first number.
  # --------------------------------------------------------------------------
  dectalk_female_baseline_declination:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: >-
      !male && (mark == '.' || mark == '!'
        || (comma && (!first_comma || words > params.policy.f0.baseline_long_comma_words)))
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points: [1887, 1865, 1839, 1827, 1813, 1809, 1795, 1782, 1779, 1765, 1763, 1750, 1748, 1734, 1720, 1714, 1708, 1887]
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:2462-2478, 2501-2517 f0basetypes[0][] and [2][] (female; the same numbers)"
      - "DECtalk 4.63 Ph_drwt02.c:2482, 2520 (f0basetypes[1][0] and [3][0], read as f0baseline[17])"
      - "DECtalk 4.63 Ph_drwt02.c:3223-3252 (clausetype 0, 1 and 2 in the female routine)"
      - "DECtalk 4.63 Ph_drwt02.c:3530 (basecntr <= 15)"

  dectalk_female_comma_baseline:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: >-
      !male && comma && first_comma && words <= params.policy.f0.baseline_long_comma_words
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points: [1887, 1865, 1839, 1827, 1813, 1809, 1785, 1762, 1749, 1725, 1703, 1710, 1718, 1764, 1810, 1864, 1928, 1887]
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:2482-2498 f0basetypes[1][] (female comma clause)"
      - "DECtalk 4.63 Ph_drwt02.c:2501 (f0basetypes[2][0], read as f0baseline[17])"
      - "DECtalk 4.63 Ph_drwt02.c:3233-3242 (dcommacnt == 1 selects f0basetypes[1] unless number_words > 4)"
      - "DECtalk 4.63 Ph_drwt02.c:3530 (basecntr <= 15)"

  dectalk_female_question_baseline:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: "!male && mark == '?'"
    insert:
      relation: PhraseCommand
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points: [1887, 1865, 1839, 1827, 1813, 1809, 1795, 1782, 1779, 1765, 1763, 1750, 1748, 1734, 1720, 1714, 1708, 1890]
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:2520-2536 f0basetypes[3][] (female question)"
      - "DECtalk 4.63 Ph_drwt02.c:2540 (f0basetypes[4][0], read as f0baseline[17])"
      - "DECtalk 4.63 Ph_drwt02.c:3253-3257 (clausetype 3 selects f0basetypes[3])"
      - "DECtalk 4.63 Ph_drwt02.c:3530 (basecntr <= 15)"

  # The female routine scales an exclamation's F0 over a wider range:
  #   f0prime = f0minimum + frac4mul(f0prime - 2100, f0scalefac + 500)
  # (Ph_drwt02.c:3805-3808). The male routine has no such case (2306-2312).
  dectalk_female_exclamation_range:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
    define: *baseline_clause
    constraint: "!male && mark == '!'"
    insert:
      relation: PhraseCommand
      layer: range
      at: at_sync(current.sync_left)
      value: params.policy.f0.exclamation_range_added
      tag: f0_exclamation_range
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:3805-3808 (clausetype 2: f0scalefac + 500 in the female routine)"

  # --------------------------------------------------------------------------
  # The F0 floor around a clause break the text stage inserts. This is a
  # defect of DECtalk 4.63 that its output depends on, reproduced as it is.
  #
  # LTS/ls_util.c:829-837 means to shorten the comma pause of such a break:
  #   pause = pDph_t->compause;  pDph_t->compause = -12;
  #   <send the COMMA: the clause before the break is spoken here>
  #   pDph_t->compause = pause;
  # but the field it reaches is the phonetic stage's f0minimum (an
  # instrumented build prints 1100, Paul's floor, for that "compause", and
  # -12 for f0minimum in the clause spoken meanwhile). The first clause of a
  # run loads the voice when it starts, which puts its floor right again. So:
  #   - a clause that ends at an inserted break, other than the run's first,
  #     is spoken with a floor of -12;
  #   - if the run's first clause ended at one, the value saved and put back
  #     was the floor before any voice was loaded, 0, and every later clause
  #     has that (or -12, as above).
  # With such a floor F0 comes out at pht0draw's lower clamp, 50 Hz, wherever
  # the scaled contour is below it (Ph_drwt02.c:2312-2324).
  # DECtalk's packets are recorded one phrase to a process; in a process that
  # has already spoken, the saved value is the voice's floor and only the
  # first case arises.
  # --------------------------------------------------------------------------
  dectalk_break_f0_floor:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != "SIL" && prev != null && prev.phoneme == "SIL"
        && get(prev, "punctuationSymbol", null) != null
    define:
      clause_end: >-
        look_ahead_where(current, 1000,
          'candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null')
      after: "clause_end == null ? null : ahead(clause_end, 1)"
      ends_at_break: >-
        after != null && after.phoneme != 'SIL'
        && isTrue(path(after, 'R:SylStructure.parent.parent'), 'clause_break_before')
      # Whether the run's first clause ended at an inserted break: this is the
      # second clause and starts after one, or an earlier clause was that.
      first_clause_broke: >-
        (isTrue(path(current, 'R:SylStructure.parent.parent'), 'clause_break_before')
          && count_back_pred(current, 1000, 'is_never', 'is_clause_silence') == 1.0)
        || count_back_pred(current, 1000, 'is_never', 'is_first_clause_break_start') > 0.0
      # Each case has its switch in policy; the second is what say.exe does
      # as a fresh process.
      in_break_clause: "ends_at_break && params.policy.f0.break_floor_applies"
      after_first_break: "first_clause_broke && params.policy.f0.unloaded_floor_applies"
    constraint: in_break_clause || after_first_break
    insert:
      relation: PhraseCommand
      layer: floor
      at: at_sync(current.sync_left)
      value: "in_break_clause ? params.policy.f0.break_floor : params.policy.f0.unloaded_floor"
      tag: f0_break_floor
    citations:
      - "DECtalk 4.63 LTS/ls_util.c:829-837, 842-849 (compause saved, set to -12 and restored around the break's COMMA)"
      - "DECtalk 4.63 PH/ph_data.h:841-851 (f0minimum three shorts before compause)"
      - "DECtalk 4.63 PH/ph_vset.c:683 (f0minimum is set when a voice is loaded)"
      - "DECtalk 4.63 PH/Ph_drwt02.c:2312-2324 (f0prime = f0minimum + ...; clamped to LOWEST_F0)"

  # --------------------------------------------------------------------------
  # Rule 1 (Ph_inton2.c:809-908): the hat rise, a STEP at the syllabic that
  # carries FHAT_BEGINS, unless phinton's walk has stopped at or before it
  # (annotation.yaml, dectalk_intonation_stops).
  #
  #   hatsize = size_hat_rise, +15 past the tenth allophone, +70 on the first
  #             or second allophone (820-833);
  #   delay   = -2 frames, or half the frames of allophone `gesture_ref` when
  #             that is past the second (854-861). gesture_ref is the previous
  #             allophone when it is FSON1; otherwise the routine keeps the
  #             one an earlier rise of the clause set (849-852).
  #
  # A command's time is its allophone's start, less the six frames the routine
  # starts its clock at (cumdur = -6, :488), plus the delay.
  # --------------------------------------------------------------------------
  dectalk_hat_rise:
    kind: f0_layer
    select:
      relation: Segment
      where: { predicate: is_dectalk_syllabic }
    define:
      stopped_at: >-
        look_back_where(current, 1000,
          '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null) || isTrue(candidate, "intonation_stops")')
      reached: >-
        !isTrue(current, 'intonation_stops') && (stopped_at == null || stopped_at.phoneme == 'SIL')
      position: "1.0 + count_back_pred(current, 1000, 'is_clause_silence', 'is_dectalk_phone')"
      la: dectalk_prev(current)
      # gesture_ref (Ph_inton2.c:460, 849-852): the allophone before this
      # syllabic when it is FSON1; otherwise the one the clause's last hat rise
      # set, and 0 when none has.
      ref_syllabic: >-
        la != null && dectalk_has(la, 'son1') ? current
        : (count_back_pred(current, 1000, 'is_clause_silence', 'is_hat_rise_reference') > 0.0
           ? look_back_pred(current, 1000, 'is_hat_rise_reference') : null)
      ref_la: "ref_syllabic == null ? null : dectalk_prev(ref_syllabic)"
      gesture_ref: >-
        ref_syllabic == null ? 0.0
        : count_back_pred(ref_syllabic, 1000, 'is_clause_silence', 'is_dectalk_phone')
      delay_frames: >-
        gesture_ref <= params.policy.f0.hat_rise_early_through_allophone
        ? -params.policy.f0.hat_rise_early_frames
        : floor(get(ref_la, 'timing_frames', 0.0) / params.policy.f0.hat_rise_delay_divisor)
      rise_hz: >-
        params.policy.voice.hat_rise_hz10
        + (position > params.policy.f0.hat_late_after_allophone ? params.policy.f0.hat_late_bonus_hz : 0.0)
        + (position <= params.policy.f0.hat_first_syllable_through_allophone ? params.policy.f0.hat_first_syllable_bonus_hz : 0.0)
    constraint: "reached && isTrue(current, 'hat_begins')"
    insert:
      relation: Tilt
      layer: hat
      at: >-
        at_offset(current.sync_left,
          (delay_frames - params.policy.f0.command_clock_lead_frames) * params.policy.f0.segmental.frame_ms)
      value: rise_hz
      # A STEP has no length of its own; this is the descriptor's.
      duration_frames: params.policy.f0.hat_rise_glide_frames
      tag: f0_hat_rise
    citations:
      - "DECtalk 4.63 Ph_inton2.c:809-908 Rule 1 (STEP of size_hat_rise, +15 when nphon > 10, +70 when nphon <= 2; delay -2 or allodurs[gesture_ref] >> 1)"
      - "DECtalk 4.63 Ph_inton2.c:488 (cumdur starts at -6)"
      - "DECtalk 4.63 ph_inton1.c:1857-1902 make_f0_command (the copy at Ph_inton2.c:1753-1791 is under #if 0)"
      - "Klatt 1982 (hat rise at first accent in phrase)"

  # --------------------------------------------------------------------------
  # Rule 4 (Ph_inton2.c:1218-1300): the question gestures.
  #
  # On the syllabic whose rime stands before a question mark (FBOUNDARY ==
  # FQUENEXT), stressed or not, phinton issues two IMPULSE commands:
  #   one word:   F0_QGesture1 at -5 frames, length 15;
  #               F0_QGesture2 - 100 at the syllabic's end, length 24
  #   otherwise:  F0_QGesture1 at -6 frames, length 15;
  #               F0_QGesture2 at (allodurs >> 2) - 4, length 20
  # They are IMPULSEs like the stress impulse and go on its layer: DECtalk
  # keeps one impulse at a time (Ph_drwt02.c:1908-1957), so each replaces the
  # one before it.
  #
  # The same block's comma gestures (1272-1297) are the `else` of
  # `if (lang_curr != LANG_german)` at 1251: English never issues them.
  # Each f0_layer rule inserts one command, so the pair is two rules.
  # --------------------------------------------------------------------------
  dectalk_question_dip:
    kind: f0_layer
    select: &question_syllabic
      relation: Segment
      # The syllabic before a question mark; tested here so that nothing
      # else is worked out for the other syllabics.
      where: >-
        (current.type == 'vowel' || current.phoneme in ['EL', 'EM', 'EN'])
        && get(current, 'rime_boundary', '') == 'question'
    define: &question_gesture
      stopped_at: >-
        look_back_where(current, 1000,
          '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null) || isTrue(candidate, "intonation_stops")')
      reached: >-
        !isTrue(current, 'intonation_stops') && (stopped_at == null || stopped_at.phoneme == 'SIL')
      # number_words == 1, counted as the baseline rules count it.
      one_word: >-
        (dectalk_word_start(current)
          && (dectalk_phrase_start(current) != 'vp' || prev == null || prev.phoneme == 'SIL')
          ? 1.0 : 0.0)
        + count_back_pred(current, 1000, 'is_clause_silence', 'is_number_word_start')
        + count_ahead_pred(current, 1000, 'is_clause_silence', 'is_number_word_start')
        + (dectalk_word_start(current) && dectalk_phrase_state(current) == 'word' ? 1.0 : 0.0)
        + count_back_pred(current, 1000, 'is_clause_silence', 'is_twice_counted_word_start')
        + count_ahead_pred(current, 1000, 'is_clause_silence', 'is_twice_counted_word_start') == 1.0
      frames: "get(current, 'timing_frames', 0.0)"
      stress_now: "get(current, 'stress', 0)"
      # The commands issued before these on the same syllabic (Rules 1 and 2):
      # make_f0_command lets neither gesture start before them
      # (ph_inton1.c:1880-1883).
      position: "1.0 + count_back_pred(current, 1000, 'is_clause_silence', 'is_dectalk_phone')"
      la: dectalk_prev(current)
      # gesture_ref (Ph_inton2.c:460, 849-852): the allophone before this
      # syllabic when it is FSON1; otherwise the one the clause's last hat rise
      # set, and 0 when none has.
      ref_syllabic: >-
        la != null && dectalk_has(la, 'son1') ? current
        : (count_back_pred(current, 1000, 'is_clause_silence', 'is_hat_rise_reference') > 0.0
           ? look_back_pred(current, 1000, 'is_hat_rise_reference') : null)
      ref_la: "ref_syllabic == null ? null : dectalk_prev(ref_syllabic)"
      gesture_ref: >-
        ref_syllabic == null ? 0.0
        : count_back_pred(ref_syllabic, 1000, 'is_clause_silence', 'is_dectalk_phone')
      hat_delay: >-
        gesture_ref <= params.policy.f0.hat_rise_early_through_allophone
        ? -params.policy.f0.hat_rise_early_frames
        : floor(get(ref_la, 'timing_frames', 0.0) / params.policy.f0.hat_rise_delay_divisor)
      stress_delay: >-
        stress_now == params.policy.f0.stress_emphasis_level ? params.policy.f0.stress_emphasis_delay_frames
        : (isTrue(current, 'hat_ends') || get(current, 'rime_boundary', '') in ['period', 'question', 'exclaim']
           ? -params.policy.f0.stress_final_early_frames
           : floor(frames / params.policy.f0.stress_delay_divisor))
      hat_here: "isTrue(current, 'hat_begins')"
      floor_delay: >-
        stress_now > 0 ? (hat_here ? max([stress_delay, hat_delay]) : stress_delay)
        : (hat_here ? hat_delay : -params.policy.f0.command_clock_lead_frames)
      dip_delay: >-
        max([floor_delay, one_word ? -params.policy.f0.question_dip_early_frames_one_word
                                   : -params.policy.f0.question_dip_early_frames])
      rise_delay: >-
        max([dip_delay, one_word ? frames
                                 : floor(frames / params.policy.f0.stress_delay_divisor)
                                   - params.policy.f0.question_rise_back_frames])
    constraint: "reached && get(current, 'rime_boundary', '') == 'question'"
    insert:
      relation: Tilt
      layer: stress
      at: >-
        at_offset(current.sync_left,
          (dip_delay - params.policy.f0.command_clock_lead_frames) * params.policy.f0.segmental.frame_ms)
      value: params.policy.f0.question_gesture_dip_hz
      duration_frames: params.policy.f0.question_dip_frames
      tag: f0_question_dip
    citations:
      - "DECtalk 4.63 Ph_inton2.c:1238-1263 Rule 4 (IMPULSE F0_QGesture1 at -5 or -6 frames, length 15)"
      - "DECtalk 4.63 Ph_inton2.c:580-581 (US F0_QGesture1 = -151, F0_QGesture2 = 451)"
      - "DECtalk 4.63 ph_inton1.c:1857-1902 make_f0_command"

  dectalk_question_rise:
    kind: f0_layer
    select: *question_syllabic
    define: *question_gesture
    constraint: "reached && get(current, 'rime_boundary', '') == 'question'"
    insert:
      relation: Tilt
      layer: stress
      at: >-
        at_offset(current.sync_left,
          (rise_delay - params.policy.f0.command_clock_lead_frames) * params.policy.f0.segmental.frame_ms)
      value: >-
        one_word ? params.policy.f0.question_gesture_rise_hz - params.policy.f0.question_rise_one_word_reduction_hz
        : params.policy.f0.question_gesture_rise_hz
      duration_frames: >-
        one_word ? params.policy.f0.question_rise_frames_one_word : params.policy.f0.question_rise_frames
      tag: f0_question_rise
    citations:
      - "DECtalk 4.63 Ph_inton2.c:1253-1262 Rule 4 (one word: F0_QGesture2 - 100 at the vowel's end, length 24; otherwise F0_QGesture2 at (allodurs >> 2) - 4, length 20)"
      - "DECtalk 4.63 ph_inton1.c:1857-1902 make_f0_command"

  # --------------------------------------------------------------------------
  # Rule 2 (Ph_inton2.c:924-1062): a stress IMPULSE on every stressed
  # syllabic the walk reaches, primary, secondary or emphatic.
  #
  #   size  = us_f0_mstress_level[stress] + us_f0_mphrase_position[nrises_sofar]
  #           (935-942); a quarter of that in a clause that ends in "?" (955-958);
  #           50 less, and never below 30, on the syllabic where the hat ends or
  #           before a period (963-972); then times scale_str_rise / 32, the
  #           scale taken as at least 16 under emphasis (1005-1012).
  #   delay = a quarter of the syllabic's frames (961); -3 frames in the
  #           hat-end or period case; 1 frame under emphasis (976-979).
  #   nrises_sofar counts the clause's stress impulses so far; at 7 it goes
  #           back to 1 (1059-1062).
  #
  # make_f0_command never lets a command precede the one before it
  # (ph_inton1.c:1880-1883): on a syllabic that also carries the hat rise the impulse
  # cannot start before the rise.
  # --------------------------------------------------------------------------
  dectalk_stress_impulse:
    kind: f0_layer
    select:
      relation: Segment
      where: { predicate: is_dectalk_syllabic }
    define:
      stopped_at: >-
        look_back_where(current, 1000,
          '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null) || isTrue(candidate, "intonation_stops")')
      reached: >-
        !isTrue(current, 'intonation_stops') && (stopped_at == null || stopped_at.phoneme == 'SIL')
      stress_now: "get(current, 'stress', 0)"
      clause_end: >-
        look_ahead_where(current, 1000,
          'candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null')
      question: "clause_end != null && clause_end.punctuationSymbol == '?'"
      rises: "count_back_pred(current, 1000, 'is_clause_silence', 'is_stressed_syllabic')"
      rise_index: >-
        rises < params.policy.f0.stress_max_rises ? rises
        : 1.0 + mod(rises - params.policy.f0.stress_max_rises, params.policy.f0.stress_max_rises - 1.0)
      raw_hz: >-
        params.policy.f0.stress_level[params.policy.voice.sex][stress_now]
        + params.policy.f0.stress_phrase_position[params.policy.voice.sex][rise_index]
      question_hz: "question ? floor(raw_hz / params.policy.f0.stress_question_divisor) : raw_hz"
      # (struccur & FPERNEXT) IS_PLUS tests one bit, 0400, which the question
      # and exclamation boundary values (0440, 0500) carry too.
      final: >-
        isTrue(current, 'hat_ends')
        || get(current, 'rime_boundary', '') in ['period', 'question', 'exclaim']
      reduced_hz: "question_hz - params.policy.f0.stress_final_reduction_hz"
      final_hz: >-
        !final ? question_hz
        : (reduced_hz < 0.0 ? params.policy.f0.stress_final_floor_hz : reduced_hz)
      # Under emphasis a voice's stress scale counts as at least 16
      # (Ph_inton2.c:1005-1009).
      stress_scale: >-
        stress_now == params.policy.f0.stress_emphasis_level
          && params.policy.voice.scale_str_rise < params.policy.f0.stress_emphasis_scale_minimum
        ? params.policy.f0.stress_emphasis_scale_minimum
        : params.policy.voice.scale_str_rise
      impulse_hz: >-
        floor(stress_scale * final_hz / params.policy.f0.stress_scale_divisor)
      own_delay: >-
        stress_now == params.policy.f0.stress_emphasis_level ? params.policy.f0.stress_emphasis_delay_frames
        : (final ? -params.policy.f0.stress_final_early_frames
           : floor(get(current, 'timing_frames', 0.0) / params.policy.f0.stress_delay_divisor))
      # The hat rise issued just before it on the same syllabic (Rule 1).
      position: "1.0 + count_back_pred(current, 1000, 'is_clause_silence', 'is_dectalk_phone')"
      la: dectalk_prev(current)
      # gesture_ref (Ph_inton2.c:460, 849-852): the allophone before this
      # syllabic when it is FSON1; otherwise the one the clause's last hat rise
      # set, and 0 when none has.
      ref_syllabic: >-
        la != null && dectalk_has(la, 'son1') ? current
        : (count_back_pred(current, 1000, 'is_clause_silence', 'is_hat_rise_reference') > 0.0
           ? look_back_pred(current, 1000, 'is_hat_rise_reference') : null)
      ref_la: "ref_syllabic == null ? null : dectalk_prev(ref_syllabic)"
      gesture_ref: >-
        ref_syllabic == null ? 0.0
        : count_back_pred(ref_syllabic, 1000, 'is_clause_silence', 'is_dectalk_phone')
      hat_delay: >-
        gesture_ref <= params.policy.f0.hat_rise_early_through_allophone
        ? -params.policy.f0.hat_rise_early_frames
        : floor(get(ref_la, 'timing_frames', 0.0) / params.policy.f0.hat_rise_delay_divisor)
      delay_frames: >-
        isTrue(current, 'hat_begins') ? max([own_delay, hat_delay]) : own_delay
    constraint: "reached && stress_now > 0"
    insert:
      relation: Tilt
      layer: stress
      at: >-
        at_offset(current.sync_left,
          (delay_frames - params.policy.f0.command_clock_lead_frames) * params.policy.f0.segmental.frame_ms)
      value: impulse_hz
      duration_frames: params.policy.f0.stress_impulse_duration_frames
      tag: f0_stress_impulse
    citations:
      - "DECtalk 4.63 Ph_inton2.c:924-1062 Rule 2 (stress impulse: us_f0_mstress_level + us_f0_mphrase_position[nrises_sofar], length 20)"
      - "DECtalk 4.63 Ph_inton2.c:313, 323-324, 328-329, 333 (the US tables, male and female); 936-946 (chosen by malfem)"
      - "DECtalk 4.63 ph_inton1.c:1857-1902 make_f0_command (a command is never earlier than the one before)"
      - "DECtalk 4.63 Ph_drwt02.c:1908-1957 US non-reading IMPULSE (step plus ramp)"

  # --------------------------------------------------------------------------
  # Segmental F0 (Ph_drwt02.c pht0draw, 2080-2150).
  #
  # DECtalk steps through the clause's allophones (allophons[], allodurs[]) and
  # feeds each one's incremental target, us_f0msegtars[phone], into a separately
  # filtered segmental path. One command is inserted here per DECtalk allophone,
  # in order:
  #   - the clause-initial silence,
  #   - every phone (a stop's closure, release and aspiration are one allophone),
  #   - the dummy vowel DECtalk appends after a clause-final stop,
  #   - the clause-final silence.
  # Each command carries the target, the allophone's duration in controller
  # frames, and the three tests pht0draw makes on the phone:
  #   profile_points = [voiceless (FVOICD minus), plosive (FPLOSV), stressed
  #   (allofeats & FSTRESS)]. The last two are read only for a voiceless phone.
  # A fourth entry says whether a glottal-stop gesture stands at the
  # allophone's end (set_tglst, Ph_drwt02.c:4040-4128); absent, there is none.
  # The f0-filters kernel owns the fixed-point filter and its delays, and the
  # gesture's clock and its dip in F0 (2266-2275).
  # --------------------------------------------------------------------------
  dectalk_segmental_f0_initial_silence:
    kind: f0_layer
    select:
      relation: Segment
      where: >-
        current.phoneme != 'SIL'
        && (prev == null || (prev.phoneme == 'SIL' && has(prev.punctuationSymbol)))
    insert:
      relation: Tilt
      layer: segmental
      at: at_sync(current.sync_left)
      value: "params.policy.f0.segmental.targets[params.policy.voice.sex].SIL"
      duration_frames: dectalk_clause_initial_pause_frames(current)
      # The fourth flag: a gesture at the pause's end when the clause's first
      # allophone is glottalized (Ph_drwt02.c:4110-4114), or is a vowel with
      # primary stress in its word's first syllable (4078-4098, the consonant
      # case: the pause carries FWBNEXT, which the word boundary ahead of the
      # first word gives the phone before it, ph_sort.c:1457-1466).
      profile_points:
        - 1
        - 0
        - 0
        - >-
          dectalk_name(current) in params.policy.articulation.place.glottal
          || (dectalk_has(current, 'vowel') && dectalk_name(current) != 'YU'
              && get(current, 'syllable_type', 'only') in ['first', 'only']
              && get(current, 'stress', 0) in [1, params.policy.f0.stress_emphasis_level])
          ? 1 : 0
      tag: f0_segmental_initial_silence
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:4040-4128 set_tglst (where a glottal-stop gesture is placed)"
      - "DECtalk 4.63 ph_sort.c:1457-1466 (WBOUND adds FWBNEXT to the phone before it)"
      - "DECtalk 4.63 Ph_drwt02.c:662-705 us_f0msegtars and us_f0fsegtars (SI target) and :2080-2150 pht0draw"
      - "DECtalk 4.63 p_us_tim.c:229-232 Rule 1 (clause-initial pause of 4 or 5 frames)"

  # The baseline's clock is tcumdur, which phinton adds up one allophone at a
  # time at the foot of its loop (Ph_inton2.c:1659-1671). Where the walk stops
  # early (809-819) the allophones from the stopping syllabic on are never
  # added: pht0draw still steps through them, but the baseline runs over the
  # shorter span. Those get the second rule's tag, which lowering leaves out
  # of the baseline's duration.
  dectalk_segmental_f0_phone:
    kind: f0_layer
    select: &segmental_phone_select
      relation: Segment
      where: >-
        current.phoneme != 'SIL'
        && !(current.type in ['stop_release', 'stop_aspiration'])
    define: &segmental_phone_define
      n1: next
      n2: "ahead(current, 2)"
      piece1: "n1 != null && n1.type in ['stop_release', 'stop_aspiration']"
      piece2: "piece1 && n2 != null && n2.type in ['stop_release', 'stop_aspiration']"
      allophone_ms: >-
        current.duration + (piece1 ? n1.duration : 0) + (piece2 ? n2.duration : 0)
      stopped_at: >-
        look_back_where(current, 1000,
          '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null) || isTrue(candidate, "intonation_stops")')
      counted: >-
        !isTrue(current, 'intonation_stops') && (stopped_at == null || stopped_at.phoneme == 'SIL')
      # set_tglst() (Ph_drwt02.c:4040-4128): whether a glottal-stop gesture
      # stands at this allophone's end. The kernel times it and dips F0 around
      # it (2266-2275).
      gl_next: dectalk_next(current)
      gl_prev: dectalk_prev(current)
      gl_name: dectalk_name(current)
      gl_next_name: dectalk_name(gl_next)
      gl_boundary: dectalk_boundary(current)
      # 4065-4077: no gesture after a function word's phone when this is the
      # /n/ after its word-final EH, or a word-final schwa. The routine returns
      # there, before the glottalized-phone tests below.
      gl_function_word: >-
        gl_prev != null && dectalk_has_class(gl_prev, 'func')
        && ((gl_name == 'N' && dectalk_name(gl_prev) == 'EH'
             && dectalk_boundary(gl_prev) >= params.policy.timing.boundary.word)
            || (gl_name == 'AX' && gl_boundary >= params.policy.timing.boundary.word))
      # FSTRESS_1 is the low bit: primary stress and emphasis.
      gl_next_primary: >-
        gl_next != null
        && get(gl_next, 'stress', 0) in [1, params.policy.f0.stress_emphasis_level]
      # 4078-4081: the next allophone is a vowel other than YU in its word's
      # first or only syllable, and this one is word-final. (The source masks
      # with FMEDIALSYL & FFINALSYL, which is the medial bit; a final syllable
      # has it too.)
      gl_before_word_vowel: >-
        gl_next != null && dectalk_has(gl_next, 'vowel') && gl_next_name != 'YU'
        && get(gl_next, 'syllable_type', 'only') in ['first', 'only']
        && gl_boundary >= params.policy.timing.boundary.word
      # 4083-4098: after a syllabic only between identical vowels, the second
      # with primary stress, or at a verb-phrase boundary or stronger; after a
      # consonant other than a plosive or flap only before a primary-stressed
      # vowel that is not nasal.
      gl_at_hiatus: >-
        dectalk_has(current, 'syllabic')
        ? ((gl_name == gl_next_name && gl_next_primary)
           || gl_boundary >= params.policy.timing.boundary.vp)
        : (!dectalk_has(current, 'plosive') && gl_name != 'DX' && gl_next_primary
           && !dectalk_has(gl_next, 'nasal'))
      # 4110-4119: at the start and the end of a glottalized allophone.
      gl_glottalized: >-
        gl_name in params.policy.articulation.place.glottal
        || (gl_next != null && gl_next_name in params.policy.articulation.place.glottal)
      glottal_gesture: >-
        !gl_function_word && ((gl_before_word_vowel && gl_at_hiatus) || gl_glottalized)
    constraint: counted
    insert:
      relation: Tilt
      layer: segmental
      at: at_sync(current.sync_left)
      value: "get(params.policy.f0.segmental.targets[params.policy.voice.sex], current.phoneme, 0)"
      duration_frames: "round(allophone_ms / params.policy.f0.segmental.frame_ms)"
      profile_points: &segmental_phone_flags
        # The allophone's own feature word: the glottalized /t/ is FVOICD.
        - "dectalk_has(current, 'voiced') ? 0 : 1"
        - "current.type == 'stop_closure' ? 1 : 0"
        - "get(current, 'stress', 0) > 0 ? 1 : 0"
        - "glottal_gesture ? 1 : 0"
      tag: f0_segmental_phone
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:662-705 us_f0msegtars and us_f0fsegtars (incremental F0 target per phone)"
      - "DECtalk 4.63 Ph_drwt02.c:2080-2150 pht0draw (allodurs[] frames; FVOICD, FPLOSV and FSTRESS tests)"
      - "DECtalk 4.63 Ph_drwt02.c:4040-4128 set_tglst (where a glottal-stop gesture is placed)"
      - "DECtalk 4.63 ph_sort.c:1305-1308 (F_FUNC on the phones of a function word)"

  dectalk_segmental_f0_phone_after_intonation_stop:
    kind: f0_layer
    select: *segmental_phone_select
    define: *segmental_phone_define
    constraint: "!counted"
    insert:
      relation: Tilt
      layer: segmental
      at: at_sync(current.sync_left)
      value: "get(params.policy.f0.segmental.targets[params.policy.voice.sex], current.phoneme, 0)"
      duration_frames: "round(allophone_ms / params.policy.f0.segmental.frame_ms)"
      profile_points: *segmental_phone_flags
      tag: f0_segmental_uncounted_phone
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:662-705 us_f0msegtars and us_f0fsegtars (incremental F0 target per phone)"
      - "DECtalk 4.63 Ph_drwt02.c:2080-2150 pht0draw (allodurs[] frames; FVOICD, FPLOSV and FSTRESS tests)"
      - "DECtalk 4.63 Ph_inton2.c:809-819, 1659-1671 (tcumdur is not added to once the loop is left)"

  dectalk_segmental_f0_dummy_vowel:
    kind: f0_layer
    select:
      relation: Segment
      where: "current.phoneme == 'SIL' && isTrue(current, 'dummy_vowel')"
    insert:
      relation: Tilt
      layer: segmental
      at: at_sync(current.sync_left)
      value: "get(params.policy.f0.segmental.targets[params.policy.voice.sex], get(current, 'dummy_phone', 'IX'), 0)"
      duration_frames: "round(current.duration / params.policy.f0.segmental.frame_ms)"
      profile_points: [0, 0, 0]
      tag: f0_segmental_dummy_vowel
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:662-705 us_f0msegtars and us_f0fsegtars (IX and AX targets) and :2080-2150 pht0draw"

  dectalk_segmental_f0_final_silence:
    kind: f0_layer
    select:
      relation: Segment
      where: "current.phoneme == 'SIL' && has(current.punctuationSymbol)"
    insert:
      relation: Tilt
      layer: segmental
      at: at_sync(current.sync_left)
      value: "params.policy.f0.segmental.targets[params.policy.voice.sex].SIL"
      # The Segment also holds the next clause's opening pause
      # (dectalk_pause_duration); that pause has its own command above.
      duration_frames: >-
        round(current.duration / params.policy.f0.segmental.frame_ms)
        - (next != null ? dectalk_clause_initial_pause_frames(next) : 0.0)
      profile_points: [1, 0, 0]
      tag: f0_segmental_terminal_silence
    citations:
      - "DECtalk 4.63 Ph_drwt02.c:662-705 us_f0msegtars and us_f0fsegtars (SI target) and :2080-2150 pht0draw"

  # --------------------------------------------------------------------------
  # Rule 6: Connected-speech source contour (Fant 1997)
  #
  # Applies phrase-level Ee/Rd shaping on voiced segments to preserve
  # connected-speech source dynamics in the Klatt parameter relation.
  # --------------------------------------------------------------------------
  dectalk_connected_speech_source_contour:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme != 'SIL'
        && has(current.F1)
        && ((current.AV != null && current.AV > 0)
            || (current.AVS != null && current.AVS > 0))
    contour:
      domain: phrase
      # Silverman et al. 1992 ToBI: BI=4 marks intonational phrase boundaries.
      reset_break_index: 4
      apply:
        - field: EePhraseDb
          op: add
          value: ee_total_db
          tag: source_contour
        - field: RdPhraseOffset
          op: add
          value: "params.policy.source_contour.rd_final_offset * final_progress"
          tag: source_contour
    define:
      onset_rise_db: >-
        contour.elapsed_sec < params.policy.source_contour.ee_onset_rise_sec
        ? -params.policy.source_contour.ee_onset_rise_db
          * (1.0 - contour.elapsed_sec / params.policy.source_contour.ee_onset_rise_sec)
        : 0.0
      declination_db: >-
        -params.policy.source_contour.ee_declination_db_per_sec * contour.elapsed_sec
      final_window_sec: >-
        min([
          params.policy.source_contour.ee_final_window_max_sec,
          max([
            params.policy.source_contour.ee_final_window_min_sec,
            contour.phrase_duration_sec * params.policy.source_contour.ee_final_window_ratio
          ])
        ])
      final_window_start_sec: >-
        max([
          params.policy.source_contour.ee_onset_rise_sec,
          contour.phrase_duration_sec - final_window_sec
        ])
      final_fall_db: >-
        contour.elapsed_sec > final_window_start_sec
        ? -(params.policy.source_contour.ee_final_fall_db_per_sec
            - params.policy.source_contour.ee_declination_db_per_sec)
          * (contour.elapsed_sec - final_window_start_sec)
        : 0.0
      final_progress: >-
        contour.elapsed_sec <= final_window_start_sec
        ? 0.0
        : min([1.0, (contour.elapsed_sec - final_window_start_sec) / final_window_sec])
      ee_total_db: >-
        onset_rise_db + declination_db + final_fall_db
    citations:
      - Fant 1997 (connected-speech source contour model for Ee and Rd shaping)
      - Hanson et al. 2001 (phrase-final spectral tilt and breathiness support Rd softening near boundaries)
      - Silverman et al. 1992 (ToBI break index tier; BI>=4 reset for major phrase boundaries)
