version: v1
rules:
  non_word_initial_consonant_shortening:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate'] && (prev != null ?
        (has(prev.word) && has(current.word) ? prev.word == current.word : false) : false)
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.non_word_initial_consonant_multiplier
        tag: consonant_position
    citations:
      - Klatt 1976
  word_medial_consonant_shortening:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate'] && (prev != null ?
        (has(prev.word) && has(current.word) ? prev.word == current.word : false) : false) && (next != null ?
        (has(next.word) && has(current.word) ? next.word == current.word : false) : false)
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.word_medial_consonant_multiplier
        tag: consonant_medial
    citations:
      - Klatt 1976
  unstressed_consonant_shortening:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate'] && (has(current.stress) ?
        current.stress == 0 : false)
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.unstressed_consonant_multiplier
        tag: consonant_stress
    citations:
      - Klatt 1976
  word_initial_lengthening:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate'] && (prev == null ? true :
        (has(prev.word) && has(current.word) ? prev.word != current.word : true))
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.word_initial_lengthening_multiplier
        tag: word_initial
    citations:
      - White 2014
  punctuation_pause:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme == 'SIL' && has(current.punctuationSymbol)
    apply:
      - field: duration
        op: set
        value: >-
          current.punctuationSymbol == ',' ? params.policy.duration.punctuation_pause_comma_ms :
          (current.punctuationSymbol in [';', ':'] ? params.policy.duration.punctuation_pause_phrase_break_ms :
          (current.punctuationSymbol in ['.', '?', '!'] ? params.policy.duration.punctuation_pause_terminal_ms :
          current.duration))
    citations:
      - Allen et al. 1987
      - semicolon/colon mapping is engineering estimate
  stress_duration:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'vowel'
    apply:
      - field: duration
        op: mul
        value: >-
          has(current.stress) && current.stress == 1 ? params.policy.duration.stress_primary_multiplier :
          ((has(current.stress) && current.stress == 0) ? params.policy.duration.stress_unstressed_multiplier : 1.0)
        tag: stress
    citations:
      - Klatt 1976
  vowel_shortening:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'vowel'
    define:
      "n": next
      # Check if the segment after next is SIL or null (phrase-final position)
      a1: ahead(current, 2)
      is_phrase_final: "a1 == null ? true : (a1.phoneme == 'SIL')"
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: "n == null ? true : n.phoneme == 'SIL'"
            value: params.policy.duration.vowel_shortening_end_multiplier
          - when: >-
              (n == null ? false : (has(n.voiced) && n.voiced == true && n.type == 'fricative'))
              && is_phrase_final
            value: params.policy.duration.vowel_shortening_voiced_fricative_multiplier
          - when: "n == null ? false : (has(n.voiced) && n.voiced == true && n.type == 'fricative')"
            value: params.policy.duration.vowel_shortening_voiced_fricative_medial_multiplier
          - when: >-
              n == null ? false : (has(n.voiced) && n.voiced == true && n.type in ['stop', 'stop_closure',
              'stop_release'])
            value: params.policy.duration.vowel_shortening_voiced_stop_multiplier
          - when: "n == null ? false : n.type == 'nasal'"
            value: params.policy.duration.vowel_shortening_nasal_multiplier
          - when: "n == null ? false : (has(n.voiceless) && n.voiceless == true && n.type in ['stop', 'stop_closure'])"
            value: params.policy.duration.vowel_shortening_voiceless_stop_multiplier
          - default: 1
        tag: segmental_context
    citations:
      - Klatt 1976
      - Allen et al. 1987
      - "Klatt 1979"
  accent_vowel_lengthening:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'vowel' && has(current.isAccented) && current.isAccented == true
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: has(current.isNuclearAccent) && current.isNuclearAccent == true
            value: params.policy.duration.accent_nuclear_multiplier
          - when: has(current.stress) && current.stress == 1
            value: params.policy.duration.accent_stressed_multiplier
          - default: params.policy.duration.accent_unstressed_multiplier
        tag: accent
    citations:
      - van Santen 1994 (pitch accent x stress amplificatory interaction)
      - White 2014
      - Turk & Shattuck-Hufnagel 2007 (accent lengthening greatest on primary stress)
  polysyllabic_shortening:
    kind: scalar
    select:
      stream: phone
      where: "current.type == 'vowel' && has(current.word_syllable_count) && current.word_syllable_count > 1"
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.polysyllabic_shortening_factor
        tag: polysyllabic
    citations:
      - Klatt 1976
  cluster_shortening:
    kind: scalar
    select:
      stream: phone
      where: "current.type != 'vowel' && has(current.cluster_position)"
    apply:
      - field: duration
        op: mul
        value: >-
          current.cluster_position == 0 ? params.policy.duration.cluster_first_shortening :
          params.policy.duration.cluster_subsequent_shortening
        tag: cluster
    citations:
      - Klatt 1973 (cluster shortening)
  pre_boundary_lengthening:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL' && (current.type == 'vowel'
        || (prev != null ? prev.type == 'vowel' || prev.type == 'nasal' || prev.type == 'liquid' || prev.type == 'glide' : false))
    define:
      "n": next
      a1: ahead(current, 1)
      a2: ahead(current, 2)
      a3: ahead(current, 3)
      a4: ahead(current, 4)
      a5: ahead(current, 5)
      a6: ahead(current, 6)
      same_word_check: "has(current.word) ? current.word : ''"
      # Final-syllable rhyme only: allow contiguous vowel material (e.g. diphthong
      # components), but reject tokens that still have another same-word vowel after
      # an intervening consonant. This blocks onset material and earlier syllables.
      same_word_vowel_after_nonvowel: >-
        ((a1 != null && has(a1.word) && a1.word == same_word_check && a1.phoneme != 'SIL' && a1.type != 'vowel')
          && ((a2 != null && has(a2.word) && a2.word == same_word_check && a2.type == 'vowel')
            || (a3 != null && has(a3.word) && a3.word == same_word_check && a3.type == 'vowel')
            || (a4 != null && has(a4.word) && a4.word == same_word_check && a4.type == 'vowel')
            || (a5 != null && has(a5.word) && a5.word == same_word_check && a5.type == 'vowel')
            || (a6 != null && has(a6.word) && a6.word == same_word_check && a6.type == 'vowel')))
        || ((a2 != null && has(a2.word) && a2.word == same_word_check && a2.phoneme != 'SIL' && a2.type != 'vowel')
          && ((a3 != null && has(a3.word) && a3.word == same_word_check && a3.type == 'vowel')
            || (a4 != null && has(a4.word) && a4.word == same_word_check && a4.type == 'vowel')
            || (a5 != null && has(a5.word) && a5.word == same_word_check && a5.type == 'vowel')
            || (a6 != null && has(a6.word) && a6.word == same_word_check && a6.type == 'vowel')))
        || ((a3 != null && has(a3.word) && a3.word == same_word_check && a3.phoneme != 'SIL' && a3.type != 'vowel')
          && ((a4 != null && has(a4.word) && a4.word == same_word_check && a4.type == 'vowel')
            || (a5 != null && has(a5.word) && a5.word == same_word_check && a5.type == 'vowel')
            || (a6 != null && has(a6.word) && a6.word == same_word_check && a6.type == 'vowel')))
        || ((a4 != null && has(a4.word) && a4.word == same_word_check && a4.phoneme != 'SIL' && a4.type != 'vowel')
          && ((a5 != null && has(a5.word) && a5.word == same_word_check && a5.type == 'vowel')
            || (a6 != null && has(a6.word) && a6.word == same_word_check && a6.type == 'vowel')))
        || ((a5 != null && has(a5.word) && a5.word == same_word_check && a5.phoneme != 'SIL' && a5.type != 'vowel')
          && (a6 != null && has(a6.word) && a6.word == same_word_check && a6.type == 'vowel'))
      # Check the current token's own breakIndex first.
      # Citation: Silverman et al. 1992 (ToBI break index tier)
      own_bi: "has(current.breakIndex) && current.breakIndex > 0 ? current.breakIndex : 0"
      # Scan ahead for SIL, but ONLY within the same word (plus the SIL itself).
      # Each step checks: is the token SIL with breakIndex?  If not, is it the same word?
      # If we hit a different word, stop scanning (bi stays 0).
      # This prevents pre-boundary lengthening from leaking to mid-phrase words.
      sil_bi_1: >-
        a1 == null ? 0 :
        (a1.phoneme == 'SIL' && has(a1.breakIndex) ? a1.breakIndex :
        (has(a1.word) && a1.word == same_word_check ? -1 : 0))
      sil_bi_2: >-
        sil_bi_1 != -1 ? 0 :
        (a2 == null ? 0 :
        (a2.phoneme == 'SIL' && has(a2.breakIndex) ? a2.breakIndex :
        (has(a2.word) && a2.word == same_word_check ? -1 : 0)))
      sil_bi_3: >-
        sil_bi_2 != -1 ? 0 :
        (a3 == null ? 0 :
        (a3.phoneme == 'SIL' && has(a3.breakIndex) ? a3.breakIndex :
        (has(a3.word) && a3.word == same_word_check ? -1 : 0)))
      sil_bi_4: >-
        sil_bi_3 != -1 ? 0 :
        (a4 == null ? 0 :
        (a4.phoneme == 'SIL' && has(a4.breakIndex) ? a4.breakIndex :
        (has(a4.word) && a4.word == same_word_check ? -1 : 0)))
      sil_bi_5: >-
        sil_bi_4 != -1 ? 0 :
        (a5 == null ? 0 :
        (a5.phoneme == 'SIL' && has(a5.breakIndex) ? a5.breakIndex :
        (has(a5.word) && a5.word == same_word_check ? -1 : 0)))
      sil_bi_6: >-
        sil_bi_5 != -1 ? 0 :
        (a6 == null ? 0 :
        (a6.phoneme == 'SIL' && has(a6.breakIndex) ? a6.breakIndex : 0))
      # Take the first positive SIL breakIndex found (sentinels -1 mean "keep scanning").
      ahead_bi: >-
        sil_bi_1 > 0 ? sil_bi_1 :
        (sil_bi_2 > 0 ? sil_bi_2 :
        (sil_bi_3 > 0 ? sil_bi_3 :
        (sil_bi_4 > 0 ? sil_bi_4 :
        (sil_bi_5 > 0 ? sil_bi_5 :
        (sil_bi_6 > 0 ? sil_bi_6 : 0)))))
      raw_bi: "own_bi > 0 ? own_bi : (ahead_bi > 0 ? ahead_bi : 0)"
      # Categorize break index into named levels to avoid inline numeric literals
      # in dispatch when conditions (validation constraint).
      bi_level: >-
        raw_bi >= params.policy.duration.pre_boundary_bi4_threshold ? 'bi4' :
        (raw_bi >= params.policy.duration.pre_boundary_bi3_threshold ? 'bi3' :
        (raw_bi >= params.policy.duration.pre_boundary_bi2_threshold ? 'bi2' :
        (raw_bi >= 1 ? 'bi1' : 'bi0')))
      is_obstruent: >-
        current.type in ['stop_closure', 'stop_release', 'stop_aspiration', 'fricative', 'affricate']
    constraint: "!same_word_vowel_after_nonvowel"
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: bi_level == 'bi4' && is_obstruent
            value: params.policy.duration.pre_boundary_bi4_obstruent_multiplier
          - when: bi_level == 'bi4'
            value: params.policy.duration.pre_boundary_bi4_multiplier
          - when: bi_level == 'bi3' && is_obstruent
            value: params.policy.duration.pre_boundary_bi3_obstruent_multiplier
          - when: bi_level == 'bi3'
            value: params.policy.duration.pre_boundary_bi3_multiplier
          - when: bi_level == 'bi2'
            value: params.policy.duration.pre_boundary_bi2_multiplier
          - when: bi_level == 'bi1'
            value: params.policy.duration.pre_boundary_bi1_multiplier
          - default: 1
        tag: boundary
    citations:
      - Wightman et al. 1992 (pre-boundary lengthening scaled by prosodic boundary strength)
      - Klatt 1976
      - Crystal & House 1988
  fricative_minimum_duration:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'fricative'
    apply:
      - field: duration
        op: set
        dispatch:
          - when: current.phoneme in ['S', 'Z', 'SH', 'ZH']
            value: >-
              current.duration > params.policy.duration.fricative_min_sibilant_ms ? current.duration :
              params.policy.duration.fricative_min_sibilant_ms
          - when: current.phoneme in ['F', 'V']
            value: >-
              current.duration > params.policy.duration.fricative_min_labiodental_ms ? current.duration :
              params.policy.duration.fricative_min_labiodental_ms
          - when: current.phoneme in ['TH', 'DH']
            value: >-
              current.duration > params.policy.duration.fricative_min_dental_ms ? current.duration :
              params.policy.duration.fricative_min_dental_ms
          - when: current.phoneme == 'HH'
            value: >-
              current.duration > params.policy.duration.fricative_min_glottal_ms ? current.duration :
              params.policy.duration.fricative_min_glottal_ms
          - default: current.duration
    citations:
      - >-
        Jongman 1989 (sibilant/labiodental identification thresholds; dental fricatives poorly identified even at full
        duration; glottal /hh/ not tested -- value is engineering estimate)
  lock_stop_release_duration:
    kind: scalar
    select:
      stream: phone
      where: current.type in ['stop_release', 'stop_aspiration']
    apply:
      - field: duration
        op: set
        value: "has(current.inherentDuration) ? current.inherentDuration : current.duration"
    citations:
      - Allen et al. 1987 (fixed burst/aspiration durations)
  stop_unreleasing:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'stop_release'
    define:
      "n": next
    constraint: "n != null ? n.type == 'stop_closure' : false"
    apply:
      - field: params.AF
        op: set
        value: 0
      - field: duration
        op: set
        value: params.policy.duration.stop_unreleasing_min_ms
    citations:
      - Miller 1998
      - Crystal & House 1988
  s_cluster_aspiration_reduction:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'stop_aspiration'
    define:
      s_token: look_back_where(current, 4, "current.phoneme == 'S'")
    constraint: s_token != null
    apply:
      - field: duration
        op: set
        value: params.policy.duration.s_cluster_aspiration_ms
      - field: params.AH
        op: add
        value: "-(params.policy.duration.s_cluster_ah_reduction_db)"
    citations:
      - Lisker & Abramson 1964 (s-cluster VOT)
      - Zue 1976
  aspiration_frication_carryover:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'stop_aspiration'
    define:
      place_af: >-
        (has(current.alveolar) && current.alveolar == true) ? params.policy.duration.aspiration_frication_t_af_db :
        ((has(current.velar) && current.velar == true) ? params.policy.duration.aspiration_frication_k_af_db :
        ((has(current.bilabial) && current.bilabial == true) ? params.policy.duration.aspiration_frication_p_af_db :
        0))
      weak_scale: >-
        (has(current.weak) && current.weak == true) ? params.policy.duration.aspiration_frication_weak_scale : 1.0
    apply:
      - field: params.AF
        op: set
        value: "max([0, place_af * weak_scale])"
        tag: aspiration_frication
    citations:
      - Hanson & Stevens 2003 (place-dependent frication can extend into aspiration for /t/ and /k/)
      - Stevens 1998 (stop release acoustics with place-dependent noise shaping)
      - "Engineering estimate: AF carryover magnitudes and weak-scale defaults"
  speech_rate_scaling:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme != 'SIL'
    constraint: params.policy.duration.rate_scale != 1.0
    apply:
      - field: duration
        op: mul
        value: 1.0 / params.policy.duration.rate_scale
        tag: speech_rate
    citations:
      - Klatt 1976
      - Allen et al. 1987
  pause_rate_scaling:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme == 'SIL' && has(current.punctuationSymbol)
    constraint: params.policy.duration.rate_scale != 1.0
    apply:
      - field: duration
        op: mul
        value: 1.0 / params.policy.duration.rate_scale
        tag: pause_rate
    citations:
      - Goldman-Eisler 1968 (pause duration scales with speaking rate)
  incompressibility_floor:
    kind: scalar
    select:
      stream: phone
      where: "current.phoneme != 'SIL' && has(current.inherentDuration)"
    apply:
      - field: duration
        op: set
        value: >-
          current.duration < current.inherentDuration * (current.type == 'vowel'
          ? params.policy.duration.incompressibility_ratio_vowel
          : params.policy.duration.incompressibility_ratio_consonant)
          ? current.inherentDuration * (current.type == 'vowel'
          ? params.policy.duration.incompressibility_ratio_vowel
          : params.policy.duration.incompressibility_ratio_consonant)
          : current.duration
        tag: incompressibility
    citations:
      - "Klatt 1976"
  duration_cap:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme != 'SIL' && has(current.inherentDuration)
    apply:
      - field: duration
        op: set
        value: >-
          current.duration > current.inherentDuration * params.policy.duration.max_duration_ratio
          ? current.inherentDuration * params.policy.duration.max_duration_ratio
          : current.duration
        tag: duration_cap
    citations:
      - Klatt 1976
      - "Engineering estimate: cap prevents absurd durations from stacking multiple rules"
