version: v1

# Canonical speaker default profile for the current English frontend.
# Citations:
# - O'Shaughnessy 1976
# - Kent & Vorperian 2018
# - Fant 1997 Table 1
# - Klatt & Klatt 1990
citations:
  - O'Shaughnessy 1976
  - Kent & Vorperian 2018
  - Fant 1997 Table 1
  - Klatt & Klatt 1990

# Composition policy: use the first finite runtime source, then the field value.
# Requests inherit the selected frontend voice; omitted values retain that voice.
default_profile:
  # Offline area-function generation controls. Unity preserves the measured
  # Story geometry; runtime does not reinterpret these as formant multipliers.
  tract_length_scale:
    sources: [request.tract_length_scale, voice.tract_length_scale]
    value: 1
    citations:
      - Fitch & Giedd 1999 (tract length and regional morphology)
      - "Nordstrom 1977 (1975 report), length-scaling experiment"
  pharynx_scale:
    sources: [request.pharynx_scale, voice.pharynx_scale]
    value: 1
    citations:
      - "Nordstrom 1977 (1975 report), experiment 2 (regional length and area scaling)"
  mouth_scale:
    sources: [request.mouth_scale, voice.mouth_scale]
    value: 1
    citations:
      - "Nordstrom 1977 (1975 report), experiment 2 (regional length and area scaling)"
  base_f0_hz:
    sources: [request.base_f0_hz, baseF0, voice.base_f0_hz]
    value: 110
    citations:
      - O'Shaughnessy 1976
  formant_scale:
    sources: [request.formant_scale, voice.formant_scale]
    value: 1.0
    citations:
      - Kent & Vorperian 2018
  rd_default:
    sources: [request.rd_default, voice.rd_default]
    value: 0.7
    citations:
      - Fant 1997 Table 1
  spectral_tilt_offset_db:
    sources: [request.spectral_tilt_offset_db, voice.spectral_tilt_offset_db]
    value: 0
    citations:
      - Klatt & Klatt 1990
