name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the production build for the Pages deployment job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the workspace with only the host target installed
        run: |
          installed_targets=$(rustup target list --installed)
          if [[ "$installed_targets" == *wasm32-unknown-unknown* ]]; then
            rustup target remove wasm32-unknown-unknown
          fi
          cargo test --workspace

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev

      - run: npm run check

      - run: npm run typecheck

      - run: rustup target add wasm32-unknown-unknown

      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev

      - name: Build node-web-audio-api for the runner
        run: |
          printf '\n[workspace]\n' >> node_modules/node-web-audio-api/Cargo.toml
          npm --prefix node_modules/node-web-audio-api run build:only

      - run: bash build.sh

      - run: npm test

      - run: npm run build

      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
