# =============================================================================
# qlatt-beauty
#
# Declared as qlatt-english + deltas via `extends`. The base frontend supplies
# the language infrastructure (g2p/dict/lts/normalize/syllabification/stress),
# the shared phase rule bodies, the ~880-line parameters/policy tree, the output
# lowering spec, and the transcription table. This file carries ONLY what makes
# beauty different from english:
#   - its own segment inventory (inventory_path)
#   - its own pipeline.yaml (adds the voice-quality phase rules to `formant`)
#   - its own phases/prosody.yaml (Pierrehumbert intonation)
#   - its own phases/voice-quality.yaml (pulled in by pipeline.yaml)
#   - its `speakers:` registry: the voices of this frontend. The default voice
#     (speakers/beauty.yaml) gives the pitch level and span the prosody rules
#     read as params.policy.f0.base_hz and params.policy.f0.range_hz.
#   - the policy.f0 delta below (intrinsic pitch, sagging transitions,
#     question rise, final lowering) and the output columns delta (adds GO, DI).
#
# Everything NOT declared here is inherited from qlatt-english. Includes are
# resolved against beauty's directory first and fall back to qlatt-english's
# directory (rule-pack.ts `extends` support), so the byte-identical phase files
# (orthography/normalize/postlexical/structural/annotation/duration/formant) are
# resolved from the base without a local copy. Fixes to those shared files now
# land in one place.
# =============================================================================
extends: qlatt-english
inventory_path: /rules/frontends/qlatt-beauty/inventory.yaml
include:
  - /rules/normalization/components.yaml
  - normalization-policy.yaml
  - pipeline.yaml
  - phases/orthography.yaml
  - phases/normalize.yaml
  - phases/postlexical.yaml
  - phases/structural.yaml
  - phases/annotation.yaml
  - phases/tone-association.yaml
  - phases/duration.yaml
  - phases/formant.yaml
  - phases/prosody.yaml
# The voices of this frontend: each entry of `voices` is a file of `dir` whose
# numeric fields that are speaker-profile fields
# (/rules/policy/speaker-profile.yaml) set the speaker profile; a request's
# own values come before the voice's.
speakers:
  dir: /rules/frontends/qlatt-beauty/speakers
  default: beauty
  voices:
    - beauty
parameters:
  policy:
    f0:
      # The pitch level and span (base_hz, range_hz) are the speaker's: the
      # runtime gives the prosody phase the resolved speaker profile's
      # base_f0_hz and f0_range_hz, which this frontend's default voice sets
      # (speakers/beauty.yaml). The accent, downstep, boundary-tone, onset and
      # continuation-rise leaves are qlatt-english's, inherited. The leaves
      # below are the ones only this frontend's prosody rules read.
      # --- Intrinsic vowel pitch (segmental micro-prosody, the aliveness overlay) ---
      # High vowels (/iy/,/ih/,/uw/,/uh/) carry intrinsically higher F0 than low
      # vowels (/aa/,/ae/,/ah/). Ladd 1985 used +0.5 st for /i/, -1.0 st for /a/.
      # At a ~210 Hz female center: +0.5 st ~= +6 Hz, -1.0 st ~= -12 Hz. Mid vowels
      # take a small interpolated value. Applied additively at vowel center.
      intrinsic_pitch_high_hz:
        value: 6
        citations:
          - "O'Shaughnessy 1976 (high vowels up to ~23 Hz higher F0 than low)"
          - "Ladd 1985 (+0.5 st for /i/ at a female register)"
      intrinsic_pitch_mid_hz:
        value: 0
        citations:
          - "O'Shaughnessy 1976 (mid vowels near the neutral intrinsic value)"
      intrinsic_pitch_low_hz:
        value: -12
        citations:
          - "O'Shaughnessy 1976 (low vowels carry the lowest intrinsic F0)"
          - "Ladd 1985 (-1.0 st for /a/ at a female register)"
      # Lower clamp for the micro-prosody overlay: never let a segmental nudge
      # drive F0 below this fraction of the floor (guards against runaway dips).
      intrinsic_floor_fraction:
        value: 0.7
        citations:
          - "Engineering estimate: micro-prosody overlay clamps at 0.7*floor to stay voiced"
      # --- Sagging transition (Ladd 2008 / Pierrehumbert 1980) ---
      # Between two successive H accents the contour must SAG (dip then rise),
      # not run as a straight line. We approximate the Fujisaki bend within the
      # point-interpolation renderer by stamping a mid-valley point between an
      # accent peak and the next accent. Fraction of the local peak-to-base gap.
      sag_depth_fraction:
        value: 0.35
        citations:
          - "Ladd 2008 (sagging transition between accents, not linear interp)"
          - "Pierrehumbert 1980 (interpolation dips between H targets)"
          - "Fujisaki (damped 2nd-order response curves the inter-accent valley)"
      # --- Final lowering (Ladd 2008 separate from downstep) ---
      # The nuclear (final) accent dips below the k-downstep prediction. Applied
      # as a multiplicative pull of the nuclear peak toward the floor.
      final_lowering_pull:
        value: 0.15
        citations:
          - "Ladd 2008 pp.79-80 (final accent lower than downstep predicts)"
          - "Pierrehumbert 1980 (final lowering as a separate utterance-final effect)"
      # --- Question final rise (H% realized on the last VOICED syllable) ---
      # ToBI boundary tones live on the trailing-silence token, which is acoustically
      # silent, so a naive L*+H ... H-H% question never phonates its rise. This pulls
      # the rise onto the nuclear voiced vowel itself so the listener actually HEARS
      # the yes/no-question rise. Target = base + range*fraction (near top of range).
      question_rise_fraction:
        value: 0.9
        citations:
          - "Pierrehumbert 1980 (H%/H- yes-no question rise to near top of range)"
          - "Ladd 2008 Ch.4 (uptalk/question final rise realized on the final sonorant)"
          - "O'Shaughnessy 1976 (question endpoint 170-190 Hz male; scales up for female)"
output:
  lowering:
    id: qlatt-beauty-track-lowering
    columns: [FTP, FTZ, BTP, BTZ, DF1, DB1, F1, F2, F3, F4, B4, F5, B5, F6, B6, B1, B2, B3, AV, AF, AH, AVS, F0, sourceMode, lfMode, Rd, RdRef, OQ, TL, flutter, jitter, EePhraseDb, RdPhraseOffset, AN, nasalCouplingArea, nasalPlaceIndex, nasalMurmurStrength, nasalPoleBaseHz, nasalPoleBwHz, nasalZeroBwHz, nasalPlaceBwHz, nasalPlaceMFnzHz, nasalPlaceNFnzHz, nasalPlaceNgFnzHz, nasalB1AdditionHz, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, AB, SW, FGP, BGP, FGZ, BGZ, BGS, NFC, GO, DI]
