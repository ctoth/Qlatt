source:
  paper: Simpson_2009_PhoneticGenderDifferences
claims:
- id: claim1
  type: observation
  statement: Female formant frequencies should NOT be derivable from male formants
    by a single uniform scaling constant
  concepts:
  - formant
  provenance:
    paper: Simpson_2009_PhoneticGenderDifferences
    page: 0
- id: claim2
  type: observation
  statement: Male vowel durations should be approximately 11% shorter than female
    vowel durations
  concepts:
  - duration
  provenance:
    paper: Simpson_2009_PhoneticGenderDifferences
    page: 0
- id: claim3
  type: observation
  statement: In semitone representation, male and female pitch ranges should be approximately
    equal
  concepts:
  - pitch
  provenance:
    paper: Simpson_2009_PhoneticGenderDifferences
    page: 0
- id: claim4
  type: observation
  statement: Female VOTs for voiceless plosives should be longer than male VOTs
  concepts:
  - vot
  provenance:
    paper: Simpson_2009_PhoneticGenderDifferences
    page: 0
- id: claim5
  type: observation
  statement: Pre-pubescent boys and girls should show formant differences despite
    similar vocal tract dimensions
  concepts:
  - formant
  provenance:
    paper: Simpson_2009_PhoneticGenderDifferences
    page: 0
