    select:
      relation: Segment
      where: >-
        current.word == 'the' &&
        current.phoneme == 'DH' &&
        next != null && next.phoneme == 'AX'
    define:
      existing_windows: "has(current.control_windows) ? current.control_windows : []"
      trace_windows: params.policy.formant.the_dh_formant_trace_windows
    apply:
      - field: F1
        op: set
        value: params.policy.formant.the_dh_f1_hz
        tag: dectalk_trace_exact
      - field: F2
        op: set
        value: params.policy.formant.the_dh_f2_hz
        tag: dectalk_trace_exact
      - field: F3
        op: set
        value: params.policy.formant.the_dh_f3_hz
        tag: dectalk_trace_exact
      - field: B1
        op: set
        value: params.policy.formant.the_dh_b1_hz
        tag: dectalk_trace_exact
      - field: B2
        op: set
        value: params.policy.formant.the_dh_b2_hz
        tag: dectalk_trace_exact
      - field: B3
        op: set
        value: params.policy.formant.the_dh_b3_hz
        tag: dectalk_trace_exact
      - field: AV
        op: set
        value: params.policy.formant.the_dh_av_db
        tag: dectalk_trace_exact
      - field: A6
        op: set
        value: params.policy.formant.the_dh_a6_db
        tag: dectalk_trace_exact
      - field: AB
        op: set
        value: params.policy.formant.the_dh_ab_db
        tag: dectalk_trace_exact
      - field: TL
        op: set
        value: params.policy.formant.the_tl_db
        tag: dectalk_trace_exact
      - field: control_windows
        op: set
        value: "existing_windows + trace_windows"
        tag: dectalk_trace_exact
    citations:
      - "DECtalk 4.63 oracle -lt trace for 'the' (native initialized-SI and DH F1/F2/F3/B1/B2/B3/AV/A6/AB/TLT values at frames 0-12)"
      - "DECtalk 4.63 ph_draw.c (formant transitions are emitted once per native synthesis frame)"

