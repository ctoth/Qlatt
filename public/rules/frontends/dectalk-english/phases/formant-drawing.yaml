      - { register: dipcum_B3, value: "0", tag: formant_diphthong }
      - { register: deldip_F1, value: "u.dip_F1 ? r.deldip_F1 : 0", tag: formant_diphthong }
      - { register: deldip_F2, value: "u.dip_F2 ? r.deldip_F2 : 0", tag: formant_diphthong }
      - { register: deldip_F3, value: "u.dip_F3 ? r.deldip_F3 : 0", tag: formant_diphthong }
      - { register: deldip_B2, value: "u.dip_B2 ? r.deldip_B2 : 0", tag: formant_diphthong }
