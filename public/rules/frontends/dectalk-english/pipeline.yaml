version: v1
predicates:
  is_question_boundary: 'current.phoneme == "SIL" && current.punctuationSymbol == "?"'
  is_stressed_vowel: 'current.type == "vowel" && has(current.stress) && current.stress == 1'
  is_stressed_vowel_or_boundary: >-
    (current.type == "vowel" && has(current.stress) && current.stress == 1)
    || current.phoneme == "SIL"
streams:
  phone:
    type: base
    features:
      type: [vowel, stop_closure, stop_release, stop_aspiration, fricative, affricate, silence, liquid, nasal, glide, flap]
    scalars:
      duration: { unit: ms, resolution: klatt, max: 500, floor_field: minimumDuration }
  f0:
    type: point
    value_type: number
    unit: Hz
  f0_layer:
    type: point
    value_type: number
    unit: Hz
phases:
  - name: duration
    rules:
      - dectalk_pause_duration
      - dectalk_clause_final_lengthening
      - dectalk_non_final_shortening
      - dectalk_stress_shortening
      - dectalk_polysyllabic_shortening
      - dectalk_non_initial_consonant_shortening
      - dectalk_unstressed_shortening
      - dectalk_emphasis_lengthening
      - dectalk_postvocalic_voiceless_shortening
      - dectalk_postvocalic_voiced_lengthening
      - dectalk_consonant_cluster_shortening
      - dectalk_phrase_initial_vowel_lengthening
      - dectalk_rate_scaling
    resolve_scalars: [duration]
  - name: structural
    rules:
      - dectalk_insert_voiceless_stop_release_and_aspiration
      - dectalk_insert_voiceless_stop_release_and_aspiration_final
      - dectalk_insert_voiced_stop_release
      - dectalk_insert_voiced_stop_release_final
      - dectalk_weaken_interdental_frication
      - dectalk_add_voiceless_fricative_breathy_onset
  - name: formant
    rules:
      - dectalk_sw_explicit_override
      - dectalk_sw_default_assignment
  - name: prosody
    rules:
      - dectalk_baseline_declination
      - dectalk_hat_rise
      - dectalk_hat_fall
      - dectalk_stress_impulse
      - dectalk_boundary_reset
  - name: finalize
    after: [duration, structural, formant, prosody]
    rules: []
    compute_times: true
    resolve_points: [f0]
