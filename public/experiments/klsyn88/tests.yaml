suite: klsyn88-semantics-and-schedule
semantics: public/experiments/klsyn88/semantics.yaml
graph: public/experiments/klsyn88/graph.yaml
registry: public/experiments/klsyn88/registry.yaml
defaultTol: 1e-6

tests:
  - name: avDb clamps below zero
    inputs:
      AV: 5
    assert:
      approx:
        avDb: 0
        voiceGain: 0

  - name: gain0Db uses fallback when GO-3 <= 0
    inputs:
      GO: 3
    assert:
      approx:
        gain0Db: 57

  - name: gain0Db uses GO-3 when GO-3 > 0
    inputs:
      GO: 40
    assert:
      approx:
        gain0Db: 37

  - name: gain0Linear includes 32768 normalization for WebAudio
    # klsyn88 fixed-point to float conversion: dbToLinearKlsyn(54) * (1/32768)
    # At GO=57, gain0Db=54, amptable[54]=719, so:
    # gain0Linear = 719 * 0.001 * 3.0517578125e-5 ≈ 2.1942e-5
    inputs:
      GO: 57
    assert:
      approx:
        gain0Linear: 2.1942e-5
      tol: 1e-8

  - name: cascadePolarity flips on even NFCASC
    inputs:
      NFCASC: 6
    assert:
      approx:
        cascadePolarity: -1

  - name: cascadeF7/F8 gating off below thresholds
    inputs:
      NFCASC: 6
    assert:
      approx:
        cascadeF7Freq: 0
        cascadeF8Freq: 0

  - name: cascadeF7/F8 active at NFCASC >= 8
    inputs:
      NFCASC: 8
    assert:
      approx:
        cascadeF7Freq: 6500
        cascadeF8Freq: 7500

  - name: parallel gain signs alternate
    inputs:
      A2: 40
      A3: 40
      A4: 40
      A5: 40
      A6: 40
    assert:
      expr:
        - "a2Gain < 0"
        - "a3Gain > 0"
        - "a4Gain < 0"
        - "a5Gain > 0"
        - "a6Gain < 0"

  - name: Fant proxy derives modal open quotient in klsyn88 backend
    inputs:
      Rd: 0.7
      OQ: 0
    assert:
      approx:
        effectiveKopen: 55.5
      tol: 1e-6

  - name: explicit OQ override wins over Rd-derived proxy
    inputs:
      Rd: 2.0
      OQ: 62
    assert:
      approx:
        effectiveKopen: 62

  - name: breathy Rd increases Ee proxy and widens B1/B2
    inputs:
      Rd: 2.0
      RdRef: 0.7
      F1: 500
      F2: 1500
      B1: 60
      B2: 90
      B1p: 80
      B2p: 200
    assert:
      expr:
        - "eeGainDb < 0"
        - "effectiveB1 > B1"
        - "effectiveB2 > B2"
        - "effectiveB1p > B1p"
        - "effectiveB2p > B2p"

  - name: phrase contour offsets modulate effective Rd and Ee
    inputs:
      Rd: 0.7
      RdRef: 0.7
      RdPhraseOffset: 0.1
      EePhraseDb: -2
    assert:
      approx:
        effectiveRd: 0.8
      expr:
        - "eeGainDb < 0"
