source:
  paper: Liu_2011_FemaleVoiceAttractiveness
claims:
- id: claim1818
  type: observation
  statement: Breathy voice quality should always be rated more attractive than normal,
    which should always be rated more attractive than pressed, for female voices judged
    by male listeners
  concepts:
  - voice_quality
  provenance:
    paper: Liu_2011_FemaleVoiceAttractiveness
    page: 0
- id: claim1819
  type: observation
  statement: Formant condensation (simulating shorter vocal tract) should not decrease
    attractiveness relative to neutral; formant dispersion (longer vocal tract) should
    decrease attractiveness
  concepts:
  - formant
  provenance:
    paper: Liu_2011_FemaleVoiceAttractiveness
    page: 0
- id: claim1820
  type: observation
  statement: Lowering pitch by 2 st should decrease attractiveness relative to original
    pitch
  concepts:
  - pitch
  provenance:
    paper: Liu_2011_FemaleVoiceAttractiveness
    page: 0
- id: claim1821
  type: observation
  statement: Voice quality effect size should be larger than formant shift effect
    size, which should be larger than pitch shift effect size
  concepts:
  - formant
  - voice_quality
  - pitch
  provenance:
    paper: Liu_2011_FemaleVoiceAttractiveness
    page: 0
- id: claim1822
  type: observation
  statement: Final F0 slope should have minimal impact on attractiveness ratings compared
    to voice quality
  concepts:
  - f0
  - voice_quality
  provenance:
    paper: Liu_2011_FemaleVoiceAttractiveness
    page: 0
