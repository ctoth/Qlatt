      where: "current.phoneme == 'SIL' && isTrue(current, 'dummy_vowel')"
    insert:
      relation: Tilt
      layer: segmental
      at: at_sync(current.sync_left)
      value: "get(params.policy.f0.segmental.targets, get(current, 'dummy_phone', 'IX'), 0)"
      duration_frames: "round(current.duration / params.policy.f0.segmental.frame_ms)"
      profile_points: [0, 0, 0]
      tag: f0_segmental_dummy_vowel
