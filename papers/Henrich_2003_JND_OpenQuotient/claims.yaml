- id: claim33
  type: observation
  statement: '**Relative JND of Oq is constant:** For any target Oq in [0.4, 0.8],
    delta_Oq/Oq should be ~0.10-0.14'
  concepts: []
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 0
- id: claim34
  type: observation
  statement: '**Absolute JND of Oq increases with Oq:** JND(0.4) < JND(0.6) < JND(0.8)'
  concepts: []
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 0
- id: claim35
  type: observation
  statement: '**JND of alpha_m decreases with alpha_m:** JND at alpha_m=0.8 < JND
    at alpha_m=2/3'
  concepts: []
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 0
- id: claim36
  type: observation
  statement: '**No vowel effect:** Synthesizing with different vowels should not change
    the perceptual resolution of Oq'
  concepts: []
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 0
- id: claim37
  type: observation
  statement: '**No pitch effect:** Changing f0 within a given register should not
    change Oq perceptual resolution'
  concepts: []
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 0
- id: claim38
  type: observation
  statement: '**Amplitude coupling:** When Av is constant and Oq varies, E also varies
    -- this creates larger spectral changes and lower JNDs than when E is held constant'
  concepts: []
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 0
