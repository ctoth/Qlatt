version: v1
# -----------------------------------------------------------------------------
# The words DECtalk's synthesizer builds voicing and noise from: glottal and
# constriction areas, subglottal pressure and the rest of the HLSYN section of
# PH/ph_draw.c (908-4221), which the controller computes frame by frame from
# state it carries from one frame to the next. Rules of kind `frame`
# (docs/frame-rules.md), one register per C variable, in the C's order.
#
# One unit is one DECtalk allophone. A stop's release and aspiration Segments
# belong to the stop; the dummy vowel that releases a plosive into silence is
# an allophone of its own (ph_inton1.c:1808-1820) although this frontend keeps
# it as a `SIL` Segment.
#
# Frames. The lead-in is DECtalk's clause-initial silence, allophone 0, all of
# it: one frame longer than the track's initial silence, because send_pars()
# writes no packet on its first call (ph_claus.c:759-766). DECtalk sends these
# words one frame late (ph_claus.c:754-757), so packet 0 carries that first
# frame's; `delay_frames: 1` shows every frame one period after it was
# computed, and the lead-in's first frame lands on the track's first instant.
# DECtalk's counters, where a rule reads them:
#   tcum      f.index
#   nframb    g.frame + 1: pht0draw has counted the frame before phdraw runs
#             (ph_claus.c:478-482, Ph_drwt02.c:2059)
#   tcumdur   g.counted_frames
#   nphone    g.unit
#
# Emitted: PS, AG, CNK, AL, ABLADE, ATB, AREA_N, DC, UE, A2_CODE (the codes),
# BRST, PLACE, F4, PH and the node's `run` gate. Not ported: the end-of-clause
# pressure drop of ph_draw.c:3929-3969 (inside the block that computes the
# final slope, reached only when the syllabic is the clause's last
# allophone), the TZ case of OUT_A2 (4370-4390), the A2 amplitude, and
# everything for languages other than US English. Voice values are Paul's.
#
# The C was read from a preprocessed listing made with the build's flags
# (scripts/oracle/dectalk-debug/compiled-lines.awk): `#ifdef PH_DEBUG` blocks
# hide live code and close late. Where a rule reproduces a slip of the C, it
# says so.
#
# A later clause's initial silence is the tail of the pause Segment before it
# (duration.yaml dectalk_pause_duration adds its 4 or 5 frames there);
# `tail_frames` makes those frames a unit, with the lead-in's features.
# -----------------------------------------------------------------------------
functions:
  artic_next_unit:
    params: [item]
    body: "item == null ? null : look_ahead_pred(item, params.policy.articulation.unit_scan_items,'is_articulation_unit')"
    description: The first Segment of the next DECtalk allophone, dummy vowels included.
    citations:
      - "DECtalk 4.63 ph_inton1.c:1808-1820 (the dummy vowel is allophone nphon + 1)"
  artic_is_dummy:
    params: [item]
    body: "item != null && item.phoneme == 'SIL' && isTrue(item, 'dummy_vowel')"
    description: Whether a Segment is the dummy vowel that releases a plosive into silence.
    citations:
      - "DECtalk 4.63 ph_inton1.c:1780-1820 (Rule 9)"
  artic_prev_unit:
    params: [item]
    body: "item == null ? null : look_back_pred(item, params.policy.articulation.unit_scan_items,'is_articulation_unit')"
    description: The first Segment of the DECtalk allophone before this one, dummy vowels included.
    citations:
      - "DECtalk 4.63 ph_inton1.c:1808-1820 (the dummy vowel is allophone nphon + 1)"
  artic_has:
    params: [item, feature]
    body: >-
      artic_is_dummy(item) ? feature in params.policy.timing.features.IX
      : dectalk_has(item, feature)
    description: A us_featb bit of an allophone; the dummy vowel has those of IX (AX has the same).
    citations:
      - "DECtalk 4.63 p_us_rom.h us_featb; ph_inton1.c:1780-1806 (the dummy vowel is IX or AX)"
  artic_place:
    params: [item, place]
    body: "!artic_is_dummy(item) && dectalk_name(item) in get(params.policy.articulation.place, place, [])"
    description: A us_place bit of an allophone; the dummy vowel has none.
    citations:
      - "DECtalk 4.63 p_us_rom.h:982 us_place"
  artic_stress:
    params: [item]
    body: >-
      item == null ? 0
      : get(artic_is_dummy(item) ? look_back_pred(item, params.policy.articulation.unit_scan_items,'is_dectalk_phone') : item, 'stress', 0)
    description: FSTRESS of an allophone (0 none, 1 primary, 2 secondary, 3 emphasis); a dummy vowel has the plosive's.
    citations:
      - "DECtalk 4.63 ph_defs.h:219-225; ph_inton1.c:1818"
  artic_dummy_half:
    params: [item]
    body: >-
      artic_is_dummy(item)
        ? floor(round(item.duration / params.policy.timing.frame_ms)
                / params.policy.articulation.pressure.dummy_vowel_divisor)
        : 0
    description: Half the frames of a dummy vowel, 0 for any other allophone (allodurs >> 1).
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3815-3818"
  artic_boundary:
    params: [item]
    body: >-
      item == null ? 0.0
      : (artic_is_dummy(item) ? dectalk_boundary(look_back_pred(item, params.policy.articulation.unit_scan_items,'is_dectalk_phone'))
      : (item.phoneme == 'SIL' && get(item, 'punctuationSymbol', null) == '.'
           ? params.policy.timing.boundary.period
      : dectalk_boundary(item)))
    description: >-
      FBOUNDARY of an allophone; a dummy vowel has the plosive's, and the
      silence that ends a clause on a period has FPERNEXT.
    citations:
      - "DECtalk 4.63 ph_inton1.c:1818 (allofeats[nphon + 1] = allofeats[nphon] | FDUMMY_VOWEL)"
      - "DECtalk 4.63 allofeats as printed per frame by the instrumented build: 0400 on the silence after a period, 0 after a comma, semicolon, colon, question mark or exclamation mark; the assignment itself was not located in the source"

predicates:
  is_articulation_unit: >-
    !(current.type in ["stop_release", "stop_aspiration"])

tags:
  subglottal_pressure: sets the subglottal pressure the synthesizer's source model reads
  glottal_chink: sets the posterior glottal chink area
  glottal_area: sets the glottal area, its target or the speed it moves at
  constriction: sets the area of the lips, the tongue blade or the tongue body, or the state that moves it
  voice_formant: sends a formant fixed by the voice
  velum: sets the velopharyngeal area or the step that moves it
  frication_place: sets the code that tells the synthesizer where frication is made
  obstruent_source: sets the DC and UE words that shape an obstruent's source

frame_programs:
  articulation:
    relation: Segment
    unit: { predicate: is_articulation_unit }
    frame_ms: "params.policy.timing.frame_ms"
    # The track's initial silence and the frame before it that is never sent.
    lead_in_frames: >-
      round(get(current, 'utterance_initial_silence_ms',
        (params.policy.timing.pause_frames.clause_initial - params.policy.timing.unemitted_initial_frames)
        * params.policy.timing.frame_ms) / params.policy.timing.frame_ms)
      + params.policy.timing.unemitted_initial_frames
    # ph_claus.c:754-757
    delay_frames: 1
    # p_us_tim.c:229-232: the pause that opens the next clause.
    tail_frames: >-
      current.phoneme == 'SIL' && get(current, 'punctuationSymbol', null) != null && next != null
        ? dectalk_clause_initial_pause_frames(next) : 0
    features:
      # DECtalk's allophone 0 of a clause: the lead-in and each such tail.
      initial: { value: "false", edge: true }
      silence: { value: "current.phoneme == 'SIL' && !isTrue(current, 'dummy_vowel')", edge: true }
      dummy: { value: "artic_is_dummy(current)", edge: false }
      # p_us_rom.h us_featb bits. Silence has FSONOR alone.
      voiced: { value: "artic_has(current, 'voiced')", edge: false }
      syllabic: { value: "artic_has(current, 'syllabic')", edge: false }
      vowel: { value: "artic_has(current, 'vowel')", edge: false }
      son1: { value: "artic_has(current, 'son1')", edge: false }
      sonorant: { value: "artic_has(current, 'sonorant')", edge: true }
      obstruent: { value: "artic_has(current, 'obstruent')", edge: false }
      plosive: { value: "artic_has(current, 'plosive')", edge: false }
      nasal: { value: "artic_has(current, 'nasal')", edge: false }
      consonant: { value: "artic_has(current, 'consonant')", edge: false }
      soncon: { value: "artic_has(current, 'sonorant_consonant')", edge: false }
      burst: { value: "artic_has(current, 'burst')", edge: false }
      stop: { value: "artic_has(current, 'stop')", edge: false }
      # p_us_rom.h us_place bits.
      labial: { value: "artic_place(current, 'labial')", edge: false }
      blade:
        value: >-
          artic_place(current, 'dental') || artic_place(current, 'palatal')
          || artic_place(current, 'alveolar')
        edge: false
      velar: { value: "artic_place(current, 'velar')", edge: false }
      glottal: { value: "artic_place(current, 'glottal')", edge: false }
      # FSTRESS of the allophone's structure word: any stress, and bit 01.
      stressed: { value: "artic_stress(current) > 0", edge: false }
      primary: { value: "artic_stress(current) == 1 || artic_stress(current) == 3", edge: false }
      emphasis: { value: "artic_stress(current) == 3", edge: false }
      is_r: { value: "!artic_is_dummy(current) && dectalk_name(current) == 'R'", edge: false }
      is_rr: { value: "!artic_is_dummy(current) && dectalk_name(current) == 'RR'", edge: false }
      is_l: { value: "!artic_is_dummy(current) && dectalk_name(current) in ['LL', 'LX']", edge: false }
      # allophons[nphone + 1] == allophons[nphone + 2]
      next_repeats:
        value: >-
          artic_next_unit(current) != null && artic_next_unit(artic_next_unit(current)) != null
          && !artic_is_dummy(artic_next_unit(current))
          && !artic_is_dummy(artic_next_unit(artic_next_unit(current)))
          && dectalk_name(artic_next_unit(current)) == dectalk_name(artic_next_unit(artic_next_unit(current)))
        edge: false
      alveolar: { value: "artic_place(current, 'alveolar')", edge: false }
      is_dh_th:
        value: "!artic_is_dummy(current) && dectalk_name(current) in ['DH', 'TH']"
        edge: false
      is_dh_th_dz:
        value: "!artic_is_dummy(current) && dectalk_name(current) in ['DH', 'TH', 'DZ']"
        edge: false
      is_flap:
        value: "!artic_is_dummy(current) && dectalk_name(current) in ['DX', 'DF']"
        edge: false
      # us_burdr through mstofr: the burst's length in frames.
      burst_frames:
        value: >-
          artic_is_dummy(current) ? 0
          : get(params.policy.articulation.burst_frames, dectalk_name(current), 0)
        edge: 0
      dental: { value: "artic_place(current, 'dental')", edge: false }
      palatal: { value: "artic_place(current, 'palatal')", edge: false }
      is_w_or_r: { value: "!artic_is_dummy(current) && dectalk_name(current) in ['W', 'R']", edge: false }
      # us_begtyp: 1 front, 3 rounded back; a dummy vowel is IX or AX.
      onset:
        value: >-
          (artic_is_dummy(current) ? get(current, 'dummy_phone', 'IX') : dectalk_name(current))
            in params.policy.timing.front_onset_phones ? 'front'
          : ((artic_is_dummy(current) ? get(current, 'dummy_phone', 'IX') : dectalk_name(current))
            in params.policy.articulation.rounded_onset_phones ? 'round' : 'other')
        edge: other
      is_dh: { value: "!artic_is_dummy(current) && dectalk_name(current) == 'DH'", edge: false }
      is_affricate:
        value: "!artic_is_dummy(current) && dectalk_name(current) in ['CH', 'JH']"
        edge: false
      # p_us_st1.c:1397-1400: the allophone two back is /s/ with no boundary after it.
      after_s_cluster:
        value: >-
          dectalk_name(artic_prev_unit(artic_prev_unit(current))) == 'S'
          && artic_boundary(artic_prev_unit(artic_prev_unit(current))) == 0.0
        edge: false
      after_s:
        value: "dectalk_name(artic_prev_unit(artic_prev_unit(current))) == 'S'"
        edge: false
      # ph_sort.c:1464 number_words, as postlexical.yaml reads it.
      # ph_sort.c:1464 number_words: a word entered with a word boundary; a
      # verb-phrase start is not counted (pipeline.yaml is_counted_word_start).
      counted_word:
        value: "dectalk_word_start(current) && dectalk_phrase_start(current) != 'vp'"
        edge: false
      # FSON1 of the clause's allophones at nallotot - 2 and nallotot - 3: the
      # last before the final silence and the one before it.
      end_2_son1:
        value: >-
          artic_has(artic_prev_unit(look_ahead_where(current, 1000,
            'candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null')), 'son1')
        edge: false
      end_3_son1:
        value: >-
          artic_has(artic_prev_unit(artic_prev_unit(look_ahead_where(current, 1000,
            'candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null'))), 'son1')
        edge: false
      # The allophone's code (l_all_ph.h); silence is 0, the dummy vowel IX or AX.
      phone_code:
        value: >-
          params.policy.articulation.phone_code[
            artic_is_dummy(current) ? get(current, 'dummy_phone', 'IX') : dectalk_name(current)]
        edge: 0
      # FBOUNDARY of this allophone and of the ones two and three after it.
      boundary: { value: "artic_boundary(current)", edge: 0 }
      boundary_2: { value: "artic_boundary(artic_next_unit(artic_next_unit(current)))", edge: 0 }
      boundary_3:
        value: "artic_boundary(artic_next_unit(artic_next_unit(artic_next_unit(current))))"
        edge: 0
      # How many input phones this allophone stands for: none for a dummy
      # vowel (added after the count), two for a vowel fused with its /r/ and
      # for the survivor of a deleted geminate (annotation.yaml, hat pattern).
      phonemes:
        value: >-
          artic_is_dummy(current) ? 0
          : 1 + (isTrue(current, 'fused_with_r') ? 1 : 0)
              + (isTrue(current, 'after_deleted_geminate') ? 1 : 0)
        edge: 1
      # ph_draw.c:3812-3870 reads allophone arrays at nphonetot - 2 and
      # nphonetot - 1, a count of input phones used as an allophone index. From
      # an allophone with `left` phones left (nphonetot - nphone) those are
      # the allophones left - 2 and left - 1 further on: what the rule needs
      # of them, for the offsets it can reach.
      voiceless_obstruent_1:
        value: >-
          artic_has(artic_next_unit(current), 'obstruent')
          && !artic_has(artic_next_unit(current), 'voiced')
        edge: false
      voiceless_obstruent_2:
        value: >-
          artic_has(artic_next_unit(artic_next_unit(current)), 'obstruent')
          && !artic_has(artic_next_unit(artic_next_unit(current)), 'voiced')
        edge: false
      dummy_half_1: { value: "artic_dummy_half(artic_next_unit(current))", edge: 0 }
      dummy_half_2:
        value: "artic_dummy_half(artic_next_unit(artic_next_unit(current)))"
        edge: 0
      dummy_half_3:
        value: "artic_dummy_half(artic_next_unit(artic_next_unit(artic_next_unit(current))))"
        edge: 0
      # tcumdur is not added to from the syllabic where phinton's walk stops
      # (prosody.yaml dectalk_segmental_f0_phone, Ph_inton2.c:809-819, 1659-1671).
      counted:
        value: >-
          !isTrue(current, 'intonation_stops')
          && (look_back_where(current, 1000,
                '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null) || isTrue(candidate, "intonation_stops")') == null
              || look_back_where(current, 1000,
                '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null) || isTrue(candidate, "intonation_stops")').phoneme == 'SIL')
        edge: true
    group:
      # A clause starts at its initial silence.
      start: "u.initial"
      totals:
        # tcumdur: the initial silence and every phone phinton counted, dummy
        # vowels included, but not the final silence (ph_inton1.c:1765-1777,
        # 1817).
        counted_frames: "(u.silence && !u.initial) || !u.counted ? 0 : f.count"
        # nphonetot: the clause's input phones, both silences included.
        phonemes: "u.phonemes"
        # number_words
        words: "u.counted_word ? 1 : 0"
    registers:
      # ph_claus.c:217-221 sets pressure to 10000 at start-up; the reset at
      # ph_draw.c:925 replaces it in the first frame of every clause.
      pressure: 200
      pressure_drop: 0
      syl_pressure: 0
      # ph_draw.c:1509-1552
      stress_pulse: 0
      # Inputs of the final fall: nphonetot - nphone, value - nframb, and the
      # pressure it falls to (ph_draw.c:3812-3870).
      phones_left: 0
      fall_frames: 0
      fall_floor: 500
      # ph_draw.c:929-930
      target_ap: 0
      area_ap: 0
      ps: 0
      # ph_draw.c:927-928. agspeed is not set at start-up; the structure it
      # lives in is zeroed, and every path through the initial silence but one
      # (a voiceless phone that is not a burst stop) sets it.
      target_ag: 400
      area_g: 0
      agspeed: 0
      delta_area_g: 0
      # PAV.tspesh of the current phone (p_us_st1.c Special Rule 2), in frames.
      vot: 0
      # The constrictions: lips, tongue blade, tongue body (ph_draw.c:931-940).
      # Each has a target, an area, a release step into area_release, and
      # closure and release flags. in_lfric and last_area_tb exist in DECtalk
      # but nothing ever sets them; they are 0 here by not existing (a read
      # of last_area_tb is written as 0).
      target_l: 1000
      area_l: 1000
      target_b: 1000
      area_b: 1000
      target_tb: 1000
      area_tb: 1000
      lstep: 0
      bstep: 0
      tbstep: 0
      in_lclosure: false
      in_lrelease: false
      in_bclosure: false
      in_brelease: false
      in_tbclosure: false
      in_tbrelease: false
      area_flap: 1200
      last_area_l: 0
      last_area_b: 0
      # tspesh of PAREAL, PAREAB and PTONGUEBODY: the frame the closure ends
      # (p_us_st1.c Special Rule 1); 0 when the phone has no burst there.
      closure: 0
      # Which branch of an articulator's update the frame takes.
      move_case: 0
      # The velum: nasal_step indexes the nasalization table (ph_draw.c:219).
      area_n: 0
      nasal_step: 0
      # ph_draw.c:1314-1465: dcstep indexes dcval and ueval by its size.
      dcstep: 0
      dc: 0
      ue: 0
      # OUT_A2's code, the code to carry into the next phone, OUT_BRST, OUT_PLACE.
      a2: 0
      lastthing: 0
      brst: 0
      place: 0
      ts_l: 0
      ts_b: 0
      ts_tb: 0
    outputs:
      PS: "r.ps"
      # ph_draw.c:4101-4104. delta_area_gst is only ever reset and
      # delta_area_gstop moves only for a German phone (3994-4014).
      AG: "max([r.area_g, 0])"
      # ph_draw.c:4100
      CNK: "r.area_ap + params.policy.articulation.voice.chink"
      # ph_draw.c:4189
      F4: "params.policy.articulation.voice.f4"
      # ph_claus.c:453: the allophone as phdraw sees it, font in the high byte.
      PH: "params.policy.articulation.phone_font + u.phone_code"
      # Not a packet word: the frame clock of the dectalk-vtm node
      # (crates/dectalk-vtm/src/backend.rs), 1 while packets are being sent.
      run: "1"
      # ph_draw.c:4106-4117
      AL: "r.area_l"
      ABLADE: "min([r.area_flap, r.area_b])"
      ATB: "r.area_tb"
      # ph_draw.c:4193
      AREA_N: "r.area_n"
      # ph_draw.c:1427-1464
      DC: "r.dc"
      UE: "r.ue"
      A2_CODE: "r.a2"
      BRST: "r.brst"
      PLACE: "r.place"
    after:
      run: 0
    write: articulation_frames
    tag: subglottal_pressure
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:908-4221 (HLSYN section of phdraw)"

rules:
  # --- allophone 0, once: ph_draw.c:912-941 --------------------------------
  artic_initial_reset_pressure:
    kind: frame
    program: articulation
    unit: "u.initial"
    when: "f.index == 0"
    set:
      - { register: pressure, value: 200, tag: subglottal_pressure }
      - { register: pressure_drop, value: 0, tag: subglottal_pressure }
      - { register: syl_pressure, value: 0, tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:925-926, 941"
  # The burst-stop and fricative branches set 200 again (998, 1073).
  artic_initial_pressure_before_voiced_labial:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && n.labial"
    set:
      - { register: pressure, value: 300, tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1078, 1111-1121"

  # --- a later silence, every frame: ph_draw.c:1223-1237 -------------------
  artic_silence_pressure_drop:
    kind: frame
    program: articulation
    unit: "u.silence && !u.initial"
    when: "r.pressure > 100 && r.pressure_drop < 2000"
    set:
      - { register: pressure_drop, value: "r.pressure_drop + 150", tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1227-1230"

  # --- a phone that is not silence, every frame: ph_draw.c:1474-1506 -------
  artic_pressure_rise_voiced:
    kind: frame
    program: articulation
    unit: "!u.silence && u.voiced"
    when: "r.pressure <= params.policy.articulation.voice.sub_pressure"
    set:
      - { register: pressure, value: "r.pressure + 70", tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1474-1481"
  artic_pressure_rise_voiceless:
    kind: frame
    program: articulation
    unit: "!u.silence && !u.voiced"
    when: "r.pressure <= params.policy.articulation.voice.sub_pressure"
    set:
      - { register: pressure, value: "r.pressure + 50", tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1474, 1490-1495"

  # --- every phone, every frame: ph_draw.c:2798-2804 -----------------------
  # A second rise in the same frame, after the block for non-silent phones
  # has closed.
  artic_pressure_rise_voiced_again:
    kind: frame
    program: articulation
    unit: "u.voiced"
    when: "r.pressure <= params.policy.articulation.voice.sub_pressure"
    set:
      - { register: pressure, value: "r.pressure + 70", tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2799-2803"

  # --- the fall over the clause's last phones: ph_draw.c:3795-3887 ---------
  # In a syllabic within four phones of the clause's end, at or near a phrase
  # boundary, once: the slope that takes the pressure down to 450 or 500 by
  # the end of the clause. The `if (FSYLL)` at 3795 has no braces and governs
  # only this block. Integer division; the numerator is positive here.
  # The slope is added once inside the block (3887) and again by the rule
  # after these (3985) in the frame that computes it.
  #
  # Its inputs first. `value` is tcumdur, less half the allophone at
  # nphonetot - 1 when that is a dummy vowel; the pressure falls to 450 when
  # the allophone at nphonetot - 2 is a voiceless obstruent and to 500
  # otherwise. Both indices are reproduced as compiled, for the offsets a
  # phone within four of the end can reach; at any other offset the dummy
  # half is 0 and the floor 500.
  artic_fall_inputs:
    kind: frame
    program: articulation
    unit: "u.syllabic"
    when: "r.syl_pressure == 0"
    set:
      - { register: phones_left, value: "g.phonemes - g.unit", tag: subglottal_pressure }
      - register: fall_frames
        value: >-
          g.counted_frames - (g.frame + 1)
          - (r.phones_left == 1 ? (u.dummy ? floor(f.count / params.policy.articulation.pressure.dummy_vowel_divisor) : 0)
             : (r.phones_left == 2 ? u.dummy_half_1
             : (r.phones_left == 3 ? u.dummy_half_2
             : (r.phones_left == 4 ? u.dummy_half_3 : 0))))
        tag: subglottal_pressure
      - register: fall_floor
        value: >-
          (r.phones_left == 1 ? (p.obstruent && !p.voiced)
           : (r.phones_left == 2 ? (u.obstruent && !u.voiced)
           : (r.phones_left == 3 ? u.voiceless_obstruent_1
           : (r.phones_left == 4 ? u.voiceless_obstruent_2 : false)))) ? 450 : 500
        tag: subglottal_pressure
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3812-3825, 3850-3870"
  artic_syllable_pressure_slope:
    kind: frame
    program: articulation
    unit: >-
      u.syllabic
      && (u.boundary >= params.policy.timing.boundary.pp
          || u.boundary_2 >= params.policy.timing.boundary.pp
          || u.boundary_3 >= params.policy.timing.boundary.pp)
    when: >-
      r.syl_pressure == 0 && r.phones_left <= 4
      && g.frame + 1 > 9
      && r.fall_frames > 0
      && g.counted_frames - (g.frame + 1) > 0
    set:
      - register: syl_pressure
        value: >-
          r.pressure - r.fall_floor >= 0 ? floor((r.pressure - r.fall_floor) / r.fall_frames)
          : 0 - floor((r.fall_floor - r.pressure) / r.fall_frames)
        tag: subglottal_pressure
      - { register: pressure_drop, value: "r.pressure_drop + r.syl_pressure", tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3795-3830, 3850-3870, 3887"
  artic_pressure_drop_by_slope:
    kind: frame
    program: articulation
    set:
      - { register: pressure_drop, value: "r.pressure_drop + r.syl_pressure", tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3985"

  # --- the packet: ph_draw.c:4098-4190 --------------------------------------
  artic_chink_area:
    kind: frame
    program: articulation
    set:
      - { register: area_ap, value: "r.area_ap + floor((r.target_ap - r.area_ap) / 4)", tag: glottal_chink }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4098 (area_ap += (target_ap - area_ap) >> 2)"

  # --- emphasis, a phone that is not silence, every frame: ph_draw.c:1509-1552
  # A phone with emphatic stress adds a pulse to the pressure over its last
  # NF130MS (20 frames), a step a frame up to the voice's limit, and takes it
  # back before that; any other phone clears it. A silence leaves it alone.
  artic_emphasis_pulse:
    kind: frame
    program: articulation
    unit: "!u.silence && u.emphasis"
    set:
      - register: stress_pulse
        value: >-
          f.index <= f.count - 20
            ? (r.stress_pulse > 0 ? r.stress_pulse - params.policy.articulation.voice.stress_step : r.stress_pulse)
            : (r.stress_pulse < params.policy.articulation.voice.stress_pressure
                ? r.stress_pulse + params.policy.articulation.voice.stress_step : r.stress_pulse)
        tag: subglottal_pressure
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1509-1523"
  artic_no_emphasis:
    kind: frame
    program: articulation
    unit: "!u.silence && !u.emphasis"
    set:
      - { register: stress_pulse, value: 0, tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1550-1552"
  artic_pressure_out:
    kind: frame
    program: articulation
    set:
      - { register: ps, value: "r.pressure - r.pressure_drop + r.stress_pulse", tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4178"
  # `tmp < 100 && nphone > 1 || tmp < 0`
  artic_pressure_out_floor:
    kind: frame
    program: articulation
    when: "(r.ps < 100 && g.unit > 1) || r.ps < 0"
    set:
      - { register: pressure_drop, value: 0, tag: subglottal_pressure }
      - { register: pressure, value: 0, tag: subglottal_pressure }
      - { register: syl_pressure, value: 0, tag: subglottal_pressure }
      - { register: ps, value: 0, tag: subglottal_pressure }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4180-4187"

  # ===========================================================================
  # The glottis: target_ag, agspeed, area_g, delta_area_g, and target_ap.
  # ===========================================================================

  # --- voice onset time of the phone: p_us_st1.c:1362-1442 -----------------
  # Special Rule 2, HLSYN build: aspiration of a voiceless plosive runs `vot`
  # frames into the sonorant after it. NF60MS is 9 frames, NF7MS 1, NF15MS 2,
  # NF20MS 3 (ph_defs.h:435-443); durfon is the phone's length in frames.
  artic_vot_none:
    kind: frame
    program: articulation
    when: "f.index == 0"
    set:
      - { register: vot, value: 0, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/p_us_st1.c:1362 (vot = 0)"
  artic_vot_after_voiceless_plosive:
    kind: frame
    program: articulation
    unit: "p.plosive && !p.voiced && u.sonorant && !u.initial && !(u.silence)"
    when: "f.index == 0"
    set:
      - register: vot
        value: "u.stressed ? params.policy.articulation.vot.stressed : params.policy.articulation.vot.unstressed"
        tag: glottal_area
      - register: vot
        value: >-
          (u.soncon || u.is_rr) ? r.vot + params.policy.articulation.vot.sonorant_consonant_bonus
          : (u.after_s ? (u.after_s_cluster ? params.policy.articulation.vot.s_cluster : r.vot)
          : (!u.syllabic ? r.vot + params.policy.articulation.vot.nonsyllabic_bonus : r.vot))
        tag: glottal_area
      - { register: vot, value: "r.vot >= f.count ? f.count - 1 : r.vot", tag: glottal_area }
      - register: vot
        value: >-
          r.vot > floor(f.count / params.policy.articulation.vot.syllabic_divisor)
            && u.syllabic && u.primary
          ? floor(f.count / params.policy.articulation.vot.syllabic_divisor) : r.vot
        tag: glottal_area
      - { register: vot, value: "u.dummy ? f.count : r.vot", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/p_us_st1.c:1363-1441 (Special Rule 2: PAV.tspesh = vot)"

  # --- closing the glottis through the aspiration: ph_draw.c:524-590 --------
  # In the parameter loop, so before everything below in the same frame.
  artic_vot_slow_drop:
    kind: frame
    program: articulation
    unit: "u.son1 && !u.dummy"
    when: >-
      r.vot != 0 && f.index == params.policy.articulation.aspiration.slow_drop_frame
      && r.vot > params.policy.articulation.aspiration.slow_drop_longer_than
      && params.policy.articulation.voice.vot_speed != 0
    set:
      - register: target_ag
        value: "min([r.target_ag, params.policy.articulation.voice.glottis_voiced + 900])"
        tag: glottal_area
      - { register: agspeed, value: 3, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:538-552"
  artic_vot_speed:
    kind: frame
    program: articulation
    unit: "u.son1 && !u.dummy"
    when: >-
      r.vot != 0 && f.index == r.vot - params.policy.articulation.aspiration.close_before_end
      && params.policy.articulation.voice.vot_speed != 0
    set:
      - { register: agspeed, value: "params.policy.articulation.voice.vot_speed", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:553-559"
  artic_vot_five_before:
    kind: frame
    program: articulation
    unit: "u.son1 && !u.dummy"
    when: "r.vot != 0 && f.index == r.vot - params.policy.articulation.aspiration.close_before_end"
    set:
      - register: target_ag
        value: "min([r.target_ag, params.policy.articulation.voice.glottis_voiced + 800])"
        tag: glottal_area
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:553, 561-562"
  # `else if`: not in the frame the rule above took.
  artic_vot_two_before:
    kind: frame
    program: articulation
    unit: "u.son1 && !u.dummy"
    when: >-
      r.vot != 0 && f.index != r.vot - params.policy.articulation.aspiration.close_before_end
      && f.index == r.vot - params.policy.articulation.aspiration.last_before_end
    set:
      - register: target_ag
        value: "min([r.target_ag, params.policy.articulation.voice.glottis_voiced + 380])"
        tag: glottal_area
      - register: agspeed
        value: >-
          params.policy.articulation.voice.vot_speed > params.policy.articulation.aspiration.fast_voice_speed_over
            && r.vot >= params.policy.articulation.aspiration.fast_voice_at_least
          ? params.policy.articulation.aspiration.fast_voice_speed : 1
        tag: glottal_area
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:564-578"
  artic_vot_end:
    kind: frame
    program: articulation
    unit: "u.son1 && !u.dummy"
    when: "r.vot != 0 && f.index == r.vot"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:580-590"

  # --- allophone 0: ph_draw.c:919-1076 once, 1085-1202 every frame ---------
  # The `if (nphone != nphonelast)` at 912 closes at 1080: the reset and the
  # obstruent cases run once, the voiced and voiceless cases below them on
  # every frame of the silence. Seen in DECtalk itself: before a vowel the
  # area is set to 0 and steps to 200 on each of the four frames, while
  # before /b/ or /dh/ it starts at 400 once and keeps moving.
  artic_initial_reset_glottis:
    kind: frame
    program: articulation
    unit: "u.initial"
    when: "f.index == 0"
    set:
      - { register: delta_area_g, value: 0, tag: glottal_area }
      - { register: target_ag, value: 400, tag: glottal_area }
      - { register: area_g, value: 0, tag: glottal_area }
      - { register: target_ap, value: 0, tag: glottal_chink }
      - { register: area_ap, value: 0, tag: glottal_chink }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:919-930"
  artic_initial_before_voiced_burst_stop:
    kind: frame
    program: articulation
    unit: "u.initial && n.obstruent && n.burst && n.stop && n.voiced"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
      - { register: area_g, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
      - { register: agspeed, value: 2, tag: glottal_area }
      - { register: target_ap, value: 100, tag: glottal_chink }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:953-966"
  artic_initial_before_voiceless_burst_stop:
    kind: frame
    program: articulation
    unit: "u.initial && n.obstruent && n.burst && n.stop && !n.voiced"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_open", tag: glottal_area }
      - { register: area_g, value: "params.policy.articulation.voice.glottis_open", tag: glottal_area }
      - { register: agspeed, value: 3, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:974-980"
  # An obstruent without a burst, made with the blade.
  artic_initial_before_blade_fricative:
    kind: frame
    program: articulation
    unit: "u.initial && n.obstruent && !(n.burst && n.stop) && n.blade"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
      - { register: area_g, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
      - { register: agspeed, value: 3, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1049-1067"
  artic_initial_before_voiced:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced"
    set:
      - { register: agspeed, value: 2, tag: glottal_area }
      - register: target_ag
        value: >-
          n.obstruent ? params.policy.articulation.voice.glottis_voiced_obstruent
          : params.policy.articulation.voice.glottis_voiced
        tag: glottal_area
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1085-1103"
  artic_initial_before_vowel:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && n.vowel"
    set:
      - { register: area_g, value: 0, tag: glottal_area }
      - { register: agspeed, value: 1, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1132-1139"
  artic_initial_before_voiceless:
    kind: frame
    program: articulation
    unit: "u.initial && !n.voiced"
    set:
      - { register: area_g, value: 1410, tag: glottal_area }
      - { register: target_ag, value: 1410, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1194-1197"

  # --- a later silence, once: ph_draw.c:1239, 1290-1308 --------------------
  artic_silence_after_sonorant:
    kind: frame
    program: articulation
    unit: "u.silence && !u.initial && p.son1"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: 1800, tag: glottal_area }
      - { register: area_g, value: "r.area_g - 80", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1290-1296"
  artic_silence_after_obstruent:
    kind: frame
    program: articulation
    unit: "u.silence && !u.initial && p.obstruent"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: 2500, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1297-1300"
  artic_silence_after_voiceless:
    kind: frame
    program: articulation
    unit: "u.silence && !u.initial && !p.voiced"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: 1800, tag: glottal_area }
      - { register: area_g, value: "r.area_g + 100", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1302-1308"

  # --- a phone that is not silence, once: ph_draw.c:1555-1982 --------------
  artic_chink_closes_after_voiced_obstruent:
    kind: frame
    program: articulation
    unit: "!u.silence && p.obstruent && p.voiced"
    when: "f.index == 0"
    set:
      - { register: target_ap, value: 0, tag: glottal_chink }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1557-1563"
  artic_voiced_glottal_obstruent:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && u.voiced && u.glottal"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottal_stop_area", tag: glottal_area }
      - { register: agspeed, value: 1, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1596-1608"
  artic_voiced_obstruent:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && u.voiced && !u.glottal"
    when: "f.index == 0"
    set:
      - register: target_ag
        value: "u.stop ? params.policy.articulation.voice.glottis_voiced_obstruent : 600"
        tag: glottal_area
      - { register: agspeed, value: 2, tag: glottal_area }
      - { register: target_ap, value: "u.stop ? 200 : 600", tag: glottal_chink }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1610-1634"
  # The cap applies when the next allophone's structure word has no stress.
  artic_voiceless_obstruent:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.voiced"
    when: "f.index == 0"
    set:
      - register: target_ag
        value: >-
          n.stressed ? params.policy.articulation.voice.glottis_open
          : min([params.policy.articulation.voice.glottis_open, 1400])
        tag: glottal_area
      - { register: agspeed, value: 1, tag: glottal_area }
      - { register: target_ap, value: 0, tag: glottal_chink }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1654-1681"
  # An obstruent without a burst (`feat & 004000`, FBURST) and with no lip,
  # blade or velar place.
  artic_placeless_obstruent:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.burst && !u.labial && !u.blade && !u.velar"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: 1000, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1756-1857"
  artic_chink_closed_in_non_obstruent:
    kind: frame
    program: articulation
    unit: "!u.silence && !u.obstruent"
    when: "f.index == 0"
    set:
      - { register: target_ap, value: 0, tag: glottal_chink }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1862-1864"
  # A stop without a burst: the three `if`s are tried in this order and each
  # that holds assigns.
  artic_burstless_stop_blade:
    kind: frame
    program: articulation
    unit: "!u.silence && u.stop && !u.burst && u.blade"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
      - { register: agspeed, value: 1, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1865-1891"
  artic_burstless_stop_velar:
    kind: frame
    program: articulation
    unit: "!u.silence && u.stop && !u.burst && u.velar"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
      - { register: agspeed, value: 2, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1893-1900"
  artic_burstless_stop_labial:
    kind: frame
    program: articulation
    unit: "!u.silence && u.stop && !u.burst && u.labial"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1902-1915"
  artic_dummy_vowel_glottis:
    kind: frame
    program: articulation
    unit: "!u.silence && u.son1 && u.dummy"
    when: "f.index == 0"
    set:
      - register: target_ag
        value: >-
          p.voiced ? params.policy.articulation.voice.glottis_voiced_obstruent + 100
          : params.policy.articulation.voice.glottis_open + 100
        tag: glottal_area
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1933, 1949-1957"
  artic_sonorant_glottis:
    kind: frame
    program: articulation
    unit: "!u.silence && u.son1 && !u.dummy && !(p.plosive && !p.voiced)"
    when: "f.index == 0"
    set:
      - { register: target_ag, value: "params.policy.articulation.voice.glottis_voiced", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1960-1964"

  # --- a vowel, every frame: ph_draw.c:1986-2040 ---------------------------
  # The block for German vowels at 1988-2027 never matches a US phone code.
  # 2029-2035: before an obstruent that is neither a stop nor has a burst.
  artic_vowel_before_fricative:
    kind: frame
    program: articulation
    unit: "!u.silence && u.vowel && n.obstruent && !n.stop && !n.burst"
    set:
      - { register: target_ag, value: "r.target_ag + 20", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2029-2035"
  # 2036-2040: the braces after that `if` are not its body. Reproduced as
  # compiled: every vowel opens toward 1200 in its last frame.
  artic_vowel_last_frame:
    kind: frame
    program: articulation
    unit: "!u.silence && u.vowel"
    when: "f.index >= f.count - 1"
    set:
      - { register: target_ag, value: 1200, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2036-2040"

  # From here on the C is outside the three-way split on allophone 0, silence
  # and other phones, which ends at 1983: these rules run in every phone, the
  # silences included (the compiled listing's brace depth says so, and
  # DECtalk's own values before an utterance-initial /h/ agree).
  #
  # 2112-2120: before a voiceless sonorant consonant (/h/), so that no
  # glottal pulse sounds at its release.
  artic_vowel_before_voiceless_sonorant:
    kind: frame
    program: articulation
    unit: "!n.dummy && !n.voiced && n.sonorant && n.consonant"
    when: "f.index >= f.count - 2"
    set:
      - { register: target_ag, value: 1800, tag: glottal_area }
      - { register: agspeed, value: 3, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2112-2120"

  # 2140-2150: in a voiceless sonorant consonant itself, every frame.
  artic_voiceless_sonorant_glottis:
    kind: frame
    program: articulation
    unit: "!u.dummy && !u.voiced && u.sonorant && u.consonant"
    set:
      - { register: target_ag, value: 1800, tag: glottal_area }
      - { register: agspeed, value: 2, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2140-2150"

  # --- before a voiceless sonorant consonant: ph_draw.c:2165-2192 ----------
  artic_before_voiceless_sonorant:
    kind: frame
    program: articulation
    unit: "!n.dummy && !n.voiced && n.sonorant && n.consonant"
    when: >-
      f.index >= f.count - 7
      && r.target_ag < params.policy.articulation.voice.unvoiced_sonorant
      && r.target_ag < 1100
    set:
      - { register: target_ag, value: "r.target_ag + (u.nasal ? 50 : 80)", tag: glottal_area }
      - { register: agspeed, value: 1, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2165-2192"

  # --- CH and JH, every frame: ph_draw.c:2251-2259 -------------------------
  # In the chain that picks the frication code by place (2197-2312).
  artic_affricate_speed:
    kind: frame
    program: articulation
    unit: "!u.silence && u.is_affricate"
    set:
      - { register: agspeed, value: 2, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2251-2259"

  # --- a sonorant consonant, every frame: ph_draw.c:2340-2397 --------------
  artic_sonorant_consonant_speed:
    kind: frame
    program: articulation
    unit: "!u.silence && u.soncon"
    when: >-
      f.index <= floor(f.count / 2)
        ? (r.target_ag < params.policy.articulation.voice.glottis_voiced + 300 && !u.is_r)
        : r.target_ag > params.policy.articulation.voice.glottis_voiced
    set:
      - { register: agspeed, value: 1, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2340-2357"
  # 2379-2388 (before LL or LX) tests `(!phone_feature(...) & FSTOP)`, which is
  # never true for a phone with any feature bit: no rule.
  artic_lateral_glottis:
    kind: frame
    program: articulation
    unit: "!u.silence && u.is_l"
    set:
      - { register: target_ag, value: 600, tag: glottal_area }
      - { register: agspeed, value: 3, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2390-2397"

  # --- a nasal, every frame: ph_draw.c:2400-2515 ---------------------------
  artic_nasal_glottis:
    kind: frame
    program: articulation
    unit: "!u.silence && u.nasal"
    set:
      - { register: target_ag, value: 700, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2400, 2505-2515"

  # --- opening for the next phone, every frame: ph_draw.c:2676-2797 --------
  # The last branch of the chain that starts at 2400: reached only when this
  # phone is not a nasal, and not when the next is a nasal unless the phone
  # after that is the same nasal again (2526-2530, 2586).
  # NF60MS is 9 frames, NF50MS 8 (ph_defs.h:442-443).
  artic_unstressed_before_voiceless_fricative_late:
    kind: frame
    program: articulation
    unit: "!u.nasal && !u.obstruent && n.obstruent && !u.stressed && !n.voiced && !n.stop"
    when: "f.index >= f.count - 9 && f.index >= floor(f.count / 2) && r.target_ag < 1000"
    set:
      - { register: target_ag, value: "r.target_ag + 10", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2676-2689"
  artic_unstressed_before_voiceless_fricative_early:
    kind: frame
    program: articulation
    unit: "!u.nasal && !u.obstruent && n.obstruent && !u.stressed && !n.voiced && !n.stop"
    when: "!(f.index >= f.count - 9 && f.index >= floor(f.count / 2)) && r.target_ag < 1100"
    set:
      - { register: target_ag, value: "r.target_ag + (r.target_ag < 700 ? 75 : 40)", tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2690-2699"
  artic_plosive_before_nasal:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && u.plosive && n.nasal && u.next_repeats"
    when: "f.index >= f.count - 8 && r.target_ag > 1100"
    set:
      - { register: target_ag, value: 1100, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2701-2712"
  artic_fricative_before_voiced_closing:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.plosive && n.voiced && !n.nasal && !n.stop && !n.is_r"
    when: "r.target_ag >= 800 && f.index >= f.count - 8"
    set:
      - { register: target_ag, value: "min([r.target_ag, 1200])", tag: glottal_area }
      - { register: agspeed, value: 1, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2713-2730"
  artic_fricative_before_voiced_open:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.plosive && n.voiced && !n.nasal"
    when: "r.target_ag >= 800 && !(f.index >= f.count - 8 && !n.stop)"
    set:
      - { register: agspeed, value: 3, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2718-2721, 2731-2738"
  artic_fricative_before_voiced_low:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.plosive && n.voiced && !n.nasal"
    when: "r.target_ag < 800"
    set:
      - { register: agspeed, value: 2, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2740-2746"

  # --- spreading the glottis toward the end of the clause: ph_draw.c:3601-3660
  # nframb > tcumdur - 12 and - 25, with nframb - tcumdur = g.frame + 1 -
  # g.counted_frames; nphone is g.unit and nallotot g.units. Two tests jump
  # past the step (`goto abort_til_later`, 3604-3624): among the last phones
  # before the final silence when the phone at nallotot - 3 is a sonorant and
  # this one comes before it, and earlier in the clause when the phone at
  # nallotot - 2 is one. The step is 5 in a clause of fewer than three
  # counted words, else the voice's.
  artic_end_of_clause_spread:
    kind: frame
    program: articulation
    unit: >-
      g.unit < g.units - 1
      && !(g.unit >= g.units - 4
           ? (g.unit > 3 && u.end_3_son1 && g.unit < g.units - 3)
           : (g.unit > 3 && u.end_2_son1 && g.unit < g.units - 4))
    when: "g.frame + 1 > g.counted_frames - 12 && r.delta_area_g < 800"
    set:
      - register: delta_area_g
        value: "r.delta_area_g + (g.words < 3 ? 5 : params.policy.articulation.voice.end_of_phrase_spread)"
        tag: glottal_area
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3602-3647"
  artic_no_spread_before_the_end:
    kind: frame
    program: articulation
    when: "!(g.frame + 1 > g.counted_frames - 12)"
    set:
      - { register: delta_area_g, value: 0, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3602, 3653-3659"

  # --- the glottis moves: ph_draw.c:4016-4081 ------------------------------
  artic_glottis_after_voiced_glottal:
    kind: frame
    program: articulation
    unit: "p.voiced && p.glottal"
    set:
      - { register: agspeed, value: 3, tag: glottal_area }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4016-4025"
  # A step over 300 is limited to 250, and then delta_area_g is not added.
  # `>>` is an arithmetic shift: floor.
  artic_glottis_step:
    kind: frame
    program: articulation
    set:
      - register: area_g
        value: >-
          floor((r.target_ag - r.area_g) / pow(2, r.agspeed)) > 300 ? r.area_g + 250
          : r.area_g + floor((r.target_ag - r.area_g) / pow(2, r.agspeed)) + r.delta_area_g
        tag: glottal_area
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4075-4081"

  # ===========================================================================
  # The constrictions: lips (l), tongue blade (b), tongue body (tb).
  # ===========================================================================

  # --- when the closure ends: p_us_st1.c:1247-1343 (Special Rule 1) ---------
  # closure_dur = durfon - bdur, the burst a frame shorter before an obstruent
  # or in a short phone when it is longer than one frame; it is the tspesh of
  # the articulator that makes the closure: lips, else blade, else tongue body.
  artic_closure_end:
    kind: frame
    program: articulation
    when: "f.index == 0"
    set:
      - register: closure
        value: >-
          !u.burst ? 0
          : f.count - (u.burst_frames > 1
              && ((u.plosive && n.obstruent) || f.count < params.policy.articulation.closure.short_phone_frames)
              ? u.burst_frames - 1 : u.burst_frames)
        tag: constriction
      - register: closure
        value: >-
          u.is_affricate
            ? max([min([r.closure, params.policy.articulation.closure.affricate_max_frames]),
                   params.policy.articulation.closure.affricate_min_frames])
            : r.closure
        tag: constriction
      - { register: ts_l, value: "u.burst && u.labial ? r.closure : 0", tag: constriction }
      - { register: ts_b, value: "u.burst && !u.labial && u.blade ? r.closure : 0", tag: constriction }
      - register: ts_tb
        value: "u.burst && !u.labial && !u.blade && u.velar ? r.closure : 0"
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/p_us_st1.c:1247-1343"

  # --- closure and release flags, every frame: ph_draw.c:740-886 -----------
  # In the parameter loop, before the rest of the frame.
  artic_lips_closure_over:
    kind: frame
    program: articulation
    when: "r.ts_l != 0 && f.index >= r.ts_l"
    set:
      - { register: in_brelease, value: false, tag: constriction }
      - { register: in_lclosure, value: false, tag: constriction }
      - register: target_l
        value: >-
          u.consonant && u.plosive && !n.plosive && !n.labial
            ? params.policy.articulation.voice.fricative_opening : r.target_l
        tag: constriction
      - register: in_lrelease
        value: >-
          u.consonant ? ((u.plosive && !n.plosive && !n.labial) ? true : r.in_lrelease)
          : (!n.nasal ? true : r.in_lrelease)
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:741-764"
  artic_lips_closure_building:
    kind: frame
    program: articulation
    unit: "u.burst"
    when: >-
      r.ts_l != 0 && f.index < r.ts_l
      && f.index >= r.ts_l - params.policy.articulation.closure.build_frames
    set:
      - { register: in_lclosure, value: true, tag: constriction }
      - { register: in_lrelease, value: false, tag: constriction }
      - { register: in_brelease, value: false, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:765-772"
  artic_blade_closure_over:
    kind: frame
    program: articulation
    when: "r.ts_b != 0 && f.index >= r.ts_b"
    set:
      - { register: in_lrelease, value: false, tag: constriction }
      - { register: in_bclosure, value: false, tag: constriction }
      - register: in_brelease
        value: >-
          u.consonant ? ((!u.plosive || (!n.stop && !n.blade)) ? true : r.in_brelease)
          : (!n.nasal ? true : r.in_brelease)
        tag: constriction
      - register: bstep
        value: "u.consonant && (!u.plosive || (!n.stop && !n.blade)) ? -1 : r.bstep"
        tag: constriction
      - register: target_b
        value: >-
          u.consonant && (!u.plosive || (!n.stop && !n.blade))
            ? params.policy.articulation.voice.fricative_opening : r.target_b
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:773-808"
  artic_blade_closure_building:
    kind: frame
    program: articulation
    unit: "u.burst"
    when: >-
      r.ts_b != 0 && f.index < r.ts_b
      && f.index >= r.ts_b - (params.policy.articulation.closure.build_frames + 1)
    set:
      - { register: in_bclosure, value: true, tag: constriction }
      - { register: in_brelease, value: false, tag: constriction }
      - { register: in_lrelease, value: false, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:809-816"
  artic_tongue_closure_over:
    kind: frame
    program: articulation
    unit: "!n.stop"
    when: "r.ts_tb != 0 && f.index >= r.ts_tb"
    set:
      - { register: in_tbclosure, value: false, tag: constriction }
      - { register: in_lrelease, value: false, tag: constriction }
      - { register: target_tb, value: 100, tag: constriction }
      - { register: tbstep, value: "r.tbstep <= -2 ? -1 : r.tbstep", tag: constriction }
      - { register: in_tbrelease, value: true, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:819-832"
  artic_tongue_closure_starts:
    kind: frame
    program: articulation
    unit: "u.stop"
    when: "r.ts_tb != 0 && f.index == 0 && !(f.index >= r.ts_tb && !n.stop)"
    set:
      - { register: in_tbclosure, value: true, tag: constriction }
      - { register: in_tbrelease, value: false, tag: constriction }
      - { register: tbstep, value: -2, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:833-840"

  # --- allophone 0: ph_draw.c:931-940 once, 989-1073 once, 1085-1220 every frame
  artic_initial_reset_areas:
    kind: frame
    program: articulation
    unit: "u.initial"
    when: "f.index == 0"
    set:
      - { register: in_bclosure, value: false, tag: constriction }
      - { register: in_lclosure, value: false, tag: constriction }
      - { register: area_b, value: 1000, tag: constriction }
      - { register: target_b, value: 1000, tag: constriction }
      - { register: area_l, value: 1000, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: in_lrelease, value: false, tag: constriction }
      - { register: in_brelease, value: false, tag: constriction }
      - { register: in_tbrelease, value: false, tag: constriction }
      - { register: in_tbclosure, value: false, tag: constriction }
      - { register: area_tb, value: 1000, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:923-924, 931-940"
  artic_initial_before_labial_burst_stop:
    kind: frame
    program: articulation
    unit: "u.initial && n.obstruent && n.burst && n.stop && n.labial"
    when: "f.index == 0"
    set:
      - { register: in_lclosure, value: true, tag: constriction }
      - { register: area_l, value: 0, tag: constriction }
      - { register: area_b, value: 1000, tag: constriction }
      - { register: target_l, value: 0, tag: constriction }
      - { register: lstep, value: 0, tag: constriction }
      - { register: bstep, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:989-998"
  artic_initial_before_blade_burst_stop:
    kind: frame
    program: articulation
    unit: "u.initial && n.obstruent && n.burst && n.stop && n.blade"
    when: "f.index == 0"
    set:
      - { register: in_bclosure, value: true, tag: constriction }
      - { register: area_b, value: 0, tag: constriction }
      - { register: target_b, value: 0, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: bstep, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1009-1023"
  artic_initial_before_velar_burst_stop:
    kind: frame
    program: articulation
    unit: "u.initial && n.obstruent && n.burst && n.stop && n.velar"
    when: "f.index == 0"
    set:
      - { register: in_tbclosure, value: true, tag: constriction }
      - { register: in_bclosure, value: false, tag: constriction }
      - { register: area_b, value: 1000, tag: constriction }
      - { register: target_b, value: 1000, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: tbstep, value: 0, tag: constriction }
      - { register: target_tb, value: 0, tag: constriction }
      - { register: area_tb, value: 0, tag: constriction }
      - { register: bstep, value: 0, tag: constriction }
      - { register: lstep, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1025-1046"
  artic_initial_blade_fricative_area:
    kind: frame
    program: articulation
    unit: "u.initial && n.obstruent && !(n.burst && n.stop) && n.blade"
    when: "f.index == 0"
    set:
      - { register: in_bclosure, value: false, tag: constriction }
      - { register: target_b, value: "params.policy.articulation.voice.fricative_opening + 300", tag: constriction }
      - { register: area_b, value: "params.policy.articulation.voice.fricative_opening + 300", tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: bstep, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1053-1071"
  artic_initial_voiced_areas:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced"
    set:
      - { register: in_tbclosure, value: false, tag: constriction }
      - { register: in_tbrelease, value: false, tag: constriction }
      - { register: in_lclosure, value: false, tag: constriction }
      - { register: lstep, value: 0, tag: constriction }
      - { register: bstep, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1085-1094"
  artic_initial_voiced_labial_areas:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && n.labial"
    set:
      - { register: area_l, value: "params.policy.articulation.voice.fricative_opening", tag: constriction }
      - { register: area_b, value: 1000, tag: constriction }
      - { register: target_l, value: 150, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1113-1120"
  artic_initial_vowel_areas:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && n.vowel"
    set:
      - { register: area_l, value: 1000, tag: constriction }
      - { register: area_b, value: 1000, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1132-1142"
  # 1163-1184 tests UK phone codes; for a US nasal its `else` closes the lips,
  # whatever the nasal. Reproduced as compiled.
  artic_initial_nasal_areas:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && n.nasal"
    set:
      - { register: area_l, value: 0, tag: constriction }
      - { register: target_l, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1146, 1163-1184"
  artic_initial_before_dental:
    kind: frame
    program: articulation
    unit: "u.initial && n.is_dh_th_dz"
    set:
      - { register: target_b, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1204-1212"

  # --- a later silence, once: ph_draw.c:1239-1296 --------------------------
  artic_silence_areas:
    kind: frame
    program: articulation
    unit: "u.silence && !u.initial"
    when: "f.index == 0"
    set:
      - { register: target_l, value: "p.labial ? (p.plosive ? 1000 : 0) : 1000", tag: constriction }
      - { register: lstep, value: "p.labial ? 0 : r.lstep", tag: constriction }
      - { register: bstep, value: "p.labial || p.blade ? 0 : r.bstep", tag: constriction }
      - { register: in_lclosure, value: "p.blade || p.son1 ? false : r.in_lclosure", tag: constriction }
      - { register: target_b, value: "p.blade ? 0 : 1000", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1242-1292"

  # --- a phone that is not silence, once: ph_draw.c:1565-1945 --------------
  artic_releases_end_after_non_plosive:
    kind: frame
    program: articulation
    unit: "!u.silence && !p.plosive"
    when: "f.index == 0"
    set:
      - { register: in_lrelease, value: false, tag: constriction }
      - { register: in_brelease, value: false, tag: constriction }
      - { register: in_tbrelease, value: false, tag: constriction }
      - { register: bstep, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1565-1572"
  # An obstruent with a burst (`feat & 004000`): three `if`s, each that holds
  # assigns, lips first.
  artic_burst_obstruent_labial:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && u.burst && u.labial"
    when: "f.index == 0"
    set:
      - { register: target_l, value: 0, tag: constriction }
      - { register: target_b, value: 1000, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1721, 1731-1744"
  artic_burst_obstruent_blade:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && u.burst && u.blade"
    when: "f.index == 0"
    set:
      - { register: target_b, value: 0, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1746-1761"
  # The velar case (1764-1783) assigns nothing: its four assignments are
  # inside `#ifdef PH_DEBUG`, whose `#endif` comes after them. So /k/ and /g/
  # leave the lips and blade where the phone before left them.
  # An obstruent without a burst: an else-if chain, lips, blade, tongue body.
  artic_fricative_labial:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.burst && u.labial"
    when: "f.index == 0"
    set:
      - { register: lstep, value: 0, tag: constriction }
      - { register: target_l, value: 100, tag: constriction }
      - { register: target_b, value: 1000, tag: constriction }
      - { register: bstep, value: 0, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1786, 1798-1816"
  artic_fricative_blade:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.burst && !u.labial && u.blade"
    when: "f.index == 0"
    set:
      - { register: lstep, value: 0, tag: constriction }
      - { register: target_b, value: "params.policy.articulation.voice.fricative_opening", tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1818-1833"
  artic_fricative_velar:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.burst && !u.labial && !u.blade && u.velar"
    when: "f.index == 0"
    set:
      - { register: lstep, value: 0, tag: constriction }
      - { register: target_b, value: 1000, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: target_tb, value: 100, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1834-1851"
  artic_fricative_placeless:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent && !u.burst && !u.labial && !u.blade && !u.velar"
    when: "f.index == 0"
    set:
      - { register: target_l, value: 1000, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1852-1855"
  # A stop without a burst: three `if`s again.
  artic_burstless_stop_blade_area:
    kind: frame
    program: articulation
    unit: "!u.silence && u.stop && !u.burst && u.blade"
    when: "f.index == 0"
    set:
      - { register: in_bclosure, value: true, tag: constriction }
      - { register: target_b, value: 0, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1870-1889"
  artic_burstless_stop_velar_area:
    kind: frame
    program: articulation
    unit: "!u.silence && u.stop && !u.burst && u.velar"
    when: "f.index == 0"
    set:
      - { register: target_b, value: 1000, tag: constriction }
      - { register: target_l, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1893-1898"
  artic_burstless_stop_labial_area:
    kind: frame
    program: articulation
    unit: "!u.silence && u.stop && !u.burst && u.labial"
    when: "f.index == 0"
    set:
      - { register: target_b, value: 1000, tag: constriction }
      - { register: target_l, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1903-1914"
  # 1935-1945: `else if (place & FALVEL)`, then `else if (phone_feature(...) &
  # FLABIAL)`: a place bit tested on the feature word, where it is FSYLL.
  # Reproduced as compiled.
  artic_sonorant_areas:
    kind: frame
    program: articulation
    unit: "!u.silence && u.son1"
    when: "f.index == 0"
    set:
      - { register: target_b, value: "!u.stop || (!u.alveolar && u.syllabic) ? 1000 : r.target_b", tag: constriction }
      - { register: target_l, value: "!u.stop || u.alveolar ? 1000 : r.target_l", tag: constriction }
      - { register: target_tb, value: "!u.stop ? 1000 : r.target_tb", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1924-1945"

  # --- a vowel's last frame before a labial: ph_draw.c:2038-2044 -----------
  artic_vowel_before_labial:
    kind: frame
    program: articulation
    unit: "!u.silence && u.vowel && n.labial"
    when: "f.index >= f.count - 1"
    set:
      - { register: area_l, value: "params.policy.articulation.voice.fricative_opening", tag: constriction }
      - { register: target_l, value: 100, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2038-2044"

  # --- a voiceless sonorant consonant opens everything: ph_draw.c:2140-2147
  artic_voiceless_sonorant_areas:
    kind: frame
    program: articulation
    unit: "!u.dummy && !u.voiced && u.sonorant && u.consonant"
    set:
      - { register: target_l, value: 1000, tag: constriction }
      - { register: target_b, value: 1000, tag: constriction }
      - { register: target_tb, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2140-2147"

  # --- the velar nasal closes the tongue body: ph_draw.c:2400-2410 ---------
  artic_velar_nasal_closure:
    kind: frame
    program: articulation
    unit: "!u.silence && u.velar && u.nasal"
    set:
      - { register: in_tbclosure, value: true, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2400-2410"

  # --- the tongue body moves, every frame: ph_draw.c:2807-2930 -------------
  artic_tongue_closure_needs_velar:
    kind: frame
    program: articulation
    unit: "!u.velar"
    set:
      - { register: in_tbclosure, value: false, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2812-2815"
  artic_tongue_closed:
    kind: frame
    program: articulation
    when: "r.in_tbclosure"
    set:
      - { register: target_tb, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2816-2819"
  # Which branch of 2820-2930 this frame takes: 1 closing, 2 a release after
  # a burst, 3 a release without one, 4 moving toward the target, 0 none.
  artic_tongue_case:
    kind: frame
    program: articulation
    set:
      - register: move_case
        value: >-
          r.target_tb < r.area_tb ? 1
          : (r.target_tb == r.area_tb ? 0
          : (r.in_tbrelease && r.area_tb < 1000 ? (p.burst || u.burst ? 2 : 3)
          : (!r.in_tbrelease || !r.in_tbclosure ? 4 : 0)))
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2820, 2829-2835, 2869"
  artic_tongue_closing:
    kind: frame
    program: articulation
    when: "r.move_case == 1 && r.area_tb != 0"
    set:
      - { register: area_tb, value: "max([r.area_tb - 310, r.target_tb])", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2820-2828"
  artic_tongue_release_after_burst:
    kind: frame
    program: articulation
    when: "r.move_case == 2"
    set:
      - register: area_tb
        value: >-
          r.tbstep == -1 ? params.policy.articulation.voice.fricative_opening
          : params.policy.articulation.area_release[max([r.tbstep, 0])]
        tag: constriction
      - { register: tbstep, value: "r.tbstep <= 9 ? r.tbstep + 1 : r.tbstep", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2836-2848"
  artic_tongue_release_without_burst:
    kind: frame
    program: articulation
    when: "r.move_case == 3"
    set:
      - { register: area_tb, value: "params.policy.articulation.voice.fricative_opening", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2856-2866"
  # last_area_tb is never assigned, so the hold after a velar zeroes the area.
  artic_tongue_moving:
    kind: frame
    program: articulation
    when: "r.move_case == 4"
    set:
      - { register: area_tb, value: "r.area_tb + floor((r.target_tb - r.area_tb) / 8)", tag: constriction }
      - register: area_tb
        value: >-
          u.blade && p.velar && f.index < params.policy.articulation.closure.coarticulation_frames
            ? 0 : r.area_tb
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2869-2884"

  # --- the lips move, every frame: ph_draw.c:3113-3282 ---------------------
  artic_lips_closed:
    kind: frame
    program: articulation
    when: "r.in_lclosure"
    set:
      - { register: target_l, value: 0, tag: constriction }
      - { register: lstep, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3113-3118"
  artic_lips_case:
    kind: frame
    program: articulation
    set:
      - register: move_case
        value: >-
          r.target_l < r.area_l ? 1
          : (r.target_l == r.area_l ? 0
          : (r.in_lrelease && r.area_l < 1000 ? (p.burst || u.burst ? 2 : 3)
          : (!r.in_lrelease || !r.in_lclosure ? 4 : 0)))
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3169, 3181-3188, 3234"
  artic_lips_closing:
    kind: frame
    program: articulation
    when: "r.move_case == 1 && r.area_l != 0"
    set:
      - { register: area_l, value: "max([r.area_l - 250, r.target_l])", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3169-3180"
  artic_lips_release_after_burst:
    kind: frame
    program: articulation
    when: "r.move_case == 2"
    set:
      - register: area_l
        value: >-
          r.lstep == -1 ? params.policy.articulation.voice.fricative_opening
          : params.policy.articulation.area_release[max([r.lstep, 0])]
        tag: constriction
      - register: lstep
        value: "r.lstep == -1 ? 1 : (r.lstep <= 9 ? r.lstep + 1 : r.lstep)"
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3187-3201"
  artic_lips_release_without_burst:
    kind: frame
    program: articulation
    unit: "u.labial"
    when: "r.move_case == 3"
    set:
      - { register: area_l, value: "params.policy.articulation.voice.fricative_opening", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3210-3219"
  # 3236-3276: the quarter step is taken twice, once in the `if` and once
  # after it; a blade phone holds both areas for its first frames.
  artic_lips_moving:
    kind: frame
    program: articulation
    when: "r.move_case == 4"
    set:
      - { register: area_l, value: "r.area_l + floor((r.target_l - r.area_l) / 4)", tag: constriction }
      - register: area_b
        value: >-
          u.blade && f.index < params.policy.articulation.closure.coarticulation_frames
            ? r.last_area_b : r.area_b
        tag: constriction
      - { register: area_l, value: "r.area_l + floor((r.target_l - r.area_l) / 4)", tag: constriction }
      - { register: area_l, value: "r.target_l == 0 && r.area_l < 260 ? 0 : r.area_l", tag: constriction }
      - register: area_l
        value: >-
          u.blade && f.index < params.policy.articulation.closure.coarticulation_frames
            ? r.last_area_l : r.area_l
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3234-3276"
  artic_lips_limit:
    kind: frame
    program: articulation
    when: "r.move_case >= 2 && r.area_l > 1000"
    set:
      - { register: area_l, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3280-3281"

  # --- the flap: ph_draw.c:3290-3330 ---------------------------------------
  # 3312 reads `tcum >= (allodurs >> 1 - 3)`: a shift by -2, which C leaves
  # undefined. As this build behaves, the test is always true: the first half
  # of a flap closes by 400 a frame from its first frame. DECtalk's own
  # area_flap in "It is much better." is 800, 400, 0, 400, 800 in a flap of
  # seven frames and 800, 400, 800 in one of four.
  artic_flap_opening:
    kind: frame
    program: articulation
    unit: "u.is_flap"
    when: "f.index >= floor(f.count / 2)"
    set:
      - { register: area_flap, value: "r.area_flap <= 850 ? r.area_flap + 400 : 1200", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3303-3309"
  artic_flap_closing:
    kind: frame
    program: articulation
    unit: "u.is_flap"
    when: "f.index < floor(f.count / 2)"
    set:
      - { register: area_flap, value: "r.area_flap > 0 ? r.area_flap - 400 : 0", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3312-3324"
  artic_no_flap:
    kind: frame
    program: articulation
    unit: "!u.is_flap"
    set:
      - { register: area_flap, value: 1200, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3329-3330"

  # --- the blade moves, every frame: ph_draw.c:3333-3488 -------------------
  artic_blade_case:
    kind: frame
    program: articulation
    set:
      - register: move_case
        value: >-
          r.target_b < r.area_b ? 1
          : (r.target_b == r.area_b && r.bstep != -1 ? 0
          : (r.in_brelease && r.area_b < 1000 ? (p.burst || u.burst ? 2 : 3)
          : (!r.in_brelease || !r.in_bclosure ? 4 : 0)))
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3333, 3346-3355, 3411"
  artic_blade_closing:
    kind: frame
    program: articulation
    when: "r.move_case == 1 && r.area_b != 0"
    set:
      - { register: area_b, value: "max([r.area_b - 400, r.target_b])", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3333-3344"
  artic_blade_release_after_burst:
    kind: frame
    program: articulation
    when: "r.move_case == 2"
    set:
      - register: area_b
        value: >-
          r.bstep == -1 ? params.policy.articulation.voice.fricative_opening
          : (r.target_b != 0 ? params.policy.articulation.area_release[max([r.bstep, 0])] : 0)
        tag: constriction
      - register: bstep
        value: >-
          r.bstep == -1 ? 1
          : (r.target_b != 0 && r.bstep <= 9 ? r.bstep + 1 : r.bstep)
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3354-3374"
  artic_blade_release_without_burst:
    kind: frame
    program: articulation
    when: "r.move_case == 3"
    set:
      - register: area_b
        value: >-
          u.blade ? params.policy.articulation.voice.fricative_opening
          : r.area_b + floor((r.target_b - r.area_b) / 2)
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3384-3406"
  # The block under `#ifdef notworking` (3417-3437) is not compiled.
  artic_blade_moving:
    kind: frame
    program: articulation
    when: "r.move_case == 4"
    set:
      - register: area_b
        value: >-
          r.target_b > r.area_b
            ? (r.target_b <= 200 && r.area_b < 100 ? r.target_b
               : r.area_b + floor((r.target_b - r.area_b) / 2))
            : r.area_b
        tag: constriction
      - register: area_b
        value: >-
          (u.labial || u.velar) && f.index < params.policy.articulation.closure.coarticulation_frames
            ? (p.blade && r.last_area_b < 200 ? 0 : r.last_area_b) : r.area_b
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3411-3443, 3464-3474"
  artic_blade_limit:
    kind: frame
    program: articulation
    when: "r.move_case >= 2 && r.area_b > 1000"
    set:
      - { register: area_b, value: 1000, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3486-3487"

  # --- DH and TH close the blade first: ph_draw.c:3490-3553 ----------------
  # Six frames from the end inside a word, eight before a word boundary or a
  # stronger one, the blade is given 300 to open to.
  artic_dental_closed:
    kind: frame
    program: articulation
    unit: "u.is_dh_th"
    when: "f.index < f.count - (u.boundary < params.policy.timing.boundary.word ? 6 : 8)"
    set:
      - { register: target_b, value: 0, tag: constriction }
      - { register: area_b, value: 0, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3490-3514, 3530-3541"
  artic_dental_opening:
    kind: frame
    program: articulation
    unit: "u.is_dh_th"
    when: "!(f.index < f.count - (u.boundary < params.policy.timing.boundary.word ? 6 : 8))"
    set:
      - { register: target_b, value: 300, tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:3515-3525, 3542-3552"

  # --- after the packet is written: ph_draw.c:4107-4108 --------------------
  artic_remember_areas:
    kind: frame
    program: articulation
    set:
      - { register: last_area_b, value: "r.area_b", tag: constriction }
      - { register: last_area_l, value: "r.area_l", tag: constriction }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4107-4108"

  # ===========================================================================
  # The velum (area_n, nasal_step) and the obstruent's DC and UE steps.
  # ===========================================================================

  # --- allophone 0: ph_draw.c:922 once; 1132-1192 every frame --------------
  artic_initial_reset_velum:
    kind: frame
    program: articulation
    unit: "u.initial"
    when: "f.index == 0"
    set:
      - { register: area_n, value: 0, tag: velum }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:922"
  artic_initial_velum_before_vowel:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && n.vowel"
    set:
      - { register: area_n, value: 0, tag: velum }
      - { register: nasal_step, value: 0, tag: velum }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1132, 1143-1144"
  artic_initial_velum_before_nasal:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && n.nasal"
    set:
      - { register: area_n, value: 200, tag: velum }
      - { register: nasal_step, value: 7, tag: velum }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1146-1148, 1189"
  artic_initial_velum_before_voiced_oral:
    kind: frame
    program: articulation
    unit: "u.initial && n.voiced && !n.nasal"
    set:
      - { register: nasal_step, value: 0, tag: velum }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1191-1192"

  # --- DC and UE, a phone that is not silence, every frame: ph_draw.c:1314-1465
  # dcstep climbs to 9 through a voiced obstruent and falls to -9 through a
  # voiceless one, a few frames in and not while the velum is open; any other
  # phone brings it back by two a frame. In a silence the two words keep the
  # value they had.
  artic_dc_starts:
    kind: frame
    program: articulation
    unit: "!u.silence && u.obstruent"
    when: "r.dcstep == 0 && r.area_n == 0 && f.index > 1"
    set:
      - { register: dcstep, value: "u.voiced ? 1 : -1", tag: obstruent_source }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1314-1334"
  artic_dc_step_voiced:
    kind: frame
    program: articulation
    unit: "!u.silence && u.voiced"
    when: "r.dcstep != 0"
    set:
      - register: dcstep
        value: >-
          u.obstruent && r.area_n == 0
            ? (r.dcstep < 0 ? r.dcstep + 1 : r.dcstep)
            : r.dcstep
        tag: obstruent_source
      - register: dcstep
        value: >-
          u.obstruent && r.area_n == 0
            ? (r.dcstep < 9 ? r.dcstep + 1 : r.dcstep)
            : ((!u.obstruent && f.index > 1) || r.area_n != 0 ? max([r.dcstep - 2, 0]) : r.dcstep)
        tag: obstruent_source
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1338-1372"
  artic_dc_step_voiceless:
    kind: frame
    program: articulation
    unit: "!u.silence && !u.voiced"
    when: "r.dcstep != 0"
    set:
      - register: dcstep
        value: >-
          u.obstruent && r.area_n == 0
            ? (r.dcstep > 0 ? r.dcstep - 1 : r.dcstep)
            : r.dcstep
        tag: obstruent_source
      - register: dcstep
        value: >-
          u.obstruent && r.area_n == 0
            ? (r.dcstep > -9 ? r.dcstep - 1 : r.dcstep)
            : min([r.dcstep + 2, 0])
        tag: obstruent_source
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1388-1414"
  artic_dc_out:
    kind: frame
    program: articulation
    unit: "!u.silence"
    set:
      - register: dc
        value: >-
          r.dcstep >= 0 ? params.policy.articulation.dc_values[r.dcstep]
          : 0 - params.policy.articulation.dc_values[0 - r.dcstep]
        tag: obstruent_source
      - register: ue
        value: >-
          r.dcstep >= 0 ? params.policy.articulation.ue_values[r.dcstep]
          : 0 - params.policy.articulation.ue_values[0 - r.dcstep]
        tag: obstruent_source
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:1419-1465"

  # --- the velum, every phone, every frame: ph_draw.c:2414-2671 ------------
  # A chain of three: in a nasal; before a nasal that is not doubled; any
  # other phone that is not a nasal.
  artic_velum_in_nasal:
    kind: frame
    program: articulation
    unit: "u.nasal"
    set:
      - register: nasal_step
        value: >-
          u.blade && p.blade ? (r.nasal_step == 0 ? 4 : (r.nasal_step < 7 ? r.nasal_step + 1 : r.nasal_step))
          : (n.obstruent && f.index >= f.count - 1 && !n.is_dh ? max([r.nasal_step - 2, 0])
          : (r.nasal_step < 7 ? r.nasal_step + 2 : r.nasal_step))
        tag: velum
      - { register: area_n, value: "params.policy.articulation.nasalization[r.nasal_step]", tag: velum }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2414-2510"
  artic_velum_before_nasal:
    kind: frame
    program: articulation
    unit: "!u.nasal && n.nasal && !u.next_repeats"
    set:
      - register: nasal_step
        value: "f.count < 7 && r.nasal_step < 7 ? r.nasal_step + 1 : r.nasal_step"
        tag: velum
      - register: nasal_step
        value: >-
          !u.obstruent && f.index >= floor(f.count / 2) && r.nasal_step < 7
            ? r.nasal_step + 1 : r.nasal_step
        tag: velum
      - register: area_n
        value: >-
          u.obstruent || f.index >= floor(f.count / 2)
            ? params.policy.articulation.nasalization[r.nasal_step] : r.area_n
        tag: velum
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2526-2581"
  # A sonorant waits two frames before the velum starts to close (`goto
  # skipit`); other phones close it by three while it is wide.
  artic_velum_closing:
    kind: frame
    program: articulation
    unit: "!u.nasal && !(n.nasal && !u.next_repeats)"
    when: "r.nasal_step != 0 && f.index != 0 && !(u.sonorant && f.index < 3)"
    set:
      - register: nasal_step
        value: >-
          u.sonorant ? r.nasal_step - 1
          : max([r.nasal_step > 4 ? r.nasal_step - 3 : r.nasal_step - 1, 0])
        tag: velum
      - { register: area_n, value: "params.policy.articulation.nasalization[r.nasal_step]", tag: velum }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2587, 2618-2671"

  # ===========================================================================
  # The frication code (OUT_A2), the burst marker and the velar's place.
  # ===========================================================================
  # OUT_A2 is also the generic A2 amplitude, drawn before this section; in
  # this build it is 0 on all but a few hundred of the corpus's packets, and
  # the synthesizer acts only on the codes (VTM/vtmiont.c:797-1147). The
  # amplitude is not ported: the word is the code or 0.
  artic_frication_code_none:
    kind: frame
    program: articulation
    set:
      - { register: a2, value: 0, tag: frication_place }
    citations:
      - "DECtalk 4.63 VTM/vtmiont.c:797-1147 (only the codes are read)"
  # A vowel's last frame announces the next consonant's place.
  artic_frication_code_vowel_end:
    kind: frame
    program: articulation
    unit: "u.vowel"
    when: "f.index >= f.count - 1"
    set:
      - register: a2
        value: >-
          u.dental || n.labial ? 1000
          : (n.palatal ? 2000
          : (n.alveolar && f.index > 2 ? 3000 : r.a2))
        tag: frication_place
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2037, 2056-2100"
  artic_frication_code_by_place:
    kind: frame
    program: articulation
    unit: "!u.nasal"
    set:
      - register: a2
        value: >-
          u.dental ? (u.is_dh_th_dz ? 1200 : (u.voiced ? 1100 : 1000))
          : (u.labial ? 1300
          : (u.palatal ? (u.is_affricate && f.index <= 4 ? 3200 : 2000)
          : (u.alveolar ? 3000 : r.a2)))
        tag: frication_place
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2197-2312"
  # After an obstruent with a place, the code of that obstruent is repeated in
  # the phone's first frame, and all through a dummy vowel; later frames
  # forget it. The `else` belongs to the inner `if`.
  artic_frication_code_carried:
    kind: frame
    program: articulation
    unit: >-
      !u.nasal && (p.palatal || p.dental || p.alveolar || p.labial)
      && !(p.stop && u.obstruent) && p.obstruent
    set:
      - { register: a2, value: "f.index < 1 || u.dummy ? r.lastthing : r.a2", tag: frication_place }
      - { register: lastthing, value: "f.index < 1 || u.dummy ? r.lastthing : 0", tag: frication_place }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2315-2335"
  artic_frication_code_remembered:
    kind: frame
    program: articulation
    unit: "!u.nasal"
    when: "r.a2 >= 1000"
    set:
      - { register: lastthing, value: "r.a2", tag: frication_place }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2336-2337"
  artic_frication_code_glide:
    kind: frame
    program: articulation
    unit: "!u.initial && u.soncon && u.is_w_or_r"
    set:
      - { register: a2, value: 4000, tag: frication_place }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2343-2373"
  artic_frication_code_lateral:
    kind: frame
    program: articulation
    unit: "u.is_l"
    set:
      - { register: a2, value: 4000, tag: frication_place }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:2391-2394"

  # --- the burst marker: ph_draw.c:4084-4096 -------------------------------
  # 1 or 2 in the first frame of a release (tongue body, or lips or blade),
  # -1 in its later frames, 0 otherwise.
  artic_burst_marker:
    kind: frame
    program: articulation
    set:
      - register: brst
        value: >-
          r.in_lrelease || r.in_tbrelease || r.in_brelease
            ? (r.brst == 0 ? (r.in_tbrelease ? 1 : 2) : -1)
            : 0
        tag: constriction
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4084-4096"

  # --- where a velar is made: ph_draw.c:4128-4150 --------------------------
  # By the beginning type of the next phone (p_us_rom.h us_begtyp): 45 before
  # a front one, 40 before a rounded back one, 42 otherwise. Nothing resets
  # the word, so it keeps the last velar's value.
  artic_velar_place:
    kind: frame
    program: articulation
    unit: "u.velar"
    set:
      - { register: place, value: "n.onset == 'front' ? 45 : (n.onset == 'round' ? 40 : 42)", tag: frication_place }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4128-4150"

