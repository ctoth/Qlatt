version: v1
# ---------------------------------------------------------------------------
# DECtalk 4.63 postlexical allophone rewrites (ph_aloph.c phalloph(), US branch).
#
# This phase runs after phone normalization and BEFORE the structural phase, so
# the rules see raw /t,d/ before the stop is split into closure/release/
# aspiration segments (matching the qlatt-english postlexical convention and
# DECtalk's allophone-before-acoustics ordering).
#
# A18 FLAPPING (ph_aloph.c:958-1040): intervocalic unstressed /t/ -> DF and
# /d/ -> DX, gated on a phrase of at least three words.  The signature
# "butter" -> "budder", "city" -> "ciddy" behavior.
#
# Trigger (verbatim from the source), DECtalk feature bits mapped to Qlatt token
# fields (ph_defs.h: FSYLL = vowels + EL/EM/EN; FSON1 = +sonorant except
# /si/,/h/ = vowels/glides/liquids/nasals; FNASAL = nasals):
#   if (number_words >= 3)                              -> word_count() >= 3
#   && curr in {T,D} && (FSTRESS IS_MINUS)             -> current unstressed T/D
#   && (last_outph FSON1+) && last_outph not M/NX/N    -> prev sonorant, not a true nasal
#   && (next_inph FSYLL+)                              -> next is syllabic (vowel or EL/EM/EN)
#   && ( (curr FBOUNDARY >= FMBNEXT)                   -> /t,d/ is word-final
#        || word-internal "weak next vowel":            (the FWINITC word-initial
#           ((prevStressed && next==OW) ||               branch in the source is
#            next in {AX,IX,RR,IY,EL}) )                 commented out; not ported)
#
# Symbol mapping (this port's stress-stripped ARPABET -> DECtalk weak-vowel set):
# the phoneme symbol carries no stress digit (stress lives in `.stress`), so a
# reduced nucleus {AX,IX,RR,IY} is a vowel with stress != 1, and EL/EN are the
# syllabic sonorants.  The word-initial FWINITC clause in the source is dead
# code (commented out), so it is intentionally omitted.
#
# Mechanism: a structural splice over the single T/D token, replacing it with one
# token that keeps the original stress/word but adopts the DF/DX inventory target
# (phoneme, type, durations).  A bare `apply op:set phoneme` would only
# rename the token and leave the stop's acoustics (engine applyEffectToToken does
# not re-materialize params on rename), so the splice + target() form is needed
# to actually realize the flap.  This matches the qlatt-english t_flapping rule.
# ---------------------------------------------------------------------------
rules:
  # -------------------------------------------------------------------------
  # WH-QUESTIONS END LIKE STATEMENTS (LTS/ls_task.c).
  #
  # ls_task_set_what_state (1566-1625) looks the first word after a sentence
  # end up in whdic; when it is there, the next question mark is sent on as a
  # period (1196-1208, "Changing question mark to period!"). Everything
  # downstream then sees a statement: the boundary type on the final rime, the
  # pause, and the intonation.
  #
  # The state is reset at ".", "?" and "!" only (ls_task.c:1160, 1195, 1220,
  # 1236), not at a comma: in "Well, where are they?" the first word is
  # "well" and the question mark stays.
  # -------------------------------------------------------------------------
  dectalk_wh_question_period:
    kind: scalar
    select:
      relation: Segment
      where: "current.phoneme == 'SIL' && get(current, 'punctuationSymbol', null) == '?'"
    define:
      # The previous sentence's final silence, or the utterance's first Segment.
      sentence_edge: >-
        look_back_where(current, 5000,
          '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) in [".", "?", "!"]) || behind(candidate, 1) == null')
      first_phone: >-
        sentence_edge == null ? null
        : (sentence_edge.phoneme == 'SIL' ? ahead(sentence_edge, 1) : sentence_edge)
    constraint: >-
      first_phone != null && has(first_phone.word)
      && lower(first_phone.word) in params.policy.structure.wh_words
    apply:
      - field: punctuationSymbol
        op: set
        value: "'.'"
        tag: boundary
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:1566-1625 ls_task_set_what_state (first word of the clause in whdic)"
      - "DECtalk 4.63 LTS/ls_task.c:1196-1208 (a question mark after a wh-clause is sent as PERIOD)"
      - "DECtalk 4.63 LTS/l_us_con.c:1215-1226 whdic"

  # -------------------------------------------------------------------------
  # AN AUXILIARY THAT BEGINS A SENTENCE (LTS/ls_task.c:4636-4645, 4672-4728).
  #
  # ls_task_lookup_first_verbs is called for the same first word: "are",
  # "had", "is", "was", "were" and "will" are then sent with secondary stress
  # on their vowel instead of their unstressed dictionary form ("Is it here?").
  #
  # Not ported: the table also gives "had" the vowel EH there, where the
  # dictionary has AE.
  # -------------------------------------------------------------------------
  dectalk_sentence_initial_auxiliary:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.type == 'vowel' && has(current.word)
        && lower(current.word) in params.policy.structure.sentence_initial_auxiliaries
    define:
      # The nearest earlier Segment that is a sentence end or belongs to another word.
      before_word: >-
        look_back_where(current, 5000,
          '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) in [".", "?", "!"]) || !(has(candidate.word) && has(source.word) && candidate.word == source.word)')
    constraint: >-
      before_word == null
      || (before_word.phoneme == 'SIL' && get(before_word, 'punctuationSymbol', null) in ['.', '?', '!'])
    apply:
      - field: stress
        op: set
        value: 2
        tag: stress
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:4636-4645 verbs[] (are, had, is, was, were, will with S2)"
      - "DECtalk 4.63 LTS/ls_task.c:4672-4728 ls_task_lookup_first_verbs (first word after a sentence end)"

  # -------------------------------------------------------------------------
  # CLAUSE BREAKS BEFORE CONJUNCTIONS AND PREPOSITIONS (LTS/ls_task.c
  # ls_task_parse_sentence, LTS/ls_util.c:824-853).
  #
  # Before it speaks the words up to a punctuation mark, DECtalk's text stage
  # looks each of them up and marks the conjunctions, the prepositions that are
  # neither particles nor "to", and the words of class "that" (:5129-5153). A
  # marked word then gets a break (:5190-5229) unless it is within three words
  # of the marked word before it (or of the start), or the next word is marked
  # too. The two kinds of break the code tells apart, required and optional,
  # are sent the same way: a comma before the word, when more than three words
  # follow it (ls_util.c:827, `length > fc_index + 3`, length being the number
  # of words; DECtalk breaks "Do you know where the station is today?" and not
  # "Do you know where the station is?").
  #
  # "The big dog barked and the small cat ran away." is spoken as "The big dog
  # barked, and the small cat ran away."; "The dog and the cat ran." (third
  # word) and "The big dog barked and ran." (one word follows) are not broken.
  #
  # Not ported: the marks for quotes, parentheses and a dash (:5082-5127), and
  # the multi-word conjunctions and verb particles of LTS/proverbs.h
  # (:5116-5120, :5174-5189).
  # -------------------------------------------------------------------------
  dectalk_break_marker:
    kind: scalar
    select:
      relation: Word
      where: >-
        'conj' in get(current, 'text_form_classes', [])
        || 'that' in get(current, 'text_form_classes', [])
        || ('prep' in get(current, 'text_form_classes', [])
            && !('part' in get(current, 'text_form_classes', []))
            && !('to' in get(current, 'text_form_classes', [])))
    apply:
      - field: break_marker
        op: set
        value: "true"
        tag: boundary
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:5129-5153 (PRO_CONJ, PRO_PREP for a preposition that is neither a particle nor 'to', PRO_THAT)"

  dectalk_clause_break:
    kind: scalar
    select:
      relation: Word
      where: "isTrue(current, 'break_marker')"
    define:
      place: "get(current, 'clause_word_index', 0)"
      # The marked word before this one. An earlier clause's words have places
      # that are not smaller.
      marked_before: >-
        look_back_where(current, 500,
          'isTrue(candidate, "break_marker") || get(candidate, "clause_word_index", 0) >= get(source, "clause_word_index", 0)')
      last_marker: >-
        marked_before != null && get(marked_before, 'clause_word_index', 0) < place
          ? get(marked_before, 'clause_word_index', 0) : 0
      n: next
      next_marked: "n != null && isTrue(n, 'break_marker')"
    constraint: >-
      place - last_marker > 3 && !next_marked
      && get(current, 'clause_word_count', 0) > place + 3
    apply:
      - field: clause_break_before
        op: set
        value: "true"
        tag: boundary
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:5190-5229 (no break within three words of the last marker or when the next word is marked; otherwise a required or an optional break)"
      - "DECtalk 4.63 LTS/ls_task.c:4843-4856 find_next_marker"
      - "DECtalk 4.63 LTS/ls_util.c:824-853 (either break is sent as a COMMA before the word when length > fc_index + 3)"

  # The comma itself: a punctuation silence in front of the word's first
  # phone. It belongs to no word.
  dectalk_clause_break_comma:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme != 'SIL' && dectalk_word_start(current)"
    define:
      silence: "target('SIL')"
    constraint: >-
      isTrue(path(current, 'R:SylStructure.parent.parent'), 'clause_break_before')
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - outside_structure: true
          phoneme: "'SIL'"
          type: silence.type
          target: silence
          word: "','"
          punctuationSymbol: "','"
          stress: "null"
          duration: silence.duration
        - copy_from: current
    citations:
      - "DECtalk 4.63 LTS/ls_util.c:824-853 (a COMMA is written to the phonetic stage before the word)"

  # -------------------------------------------------------------------------
  # THE DURATION DICTIONARY (ph_sort.c:192-215 durdic, :1313-1329, :1916-1945).
  #
  # At every symbol the phone sort compares the symbols from there on with a
  # short table of patterns, each a word boundary and the first phones of a
  # word with its primary stress mark. Where one matches, its durations are
  # stored for those phones as durations given from outside, and the duration
  # routine uses them instead of its rules (duration.yaml,
  # dectalk_timing_dictionary_duration). "Anything", "end" and "enter" begin
  # with a stressed EH and N: 80 and 70 ms.
  #
  # A pattern is a prefix: whatever follows in the word does not matter. It
  # begins with the word boundary symbol, so a word entered with a phrase
  # start in its place (a verb, "to", "and", "for") does not match.
  #
  # This rule reads the word's first four phones and writes the duration on
  # the phone it is for. It runs before any rule changes a phone or a stress.
  # -------------------------------------------------------------------------
  dectalk_duration_dictionary:
    kind: scalar
    select:
      relation: Segment
      where: "current.phoneme != 'SIL' && has(current.word) && current.word != ''"
    define:
      # The word's first phone, and how far along current is (up to the 4th).
      b1: "behind(current, 1)"
      b2: "behind(current, 2)"
      b3: "behind(current, 3)"
      at0: dectalk_word_start(current)
      at1: "!at0 && b1 != null && dectalk_word_start(b1)"
      at2: "!at0 && !at1 && b2 != null && dectalk_word_start(b2)"
      at3: "!at0 && !at1 && !at2 && b3 != null && dectalk_word_start(b3)"
      first: "at0 ? current : (at1 ? b1 : (at2 ? b2 : (at3 ? b3 : null)))"
      w1: "first == null ? null : ahead(first, 1)"
      w2: "first == null ? null : ahead(first, 2)"
      w3: "first == null ? null : ahead(first, 3)"
      in1: "w1 != null && w1.phoneme != 'SIL' && !dectalk_word_start(w1)"
      in2: "in1 && w2 != null && w2.phoneme != 'SIL' && !dectalk_word_start(w2)"
      in3: "in2 && w3 != null && w3.phoneme != 'SIL' && !dectalk_word_start(w3)"
      key2: "in1 ? dectalk_dictionary_token(first) + ' ' + dectalk_dictionary_token(w1) : ''"
      key3: "in2 ? key2 + ' ' + dectalk_dictionary_token(w2) : ''"
      key4: "in3 ? key3 + ' ' + dectalk_dictionary_token(w3) : ''"
      table: params.policy.timing.duration_dictionary
      row: >-
        get(table, key2, null) != null ? get(table, key2, null)
        : (get(table, key3, null) != null ? get(table, key3, null) : get(table, key4, null))
      ms: >-
        row == null ? 0
        : (at0 ? get(row, 'p0', 0) : (at1 ? get(row, 'p1', 0)
          : (at2 ? get(row, 'p2', 0) : get(row, 'p3', 0))))
      # WBOUND in front: the word starts no phrase.
      plain_start: "first != null && dectalk_phrase_start(first) == ''"
    constraint: "plain_start && ms > 0"
    apply:
      - field: dictionary_duration_ms
        op: set
        value: ms
        tag: timing_setup
    citations:
      - "DECtalk 4.63 PH/ph_sort.c:192-215 durdic (the US rows)"
      - "DECtalk 4.63 PH/ph_sort.c:1313-1329 (looked up at every symbol; the durations go to user_durs)"
      - "DECtalk 4.63 PH/ph_sort.c:1916-1945 durlookup (a pattern matches as a prefix)"

  # -------------------------------------------------------------------------
  # PREPOSITIONAL-PHRASE STARTS (ph_sort.c:1055-1110).
  #
  # "to", "and" and "for" come from DECtalk's mini dictionary with PPSTART in
  # front (LTS/l_us_con.c:1190-1193). Its phone sort drops the start of one
  # that ends its clause ("Clause-final function word (preceded by [(]) should
  # be stressed"): the boundary before it is a plain word boundary, its vowel
  # is unreduced ("for" F RR -> F OR, "to" T UH -> T UW) and it takes primary
  # stress.
  #
  # The same code also drops a start whose next word starts a prepositional
  # phrase, and raises that one to a verb-phrase start. It tests the symbol
  # right after the word boundary for PPSTART (:1066-1067), and these three
  # words have SPECIALWORD there, ahead of their PPSTART, so the test never
  # holds between them: in "I went to and from it." DECtalk keeps both starts
  # and "to" stays unstressed.
  #
  # The first rule writes on each such Word what became of its start: 'pp'
  # kept, 'word' dropped.
  #
  # Not ported, because here it changes nothing: at 140 words per minute or
  # slower the phone sort turns every remaining PPSTART into a VPSTART
  # (ph_sort.c:1171-1177). These three words are entered after a word
  # boundary, so the phone before them gets the word boundary's bits with the
  # phrase start's added (ph_sort.c:1487-1496), and FWBNEXT 0140 with FVPNEXT
  # 0240 is the same FCBNEXT 0340 as with FPPNEXT 0200 (ph_defs.h:255-260).
  # A phrase start entered without a word boundary before it would differ.
  # -------------------------------------------------------------------------
  dectalk_pp_start_state:
    kind: scalar
    select:
      relation: Word
      where: "get(current, 'phrase_start', '') == 'pp'"
    define:
      # The Segment after the Word's last one: the punctuation silence for a
      # clause's last word, nothing for the utterance's last word.
      after_this: "path(current, 'R:SylStructure.daughtern.daughtern.R:Segment.n')"
      clause_final: "after_this == null || after_this.phoneme == 'SIL'"
    apply:
      - field: phrase_start_state
        op: set
        value: "clause_final ? 'word' : 'pp'"
        tag: boundary
    citations:
      - "DECtalk 4.63 ph_sort.c:1055-1070 (a PPSTART whose word is followed by a clause boundary becomes a word boundary)"
      - "DECtalk 4.63 LTS/l_us_con.c:1187-1195 sdic (for, and, to with SPECIALWORD and PPSTART)"

  # A word whose start was dropped takes primary stress on its first vowel:
  # a leading secondary stress is promoted, otherwise a primary stress is
  # inserted and moved to the first vowel (ph_sort.c:1095-1104).
  dectalk_pp_dropped_stress:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'vowel' && dectalk_phrase_state(current) == 'word'"
    define:
      prior_vowel_in_word: >-
        find_within_word(current,
          "current.type == 'vowel'",
          "behind")
    constraint: "prior_vowel_in_word == null"
    apply:
      - field: stress
        op: set
        value: 1
        tag: stress
    citations:
      - "DECtalk 4.63 ph_sort.c:1095-1104 (promote the initial secondary stress, or find a vowel to stress)"
      - "DECtalk 4.63 ph_sort.c:1055 (clause-final function word preceded by [(] should be stressed)"

  # ... and its vowel is unreduced: "for" F RR -> F OR, "to" T UH -> T UW
  # (ph_sort.c:1076-1084).
  dectalk_pp_dropped_unreduce:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme in ['RR', 'UH'] && dectalk_phrase_state(current) == 'word'"
    define:
      p: prev
      after_word_initial: "p != null && dectalk_word_start(p) && !dectalk_word_start(current)"
      full_name: >-
        after_word_initial && p.phoneme == 'F' && current.phoneme == 'RR' ? 'OR'
        : (after_word_initial && p.phoneme == 'T' && current.phoneme == 'UH' ? 'UW' : '')
      full: "full_name == '' ? null : target(full_name + '1')"
    constraint: "full != null"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          # What a phone keeps when a rule rewrites it in place: DECtalk's
          # allophone rules change the phone and leave its structure word
          # (ph_aloph.c writes allophons[] and copies sentstruc[] across).
          # Every in-place rewrite below copies this one list.
          copy_fields: &structure_word
            - stress
            - word
            - word_initial_consonant
            - helper_verb_promoted
            - phrase_start_follows
            - morpheme_boundary_after
            - dictionary_duration_ms
          phoneme: full_name
          type: full.type
          target: full
          duration: full.duration
          inherentDuration: full.inherentDuration
          minimumDuration: "has(full.minimumDuration) ? full.minimumDuration : full.duration"
          voiced: "has(full.voiced) ? full.voiced : true"
    citations:
      - "DECtalk 4.63 ph_sort.c:1076-1084 (unreduce the vowel in \"for, to, into\": F RR -> F OR, T UH -> T UW)"

  # The last phone before a word that keeps its phrase start carries the
  # start's boundary on top of the word boundary: DECtalk adds FPPNEXT to the
  # phone it has just put out (ph_sort.c:1487-1490). The two together are the
  # comma value. The mark is the phone's: it goes when
  # a later rule deletes the phone (the first of two /t/ in "want to") or fuses
  # it into its vowel ("store and"), and stays when one rewrites it in place
  # (the flap of "bread and").
  dectalk_phrase_start_follows:
    kind: scalar
    select:
      relation: Segment
      where: "current.phoneme != 'SIL' && has(current.word) && current.word != ''"
    define:
      n: next
      state: "n == null || n.phoneme == 'SIL' ? '' : dectalk_phrase_state(n)"
    constraint: >-
      n != null && n.phoneme != 'SIL' && dectalk_word_start(n) && state == 'pp'
    apply:
      - field: phrase_start_follows
        op: set
        value: "true"
        tag: boundary
    citations:
      - "DECtalk 4.63 ph_sort.c:1487-1490 (PPSTART adds FPPNEXT to the current output phone)"
      - "DECtalk 4.63 ph_defs.h:249-262 (FWBNEXT 0140 with FPPNEXT 0200 is FCBNEXT 0340)"

  # -------------------------------------------------------------------------
  # PHONE STRUCTURE WORD (ph_sort.c phsort(), run by DECtalk before phalloph()).
  #
  # DECtalk gives every phone a structure word that its allophone and duration
  # rules test. Two of its fields belong to consonants and are computed here,
  # ahead of every allophone rule that reads them:
  #
  #   FWINITC  word-initial consonant: every consonant before the word's first
  #            syllabic. ph_sort.c:1383-1389 sets it while word_init_sw is still
  #            TRUE, and the first syllabic clears word_init_sw (:1352).
  #   FSTRESS  a consonant takes the stress of the stressed syllabic it leads
  #            into, per get_stress_of_conson (p_us_sr1.c:73-140): the scan
  #            runs forward to the stress mark that precedes the syllabic and
  #            stops at any syllabic or boundary symbol first. With m = number
  #            of phones from the consonant to the mark:
  #              m == 1  the consonant is stressed
  #              m == 2  only if us_phcluster(consonant, next) is a cluster
  #              m == 3  only if us_phcluster(second, third) is CLUSTER_TRYS
  #                      and the consonant is /s/
  #              m  > 3  never
  #
  # Qlatt keeps a stress mark on its syllabic (`.stress`) and word boundaries
  # as word membership, so "stops at a boundary" is "same word".
  #
  # Before either, phsort() guarantees a primary stress: "Every breath group
  # must have at least one 1-stress" (ph_sort.c:1181-1189). When a clause has
  # none, find_syll_to_stress (ph_sort2.c:129-181) stresses the first syllabic
  # of the clause's LAST word. Consonant stress then follows from it.
  # -------------------------------------------------------------------------
  dectalk_breath_group_primary_stress:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'vowel' && has(current.word) && current.word != ''"
    define:
      prev_primary_or_boundary: >-
        look_back_where(current, 100,
          '(candidate.type == "vowel" && has(candidate.stress) && candidate.stress == 1) || candidate.phoneme == "SIL"')
      next_primary_or_boundary: "look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')"
      prior_vowel_in_word: >-
        find_within_word(current,
          "current.type == 'vowel'",
          "behind")
      no_primary_in_clause: >-
        (prev_primary_or_boundary == null || prev_primary_or_boundary.phoneme == 'SIL')
        && (next_primary_or_boundary == null || next_primary_or_boundary.phoneme == 'SIL')
      after_word: >-
        look_ahead_where(current, 100,
          'candidate.phoneme == "SIL" || !(has(candidate.word) && has(source.word) && candidate.word == source.word)')
      in_last_word: "after_word == null || after_word.phoneme == 'SIL'"
      already_primary: "has(current.stress) && current.stress == 1"
    constraint: "!already_primary && no_primary_in_clause && in_last_word && prior_vowel_in_word == null"
    apply:
      - field: stress
        op: set
        value: 1
        tag: fallback_primary_stress
    citations:
      - "DECtalk 4.63 ph_sort.c:1181-1189 (every breath group must have at least one 1-stress)"
      - "DECtalk 4.63 ph_sort2.c:129-181 find_syll_to_stress (first syllabic of the last word)"

  # "Exclamation point raises last stress of sentence to emphasis"
  # (ph_sort.c:1205-1209): raise_last_stress walks back from the '!' and turns
  # the first primary stress it meets into emphasis. It runs after the
  # breath-group rule above, in the same pass.
  dectalk_exclamation_emphasis:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'vowel' && get(current, 'stress', 0) == 1"
    define:
      next_primary_or_boundary: >-
        look_ahead_where(current, 1000,
          '(candidate.type == "vowel" && get(candidate, "stress", 0) == 1) || (candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null)')
    constraint: >-
      next_primary_or_boundary != null && next_primary_or_boundary.phoneme == 'SIL'
      && next_primary_or_boundary.punctuationSymbol == '!'
    apply:
      - field: stress
        op: set
        value: 3
        tag: emphasis
    citations:
      - "DECtalk 4.63 ph_sort.c:1205-1209 (exclamation point raises last stress of sentence to emphasis)"
      - "DECtalk 4.63 ph_sort.c:1817-1829 raise_last_stress"

  # -------------------------------------------------------------------------
  # A HELPER VERB THAT IS THE ONLY VERB (ph_task.c:598-626, ph_sort.c:1272-1302).
  #
  # "Helper verbs that are marked as functors and unstressed ... need to be
  # handled differently if they're the only verb in the phrase in which case
  # they are the verb and not a helper" (ph_task.c:602-608).
  #
  # As each word's form class arrives, DECtalk counts the words that are verb,
  # ed, be or ing. The second one in a clause clears a flag; the first sets it
  # if the word is also a function word. Its phone sort then gives secondary
  # stress to the first vowel of the first word that reaches its verb branch
  # (verb or ed, and neither noun nor adj, which are tested first) and clears
  # the flag.
  #
  # The count starts again at each clause; the flag does not. A flag that no
  # word used stays set for the following clauses: after "He can." ("can" is
  # also a noun), "They went." has emphasis on "went".
  #
  # The stress is added to the vowel's own: none becomes secondary, primary
  # becomes emphasis (DECtalk's stress field holds both bits).
  #
  # Two rules: the first writes each clause's three counts on its final
  # silence, the second reads its own clause's counts and, for the carried
  # flag, the nearest earlier clause that settled it.
  dectalk_clause_verb_summary:
    kind: scalar
    select:
      relation: Segment
      where: "current.phoneme == 'SIL' && get(current, 'punctuationSymbol', null) != null"
    define:
      # The word after a clause break: its class arrived before the break's
      # comma, in this clause, and is counted here. The comma is a symbol of
      # this clause and carries that class, so the phone sort also takes the
      # word through its verb branch: it uses the flag up, with no vowel to
      # stress ("... cat, and they remain here today." has no promotion).
      n: next
      late_verb: >-
        dectalk_late_class(n, 'verb') || dectalk_late_class(n, 'ed')
        || dectalk_late_class(n, 'be') || dectalk_late_class(n, 'ing')
      late_function_verb: "late_verb && dectalk_late_class(n, 'func')"
      late_verb_branch: >-
        (dectalk_late_class(n, 'verb') || dectalk_late_class(n, 'ed'))
        && !dectalk_late_class(n, 'noun') && !dectalk_late_class(n, 'adj')
      # A written comma, colon or semicolon: LTS sets its form-class index
      # back to 1 and then sends the COMMA, and sending a phone first sends
      # the class at the index when the index has moved. So the class of the
      # first word since the last written break arrives a second time, in the
      # clause the comma ends, and is counted again: "Be late, they went."
      # counts "be" twice, which clears the flag "be" had set, and "went" is
      # not promoted. The comma carries that class through the phone sort too.
      written_break: >-
        get(current, 'punctuationSymbol', null) in [',', ':', ';']
        && !(n != null && path(n, 'R:SylStructure.parent.parent') != null
             && isTrue(path(n, 'R:SylStructure.parent.parent'), 'clause_break_before'))
      written_before: "look_back_pred(current, 1000, 'is_written_clause_silence')"
      first: "written_before == null ? behind(current, current_index) : ahead(written_before, 1)"
      resent_verb: >-
        written_break
        && (dectalk_word_class(first, 'verb') || dectalk_word_class(first, 'ed')
            || dectalk_word_class(first, 'be') || dectalk_word_class(first, 'ing'))
      resent_function_verb: "resent_verb && dectalk_word_class(first, 'func')"
      resent_verb_branch: >-
        written_break
        && (dectalk_word_class(first, 'verb') || dectalk_word_class(first, 'ed'))
        && !dectalk_word_class(first, 'noun') && !dectalk_word_class(first, 'adj')
    apply:
      - field: clause_verb_count
        op: set
        value: >-
          count_back_pred(current, 1000, 'is_clause_silence', 'is_verb_count_word_start')
          + (late_verb ? 1.0 : 0.0) + (resent_verb ? 1.0 : 0.0)
        tag: stress
      - field: clause_function_verb_count
        op: set
        value: >-
          count_back_pred(current, 1000, 'is_clause_silence', 'is_function_verb_word_start')
          + (late_function_verb ? 1.0 : 0.0) + (resent_function_verb ? 1.0 : 0.0)
        tag: stress
      - field: clause_verb_branch_count
        op: set
        value: >-
          count_back_pred(current, 1000, 'is_clause_silence', 'is_verb_branch_word_start')
          + (late_verb_branch ? 1.0 : 0.0) + (resent_verb_branch ? 1.0 : 0.0)
        tag: stress
    citations:
      - "DECtalk 4.63 ph_task.c:611-626 (number_verbs counts words of class VERB, ED, BE or ING; FUNC sets promote_helper_verb)"
      - "DECtalk 4.63 ph_sort.c:1272-1284 (NOUN, then ADJ, then VERB or ED)"
      - "DECtalk 4.63 ph_claus.c:405 (number_verbs is cleared when a clause has been spoken)"
      - "DECtalk 4.63 LTS/ls_util.c:808-853 (a word's WORD_CLASS is written before the COMMA of a break in front of it)"
      - "DECtalk 4.63 ph_task.c:590 with ph_sort.c:1245-1302 (every symbol has the held class; the sort tests each one)"
      - "DECtalk 4.63 LTS/ls_task.c:1269-1275 (at ',', ':' or ';' fc_index is set to 1 and old_fc_index to -1, then the COMMA is sent); ls_task.c:5062-5063, 5284-5285 (a sentence's first word is index 1)"
      - "DECtalk 4.63 LTS/ls_util.c:808-818 (sending a phone first sends WORD_CLASS of fc_struct[fc_index] when the index differs from the last one sent)"
      - "DECtalk 4.63 word classes as PH receives them, printed by the instrumented build: 'Be late, they went.' 00800010, 00000003, 00800010 before the comma; 'To be, they went.' 00811000, 00800010, 00811000; 'He can, they went.' 00802000, 00820408, 00802000"

  dectalk_helper_verb_promotion:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.type == 'vowel'
        && (dectalk_has_class(current, 'verb') || dectalk_has_class(current, 'ed'))
        && !dectalk_has_class(current, 'noun') && !dectalk_has_class(current, 'adj')
    define:
      clause_end: >-
        look_ahead_where(current, 1000,
          'candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null')
      prior_vowel_in_word: >-
        find_within_word(current,
          "current.type == 'vowel'",
          "behind")
      at_word_start: dectalk_word_start(current)
      # Words of the verb branch that begin before this vowel in its clause;
      # this vowel's own word is one of them unless the vowel begins it.
      branch_words_before: "count_back_pred(current, 1000, 'is_clause_silence', 'is_verb_branch_word_start')"
      in_first_branch_word: "branch_words_before == (at_word_start ? 0.0 : 1.0)"
      verbs: "clause_end == null ? 0.0 : get(clause_end, 'clause_verb_count', 0.0)"
      function_verbs: "clause_end == null ? 0.0 : get(clause_end, 'clause_function_verb_count', 0.0)"
      # The nearest earlier clause that left the flag in a known state: it had
      # two verbs (cleared), a single function verb (set), or a word of the
      # verb branch (cleared, whether or not it was used).
      settling_clause: >-
        look_back_where(current, 5000,
          'candidate.phoneme == "SIL" && (get(candidate, "clause_verb_count", 0.0) > 1.0 || get(candidate, "clause_function_verb_count", 0.0) >= 1.0 || get(candidate, "clause_verb_branch_count", 0.0) > 0.0)')
      carried: >-
        settling_clause != null
        && get(settling_clause, 'clause_verb_count', 0.0) == 1.0
        && get(settling_clause, 'clause_function_verb_count', 0.0) == 1.0
        && get(settling_clause, 'clause_verb_branch_count', 0.0) == 0.0
      flag: "verbs > 1.0 ? false : (verbs == 1.0 && function_verbs == 1.0 ? true : carried)"
      stress_now: "get(current, 'stress', 0)"
    constraint: "clause_end != null && prior_vowel_in_word == null && in_first_branch_word && flag"
    apply:
      - field: stress
        op: set
        value: "stress_now == 1 || stress_now == 3 ? 3.0 : 2.0"
        tag: stress
      - field: helper_verb_promoted
        op: set
        value: "true"
        tag: stress
    citations:
      - "DECtalk 4.63 ph_task.c:598-626 (promote_helper_verb: a function-word verb that is the clause's only verb)"
      - "DECtalk 4.63 ph_sort.c:1283-1302 (S2 before the first vowel of the first VERB or ED word, flag cleared)"
      - "DECtalk 4.63 ph_defs.h:219-225 (FSTRESS_1 01, FSTRESS_2 02, both = FEMPHASIS)"

  dectalk_word_initial_consonant:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme != 'SIL' && current.type != 'vowel'
        && !(current.phoneme in ['EL', 'EM', 'EN'])
        && has(current.word) && current.word != ''
    define:
      prior_syllabic_in_word: >-
        find_within_word(current,
          "current.type == 'vowel' || current.phoneme in ['EL', 'EM', 'EN']",
          "behind")
    constraint: prior_syllabic_in_word == null
    apply:
      - field: word_initial_consonant
        op: set
        value: true
        tag: word_initial_consonant
    citations:
      - "DECtalk 4.63 ph_sort.c:1352,1383-1389 (FWINITC on phones before the word's first syllabic)"

  dectalk_consonant_stress:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme != 'SIL' && current.type != 'vowel'
        && !(current.phoneme in ['EL', 'EM', 'EN'])
        && has(current.word) && current.word != ''
    define:
      n1: next
      n2: "ahead(current, 2)"
      n3: "ahead(current, 3)"
      # Each phone is in the word of the one before it, starting from current.
      in1: "n1 != null && dectalk_same_word(current, n1)"
      in2: "in1 && n2 != null && dectalk_same_word(n1, n2)"
      in3: "in2 && n3 != null && dectalk_same_word(n2, n3)"
      syl1: "in1 && (n1.type == 'vowel' || n1.phoneme in ['EL', 'EM', 'EN'])"
      syl2: "in2 && (n2.type == 'vowel' || n2.phoneme in ['EL', 'EM', 'EN'])"
      syl3: "in3 && (n3.type == 'vowel' || n3.phoneme in ['EL', 'EM', 'EN'])"
      # `stress` may be present and null; get() reads that as 0. Before a
      # vowel the helper-verb promotion reached, DECtalk's consonant has
      # secondary stress even where the vowel ends with emphasis (its debug
      # build on "They do.", "They have.", "He can. They went.": consonant 2,
      # vowel 3; an exclamation's emphasis gives the consonant 3).
      stress1: "syl1 ? (get(n1, 'helper_verb_promoted', false) ? 2 : get(n1, 'stress', 0)) : 0"
      stress2: "syl2 ? (get(n2, 'helper_verb_promoted', false) ? 2 : get(n2, 'stress', 0)) : 0"
      stress3: "syl3 ? (get(n3, 'helper_verb_promoted', false) ? 2 : get(n3, 'stress', 0)) : 0"
      pair12: "in1 && !syl1 ? dectalk_onset_cluster(current.phoneme, n1.phoneme) : 'none'"
      pair23: "in2 && !syl1 && !syl2 ? dectalk_onset_cluster(n1.phoneme, n2.phoneme) : 'none'"
      # A morpheme boundary or compound joint between the consonant and the
      # syllabic is a symbol of its own in DECtalk's scan: it counts as a
      # member of the would-be cluster and is no legal one, so the consonant
      # takes nothing ("with|out": the TH is unstressed before AW2).
      mark0: "isTrue(current, 'morpheme_boundary_after')"
      mark1: "mark0 || (in1 && !syl1 && isTrue(n1, 'morpheme_boundary_after'))"
      mark2: "mark1 || (in2 && !syl1 && !syl2 && isTrue(n2, 'morpheme_boundary_after'))"
      inherited: >-
        stress1 > 0 ? (mark0 ? 0 : stress1) :
        (!syl1 && stress2 > 0 && pair12 != 'none' ? (mark1 ? 0 : stress2) :
        (!syl1 && !syl2 && stress3 > 0 && pair23 == 's_onset' && current.phoneme == 'S'
          ? (mark2 ? 0 : stress3) : 0))
    constraint: inherited > 0
    apply:
      - field: stress
        op: set
        value: inherited
        tag: consonant_stress
    citations:
      - "DECtalk 4.63 p_us_sr1.c:73-140 get_stress_of_conson (consonant takes the stress of the syllabic its onset leads into)"
      - "DECtalk 4.63 p_us_sr1.c:83-105 (the scan counts every symbol up to the stress mark, a boundary symbol included, and us_phcluster rejects it)"
      - "DECtalk 4.63 p_us_sr1.c:175-228 us_phcluster (legal onset pairs)"

  # The article "a" arrives as AX from the lexicon stage, where DECtalk decides
  # it (LTS/ls_task.c:2647-2673; lts-table.json wordsByPunctuation): no rule
  # here.

  # -------------------------------------------------------------------------
  # "Rule 1a: The word 'the' should be /dh iy/ before a syllabic"
  # (ph_aloph.c:735-748). The source does not look at the word: a schwa that
  # ends its word, follows a word-initial /dh/ and stands before a syllabic
  # becomes IY. "The old man" is DH IY OW LX D.
  # -------------------------------------------------------------------------
  dectalk_the_before_vowel:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'AX' && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      n: next
      iy: "target('IY0')"
      after_word_initial_dh: >-
        p != null && p.phoneme == 'DH' && isTrue(p, 'word_initial_consonant')
      # (curr_instruc & FBOUNDARY) IS_PLUS: the schwa is the last phone of its word.
      word_final: >-
        n != null && n.phoneme != 'SIL'
        && has(n.word) && has(current.word) && n.word != current.word
      before_syllabic: >-
        n != null && (n.type == 'vowel' || n.phoneme in ['EL', 'EM', 'EN'])
    constraint: "after_word_initial_dh && word_final && before_syllabic"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'IY'"
          type: iy.type
          target: iy
          duration: iy.duration
          inherentDuration: iy.inherentDuration
          minimumDuration: "has(iy.minimumDuration) ? iy.minimumDuration : iy.duration"
          voiced: "has(iy.voiced) ? iy.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:735-748 (Rule 1a: AX with a boundary, after a word-initial DH, before a syllabic -> IY)"

  # Rule 1c (ph_aloph.c:765-781): AE N D right after a silence has EH for its
  # AE, when the AE and the D are unstressed or the clause is not being cited.
  # A clause is cited when it has fewer than ten entries, its two silences
  # included (:486-501; citation mode is DECtalk's default, cm_util.c:156):
  # "Silver, and gold." keeps the AE of its promoted "and" (nine entries), the
  # second clause of "The big dog barked, and the small cat ran away." has EH.
  # At a speaking rate under 100 words a minute every clause is cited
  # (:500-501), whatever its length.
  dectalk_clause_initial_and:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'AE'"
    define:
      p: prev
      n: next
      d: "ahead(current, 2)"
      eh: "target('EH0')"
      after_silence: "p == null || p.phoneme == 'SIL'"
      spells_and: "n != null && n.phoneme == 'N' && d != null && d.phoneme == 'D'"
      unstressed: "get(current, 'stress', 0) == 0 && get(d, 'stress', 0) == 0"
      # nphonetot counts the clause's phones and its two silences.
      cited: >-
        clause_phone_count() + 2 < 10
        || params.policy.timing.speaking_rate_wpm < params.policy.timing.citation_below_wpm
    constraint: "after_silence && spells_and && (unstressed || !cited)"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'EH'"
          type: eh.type
          target: eh
          duration: eh.duration
          inherentDuration: eh.inherentDuration
          minimumDuration: "has(eh.minimumDuration) ? eh.minimumDuration : eh.duration"
          voiced: "has(eh.voiced) ? eh.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:765-781 (Rule 1c: after a silence, AE N D -> EH N D when AE and D are unstressed or !Cite_It)"
      - "DECtalk 4.63 ph_aloph.c:486-501 (docitation = nphonetot < 10; Cite_It = MODE_CITATION && docitation; Cite_It = TRUE when sprate < 100)"

  # The rule the source also labels 1c (ph_aloph.c:801-814): an AE before T
  # becomes EH in a clause that is not cited, when the AE and the phone before
  # it both carry a plain word boundary. The AE then begins its word (the
  # phone before it ends one, or is the clause's first silence before a plain
  # word) and is in its last rime, with a plain word after it: the word "at".
  # "barked, at the small cat ..." has EH T.
  #
  # Here the last rime is taken as AE T alone; a longer one (AE T S) is not
  # covered.
  dectalk_at_reduced:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'AE' && dectalk_word_start(current)"
    define:
      n: next
      after: "ahead(current, 2)"
      eh: "target('EH0')"
      # The boundary in front of the word is a word boundary: the word starts
      # no phrase.
      plain_before: >-
        dectalk_phrase_start(current) != 'vp' && dectalk_phrase_state(current) != 'pp'
      before_final_t: >-
        n != null && n.phoneme == 'T' && dectalk_same_word(current, n)
        && after != null && after.phoneme != 'SIL' && dectalk_word_start(after)
      plain_after: >-
        dectalk_phrase_start(after) != 'vp' && dectalk_phrase_state(after) != 'pp'
      cited: >-
        clause_phone_count() + 2 < 10
        || params.policy.timing.speaking_rate_wpm < params.policy.timing.citation_below_wpm
    constraint: "plain_before && before_final_t && plain_after && !cited"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'EH'"
          type: eh.type
          target: eh
          duration: eh.duration
          inherentDuration: eh.inherentDuration
          minimumDuration: "has(eh.minimumDuration) ? eh.minimumDuration : eh.duration"
          voiced: "has(eh.voiced) ? eh.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:801-814 (AE before T, FWBNEXT on the AE and on the phone before it, !Cite_It: AE -> EH)"
      - "DECtalk 4.63 ph_aloph.c:486-501 (docitation = nphonetot < 10; Cite_It = MODE_CITATION && docitation; Cite_It = TRUE when sprate < 100)"
      - "DECtalk 4.63 ph_defs.h:250-261 (FBOUNDARY values; FWBNEXT 0140 is the plain word boundary)"

  # -------------------------------------------------------------------------
  # GEMINATE OBSTRUENT DELETION (ph_aloph.c:558-562, A1).  When an obstruent is
  # immediately followed by an identical phoneme, the first copy is deleted.
  # phonemes[] holds phones only (boundaries are bits of the structure word), so
  # the pair may straddle a word boundary: DECtalk says "Pat tapped" with one
  # [t] (P AE T AE P T in its record), as it says "bookkeeper" with one [k].
  # Source:
  #   if (phonemes[n] == phonemes[n+1]
  #       && (phone_feature(phonemes[n]) & FOBST))
  #       dodelete = TRUE;
  # FOBST (ph_defs.h) = obstruents: stops + fricatives + affricates.  This port
  # represents that membership in `type` exactly as the duration rules already do
  # (duration.yaml:36-37 / 268-270): type in
  # ['fricative','stop_closure','affricate'].  At the postlexical stage a raw stop
  # is still a single closure token (the structural release/aspiration split runs
  # later), so 'stop_closure' is the right obstruent-stop type here.  The rule
  # compares the RAW input phonemes, so it keys on `current.phoneme` vs
  # `next.phoneme` (no prior allophone rewrite has fired on these yet -- this is
  # the FIRST postlexical rule, mirroring its position before the FBLOCK skip at
  # ph_aloph.c:563).
  #
  # Mechanism: DECtalk's `dodelete` removes the FIRST copy; the second survives
  # with its own structure word (its word, its stress, its word-initial bit).
  # A bare `delete: true` on a base-relation token would leave a time gap and
  # trip the engine's contiguity check (E_BASE_NOT_CONTIGUOUS), so the deletion
  # is a splice over the [current, next] range that re-inserts a whole copy of
  # the second obstruent.
  # -------------------------------------------------------------------------
  dectalk_geminate_delete:
    kind: postlexical
    select:
      relation: Segment
      where: >-
        current.type in ['fricative', 'stop_closure', 'affricate']
    define:
      n: next
      same_as_next: >-
        n != null && has(n.phoneme) && n.phoneme == current.phoneme
    constraint: same_as_next
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: n.sync_right
      insert:
        - copy_from: next
          # DECtalk's later rules index its input phones, where the deleted
          # one still stands ahead of this one.
          after_deleted_geminate: "true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:558-562 (A1: delete an obstruent identical to the following phoneme; geminate reduction)"
      - "DECtalk 4.63 ph_defs.h (FOBST obstruent feature = stops + fricatives + affricates)"

  # -------------------------------------------------------------------------
  # CORONAL SIBILANT ASSIMILATION (ph_aloph.c:715-722, A4).  An /s/ or /z/ that
  # is immediately followed by /SH/ assimilates to the postalveolar place of the
  # following sibilant: S -> SH, Z -> ZH.  As with A1 geminate deletion, the
  # pair may straddle a word boundary: DECtalk says "These shoes shine." as
  # DH IY ZH SH UW ZH SH AY N.  The source is a pure next-phoneme test:
  #   if (phonemes[n+1] == USP_SH) {
  #     if (curr_inph == USP_S)  curr_outph = USP_SH;
  #     if (curr_inph == USP_Z)  curr_outph = USP_ZH;
  #   }
  # (The #ifdef GERMAN_out S/TS block just above and the #ifdef talk schwa block
  # just below are compiled out and not ported.)  SH and ZH are already in the
  # inventory (postalveolar fricatives).  S/Z operate on a different segment class
  # than the /t,d/ and /R/ allophone rules, so this rule never conflicts with
  # them; it is placed early (after geminate) to mirror its source position
  # (L715, ahead of glottalization at L912).
  #
  # Mechanism: a structural splice over the single /s,z/ token, swapping in the
  # SH/ZH inventory target's acoustics (a bare `op:set phoneme` would rename the
  # token without re-materializing the fricative's formant/AF params -- the same
  # reason every other rewrite in this phase uses splice + target()).
  # -------------------------------------------------------------------------
  dectalk_assimilate_sibilant_sh:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme in ['S', 'Z'] && !isTrue(current, 'rules_blocked')"
    define:
      n: next
      next_is_sh: "n != null && n.phoneme == 'SH'"
      assim_name: "current.phoneme == 'S' ? 'SH' : 'ZH'"
      at: "target(assim_name)"
    constraint: next_is_sh
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: assim_name
          type: at.type
          target: at
          duration: "min([current.duration, at.duration])"
          inherentDuration: at.inherentDuration
          minimumDuration: "has(at.minimumDuration) ? at.minimumDuration : at.duration"
          voiced: "has(at.voiced) ? at.voiced : (current.phoneme == 'Z')"
    citations:
      - "DECtalk 4.63 ph_aloph.c:715-722 (A4: /s/ -> SH, /z/ -> ZH before /SH/)"
      - "DECtalk 4.63 p_us_rom.h us_maltar/us_inhdr (US_SH/US_ZH postalveolar fricative targets)"

  # number_words for the flapping rules below (ph_aloph.c:958): DECtalk counts
  # the word-boundary symbols of the clause (ph_sort.c:1464). A word entered
  # with a verb-phrase start has none, except the clause's first word, which
  # always has one ("Read it twice." counts 3 and flaps its /d/); a
  # clause-final "to", "and" or "for" has two (ph_sort.c:1055-1070). The same
  # count as the F0 baseline's (prosody.yaml, dectalk_clause_number_words).
  # The clause's first phone counts the clause; every later phone takes the
  # number from the phone before it.
  dectalk_clause_counted_words:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define:
      before: dectalk_prev(current)
      first: "before == null || before.phoneme == 'SIL'"
    apply:
      - field: clause_counted_words
        op: set
        value: >-
          !first ? get(before, 'clause_counted_words', 0.0)
          : (dectalk_word_start(current) ? 1.0 : 0.0)
            + count_ahead_pred(current, 1000, 'is_clause_silence', 'is_number_word_start')
            + (dectalk_phrase_state(current) == 'word' ? 1.0 : 0.0)
            + count_ahead_pred(current, 1000, 'is_clause_silence', 'is_twice_counted_word_start')
        tag: boundary
    citations:
      - "DECtalk 4.63 ph_sort.c:1462-1464 (number_words: one more at each WBOUND)"
      - "DECtalk 4.63 ph_aloph.c:958 (the flapping rule's number_words >= 3)"

  dectalk_flap_t:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'T' && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      n: next
      df: "target('DF')"
      # number_words >= 3 (ph_aloph.c:958). DECtalk counts the word-boundary
      # symbols of the clause (ph_sort.c:1464), and a word entered with a
      # verb-phrase start has none: "It is better." flaps, "They went better."
      # and "It is, much better." do not.
      # Counted once a clause by dectalk_clause_counted_words.
      counted_words: "get(current, 'clause_counted_words', 0.0)"
      phrase_ok: "counted_words >= 3.0"
      current_unstressed: "get(current, 'stress', 0) == 0"
      prev_son1: >-
        p != null && (p.type in ['vowel', 'glide', 'liquid', 'nasal']) &&
        !(p.phoneme in ['M', 'N', 'NG'])
      prev_is_stressed_vowel: >-
        p != null && p.type == 'vowel' && (has(p.stress) && p.stress == 1)
      next_syllabic: >-
        n != null && (n.type == 'vowel' || n.phoneme in ['EL', 'EM', 'EN'])
      next_word_boundary: >-
        n == null ? true :
        (has(n.word) && has(current.word) ? n.word != current.word : true)
      next_weak_vowel: >-
        n != null && (
          n.phoneme in ['AX', 'RR', 'IY', 'IX', 'EL'] ||
          (prev_is_stressed_vowel && n.phoneme == 'OW')
        )
    constraint: >-
      phrase_ok && current_unstressed && prev_son1 && next_syllabic &&
      (next_word_boundary || (!isTrue(current, 'word_initial_consonant') && next_weak_vowel))
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'DF'"
          type: df.type
          target: df
          duration: "min([current.duration, df.duration])"
          inherentDuration: df.inherentDuration
          minimumDuration: "has(df.minimumDuration) ? df.minimumDuration : df.duration"
          voiced: "has(df.voiced) ? df.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:958-1040 (A18 flapping rule: unstressed intervocalic /t/ -> DF, number_words >= 3 gate)"
      - "DECtalk 4.63 ph_defs.h (FSYLL/FSON1/FNASAL feature definitions used by the trigger)"
      - "DECtalk 4.63 p_us_rom.h us_maltar/us_inhdr (US_DF flap target)"

  dectalk_flap_d:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'D' && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      n: next
      dx: "target('DX')"
      # number_words >= 3 (ph_aloph.c:958). DECtalk counts the word-boundary
      # symbols of the clause (ph_sort.c:1464), and a word entered with a
      # verb-phrase start has none: "It is better." flaps, "They went better."
      # and "It is, much better." do not.
      # Counted once a clause by dectalk_clause_counted_words.
      counted_words: "get(current, 'clause_counted_words', 0.0)"
      phrase_ok: "counted_words >= 3.0"
      current_unstressed: "get(current, 'stress', 0) == 0"
      prev_son1: >-
        p != null && (p.type in ['vowel', 'glide', 'liquid', 'nasal']) &&
        !(p.phoneme in ['M', 'N', 'NG'])
      prev_is_stressed_vowel: >-
        p != null && p.type == 'vowel' && (has(p.stress) && p.stress == 1)
      next_syllabic: >-
        n != null && (n.type == 'vowel' || n.phoneme in ['EL', 'EM', 'EN'])
      next_word_boundary: >-
        n == null ? true :
        (has(n.word) && has(current.word) ? n.word != current.word : true)
      next_weak_vowel: >-
        n != null && (
          n.phoneme in ['AX', 'RR', 'IY', 'IX', 'EL'] ||
          (prev_is_stressed_vowel && n.phoneme == 'OW')
        )
    constraint: >-
      phrase_ok && current_unstressed && prev_son1 && next_syllabic &&
      (next_word_boundary || (!isTrue(current, 'word_initial_consonant') && next_weak_vowel))
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'DX'"
          type: dx.type
          target: dx
          duration: "min([current.duration, dx.duration])"
          inherentDuration: dx.inherentDuration
          minimumDuration: "has(dx.minimumDuration) ? dx.minimumDuration : dx.duration"
          voiced: "has(dx.voiced) ? dx.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:958-1040 (A18 flapping rule: unstressed intervocalic /d/ -> DX, number_words >= 3 gate)"
      - "DECtalk 4.63 ph_defs.h (FSYLL/FSON1/FNASAL feature definitions used by the trigger)"
      - "DECtalk 4.63 p_us_rom.h us_maltar/us_inhdr (US_DX flap target)"

  # -------------------------------------------------------------------------
  # PALATALIZATION (ph_aloph.c:878-891).  /t/ -> CH, /d/ -> JH when the next
  # phoneme is an unstressed palatal glide /y/ ("got you" -> "gotcha",
  # "did you" -> "didja").  Source trigger:
  #   if ((next == USP_YU || next == USP_YX) && (sentstruc[n+1] & FSTRESS) IS_MINUS)
  #       T -> CH (goto endrul3);  D -> JH (goto endrul3)
  # USP_YX resolves to US_Y (p_all_ph.h:80), USP_YU to US_YU: the glide Y and
  # the vowel YU of "you".  (sentstruc & FSTRESS) IS_MINUS is no stress bit at
  # all.  The `goto endrul3` means palatalization is mutually
  # exclusive with (and takes precedence over) glottalization and flapping for
  # the same /t,d/; the pipeline orders these rules first to honor that.
  # -------------------------------------------------------------------------
  dectalk_palatalize_t:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'T' && !isTrue(current, 'rules_blocked')"
    define:
      n: next
      ch: "target('CH')"
      next_unstressed_y: >-
        n != null && n.phoneme in ['Y', 'YU'] && get(n, 'stress', 0) == 0
    constraint: next_unstressed_y
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'CH'"
          type: ch.type
          target: ch
          duration: ch.duration
          inherentDuration: ch.inherentDuration
          minimumDuration: "has(ch.minimumDuration) ? ch.minimumDuration : ch.duration"
          voiced: "has(ch.voiced) ? ch.voiced : false"
    citations:
      - "DECtalk 4.63 ph_aloph.c:878-891 (palatalize /t/ -> CH before unstressed /y/)"
      - "DECtalk 4.63 p_all_ph.h:71,80 (USP_YU = US_YU, USP_YX = US_Y palatal glide)"

  dectalk_palatalize_d:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'D' && !isTrue(current, 'rules_blocked')"
    define:
      n: next
      jh: "target('JH')"
      next_unstressed_y: >-
        n != null && n.phoneme in ['Y', 'YU'] && get(n, 'stress', 0) == 0
    constraint: next_unstressed_y
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'JH'"
          type: jh.type
          target: jh
          duration: jh.duration
          inherentDuration: jh.inherentDuration
          minimumDuration: "has(jh.minimumDuration) ? jh.minimumDuration : jh.duration"
          voiced: "has(jh.voiced) ? jh.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:878-891 (palatalize /d/ -> JH before unstressed /y/)"
      - "DECtalk 4.63 p_all_ph.h:71,80 (USP_YU = US_YU, USP_YX = US_Y palatal glide)"

  # -------------------------------------------------------------------------
  # GLOTTALIZATION (ph_aloph.c:912-927).  An unreleased /t/ in a glottalizing
  # context becomes a glottalized /t/ (TX) when preceded by a sonorant, or a
  # plain /d/ otherwise.  Source trigger:
  #   if (curr == USP_T && (phone_feature(phonemes[n-2]) & FLABIAL) IS_MINUS)
  #     if ( next == USP_LL || next == USP_DH
  #          || ( ((curr_instruc & FBOUNDARY) >= FMBNEXT)
  #               && ((feature(next) & FSON2) || next == USP_HX) )
  #          || next == USP_EN )
  #        { curr = USP_D;  if (feature(last_outph) & FSON1) curr = USP_TX;  goto endrul3; }
  #
  # THE GATE IS NOT ABOUT LABIALS. FLABIAL (0000001, ph_defs.h:339) is a bit of
  # the place table, but the line reads phone_feature(), the general feature
  # table, where 0000001 is FSYLL (ph_defs.h:316). So the /t/ rules apply when
  # the phone two back is not syllabic. DECtalk's debug build agrees: T stays
  # in "went home" (EH two back) and is glottalized in "stop it now" (P two
  # back) and "bought the" (B two back).
  #
  # "Two back" counts DECtalk's input phones: a /t/ that survived geminate
  # deletion still has the deleted one in front of it there.
  #
  # Feature membership (ph_defs.h): FSON2 = {W,Y,R,L,YU,M,N,NG,EM,EN}; FSON1 =
  # vowels/glides/liquids/nasals (this port's `type`).
  # Port symbol mapping: USP_LL -> the port's plain lateral L (the port does not
  # distinguish DECtalk's lexical /LL/); USP_HX -> HH; USP_EN -> EN.  The /t/->TX
  # vs /t/->D choice is selected at runtime by glot_target.  `goto endrul3` makes
  # this mutually exclusive with flapping; the pipeline orders it before flap_t.
  # The next==EN clause is the "button"/"mountain" syllabic-nasal case the mission
  # names; it only fires when the transcription actually emits EN after the /t/.
  # -------------------------------------------------------------------------
  dectalk_glottalize_t:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'T' && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      n: next
      b2: "isTrue(current, 'after_deleted_geminate') ? behind(current, 1) : behind(current, 2)"
      two_back_not_syllabic: >-
        b2 == null || !(b2.type == 'vowel' || b2.phoneme in ['EL', 'EM', 'EN'])
      next_word_boundary: >-
        n == null ? true :
        (has(n.word) && has(current.word) ? n.word != current.word : true)
      next_son2: >-
        n != null && (n.phoneme in ['W', 'Y', 'R', 'L', 'YU', 'M', 'N', 'NG', 'EM', 'EN'])
      glottalizing_context: >-
        n != null && (
          n.phoneme == 'L' ||
          n.phoneme == 'DH' ||
          (next_word_boundary && (next_son2 || n.phoneme == 'HH')) ||
          n.phoneme == 'EN'
        )
      prev_son1: >-
        p != null && (p.type in ['vowel', 'glide', 'liquid', 'nasal'])
      glot_target: "prev_son1 ? 'TX' : 'D'"
      gt: "target(glot_target)"
    constraint: "two_back_not_syllabic && glottalizing_context"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: glot_target
          type: gt.type
          target: gt
          duration: "min([current.duration, gt.duration])"
          inherentDuration: gt.inherentDuration
          minimumDuration: "has(gt.minimumDuration) ? gt.minimumDuration : gt.duration"
          voiced: "has(gt.voiced) ? gt.voiced : false"
    citations:
      - "DECtalk 4.63 ph_aloph.c:912-927 (glottalize /t/ -> TX when preceded by a sonorant, else -> D, in a glottalizing context)"
      - "DECtalk 4.63 ph_defs.h (FLABIAL/FSON1/FSON2 feature definitions used by the trigger)"
      - "DECtalk 4.63 p_us_rom.h us_maltar/us_inhdr (US_TX glottalized-/t/ target)"

  # "Unreduce the O in 'to' if following segment is a vowel" (ph_aloph.c:928-937,
  # in the same /t/ block, after the glottalization above has had its turn):
  # an unstressed /t/ followed by UH, with a syllabic or a silence after that,
  # has UW for the UH. "I went to and from it." is T UW.
  dectalk_to_before_vowel:
    kind: postlexical
    select:
      relation: Segment
      where: current.phoneme == 'UH'
    define:
      p: prev
      n: next
      # The /t/ block's gate (see dectalk_glottalize_t): the phone two before
      # the /t/, in DECtalk's input, is not syllabic.
      b3: "isTrue(p, 'after_deleted_geminate') ? behind(current, 2) : behind(current, 3)"
      two_back_not_syllabic: >-
        b3 == null || !(b3.type == 'vowel' || b3.phoneme in ['EL', 'EM', 'EN'])
      after_unstressed_t: "p != null && p.phoneme == 'T' && get(p, 'stress', 0) == 0"
      before_syllabic_or_silence: >-
        n == null || n.phoneme == 'SIL' || n.type == 'vowel' || n.phoneme in ['EL', 'EM', 'EN']
      uw: "target('UW0')"
    # The rule belongs to the /t/'s turn: a blocked /t/ skips it.
    constraint: >-
      two_back_not_syllabic && after_unstressed_t && before_syllabic_or_silence
      && !isTrue(p, 'rules_blocked')
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'UW'"
          type: uw.type
          target: uw
          duration: uw.duration
          inherentDuration: uw.inherentDuration
          minimumDuration: "has(uw.minimumDuration) ? uw.minimumDuration : uw.duration"
          voiced: "has(uw.voiced) ? uw.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:928-937 (T, then UH, unstressed, before a syllabic or silence: UH -> UW)"
      - "DECtalk 4.63 ph_aloph.c:912 with ph_defs.h:316,339 (the /t/ rules apply when the phone two back is not syllabic)"

  # -------------------------------------------------------------------------
  # DENTALIZATION (ph_aloph.c:1066-1082 Rule 4).  An unstressed /dh/ becomes a
  # dentalized voiced stop (DZ) when the preceding (already-rewritten) phoneme is
  # /t/, /tx/ or /d/ ("at the" -> "a-DZ-uh", "let the").  Source trigger:
  #   if (curr == USP_DH && (curr_instruc & FSTRESS) IS_MINUS)
  #     if (last_outph == USP_T || last_outph == USP_TX || last_outph == USP_D)
  #        curr = USP_DZ;
  # `last_outph` is the OUTPUT of the prior token after earlier allophone rules,
  # so this rule runs LAST in the postlexical phase (after glottalization may have
  # turned a preceding /t/ into TX).  The commented-out "last_outph == N -> N"
  # branch (temp out per KEN) and the #ifdef HLSYN r-block are not ported.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # SYLLABIC-N AFTER GLOTTALIZED /t/ (ph_aloph.c:1042-1051, "Rule 3a").  When the
  # PREVIOUS OUTPUT token is a glottalized /t/ (TX, produced by the glottalization
  # rule above) and the current phoneme is an unstressed vowel (other than /UW/)
  # followed by a nasal, the vowel is deleted and the following nasal becomes a
  # syllabic /EN/ ("certain" K ER TX AX N -> K ER TX EN; "mountain").  Source:
  #   if (allophons[nallotot-1] == USP_TX) {                 // prev OUTPUT == TX
  #     if (phone_feature(phonemes[n+1]) & FNASAL            // next is a nasal
  #         && (curr_instruc & FSTRESS) IS_MINUS             // current unstressed
  #         && phonemes[n] != USP_UW) {                      // current is not /UW/
  #       phonemes[n+1] = USP_EN;                            // next -> EN
  #       dodelete = TRUE;                                   // delete current vowel
  #     }
  #   }
  # FNASAL (ph_defs.h) = nasals M N NG (the same set the glottalization rule's
  # FSON2 clause names); use next.type == 'nasal'.  EN is already in the inventory
  # (syllabic schwa+nasal).  The current phoneme between a TX and a nasal is a
  # vowel by construction; we additionally gate on current.type == 'vowel' so the
  # rule can only collapse a genuine vowel nucleus (faithful to the recon's
  # "current is an unstressed vowel").
  #
  # PRECEDENCE: this reads the PRIOR token's already-rewritten output (== TX), so
  # it must run AFTER glottalization (which produces TX) and after flapping; it is
  # placed here, just before the dental /dh/ rule (which is last because it too
  # reads last_outph).  The #ifdef HLSYN r-block between this and the dental rule
  # (L1052-1063) is compiled out and not ported.
  #
  # Mechanism: a structural splice over the [vowel, nasal] range, replacing both
  # with ONE syllabic EN token copied from the EN inventory target (inheriting the
  # NASAL's word; EN is inherently unstressed so no stress is carried).  This both
  # deletes the vowel and rewrites the nasal to EN in a single edit, matching
  # DECtalk's `phonemes[n+1]=EN; dodelete=TRUE`.
  # -------------------------------------------------------------------------
  dectalk_syllabic_n_after_tx:
    kind: postlexical
    select:
      relation: Segment
      where: "current.type == 'vowel' && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      n: next
      en: "target('EN')"
      prev_is_tx: "p != null && p.phoneme == 'TX'"
      current_unstressed: "get(current, 'stress', 0) == 0"
      current_not_uw: "current.phoneme != 'UW'"
      next_is_nasal: "n != null && (n.type == 'nasal' || n.phoneme in ['M', 'N', 'NG'])"
    constraint: >-
      prev_is_tx && current_unstressed && current_not_uw && next_is_nasal
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: n.sync_right
      insert:
        - copy_from: next
          copy_fields:
            - word
          phoneme: "'EN'"
          type: en.type
          target: en
          duration: en.duration
          inherentDuration: en.inherentDuration
          minimumDuration: "has(en.minimumDuration) ? en.minimumDuration : en.duration"
          voiced: "has(en.voiced) ? en.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:1042-1051 (Rule 3a: after TX, an unstressed vowel (not /UW/) + nasal collapse to syllabic EN)"
      - "DECtalk 4.63 ph_defs.h (FNASAL nasal feature = M/N/NG)"
      - "DECtalk 4.63 p_us_rom.h us_maltar/us_inhdr (US_EN syllabic-nasal target)"

  dectalk_dental_dh:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'DH' && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      dz: "target('DZ')"
      current_unstressed: "get(current, 'stress', 0) == 0"
      prev_is_stop: >-
        p != null && (p.phoneme in ['T', 'TX', 'D'])
    constraint: "current_unstressed && prev_is_stop"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'DZ'"
          type: dz.type
          target: dz
          duration: "min([current.duration, dz.duration])"
          inherentDuration: dz.inherentDuration
          minimumDuration: "has(dz.minimumDuration) ? dz.minimumDuration : dz.duration"
          voiced: "has(dz.voiced) ? dz.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:1066-1082 (Rule 4: unstressed /dh/ -> DZ after /t,tx,d/)"
      - "DECtalk 4.63 p_us_rom.h us_maltar/us_inhdr (US_DZ dentalized-stop target)"

  # -------------------------------------------------------------------------
  # /t/ AFTER /n/ BECOMES [d] (p_us_tim.c:627-638). This one is in DECtalk's
  # duration routine, in the /n/'s turn of Rule 9: when the /n/ and the /t/
  # after it are both unstressed and not word-initial, and the phone after the
  # /t/ is a syllabic that is not in a medial or final syllable, the /t/ is
  # changed to [d] ("Change to [d] after durs"). "The president arrived" has
  # N D AX.
  #
  # The /n/ and the vowel before it were timed against a /t/; the [d] itself
  # and what follows are timed against a [d]. The mark lets the duration rules
  # tell the two apart (dectalk_ahead_name). This rule runs last, on the /t/
  # that the allophone rules left.
  # -------------------------------------------------------------------------
  dectalk_nt_voicing:
    kind: postlexical
    select:
      relation: Segment
      where: current.phoneme == 'T'
    define:
      p: prev
      n: next
      d: "target('D')"
      unstressed_medial: >-
        get(current, 'stress', 0) == 0 && !isTrue(current, 'word_initial_consonant')
      after_such_n: >-
        p != null && p.phoneme == 'N' && get(p, 'stress', 0) == 0
        && !isTrue(p, 'word_initial_consonant')
      next_syllabic: >-
        n != null && (n.type == 'vowel' || n.phoneme in ['EL', 'EM', 'EN'])
      # (allofeats & FMEDIALSYL) IS_MINUS: the bit is set for a medial and for
      # a final syllable, so the syllabic is the first or only one of its word.
      earlier_syllabic_in_its_word: >-
        !next_syllabic ? null
        : find_within_word(n,
            "current.type == 'vowel' || current.phoneme in ['EL', 'EM', 'EN']",
            "behind")
    constraint: >-
      unstressed_medial && after_such_n && next_syllabic && earlier_syllabic_in_its_word == null
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: "'D'"
          type: d.type
          target: d
          duration: d.duration
          inherentDuration: d.inherentDuration
          minimumDuration: "has(d.minimumDuration) ? d.minimumDuration : d.duration"
          voiced: "has(d.voiced) ? d.voiced : true"
          voiced_from_t: "true"
    citations:
      - "DECtalk 4.63 p_us_tim.c:627-638 (Rule 9: [nt] postvocalic cluster; the /t/ becomes [d] before an early syllabic)"
      - "DECtalk 4.63 ph_defs.h (FMEDIALSYL 020 within FTYPESYL 030)"

  # -------------------------------------------------------------------------
  # POSTVOCALIC VOWEL+R FUSION (ph_aloph.c:835-872, "Rule 2" A13).  A postvocalic
  # /R/ fuses INTO the preceding vowel, producing a single rhotic-vowel token and
  # DELETING the /R/ ("card" K AA R D -> K AR D, "start" -> S T AR T, "fear" ->
  # F IR, "cure" K Y UW R -> K Y UR).  Source (inside `if (curr_inph == USP_R)`,
  # under the postvocalic gate at L823):
  #   symlas = phonemes[n-1];
  #   AX            -> allophons[last] = RR  (+ dodelete)
  #   IY | IH       -> IR
  #   EY | EH | AE  -> ER
  #   AA | AH       -> AR
  #   OW | AO       -> OR
  #   UW | UH       -> UR
  # The gate (L823-824): (curr FSTRESS|FWINITC) IS_MINUS  &&  prev FVOWEL+.
  #   FSTRESS IS_MINUS  -> the /R/ is unstressed (a liquid carrying no main stress).
  #   FWINITC IS_MINUS  -> the /R/ is NOT a word-initial consonant (so "red", "real"
  #                        word-initial /R/ never fuses).
  #   prev FVOWEL+      -> the preceding phone is a vowel (postvocalic).
  # Note A12 (L832: curr_outph = USP_RX) sets RX FIRST, but for every vowel in the
  # fusion map A13 then deletes the /R/, so RX never survives for a real vowel and
  # is intentionally NOT added to the inventory (it would be dead).
  #
  # STRESS PRESERVATION: the fused rhotic vowel inherits the ORIGINAL vowel's
  # stress.  The inventory has stressed/unstressed variants (AR1/AR0 ...), so the
  # target name is DERIVED: fused_base + (prev.stress == 1 ? '1' : '0').  RR is the
  # AX (schwa) case and has no stress variant (always the reduced rhotic), so its
  # name is the bare 'RR'.  This is data-driven (a CEL lookup chain), not a
  # per-stress branch.
  #
  # Mechanism: a structural splice over the [vowel, R] range, replacing it with ONE
  # token copied from the vowel (keeping its stress/word) but adopting the fused
  # rhotic vowel's target (phoneme, type, durations).  This both rewrites
  # the vowel and deletes the /R/ in a single edit (DECtalk's "replace last output
  # + dodelete").
  # -------------------------------------------------------------------------
  dectalk_fuse_vowel_r:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme == 'R' && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      # (curr_instruc & FSTRESS) IS_MINUS: no stress of any level. An /r/ that
      # leads into a secondary-stressed vowel has secondary stress and does not
      # fuse ("around" is AX R AW).
      current_unstressed: "get(current, 'stress', 0) == 0"
      r_not_word_initial: >-
        p != null &&
        (!has(p.word) || !has(current.word) ? true : p.word == current.word)
      prev_is_vowel: "p != null && p.type == 'vowel'"
      fused_base: >-
        !prev_is_vowel ? '' : (
          p.phoneme == 'AX' ? 'RR' :
          (p.phoneme in ['IY', 'IH'] ? 'IR' :
          (p.phoneme in ['EY', 'EH', 'AE'] ? 'ER' :
          (p.phoneme in ['AA', 'AH'] ? 'AR' :
          (p.phoneme in ['OW', 'AO'] ? 'OR' :
          (p.phoneme in ['UW', 'UH'] ? 'UR' : ''))))))
      prev_stressed: "has(p.stress) && p.stress == 1"
      fused_name: >-
        fused_base == '' ? '' :
        (fused_base == 'RR' ? 'RR' :
        (prev_stressed ? fused_base + '1' : fused_base + '0'))
      fv: "fused_name == '' ? null : target(fused_name)"
    constraint: >-
      current_unstressed && r_not_word_initial && prev_is_vowel &&
      fused_base != '' && fv != null
    splice:
      type: replace_range
      range_left: p.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: prev
          copy_fields:
            - stress
            - word
          # The phone is named without a stress digit, like every other vowel;
          # the digit only selects the inventory target.
          phoneme: fused_base
          # A boundary mark after the /r/ ("air|plane") is the next boundary
          # of the vowel too: DECtalk's scan from the vowel passes over the
          # /r/ to it (ph_sort2.c:203-227).
          morpheme_boundary_after: >-
            isTrue(p, 'morpheme_boundary_after') || isTrue(current, 'morpheme_boundary_after')
          fused_with_r: "true"
          type: fv.type
          target: fv
          duration: fv.duration
          inherentDuration: fv.inherentDuration
          minimumDuration: "has(fv.minimumDuration) ? fv.minimumDuration : fv.duration"
          voiced: "has(fv.voiced) ? fv.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:835-872 (A13 postvocalic vowel+R fusion: prev vowel rewritten to rhotic vowel, /R/ deleted)"
      - "DECtalk 4.63 ph_aloph.c:823-824 (postvocalic gate: (FSTRESS|FWINITC) IS_MINUS && prev FVOWEL+)"
      - "DECtalk 4.63 p_us_rom.h us_maltar/us_mindur (IR/ER/AR/OR/UR/RR rhotic-vowel targets)"

  # -------------------------------------------------------------------------
  # NO PREVOCALIC R -> RR. ph_aloph.c:636-648 turns an /r/ before a syllabic
  # into RR, but its `case GRP_R` is the German phone (p_all_ph.h:204,
  # (PFGR<<PSFONT)|GR_R); a US /r/ is USP_R and never matches. DECtalk's debug
  # build keeps R (26) in "receive", "every", "around", "paragraph", "hundred".
  #
  # -------------------------------------------------------------------------
  # POSTVOCALIC /l/ AND /r/ (ph_aloph.c:821-870, "Rule 2: Postvocalic
  # allophones of /R/ and /LL/ are special").
  #
  #   if ((curr_instruc & (FSTRESS | FWINITC)) IS_MINUS && n > 0
  #       && (phone_feature(phonemes[n - 1]) & FVOWEL) IS_PLUS)
  #     LL -> LX;  R -> RX (unless it fuses with the vowel, handled above)
  #
  # The phone carries no stress, is not a word-initial consonant, and the
  # phoneme before it is a vowel (FVOWEL, so not syllabic l or n).
  #
  # It runs after the fusion rule, which removes an /r/ that fuses, and before
  # the prevocalic R -> RR rule: in the C that rule (A5) writes RR first and
  # this one then overwrites it, so RX wins for an /r/ between two vowels that
  # does not fuse.
  # -------------------------------------------------------------------------
  dectalk_postvocalic_liquid:
    kind: postlexical
    select:
      relation: Segment
      where: "current.phoneme in ['L', 'R'] && !isTrue(current, 'rules_blocked')"
    define:
      p: prev
      allophone: "current.phoneme == 'L' ? 'LX' : 'RX'"
      at: target(allophone)
    constraint: >-
      get(current, 'stress', 0) == 0 && !isTrue(current, 'word_initial_consonant')
      && p != null && p.type == 'vowel'
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields: *structure_word
          phoneme: allophone
          type: at.type
          target: at
          duration: at.duration
          inherentDuration: at.inherentDuration
          minimumDuration: "has(at.minimumDuration) ? at.minimumDuration : at.duration"
          voiced: "has(at.voiced) ? at.voiced : true"
    citations:
      - "DECtalk 4.63 ph_aloph.c:821-870 (Rule 2: postvocalic allophones of /R/ and /LL/)"
      - "DECtalk 4.63 p_us_rom.h us_maltar, us_inhdr, us_mindur (US_LX, US_RX targets)"
