      # Sonorant vowel-category (sontyx) per phoneme per edge (DATA), from
      # us_begtyp[] (forward / segment-start edge) and us_endtyp[] (backward /
      # segment-end edge), clamped per setloc (rounded-soncon->3, low->2).
      # Citation: DECtalk 4.63 p_us_rom.h us_begtyp/us_endtyp; ph_sttr2.c:95-145.
      vowel_category:
        AA: { forward: 2, backward: 2 }
        AE: { forward: 1, backward: 1 }
        AH: { forward: 2, backward: 2 }
        AO: { forward: 3, backward: 3 }
        AR: { forward: 2, backward: 3 }
        AW: { forward: 2, backward: 3 }
        AX: { forward: 2, backward: 2 }
        AY: { forward: 2, backward: 1 }
        EH: { forward: 1, backward: 1 }
        EL: { forward: 3, backward: 3 }
        ER: { forward: 1, backward: 3 }
        EY: { forward: 1, backward: 1 }
        IH: { forward: 1, backward: 1 }
        IR: { forward: 1, backward: 3 }
        IX: { forward: 1, backward: 1 }
        IY: { forward: 1, backward: 1 }
        LL: { forward: 3, backward: 3 }
        LX: { forward: 3, backward: 3 }
        OR: { forward: 3, backward: 3 }
        OW: { forward: 3, backward: 3 }
        OY: { forward: 3, backward: 1 }
        R: { forward: 3, backward: 3 }
        RR: { forward: 3, backward: 3 }
        RX: { forward: 3, backward: 3 }
        TZ: { forward: 1, backward: 1 }
        UH: { forward: 3, backward: 3 }
        UR: { forward: 3, backward: 3 }
        UW: { forward: 3, backward: 3 }
        W: { forward: 3, backward: 3 }
        Y: { forward: 1, backward: 1 }
        YU: { forward: 1, backward: 3 }
      # setloc prcnt-adjustment DATA (ph_sttr2.c:294-307), extracted from
      # DECtalk 4.63 PH/p_us_rom.h us_place[] + us_begtyp[] via the dectalk repo
      # scripts/extract_place_coartic.py, reshaped by
      # scripts/gen-dectalk-place-coartic-yaml.mjs. Consumed by the generic locus
      # resolver (resolveLocusBoundary): no per-phoneme literals in code.
      # obstruent_place[obstruent].palatal_or_dental = us_place & (FPALATL|FDENTAL)
      # (ph_defs.h:340-341). Adjustment (a) fires only for NON-palatal/dental obstruents.
      obstruent_place:
        B: { palatal_or_dental: false }
        CH: { palatal_or_dental: true }
        CZ: { palatal_or_dental: false }
        D: { palatal_or_dental: false }
        DF: { palatal_or_dental: false }
        DH: { palatal_or_dental: true }
        DX: { palatal_or_dental: false }
        DZ: { palatal_or_dental: true }
        EN: { palatal_or_dental: false }
        F: { palatal_or_dental: false }
        G: { palatal_or_dental: false }
        JH: { palatal_or_dental: true }
        K: { palatal_or_dental: false }
        M: { palatal_or_dental: false }
        N: { palatal_or_dental: false }
        NX: { palatal_or_dental: false }
        P: { palatal_or_dental: false }
        S: { palatal_or_dental: false }
        SH: { palatal_or_dental: true }
        T: { palatal_or_dental: false }
        TH: { palatal_or_dental: true }
        TX: { palatal_or_dental: false }
        TZ: { palatal_or_dental: true }
        V: { palatal_or_dental: false }
        Z: { palatal_or_dental: false }
        ZH: { palatal_or_dental: true }
      # rounded_sonorant_consonant = sonorants with begtyp==ROUNDED_SONOR_CONS(5)
      # (ph_defs.h:176). Adjustment (a): prcnt=(prcnt>>1)+50 for F2/F3.
      rounded_sonorant_consonant: [EL, LL, LX, R, W]
      # f2_back[vowel] = { forward: us_place & F2BACKI, backward: & F2BACKF }
      # (ph_defs.h:345-346). Adjustment (b) on F2: prcnt += 25-(prcnt>>2); durtran=(durtran>>1)+2.
      f2_back:
        EY: { forward: false, backward: true }
        IY: { forward: false, backward: true }
        Y: { forward: true, backward: true }
        YU: { forward: true, backward: false }
    f0:
      renderer:
        type: layered_additive
      layered_model_ref: f0_model
      output_clamp:
        min_hz:
          value: 50
          citations:
            - Klatt 1990 (creaky-voice floor near 50 Hz)
        max_hz:
          value: 500
          citations:
            - Peterson & Barney 1952 (upper adult F0 corpus extreme)
    overlays:
      operation_order: [voice_quality, timed_controls, f0]
transcription:
  # Standard English letter-name pronunciations for declarative spelling mode.
  # Citation anchor: Allen et al. 1987 Ch.2-3 (LETTER-* morphs for symbol strings).
  letter_names:
    LETTER_A: [EY1]
    LETTER_B: [B, IY1]
    LETTER_C: [S, IY1]
    LETTER_D: [D, IY1]
    LETTER_E: [IY1]
    LETTER_F: [EH1, F]
    LETTER_G: [JH, IY1]
    LETTER_H: [EY1, CH]
    LETTER_I: [AY1]
    LETTER_J: [JH, EY1]
    LETTER_K: [K, EY1]
    LETTER_L: [EH1, L]
    LETTER_M: [EH1, M]
    LETTER_N: [EH1, N]
    LETTER_O: [OW1]
    LETTER_P: [P, IY1]
    LETTER_Q: [K, Y, UW1]
    LETTER_R: [AA1, R]
    LETTER_S: [EH1, S]
    LETTER_T: [T, IY1]
