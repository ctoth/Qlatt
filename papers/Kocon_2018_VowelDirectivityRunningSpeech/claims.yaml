  concepts: []
  provenance:
    paper: Kocon_2018_VowelDirectivityRunningSpeech
    page: 0
- id: claim39
  type: observation
  statement: Weighting function at 0 degrees must be 0.0 dB for all frequencies (reference
    direction)
  concepts: []
  provenance:
    paper: Kocon_2018_VowelDirectivityRunningSpeech
    page: 0
- id: claim40
  type: observation
  statement: Weighting function must be monotonically non-increasing from 0 to 180
    degrees for frequencies above ~1 kHz (general trend, not strict per-band)
  concepts: []
  provenance:
    paper: Kocon_2018_VowelDirectivityRunningSpeech
    page: 0
- id: claim41
  type: observation
  statement: At frequencies below 500 Hz, attenuation at 180 degrees should be less
