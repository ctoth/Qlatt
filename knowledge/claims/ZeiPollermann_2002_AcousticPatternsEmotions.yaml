  concepts: []
  provenance:
    paper: ZeiPollermann_2002_AcousticPatternsEmotions
    page: 0
- id: claim11199
  type: observation
  statement: '**Arousal discrimination:** All F0/energy/rate parameters should significantly
    differ between sadness and anger, and between sadness and joy'
  concepts: []
  provenance:
    paper: ZeiPollermann_2002_AcousticPatternsEmotions
    page: 0
- id: claim11200
  type: observation
  statement: '**Valence non-discrimination:** F0 mean, F0 range, F0 SD, delivery rate
    should NOT significantly differ between anger and joy'
  concepts: []
  provenance:
    paper: ZeiPollermann_2002_AcousticPatternsEmotions
    page: 0
- id: claim11201
  type: observation
  statement: '**LTAS valence signal:** Anger spectral energy > joy spectral energy
