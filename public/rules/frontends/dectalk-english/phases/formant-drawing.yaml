  # Special Rule 2, HLSYN build: the aspiration of a voiceless plosive runs
  # `vot` frames into the sonorant after it, and B2 is 70 Hz wider for as long.
  # The same arithmetic as phases/articulation.yaml's artic_vot_after_voiceless_plosive.
  fd_aspiration_bandwidth:
    kind: frame
    program: formants
    unit: "p.plosive && !p.voiced && u.sonorant"
    when: "f.index == 0"
    set:
      - register: vot
        value: "u.stressed ? params.policy.articulation.vot.stressed : params.policy.articulation.vot.unstressed"
        tag: formant_override
      - register: vot
        value: >-
          (u.soncon || u.is_rr) ? r.vot + params.policy.articulation.vot.sonorant_consonant_bonus
          : (u.after_s ? (u.after_s_cluster ? params.policy.articulation.vot.s_cluster : r.vot)
          : (!u.syllabic ? r.vot + params.policy.articulation.vot.nonsyllabic_bonus : r.vot))
        tag: formant_override
      - { register: vot, value: "r.vot >= f.count ? f.count - 1 : r.vot", tag: formant_override }
      - register: vot
        value: >-
          r.vot > floor(f.count / params.policy.articulation.vot.syllabic_divisor)
            && u.syllabic && u.primary
          ? floor(f.count / params.policy.articulation.vot.syllabic_divisor) : r.vot
        tag: formant_override
      - { register: vot, value: "u.dummy ? f.count : r.vot", tag: formant_override }
      - { register: tsp_B2, value: "r.vot", tag: formant_override }
      - { register: psp_B2, value: "r.cur_B2 + 70", tag: formant_override }
    citations:
      - "DECtalk 4.63 PH/p_us_st1.c:1362-1448 (Special Rule 2)"
  # Special Rule 3: a voiced plosive or affricate between a voiced phone and a
  # voiceless one keeps B2 and B3 at 150 Hz (HLSYN build).
  fd_voicebar_bandwidth:
    kind: frame
    program: formants
    unit: "u.burst && u.voiced && p.voiced && !n.voiced && !u.is_tx"
    when: "f.index == 0"
    set:
      - { register: tsp_B2, value: "f.count", tag: formant_override }
      - { register: tsp_B3, value: "f.count", tag: formant_override }
      - { register: psp_B2, value: "150", tag: formant_override }
      - { register: psp_B3, value: "150", tag: formant_override }
    citations:
      - "DECtalk 4.63 PH/p_us_st1.c:1457-1472"

  # ===========================================================================
  # Diphthong lines: make_dip (ph_setar.c:1217-1392) and shrdur
  # (ph_sttr2.c:444-487). The first line holds the first value until the
  # table's first time; phdraw asks for the next line when tcum passes the
  # end of the current one.
  # ===========================================================================
  fd_diphthong_scale:
    kind: frame
    program: formants
    unit: "u.dip_F1 || u.dip_F2 || u.dip_F3 || u.dip_B2 || u.dip_B3"
    when: "f.index == 0"
    set:
      # halfinhdr = inhdr_frames * NSAMP_FRAME >> 1, NSAMP_FRAME 71
      - { register: half_inherent, value: "floor(u.inherent * 71 / 2)", tag: formant_diphthong }
      - { register: half_max, value: "floor(r.half_inherent * r.shrink / 16384)", tag: formant_diphthong }
    citations:
      - "DECtalk 4.63 PH/ph_sttr2.c:452-456; ph_defs.h:379 NSAMP_FRAME"
  fd_diphthong_start_f1:
    kind: frame
    program: formants
    unit: "u.dip_F1"
    when: "f.index == 0"
    set:
      - { register: line_F1, value: "0", tag: formant_diphthong }
      - { register: dipcum_F1, value: "0", tag: formant_diphthong }
      - { register: deldip_F1, value: "0", tag: formant_diphthong }
      - { register: dold_F1, value: "r.cur_F1", tag: formant_diphthong }
      - { register: shr_ms, value: "size(u.dt_F1) > 0 ? u.dt_F1[0] : -1", tag: formant_diphthong }
      - &shr_1 { register: shr, value: "r.shr_ms * 10 + 5", tag: formant_diphthong }
      - &shr_2 { register: shr_fold, value: "r.shr > r.half_inherent ? 1 : 0", tag: formant_diphthong }
      - &shr_3 { register: shr, value: "r.shr_fold == 1 ? u.inherent * 71 - r.shr : r.shr", tag: formant_diphthong }
      - &shr_4 { register: shr, value: "floor(floor((r.shrink + 16384) / 2) * (r.half_inherent - r.shr) / 16384)", tag: formant_diphthong }
      - &shr_5 { register: shr, value: "r.shr > r.half_max ? r.half_max : r.shr", tag: formant_diphthong }
      - &shr_6 { register: shr, value: "r.shr_fold == 1 ? r.half_max + r.shr : r.half_max - r.shr", tag: formant_diphthong }
      - &shr_7 { register: shr, value: "r.shr_ms < 0 ? f.count : floor((r.shr < 71 ? 71 : r.shr) / 64)", tag: formant_diphthong }
      - { register: durlin_F1, value: "r.shr", tag: formant_diphthong }
      - { register: told_F1, value: "r.shr", tag: formant_diphthong }
    citations:
      - "DECtalk 4.63 PH/ph_setar.c:1286-1300, 1344-1392; ph_sttr2.c:444-487 shrdur"
  fd_diphthong_start_f2:
    kind: frame
    program: formants
    unit: "u.dip_F2"
    when: "f.index == 0"
    set:
      - { register: line_F2, value: "0", tag: formant_diphthong }
      - { register: dipcum_F2, value: "0", tag: formant_diphthong }
      - { register: deldip_F2, value: "0", tag: formant_diphthong }
      - { register: dold_F2, value: "r.cur_F2", tag: formant_diphthong }
      - { register: shr_ms, value: "size(u.dt_F2) > 0 ? u.dt_F2[0] : -1", tag: formant_diphthong }
      - *shr_1
      - *shr_2
      - *shr_3
      - *shr_4
      - *shr_5
      - *shr_6
      - *shr_7
      - { register: durlin_F2, value: "r.shr", tag: formant_diphthong }
