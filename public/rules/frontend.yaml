    factor: 0.35
    keys:
      - F1
      - F2
      - F3
      - B1
      - B2
      - B3
    smooth_types:
      - vowel
      - nasal
      - liquid
      - glide
    citations:
      - Ohman 1966 (VCV coarticulation model)
  min_duration:
    stop_release_ms: 5
    default_ms: 20
    citations:
      - Allen et al. 1987 Ch.8
  transition_ms: 30
  final_silence_ms: 100
