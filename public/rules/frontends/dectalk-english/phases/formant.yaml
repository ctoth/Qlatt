      - "DECtalk 4.63 ph_draw.c (formant transitions are emitted once per native synthesis frame)"

  dectalk_the_terminal_silence_f1_trace:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme == 'SIL' &&
        has(current.punctuationSymbol) && current.punctuationSymbol == '.' &&
