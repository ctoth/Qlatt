  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim17
  type: equation
  expression: h_{CALM_{open}}(t) = -\frac{E}{\sin(\pi(1-\alpha_m))} e^{a_{CALM} t}
