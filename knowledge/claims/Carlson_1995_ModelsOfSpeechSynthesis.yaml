    type: observation
    statement: >
      Higher Rg values (200 vs 100) reduce amplitude of first few harmonics.
      Higher Rk values (60 vs 20) increase H1-H2 difference (more breathy).
      Higher Ra values (5 vs 0) reduce high-frequency energy (spectral tilt).
