  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim19
  type: equation
  expression: h_{LM_{open}}(t) = \frac{E}{\sin(\pi(1-\alpha_m))} e^{a_{LM} t} \sin\left(\frac{\pi}{O_q
