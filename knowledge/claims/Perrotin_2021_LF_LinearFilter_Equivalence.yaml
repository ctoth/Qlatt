source:
  paper: Perrotin_2021_LF_LinearFilter_Equivalence

claims:
  - id: claim_0045
    type: observation
    statement: >
      LFLM and LFCALM linear filter implementations are perceptually equivalent
      to the original LF model. Rd parameter has the strongest perceptual effect
      (chi2 = 3620, p < 0.001). Model factor is marginally significant (chi2 = 8.8, p = 0.012).
    concepts:
      - speech_0009
    provenance:
      paper: Perrotin_2021_LF_LinearFilter_Equivalence
      page: 1280
      section: "Perceptual Findings"

