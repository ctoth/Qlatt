version: v1
# Pull in the voice-quality phase rule definitions (TRACK VQ). frontend.yaml's
# top-level include list is owned by another track; nested includes are resolved
# recursively by the rule-pack loader, so registering the phase file here keeps
# all VQ wiring inside pipeline.yaml + phases/voice-quality.yaml.
include:
  - phases/voice-quality.yaml
# predicates, maps, tags and relations not declared here are inherited from qlatt-english/pipeline.yaml.
string_sets:
  # ASCII single-letter words. Used by `spelling_mode_letter_names`
  # (phases/orthography.yaml) to detect runs of letter tokens like "U C L A".
  ascii_letter: ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm',
                 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z']
  place_locus_closures: [K_CL, P_CL, B_CL, M, T_CL, D_CL, N, Y]
  place_locus_releases: [K_REL, P_REL, B_REL, T_REL, D_REL]
tags:
  voice_quality_effort: adjusts voice quality for vocal effort
  voice_quality_phrase: shapes voice quality across a phrase
  voice_quality_stress: adjusts voice quality on a stressed segment
relations:
  # Replaces the base Segment relation whole (adds hi/low, omits some base
  # features); a relation is inherited or replaced by name, never merged.
  Segment:
    type: base
    features:
      A1: []
      A2: []
      A3: []
      A4: []
      A5: []
      A6: []
      A7: []
      A8: []
      A9: []
      A10: []
      AF: []
      AH: []
      AV: []
      AVS: []
      EePhraseDb: []
      effort: []
      F1: []
      F2: []
      F3: []
      F4: []
      B1: []
      RdPhraseOffset: []
      SW: []
      TL: []
      accentIndexInPhrase: []
      accentType: []
      boundaryTone: []
      breakIndex: []
      cluster_position: []
      control_windows: []
      inherentDuration: []
      duration_model: []
      durationFloor: []
      vot_from_table: [true, false]
      initialBoundaryTone: []
      isAccentCarrier: []
      isAccented: []
      isContentWord: []
      isFunctionWord: []
      isNuclearAccent: []
      nasalCouplingArea: []
      nasalMurmurStrength: []
      nasalPlaceIndex: []
      phraseAccent: []
      transition_ms: []
      nucleus_duration_ms: []
      type:
        - vowel
        - stop
        - stop_closure
        - stop_release
        - stop_aspiration
        - fricative
        - affricate
        - silence
        - liquid
        - nasal
        - glide
      word_syllable_count: []
      alveolar: []
      bilabial: []
      boundary: []
      dac: []
      fricative_min_ms: []
      inventorySW: []
      next_boundary: []
      phoneme: []
      postalveolar: []
      punctuationSymbol: []
      stress: []
      syllable: []
      velar: []
      voiced: []
      voiceless: []
      weak: []
      word: []
      hi: []
      low: []
    scalars:
      duration:
        unit: ms
        # Durations are kept on whole milliseconds after every rule.
        quantum: 1
        resolution: klatt
        max: 500
        floor_field: durationFloor
        floor_fallback:
          # Klatt 1976 Eq.1; class-ratio estimates are inherited from qlatt-english.
          value: >-
            current.inherentDuration * (current.type == 'vowel'
              ? params.policy.duration.incompressibility_ratio_vowel
              : params.policy.duration.incompressibility_ratio_consonant)
          citations:
            - "Klatt 1976 Eq.1 (incompressible portion)"
            - "Engineering estimate: class ratios from params.policy.duration when no per-phone floor exists"
phases:
  - name: orthography
    rules:
      - spelling_mode_letter_names
  - name: normalize
    rules:
      - normalize_schwa
      - normalize_velar_nasal
      - normalize_wh_merger
  - name: postlexical
    rules:
      - the_prevocalic_reduction
      - to_reduction
      - t_flapping
      - d_flapping
      - t_deletion
      - d_deletion
      - t_glottalization
      - palatalization_dy
      - palatalization_ty
      - glottal_stop_insertion
  - name: structural
    rules:
      - remap_stops_to_closures
      - expand_affricates_with_closure
      - expand_diphthongs
      - expand_rhotic_vowels
      - insert_mapped_voiceless_release_and_aspiration
      - insert_mapped_voiceless_release_and_aspiration_final
      - insert_mapped_voiced_release
      - insert_mapped_voiced_release_final
  - name: annotation
    rules:
      - assign_metrical_accent
      - syllable_count_annotation
      - cluster_position_annotation
      # Phrase-edge tones (phraseAccent / boundaryTone / initialBoundaryTone) were
      # previously supplied to qlatt-beauty by the shared imperative prosodic
      # annotator (independent of accent status). Now that those passes are
      # declarative annotation-phase rules (inherited from qlatt-english via
      # `extends`), beauty must list them so its SIL boundary tones — read
      # unguarded by the duration/prosody rules — keep being assigned. beauty
      # remains accent-less without authored stress (assign_metrical_accent above
      # handles directed words); these two rules depend only on punctuation.
      - assign_phrase_edge_tones
      - assign_initial_boundary_tone
      # Break-index tier (punctuation 4/3, word boundary 1, long-phrase 2) was
      # also supplied by the shared imperative annotator and is read (guarded) by
      # the duration/prosody rules. beauty is accent-less and runs no
      # mark_function_words, so assign_long_phrase_break never fires (no content
      # words) — exactly as the imperative long-phrase pass behaved for beauty.
      - assign_long_phrase_break
      - assign_punctuation_break_index
      - assign_word_boundary_break_index
  - name: duration
    rules:
      - duration_floor_from_inventory
      - non_word_initial_consonant_shortening
      - word_medial_consonant_shortening
      - unstressed_consonant_shortening
      - word_initial_lengthening
      - punctuation_pause
      - pause_rate_scaling
      - stress_duration
      - accent_vowel_lengthening
      - polysyllabic_shortening
      - cluster_shortening
      - vowel_shortening
      - pre_boundary_lengthening
      - speech_rate_scaling
      - duration_cap
      - fricative_minimum_duration
      - lock_stop_release_duration
      - stop_unreleasing
      - s_cluster_aspiration_reduction
      - aspiration_frication_carryover
      - duration_floor_stop_release
      - duration_floor_default
    resolve_scalars:
      - duration
  - name: formant
    after:
      - duration
    rules:
      # --- TRACK VQ: dynamic voice-quality (Rd) layers ---
      # The frontend executes phases by a fixed name list in tts-frontend.ts
      # (normalize, postlexical, structural, annotation, duration, formant,
      # prosody, finalize); there is no standalone "voice_quality" phase slot.
      # These rules run inside the formant phase (after duration, before
      # prosody) — i.e. "with formant" per the build plan. Definitions live in
      # phases/voice-quality.yaml (included at the top of this file).
      - stress_rd_adduction
      - effort_rd_adduction
      - phrase_rd_contour
      - place_f2_locus
      - place_rel_copy
      - dark_l_allophony
      - r_f3_lowering
      - f1_stop_onset
      - burst_spectral_template
      - weak_stop_release_parallel_attenuation
      - weak_final_voiced_stop_closure_attenuation
      - vcv_coarticulation
      - vowel_reduction
      - schwa_coronal_fronting
      - uw_coronal_fronting
      - vowel_rate_undershoot
      - nasal_place_assignment
      - nasal_place_assimilation
      - nasal_murmur_targets
      - nasal_windows
      - sw_explicit_override
      - sw_default_assignment
  - name: prosody
    rules:
      - associate_accent_tones
      - associate_initial_tone
      - associate_edge_tones
      - tobi_baseline_init
      - tobi_initial_boundary_high
      - tobi_accent
      - tobi_unaccented_declination
      - tobi_phrase_accent_high
      - tobi_phrase_accent_low
      - tobi_boundary_low
      - tobi_boundary_rise
      - tobi_register_reset
      - connected_speech_source_contour
      - f0_voiceless_onset_perturbation
      - f0_voiced_onset_perturbation
      - f0_continuation_rise
  - name: finalize
    after:
      - duration
      - prosody
    rules: []
    compute_times: true
    resolve_points:
      - F0Point
