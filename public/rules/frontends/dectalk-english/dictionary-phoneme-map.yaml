vowels:
  # Raw dictionary tokens, before inventory spelling substitutions.
  values: [iy, ih, ey, eh, ae, aa, ay, aw, ah, ao, ow, oy, uh, uw, rr, yu, ax, ix, ir, er, ar, or, ur]
  citations: ["Engineering compatibility policy: retain the converter's stress-bearing raw token set"]
fixups:
  ax:
    symbol: AX
    reason: "Engineering compatibility: retain reduced schwa inventory spelling AX."
    citations: ["DECtalk 4.63 INCLUDE/l_us_ph.h:76 (AX); Qlatt dectalk-english inventory AX"]
  yx:
    symbol: Y
    reason: "Engineering compatibility: map the raw glide spelling yx to inventory Y."
    citations: ["DECtalk 4.63 INCLUDE/usa_phon.tab:143 (yx); Qlatt dectalk-english inventory Y"]
  hx:
    symbol: HH
    reason: "Engineering compatibility: retain the raw hx to inventory HH spelling."
    citations: ["DECtalk 4.63 INCLUDE/usa_phon.tab:146 (hx); Qlatt dectalk-english inventory HH"]
  ll:
    symbol: L
    reason: "Engineering compatibility: retain the raw ll to inventory L spelling."
    citations: ["DECtalk 4.63 INCLUDE/usa_phon.tab:145 (ll); Qlatt dectalk-english inventory L"]
  nx:
    symbol: NG
    reason: "Engineering compatibility: retain the raw nx to inventory NG spelling."
    citations: ["DECtalk 4.63 INCLUDE/usa_phon.tab:151 (nx); Qlatt dectalk-english inventory NG"]
  rx:
    symbol: R
    reason: "Engineering compatibility: retain the existing rx/R collapse; no new contrast claim."
    citations: ["DECtalk 4.63 INCLUDE/usa_phon.tab:147 (rx); Qlatt dectalk-english inventory R"]
  lx:
    symbol: L
    reason: "Engineering compatibility: retain the existing lx/L collapse; no new contrast claim."
    citations: ["DECtalk 4.63 INCLUDE/usa_phon.tab:148 (lx); Qlatt dectalk-english inventory L"]
  dz:
    symbol: D
    reason: "Engineering compatibility: retain the dentalized-d to D collapse; not source equivalence."
    citations: ["DECtalk 4.63 INCLUDE/usa_phon.tab:153 (dentalized d); Qlatt dectalk-english inventory D"]
stress:
  default: "0"
  marks: {"'": "1", "`": "2"}
  citations:
    - "DECtalk 4.63 dic/dic.c:447–448 (primary S1 and secondary S2 marks)"
    - "Engineering compatibility: preserve primary and secondary dictionary stress separately"
controls:
  block_rules: "~"
  morpheme_boundary: ["#", "*"]
  word_boundary: " "
  citations: ["DECtalk 4.63 dic/dic.c:444–456; INCLUDE/phonlist.h:181–191; PH/ph_sort.c:1611–1612; PH/ph_aloph.c:563–567"]
skip:
  - character: q
    reason: "Engineering compatibility: the selected Klatt inventory has no Q segment, so retain the converter's adjacent-vowel treatment instead of emitting q. CMU also omits Q for minutiae; this does not claim the same vowel sequence or DECtalk glottal-stop behavior."
    citations: ["DECtalk 4.63 INCLUDE/l_us_ph.h:112 (Q); Qlatt dectalk-english inventory; CMU Pronouncing Dictionary entry minutiae"]
