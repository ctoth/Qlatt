      weak_release_scale:
        value: 0.5
        citations:
          - Allen et al. 1987 Table C-1
      stress_primary_multiplier:
        value: 1.3
        citations:
          - Klatt 1976 §III.B
      stress_unstressed_multiplier:
        value: 0.8
        citations:
          - Klatt 1976 §III.B
      punctuation_pause_comma_ms:
        value: 150
        citations:
          - Allen et al. 1987 Ch.8
      punctuation_pause_phrase_break_ms:
        value: 200
        citations:
          - Allen et al. 1987 Ch.8
          - >-
            Engineering estimate: semicolon/colon pause is typically stronger than comma and weaker than terminal
            punctuation
      punctuation_pause_terminal_ms:
        value: 300
        citations:
          - Allen et al. 1987 Ch.8
      vowel_shortening_end_multiplier:
        value: 1.2
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiced_fricative_multiplier:
        value: 1.6
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiced_stop_multiplier:
        value: 1.2
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_nasal_multiplier:
        value: 0.85
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiceless_stop_multiplier:
        value: 0.7
        citations:
          - Allen et al. 1987 Ch.9
      # Break-index pre-boundary lengthening (replaces old punctuation-based proxy).
      # Citation: Wightman et al. 1992, Klatt 1976 §III.A, Crystal & House 1988
      # BI threshold values for categorization (ToBI break index tier is 0-4).
      pre_boundary_bi4_threshold:
        value: 4
        citations:
          - Silverman et al. 1992 (ToBI break index tier, level 4 = intonational phrase)
      pre_boundary_bi3_threshold:
        value: 3
        citations:
          - Silverman et al. 1992 (ToBI break index tier, level 3 = intermediate phrase)
      pre_boundary_bi2_threshold:
        value: 2
        citations:
          - Silverman et al. 1992 (ToBI break index tier, level 2 = weak intermediate phrase)
      pre_boundary_bi4_multiplier:
        value: 1.5
        citations:
          - Wightman et al. 1992 (intonational phrase boundary, breakIndex=4)
          - Klatt 1976 §III.A (phrase-final ~2x, conservative 1.5 with other rules stacking)
      pre_boundary_bi4_obstruent_multiplier:
        value: 1.2
        citations:
          - Crystal & House 1988 (obstruents show weaker phrase-final lengthening)
          - Wightman et al. 1992
      pre_boundary_bi3_multiplier:
        value: 1.3
        citations:
          - Wightman et al. 1992 (intermediate phrase boundary, breakIndex=3)
      pre_boundary_bi3_obstruent_multiplier:
        value: 1.1
        citations:
          - Crystal & House 1988
          - Wightman et al. 1992
      pre_boundary_bi2_multiplier:
        value: 1.15
        citations:
          - Wightman et al. 1992 (weak intermediate phrase, breakIndex=2)
      pre_boundary_bi1_multiplier:
        value: 1.05
        citations:
          - Klatt 1976 §III.A (word boundary, small effect)
          - White 2014 (word-boundary lengthening is a secondary cue)
      # Accent-based vowel lengthening
      accent_nuclear_multiplier:
        value: 1.25
        citations:
          - van Santen 1994 (nuclear accent amplification)
          - "Engineering estimate: ~25% nuclear accent lengthening on stressed vowel"
      accent_stressed_multiplier:
        value: 1.15
        citations:
          - van Santen 1994 (prenuclear accent lengthening)
          - "Engineering estimate: ~15% prenuclear accent lengthening on stressed vowel"
      accent_unstressed_multiplier:
        value: 1.05
        citations:
          - White 2014 (accent distributes across word, small effect on unstressed)
          - "Engineering estimate"
      # Duration cap — prevents pathological stacking of multiple lengthening rules
      max_duration_ratio:
        value: 2.0
        citations:
          - Klatt 1976 (phrase-final vowels up to 2x longer)
          - "Engineering estimate: 2.0x inherent duration as hard cap"
      s_cluster_aspiration_ms:
