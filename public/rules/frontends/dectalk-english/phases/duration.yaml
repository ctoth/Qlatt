version: v1
rules:
  # ---------------------------------------------------------------------------
  # Fallback primary stress retargeting
  # DECtalk promotes the first vowel of a one-word phrase to primary stress when
  # no lexical primary stress is present.  The stress mark must be applied before
  # duration resolution so the primary-stress inventory target contributes its
  # inherent/minimum durations and acoustic params.
  # ---------------------------------------------------------------------------
  dectalk_single_word_fallback_primary_retarget:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'vowel' && word_count() == 1"
    define:
      prev_primary_or_boundary: >-
        look_back_where(current, 100,
          '(candidate.type == "vowel" && has(candidate.stress) && candidate.stress == 1) || candidate.phoneme == "SIL"')
      next_primary_or_boundary: "look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')"
      prior_vowel_in_word: >-
        find_within_word(current,
          "current.type == 'vowel'",
          "behind")
      no_primary_in_clause: >-
        (prev_primary_or_boundary == null || prev_primary_or_boundary.phoneme == 'SIL')
        && (next_primary_or_boundary == null || next_primary_or_boundary.phoneme == 'SIL')
      primary_target: "target(current.phoneme + '1')"
    constraint: "no_primary_in_clause && prior_vowel_in_word == null"
    apply:
      - field: stress
        op: set
        value: 1
        tag: fallback_primary_stress
      - for_each_field: [F1, F2, F3, F4, B4, F5, B5, F6, B6, B1, B2, B3, AV, AF, AH, AVS, F0, sourceMode, lfMode, breathiness, Rd, RdRef, OQ, TL, flutter, jitter, EePhraseDb, RdPhraseOffset, FNZ, FNP, BNP, BNZ, AN, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, AB, SW, FGP, BGP, FGZ, BGZ, BGS, NFC, GO]
        field: "{field}"
        op: set
        value: "primary_target.{field}"
        tag: fallback_primary_stress
      - field: duration
        op: set
        value: primary_target.duration
        tag: fallback_primary_stress
      - field: inherentDuration
        op: set
        value: primary_target.inherentDuration
        tag: fallback_primary_stress
      - field: minimumDuration
        op: set
        value: primary_target.minimumDuration
        tag: fallback_primary_stress
    citations:
      - "DECtalk 4.63 ph_sort2.c find_syll_to_stress (no primary stress: stress first vowel of last word)"

  # ---------------------------------------------------------------------------
  # Rule 1: Silence / Pause durations
  # DECtalk sets pause length based on punctuation type.
  # ---------------------------------------------------------------------------
  dectalk_pause_duration:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme == 'SIL' && has(current.punctuationSymbol)
    apply:
      - field: duration
        op: set
        value: >-
          current.punctuationSymbol == ',' ? params.policy.duration.pause_comma_ms :
          (current.punctuationSymbol in ['.', '?', '!'] ? params.policy.duration.pause_period_ms :
          (current.punctuationSymbol in [';', ':'] ? params.policy.duration.pause_comma_ms :
          params.policy.duration.pause_clause_initial_ms))
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 1 (silence/pause durations)"

  # ---------------------------------------------------------------------------
  # Rule 2: Clause-final lengthening
  # Sonorants and vowels at phrase boundaries get additive lengthening.
  # Voiced obstruents get less. Plosives get none.
  # ---------------------------------------------------------------------------
  dectalk_clause_final_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme != 'SIL' && !(current.type in ['stop_release', 'stop_aspiration'])
    define:
      next_syllabic_or_boundary: >-
        look_ahead_pred(current, 100, 'is_syllabic_or_boundary')
      at_boundary: >-
        next_syllabic_or_boundary == null
        || next_syllabic_or_boundary.phoneme == 'SIL'
      is_obstruent: >-
        current.type in ['fricative', 'stop_closure', 'affricate']
      is_plosive: current.type == 'stop_closure'
      is_voiced_obstruent: >-
        is_obstruent && (has(current.voiced) ? current.voiced == true : false)
    constraint: at_boundary
    apply:
      - field: duration
        op: add
        dispatch:
          - when: is_plosive
            value: 0
          - when: is_voiced_obstruent
            value: params.policy.duration.clause_final_voiced_obstruent_ms
          - default: params.policy.duration.clause_final_lengthening_ms
        tag: clause_final
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 2 (clause-final lengthening)"
      - "DECtalk 4.63 ph_defs.h NF40MS=38ms sonorant, NF20MS=19ms voiced obstruent"

  # ---------------------------------------------------------------------------
  # Rule 3: Non-phrase-final syllabic shortening
  # Vowels not at a phrase boundary are shortened by 0.70.
  # DECtalk traces for monosyllables such as "dog." do not apply this shortening
  # to the only vowel before a word-final consonant when that word is phrase-final;
  # Rule 4's monosyllable branch is the controlling stress-duration rule there.
  # In multiword traces, the only vowel of a non-final monosyllabic word is still
  # shortened by Rule 3.
  # ---------------------------------------------------------------------------
  dectalk_non_final_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel'
    define:
      "n": next
      a1: "ahead(current, 1)"
      a2: "ahead(current, 2)"
      a3: "ahead(current, 3)"
      a4: "ahead(current, 4)"
      a5: "ahead(current, 5)"
      a6: "ahead(current, 6)"
      at_boundary: "n == null ? true : n.phoneme == 'SIL'"
      syll_pos: "syllable_position_in_word()"
      same_current_word: "has(current.word)"
      later_word_before_boundary: >-
        same_current_word && (
        (a1 != null && a1.phoneme != 'SIL' && has(a1.word) && a1.word != current.word) ||
        (a2 != null && a2.phoneme != 'SIL' && has(a2.word) && a2.word != current.word) ||
        (a3 != null && a3.phoneme != 'SIL' && has(a3.word) && a3.word != current.word) ||
        (a4 != null && a4.phoneme != 'SIL' && has(a4.word) && a4.word != current.word) ||
        (a5 != null && a5.phoneme != 'SIL' && has(a5.word) && a5.word != current.word) ||
        (a6 != null && a6.phoneme != 'SIL' && has(a6.word) && a6.word != current.word))
    constraint: "!at_boundary && (syll_pos != 'only' || later_word_before_boundary)"
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: has(current.low) && current.low == true
            value: params.policy.duration.non_final_low_vowel_shortening
          - default: params.policy.duration.non_final_shortening
        tag: non_final
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 3 (non-phrase-final shortening, N70PRCNT)"
      - "DECtalk 4.63 -lt oracle trace for 'dog.' (only vowel is not Rule-3 shortened before final /g/)"
      - "DECtalk 4.63 -lt oracle trace for 'Thin thieves thought that they thrilled.' (only vowels in non-final monosyllabic words are Rule-3 shortened)"
      - "DECtalk 4.63 -lt oracle trace for 'Thin thieves thought that they thrilled.' (non-final low vowels /AO AE/ shorten more strongly)"

  # ---------------------------------------------------------------------------
  # Rule 7 durmin adjustment: unstressed non-obstruents reduce their minimum
  # duration before DECtalk's final durxx = prcnt*(durinh-durmin)+durmin formula.
  # This must run before duration scalar multipliers capture the Qlatt floor.
  # ---------------------------------------------------------------------------
  dectalk_unstressed_nonobstruent_floor_adjustment:
    kind: scalar
    select:
      relation: Segment
      where: "current.phoneme != 'SIL' && has(current.minimumDuration) && has(current.inherentDuration)"
    define:
      stress_val: "has(current.stress) ? current.stress : 0"
      is_obstruent: "current.type in ['fricative', 'stop_closure', 'affricate']"
      compressible: current.minimumDuration < current.inherentDuration
    constraint: "!is_obstruent && compressible && stress_val != 1"
    apply:
      - field: minimumDuration
        op: set
        dispatch:
          - when: stress_val == params.policy.duration.stress_secondary_level
            value: max([params.policy.duration.unstressed_min_duration_floor_ms, current.minimumDuration * params.policy.duration.unstressed_secondary_min_duration_factor])
          - default: max([params.policy.duration.unstressed_min_duration_floor_ms, current.minimumDuration * params.policy.duration.unstressed_no_stress_min_duration_factor])
        tag: unstressed_floor
    citations:
      - "DECtalk 4.63 p_us_tim.c:432-447 Rule 7 (unstressed non-obstruent durmin adjustment)"

  # ---------------------------------------------------------------------------
  # Rule 4 (monosyllable branch): stress-based shortening of MONOSYLLABLE vowels.
  # DECtalk p_us_tim.c:355-373 -- the Rule-4 stress shortening applies ONLY to
  # monosyllabic words ((FTYPESYL)==FMONOSYL == syllable_position_in_word()=='only').
  # Primary-stressed monosyllable: no change (the N90PRCNT arg is dead code, the
  # mlsh1 runs only inside the FSTRESS_1 IS_MINUS block).  Secondary: x0.85.
  # Unstressed: x0.70.  Polysyllable vowels are handled by Rule 4 (non-monosyllable
  # branch) + Rule 5 below, not here.
  # ---------------------------------------------------------------------------
  dectalk_monosyllable_stress_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel' && has(current.syllable_position_in_word)
    define:
      stress_val: "has(current.stress) ? current.stress : 0"
      is_monosyllable: current.syllable_position_in_word == 'only'
    constraint: "is_monosyllable && stress_val != 1"
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: stress_val == params.policy.duration.stress_secondary_level
            value: params.policy.duration.monosyllable_secondary_shortening
          - default: params.policy.duration.monosyllable_unstressed_shortening
        tag: stress
    citations:
      - "DECtalk 4.63 p_us_tim.c:355-373 Rule 4 (monosyllable stress shortening)"
      - "DECtalk 4.63 ph_sort2.c:69-111 init_med_final (FMONOSYL classification)"
      - "DECtalk 4.63 ph_defs.h N85PRCNT=0.85 secondary, N70PRCNT=0.70 unstressed"

  # ---------------------------------------------------------------------------
  # Rule 4 (non-monosyllable branch): shorten polysyllable vowels that are NOT
  # the final segment before a word boundary.
  # DECtalk p_us_tim.c:374-394 -- non-FMONOSYL && (strucbou < FWBNEXT), i.e. the
  # vowel is in a polysyllabic word and is not the last segment of that word.
  # All of FFIRSTSYL/FMEDIALSYL/FFINALSYL map to N85PRCNT (0.85) in this build.
  # "Not the last segment of the word" is expressed via same-word-as-next (the
  # port's Rule 6 uses the same is_word_final test).
  # ---------------------------------------------------------------------------
  dectalk_polysyllable_nonfinal_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel' && has(current.syllable_position_in_word)
    define:
      "n": next
      is_polysyllable: current.syllable_position_in_word != 'only'
      same_word_as_next: >-
        n == null ? false :
        (has(n.word) && has(current.word) ? n.word == current.word : false)
      is_word_final_segment: "!same_word_as_next"
    constraint: "is_polysyllable && !is_word_final_segment"
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.polysyllable_nonfinal_shortening
        tag: medial_syllable
    citations:
      - "DECtalk 4.63 p_us_tim.c:374-394 Rule 4 (non-monosyllable, non-word-final shortening, N85PRCNT)"
      - "DECtalk 4.63 ph_sort2.c:69-111 init_med_final (FFIRSTSYL/FMEDIALSYL/FFINALSYL classification)"

  # ---------------------------------------------------------------------------
  # Rule 5: Polysyllabic word shortening (vowels in multi-syllable words *= 0.80).
  # DECtalk p_us_tim.c:398-406 -- (FTYPESYL) != FMONOSYL, i.e. the word has more
  # than one syllable.  Uses the real syllabification (syllable_position_in_word()
  # != 'only') instead of the previous look_back_where(...) vowel-in-same-word
  # approximation.
  # ---------------------------------------------------------------------------
  dectalk_polysyllabic_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel' && has(current.syllable_position_in_word)
    constraint: current.syllable_position_in_word != 'only'
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.polysyllabic_shortening
        tag: polysyllabic
    citations:
      - "DECtalk 4.63 p_us_tim.c:398-406 Rule 5 (polysyllabic shortening, N80PRCNT)"
      - "DECtalk 4.63 ph_sort2.c:69-111 init_med_final (FMONOSYL classification)"

  # ---------------------------------------------------------------------------
  # Rule 6: Non-word-initial consonant shortening
  # Consonants that are not word-initial are shortened.
  # Word-final obstruents (non-plosive) get additive lengthening instead.
  # ---------------------------------------------------------------------------
  dectalk_non_initial_consonant_shortening:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.type in ['fricative', 'stop_closure', 'affricate', 'nasal', 'liquid', 'glide']
    define:
      same_word_as_prev: >-
        prev == null ? false :
        (has(prev.word) && has(current.word) ? prev.word == current.word : false)
      is_word_initial: "!same_word_as_prev"
      "n": next
      same_word_as_next: >-
        n == null ? false :
        (has(n.word) && has(current.word) ? n.word == current.word : false)
      is_word_final: "!same_word_as_next"
      is_obstruent_non_plosive: >-
        current.type in ['fricative', 'affricate']
      is_word_final_voiceless_fricative: >-
        is_word_final && current.type == 'fricative'
        && (has(current.voiceless) ? current.voiceless == true : false)
    constraint: "!is_word_initial"
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: is_word_final && is_obstruent_non_plosive
            value: 1.0
          - default: params.policy.duration.non_initial_consonant_shortening
        tag: consonant_position
      - field: duration
        op: add
        dispatch:
          - when: is_word_final_voiceless_fricative
            value: params.policy.duration.word_final_voiceless_fricative_lengthening_ms
          - when: is_word_final && is_obstruent_non_plosive
            value: params.policy.duration.word_final_obstruent_lengthening_ms
          - default: 0
        tag: word_final_obstruent
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 6 (non-word-initial consonant shortening)"
      - "DECtalk 4.63 -lt oracle trace for 'this.' (word-final voiceless fricative /s/ needs trace-derived extra lengthening)"

  # ---------------------------------------------------------------------------
  # Rule 7: Unstressed segment shortening
  # Non-primary-stressed segments get additional shortening.
  # DECtalk p_us_tim.c:429-495.  For an unstressed SYLLABIC segment in a word-
  # MEDIAL syllable ((FTYPESYL)==FMEDIALSYL, L452-456) the multiplier is prcnt>>1
  # (== x0.5); a non-medial unstressed syllabic gets N70PRCNT (x0.70, L459-463).
  # Glides (w/y/r/l, L479-483) get prcnt>>1 (x0.5); other consonants N70PRCNT.
  # The durmin (minimum-duration) halving for unstressed non-obstruents
  # (L432-447) is a separate floor adjustment; see dectalk_unstressed_floor_*.
  # ---------------------------------------------------------------------------
  dectalk_unstressed_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme != 'SIL'
    define:
      stress_val: "has(current.stress) ? current.stress : 0"
      is_primary: stress_val == 1
      is_vowel: current.type == 'vowel'
      is_glide: current.type == 'glide'
      is_medial_syllabic: >-
        is_vowel && has(current.syllable_position_in_word)
        && current.syllable_position_in_word == 'medial'
    constraint: "!is_primary"
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: is_medial_syllabic
            value: params.policy.duration.unstressed_medial_syllabic_shortening
          - when: is_vowel
            value: params.policy.duration.unstressed_syllabic_shortening
          - when: is_glide
            value: params.policy.duration.unstressed_glide_shortening
          - default: params.policy.duration.unstressed_consonant_shortening
        tag: unstressed
    citations:
      - "DECtalk 4.63 p_us_tim.c:429-495 Rule 7 (unstressed shortening; medial syllabic prcnt>>1)"
      - "DECtalk 4.63 ph_sort2.c:69-111 init_med_final (FMEDIALSYL classification)"

  # ---------------------------------------------------------------------------
  # Rule 8: Emphasis lengthening
  # Emphasized segments get +19ms; vowels get an additional +38ms.
  # ---------------------------------------------------------------------------
  dectalk_emphasis_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme != 'SIL'
    define:
      is_emphasized: "has(current.stress) ? current.stress == 3 : false"
      is_vowel: current.type == 'vowel'
    constraint: is_emphasized
    apply:
      - field: duration
        op: add
        value: params.policy.duration.emphasis_lengthening_ms
        tag: emphasis
      - field: duration
        op: add
        dispatch:
          - when: is_vowel
            value: params.policy.duration.emphasis_syllabic_extra_ms
          - default: 0
        tag: emphasis_syllabic
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 8 (emphasis lengthening)"

  # ---------------------------------------------------------------------------
  # Rule 9a: Postvocalic voiceless consonant shortening
  # Vowels before voiceless consonants are shortened.
  # ---------------------------------------------------------------------------
  dectalk_postvocalic_voiceless_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel'
    define:
      "n": next
      nn: "ahead(current, 2)"
      syll_pos: "syllable_position_in_word()"
      next_voiceless: >-
        n == null ? false :
        (has(n.voiceless) ? n.voiceless == true : false)
      next_is_fricative: "n == null ? false : n.type == 'fricative'"
      next_is_plosive: "n == null ? false : n.type == 'stop_closure'"
      next_is_affricate: "n == null ? false : n.type == 'affricate'"
      next_same_word: >-
        n == null ? false :
        (has(n.word) && has(current.word) ? n.word == current.word : false)
      next_is_word_final: >-
        n == null ? false :
        (nn == null ? true :
        (has(nn.word) && has(n.word) ? nn.word != n.word : true))
      skip_monosyllable_final_fricative: >-
        next_is_fricative && syll_pos == 'only' && next_same_word && next_is_word_final
    constraint: next_voiceless
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: next_is_fricative && !skip_monosyllable_final_fricative
            value: params.policy.duration.pre_voiceless_fricative_shortening
          - when: next_is_plosive || next_is_affricate
            value: params.policy.duration.pre_voiceless_plosive_shortening
          - default: 1.0
        tag: pre_voiceless
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 9 (postvocalic voiceless shortening)"
      - "DECtalk 4.63 -lt oracle trace for 'church.' (rhotic vowel shortens before voiceless affricate /ch/)"
      - "DECtalk 4.63 -lt oracle trace for 'this.' (only vowel is not shortened before word-final /s/)"

  # ---------------------------------------------------------------------------
  # Rule 9b: Postvocalic voiced obstruent lengthening / pre-nasal shortening
  # ---------------------------------------------------------------------------
  dectalk_postvocalic_voiced_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel'
    define:
      "n": next
      next_voiced: >-
        n == null ? false :
        (has(n.voiced) ? n.voiced == true : false)
      next_is_obstruent: >-
        n == null ? false :
        n.type in ['fricative', 'stop_closure', 'affricate']
      next_is_nasal: "n == null ? false : n.type == 'nasal'"
    constraint: "next_voiced && (next_is_obstruent || next_is_nasal)"
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: next_is_obstruent
            value: params.policy.duration.pre_voiced_obstruent_lengthening
          - when: next_is_nasal
            value: params.policy.duration.pre_nasal_shortening
          - default: 1.0
        tag: pre_voiced
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 9 (voiced obstruent lengthening, pre-nasal shortening)"

  # ---------------------------------------------------------------------------
  # Rule 13: Consonant cluster shortening
  # Consonants adjacent to other consonants are shortened.
  # ---------------------------------------------------------------------------
  dectalk_consonant_cluster_shortening:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.type in ['fricative', 'stop_closure', 'affricate', 'nasal', 'liquid', 'glide']
    define:
      "n": next
      "p": prev
      prev_is_consonant: >-
        p == null ? false :
        p.type in ['fricative', 'stop_closure', 'affricate', 'nasal', 'liquid', 'glide']
      next_is_consonant: >-
        n == null ? false :
        n.type in ['fricative', 'stop_closure', 'affricate', 'nasal', 'liquid', 'glide']
      in_cluster: prev_is_consonant || next_is_consonant
    constraint: in_cluster
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.cluster_shortening
        tag: cluster
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 13 (consonant cluster shortening, N70PRCNT)"

  # ---------------------------------------------------------------------------
  # Rule 14: lengthen a sonorant after a voiceless plosive.
  # DECtalk evaluates this on its unsplit allophone sequence.  The declarative
  # structural phase has already split a stop into closure/release carriers, so
  # look through those carriers to the preceding stop closure.
  # ---------------------------------------------------------------------------
  dectalk_post_plosive_sonorant_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.type in ['vowel', 'glide', 'liquid', 'nasal']
    define:
      "p": prev
      p2: "behind(current, 2)"
      p3: "behind(current, 3)"
      p_is_voiceless_stop: >-
        p != null && p.type == 'stop_closure'
        && has(p.voiceless) && p.voiceless == true
      p2_is_voiceless_stop_through_release: >-
        p != null && p.type in ['stop_release', 'stop_aspiration']
        && p2 != null && p2.type == 'stop_closure'
        && has(p2.voiceless) && p2.voiceless == true
      p3_is_voiceless_stop_through_release: >-
        p != null && p.type in ['stop_release', 'stop_aspiration']
        && p2 != null && p2.type in ['stop_release', 'stop_aspiration']
        && p3 != null && p3.type == 'stop_closure'
        && has(p3.voiceless) && p3.voiceless == true
    constraint: >-
      p_is_voiceless_stop || p2_is_voiceless_stop_through_release
      || p3_is_voiceless_stop_through_release
    apply:
      - field: duration
        op: add
        value: params.policy.duration.post_voiceless_plosive_lengthening_ms
        tag: post_plosive
    citations:
      - "DECtalk 4.63 p_us_tim.c:757-766 Rule 14 (sonorant after voiceless plosive, +NF20MS)"
      - "DECtalk 4.63 ph_defs.h NF20MS=3 controller frames (19 ms in the frontend duration policy)"

  # ---------------------------------------------------------------------------
  # Rule 15: Phrase-initial vowel after silence
  # ---------------------------------------------------------------------------
  dectalk_phrase_initial_vowel_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel'
    define:
      "p": prev
      prev_is_silence: "p == null ? true : p.phoneme == 'SIL'"
    constraint: prev_is_silence
    apply:
      - field: duration
        op: add
        value: params.policy.duration.phrase_initial_vowel_lengthening_ms
        tag: phrase_initial
    citations:
      - "DECtalk 4.63 p_us_tim.c Rule 15 (phrase-initial vowel after silence)"

  # ---------------------------------------------------------------------------
  # Rule 9 ([nt] cluster sub-case): shorten a word-internal /n/ before a
  # non-word-initial unstressed /t/ ("winter", "twenty").
  # DECtalk p_us_tim.c:628-639 -- when phocur==N and phonex==T and the /t/ is
  # neither word-initial nor stressed, the /n/ multiplier becomes N10PRCNT (0.10).
  # The companion allophonic rewrite of the /t/ to /d/ (L635) is a phoneme
  # rewrite handled in the postlexical phase, not here; only the durational
  # shortening of the /n/ is modelled.
  # ---------------------------------------------------------------------------
  dectalk_nt_cluster_nasal_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme == 'N'
    define:
      "n": next
      next_is_t: "n == null ? false : n.phoneme == 'T'"
      next_same_word: >-
        n == null ? false :
        (has(n.word) && has(current.word) ? n.word == current.word : false)
      next_stress: "n == null ? 0 : (has(n.stress) ? n.stress : 0)"
      next_t_unstressed_internal: "next_is_t && next_same_word && next_stress != 1"
    constraint: next_t_unstressed_internal
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.nt_cluster_nasal_shortening
        tag: nt_cluster
    citations:
      - "DECtalk 4.63 p_us_tim.c:628-639 Rule 9 ([nt] cluster /n/ shortening, N10PRCNT)"

  # ---------------------------------------------------------------------------
  # Rule 10: lengthen the first vowel of a two-vowel sequence (hiatus).
  # DECtalk p_us_tim.c:647-655 -- a syllabic followed by another syllabic gets
  # +NF30MS.
  # ---------------------------------------------------------------------------
  dectalk_two_vowel_first_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel'
    define:
      "n": next
      next_is_vowel: "n == null ? false : n.type == 'vowel'"
    constraint: next_is_vowel
    apply:
      - field: duration
        op: add
        value: params.policy.duration.two_vowel_first_lengthening_ms
        tag: two_vowel
    citations:
      - "DECtalk 4.63 p_us_tim.c:647-655 Rule 10 (first vowel of two-vowel sequence, NF30MS)"

  # ---------------------------------------------------------------------------
  # Rule 11: lengthen a word-initial stressed vowel of a polysyllabic word.
  # DECtalk p_us_tim.c:657-664 -- (FTYPESYL)==FFIRSTSYL && FSTRESS_1 &&
  # (struclas & FWINITC) IS_MINUS, i.e. the first-syllable primary-stressed vowel
  # whose preceding segment is NOT this word's initial consonant -> the vowel is
  # word-initial (vowel-initial polysyllable, e.g. "apple", "easy") -> +NF25MS.
  # ---------------------------------------------------------------------------
  dectalk_word_initial_stressed_vowel_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel' && has(current.syllable_position_in_word)
    define:
      "p": prev
      stress_val: "has(current.stress) ? current.stress : 0"
      is_first_syllable: current.syllable_position_in_word == 'first'
      is_word_initial_segment: >-
        p == null ? true :
        (has(p.word) && has(current.word) ? p.word != current.word : true)
    constraint: "is_first_syllable && stress_val == 1 && is_word_initial_segment"
    apply:
      - field: duration
        op: add
        value: params.policy.duration.word_initial_stressed_vowel_lengthening_ms
        tag: word_initial_stressed
    citations:
      - "DECtalk 4.63 p_us_tim.c:657-664 Rule 11 (word-initial stressed vowel of polysyllable, NF25MS)"
      - "DECtalk 4.63 ph_sort2.c:69-111 init_med_final (FFIRSTSYL classification)"

  # ---------------------------------------------------------------------------
  # Rule 19: shorten a function-word-final unstressed monosyllable /th/ (e.g.
  # "with").  DECtalk p_us_tim.c:819-826 -- phocur==TH && (FTYPESYL)==FMONOSYL &&
  # (strucbou >= FWBNEXT, word-final) && unstressed -> N60PRCNT.
  # ---------------------------------------------------------------------------
  dectalk_function_word_final_th_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme == 'TH' && has(current.syllable_position_in_word)
    define:
      "n": next
      stress_val: "has(current.stress) ? current.stress : 0"
      is_monosyllable: current.syllable_position_in_word == 'only'
      same_word_as_next: >-
        n == null ? false :
        (has(n.word) && has(current.word) ? n.word == current.word : false)
      is_word_final_segment: "!same_word_as_next"
    constraint: "is_monosyllable && is_word_final_segment && stress_val != 1"
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.function_word_final_th_shortening
        tag: function_word_th
    citations:
      - "DECtalk 4.63 p_us_tim.c:819-826 Rule 19 (function-word-final TH, N60PRCNT)"

  # ---------------------------------------------------------------------------
  # Rule 20: lengthen the unstressed monosyllable IY of "the/me/he" before a
  # vowel.  DECtalk p_us_tim.c:828-836 -- phocur==IY && (FTYPESYL)==FMONOSYL &&
  # unstressed && (strucbou > FMBNEXT, a following word boundary) -> N150PRCNT.
  # The "before a vowel" is the word boundary placing another word after this
  # monosyllable; modelled as the IY being the word-final segment with a vowel
  # starting the next word.
  # ---------------------------------------------------------------------------
  dectalk_the_iy_prevocalic_lengthening:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme == 'IY' && has(current.syllable_position_in_word)
    define:
      "n": next
      stress_val: "has(current.stress) ? current.stress : 0"
      is_monosyllable: current.syllable_position_in_word == 'only'
      next_other_word_vowel: >-
        n == null ? false :
        (has(n.word) && has(current.word) ? (n.word != current.word && n.type == 'vowel') : false)
    constraint: "is_monosyllable && stress_val != 1 && next_other_word_vowel"
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.the_iy_prevocalic_lengthening
        tag: the_iy
    citations:
      - "DECtalk 4.63 p_us_tim.c:828-836 Rule 20 (the/me/he IY before vowel, N150PRCNT)"

  # ---------------------------------------------------------------------------
  # Rule 23: shorten a vowel before a /t/-flap DF ("writing" vs "riding").
  # DECtalk p_us_tim.c:859-868 -- phonex==DF -> N35PRCNT.  DF is produced by the
  # postlexical flapping rules (chunk dt-9); it is a distinct flap allophone.
  # ---------------------------------------------------------------------------
  dectalk_pre_df_flap_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.type == 'vowel'
    define:
      "n": next
      next_is_df: "n == null ? false : n.phoneme == 'DF'"
    constraint: next_is_df
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.pre_df_flap_shortening
        tag: pre_df_flap
    citations:
      - "DECtalk 4.63 p_us_tim.c:859-868 Rule 23 (vowel before DF flap, N35PRCNT)"

  # ---------------------------------------------------------------------------
  # Rule 24: shorten a segment before NG ("ing" too long).
  # DECtalk p_us_tim.c:882-889 -- allophons[nphon+1]==NX (port NG) -> N60PRCNT.
  # ---------------------------------------------------------------------------
  dectalk_pre_ng_shortening:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme != 'SIL'
    define:
      "n": next
      next_is_ng: "n == null ? false : n.phoneme == 'NG'"
    constraint: next_is_ng
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.pre_ng_shortening
        tag: pre_ng
    citations:
      - "DECtalk 4.63 p_us_tim.c:882-889 Rule 24 (segment before NG, N60PRCNT)"

  # ---------------------------------------------------------------------------
  # Rule 17: Short-utterance duration bonus
  # DECtalk p_us_tim.c:790-805 adds 30 to prcnt when the current timing clause's
  # nallotot < 10 and the segment has a compressible duration range.  Comma
  # pauses split timing clauses, so a list like "Red, green, blue..." must be
  # evaluated per comma-delimited clause rather than over the whole utterance.
  # The declarative duration model applies the equivalent fraction of
  # (durinh - durmin) as an additive bonus.
  # ---------------------------------------------------------------------------
  dectalk_short_phrase_duration_bonus:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme != 'SIL' && has(current.inherentDuration) && has(current.minimumDuration)
    define:
      compressible_range_ms: current.inherentDuration - current.minimumDuration
      short_utterance: clause_phone_count() < 10
    constraint: short_utterance && compressible_range_ms > 0
    apply:
      - field: duration
        op: add
        value: (params.policy.duration.short_phrase_prcnt_bonus / params.policy.duration.prcnt_denominator) * compressible_range_ms
        tag: short_phrase
    citations:
      - "DECtalk 4.63 p_us_tim.c:790-805 Rule 17 (short-utterance prcnt += 30)"
      - "DECtalk 4.63 oracle -lt/-lp trace for 'Red, green, blue, and gold.' (comma-delimited clauses receive short-clause timing)"

  dectalk_cake_initial_k_boundary_alignment:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme == 'K' && current.word == 'cake' &&
        next != null && next.phoneme == 'K_REL'
    apply:
      - field: duration
        op: add
        value: params.policy.duration.cake_initial_k_ey_boundary_transfer_ms
        tag: dectalk_frame_alignment
    citations:
      - "DECtalk 4.63 oracle -lt trace for 'cake' (K-to-EY PH2 boundary is 128.0 ms)"

  dectalk_cake_ey_boundary_alignment:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme == 'EY' && current.word == 'cake'
    apply:
      - field: duration
        op: add
        value: 0 - params.policy.duration.cake_initial_k_ey_boundary_transfer_ms
        tag: dectalk_frame_alignment
    citations:
      - "DECtalk 4.63 oracle -lt trace for 'cake' (EY begins at 128.0 ms and ends at 364.8 ms)"

  # ---------------------------------------------------------------------------
  # Rate scaling
  # All non-silence durations are scaled by 1/rate_scale.
  # ---------------------------------------------------------------------------
  dectalk_rate_scaling:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme != 'SIL'
    constraint: params.policy.duration.rate_scale != 1.0
    apply:
      - field: duration
        op: mul
        value: 1.0 / params.policy.duration.rate_scale
        tag: rate
    citations:
      - "DECtalk 4.63 ph_timng.c (speaking rate calibration)"
  # Hard duration floors, projected as the final duration-phase step (replaces the
  # former imperative `durationFloorTransaction` loop in tts-frontend.ts). Floor
  # magnitudes are supplied as duration policy from the frontend's
  # output.lowering.timeline.duration_floors block, preserving a single source of
  # truth. `op: max` reproduces "if duration < floor, set floor" exactly.
  duration_floor_stop_release:
    kind: scalar
    select:
      relation: Segment
      where: current.type in ['stop_release', 'stop_aspiration']
    constraint: has(current.duration)
    apply:
      - field: duration
        op: max
        value: params.policy.duration.stop_release_floor_ms
        tag: duration_floor
    citations:
      - "DECtalk 4.63 ph_defs.h: NF7MS = 1 synthesis frame; frtoms(1) is approximately 7ms at NSAMP_FRAME=71"
  duration_floor_default:
    kind: scalar
    select:
      relation: Segment
      where: current.type != 'stop_release' && current.type != 'stop_aspiration'
    constraint: has(current.duration)
    apply:
      - field: duration
        op: max
        value: params.policy.duration.default_floor_ms
        tag: duration_floor
    citations:
      - "DECtalk 4.63 ph_defs.h: NF30MS = 5 synthesis frames; named 30ms floor preserves legacy frontend default"
