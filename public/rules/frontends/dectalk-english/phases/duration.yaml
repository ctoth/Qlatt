version: v1
# DECtalk 4.63's US duration rules, p_us_tim.c:157-941, one rule here per
# branch of the C, in source order.
#
# The C keeps four numbers per allophone and this file keeps the same four on
# the Segment that stands for the allophone (a stop is its closure):
#
#   timing_percent          prcnt   multiplier, 128 = 100%
#   timing_added_frames     deldur  frames added after the multiplier
#   timing_minimum_frames   durmin  the part the multiplier cannot shorten
#   timing_inherent_frames  durinh  from the ROM, never changed
#
# and the result is ((prcnt * (durinh - durmin)) >> 7) + durmin + deldur frames.
# A fraction NxxPRCNT is a number out of 16384 and mlsh1 multiplies by one,
# rounding down; a right shift is a floor. Nothing here is in milliseconds
# until the last two rules.
#
# The reading of the C that these rules transcribe is
# scripts/oracle/replay-dectalk-durations.ts, which reproduces every
# intermediate state DECtalk records for the oracle corpora.
# scripts/oracle/compare-durations.ts compares this file's result with DECtalk.
#
# Not ported: the FHAT_ENDS branch of Rule 7 (p_us_tim.c:497-508), which needs
# the hat pattern from the intonation rules.
rules:
  # Rule 1 (p_us_tim.c:225-277). The pause at a clause boundary. The values are
  # DECtalk's own at the corpus speaking rate (nfcomma and nfperiod scaled by
  # sprat1), in frames.
  dectalk_pause_duration:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_clause_silence }
    apply:
      - field: duration
        op: set
        value: >-
          (current.punctuationSymbol in [',', ';', ':']
            ? params.policy.timing.pause_frames.comma
            : params.policy.timing.pause_frames.period) * params.policy.timing.frame_ms
        tag: boundary
    citations:
      - "DECtalk 4.63 p_us_tim.c:225-277 Rule 1 (pause durations depend on syntax)"

  # p_us_tim.c:209-218. Inherent and minimum duration in frames, and the start
  # of the state. clause_position is nphon (the clause's first silence is 0);
  # clause_length is nallotot, which counts both silences.
  dectalk_timing_setup:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define:
      name: dectalk_name(current)
      position: "1.0 + count_back_pred(current, 1000, 'is_clause_silence', 'is_dectalk_phone')"
      following: "count_ahead_pred(current, 1000, 'is_clause_silence', 'is_dectalk_phone')"
    apply:
      - field: timing_inherent_frames
        op: set
        value: "floor((get(params.policy.timing.inherent_ms, name, 0.0) * 10.0 + 50.0) / 64.0)"
        tag: timing_setup
      - field: timing_minimum_frames
        op: set
        value: "floor((get(params.policy.timing.minimum_ms, name, 0.0) * 10.0 + 50.0) / 64.0)"
        tag: timing_setup
      - field: timing_percent
        op: set
        value: "128.0"
        tag: timing_setup
      - field: timing_added_frames
        op: set
        value: "0.0"
        tag: timing_setup
      - field: timing_factor
        op: set
        value: params.policy.timing.fraction.one
        tag: timing_setup
      - field: clause_position
        op: set
        value: position
        tag: timing_setup
      - field: clause_length
        op: set
        value: position + following + 2.0
        tag: timing_setup
    citations:
      - "DECtalk 4.63 p_us_tim.c:209-218 (durinh, durmin in frames; deldur 0; prcnt 128)"
      - "DECtalk 4.63 p_us_rom.h us_inhdr, us_mindur"

  # Rule 2 (281-314): lengthening in the clause-final rime.
  dectalk_timing_2_clause_final_rime:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: &timing
      name: dectalk_name(current)
      nx: dectalk_next(current)
      la: dectalk_prev(current)
      nx2: dectalk_next(nx)
      nx_name: dectalk_name(nx)
      la_name: dectalk_name(la)
      syllabic: dectalk_has(current, 'syllabic')
      stress: dectalk_stress(current)
      # FSTRESS_1 is the low bit: primary stress (1) and emphasis (3).
      primary: "stress == 1.0 || stress == 3.0"
      bou: dectalk_boundary(current)
      winitc: isTrue(current, 'word_initial_consonant')
      # Only a syllabic carries FTYPESYL; every other phone reads as FMONOSYL.
      typesyl: "syllabic ? get(current, 'syllable_type', 'only') : 'only'"
      F: params.policy.timing.fraction
      NF: params.policy.timing.frames
      B: params.policy.timing.boundary
      prcnt: "get(current, 'timing_percent', 128.0)"
      deldur: "get(current, 'timing_added_frames', 0.0)"
      durmin: "get(current, 'timing_minimum_frames', 0.0)"
      durinh: "get(current, 'timing_inherent_frames', 0.0)"
      length: "get(current, 'clause_length', 0.0)"
      # False once Rule 13 has fixed the duration (its `goto` past the rest).
      open: "get(current, 'timing_fixed_frames', null) == null"
      # --- Rule 3 ---
      fast: params.policy.timing.speaking_rate_wpm > 160.0
      # --- Rule 6 ---
      final_fricative: >-
        dectalk_has(current, 'obstruent') && !dectalk_has(current, 'plosive') && bou >= B.word
      # --- Rule 8: the nearest earlier phone that sets or clears emphasis ---
      decided_by: >-
        look_back_where(current, 100,
          '(candidate.phoneme == "SIL" && get(candidate, "punctuationSymbol", null) != null) || get(candidate, "stress", 0.0) == 3.0 || isTrue(candidate, "word_initial_consonant") || candidate.type == "vowel" || candidate.phoneme in ["EL", "EN"]')
      emphasised: >-
        stress == 3.0
        || (!winitc && !syllabic && decided_by != null && dectalk_stress(decided_by) == 3.0)
      # --- Rule 9 ---
      sonorant_before_obstruent: >-
        name in ['RX', 'LX', 'M', 'N', 'NX'] && stress == 0.0 && !winitc
        && dectalk_has(nx, 'obstruent')
      # Line 539 reads phone_feature(pDph_t, nphon+1): the allophone's POSITION
      # in the clause used as if it were an allophone code. This is the feature
      # of the allophone whose code equals clause_position + 1.
      code_at_position: "get(current, 'clause_position', 0.0) + 1.0"
      position_reads_syllabic: code_at_position in params.policy.timing.syllabic_codes
      percent_in: "position_reads_syllabic ? dectalk_mlsh1(prcnt, F.p70) : prcnt"
      # The next allophone belongs to this syllable's rime.
      next_in_rime: >-
        !dectalk_has(nx, 'syllabic') && dectalk_stress(nx) == 0.0
        && !isTrue(nx, 'word_initial_consonant')
      # A sonorant consonant with an obstruent after it: look at the obstruent.
      through_sonorant: >-
        next_in_rime && nx_name in ['RX', 'LX', 'M', 'N', 'NX']
        && dectalk_has(nx2, 'obstruent') && dectalk_stress(nx2) == 0.0
        && !isTrue(nx2, 'word_initial_consonant')
      posvoc: "through_sonorant ? nx2 : nx"
      posvoc_name: dectalk_name(posvoc)
      has_posvoc: next_in_rime && posvoc_name != 'SIL'
      before_voiceless: "has_posvoc && !dectalk_has(posvoc, 'voiced')"
      before_voiced_obstruent: >-
        has_posvoc && dectalk_has(posvoc, 'voiced') && dectalk_has(posvoc, 'obstruent')
        && name != 'EN'
      before_nasal: >-
        has_posvoc && dectalk_has(posvoc, 'voiced') && !before_voiced_obstruent
        && dectalk_has(posvoc, 'nasal')
      factor_by_context: >-
        before_voiceless
          ? (dectalk_has(posvoc, 'plosive') || posvoc_name == 'CH' ? F.p70 : F.p80)
          : (before_voiced_obstruent ? F.p120 : (before_nasal ? F.p85 : F.one))
      added_by_context: >-
        before_voiceless ? deldur - floor(deldur / 2.0)
        : (before_voiced_obstruent && !dectalk_has(posvoc, 'plosive') && posvoc_name != 'DX' && syllabic
            ? deldur + NF.ms25 : deldur)
      factor_non_final: >-
        bou < B.vp || through_sonorant ? F.half + floor(factor_by_context / 2.0) : factor_by_context
      # [n] before [t] in the same syllable. The "not medial" test of the C is a
      # single bit (FMEDIALSYL) that the final-syllable value also has, so it
      # holds for the syllabic of a monosyllable or of a first syllable.
      n_before_t: >-
        name == 'N' && nx_name == 'T' && dectalk_stress(nx) == 0.0
        && !isTrue(nx, 'word_initial_consonant')
      t_before_early_syllabic: >-
        dectalk_has(nx2, 'syllabic')
        && get(nx2, 'syllable_type', 'only') in ['only', 'first']
      factor_9: >-
        n_before_t ? (t_before_early_syllabic ? F.p70 : F.p10) : factor_non_final
      # --- Rule 13, first consonant. The multiplier starts as whatever Rule 9
      # left (timing_factor); the C reuses the variable without resetting it.
      carried: "get(current, 'timing_factor', F.one)"
      not_two_plosives: "!dectalk_has(nx, 'plosive') || !dectalk_has(current, 'plosive')"
      nasal_before_word: "dectalk_has(current, 'nasal') && isTrue(nx, 'word_initial_consonant')"
      s_or_th: "name in ['S', 'TH']"
      factor_13_first: >-
        s_or_th && dectalk_has(nx, 'plosive') ? F.half
        : (nasal_before_word ? F.p150 : (not_two_plosives ? F.p70 : carried))
      before_sh: "s_or_th && nx_name == 'SH'"
      # --- Rule 13, second consonant ---
      plosive: dectalk_has(current, 'plosive')
      factor_13_second: >-
        plosive && dectalk_has(la, 'nasal') && stress == 0.0 ? F.p10
        : (plosive && la_name == 'S' ? F.p60 : F.p70)
      # --- Final duration ---
      computed: "floor(prcnt * (durinh - durmin) / 128.0) + durmin + deldur"
      positive: "computed < 0.0 ? 1.0 : computed"
      capped: >-
        name == 'HX' && positive > params.policy.timing.hx_max_frames
          ? params.policy.timing.hx_max_frames : positive
      # --- Rule 2 ---
      base: >-
        dectalk_has(current, 'plosive') ? 0.0
        : (dectalk_has(current, 'voiced') && dectalk_has(current, 'obstruent') ? NF.ms20 : NF.ms40)
      before_voiceless_obstruent: >-
        name in ['RX', 'LX'] && dectalk_has(nx, 'obstruent') && !dectalk_has(nx, 'voiced')
      shaped: "before_voiceless_obstruent ? NF.ms15 : base"
      short_clause: "length < 10.0 && syllabic && stress != 0.0"
      lengthened: "short_clause ? shaped + NF.ms30 - floor(length / 2.0) : shaped"
    constraint: bou >= B.comma
    apply:
      - field: timing_added_frames
        op: set
        value: "dectalk_has(nx, 'son1') ? lengthened - NF.ms20 : lengthened"
        tag: clause_final
    citations:
      - "DECtalk 4.63 p_us_tim.c:281-314 Rule 2 (lengthening of segments in clause-final rime)"

  # Rule 3 (316-330): a syllabic that is not phrase-final.
  dectalk_timing_3_non_phrase_final_syllabic:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "syllabic && ((bou < B.vp && fast) || bou < B.pp)"
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(F.p70, prcnt)
        tag: non_final
    citations:
      - "DECtalk 4.63 p_us_tim.c:316-330 Rule 3 (shortening of non-phrase-final syllabics)"

  # Rule 3, second part (332-338): a nasal after a different nasal.
  dectalk_timing_3_adjacent_nasals:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "dectalk_has(current, 'nasal') && dectalk_has(la, 'nasal') && name != la_name"
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms30
        tag: adjacent_nasals
    citations:
      - "DECtalk 4.63 p_us_tim.c:332-338 (lengthen a nasal after a different nasal)"

  # Rule 4 (349-373): the syllabic of a monosyllable without primary stress.
  # A primary-stressed one is left alone: the C loads N90PRCNT and never uses it.
  dectalk_timing_4_monosyllable_stress:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "syllabic && typesyl == 'only' && !primary"
    apply:
      - field: timing_percent
        op: set
        value: "dectalk_mlsh1(stress == 0.0 ? F.p70 : F.p85, prcnt)"
        tag: stress
    citations:
      - "DECtalk 4.63 p_us_tim.c:349-373 Rule 4 (monosyllable: secondary N85PRCNT, unstressed N70PRCNT)"

  # Rule 4 (374-394): a syllabic of a polysyllable that does not end its word.
  dectalk_timing_4_polysyllable_non_word_final:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "syllabic && typesyl != 'only' && bou < B.word"
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(F.p85, prcnt)
        tag: medial_syllable
    citations:
      - "DECtalk 4.63 p_us_tim.c:374-394 Rule 4 (polysyllable, boundary below FWBNEXT: N85PRCNT)"

  # Rule 5 (396-406): every syllabic of a polysyllable.
  dectalk_timing_5_polysyllable:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "syllabic && typesyl != 'only'"
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p80)
        tag: polysyllabic
    citations:
      - "DECtalk 4.63 p_us_tim.c:396-406 Rule 5 (polysyllabic shortening, N80PRCNT)"

  # Rule 6 (408-427): a consonant that is not word-initial. A fricative or
  # affricate that ends its word is lengthened instead of shortened.
  dectalk_timing_6_word_final_fricative:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "!syllabic && !winitc && final_fricative"
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms20
        tag: word_final_obstruent
    citations:
      - "DECtalk 4.63 p_us_tim.c:408-420 Rule 6 (word-final non-plosive obstruent: +NF20MS)"

  dectalk_timing_6_non_word_initial_consonant:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "!syllabic && !winitc && !final_fricative"
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p85)
        tag: consonant_position
    citations:
      - "DECtalk 4.63 p_us_tim.c:421-427 Rule 6 (non-word-initial consonant: N85PRCNT)"

  # Rule 7 (429-447): a non-obstruent without primary stress may shrink further.
  dectalk_timing_7_unstressed_minimum:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "!primary && durmin < durinh && !dectalk_has(current, 'obstruent')"
    apply:
      - field: timing_minimum_frames
        op: set
        value: >-
          max([3.0, stress == 0.0 ? floor(durmin / 2.0) : durmin - floor(durmin / 4.0)])
        tag: unstressed_floor
    citations:
      - "DECtalk 4.63 p_us_tim.c:432-447 Rule 7 (durmin halved when unstressed, less a quarter when secondary; at least 3 frames)"

  # Rule 7 (449-470): a syllabic without primary stress.
  dectalk_timing_7_unstressed_syllabic:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "!primary && syllabic"
    apply:
      - field: timing_percent
        op: set
        value: "typesyl == 'medial' ? floor(prcnt / 2.0) : dectalk_mlsh1(prcnt, F.p70)"
        tag: unstressed
    citations:
      - "DECtalk 4.63 p_us_tim.c:449-470 Rule 7 (unstressed syllabic: halved word-medially, else N70PRCNT)"

  # Rule 7 (472-480): a reduced vowel beside a flap, or before h.
  dectalk_timing_7_schwa_by_flap:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      !primary && syllabic && name in ['AX', 'IX']
      && (la_name == 'DX' || nx_name == 'DX' || nx_name == 'HX')
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms25
        tag: schwa_by_flap
    citations:
      - "DECtalk 4.63 p_us_tim.c:472-480 Rule 7 (schwa next to a flap or before /h/: +NF25MS)"

  # Rule 7 (482-495): a consonant without primary stress. W, Y, R and LL are
  # the allophone codes US_W..US_LL of the C's range test.
  dectalk_timing_7_unstressed_consonant:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "!primary && !syllabic"
    apply:
      - field: timing_percent
        op: set
        value: >-
          name in ['W', 'Y', 'R', 'LL'] ? floor(prcnt / 2.0) : dectalk_mlsh1(prcnt, F.p70)
        tag: unstressed
    citations:
      - "DECtalk 4.63 p_us_tim.c:482-495 Rule 7 (unstressed consonant: glides and liquids halved, others N70PRCNT)"

  # Rule 7 (497-508), the branch for primary stress: "penultimate lengthening
  # of stressed syllabic if hat fall f0 gesture". The syllabic where the hat
  # pattern falls is lengthened when a word or prepositional-phrase boundary
  # follows its rime, that is, when it ends a word that does not end the phrase.
  dectalk_timing_7_hat_fall:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      primary && syllabic && isTrue(current, 'hat_ends')
      && bou < B.vp && bou > B.morpheme
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms25
        tag: hat_fall
    citations:
      - "DECtalk 4.63 p_us_tim.c:497-508 Rule 7 (stressed syllabic with FHAT_ENDS before a boundary above FMBNEXT and below FVPNEXT: +NF25MS)"

  # Rule 8 (510-525): emphasis. The C carries a switch from phone to phone:
  # an emphasised phone sets it, a word-initial consonant or a syllabic without
  # emphasis clears it. Here that is the nearest earlier phone that sets or
  # clears it.
  dectalk_timing_8_emphasis:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: emphasised
    apply:
      - field: timing_added_frames
        op: set
        value: "deldur + NF.ms20 + (syllabic ? NF.ms40 : 0.0)"
        tag: emphasis
    citations:
      - "DECtalk 4.63 p_us_tim.c:510-525 Rule 8 (emphasis: +NF20MS, and +NF40MS more on a syllabic)"

  # Rule 9 (527-645): what follows a syllabic (or a sonorant consonant before
  # an obstruent) in its own syllable.
  #
  # Line 539 reads phone_feature(pDph_t, nphon+1): the allophone's POSITION in
  # the clause used as if it were an allophone code. `position_reads_syllabic`
  # reproduces that: it is the feature of the allophone whose code equals
  # clause_position + 1.
  dectalk_timing_9_postvocalic_context:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: syllabic || sonorant_before_obstruent
    apply:
      - field: timing_factor
        op: set
        value: factor_9
        tag: segmental_context
      - field: timing_added_frames
        op: set
        value: added_by_context
        tag: segmental_context
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(factor_9, percent_in)
        tag: segmental_context
    citations:
      - "DECtalk 4.63 p_us_tim.c:527-645 Rule 9 (postvocalic context of vowels)"
      - "DECtalk 4.63 p_us_tim.c:539 (phone_feature(pDph_t, nphon+1) reads the feature of the allophone code nphon+1)"
      - "DECtalk 4.63 p_us_tim.c:628-639 ([n] before [t]: N10PRCNT, N70PRCNT when the [t] will flap)"

  # Rule 10 (647-653): a syllabic directly before another syllabic.
  dectalk_timing_10_syllabic_before_syllabic:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "syllabic && dectalk_has(nx, 'syllabic')"
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms30
        tag: two_vowel
    citations:
      - "DECtalk 4.63 p_us_tim.c:647-653 Rule 10 (first of two syllabics: +NF30MS)"

  # Rule 11 (655-661): a primary-stressed first syllable with no initial consonant.
  dectalk_timing_11_first_syllable_primary:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      syllabic && typesyl == 'first' && primary
      && !isTrue(la, 'word_initial_consonant')
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms25
        tag: word_initial_stressed
    citations:
      - "DECtalk 4.63 p_us_tim.c:655-661 Rule 11 (word-initial stressed vowel of a polysyllable: +NF25MS)"

  # Rule 12 (663-674): a syllabic before postvocalic l.
  dectalk_timing_12_syllabic_before_lx:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "syllabic && nx_name == 'LX'"
    apply:
      - field: timing_added_frames
        op: set
        value: deldur - NF.ms20
        tag: postvocalic_lateral
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(F.p70, prcnt)
        tag: postvocalic_lateral
    citations:
      - "DECtalk 4.63 p_us_tim.c:663-674 Rule 12 (syllabic before LX: -NF20MS and N70PRCNT)"

  # Rule 13 (677-718): the first consonant of a cluster inside a word. The
  # multiplier starts as whatever Rule 9 left (timing_factor); the C reuses
  # the variable without resetting it.
  dectalk_timing_13_cluster_first:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      !syllabic && dectalk_has(current, 'consonant') && dectalk_has(nx, 'consonant')
      && bou < B.word
    apply:
      - field: timing_minimum_frames
        op: set
        value: "nasal_before_word ? durmin : durmin - floor(durmin / 4.0)"
        tag: cluster
      - field: timing_percent
        op: set
        # Before [sh] the multiplier is not applied (dectalk_timing_13_before_sh).
        value: "before_sh ? prcnt : dectalk_mlsh1(factor_13_first, prcnt)"
        tag: cluster
    citations:
      - "DECtalk 4.63 p_us_tim.c:677-718 Rule 13 (consonant cluster, first member)"

  # Rule 13 (713-717): [s] or [th] before [sh] inside a word takes a fixed
  # NF15MS, and the C jumps past every later rule.
  dectalk_timing_13_before_sh:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      !syllabic && dectalk_has(current, 'consonant') && dectalk_has(nx, 'consonant')
      && bou < B.word && name in ['S', 'TH'] && nx_name == 'SH'
    apply:
      - field: timing_fixed_frames
        op: set
        value: NF.ms15
        tag: cluster
    citations:
      - "DECtalk 4.63 p_us_tim.c:713-717 ([s] or [th] before [sh]: NF15MS, skip the remaining rules)"

  # Rule 13 (720-755): the second consonant of a cluster.
  dectalk_timing_13_cluster_second:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      open && !syllabic && dectalk_has(current, 'consonant') && dectalk_has(la, 'consonant')
      && dectalk_boundary(la) < B.vp
    apply:
      - field: timing_minimum_frames
        op: set
        value: durmin - floor(durmin / 4.0)
        tag: cluster
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(factor_13_second, prcnt)
        tag: cluster
    citations:
      - "DECtalk 4.63 p_us_tim.c:720-755 Rule 13 (consonant cluster, second member: N70PRCNT, N60PRCNT after [s], 1638 for an unstressed plosive after a nasal)"

  # Rule 14 (757-765).
  dectalk_timing_14_sonorant_after_voiceless_plosive:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      open && dectalk_has(current, 'son1') && !dectalk_has(la, 'voiced')
      && dectalk_has(la, 'plosive')
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms20
        tag: post_plosive
    citations:
      - "DECtalk 4.63 p_us_tim.c:757-765 Rule 14 (sonorant after a voiceless plosive: +NF20MS for aspiration)"

  # Rule 15 (767-774).
  dectalk_timing_15_vowel_after_silence:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "open && dectalk_has(current, 'vowel') && la_name == 'SIL'"
    apply:
      - field: timing_added_frames
        op: set
        value: deldur + NF.ms20
        tag: phrase_initial
    citations:
      - "DECtalk 4.63 p_us_tim.c:767-774 Rule 15 (vowel after silence: +NF20MS)"

  # Rule 16 (776-786).
  dectalk_timing_16_vowel_after_glide:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      open && dectalk_has(current, 'vowel') && dectalk_has(la, 'son2')
      && !dectalk_has(la, 'nasal') && deldur == 0.0
    apply:
      - field: timing_added_frames
        op: set
        value: NF.ms20
        tag: segmental_context
    citations:
      - "DECtalk 4.63 p_us_tim.c:776-786 Rule 16 (vowel after a glide or liquid, when nothing was added yet: NF20MS)"

  # Rule 17 (788-802).
  dectalk_timing_17_short_clause:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "open && length < 10.0 && durinh != durmin"
    apply:
      - field: timing_percent
        op: set
        value: prcnt + 30.0
        tag: short_phrase
    citations:
      - "DECtalk 4.63 p_us_tim.c:788-802 Rule 17 (clause of fewer than 10 allophones: prcnt += 30)"

  # Rule 18 (804-815).
  dectalk_timing_18_glide_after_obstruent:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      open && dectalk_has(current, 'sonorant_consonant') && dectalk_has(la, 'obstruent')
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p70)
        tag: cluster
    citations:
      - "DECtalk 4.63 p_us_tim.c:804-815 Rule 18 (liquid or glide after an obstruent: N70PRCNT)"

  # Rule 19 (817-825).
  dectalk_timing_19_unstressed_final_th:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "open && name == 'TH' && typesyl == 'only' && bou >= B.word && stress == 0.0"
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p60)
        tag: function_word_th
    citations:
      - "DECtalk 4.63 p_us_tim.c:817-825 Rule 19 (unstressed word-final [th]: N60PRCNT)"

  # Rule 20 (827-835).
  dectalk_timing_20_unstressed_final_iy:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      open && name == 'IY' && bou > B.morpheme && stress == 0.0 && typesyl == 'only'
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p150)
        tag: the_iy
    citations:
      - "DECtalk 4.63 p_us_tim.c:827-835 Rule 20 (unstressed word-final [iy] of a monosyllable: N150PRCNT)"

  # Rule 21 (837-856).
  dectalk_timing_21_plosive_between_obstruents:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: >-
      open && dectalk_has(current, 'plosive') && dectalk_has(la, 'plosive')
      && dectalk_has(nx, 'obstruent') && bou > B.morpheme
    apply:
      - field: timing_minimum_frames
        op: set
        value: floor(durmin / 2.0)
        tag: cluster
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p25)
        tag: cluster
    citations:
      - "DECtalk 4.63 p_us_tim.c:837-856 Rule 21 (plosive after a plosive and before an obstruent: durmin halved, N25PRCNT)"

  # Rule 23 (858-867).
  dectalk_timing_23_before_df:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "open && nx_name == 'DF'"
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p35)
        tag: pre_df_flap
    citations:
      - "DECtalk 4.63 p_us_tim.c:858-867 Rule 23 (before DF: N35PRCNT)"

  # 871-877.
  # Numbered 23 because it sits between Rules 23 and 24 in the source.
  dectalk_timing_23_retroflex_minimum:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "open && name == 'RR' && durmin <= params.policy.timing.rr_minimum_frames"
    apply:
      - field: timing_minimum_frames
        op: set
        value: params.policy.timing.rr_minimum_frames
        tag: retroflex_minimum
    citations:
      - "DECtalk 4.63 p_us_tim.c:871-877 (RR minimum duration of 13 frames)"

  # Rule 24 (879-889).
  dectalk_timing_24_before_velar_nasal:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    constraint: "open && nx_name == 'NX'"
    apply:
      - field: timing_percent
        op: set
        value: dectalk_mlsh1(prcnt, F.p60)
        tag: pre_ng
    citations:
      - "DECtalk 4.63 p_us_tim.c:879-889 Rule 24 (before NX: N60PRCNT)"

  # 895-941: the duration in frames. A negative result becomes 1 (the C tests
  # `< 0`, so 0 passes through), and HX is capped.
  dectalk_timing_frames:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    define: *timing
    apply:
      - field: timing_frames
        op: set
        value: "open ? capped : current.timing_fixed_frames"
        tag: allophone_duration
    citations:
      - "DECtalk 4.63 p_us_tim.c:895-941 (durxx = ((prcnt * (durinh - durmin)) >> 7) + durmin + deldur)"

  # A phone lasts its allophone's frames. A stop's closure is handled below.
  dectalk_allophone_duration:
    kind: scalar
    select:
      relation: Segment
      where: { predicate: is_dectalk_phone }
    apply:
      - field: duration
        op: set
        value: current.timing_frames * params.policy.timing.frame_ms
        tag: allophone_duration
    citations:
      - "DECtalk 4.63 p_us_tim.c:940 (allodurs[nphon] = durxx)"
      - "DECtalk 4.63 ph_defs.h NSAMP_FRAME = 71 samples at 11025 Hz (one frame)"

  # This port draws a stop as a closure and a release. The release keeps the
  # length the stop rules gave it, and the closure takes the rest of the
  # allophone, so the two together last DECtalk's frame count. A release
  # longer than the allophone leaves the closure one frame.
  dectalk_stop_closure_duration:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'stop_closure' && next != null && next.type == 'stop_release'"
    define:
      total: current.timing_frames * params.policy.timing.frame_ms
      closure: "max([params.policy.timing.frame_ms, total - next.duration])"
    apply:
      - field: duration
        op: set
        value: closure
        tag: allophone_duration
    citations:
      - "DECtalk 4.63 p_us_tim.c:940 (one duration per stop allophone; the burst is drawn inside it)"
      - "Engineering estimate: a release longer than its allophone leaves the closure one frame"

  # The frontend API's `rate` option is a multiplier on speaking rate, not
  # DECtalk's words-per-minute setting. DECtalk's own rate scaling
  # (p_us_tim.c:910-925, sprat1 and sprat2, inactive at 180 wpm) is not ported;
  # this divides every speech duration by the multiplier instead.
  dectalk_rate_scaling:
    kind: scalar
    select:
      relation: Segment
      where: current.phoneme != 'SIL'
    constraint: params.policy.duration.rate_scale != 1.0
    apply:
      - field: duration
        op: mul
        value: 1.0 / params.policy.duration.rate_scale
        tag: rate
    citations:
      - "Qlatt frontend API: options.rate is a speaking-rate multiplier applied to segment durations"
      - "Engineering estimate: uniform scaling stands in for DECtalk 4.63 p_us_tim.c:910-925 (sprat2 on the multiplied part, sprat1 on the added part)"

  # The release gives up whatever the one-frame closure above could not.
  dectalk_stop_release_duration:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'stop_release' && prev != null && prev.type == 'stop_closure'"
    define:
      total: prev.timing_frames * params.policy.timing.frame_ms
    constraint: current.duration > total - params.policy.timing.frame_ms
    apply:
      - field: duration
        op: set
        value: "max([0.0, total - params.policy.timing.frame_ms])"
        tag: allophone_duration
    citations:
      - "DECtalk 4.63 p_us_tim.c:940 (one duration per stop allophone; the burst is drawn inside it)"
      - "Engineering estimate: a release longer than its allophone leaves the closure one frame"
