            : ((r.dip_new - r.dold_B2) * 8 / r.dip_span < 0
              ? ceil((r.dip_new - r.dold_B2) * 8 / r.dip_span)
              : floor((r.dip_new - r.dold_B2) * 8 / r.dip_span)))
        tag: formant_diphthong
      - { register: dold_B2, value: "r.dip_span == 0 ? r.dold_B2 : r.dip_new", tag: formant_diphthong }
      - { register: told_B2, value: "r.dip_span == 0 ? r.told_B2 : r.shr", tag: formant_diphthong }
      - { register: durlin_B2, value: "r.shr", tag: formant_diphthong }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:359-365; ph_setar.c:1301-1386"
  fd_diphthong_next_line_b3:
    kind: frame
    program: formants
    unit: "u.dip_B3"
    when: "f.index > r.durlin_B3 && r.durlin_B3 >= 0 && r.line_B3 + 1 < size(u.dv_B3)"
    set:
      - { register: cur_B3, value: "r.cur_B3 + floor(r.dipcum_B3 / 8)", tag: formant_diphthong }
      - { register: dipcum_B3, value: "0", tag: formant_diphthong }
      - { register: line_B3, value: "r.line_B3 + 1", tag: formant_diphthong }
      - { register: dip_new, value: "u.dv_B3[r.line_B3]", tag: formant_diphthong }
      - { register: shr_ms, value: "r.line_B3 < size(u.dt_B3) ? u.dt_B3[r.line_B3] : -1", tag: formant_diphthong }
      - *shr_1
      - *shr_2
      - *shr_3
      - *shr_4
      - *shr_5
      - *shr_6
      - *shr_7
      - { register: dip_span, value: "r.shr - r.told_B3", tag: formant_diphthong }
      - register: deldip_B3
        value: >-
          r.dip_span == 0 ? 0
          : (r.dip_span > 0 && r.dip_span < 50
            ? floor(params.policy.formant_drawing.divtab[r.dip_span] * (r.dip_new - r.dold_B3) * 8 / 16384)
            : ((r.dip_new - r.dold_B3) * 8 / r.dip_span < 0
              ? ceil((r.dip_new - r.dold_B3) * 8 / r.dip_span)
              : floor((r.dip_new - r.dold_B3) * 8 / r.dip_span)))
        tag: formant_diphthong
      - { register: dold_B3, value: "r.dip_span == 0 ? r.dold_B3 : r.dip_new", tag: formant_diphthong }
      - { register: told_B3, value: "r.dip_span == 0 ? r.told_B3 : r.shr", tag: formant_diphthong }
      - { register: durlin_B3, value: "r.shr", tag: formant_diphthong }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:359-365; ph_setar.c:1301-1386"

  # ===========================================================================
  # The frame: ph_draw.c:367-412. The forward ramp shrinks after it is read;
  # the backward one grows after it is read, from tbacktr on. The F2 terms for
  # vowel-to-vowel coarticulation are always zero (ph_sttr2.c:410-411).
  # ===========================================================================
  fd_draw:
    kind: frame
    program: formants
    set:
      - { register: dipcum_F1, value: "r.dipcum_F1 + r.deldip_F1", tag: formant_draw }
      - { register: val_F1, value: "r.dipcum_F1 + r.ftran_F1 + (f.index >= r.tback_F1 ? r.btran_F1 : 0)", tag: formant_draw }
      - { register: ftran_F1, value: "r.ftran_F1 != 0 ? r.ftran_F1 - r.dft_F1 : 0", tag: formant_draw }
      - { register: btran_F1, value: "f.index >= r.tback_F1 ? r.btran_F1 + r.dbt_F1 : r.btran_F1", tag: formant_draw }
      - { register: val_F1, value: "floor(r.val_F1 / 8) + r.cur_F1", tag: formant_draw }
      - { register: dipcum_F2, value: "r.dipcum_F2 + r.deldip_F2", tag: formant_draw }
      - { register: val_F2, value: "r.dipcum_F2 + r.ftran_F2 + (f.index >= r.tback_F2 ? r.btran_F2 : 0)", tag: formant_draw }
      - { register: ftran_F2, value: "r.ftran_F2 != 0 ? r.ftran_F2 - r.dft_F2 : 0", tag: formant_draw }
      - { register: btran_F2, value: "f.index >= r.tback_F2 ? r.btran_F2 + r.dbt_F2 : r.btran_F2", tag: formant_draw }
      - { register: val_F2, value: "floor(r.val_F2 / 8) + r.cur_F2", tag: formant_draw }
      - { register: dipcum_F3, value: "r.dipcum_F3 + r.deldip_F3", tag: formant_draw }
      - { register: val_F3, value: "r.dipcum_F3 + r.ftran_F3 + (f.index >= r.tback_F3 ? r.btran_F3 : 0)", tag: formant_draw }
      - { register: ftran_F3, value: "r.ftran_F3 != 0 ? r.ftran_F3 - r.dft_F3 : 0", tag: formant_draw }
      - { register: btran_F3, value: "f.index >= r.tback_F3 ? r.btran_F3 + r.dbt_F3 : r.btran_F3", tag: formant_draw }
      - { register: val_F3, value: "floor(r.val_F3 / 8) + r.cur_F3", tag: formant_draw }
      - { register: dipcum_B2, value: "r.dipcum_B2 + r.deldip_B2", tag: formant_draw }
      - { register: val_B2, value: "r.dipcum_B2 + r.ftran_B2 + (f.index >= r.tback_B2 ? r.btran_B2 : 0)", tag: formant_draw }
      - { register: ftran_B2, value: "r.ftran_B2 != 0 ? r.ftran_B2 - r.dft_B2 : 0", tag: formant_draw }
      - { register: btran_B2, value: "f.index >= r.tback_B2 ? r.btran_B2 + r.dbt_B2 : r.btran_B2", tag: formant_draw }
      - { register: val_B2, value: "floor(r.val_B2 / 8) + r.cur_B2", tag: formant_draw }
      - { register: dipcum_B3, value: "r.dipcum_B3 + r.deldip_B3", tag: formant_draw }
      - { register: val_B3, value: "r.dipcum_B3 + r.ftran_B3 + (f.index >= r.tback_B3 ? r.btran_B3 : 0)", tag: formant_draw }
      - { register: ftran_B3, value: "r.ftran_B3 != 0 ? r.ftran_B3 - r.dft_B3 : 0", tag: formant_draw }
      - { register: btran_B3, value: "f.index >= r.tback_B3 ? r.btran_B3 + r.dbt_B3 : r.btran_B3", tag: formant_draw }
      - { register: val_B3, value: "floor(r.val_B3 / 8) + r.cur_B3", tag: formant_draw }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:367-402"
  # From the phone's start to tspesh the special rule's value stands instead.
  fd_draw_override:
    kind: frame
    program: formants
    set:
      - { register: out_B2, value: "r.tsp_B2 > 0 && f.index < r.tsp_B2 ? r.psp_B2 : r.val_B2", tag: formant_override }
      - { register: out_B3, value: "r.tsp_B3 > 0 && f.index < r.tsp_B3 ? r.psp_B3 : r.val_B3", tag: formant_override }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:405-412"
  # The speaker's formant scale, frac4mul(F, fnscale) plus (4096 - fnscale)
  # >> 4 for F1 and >> 3 for F2, written here as minus the ceiling of
  # (fnscale - 4096) / 16 and / 8; F1 only above 250 Hz.
  fd_speaker_scale:
    kind: frame
    program: formants
    set:
      - register: out_F1
        value: >-
          r.val_F1 > 250
            ? floor(r.val_F1 * params.policy.formant_drawing.voice.fnscale / 4096)
              - ceil((params.policy.formant_drawing.voice.fnscale - 4096) / 16)
            : r.val_F1
        tag: formant_draw
      - register: out_F2
        value: >-
          floor(r.val_F2 * params.policy.formant_drawing.voice.fnscale / 4096)
          - ceil((params.policy.formant_drawing.voice.fnscale - 4096) / 8)
        tag: formant_draw
      - { register: out_F3, value: "floor(r.val_F3 * params.policy.formant_drawing.voice.fnscale / 4096)", tag: formant_draw }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:733-736; ph_defs.h:798 frac4mul"
  fd_third_formant_floor:
    kind: frame
    program: formants
    when: "r.out_F3 - r.out_F2 < 300"
    set:
      - { register: out_F3, value: "r.out_F2 + 300", tag: formant_draw }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:4564-4567"

