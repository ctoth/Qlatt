  provenance:
    paper: DeTournemire_1998_ProsodicAlphabetTranscription
    page: 0
- id: claim1885
  type: observation
  statement: '**4-point F0 adequacy**: Linear interpolation through 4 syllable points
    should produce F0 contours perceptually indistinguishable from the original (verified
    by the paper at 1 Hz mean error)'
  concepts: []
  provenance:
    paper: DeTournemire_1998_ProsodicAlphabetTranscription
    page: 0
- id: claim1886
  type: observation
  statement: '**Threshold robustness**: The 1/6 semitone boundaries for F0 shapes
    should produce consistent labelling across utterances of similar prosodic structure'
  concepts: []
  provenance:
    paper: DeTournemire_1998_ProsodicAlphabetTranscription
    page: 0
- id: claim1887
