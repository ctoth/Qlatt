version: v1
rules:
  k_context_cl_f2:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme == 'K_CL'
    define:
      cand: "next != null && next.phoneme == \"K_REL\" ? ahead(current, 2) : next"
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: "cand != null && cand.type == 'vowel' && (has(cand.back) ? cand.back == true : false)"
            value: params.policy.formant.velar_f2_locus_back
          - when: >-
              cand != null && cand.type == 'vowel' && ((has(cand.front) ? cand.front == true : false) || (has(cand.hi) ?
              cand.hi == true : false))
            value: params.policy.formant.velar_f2_locus_front
          - default: params.policy.formant.velar_f2_locus
        tag: velar_locus
    citations:
      - Allen et al. 1987 (velar locus)
  k_context_rel_copy:
    kind: scalar
    select:
      stream: phone
      where: "current.phoneme == \"K_REL\" && (prev != null ? prev.phoneme == \"K_CL\" : false)"
    apply:
      - field: params.F2
        op: set
        value: "prev != null && has(prev.?params.F2) ? prev.params.F2 : params.policy.formant.velar_f2_locus"
        tag: velar_locus
    citations:
      - Allen et al. 1987 (velar locus transitions)
  bilabial_f2_locus:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme in ['P_CL', 'B_CL', 'M']
    define:
      cand: >-
        current.phoneme == "P_CL" ? (next != null && next.phoneme == "P_REL" ? ahead(current, 2) : next) :
        (current.phoneme == "B_CL" ? (next != null && next.phoneme == "B_REL" ? ahead(current, 2) : next) : next)
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: >-
              cand != null && cand.type == 'vowel' && ((has(cand.front) ? cand.front == true : false) || (has(cand.hi) ?
              cand.hi == true : false))
            value: params.policy.formant.bilabial_f2_locus_front
          - when: "cand != null && cand.type == 'vowel' && (has(cand.back) ? cand.back == true : false)"
            value: params.policy.formant.bilabial_f2_locus_back
          - default: params.policy.formant.bilabial_f2_locus
        tag: bilabial_locus
    citations:
      - >-
        Stevens & House 1956 (locus varies 700-1500 Hz by vowel context; 1200 Hz is midpoint approximation per Allen et
        al. 1987 Ch.11)
  bilabial_rel_copy:
    kind: scalar
    select:
      stream: phone
      where: "current.phoneme in [\"P_REL\", \"B_REL\"] && (prev != null ? prev.phoneme in [\"P_CL\", \"B_CL\"] : false)"
    apply:
      - field: params.F2
        op: set
        value: "prev != null && has(prev.?params.F2) ? prev.params.F2 : params.policy.formant.bilabial_f2_locus"
        tag: bilabial_locus
    citations:
      - Stevens & House 1956
      - Allen et al. 1987 (bilabial locus transitions)
  alveolar_f2_locus:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme in ['T_CL', 'D_CL', 'N']
    define:
      cand: >-
        current.phoneme == "T_CL" ? (next != null && next.phoneme == "T_REL" ? ahead(current, 2) : next) :
        (current.phoneme == "D_CL" ? (next != null && next.phoneme == "D_REL" ? ahead(current, 2) : next) : next)
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: >-
              cand != null && cand.type == 'vowel' && ((has(cand.front) ? cand.front == true : false) || (has(cand.hi) ?
              cand.hi == true : false))
            value: params.policy.formant.alveolar_f2_locus_front
          - when: "cand != null && cand.type == 'vowel' && (has(cand.back) ? cand.back == true : false)"
            value: params.policy.formant.alveolar_f2_locus_back
          - default: params.policy.formant.alveolar_f2_locus
        tag: alveolar_locus
    citations:
      - Stevens & House 1956
      - Allen et al. 1987 (alveolar F2 locus ~1800 Hz)
  alveolar_rel_copy:
    kind: scalar
    select:
      stream: phone
      where: "current.phoneme in [\"T_REL\", \"D_REL\"] && (prev != null ? prev.phoneme in [\"T_CL\", \"D_CL\"] : false)"
    apply:
      - field: params.F2
        op: set
        value: "prev != null && has(prev.?params.F2) ? prev.params.F2 : params.policy.formant.alveolar_f2_locus"
        tag: alveolar_locus
    citations:
      - Stevens & House 1956
      - Allen et al. 1987 (alveolar locus transitions)
  palatal_f2_locus:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme == 'Y'
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: "next != null ? (next.type == 'vowel' ? (has(next.back) ? next.back == true : false) : false) : false"
            value: params.policy.formant.palatal_f2_back_vowel
          - default: params.policy.formant.palatal_f2_locus
        tag: palatal_locus
    citations:
      - Stevens & House 1956
      - Allen et al. 1987 (palatal F2 locus ~2600 Hz)
  nasal_place_assignment:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'nasal'
    apply:
      - field: params.nasalPlaceIndex
        op: set
        value: target(current.phoneme).nasal_place_index
        tag: nasal_place
      - field: params.nasalMurmurStrength
        op: set
        value: params.policy.nasal.murmur_strength
        tag: nasal_murmur
      - field: params.nasalCoupling
        op: set
        value: 1
        tag: nasal_coupling
    citations:
      - Fujimura 1962
      - Stevens 1998 (nasal consonant oral cavity zeros)
  nasal_place_assimilation:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme == 'N'
    define:
      "n": next
      next_is_obstruent: "n != null ? (n.type in ['stop_closure', 'stop_release', 'fricative', 'affricate']) : false"
      next_bilabial: "next_is_obstruent ? (has(n.bilabial) ? n.bilabial == true : false) : false"
      next_velar: "next_is_obstruent ? (has(n.velar) ? n.velar == true : false) : false"
    constraint: next_is_obstruent
    apply:
      - field: params.nasalPlaceIndex
        op: set
        dispatch:
          - when: next_bilabial
            value: 1
          - when: next_velar
            value: 3
          - default: 2
        tag: nasal_place
      - field: params.F2
        op: set
        dispatch:
          - when: next_bilabial
            value: params.policy.formant.bilabial_f2_locus
          - when: next_velar
            value: "has(current.?params.F2) ? current.params.F2 : params.policy.formant.nasal_n_f2_default"
          - default: "has(current.?params.F2) ? current.params.F2 : params.policy.formant.nasal_n_f2_default"
        tag: nasal_place
    citations:
      - Allen et al. 1987
      - Fujimura 1962
      - Stevens 1998
  nasal_windows:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'nasal'
    define:
      anticipatory_window_ms: >-
        params.policy.nasal.vowel_onset_delay_ms + params.policy.nasal.vowel_ramp_ms
      anticipatory_start_ms: "max((prev != null ? prev.duration : 0) - anticipatory_window_ms, 0)"
      anticipatory_stage_1_end_ms: >-
        anticipatory_start_ms + anticipatory_window_ms * params.policy.nasal.anticipatory_stage_1_fraction
      anticipatory_midpoint_ms: >-
        anticipatory_start_ms + anticipatory_window_ms * params.policy.nasal.anticipatory_midpoint_fraction
      anticipatory_stage_2_end_ms: >-
        anticipatory_start_ms + anticipatory_window_ms * params.policy.nasal.anticipatory_stage_2_fraction
      carryover_stage_1_end_ms: >-
        params.policy.nasal.vowel_decay_ms * params.policy.nasal.carryover_stage_2_fraction
    apply:
      - field: control_windows
        op: set
        dispatch:
          - when: "prev != null && prev.type == 'vowel' && next != null && next.type == 'vowel'"
            value:
              - target: "'prev'"
                start_ms: anticipatory_start_ms
                end_ms: anticipatory_stage_1_end_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.anticipatory_peak * params.policy.nasal.anticipatory_stage_1_fraction"
                tag: "'nasal_coupling'"
              - target: "'prev'"
                start_ms: anticipatory_stage_1_end_ms
                end_ms: anticipatory_midpoint_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.anticipatory_peak * params.policy.nasal.anticipatory_midpoint_fraction"
                tag: "'nasal_coupling'"
              - target: "'prev'"
                start_ms: anticipatory_midpoint_ms
                end_ms: "prev != null ? prev.duration : 0"
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.anticipatory_peak * params.policy.nasal.anticipatory_stage_2_fraction"
                tag: "'nasal_coupling'"
              - target: "'next'"
                start_ms: 0
                end_ms: carryover_stage_1_end_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: params.policy.nasal.carryover_peak
                tag: "'nasal_coupling'"
              - target: "'next'"
                start_ms: carryover_stage_1_end_ms
                end_ms: params.policy.nasal.vowel_decay_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.carryover_peak * params.policy.nasal.carryover_stage_2_fraction"
                tag: "'nasal_coupling'"
          - when: "prev != null && prev.type == 'vowel'"
            value:
              - target: "'prev'"
                start_ms: anticipatory_start_ms
                end_ms: anticipatory_stage_1_end_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.anticipatory_peak * params.policy.nasal.anticipatory_stage_1_fraction"
                tag: "'nasal_coupling'"
              - target: "'prev'"
                start_ms: anticipatory_stage_1_end_ms
                end_ms: anticipatory_midpoint_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.anticipatory_peak * params.policy.nasal.anticipatory_midpoint_fraction"
                tag: "'nasal_coupling'"
              - target: "'prev'"
                start_ms: anticipatory_midpoint_ms
                end_ms: "prev != null ? prev.duration : 0"
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.anticipatory_peak * params.policy.nasal.anticipatory_stage_2_fraction"
                tag: "'nasal_coupling'"
          - when: "next != null && next.type == 'vowel'"
            value:
              - target: "'next'"
                start_ms: 0
                end_ms: carryover_stage_1_end_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: params.policy.nasal.carryover_peak
                tag: "'nasal_coupling'"
              - target: "'next'"
                start_ms: carryover_stage_1_end_ms
                end_ms: params.policy.nasal.vowel_decay_ms
                fields:
                  nasalCoupling:
                    op: "'set'"
                    value: "params.policy.nasal.carryover_peak * params.policy.nasal.carryover_stage_2_fraction"
                tag: "'nasal_coupling'"
          - default: []
        tag: nasal_window
    citations:
      - Hawkins & Stevens 1985 (time-varying anticipatory and carryover nasalization)
      - Chen 1997 (nasalized vowel secondary cues)
      - Fujimura 1962
  dark_l_allophony:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme == 'L'
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when:
              predicate: is_coda
            value: params.policy.formant.dark_l_f2
          - default: "has(current.?params.F2) ? current.params.F2 : params.policy.formant.light_l_f2"
        tag: lateral_allophony
      - field: params.F3
        op: set
        dispatch:
          - when:
              predicate: is_coda
            value: params.policy.formant.dark_l_f3
          - default: "has(current.?params.F3) ? current.params.F3 : params.policy.formant.light_l_f3"
        tag: lateral_allophony
    citations:
      - Recasens 2012 (lateral allophones)
      - Sproat & Fujimura 1993 (syllable-final /l/ darkening)
  r_f3_lowering:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme == 'R'
    apply:
      - field: params.F3
        op: set
        dispatch:
          - when:
              predicate: is_coda
            value: params.policy.formant.r_f3_coda
          - default: params.policy.formant.r_f3_onset
        tag: rhoticity
    citations:
      - Espy-Wilson 2000 (acoustic modeling of American /r/)
      - Stevens 1998
  f1_stop_onset:
    kind: scalar
    select:
      stream: phone
      where: current.type == 'stop_release'
    apply:
      - field: params.F1
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.f1_release_labial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.f1_release_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.f1_release_velar
          - default: params.policy.formant.f1_release_default
        tag: stop_release_formant
    citations:
      - Stevens 1998 (stop consonant acoustics -- low F1 at release onset)
  burst_spectral_template:
    kind: scalar
    select:
      stream: phone
      where: current.type in ['stop_release', 'stop_aspiration']
    apply:
      - field: params.A2
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a2_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a2_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a2_velar
          - default: "has(current.?params.A2) ? current.params.A2 : 0"
        tag: burst_spectrum
      - field: params.A3
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a3_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a3_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a3_velar
          - default: "has(current.?params.A3) ? current.params.A3 : 0"
        tag: burst_spectrum
      - field: params.A4
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a4_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a4_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a4_velar
          - default: "has(current.?params.A4) ? current.params.A4 : 0"
        tag: burst_spectrum
      - field: params.A5
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a5_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a5_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a5_velar
          - default: "has(current.?params.A5) ? current.params.A5 : 0"
        tag: burst_spectrum
      - field: params.A6
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a6_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a6_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a6_velar
          - default: "has(current.?params.A6) ? current.params.A6 : 0"
        tag: burst_spectrum
      - field: params.A7
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a7_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a7_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a7_velar
          - default: "has(current.?params.A7) ? current.params.A7 : 0"
        tag: burst_spectrum
      - field: params.A8
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a8_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a8_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a8_velar
          - default: "has(current.?params.A8) ? current.params.A8 : 0"
        tag: burst_spectrum
      - field: params.A9
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a9_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a9_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a9_velar
          - default: "has(current.?params.A9) ? current.params.A9 : 0"
        tag: burst_spectrum
      - field: params.A10
        op: set
        dispatch:
          - when:
              predicate: is_bilabial
            value: params.policy.formant.burst_a10_bilabial
          - when:
              predicate: is_alveolar
            value: params.policy.formant.burst_a10_alveolar
          - when:
              predicate: is_velar
            value: params.policy.formant.burst_a10_velar
          - default: "has(current.?params.A10) ? current.params.A10 : 0"
        tag: burst_spectrum
    citations:
      - Blumstein & Stevens 1979 (burst spectral invariance)
      - Zue 1976
      - Klatt 1980
      - Shadle et al. 2023 (fricative HF spectra above 7 kHz)
      - Monson et al. 2014 (perceptual significance of HF energy)
  weak_stop_release_parallel_attenuation:
    kind: scalar
    select:
      stream: phone
      where: "current.type == 'stop_release' && has(current.weak) && current.weak == true"
    apply:
      - field: params.A1
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A2
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A3
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A4
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A5
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A6
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A7
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A8
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A9
        op: add
        value: -18
        tag: weak_release_spectrum
      - field: params.A10
        op: add
        value: -18
        tag: weak_release_spectrum
    citations:
      - Allen et al. 1987 Table C-1
      - Stevens 1998 Ch.8
      - "Engineering estimate: weak coda releases attenuate the parallel burst template as well as AF"
  weak_final_voiced_stop_closure_attenuation:
    kind: scalar
    select:
      stream: phone
      where: "current.type == 'stop_closure' && has(current.voiced) && current.voiced == true"
    define:
      n: next
      before_weak_release: "n != null && n.type == 'stop_release' && has(n.weak) && n.weak == true"
    constraint: before_weak_release
    apply:
      - field: params.AV
        op: add
        value: -24
        tag: weak_coda_devoicing
      - field: params.AVS
        op: set
        value: -70
        tag: weak_coda_devoicing
    citations:
      - Crystal & House 1988
      - Miller 1998
      - "Engineering estimate: weak final voiced-stop closures carry reduced voicing to avoid a full voiced tract tail"
  vcv_coarticulation:
    kind: scalar
    select:
      stream: phone
      where: "current.type in ['stop_closure', 'nasal', 'liquid', 'glide'] && (prev != null ? prev.type == 'vowel' : false)"
    define:
      "n": next
      next_vowel: >-
        n == null ? null : (n.type == 'vowel' ? n : (has(n.type) ? (n.type in ['stop_release', 'stop_aspiration'] ?
        ahead(current, 2) : null) : null))
      has_flanking: "next_vowel != null ? (next_vowel.type == 'vowel' ? true : false) : false"
      prev_f1: "has(prev.?params.F1) ? prev.params.F1 : params.policy.formant.default_f1_fallback"
      next_f1: "has_flanking ? (has(next_vowel.?params.F1) ? next_vowel.params.F1 : params.policy.formant.default_f1_fallback) : params.policy.formant.default_f1_fallback"
      flanking_avg_f1: "has_flanking ? (prev_f1 + next_f1) / 2 : 0"
      cur_f1: "has(current.?params.F1) ? current.params.F1 : params.policy.formant.default_f1_fallback"
      prev_f2: "has(prev.?params.F2) ? prev.params.F2 : params.policy.formant.default_f2_fallback"
      next_f2: "has_flanking ? (has(next_vowel.?params.F2) ? next_vowel.params.F2 : params.policy.formant.default_f2_fallback) : params.policy.formant.default_f2_fallback"
      flanking_avg_f2: "has_flanking ? (prev_f2 + next_f2) / 2 : 0"
      cur_f2: "has(current.?params.F2) ? current.params.F2 : params.policy.formant.default_f2_fallback"
      prev_f3: "has(prev.?params.F3) ? prev.params.F3 : params.policy.formant.default_f3_fallback"
      next_f3: "has_flanking ? (has(next_vowel.?params.F3) ? next_vowel.params.F3 : params.policy.formant.default_f3_fallback) : params.policy.formant.default_f3_fallback"
      flanking_avg_f3: "has_flanking ? (prev_f3 + next_f3) / 2 : 0"
      cur_f3: "has(current.?params.F3) ? current.params.F3 : params.policy.formant.default_f3_fallback"
      dac_value: "has(current.dac) ? current.dac : 1"
      resistance: "dac_value / 3.0"
      dac_weight: "params.policy.formant.vcv_coarticulation_rate * (1.0 - resistance)"
    constraint: has_flanking
    apply:
      - field: params.F1
        op: set
        value: "cur_f1 + (flanking_avg_f1 - cur_f1) * dac_weight"
        tag: coarticulation
      - field: params.F2
        op: set
        value: "cur_f2 + (flanking_avg_f2 - cur_f2) * dac_weight"
        tag: coarticulation
      - field: params.F3
        op: set
        value: "cur_f3 + (flanking_avg_f3 - cur_f3) * dac_weight"
        tag: coarticulation
    citations:
      - Recasens 1997 (DAC model -- coarticulation resistance inversely proportional to tongue-dorsum constraint)
      - Ohman 1966 (VCV coarticulation model -- F1 avg 62 Hz, F2 avg 280 Hz, F3 avg 153 Hz by transconsonantal vowel; same weight, magnitude differs by intrinsic formant range)
      - Allen et al. 1987
  vowel_reduction:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.type == 'vowel' && has(current.params) && has(current.?params.F1) && (has(current.stress) ?
        current.stress == 0 : false)
    define:
      reduction_rate: >-
        (current.phoneme in ['IY', 'IY0', 'IY1'] ||
        ((has(current.front) ? current.front == true : false) && (has(current.hi) ? current.hi == true : false))) ?
        params.policy.formant.vowel_reduction_rate_high_front :
        params.policy.formant.vowel_reduction_rate
    apply:
      - field: params.F1
        op: set
        value: >-
          current.params.F1 + (params.policy.formant.vowel_reduction_schwa_f1 - current.params.F1) *
          reduction_rate
        tag: vowel_reduction
      - field: params.F2
        op: set
        value: >-
          current.params.F2 + (params.policy.formant.vowel_reduction_schwa_f2 - current.params.F2) *
          reduction_rate
        tag: vowel_reduction
    citations:
      - Allen et al. 1987
      - Klatt 1976
      - Peterson & Barney 1952 (schwa formants)
      - Stevens 1998 (reduced vowels depend strongly on segmental context)
      - Miller 1998 (reduced vowels can remain [I]-like instead of fully schwa-like)
  vowel_rate_undershoot:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.type == 'vowel' && has(current.params) && has(current.?params.F1)
    constraint: params.policy.formant.rate_undershoot_factor > 0
    apply:
      - field: params.F1
        op: set
        value: >-
          current.params.F1 + (params.policy.formant.vowel_reduction_schwa_f1 - current.params.F1) *
          params.policy.formant.rate_undershoot_factor
        tag: rate_undershoot
      - field: params.F2
        op: set
        value: >-
          current.params.F2 + (params.policy.formant.vowel_reduction_schwa_f2 - current.params.F2) *
          params.policy.formant.rate_undershoot_factor
        tag: rate_undershoot
    citations:
      - Lindblom 1963 (articulatory undershoot — vowels centralize toward schwa at fast rates)
      - Moon & Lindblom 1994 (rate-dependent formant undershoot)
  schwa_coronal_fronting:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.phoneme in ['AH', 'AH0'] && current.type == 'vowel' &&
        (has(current.stress) ? current.stress == 0 : true)
    constraint:
      predicate: one_coronal
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when:
              predicate: both_coronal
            value: >-
              current.params.F2 + (params.policy.formant.schwa_coronal_f2_target - current.params.F2) *
              params.policy.formant.schwa_coronal_fronting_rate
          - default: >-
              current.params.F2 + (params.policy.formant.schwa_coronal_f2_target - current.params.F2) *
              params.policy.formant.schwa_coronal_fronting_rate * 0.5
        tag: coronal_fronting
    citations:
      - Miller 1998 (schwa fronting to [ɨ] in coronal environments, 67-83% accuracy, both-side coronal strongest predictor)
  uw_coronal_fronting:
    kind: scalar
    select:
      stream: phone
      where: current.phoneme in ['UW1', 'UW0', 'UW'] && current.type == 'vowel'
    constraint:
      predicate: one_coronal
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when:
              predicate: both_coronal
            value: >-
              current.params.F2 + (params.policy.formant.uw_coronal_f2_target - current.params.F2) *
              params.policy.formant.uw_coronal_fronting_rate
          - default: >-
              current.params.F2 + (params.policy.formant.uw_coronal_f2_target - current.params.F2) *
              params.policy.formant.uw_coronal_fronting_rate * 0.5
        tag: coronal_fronting
    citations:
      - Miller 1998 (/u/ fronting in coronal environments, 86% accuracy with coronals on both sides)
      - Harrington et al. 2011 (tongue advancement, not lip unrounding, drives /u/ fronting)
  transition_override:
    kind: scalar
    select:
      stream: phone
      where: "true"
    apply:
      - field: transition_ms
        op: set
        value: "current.type in ['stop_closure', 'stop_release', 'stop_aspiration'] ? params.policy.formant.transition_ms_stop : current.type == 'fricative' ? params.policy.formant.transition_ms_fricative : params.policy.formant.transition_ms_default"
        tag: transition
    citations:
      - "Stevens & House 1956"
      - "Hertz 1991 (per-class transition timing in synthesis)"
  sw_explicit_override:
    kind: scalar
    select:
      stream: phone
      where: has(current.inventorySW)
    apply:
      - field: params.SW
        op: set
        value: current.inventorySW
        tag: branch_switch
    citations:
      - Klatt 1980
      - Allen et al. 1987
  sw_default_assignment:
    kind: scalar
    select:
      stream: phone
      where: "!has(current.inventorySW)"
    apply:
      - field: params.SW
        op: set
        value: "current.type in ['fricative', 'affricate', 'stop_release', 'stop_aspiration'] ? 1 : 0"
        tag: branch_switch
    citations:
      - Klatt 1980
