version: v1
rules:
  remap_stops_to_closures:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme in ['P', 'T', 'K', 'B', 'D', 'G']
    define:
      cl_key: current.phoneme + "_CL"
      cl_target: target(cl_key)
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: cl_key
          type: cl_target.type
          duration: cl_target.duration
          inherentDuration: cl_target.inherentDuration
          target: cl_target
          voiceless: "has(cl_target.voiceless) ? cl_target.voiceless : null"
          voiced: "has(cl_target.voiced) ? cl_target.voiced : null"
          bilabial: "has(cl_target.bilabial) ? cl_target.bilabial : null"
          alveolar: "has(cl_target.alveolar) ? cl_target.alveolar : null"
          velar: "has(cl_target.velar) ? cl_target.velar : null"
          inventorySW: "has(cl_target.inventorySW) ? cl_target.inventorySW : 0"
    citations:
      - Klatt 1980
  expand_affricates_with_closure:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme in ['CH', 'JH']
    define:
      cl_key: current.phoneme + "_CL"
      cl_target: target(cl_key)
      fr_target: target(current.phoneme)
      fr_duration: max([params.policy.duration.affricate_frication_min_ms, current.duration - cl_target.duration])
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: cl_key
          type: cl_target.type
          duration: cl_target.duration
          inherentDuration: cl_target.inherentDuration
          target: cl_target
          voiceless: "has(cl_target.voiceless) ? cl_target.voiceless : null"
          voiced: "has(cl_target.voiced) ? cl_target.voiced : null"
          postalveolar: "has(cl_target.postalveolar) ? cl_target.postalveolar : null"
          inventorySW: "has(cl_target.inventorySW) ? cl_target.inventorySW : 0"
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: current.phoneme
          type: fr_target.type
          duration: fr_duration
          inherentDuration: fr_target.inherentDuration
          target: fr_target
          voiceless: "has(fr_target.voiceless) ? fr_target.voiceless : null"
          voiced: "has(fr_target.voiced) ? fr_target.voiced : null"
          postalveolar: "has(fr_target.postalveolar) ? fr_target.postalveolar : null"
          inventorySW: "has(fr_target.inventorySW) ? fr_target.inventorySW : 0"
    citations:
      - Klatt 1980
      - Stevens 1998 (affricate stop-gap + frication cue sequence)
  expand_diphthongs:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme in ['EY', 'AY', 'OW', 'OY', 'AW']
    define:
      stress_suffix: "has(current.stress) && current.stress == 1 ? \"1\" : \"0\""
      comp1_base: >-
        current.phoneme == "EY" ? "EH" : current.phoneme == "AY" ? "AA" : current.phoneme == "OW" ? "AO" :
        current.phoneme == "OY" ? "AO" : current.phoneme == "AW" ? "AE" : "SIL"
      comp2_base: >-
        current.phoneme == "EY" ? "Y" : current.phoneme == "AY" ? "Y" : current.phoneme == "OW" ? "W" :
        current.phoneme == "OY" ? "Y" : current.phoneme == "AW" ? "W" : "SIL"
      comp1_key: comp1_base + stress_suffix
      # The offglide remains part of the same diphthong but should not
      # surface as a second primary-stressed vowel target.
      comp2_key: comp2_base
      comp1_target: target(comp1_key)
      comp2_target: target(comp2_key)
      total_dur: current.duration
      comp1_duration: total_dur * params.policy.duration.diphthong_nucleus_share
      comp2_duration: total_dur * (1 - params.policy.duration.diphthong_nucleus_share)
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - phoneme: comp1_key
          target: comp1_target
          duration: comp1_duration
          inherentDuration: comp1_target.inherentDuration
          type: comp1_target.type
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
        - phoneme: comp2_key
          target: comp2_target
          duration: comp2_duration
          inherentDuration: comp2_target.inherentDuration
          type: comp2_target.type
          # The offglide is part of the same lexical diphthong but should not
          # introduce a second stressed vowel nucleus in the expanded track.
          stress: "0"
          word: "has(current.word) ? current.word : null"
    citations:
      - Standard diphthong decomposition for formant synthesis (nucleus + offglide)
  expand_rhotic_vowels:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme == 'ER'
    define:
      stress_suffix: "has(current.stress) && current.stress == 1 ? \"1\" : \"0\""
      er_key: current.phoneme + stress_suffix
      er_target: target(er_key)
      r_target: target("R")
      total_dur: current.duration
      target_dur_sum: er_target.duration + r_target.duration
      er_share_base: "target_dur_sum > 0 ? er_target.duration / target_dur_sum : params.policy.duration.rhotic_nucleus_min_share"
      er_share: "max([params.policy.duration.rhotic_nucleus_min_share, er_share_base])"
      er_duration: "total_dur * er_share"
      r_duration: "max([0, total_dur - er_duration])"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - phoneme: current.phoneme
          target: er_target
          duration: er_duration
          inherentDuration: er_duration
          type: er_target.type
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          rhotic: "has(er_target.rhotic) ? er_target.rhotic : true"
        - phoneme: r_target.phoneme
          target: r_target
          duration: r_duration
          inherentDuration: r_duration
          durationFloor: params.policy.duration.liquid_rhotic_tail_floor_ms
          type: r_target.type
          stress: "0"
          word: "has(current.word) ? current.word : null"
          rhotic: "has(r_target.rhotic) ? r_target.rhotic : true"
          voiced: "has(r_target.voiced) ? r_target.voiced : null"
    citations:
      - Allen et al. 1987 (r-colored vowels distinguished from plain vowels in the phoneme inventory)
      - Allen et al. 1987 Table C-5 (ER uses vowel-internal timing rather than a dominant liquid tail)
      - Espy-Wilson et al. 2000 (American English /r/ requires an explicit low-F3 rhotic constriction)
      - Stevens 1998 §9.3 (liquid formant movement is transitional; keep the rhotic tail subordinate to the nucleus)
  insert_mapped_voiceless_release_and_aspiration:
    kind: structural
    select: { relation: Segment, where: "current.phoneme in ['P_CL', 'T_CL', 'K_CL'] && (next != null ? !(next.type in ['stop', 'stop_closure', 'stop_release', 'stop_aspiration']) : false)" }
    define:
      rel: maps.phoneme_release_map[current.phoneme]
      asp: maps.phoneme_aspiration_map[current.phoneme]
      next_token: next
      prev_token: prev
      word_initial: "prev_token == null ? true : (has(prev_token.word) && has(current.word) ? prev_token.word != current.word : true)"
      weak: "next_token != null ? next_token.phoneme == \"SIL\" : false"
      rel_target: target(rel)
      asp_target: target(asp)
      place_key: maps.phoneme_release_place_map[current.phoneme]
      vot_target: "word_initial ? params.policy.duration.vot_target_ms.initial[place_key] : params.policy.duration.vot_target_ms.noninitial[place_key]"
      vot_sum: rel_target.duration + asp_target.duration
      rel_share: "vot_sum > 0 ? rel_target.duration / vot_sum : params.policy.duration.vot_split_fallback_share"
      rel_duration_base: vot_target * rel_share
      asp_duration_base: vot_target - rel_duration_base
      weak_rel_params: "{'AF': max([0, rel_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.AH - params.policy.duration.weak_release_amplitude_reduction_db])}"
      weak_asp_params: "{'AF': max([0, asp_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, asp_target.AH - params.policy.duration.weak_release_amplitude_reduction_db])}"
      rel_params: "weak ? merge(rel_target, weak_rel_params) : rel_target"
      asp_params: "weak ? merge(asp_target, weak_asp_params) : asp_target"
      rel_duration: "weak ? max([params.policy.duration.weak_release_min_ms, rel_duration_base * params.policy.duration.weak_release_scale]) : rel_duration_base"
      asp_duration: "weak ? max([params.policy.duration.weak_release_min_ms, asp_duration_base * params.policy.duration.weak_release_scale]) : asp_duration_base"
      inventory_sw_rel: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
      inventory_sw_asp: "has(asp_target.inventorySW) ? asp_target.inventorySW : (has(asp_params.SW) ? asp_params.SW : 0)"
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - segment:
            target: rel_target
            phoneme: rel
            copy_from: current
            copy_fields: [stress, word]
            fields:
              weak: weak
              durationFloor: 0
              target: rel_params
              duration: rel_duration
              inherentDuration: rel_duration
              inventorySW: inventory_sw_rel
        - segment:
            target: asp_target
            phoneme: asp
            copy_from: current
            copy_fields: [stress, word]
            fields:
              weak: weak
              durationFloor: 0
              target: asp_params
              duration: asp_duration
              inherentDuration: asp_duration
              inventorySW: inventory_sw_asp
        - copy_from: next
    citations: ["Lisker & Abramson 1964 (English sentence VOT defaults: initial /p/=28, /t/=39, /k/=43 ms; non-initial /p/=34, /t/=37, /k/=49 ms)", Stevens 1998, Allen et al. 1987]
  insert_mapped_voiceless_release_and_aspiration_final:
    kind: structural
    select: { relation: Segment, where: "current.phoneme in ['P_CL', 'T_CL', 'K_CL'] && next == null" }
    define:
      rel: maps.phoneme_release_map[current.phoneme]
      asp: maps.phoneme_aspiration_map[current.phoneme]
      prev_token: prev
      word_initial: "prev_token == null ? true : (has(prev_token.word) && has(current.word) ? prev_token.word != current.word : true)"
      weak: "true"
      rel_target: target(rel)
      asp_target: target(asp)
      place_key: maps.phoneme_release_place_map[current.phoneme]
      vot_target: "word_initial ? params.policy.duration.vot_target_ms.initial[place_key] : params.policy.duration.vot_target_ms.noninitial[place_key]"
      vot_sum: rel_target.duration + asp_target.duration
      rel_share: "vot_sum > 0 ? rel_target.duration / vot_sum : params.policy.duration.vot_split_fallback_share"
      rel_duration_base: vot_target * rel_share
      asp_duration_base: vot_target - rel_duration_base
      weak_rel_params: "{'AF': max([0, rel_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.AH - params.policy.duration.weak_release_amplitude_reduction_db])}"
      weak_asp_params: "{'AF': max([0, asp_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, asp_target.AH - params.policy.duration.weak_release_amplitude_reduction_db])}"
      rel_params: "merge(rel_target, weak_rel_params)"
      asp_params: "merge(asp_target, weak_asp_params)"
      rel_duration: max([params.policy.duration.weak_release_min_ms, rel_duration_base * params.policy.duration.weak_release_scale])
      asp_duration: max([params.policy.duration.weak_release_min_ms, asp_duration_base * params.policy.duration.weak_release_scale])
      inventory_sw_rel: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
      inventory_sw_asp: "has(asp_target.inventorySW) ? asp_target.inventorySW : (has(asp_params.SW) ? asp_params.SW : 0)"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
        - segment:
            target: rel_target
            phoneme: rel
            copy_from: current
            copy_fields: [stress, word]
            fields:
              weak: weak
              durationFloor: 0
              target: rel_params
              duration: rel_duration
              inherentDuration: rel_duration
              inventorySW: inventory_sw_rel
        - segment:
            target: asp_target
            phoneme: asp
            copy_from: current
            copy_fields: [stress, word]
            fields:
              weak: weak
              durationFloor: 0
              target: asp_params
              duration: asp_duration
              inherentDuration: asp_duration
              inventorySW: inventory_sw_asp
    citations: ["Lisker & Abramson 1964 (utterance-final voiceless stops receive weak release; connected-speech VOT defaults)", Stevens 1998]
  insert_mapped_voiced_release:
    kind: structural
    select: { relation: Segment, where: "current.phoneme in ['B_CL', 'D_CL', 'G_CL'] && (next != null ? !(next.type in ['stop', 'stop_closure', 'stop_release', 'stop_aspiration']) : false)" }
    define:
      rel: maps.phoneme_release_map[current.phoneme]
      next_token: next
      weak: "next_token != null ? next_token.phoneme == \"SIL\" : false"
      rel_target: target(rel)
      weak_rel_params: "{'AF': max([0, rel_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.AH - params.policy.duration.weak_release_amplitude_reduction_db])}"
      rel_params: "weak ? merge(rel_target, weak_rel_params) : rel_target"
      rel_duration: "weak ? max([params.policy.duration.weak_release_min_ms, rel_target.duration * params.policy.duration.weak_release_scale]) : rel_target.duration"
      inventory_sw_rel: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - segment:
            target: rel_target
            phoneme: rel
            copy_from: current
            copy_fields: [stress, word]
            fields:
              weak: weak
              durationFloor: 0
              target: rel_params
              duration: rel_duration
              inherentDuration: rel_duration
              inventorySW: inventory_sw_rel
        - copy_from: next
    citations: ["Lisker & Abramson 1964 (English voiced stop short-lag mode for /b d g/ in initial position)", Stevens 1998, Allen et al. 1987]
  insert_mapped_voiced_release_final:
    kind: structural
    select: { relation: Segment, where: "current.phoneme in ['B_CL', 'D_CL', 'G_CL'] && next == null" }
    define:
      rel: maps.phoneme_release_map[current.phoneme]
      weak: "true"
      rel_target: target(rel)
      weak_rel_params: "{'AF': max([0, rel_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.AH - params.policy.duration.weak_release_amplitude_reduction_db])}"
      rel_params: "merge(rel_target, weak_rel_params)"
      rel_duration: "max([params.policy.duration.weak_release_min_ms, rel_target.duration * params.policy.duration.weak_release_scale])"
      inventory_sw_rel: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
        - segment:
            target: rel_target
            phoneme: rel
            copy_from: current
            copy_fields: [stress, word]
            fields:
              weak: weak
              durationFloor: 0
              target: rel_params
              duration: rel_duration
              inherentDuration: rel_duration
              inventorySW: inventory_sw_rel
    citations: ["Lisker & Abramson 1964 (utterance-final voiced stops receive weak release)", Stevens 1998]
