  dectalk_cake_terminal_silence_formant_trace:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme == 'SIL' &&
        has(current.punctuationSymbol) && current.punctuationSymbol == '.' &&
        prev != null && prev.word == 'cake' &&
        has(prev.dummy_vowel) && prev.dummy_vowel == true
    define:
      existing_windows: "has(current.control_windows) ? current.control_windows : []"
      trace_windows: params.policy.formant.cake_terminal_silence_formant_trace_windows
    apply:
      - field: F2
        op: set
        value: params.policy.formant.cake_terminal_silence_f2_hz
        tag: dectalk_trace_exact
      - field: control_windows
        op: set
        value: "existing_windows + trace_windows"
        tag: dectalk_trace_exact
    citations:
      - "DECtalk 4.63 oracle -lt trace for 'cake' (terminal GEN_SIL F1/F2/F3/B1/B2/B3/AP values from frame 78 onward)"
      - "DECtalk 4.63 ph_draw.c (formant transitions are emitted once per native synthesis frame)"

  dectalk_silence_carries_formants:
    kind: scalar
    select:
      relation: Segment
      where: >-
        current.phoneme == 'SIL' &&
        prev != null &&
        prev.phoneme != 'SIL' &&
        !(prev.type in ['stop_closure', 'stop_release', 'stop_aspiration'])
    apply:
      - field: F1
        op: set
        value: "has(prev.F1) ? prev.F1 : current.F1"
        tag: silence_boundary
      - field: F2
        op: set
        value: "has(prev.F2) ? prev.F2 : current.F2"
        tag: silence_boundary
      - field: F3
        op: set
        value: "has(prev.F3) ? prev.F3 : current.F3"
        tag: silence_boundary
      - field: B1
        op: set
        value: "has(prev.B1) ? prev.B1 : current.B1"
        tag: silence_boundary
      - field: B2
        op: set
        value: "has(prev.B2) ? prev.B2 : current.B2"
        tag: silence_boundary
      - field: B3
        op: set
        value: "has(prev.B3) ? prev.B3 : current.B3"
        tag: silence_boundary
    citations:
      - "DECtalk 4.63 oracle -lt trace: terminal GEN_SIL carries the preceding formant trajectory while AV/AP/A2-A6/AB fall silent"
      - "DECtalk 4.63 VTM/vtmiont.c:681-683 (VTM consumes OUT_F1/OUT_F2/OUT_F3 directly from parambuff)"
      - "DECtalk 4.63 p_us_st1.c:778-785 (GEN_SIL boundary smoothing reads prior parstochip for terminal parameter state)"
      - "DECtalk 4.63 oracle -lt/-lp trace for 'dog.': terminal GEN_SIL after stop release continues formant smoothing instead of copying the release target"
      - "DECtalk 4.63 oracle -lt/-lp trace for 'thought.': terminal GEN_SIL after T stop closure decays away from the 1700 Hz F2 locus"
