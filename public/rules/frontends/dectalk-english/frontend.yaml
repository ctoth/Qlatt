version: v13-cel
inventory_path: /rules/frontends/dectalk-english/inventory.yaml
lts_path: /rules/frontends/dectalk-english/lts-rules.yaml
# DECtalk is dictionary-first with LTS fallback (DECtalk 4.63 ls_task.c:697:
# main dictionary search precedes the LTS rule engine; rules run only on miss).
# This 13,272-entry dictionary was converted from DECtalk's Dic_us.txt to the
# same flat word->ARPABET JSON the CMU loader consumes (see scripts/build-dectalk-dict.ts).
dictionary_path: /dectalk-dictionary.json
# DECtalk uses its own source contour so shared qlatt-english LF policy
# (source_mode: 1) cannot override it. The default remains the impulse fallback
# while KLGLOTT88 mode 3 is blocked by silent worklet voice output.
source_contour_path: /rules/frontends/dectalk-english/source-contour.yaml
# Per-frontend text-normalization policy (DATA). Selects this frontend's own
# normalization tables + pipeline instead of the shared qlatt-english defaults.
# The dectalk pipeline adds a year-reading step ("1984" -> "nineteen eighty
# four") that the shared pipeline omits; the predicate and speaking form are
# declared as data in normalization-pipeline.yaml. A frontend that declares no
# `normalization` block keeps the qlatt-english default normalization.
# Citation: DECtalk 4.63 ls_util.c:598-622 (is_year), l_us_pr1.c:367-398.
normalization:
  tables_path: /rules/frontends/dectalk-english/normalization-tables.yaml
  pipeline_path: /rules/frontends/dectalk-english/normalization-pipeline.yaml
include:
  - pipeline.yaml
  - phases/postlexical.yaml
  - phases/structural.yaml
  - phases/annotation.yaml
  - phases/duration.yaml
  - phases/formant.yaml
  - phases/prosody.yaml
# Declarative voice registry. Each entry names a voice YAML under `dir`; a
# caller selects one by name via the textToKlattTrack `speaker` option (a
# string voice name). The selected voice's parameters populate the speaker
# policy (parameters.policy.speaker) and the F0 speaker-scaling fields. When
# no voice is selected, `default` is used — keeping Paul byte-identical to the
# legacy inline speaker policy below.
# Citation: DECtalk 4.63 ph_vset.c (speaker-dependent parameter tables).
speakers:
  dir: /rules/frontends/dectalk-english/speakers
  default: paul
  # Declarative speaker-field -> frame-param bindings. Each name in this list is
  # BOTH the voice-YAML field and the same-named per-frame Klatt param; the
  # selected voice's value is stamped (absolute set) onto every frame's params,
  # overriding the inventory base_params default. This is the generic mechanism
  # that lets a voice's higher-formant timbre shape audio (not just pitch).
  #
  # Scope = [F4, B4, F5, B5]. F5/B5 ARE genuinely per-voice in DECtalk: the
  # P_us_vdf1.h 8 kHz voice structs set Harry 3850/180, Kit 4700/600, Rita
  # 4800/700, Wendy 4800/600, Dennis 3800/280 — a real, distinct 5th cascade
  # resonator. The remaining voices (Paul/Betty/Frank/Ursula, and Chris's F5)
  # store the ZAPF/ZAPB sentinel (= 6000 in the non-MSDOS 8 kHz build,
  # ph_defs.h:726) meaning "no 5th cascade resonator." Cascade formant index 5
  # has freqRange [3500,6000]; a resonator at 6000 Hz with 6000 Hz bandwidth is
  # so broad it is effectively flat — a faithful render of the disabled formant.
  # NOTE: this deliberately moves Paul off the old inventory default F5=4500/
  # B5=600 (a spurious active 5th formant Paul should not have) to the ZAPF
  # sentinel — Paul is no longer byte-identical here, BY DESIGN: it now matches
  # the real DECtalk Paul, which has no active F5. (HS head-size F4/F5 scaling,
  # ph_vset.c:712, for non-100-HS voices is a separate follow-up; F5 stamped raw
  # for now.) The TS is a generic copy loop with no per-voice/per-field branches;
  # adding fields here is a pure data edit.
  # Citation: DECtalk 4.63 ph_vset.c (F4->r4cb, B4->r4cc, F5->r5cb, B5->r5cc);
  # P_us_vdf1.h 8 kHz voice structs; ph_defs.h:726 ZAPF/ZAPB=6000.
  speaker_frame_params:
    - F4
    - B4
    - F5
    - B5
    # Per-voice breathiness BR -> frame param `breathiness` -> KLGLOTT88 aturb
    # (DECtalk ph_vset.c:786 aturb=BR). Paul BR=0 (no breath); Betty 25, Kit 47,
    # Wendy 55, Frank/Dennis 30, Rita 36 -> audibly breathy voicing.
    - breathiness
  # Declarative per-voice GAIN offsets. Each entry maps a voice-YAML gain field
  # to a per-frame Klatt dB parameter. The applied value is a PAUL-RELATIVE
  # additive dB offset: frame[param] += selectedVoice[gain] - defaultVoice[gain].
  # The default voice (Paul, `default:` above) yields offset 0 for every entry,
  # so Paul stays byte-identical; other voices get their differential spectral
  # balance (vocal CHARACTER, not just pitch). The reference is the default
  # voice's own values (data, not a hardcoded constant). The TS is a generic
  # offset loop with no per-voice or per-gain branches.
  #
  # Why additive-onto-the-frame-dB-param and not a new semantics term: every
  # gain in klatt80-baseline/semantics.yaml is dbToLinear(GO + <frameDbParam>
  # + ...). Adding the offset to <frameDbParam> is identical to adding a term
  # inside the formula, but touches NO shared semantics (other frontends declare
  # no offsets -> unaffected).
  #
  # Mapping (DECtalk ph_vset.c chip register -> Qlatt frame dB param):
  #   GV -> azgain (voicing) -> AV (voiceGain) and AVS (parallel voicing avsGain)
  #   GH -> apgain (aspiration) -> AH (aspGain)
  #   GF -> afgain (frication)  -> AF (fricGain / fricGainScaled)
  #   LO -> r1ca, G4 -> r2ca, G3 -> r3ca, G2 -> r4ca, G1 -> r5ca
  #         (parallel resonator gains) -> parallel formant amplitudes A1..A5
  # GN (rnpgain / nasal) is intentionally OMITTED: the Qlatt nasal parallel gain
  # (anLinear) derives from nasalMurmurStrength, not a per-frame AN dB param, so
  # GN has no additive destination on this path. Documented; not forced.
  # Citation: DECtalk 4.63 ph_vset.c (GV->azgain 808/810, GF->afgain 816,
  # GH->apgain 818, G1-G4->r5ca/r4ca/r3ca/r2ca 765-772, LO->r1ca 775).
  speaker_gain_offsets:
    - { gain: GV, param: AV }
    - { gain: GV, param: AVS }
    - { gain: GH, param: AH }
    - { gain: GF, param: AF }
    - { gain: LO, param: A1 }
    - { gain: G4, param: A2 }
    - { gain: G3, param: A3 }
    - { gain: G2, param: A4 }
    - { gain: G1, param: A5 }
  voices:
    - paul
    - harry
    - frank
    - dennis
    - betty
    - ursula
    - wendy
    - rita
    - kit
    - chris
f0_model:
  type: layered_additive
  # DECtalk's clause loop advances in 6.4 ms synthesis/control frames.
  # Citation: DECtalk 4.63 ph_claus.c ("For each 6.4 msec frame of current clause")
  frame_period_sec: 0.0064
  # The VTM emits each completed control cell as one 71-sample packet at
  # 11,025 Hz. Keep this packet clock separate from the nominal controller
  # clock so long clauses do not advance to the next cell before DECtalk does.
  # Citation: DECtalk 4.63 VTM/vtmiont.c delaypars packet loop.
  output_frame_period_sec: 0.006439909297052154
  citations:
    - "Fujisaki (command-response model: additive phrase + accent layers)"
    - "Klatt 1982 (hat-pattern: baseline + hat + stress + segmental)"
    - "Rabiner 1968 (three-component: archetypal + stress + consonant)"
  filter:
    type: lowpass_2pole_coefficient
    # DECtalk 4.63 Ph_drwt02.c filter_commands() cascades two first-order poles
    # using the speaker's native F0 smoothing coefficient, normalized to [0, 1].
    alpha_param: policy.speaker.f0_lp_filter_alpha.value
    default_alpha: 0.128173828125
  layers:
    baseline:
      type: profile
    # English DECtalk emits hat commands as STEP commands. The adjacent GLIDE
    # branch in ph_inton1.c is under GERMAN; this frontend targets US English.
    hat:
      type: persistent
    stress:
      type: impulse
      decay: step_plus_ramp
      # DECtalk 4.63 Ph_drwt02.c US non-reading IMPULSE path: initialize
      # tarimp=2*f0command, subtract f0command>>2 before the first filtered
      # frame, then restore and halve that correction while holding the step
      # for the command's duration.
    boundary:
      type: impulse
      decay: halving
      # DECtalk 4.63 Ph_drwt02.c: boundary impulse decay = value / 4 per frame.
      initial_decay_divisor: 4
      termination_threshold: 0.01
    # Question terminal-rise GLIDE layer. The yes/no question rise (+451) is
    # rendered here as a GLIDE that ramps to the target over the final vowel and
    # HOLDS, producing a smooth, sustained terminal RISE into the '?' boundary
    # (DECtalk's GLIDE-form question gesture, ph_inton1.c:1635) rather than a
    # decaying impulse spike. The earlier small dip (-151) stays an impulse on
    # the `boundary` layer above. Reset to 0 at the next SIL keeps it clause-local.
    question_glide:
      type: glide
    # Separate post-command-filter segmental path. Each command carries the
    # active allophone target, exact controller duration, and source flags
    # [voiceless, plosive, stressed]. The Rust kernel reproduces pht0draw() and
    # filter_seg_commands() in signed Q14 arithmetic.
    segmental:
      type: dectalk_segmental
  combine: sum
  # Speaker scaling: converts internal Hz*10 units to final Hz using the
  # DECtalk formula:
  #   f0prime = f0minimum + frac4mul(f0prime - 1300, f0scalefac)
  #   Hz = f0prime / 10
  # The minimum_param and range_param fields reference parameters.policy.speaker.
  # Citation: DECtalk 4.63 Ph_drwt02.c (speaker-dependent F0 scaling)
  speaker_scale:
    minimum_param: f0_minimum
    range_param: f0_scale_factor
    # Fixed reference pitch in the active male renderer.
    pivot: 1300
    # DECtalk frac4mul(x,y) = (x*y) >> 12 = (x*y) / 4096.
    divisor: 4096
    # DECtalk stores F0 internally as Hz*10; divide by 10 for output Hz.
    output_scale: 0.1
  # Final clamp on the rendered F0 contour.
  # Min: creaky-voice floor (Klatt 1990).
  # Max: upper extreme of the Peterson & Barney 1952 corpus.
  output_clamp:
    min_hz: 50
    max_hz: 500
parameters:
  policy:
    rate:
      undershoot_coefficient:
        value: 0.3
        citations:
          - Lindblom 1963 (articulatory undershoot at fast rates)
          - "Engineering estimate: 0.3 coefficient maps rate excess to undershoot factor"
      f0_range_exponent:
        value: 0.5
        citations:
          - Ladd 2008 Ch.9 (F0 range narrows at fast speaking rates; sqrt = exponent 0.5)
      transition_scale_exponent:
        value: 1.0
        citations:
          - Broad & Fertig 1970 (formant transition durations scale inversely with rate)
    duration:
      rate_scale: 1.0
      # Qlatt's frontend API already passes a normalized rate multiplier
      # (textToKlattTrack options.rate), not DECtalk's raw WPM control value.
      # Keep the reference at 1.0 so UI sliders and script callers behave as
      # documented; DECtalk WPM mapping belongs in an adapter layer instead.
      # Engineering boundary: multiplier normalization happens before frontend rules.
      rate_reference: 1.0
      vot_target_ms:
        p: 58
        t: 70
        k: 80
      voiceless_vot_base_ms: 60
      voiceless_vot_unstressed_ms: 7
      voiceless_vot_s_cluster_ms: 15
      voiceless_vot_sonorant_consonant_bonus_ms: 5
      # DECtalk 4.63 p_us_st1.c Special Rule 2:
      # PAP.pspesh defaults to 48 dB, rises to 50 dB before non-front targets,
      # drops by 3 dB when the following sonorant is unstressed, and rises by
      # 5 dB when the following sonorant is a consonant (/r, l, m, n, w, y/).
      voiceless_vot_aspiration_front_db: 48
      voiceless_vot_aspiration_nonfront_db: 50
      voiceless_vot_aspiration_unstressed_reduction_db: 3
      voiceless_vot_aspiration_sonorant_bonus_db: 5
      # DECtalk 4.63 p_us_st1.c: dummy-vowel release into silence reduces burst
      # amplitudes by 3 dB and aspiration by 6 dB.
      dummy_vowel_burst_reduction_db: 3
      dummy_vowel_aspiration_reduction_db: 6
      # DECtalk 4.63 ph_inton1.c Rule 9 inserts SCHWA2/IX for NF40MS
      # after a burst plosive before silence; ph_defs.h defines NF40MS=6 frames.
      dummy_vowel_duration_ms: 38
      # DECtalk 4.63 p_us_st1.c us_gettar() assigns TL=10 to FDUMMY_VOWEL.
      dummy_vowel_tilt_db: 10
      # DECtalk 4.63 p_us_st1.c: open-glottis interval widens B1/B2 by +250/+70 Hz.
      open_glottis_b1_widen_hz: 250
      open_glottis_b2_widen_hz: 70
      vot_split_fallback_share: 0.5
      weak_release_min_ms: 15
      weak_release_scale: 0.5
      weak_release_amplitude_reduction_db: 10
      stress_secondary_level: 2
      pause_comma_ms: 150
      # DECtalk 4.63 English sets nfperiod=94 frames in ph_claus.c, and
      # p_us_tim.c applies it directly at the neutral [:ra 180] rate.
      pause_period_ms: 602
      pause_clause_initial_ms: 32
      clause_final_lengthening_ms: 38
      clause_final_voiced_obstruent_ms: 19
      non_final_shortening: 0.70
      non_final_low_vowel_shortening: 0.50
      stress_secondary: 0.85
      stress_unstressed: 0.70
      medial_syllable_shortening: 0.85
      polysyllabic_shortening: 0.80
      non_initial_consonant_shortening: 0.85
      word_final_obstruent_lengthening_ms: 19
      word_final_voiceless_fricative_lengthening_ms: 46
      unstressed_syllabic_shortening: 0.70
      unstressed_consonant_shortening: 0.70
      unstressed_glide_shortening: 0.50
      # Rule 7 (p_us_tim.c:432-447) lowers durmin for unstressed non-obstruents:
      # no stress halves durmin, secondary stress subtracts durmin/4, then clamps
      # to at least 3 DECtalk frames.  At the 6.4 ms control cadence this is 19 ms.
      unstressed_no_stress_min_duration_factor: 0.50
      unstressed_secondary_min_duration_factor: 0.75
      unstressed_min_duration_floor_ms: 19
      emphasis_lengthening_ms: 19
      emphasis_syllabic_extra_ms: 38
      pre_voiceless_fricative_shortening: 0.80
      pre_voiceless_plosive_shortening: 0.70
      pre_voiced_obstruent_lengthening: 1.20
      pre_nasal_shortening: 0.85
      cluster_shortening: 0.70
      post_voiceless_plosive_lengthening_ms: 19
      phrase_initial_vowel_lengthening_ms: 19
      # --- chunk dt-11: syllable-keyed Rule 4 monosyllable branch + added
      #     numbered rules 10/11/19/20/23/24 and the Rule 9 [nt] cluster case.
      #     Multipliers from ph_defs.h N*PRCNT (FRAC_ONE=16384 == 1.0); additive
      #     ms from NF*MS frame counts at the established 6.33 ms/frame factor
      #     (NF20MS=3fr=19ms, NF40MS=6fr=38ms already in use above).
      # Rule 4 (p_us_tim.c:355-373) monosyllable: secondary N85PRCNT(=0.85),
      # unstressed N70PRCNT(=0.70); primary-stressed monosyllable unchanged
      # (the N90 arg is dead code -- mlsh1 runs only when FSTRESS_1 IS_MINUS).
      monosyllable_secondary_shortening: 0.85
      monosyllable_unstressed_shortening: 0.70
      # Rule 4 (p_us_tim.c:374-394) non-monosyllable, non-word-final segment:
      # N85PRCNT (FFIRSTSYL/FMEDIALSYL/FFINALSYL all 0.85 in this build).
      polysyllable_nonfinal_shortening: 0.85
      # Rule 7 (p_us_tim.c:452-456) unstressed word-MEDIAL syllabic: prcnt>>1
      # (== x0.5).  Non-medial unstressed syllabic stays N70PRCNT (0.70 above).
      unstressed_medial_syllabic_shortening: 0.50
      # Rule 10 (p_us_tim.c:647-655) first vowel of a two-vowel sequence: +NF30MS.
      two_vowel_first_lengthening_ms: 32
      # Rule 11 (p_us_tim.c:657-664) word-initial stressed vowel of a polysyllable:
      # +NF25MS.
      word_initial_stressed_vowel_lengthening_ms: 25
      # Rule 19 (p_us_tim.c:819-826) function-word-final unstressed monosyllable
      # TH (e.g. "with"): N60PRCNT.
      function_word_final_th_shortening: 0.60
      # Rule 20 (p_us_tim.c:828-836) unstressed monosyllable IY before a vowel
      # ("the/me/he"): N150PRCNT.
      the_iy_prevocalic_lengthening: 1.50
      # Rule 23 (p_us_tim.c:859-868) vowel before a /t/ flap DF ("writing" vs
      # "riding"): N35PRCNT.
      pre_df_flap_shortening: 0.35
      # Rule 24 (p_us_tim.c:882-889) segment before NG ("ing"): N60PRCNT.
      pre_ng_shortening: 0.60
      # Rule 17 (p_us_tim.c:790-805) utterances with nallotot < 10 add 30 to prcnt before
      # the durinh/durmin interpolation.  The YAML duration model applies this
      # as the equivalent fraction of the compressible duration range.
      short_phrase_prcnt_bonus: 30
      prcnt_denominator: 128
      # DECtalk 4.63 -lt trace for "cake" changes PH2 from K to EY at
      # 128.0 ms; Qlatt's integer-ms segment ledger reaches that boundary at
      # 123.2 ms. Transfer the unit-rounded 5 ms from EY to the initial K.
      cake_initial_k_ey_boundary_transfer_ms: 5
      # Rule 9 [nt] cluster (p_us_tim.c:628-639): word-internal /n/ before a
      # non-word-initial unstressed /t/ shortened to N10PRCNT.  The companion
      # N->D rewrite (L635) is allophonic and lives in the postlexical phase, not
      # here; only the durational shortening of the /n/ is modelled.
      nt_cluster_nasal_shortening: 0.10
      citations:
        - "DECtalk 4.63 p_us_tim.c"
        - "DECtalk 4.63 ph_defs.h (NF*MS constants)"
    f0:
      # All F0 policy values are in DECtalk internal units (Hz*10), matching
      # the values used by Ph_drwt02.c and ph_inton1.c.  Speaker scaling
      # converts these to final Hz via:
      #   Hz = (f0minimum + (val - 1300) * f0scalefac / 4096) / 10
      #
      # Baseline declination profile: Ph_drwt02.c f0basetypes[0][] (declarative).
      # 17 equidistant points spanning the utterance duration.
      baseline_declarative:
        - 1157
        - 1145
        - 1139
        - 1127
        - 1113
        - 1109
        - 1095
        - 1082
        - 1079
        - 1065
        - 1053
        - 1040
        - 1038
        - 1024
        - 980
        - 952
        - 863
      # Citation-mode hat rise (internal Hz*10 units).
      # Paul: HR=12, general ph_vset.c path -> size_hat_rise = HR*10 = 120.
      # Ph_inton2.c adds 70 when the stressed nucleus is in the first syllable.
      hat_rise_hz: 120
      hat_first_syllable_bonus_hz: 70
      # Retained for the classic reading-mode/reset paths below.
      short_phrase_hat_word_limit: 3
      short_phrase_hat_divisor: 4
      # Final fall below baseline at declarative sentence end (internal Hz*10).
      # Source: ph_inton1.c F0_FINAL_FALL = 180.
      final_fall_hz: 180
      # DECtalk frac4mul divisor used when speaker assertiveness scales f0fall.
      assertiveness_divisor: 4096
      # DECtalk 4.63 ph_inton1.c Rule 3:
      # hat fall starts dur - 180 ms from the stressed vowel onset, with a
      # minimum onset delay of 25 ms.
      hat_fall_early_offset_ms: 180
      hat_fall_min_delay_ms: 25
      # DECtalk 4.63 ph_inton1.c Rule 3:
      # if sonorants follow the nucleus, delay the fall by 90 ms instead.
      hat_fall_following_sonorant_delay_ms: 90
      # The citation-mode command clock begins at -6 frames, then applies the
      # first-syllable hat's -2-frame delay: -8 native 6.4 ms frames total.
      # The immediately following final-stress command clamps to that timestamp.
      hat_rise_same_vowel_early_offset_ms: 51.2
      stress_final_early_offset_ms: 51.2
      # Non-final clause boundary fall (internal Hz*10).
      # Source: ph_inton1.c F0_NON_FINAL_FALL = 150.
      non_final_fall_hz: 150
      # Comma boundary fall (internal Hz*10).
      # Source: ph_inton1.c F0_COMMA_FALL = 120.
      comma_fall_hz: 120
      # Question boundary fall (internal Hz*10).
      # Source: ph_inton1.c F0_QSYLL_FALL = 80.
      question_fall_hz: 80
      # Boundary GESTURE impulse pairs (internal Hz*10), emitted on the final
      # stressed vowel into the `boundary` impulse layer.  These are the
      # explicit F0 gestures DECtalk adds on top of the hat-fall for questions
      # and commas (ph_inton1.c make_f0_command IMPULSE pairs).
      #
      # Yes/no question terminal rise: a small dip then a large rise at the end
      # of the clause-final stressed vowel.  The +451 rise dominates the reduced
      # question fall (question_fall_hz=80), producing a terminal RISE.
      # Source: ph_inton1.c:219-220 (F0_QGesture1=-151, F0_QGesture2=+451),
      #         :1351-1352 (emitted on the final stressed vowel for FQUENEXT).
      question_gesture_dip_hz: -151
      question_gesture_rise_hz: 451
      # Comma continuation rise: an upward IMPULSE pair at a comma boundary, so
      # F0 continues/rises rather than falling fully (signals "more to come").
      # Source: ph_inton1.c:221-222 (F0_CGesture1=+171, F0_CGesture2=+250),
      #         :1367-1368 (emitted on the final stressed vowel for FCBNEXT comma).
      comma_gesture1_hz: 171
      comma_gesture2_hz: 250
      # Gesture IMPULSE length in native DECtalk control frames.
      # Source: ph_inton1.c:1352 (make_f0_command ... length 24).
      boundary_gesture_duration_frames: 24
      # Citation-mode Ph_inton2.c emits the US hat rise as a STEP with length 15.
      hat_rise_glide_frames: 15
      # Question terminal-rise GLIDE span in native DECtalk control frames. The
      # +451 yes/no rise is rendered as a GLIDE that climbs to the target over
      # the final vowel rather than a transient impulse, so the contour rises
      # smoothly into the question boundary and HOLDS the elevated F0.
      # Source: ph_inton1.c:1635 (make_f0_command GLIDE, F0_QGesture2, span =
      # allodurs[nphon]; ~24 control frames at the 6.4 ms cadence for a ~150 ms
      # final vowel). # engineering span estimate (final-vowel-length proxy)
      question_rise_glide_frames: 24
      # Citation-mode US stress magnitudes (internal Hz*10 units).
      # Source: Ph_inton2.c us_f0_mstress_level[] and
      # us_f0_mphrase_position[].
      stress_level_primary_hz: 81
      stress_level_secondary_hz: 61
      stress_level_emphasis_hz: 261
      # First primary stress: 81 + 160; phrase-final reduction: -50.
      # The single-word reduction in Ph_inton2.c is commented out.
      stress_single_word_final_primary_hz: 191
      stress_phrase_position_hz: 160
      # Stress impulse duration in native DECtalk control frames.
      # Source: ph_inton1.c make_f0_command(... IMPULSE, ..., 20, ...).
      stress_impulse_duration_frames: 20
      segmental:
        # Active US male allophone targets, internal Hz*10.
        # Source: Ph_drwt02.c us_f0msegtars[] (SI=50, EY=50, K=0, IX=70).
        initial_silence_target: 50
        ey_target: 50
        k_target: 0
        ix_target: 70
        # Exact p_us_tim.c controller output for the active K-EY-K word family.
        # Source: DECtalk 4.63 -lt controller/allophone trace for `cake.`.
        initial_silence_frames: 4
        initial_k_frames: 17
        ey_frames: 37
        final_k_frames: 14
        dummy_ix_frames: 6
        terminal_silence_frames: 94
        citations:
          - "DECtalk 4.63 Ph_drwt02.c us_f0msegtars and pht0draw"
          - "DECtalk 4.63 p_us_tim.c controller durations"
          - "DECtalk 4.63 -lt oracle trace for cake."
      citations:
        - "DECtalk 4.63 ph_inton1.c (hat-pattern F0 model)"
        - "DECtalk 4.63 Ph_drwt02.c (baseline profiles, speaker scaling)"
        - "Klatt 1982 (hat-pattern: baseline + hat + stress + segmental)"
    source_contour:
      # Fant 1997 Fig. 10 contour defaults for connected speech source dynamics.
      ee_onset_rise_sec:
        value: 0.05
