# =============================================================================
# English phonology: the language's part of a segment inventory.
#
# The symbol conventions and the phoneme class table of English, shared by
# every voice of the language (docs/frontend-document-model.md decision 6). An
# inventory names this file as its `phonology_path` and supplies the acoustic
# targets; the loader merges, per target, these fields with the inventory's
# (docs/inventory-conventions.md, "Layering an inventory over a phonology
# document"). qlatt-english/inventory.yaml and qlatt-beauty/inventory.yaml both
# do.
#
# What belongs here: a class of the phoneme that is the same for every voice:
# `type`, the binary features (voicing, height, backness, place, manner), the
# components of a diphthong (`diph`), the nasal's place (`nasal_place`, and its
# code `nasal_place_index`), and the coarticulation-resistance class (`dac`,
# Recasens 1997). A value in Hz, dB or
# ms is a voice's and stays in its inventory.
# =============================================================================
version: v1
# Engineering convention: CMU/ARPABET symbols and lexical stress suffixes.
silence_symbol: SIL
nucleus_types: [vowel]
symbol_grammar: '[A-Z]+'
stress_markers: {0: '0', 1: '1', 2: '2'}
