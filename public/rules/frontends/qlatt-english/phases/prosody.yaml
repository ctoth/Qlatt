version: v2-pierrehumbert
rules:
  # ==========================================================================
  # Pierrehumbert-Style Intonation Model
  #
  # Replaces the O'Shaughnessy 1976 exponential-declination F0 model with a
  # Pierrehumbert 1980 / Ladd 2008 pitch-range model using:
  #   - Accent-type-specific F0 targets (H*, L*, L+H*, L*+H, H+!H*, H*+L, H+L*, H*+H)
  #   - Iterative downstep (k^n) instead of global declination
  #   - ToBI-compatible initial boundary %H plus phrase accents (H-, L-) and boundary tones (L%, H%)
  #   - Register reset at IP boundaries (breakIndex >= 4)
  #
  # Citations:
  #   - Pierrehumbert 1980 (original pitch accent inventory, downstep formula, boundary tones)
  #   - Ladd 2008 (pitch range normalization, final lowering, sagging transitions)
  #   - Silverman et al. 1992 (break-index and edge-tone notation conventions)
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Rule 1: Baseline initialization
  # --------------------------------------------------------------------------
  tobi_baseline_init:
    kind: point
    select:
      stream: phone
      where: prev == null
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.policy.f0.base_hz
      tag: f0_baseline
    citations:
      - Pierrehumbert 1980
      - Ladd 2008

  # --------------------------------------------------------------------------
  # Rule 2: Initial %H boundary tone
  # --------------------------------------------------------------------------
  tobi_initial_boundary_high:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.initialBoundaryTone) && current.initialBoundaryTone == '%H'
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      tag: f0_initial_boundary_high
    citations:
      - "Ladd 2008"
      - "Pierrehumbert 1980"

  # --------------------------------------------------------------------------
  # Rule 2: H* accent targets with downstep
  # Interpretation note:
  # - Ladd 2008 and Pierrehumbert 1980 treat final lowering as a separate
  #   phrase-final effect, not as a requirement that the nuclear H* peak itself
  #   be directly scaled below an earlier prenuclear H* peak.
  # - We therefore keep prenuclear downstep on non-nuclear accents, but leave
  #   the nuclear H* peak at its accent height and let the following phrase
  #   accent / boundary movement carry the final fall.
  # --------------------------------------------------------------------------
  tobi_accent_h_star:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      accent_idx: "has(current.accentIndexInPhrase) && current.accentIndexInPhrase >= 0 ? current.accentIndexInPhrase : 0"
      downstep_factor: >-
        (has(current.isNuclearAccent) && current.isNuclearAccent == true) ? 1.0 : pow(params.policy.f0.downstep_k, accent_idx)
      raw_height: >-
        params.policy.f0.h_star_height * downstep_factor
      clamped_height: >-
        max([raw_height, params.policy.f0.downstep_floor_fraction])
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * clamped_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_h_star
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"
      - "O'Shaughnessy 1976"

  # --------------------------------------------------------------------------
  # Rule 3: H* peak for H*+L falling accents
  # Same interpretation as Rule 2: the fall is expressed by the trailing L,
  # not by suppressing the H* peak itself.
  # --------------------------------------------------------------------------
  tobi_accent_h_star_plus_l_peak:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H*+L'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      accent_idx: "has(current.accentIndexInPhrase) && current.accentIndexInPhrase >= 0 ? current.accentIndexInPhrase : 0"
      downstep_factor: >-
        (has(current.isNuclearAccent) && current.isNuclearAccent == true) ? 1.0 : pow(params.policy.f0.downstep_k, accent_idx)
      raw_height: >-
        params.policy.f0.h_star_height * downstep_factor
      clamped_height: >-
        max([raw_height, params.policy.f0.downstep_floor_fraction])
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * clamped_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_h_star_plus_l_peak
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 4: Trailing L for H*+L falling accents
  # --------------------------------------------------------------------------
  tobi_accent_h_star_plus_l_tail:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H*+L'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.l_star_height
      tag: f0_h_star_plus_l_tail
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 5: Leading L for L+H* prenuclear accents
  # --------------------------------------------------------------------------
  tobi_accent_l_plus_h_star_lead:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'L+H*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.l_star_height
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: target_hz
      tag: f0_l_leading
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 6: H* peak for L+H* prenuclear accents
  # --------------------------------------------------------------------------
  tobi_accent_l_plus_h_star_peak:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'L+H*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      accent_idx: "has(current.accentIndexInPhrase) && current.accentIndexInPhrase >= 0 ? current.accentIndexInPhrase : 0"
      downstep_factor: >-
        pow(params.policy.f0.downstep_k, accent_idx)
      raw_height: >-
        params.policy.f0.h_star_height * downstep_factor
      clamped_height: >-
        max([raw_height, params.policy.f0.downstep_floor_fraction])
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * clamped_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_l_plus_h_star
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 7: H lead for H+!H* downstepped prenuclear accents
  # --------------------------------------------------------------------------
  tobi_accent_h_plus_downstepped_h_star_lead:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H+!H*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      prev_f0: prev_point('f0')
      floor_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      target_hz: >-
        prev_f0 == null ? floor_hz : max([prev_f0.value, floor_hz])
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: target_hz
      tag: f0_h_leading
    citations:
      - "Ladd 2008"
      - "Pierrehumbert 1980"

  # --------------------------------------------------------------------------
  # Rule 8: !H* peak for H+!H* prenuclear accents
  # --------------------------------------------------------------------------
  tobi_accent_h_plus_downstepped_h_star_peak:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H+!H*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      accent_idx: "has(current.accentIndexInPhrase) && current.accentIndexInPhrase >= 0 ? current.accentIndexInPhrase : 0"
      downstep_factor: >-
        pow(params.policy.f0.downstep_k, accent_idx)
      raw_height: >-
        params.policy.f0.h_star_height * downstep_factor
      clamped_height: >-
        max([raw_height, params.policy.f0.downstep_floor_fraction])
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * clamped_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_h_plus_downstepped_h_star
    citations:
      - "Ladd 2008"
      - "Pierrehumbert 1980"

  # --------------------------------------------------------------------------
  # Rule 9: H peak plus trailing H for H*+H sustained accents
  # --------------------------------------------------------------------------
  tobi_accent_h_star_plus_h_peak:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H*+H'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      accent_idx: "has(current.accentIndexInPhrase) && current.accentIndexInPhrase >= 0 ? current.accentIndexInPhrase : 0"
      downstep_factor: >-
        pow(params.policy.f0.downstep_k, accent_idx)
      raw_height: >-
        params.policy.f0.h_star_height * downstep_factor
      clamped_height: >-
        max([raw_height, params.policy.f0.downstep_floor_fraction])
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * clamped_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_h_star_plus_h_peak
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 10: Trailing H for H*+H sustained accents
  # --------------------------------------------------------------------------
  tobi_accent_h_star_plus_h_tail:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H*+H'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      prev_f0: prev_point('f0')
      floor_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      target_hz: >-
        prev_f0 == null ? floor_hz : max([prev_f0.value, floor_hz])
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: target_hz
      tag: f0_h_star_plus_h_tail
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 11: Leading H for H+L* low-star accents
  # --------------------------------------------------------------------------
  tobi_accent_h_plus_l_star_lead:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H+L*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      prev_f0: prev_point('f0')
      floor_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      target_hz: >-
        prev_f0 == null ? floor_hz : max([prev_f0.value, floor_hz])
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: target_hz
      tag: f0_h_plus_l_star_lead
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 12: L* star for H+L* accents
  # --------------------------------------------------------------------------
  tobi_accent_h_plus_l_star_peak:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H+L*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.l_star_height
      tag: f0_h_plus_l_star
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 13: L* accent targets (questions)
  # --------------------------------------------------------------------------
  tobi_accent_l_star:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && (current.accentType == 'L*' || current.accentType == 'L*+H')
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.l_star_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_l_star
    citations:
      - Pierrehumbert 1980
      - Ladd 2008

  # --------------------------------------------------------------------------
  # Rule 14: Trailing H for L*+H rising accents
  # --------------------------------------------------------------------------
  tobi_accent_l_star_plus_h_trailing:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'L*+H'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      floor_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: floor_hz
      tag: f0_l_star_plus_h
    citations:
      - "Ladd 2008"
      - "Pierrehumbert 1980"

  # --------------------------------------------------------------------------
  # Rule 15: Unaccented voiced interpolation anchor
  # --------------------------------------------------------------------------
  tobi_unaccented_declination:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL'
        && (has(current.isAccented) ? current.isAccented != true : true)
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      prev_f0: prev_point('f0')
      base: params.policy.f0.base_hz
      fallback: "prev_f0 == null ? base : prev_f0.value"
      target: >-
        max([fallback * 0.98, base])
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: target
      tag: f0_unaccented
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 16: Phrase accent H- at the start of phrase-final silence
  # --------------------------------------------------------------------------
  tobi_phrase_accent_high:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL'
        && has(current.phraseAccent) && current.phraseAccent == 'H-'
    define:
      prev_f0: prev_point('f0')
      floor_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      target_hz: >-
        prev_f0 == null ? floor_hz : max([prev_f0.value, floor_hz])
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: target_hz
      tag: f0_phrase_high
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 17: Phrase accent L- at the start of phrase-final silence
  # --------------------------------------------------------------------------
  tobi_phrase_accent_low:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL'
        && has(current.phraseAccent) && current.phraseAccent == 'L-'
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_l_pct_fraction
      tag: f0_phrase_low
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 18: L% boundary tone (declarative final fall)
  # --------------------------------------------------------------------------
  tobi_boundary_low:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL'
        && has(current.boundaryTone) && current.boundaryTone != null
        && current.boundaryTone == 'L%'
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_l_pct_fraction
      tag: f0_boundary_low
    citations:
      - "Pierrehumbert 1980"
      - Ladd 2008

  # --------------------------------------------------------------------------
  # Rule 19: H% boundary tone (question rise, continuation rise)
  # --------------------------------------------------------------------------
  tobi_boundary_rise:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL'
        && has(current.boundaryTone) && current.boundaryTone != null
        && current.boundaryTone == 'H%'
    define:
      prev_f0: prev_point('f0')
      high_floor_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      ceiling_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz
      target_hz: >-
        prev_f0 == null
          ? high_floor_hz
          : max([
              high_floor_hz,
              prev_f0.value + params.policy.f0.upstep_factor * (ceiling_hz - prev_f0.value)
            ])
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: target_hz
      tag: f0_boundary_rise
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # --------------------------------------------------------------------------
  # Rule 20: Register reset at IP boundaries (breakIndex >= 4)
  # --------------------------------------------------------------------------
  tobi_register_reset:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL'
        && (prev != null
            ? (prev.phoneme == 'SIL'
                ? (has(prev.breakIndex) && prev.breakIndex != null ? prev.breakIndex >= 4 : false)
                : false)
            : false)
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.policy.f0.base_hz
      tag: f0_register_reset
    citations:
      - Pierrehumbert 1980
      - Ladd 2008 (declination reset at intonational phrase boundaries)

  # --------------------------------------------------------------------------
  # Rule 21: Sagging F0 transition between consecutive H* accents
  #
  # Pierrehumbert 1980 observed that F0 between two H* pitch accents does
  # not interpolate linearly but sags below the straight line — a concave
  # dip.  Ladd 2008 pp.155-157 documents this as "sagging transitions."
  # This rule inserts a low F0 target at the right edge of the first H*
  # vowel, pulling the interpolation downward by sag_depth_hz (12 Hz)
  # before the contour rises again to the next H* peak.
  # --------------------------------------------------------------------------
  sagging_transition:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H*'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    define:
      next_stressed: >-
        look_ahead_pred(current, 20, 'is_stressed_vowel')
      has_following_h_star: >-
        next_stressed != null
        && has(next_stressed.accentType) && next_stressed.accentType == 'H*'
      accent_span_ms: >-
        next_stressed != null ? span_ms(current, next_stressed) : 0.0
      prev_f0: prev_point('f0')
      sag_value: >-
        (prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value)
        - params.policy.f0.sag_depth_hz
    constraint: >-
      has_following_h_star
      && accent_span_ms >= params.policy.f0.sag_min_span_ms
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: >-
        max([sag_value, params.policy.f0.base_hz])
      tag: f0_sag
    citations:
      - "Pierrehumbert 1980"
      - "Ladd 2008"

  # ==========================================================================
  # Microprosodic / Segmental F0 Perturbation (Kept Unchanged)
  #
  # These are NOT intonational — they are segmental effects caused by the
  # aerodynamic/mechanical properties of voiceless/voiced consonants.
  # They are orthogonal to the Pierrehumbert-style intonation model.
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Rule 12: Voiceless onset perturbation (+20% F0)
  # --------------------------------------------------------------------------
  f0_voiceless_onset_perturbation:
    kind: point
    select:
      stream: phone
      where:
        all:
          - current.type == 'vowel'
          - prev != null && prev.type in ['stop_release', 'stop_aspiration', 'fricative']
          - { predicate: prev_is_voiceless }
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        min([(prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) * params.policy.f0.voiceless_onset_raise,
             params.policy.f0.base_hz + params.policy.f0.range_hz])
      tag: f0_onset_perturbation
    citations:
      - "O'Shaughnessy 1976"
      - "cf. Hombert et al. 1979 (empirical: ~8% perturbation)"
      - "Engineering estimate: clamp to speaker pitch range ceiling to prevent compounding runaway"

  # --------------------------------------------------------------------------
  # Rule 13: Voiced onset perturbation (-5% F0)
  # --------------------------------------------------------------------------
  f0_voiced_onset_perturbation:
    kind: point
    select:
      stream: phone
      where:
        all:
          - current.type == 'vowel'
          - prev != null && prev.type in ['stop_closure', 'stop_release']
          - { predicate: prev_is_voiced }
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        min([(prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) * params.policy.f0.voiced_onset_lower,
             params.policy.f0.base_hz + params.policy.f0.range_hz])
      tag: f0_onset_perturbation
    citations:
      - "O'Shaughnessy 1976"
      - "Engineering estimate: clamp to speaker pitch range ceiling to prevent compounding runaway"

  # --------------------------------------------------------------------------
  # Rule 14: Continuation rise at clause boundaries
  #
  # Kept from O'Shaughnessy 1976 — applies at intermediate phrase boundaries
  # (commas, semicolons, colons) that the ToBI boundary tone system did NOT
  # already handle.  Guarded by boundaryTone == null so it does not produce
  # a second F0 target on tokens where tobi_boundary_rise already fired.
  # --------------------------------------------------------------------------
  f0_continuation_rise:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL' && (has(current.punctuationSymbol) ? current.punctuationSymbol in [',', ';', ':'] :
        false)
        && (!has(current.boundaryTone) || current.boundaryTone == null)
    define:
      prev_f0: prev_point('f0')
      continuation_rise: >-
        current.punctuationSymbol == ',' ? params.policy.f0.continuation_rise_hz :
        params.policy.f0.continuation_minor_rise_hz
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: "(prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) + continuation_rise"
      tag: f0_continuation
    citations:
      - O'Shaughnessy 1976
      - "Engineering estimate: semicolon/colon rise magnitude"

  # --------------------------------------------------------------------------
  # Rule 25: Connected-speech source contour (Fant 1997)
  #
  # Applies phrase-local Ee/Rd source shaping on voiced segments:
  # - slight onset rise
  # - slow declination
  # - stronger final-window fall
  # - phrase-final Rd softening
  # --------------------------------------------------------------------------
  connected_speech_source_contour:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL'
        && current.params != null
        && ((has(current.params.AV) && current.params.AV > 0)
            || (has(current.params.AVS) && current.params.AVS > 0))
    contour:
      domain: phrase
      # Silverman et al. 1992 ToBI: BI=3 marks intermediate phrase boundaries.
      reset_break_index: 3
      apply:
        - field: params.EePhraseDb
          op: add
          value: ee_total_db
          tag: source_contour
        - field: params.RdPhraseOffset
          op: add
          value: "params.policy.source_contour.rd_final_offset * final_progress"
          tag: source_contour
    define:
      onset_rise_db: >-
        contour.elapsed_sec < params.policy.source_contour.ee_onset_rise_sec
        ? -params.policy.source_contour.ee_onset_rise_db
          * (1.0 - contour.elapsed_sec / params.policy.source_contour.ee_onset_rise_sec)
        : 0.0
      declination_db: >-
        -params.policy.source_contour.ee_declination_db_per_sec * contour.elapsed_sec
      final_window_sec: >-
        min([
          params.policy.source_contour.ee_final_window_max_sec,
          max([
            params.policy.source_contour.ee_final_window_min_sec,
            contour.phrase_duration_sec * params.policy.source_contour.ee_final_window_ratio
          ])
        ])
      final_window_start_sec: >-
        max([
          params.policy.source_contour.ee_onset_rise_sec,
          contour.phrase_duration_sec - final_window_sec
        ])
      final_fall_db: >-
        contour.elapsed_sec > final_window_start_sec
        ? -(params.policy.source_contour.ee_final_fall_db_per_sec
            - params.policy.source_contour.ee_declination_db_per_sec)
          * (contour.elapsed_sec - final_window_start_sec)
        : 0.0
      final_progress: >-
        contour.elapsed_sec <= final_window_start_sec
        ? 0.0
        : min([1.0, (contour.elapsed_sec - final_window_start_sec) / final_window_sec])
      ee_total_db: >-
        onset_rise_db + declination_db + final_fall_db
    citations:
      - Fant 1997
      - Hanson et al. 2001
      - Silverman et al. 1992
      - "Engineering estimate: conservative qlatt contour magnitudes for stable long-phrase loudness"

  # --------------------------------------------------------------------------
  # Rule 26: Spectral tilt reduction for stressed vowels
  #
  # Stressed vowels have flatter spectral tilt (lower TL), reflecting
  # increased vocal effort. Sluijter & van Heuven 1996 showed spectral
  # tilt is a primary acoustic correlate of linguistic stress, more
  # reliable than F0 or intensity alone.
  # --------------------------------------------------------------------------
  stress_spectral_tilt:
    kind: scalar
    select:
      stream: phone
      where: "current.type == 'vowel' && has(current.stress) && current.stress >= 1"
    apply:
      - field: params.TL
        op: add
        value: "-6"
        tag: stress
    citations:
      - "Sluijter & van Heuven 1996"
