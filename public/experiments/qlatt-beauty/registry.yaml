# Klatt 80 Synthesizer Primitive Registry
# Defines all node types available for the Klatt audio graph
#
# Each primitive defines:
#   - description: What the node does
#   - native/worklet/wasm: implementation type
#   - params: configurable params with type, default, unit, description
#   - inputs: number of audio inputs
#   - outputs: number of audio outputs

bacon: "0.1"

primitives:
  # ===========================================================================
  # WebAudio Native Nodes
  # ===========================================================================

  gain:
    description: "WebAudio GainNode - multiplies input signal by gain parameter"
    native: GainNode
    params:
      gain:
        type: float
        default: 1.0
        description: "Multiplication factor (linear scale)"
    inputs: 1
    outputs: 1

  constant-source:
    description: "WebAudio ConstantSourceNode - outputs constant value"
    native: ConstantSourceNode
    params:
      offset:
        type: float
        default: 1.0
        description: "Constant output value"
    inputs: 0
    outputs: 1

  dynamics-compressor:
    description: "WebAudio DynamicsCompressorNode - mimics FORTRAN 16-bit hard clipping. Klatt 1980 COEWAV.FOR line 251 scales by 170x then truncates to [-32767,32767]; in float audio the compressor serves the same role, taming cascade peaks while preserving quieter parallel-branch fricatives."
    native: DynamicsCompressorNode
    params:
      threshold:
        type: float
        unit: "dB"
        default: -24
        description: "Level above which compression begins"
      knee:
        type: float
        unit: "dB"
        default: 12
        description: "Soft knee width for smooth onset of compression"
      ratio:
        type: float
        default: 12
        description: "Input/output ratio above threshold"
      attack:
        type: float
        unit: "s"
        default: 0.003
        description: "Time to reach full compression after threshold crossing"
      release:
        type: float
        unit: "s"
        default: 0.1
        description: "Time to release compression after signal drops below threshold"
    inputs: 1
    outputs: 1

  # ===========================================================================
  # WASM-backed AudioWorklet Nodes
  # ===========================================================================

  reconstruction-filter:
    description: "Configurable output reconstruction stage; default models Klatt (1980) Appendix A 5 kHz low-pass"
    worklet: "reconstruction-filter-processor.js"
    wasm: "reconstruction-filter.wasm"
    options:
      bypass:
        type: bool
        default: false
        description: "Bypass the Klatt 1980 5 kHz output low-pass for experiments that intentionally render higher-frequency fricative energy"
    inputs: 1
    outputs: 1

  resonator:
    description: "Two-pole resonator (formant filter) - implements second-order IIR bandpass"
    worklet: "resonator-processor.js"
    wasm: "resonator.wasm"
    options:
      bypassAtZero:
        type: bool
        default: false
        description: "When true, bypass filter if frequency is 0"
    params:
      frequency:
        type: float
        unit: "Hz"
        default: 500
        description: "Center frequency of the resonance"
      bandwidth:
        type: float
        unit: "Hz"
        default: 100
        description: "3dB bandwidth"
    inputs: 1
    outputs: 1

  antiresonator:
    description: "Two-zero antiresonator (zero filter) - implements second-order IIR notch for nasal zeros"
    worklet: "antiresonator-processor.js"
    wasm: "antiresonator.wasm"
    options:
      bypassAtZero:
        type: bool
        default: false
        description: "When true, bypass filter if frequency is 0"
    params:
      frequency:
        type: float
        unit: "Hz"
        default: 500
        description: "Zero frequency"
      bandwidth:
        type: float
        unit: "Hz"
        default: 100
        description: "3dB bandwidth"
    inputs: 1
    outputs: 1

  biquad-notch:
    description: "Biquad notch (band-reject) filter — numerically stable replacement for FIR antiresonator at high sample rates. Bristow-Johnson Audio EQ Cookbook (2005)."
    worklet: "biquad-notch-processor.js"
    wasm: "biquad-notch.wasm"
    options:
      bypassAtZero:
        type: bool
        default: false
        description: "When true, bypass filter if frequency is 0"
    params:
      frequency:
        type: float
        unit: "Hz"
        default: 500
        description: "Center frequency of the notch"
      bandwidth:
        type: float
        unit: "Hz"
        default: 100
        description: "3dB bandwidth"
    inputs: 1
    outputs: 1

  tilt-filter:
    description: "One-pole spectral-tilt low-pass (Gauffin 1989 / Fant 1985 return-phase tilt = warmth<->brightness). Controllable voice spectral tilt for the beauty backend."
    worklet: "tilt-filter-processor.js"
    wasm: "tilt-filter.wasm"
    params:
      tilt:
        type: float
        unit: "dB"
        default: 0
        rate: k
        description: "Spectral tilt in dB (0 = flat, up to ~34). Higher = warmer/darker."
    inputs: 1
    outputs: 1

  lf-source:
    description: "LF model glottal source with Rd voice quality control - generates glottal flow derivative"
    worklet: "lf-source-processor.js"
    wasm: "lf-source.wasm"
    params:
      f0:
        type: float
        unit: "Hz"
        default: 120
        description: "Fundamental frequency"
      rd:
        type: float
        default: 1.0
        description: "Voice quality parameter (0.3=pressed to 2.7=breathy)"
      lfMode:
        type: int
        default: 1
        description: "LF model mode selection"
      oq:
        type: float
        default: 0
        description: "Open quotient override (Klatt 1990 %, 0-99). 0 = derive from Rd"
      tl:
        type: float
        default: 0
        description: "Spectral tilt override (dB at 3 kHz, Klatt 1990, 0-41). 0 = derive from Rd"
      flutter:
        type: float
        default: 0
        description: "F0 flutter (Klatt & Klatt 1990, 0-100). 0 = none"
      jitter:
        type: float
        default: 0
        description: "F0 jitter (Fraj 2011, 0-100). 0 = none"
      di:
        type: float
        default: 0
        description: "Diplophonia index (Gobl & Ni Chasaide 2003, 0-100). 0 = uniform amplitude, 100 = odd periods silent"
    inputs: 0
    outputs: 1

  signal-switch:
    description: "N-to-1 signal selector implementing Klatt 80 SW parameter - instantaneous switching between cascade/parallel branches"
    worklet: "signal-switch-processor.js"
    wasm: "signal-switch.wasm"
    params:
      selector:
        type: float
        default: 0
        description: "Branch selector (0=cascade/input0, 1=parallel/input1)"
    inputs: 2
    outputs: 1

  edge-detector:
    description: "Klatt 80 PLSTEP trigger detector - fires single-sample pulse when input increases by >= threshold"
    worklet: "edge-detector-processor.js"
    wasm: "edge-detector.wasm"
    params:
      threshold:
        type: float
        unit: "dB"
        default: 49.0
        description: "Delta threshold to trigger (Klatt 80 uses 49 dB for AF/AH)"
      input:
        type: float
        unit: "dB"
        default: 0
        description: "Input parameter value to monitor (typically AF or AH amplitude)"
    inputs: 0
    outputs: 1

  decay-envelope:
    description: "Klatt 80 PLSTEP exponential decay envelope - triggered burst with 0.995 per-sample decay at 10kHz"
    worklet: "decay-envelope-processor.js"
    wasm: "decay-envelope.wasm"
    params:
      trigger:
        type: float
        default: 0
        rate: a
        description: "Trigger input (rising edge >0.5 fires envelope)"
      amplitude:
        type: float
        default: 1.0
        rate: a
        description: "Initial envelope amplitude when triggered (sets to -amplitude for rarefaction)"
      decay:
        type: float
        default: 0
        rate: k
        description: "Per-sample decay coefficient (0=auto from sample rate, Klatt 80 uses 0.995 at 10kHz)"
    inputs: 1
    outputs: 1

  # ===========================================================================
  # JavaScript AudioWorklet Nodes
  # ===========================================================================

  impulse-train:
    description: "Classic Klatt impulse train source - generates periodic impulses at F0"
    worklet: "impulse-train-processor.js"
    params:
      f0:
        type: float
        unit: "Hz"
        default: 120
        description: "Fundamental frequency"
      gain:
        type: float
        default: 1.0
        description: "Impulse amplitude"
      openPhaseRatio:
        type: float
        default: 0.7
        description: "Open phase ratio (OQ) for impulse shaping"
    inputs: 0
    outputs: 1

  noise-source:
    description: "Filtered noise generator for aspiration and frication"
    worklet: "noise-source-processor.js"
    params:
      gain:
        type: float
        default: 1.0
        description: "Noise amplitude"
      cutoff:
        type: float
        unit: "Hz"
        default: 4000
        description: "Lowpass filter cutoff frequency"
    inputs: 1
    outputs: 1

  differentiator:
    description: "First-difference filter for radiation characteristic - y[n] = x[n] - x[n-1]"
    worklet: "differentiator-processor.js"
    params: {}
    inputs: 1
    outputs: 1

  chalker-radiation:
    description: "Chalker 1985 two-term radiation filter — y[n] = c1*(x[n]-x[n-1]) + c2*(x[n]-2*x[n-1]+x[n-2]). Reduces high-frequency impedance error from 13.4 ohms (Flanagan) to 1.22 ohms at 5 kHz."
    worklet: "chalker-radiation-processor.js"
    params: {}
    inputs: 1
    outputs: 1

  glottal-mod:
    description: "Pulsatile aspiration modulation synchronized to glottal cycle - sinusoidal OQ envelope (Klatt 1980, Gobl 1988, Fant 1997 Table 1)"
    worklet: "glottal-mod-processor.js"
    params:
      f0:
        type: float
        unit: "Hz"
        default: 120
        description: "Fundamental frequency for synchronization"
      oq:
        type: float
        default: 0.5
        range: [0.1, 1.0]
        description: "Open quotient controlling aspiration envelope shape; qlatt derives the default from Fant 1997 Table 1 OQi values"
    inputs: 1
    outputs: 1
