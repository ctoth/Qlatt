version: v1

# A letter is interpreted as a letter-name iff it sits in a run of at least
# three single-letter words (e.g. "U C L A"). The 3-disjunction below
# enumerates the three positions a token can occupy in such a run: middle
# (prev+next), left-edge (next+ahead2), right-edge (prev+behind2).
rules:
  spelling_mode_letter_names:
    kind: scalar
    select:
      stream: orthography
      where: >-
        current.tokenType == 'word' && current.word in sets.ascii_letter &&
        ((prev != null && prev.tokenType == 'word' && prev.word in sets.ascii_letter &&
          next != null && next.tokenType == 'word' && next.word in sets.ascii_letter) ||
         (next != null && next.tokenType == 'word' && next.word in sets.ascii_letter &&
          ahead(current, 2) != null && ahead(current, 2).tokenType == 'word' && ahead(current, 2).word in sets.ascii_letter) ||
         (prev != null && prev.tokenType == 'word' && prev.word in sets.ascii_letter &&
          behind(current, 2) != null && behind(current, 2).tokenType == 'word' && behind(current, 2).word in sets.ascii_letter))
    apply:
      - field: pronunciationKey
        op: set
        value: maps.letter_to_pronunciation[current.word]
        tag: orthography
    citations:
      - Allen et al. 1987 Ch.2-3 (symbol strings pronounced with LETTER-* morphs)
      - Allen 1977 (FORMAT/DECOMP modular text preprocessing before pronunciation)
