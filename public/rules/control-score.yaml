version: v2
description: >
  Canonical backend-neutral declarative control-score schema for frontend output.
  The score is the sole production input to Klatt track lowering; raw rule-engine
  phone and parameter token shapes stop at score construction.

top_level_sections:
  version: { type: string, required: true }
  frontend_id: { type: string, required: true }
  segments: { type: array, required: true }
  timeline_marks: { type: array, required: true }
  timed_controls: { type: array, required: true }
  f0_points: { type: array, required: true }
  f0_layer_commands: { type: array, required: true }
  global_overlays: { type: array, required: true }
  lowering_refs: { type: object, required: true }

segment_fields:
  id: { type: string, required: true }
  phoneme: { type: string, required: true }
  type: { type: string, required: true }
  word: { type: string, required: false }
  stress: { type: int_or_null, required: false }
  break_index: { type: int, required: false }
  params: { type: numeric_map, required: true }
  prosody:
    type: object
    required: true
    fields:
      is_function_word: { type: bool, required: false }
      is_accented: { type: bool, required: false }
      is_accent_carrier: { type: bool, required: false }
      is_nuclear_accent: { type: bool, required: false }
      initial_boundary_tone: { type: string_or_null, required: false }
      accent_type: { type: string_or_null, required: false }
      phrase_accent: { type: string_or_null, required: false }
      boundary_tone: { type: string_or_null, required: false }
  alignment:
    type: object
    required: true
    fields:
      onset_mark: { type: string, required: false }
      release_mark: { type: string, required: false }
      transition_ms: { type: number, required: false }
  duration:
    type: object
    required: true
    fields:
      lexical_target_ms: { type: number, required: false }
      realized_target_ms: { type: number, required: true }
      minimum_ms: { type: number, required: false }
  source:
    type: object
    required: false
  filter:
    type: object
    required: false

timeline_mark_fields:
  id: { type: string, required: true }
  segment_id: { type: string, required: true }
  edge: { type: enum, values: [onset, release], required: true }
  time_ms: { type: number, required: false }

timing_variants:
  absolute:
    kind: absolute
    fields:
      time_ms: { type: number, required: true }
  anchored:
    kind: anchored
    fields:
      anchor_left: { type: string, required: true }
      anchor_right: { type: string, required: true }
      ratio: { type: number, required: true }

timed_control_fields:
  id: { type: string, required: true }
  target_segment_id: { type: string, required: true }
  start_offset_ms: { type: number, required: true }
  end_offset_ms: { type: number, required: true }
  fields: { type: field_op_map, required: true }
  tag: { type: string, required: false }

f0_point_fields:
  id: { type: string, required: true }
  timing: { type: timing, required: true }
  value_hz: { type: number, required: true }
  tag: { type: string, required: false }
  accent_type: { type: string, required: false }

f0_layer_command_fields:
  id: { type: string, required: true }
  timing: { type: timing, required: true }
  layer: { type: string, required: true }
  value: { type: number, required: true }
  duration_frames: { type: number, required: false }
  profile_points: { type: number_array, required: false }
  tag: { type: string, required: false }

global_overlay_fields:
  id: { type: string, required: true }
  fields: { type: field_op_map, required: true }
  tag: { type: string, required: false }

lowering_ref_fields:
  spec_id: { type: string, required: true }
  policy_paths: { type: string_array, required: true }
