    page: 0
- id: claim21
  type: equation
  expression: h_{LF_{closed}}(t) = \frac{-E}{\epsilon T_a} (e^{-\epsilon t} - e^{-\epsilon(T_0
    - O_q T_0)}), \quad t \in [0, T_0 - O_q T_0]
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim22
  type: equation
  expression: 1 - e^{-\epsilon(T_0 - O_q T_0)} = \epsilon T_a
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim23
  type: equation
  expression: '\begin{cases}

    R_a = (-1 + 4.8 R_d) / 100 \\

    R_k = (22.4 + 11.8 R_d) / 100 \\

    R_g = \frac{R_k(0.5 + 1.2 R_k)}{0.44 R_d - 4 R_a(0.5 + 1.2 R_k)}

    \end{cases}

    \Rightarrow

    \begin{cases}

    O_q = \frac{1 + R_k}{2 R_g} \\

    \alpha_m = \frac{1}{1 + R_k} \\

    T_a = R_a T_0

    \end{cases}'
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim24
  type: equation
  expression: '\begin{cases}

    F_g = \frac{1}{2 O_q T_0} \\

    B_g = \frac{1}{O_q T_0 \tan(\pi(1-\alpha_m))} \\

    A_g = E

    \end{cases}'
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim25
  type: equation
  expression: '\begin{cases}

    b_1 = -A_g \\

    b_2 = A_g \\

    a_1 = -2 e^{-\pi B_g / F_s} \cos(2\pi F_g / F_s) \\

    a_2 = e^{-2\pi B_g / F_s}

    \end{cases}'
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim26
  type: equation
  expression: H_{ST}(z) = \frac{b_{ST}}{1 + a_{ST} z^{-1}}
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim27
  type: equation
  expression: '\begin{cases}

    b_{ST} = 1 - e^{-2\pi F_a / F_s} \\

    a_{ST} = -e^{-2\pi F_a / F_s}

    \end{cases}'
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim28
  type: equation
  expression: x_{LM_{open}}[n] = b_1 \delta_{goi}[n-1] + b_2 \delta_{goi}[n-2] - a_1
    x_{LM_{open}}[n-1] - a_2 x_{LM_{open}}[n-2]
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim29
  type: equation
  expression: x_{LM}[n] = b_{ST} x_{LM_{open}}[n-1] - a_{ST} x_{LM}[n-1]
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
