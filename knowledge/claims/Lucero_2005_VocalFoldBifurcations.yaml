    page: 0
- id: claim6411
  type: observation
  statement: '**Hopf bifurcation threshold:** Oscillation onset must occur at $\gamma
    = \delta$ (aerodynamic energy equals dissipation)'
  concepts: []
  provenance:
    paper: Lucero_2005_VocalFoldBifurcations
    page: 0
- id: claim6412
  type: observation
  statement: '**Lyapunov number sign:** For $\eta > (5\delta + 3)/[\delta(3 + \delta^2)]$,
    the bifurcation must be supercritical ($\sigma < 0$)'
  concepts: []
  provenance:
    paper: Lucero_2005_VocalFoldBifurcations
    page: 0
- id: claim6413
  type: observation
  statement: '**Supercritical behavior:** When $\sigma < 0$, oscillation amplitude
    must grow continuously from zero at threshold'
  concepts: []
  provenance:
    paper: Lucero_2005_VocalFoldBifurcations
    page: 0
- id: claim6414
  type: observation
  statement: '**Subcritical behavior:** When $\sigma > 0$, there must exist an unstable
    limit cycle below the stable one, and oscillation onset must be discontinuous
    (jump to finite amplitude)'
  concepts: []
  provenance:
    paper: Lucero_2005_VocalFoldBifurcations
    page: 0
- id: claim6415
  type: observation
  statement: '**Hysteresis:** In the extended model with subcritical Hopf, onset pressure
    must exceed offset pressure'
  concepts: []
  provenance:
    paper: Lucero_2005_VocalFoldBifurcations
    page: 0
- id: claim6416
  type: observation
  statement: '**Singular point:** The point $u = -1$ (complete glottal closure) must
    be a singular point of the system'
  concepts: []
  provenance:
    paper: Lucero_2005_VocalFoldBifurcations
    page: 0
- id: claim6417
  type: observation
  statement: '**Amplitude bound:** Limit cycle maximum displacement $u$ must satisfy
    $u > -1$ (glottis cannot have negative area)'
  concepts: []
  provenance:
    paper: Lucero_2005_VocalFoldBifurcations
    page: 0
