maps:
  # Letter → LETTER_X pronunciation key used by spelling_mode_letter_names.
  # The LETTER_* phonemes are defined in inventory.yaml (per Allen et al. 1987
  # Ch. 2-3 — symbol strings pronounced with LETTER-* morphs).
  letter_to_pronunciation:
    a: LETTER_A
    b: LETTER_B
    c: LETTER_C
    d: LETTER_D
    e: LETTER_E
    f: LETTER_F
    g: LETTER_G
    h: LETTER_H
    i: LETTER_I
    j: LETTER_J
    k: LETTER_K
    l: LETTER_L
    m: LETTER_M
    n: LETTER_N
    o: LETTER_O
    p: LETTER_P
    q: LETTER_Q
    r: LETTER_R
    s: LETTER_S
    t: LETTER_T
    u: LETTER_U
    v: LETTER_V
    w: LETTER_W
    x: LETTER_X
    y: LETTER_Y
    z: LETTER_Z
  # Stop closure -> release segment lookup. The release/aspiration inventory
  # entries carry stop_release / stop_aspiration token types used by burst rules.
  phoneme_release_map:
    P_CL: P_REL
    T_CL: T_REL
    K_CL: K_REL
    B_CL: B_REL
    D_CL: D_REL
    G_CL: G_REL
  phoneme_aspiration_map:
    P_CL: P_ASP
    T_CL: T_ASP
    K_CL: K_ASP
    B_CL: ""
    D_CL: ""
    G_CL: ""
  phoneme_release_place_map:
    P_CL: p
    T_CL: t
    K_CL: k
    B_CL: p
    D_CL: t
    G_CL: k
  place_locus_closure_place:
    K_CL: velar
    P_CL: bilabial
    B_CL: bilabial
    M: bilabial
    T_CL: alveolar
    D_CL: alveolar
    N: alveolar
    Y: palatal
  place_locus_release_place:
    K_REL: velar
    P_REL: bilabial
    B_REL: bilabial
    T_REL: alveolar
    D_REL: alveolar
  place_locus_release_for_closure:
    K_CL: K_REL
    P_CL: P_REL
    B_CL: B_REL
    M: ""
    T_CL: T_REL
    D_CL: D_REL
    N: ""
    Y: ""
tags:
  accent: assigns an intonational accent
  accent_type: selects the accent category
  aspiration_frication: carries source noise across a segment boundary
  boundary: adjusts a segment at a prosodic boundary
  boundary_tone: assigns a phrase-final boundary tone
  branch_switch: selects the cascade or parallel synthesis branch
  burst_spectrum: shapes a stop-release burst spectrum
  cluster: adjusts a consonant in a cluster
  cluster_position: records a consonant position within its cluster
  coarticulation: blends neighboring articulatory targets
  consonant_medial: adjusts a word-medial consonant
  consonant_position: adjusts duration by consonant position
  consonant_stress: adjusts a consonant beside a stressed vowel
  coronal_fronting: fronts a vowel beside a coronal consonant
  d_deletion: deletes an eligible alveolar voiced stop
  downstep_index: records accent order for downstep
  duration_cap: caps an overlong segment
  duration_floor: enforces a segment-duration floor
  fricative_duration_floor: enforces a fricative-duration floor
  initial_boundary_tone: assigns a phrase-initial boundary tone
  lateral_allophony: selects a context-sensitive lateral target
  nasal_coupling: adjusts oral-nasal acoustic coupling
  nasal_murmur: adjusts nasal-murmur strength
  nasal_place: assigns or assimilates nasal place
  nasal_window: schedules anticipatory or carryover nasalization
  nuclear_accent: marks the nuclear accent
  orthography: maps written tokens to pronunciation keys
  pause_duration: assigns punctuation-pause duration
  pause_rate: scales a pause for speaking rate
  phrase_accent: assigns a phrase accent
  place_locus: applies a consonantal formant locus
  polysyllabic: adjusts duration in a polysyllabic word
  rate_undershoot: reduces articulatory excursion at high rate
  rhoticity: lowers F3 for rhotic articulation
  s_cluster_aspiration: reduces aspiration after s
  segmental_context: adjusts a segment from neighboring segments
  source_contour: shapes phrase-level source parameters
  speech_rate: scales segment duration for speaking rate
  stop_release_duration: assigns stop-release timing
  stop_release_formant: shapes formants at stop release
  stop_unrelease: suppresses an unreleased stop burst
  stress: adjusts a stressed or unstressed segment
  syllable_count: records syllable count for duration rules
  t_deletion: deletes an eligible alveolar voiceless stop
  transition: assigns a formant-transition duration
  vowel_reduction: centralizes an unstressed vowel
  weak_coda_devoicing: attenuates voicing in a weak coda
  weak_release_spectrum: attenuates a weak stop-release spectrum
  word_class: records function-word or content-word status
  word_initial: adjusts a word-initial segment
relations:
  Token:
    type: parallel
    features:
      pronunciationKey: []
      word: []
      tokenType:
        - word
        - punctuation
  Segment:
    type: base
    features:
      A1: []
      A2: []
      A3: []
      A4: []
      A5: []
      A6: []
      A7: []
      A8: []
      A9: []
      A10: []
      AF: []
      AH: []
      AV: []
      AVS: []
      EePhraseDb: []
      F1: []
      F2: []
      F3: []
      RdPhraseOffset: []
      SW: []
      TL: []
      accentIndexInPhrase: []
      accentType: []
      boundaryTone: []
      breakIndex: []
      cluster_position: []
      control_windows: []
      inherentDuration: []
      initialBoundaryTone: []
      isAccentCarrier: []
      isAccented: []
      isContentWord: []
      isFunctionWord: []
      isNuclearAccent: []
      nasalCoupling: []
      nasalMurmurStrength: []
      nasalPlaceIndex: []
      phraseAccent: []
      transition_ms: []
      type:
        - vowel
        - stop
        - stop_closure
        - stop_release
        - stop_aspiration
        - fricative
        - affricate
        - silence
        - liquid
        - nasal
        - glide
      word_syllable_count: []
      alveolar: []
      bilabial: []
      boundary: []
      dac: []
      fricative_min_ms: []
      inventorySW: []
      next_boundary: []
      phoneme: []
      postalveolar: []
      punctuationSymbol: []
      stress: []
      syllable: []
      velar: []
      voiced: []
      voiceless: []
      weak: []
      word: []
    scalars:
      duration:
        unit: ms
        resolution: klatt
        max: 500
        floor_field: durationFloor
  F0Point:
    type: point
    value_type: number
    unit: Hz
phases:
  - name: orthography
    rules:
      - spelling_mode_letter_names
  - name: normalize
    rules:
      - normalize_schwa
      - normalize_velar_nasal
      - normalize_wh_merger
  - name: postlexical
    rules:
      - the_prevocalic_reduction
      - to_reduction
      - t_flapping
      - d_flapping
      - t_deletion
      - d_deletion
      - t_glottalization
      - palatalization_dy
      - palatalization_ty
      - glottal_stop_insertion
  - name: structural
    rules:
      - remap_stops_to_closures
      - expand_affricates_with_closure
      - expand_diphthongs
      - expand_rhotic_vowels
      - insert_mapped_voiceless_release_and_aspiration
      - insert_mapped_voiceless_release_and_aspiration_final
      - insert_mapped_voiced_release
      - insert_mapped_voiced_release_final
  - name: annotation
    rules:
      - syllable_count_annotation
      - cluster_position_annotation
      - mark_function_words
      - assign_accent
      - identify_nuclear_accent
      - assign_accent_types
      - assign_phrase_edge_tones
      - assign_initial_boundary_tone
      - assign_long_phrase_break
      - assign_punctuation_break_index
      - assign_word_boundary_break_index
  - name: duration
    rules:
      - non_word_initial_consonant_shortening
      - word_medial_consonant_shortening
      - unstressed_consonant_shortening
      - word_initial_lengthening
      - punctuation_pause
      - pause_rate_scaling
      - stress_duration
      - accent_vowel_lengthening
      - polysyllabic_shortening
      - cluster_shortening
      - vowel_shortening
      - pre_boundary_lengthening
      - speech_rate_scaling
      - duration_cap
      - fricative_minimum_duration
      - lock_stop_release_duration
      - stop_unreleasing
      - s_cluster_aspiration_reduction
      - aspiration_frication_carryover
      - duration_floor_stop_release
      - duration_floor_default
    resolve_scalars:
      - duration
  - name: formant
    after:
      - duration
    rules:
      - place_f2_locus
      - place_rel_copy
      - dark_l_allophony
      - r_f3_lowering
      - f1_stop_onset
      - burst_spectral_template
      - weak_stop_release_parallel_attenuation
      - weak_final_voiced_stop_closure_attenuation
      - vcv_coarticulation
      - vowel_reduction
      - schwa_coronal_fronting
      - uw_coronal_fronting
      - vowel_rate_undershoot
      - nasal_place_assignment
      - nasal_place_assimilation
      - nasal_windows
      - sw_explicit_override
      - sw_default_assignment
  - name: prosody
    rules:
      - accent_index_in_phrase
      - tobi_baseline_init
      - tobi_initial_boundary_high
      - tobi_accent
      - tobi_unaccented_declination
      - tobi_phrase_accent_high
      - tobi_phrase_accent_low
      - tobi_boundary_low
      - tobi_boundary_rise
      - tobi_register_reset
      - connected_speech_source_contour
      - f0_voiceless_onset_perturbation
      - f0_voiced_onset_perturbation
      - f0_continuation_rise
  - name: finalize
    after:
      - duration
      - prosody
    rules: []
    compute_times: true
    resolve_points:
      - F0Point
