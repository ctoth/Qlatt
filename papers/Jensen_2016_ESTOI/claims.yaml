- id: claim38
  type: equation
  expression: S(k, m) = \sum_{n=0}^{N'-1} s(mD + n) w(n) e^{-j2\pi kn/N'}
  provenance:
    paper: Jensen_2016_ESTOI
    page: 0
- id: claim39
  type: equation
  expression: S_j(m) = \sqrt{\sum_{k \in CB_j} |S(k,m)|^2}, \quad j = 1, \ldots, J
  provenance:
    paper: Jensen_2016_ESTOI
    page: 0
- id: claim40
  type: equation
  expression: S_m = \begin{bmatrix} S_1(m-N+1) & \cdots & S_1(m) \\ \vdots & & \vdots
    \\ S_J(m-N+1) & \cdots & S_J(m) \end{bmatrix}
  provenance:
    paper: Jensen_2016_ESTOI
    page: 0
- id: claim41
  type: equation
  expression: s_{j,m} = [S_j(m-N+1) \; S_j(m-N+2) \cdots S_j(m)]^T
  provenance:
    paper: Jensen_2016_ESTOI
    page: 0
- id: claim42
  type: equation
  expression: \bar{s}_{j,m} = \frac{1}{\|(s_{j,m} - \mu_{s_{j,m}} \mathbf{1})\|} (s_{j,m}
    - \mu_{s_{j,m}} \mathbf{1}) \tag{1}
  provenance:
    paper: Jensen_2016_ESTOI
    page: 0
- id: claim43
  type: equation
  expression: \mu_{s_{j,m}} = \frac{1}{N} \sum_{m'=0}^{N-1} S_j(m - m') \tag{2}
  provenance:
    paper: Jensen_2016_ESTOI
    page: 0
- id: claim44
  type: equation
  expression: \bar{S}_m = \begin{bmatrix} \bar{s}_{1,m}^T \\ \vdots \\ \bar{s}_{J,m}^T
    \end{bmatrix}
  provenance:
    paper: Jensen_2016_ESTOI
    page: 0
- id: claim45
  type: equation
