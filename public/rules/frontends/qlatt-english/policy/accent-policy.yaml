version: v1

# Canonical accent-carrier policy for the current broad-focus frontend.
#
# The function-word membership list moved to pipeline.yaml `string_sets`
# (`function_words`) as the single source of truth — it is consumed
# declaratively by the `mark_function_words` annotation rule via
# `lower(current.word) in sets.function_words`. This policy now only carries the
# accent-assignment rule (which stress/word-class combination is accentable).
# Citations:
# - O'Shaughnessy 1976
# - Allen 1987
citations:
  - O'Shaughnessy 1976
  - Allen 1987

accent_assignment:
  require_content_word: true
  required_stress: 1
  carrier_selection: first_primary_stress
