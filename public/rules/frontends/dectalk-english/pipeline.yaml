    scalars:
      # A duration is a whole number of DECtalk frames times the frame period,
      # set once per allophone by dectalk_allophone_duration; nothing rounds or
      # floors it afterwards. ph_defs.h NF640MS = 100 frames is the longest.
      duration: { unit: ms, max: 640 }
