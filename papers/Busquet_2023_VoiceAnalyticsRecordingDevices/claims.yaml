- id: claim12
  type: observation
  statement: High-proximity microphones (headset, lavalier at <20 cm) must produce
    higher amplitude measurements than a studio microphone at 60 cm for the same speaker
    and utterance
  concepts: []
  provenance:
    paper: Busquet_2023_VoiceAnalyticsRecordingDevices
    page: 0
- id: claim13
  type: observation
  statement: Smartphone built-in microphones should show systematically inflated f0
    (~5-12 Hz) compared to external microphones for the same speaker
  concepts: []
  provenance:
    paper: Busquet_2023_VoiceAnalyticsRecordingDevices
    page: 0
- id: claim14
  type: observation
  statement: Cross-device f0 correlations should be high (r > .85) for all device
    pairs
  concepts: []
  provenance:
    paper: Busquet_2023_VoiceAnalyticsRecordingDevices
    page: 0
- id: claim15
  type: observation
  statement: Cross-device amplitude correlations should be high (r > .90) except for
    lavalier vs. other devices (r ~ .64-.68)
  concepts: []
  provenance:
    paper: Busquet_2023_VoiceAnalyticsRecordingDevices
    page: 0
- id: claim16
  type: observation
  statement: Increasing the proportion of high-proximity device recordings in a mixed
    dataset must reduce the detectable effect size for amplitude-based group comparisons
    (monotonically)
  concepts: []
  provenance:
    paper: Busquet_2023_VoiceAnalyticsRecordingDevices
    page: 0
- id: claim17
  type: observation
  statement: A random forest trained on device-specific features and device type should
    achieve $R^2 > .90$ for mapping amplitude back toward studio baseline
  concepts: []
  provenance:
