- id: claim21
  type: observation
  statement: '**Cue weight bias exists:** Even with psychophysically equated, equally
    informative dimensions, listeners will weight one more heavily'
  concepts: []
  provenance:
    paper: HoltLotto_2006_CueWeightingAuditoryCategorization
    page: 0
- id: claim22
  type: observation
  statement: '**Variance > informativeness for weight shifts:** Manipulating within-category
    variance produces larger cue weight changes than manipulating distribution centroids
    (informativeness)'
  concepts: []
  provenance:
    paper: HoltLotto_2006_CueWeightingAuditoryCategorization
    page: 0
- id: claim23
  type: observation
  statement: '**Passive exposure increases weight:** Exposure to variability along
    a dimension (without feedback) increases that dimension''s cue weight in subsequent
    categorization'
  concepts: []
  provenance:
    paper: HoltLotto_2006_CueWeightingAuditoryCategorization
    page: 0
- id: claim24
  type: observation
  statement: '**Weights sum to 1.0:** If one cue weight increases, the other must
    decrease proportionally'
  concepts: []
  provenance:
    paper: HoltLotto_2006_CueWeightingAuditoryCategorization
    page: 0
- id: claim25
  type: observation
  statement: '**Accuracy tracks informativeness:** More overlap in distributions leads
    to lower categorization accuracy'
  concepts: []
  provenance:
    paper: HoltLotto_2006_CueWeightingAuditoryCategorization
    page: 0
- id: claim26
  type: observation
  statement: '**RT tracks cue weight:** Faster reaction times for stimuli varying
    along the more heavily weighted dimension'
  concepts: []
  provenance:
    paper: HoltLotto_2006_CueWeightingAuditoryCategorization
    page: 0
