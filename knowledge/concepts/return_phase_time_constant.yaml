id: speech_0005
canonical_name: return_phase_time_constant
status: proposed
definition: Effective duration of the return phase after glottal closure in the LF
  model. Controls spectral tilt via the relationship Fa = 1/(2*pi*Ta). Larger Ta produces
  more spectral tilt (breathier voice).
