name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the production build for the Pages deployment job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the workspace with only the host target installed
        run: |
          installed_targets=$(rustup target list --installed)
          if [[ "$installed_targets" == *wasm32-unknown-unknown* ]]; then
            rustup target remove wasm32-unknown-unknown
          fi
          cargo test --workspace

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev

      - run: npm run check

      - run: npm run typecheck

      - run: rustup target add wasm32-unknown-unknown

      # The cached file is the native binary that build:only copies out of
      # target/release; load-native.cjs loads it in preference to any prebuilt one.
      - name: Key the node-web-audio-api build
        id: node-web-audio-api
        run: |
          source=$(node -p "require('./package-lock.json').packages['node_modules/node-web-audio-api'].resolved.split('/').pop()")
          rust=$(rustc --version | cut -d' ' -f2)
          echo "key=node-web-audio-api-${{ runner.os }}-${{ runner.arch }}-rust-$rust-$source" >> "$GITHUB_OUTPUT"

      - name: Restore the node-web-audio-api build
        id: node-web-audio-api-cache
        uses: actions/cache@v6
        with:
          path: node_modules/node-web-audio-api/node-web-audio-api.build-release.node
          key: ${{ steps.node-web-audio-api.outputs.key }}

      # libasound2-dev supplies the ALSA headers the build links against.
      - name: Build node-web-audio-api for the runner
        if: steps.node-web-audio-api-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install --yes libasound2-dev
          printf '\n[workspace]\n' >> node_modules/node-web-audio-api/Cargo.toml
          npm --prefix node_modules/node-web-audio-api run build:only

      - run: bash build.sh

      - run: npm test

      - run: npm run build

      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
