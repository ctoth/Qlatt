version: v13-cel
inventory_path: /rules/frontends/dectalk-english/inventory.yaml
lts_path: /rules/frontends/dectalk-english/lts-rules.yaml
skip_dictionary: true
include:
  - pipeline.yaml
  - phases/structural.yaml
  - phases/duration.yaml
  - phases/formant.yaml
  - phases/prosody.yaml
f0_model:
  type: layered_additive
  # DECtalk's clause loop advances in 6.4 ms synthesis/control frames.
  # Citation: DECtalk 4.63 ph_claus.c ("For each 6.4 msec frame of current clause")
  frame_period_sec: 0.0064
  citations:
    - "Fujisaki (command-response model: additive phrase + accent layers)"
    - "Klatt 1982 (hat-pattern: baseline + hat + stress + segmental)"
    - "Rabiner 1968 (three-component: archetypal + stress + consonant)"
  filter:
    type: lowpass_1pole
    # Generic first-order low-pass smoothing. For DECtalk 4.63 this uses the
    # speaker's native F0 smoothing coefficient directly, normalized to [0, 1].
    # Citation: DECtalk 4.63 Ph_drwt02.c filter_commands()
    alpha_param: policy.speaker.f0_lp_filter_alpha.value
    default_alpha: 0.5126953125
  layers:
    baseline:
      type: profile
    hat:
      type: persistent
    stress:
      type: impulse
      decay: halving
    boundary:
      type: impulse
      decay: halving
  combine: sum
  # Speaker scaling: converts internal Hz*10 units to final Hz using the
  # DECtalk formula (Ph_drwt02.c line 2309):
  #   f0prime = f0minimum + frac4mul(f0prime - 1300, f0scalefac)
  #   Hz = f0prime / 10
  # The minimum_param and range_param reference fields in parameters.policy.speaker.
  # Citation: DECtalk 4.63 Ph_drwt02.c (speaker-dependent F0 scaling)
  speaker_scale:
    minimum_param: f0_minimum
    range_param: f0_scale_factor
    reference: 1300
parameters:
  policy:
    duration:
      rate_scale: 1.0
      # Qlatt's frontend API already passes a normalized rate multiplier
      # (textToKlattTrack options.rate), not DECtalk's raw WPM control value.
      # Keep the reference at 1.0 so UI sliders and script callers behave as
      # documented; DECtalk WPM mapping belongs in an adapter layer instead.
      # Engineering boundary: multiplier normalization happens before frontend rules.
      rate_reference: 1.0
      vot_target_ms:
        p: 58
        t: 70
        k: 80
      voiceless_vot_base_ms: 60
      voiceless_vot_unstressed_ms: 7
      voiceless_vot_s_cluster_ms: 15
      voiceless_vot_sonorant_consonant_bonus_ms: 5
      # DECtalk 4.63 p_us_st1.c Special Rule 2:
      # PAP.pspesh defaults to 48 dB, rises to 50 dB before non-front targets,
      # drops by 3 dB when the following sonorant is unstressed, and rises by
      # 5 dB when the following sonorant is a consonant (/r, l, m, n, w, y/).
      voiceless_vot_aspiration_front_db: 48
      voiceless_vot_aspiration_nonfront_db: 50
      voiceless_vot_aspiration_unstressed_reduction_db: 3
      voiceless_vot_aspiration_sonorant_bonus_db: 5
      # DECtalk 4.63 p_us_st1.c: dummy-vowel release into silence reduces burst
      # amplitudes by 3 dB and aspiration by 6 dB.
      dummy_vowel_burst_reduction_db: 3
      dummy_vowel_aspiration_reduction_db: 6
      # DECtalk 4.63 p_us_st1.c: open-glottis interval widens B1/B2 by +250/+70 Hz.
      open_glottis_b1_widen_hz: 250
      open_glottis_b2_widen_hz: 70
      vot_split_fallback_share: 0.5
      weak_release_min_ms: 15
      weak_release_scale: 0.5
      weak_release_amplitude_reduction_db: 10
      stress_secondary_level: 2
      pause_comma_ms: 150
      pause_period_ms: 300
      pause_clause_initial_ms: 32
      clause_final_lengthening_ms: 38
      clause_final_voiced_obstruent_ms: 19
      non_final_shortening: 0.70
      stress_secondary: 0.85
      stress_unstressed: 0.70
      medial_syllable_shortening: 0.85
      polysyllabic_shortening: 0.80
      non_initial_consonant_shortening: 0.85
      word_final_obstruent_lengthening_ms: 19
      unstressed_syllabic_shortening: 0.70
      unstressed_consonant_shortening: 0.70
      unstressed_glide_shortening: 0.50
      emphasis_lengthening_ms: 19
      emphasis_syllabic_extra_ms: 38
      pre_voiceless_fricative_shortening: 0.80
      pre_voiceless_plosive_shortening: 0.70
      pre_voiced_obstruent_lengthening: 1.20
      pre_nasal_shortening: 0.85
      cluster_shortening: 0.70
      post_voiceless_plosive_lengthening_ms: 19
      phrase_initial_vowel_lengthening_ms: 19
      citations:
        - "DECtalk 4.63 p_us_tim.c"
        - "DECtalk 4.63 ph_defs.h (NF*MS constants)"
    f0:
      # All F0 policy values are in DECtalk internal units (Hz*10), matching
      # the values used by Ph_drwt02.c and ph_inton1.c.  Speaker scaling
      # converts these to final Hz via:
      #   Hz = (f0minimum + (val - 1300) * f0scalefac / 4096) / 10
      #
      # Baseline declination profile: Ph_drwt02.c f0basetypes[0][] (declarative).
      # 17 equidistant points spanning the utterance duration.
      baseline_declarative:
        - 1157
        - 1145
        - 1139
        - 1127
        - 1113
        - 1109
        - 1095
        - 1082
        - 1079
        - 1065
        - 1053
        - 1040
        - 1038
        - 1024
        - 980
        - 952
        - 863
      # Hat rise (internal Hz*10 units).
      # Paul: HR=18, general path -> size_hat_rise = HR*10 = 180.
      hat_rise_hz: 180
      # Final fall below baseline at declarative sentence end (internal Hz*10).
      # Source: ph_inton1.c F0_FINAL_FALL = 180.
      final_fall_hz: 180
      # DECtalk 4.63 ph_inton1.c Rule 3:
      # hat fall starts dur - 180 ms from the stressed vowel onset, with a
      # minimum onset delay of 25 ms.
      hat_fall_early_offset_ms: 180
      hat_fall_min_delay_ms: 25
      # DECtalk 4.63 ph_inton1.c Rule 3:
      # if sonorants follow the nucleus, delay the fall by 90 ms instead.
      hat_fall_following_sonorant_delay_ms: 90
      # Non-final clause boundary fall (internal Hz*10).
      # Source: ph_inton1.c F0_NON_FINAL_FALL = 150.
      non_final_fall_hz: 150
      # Comma boundary fall (internal Hz*10).
      # Source: ph_inton1.c F0_COMMA_FALL = 120.
      comma_fall_hz: 120
      # Question boundary fall (internal Hz*10).
      # Source: ph_inton1.c F0_QSYLL_FALL = 80.
      question_fall_hz: 80
      # Stress impulse magnitudes (internal Hz*10 units).
      # Source: ph_inton1.c f0_mstress_level[] = {1, 71, 31, 281}.
      stress_level_primary_hz: 71
      stress_level_secondary_hz: 31
      stress_level_emphasis_hz: 281
      # Fixed phrase-position impulse component (internal Hz*10 units).
      # Simplified from f0_mphrase_position[] = {140,90,60,40,10,10,10}.
      # Using average of first 4 positions: (140+90+60+40)/4 = 82.5.
      stress_phrase_position_hz: 82.5
      # Stress impulse duration in native DECtalk control frames.
      # The source IMPULSE path is a longer step-plus-ramp; Qlatt keeps a
      # 20-frame declarative approximation here. # engineering approximation
      stress_impulse_duration_frames: 20
      citations:
        - "DECtalk 4.63 ph_inton1.c (hat-pattern F0 model)"
        - "DECtalk 4.63 Ph_drwt02.c (baseline profiles, speaker scaling)"
        - "Klatt 1982 (hat-pattern: baseline + hat + stress + segmental)"
    source_contour:
      # Fant 1997 Fig. 10 contour defaults for connected speech source dynamics.
      ee_onset_rise_sec:
        value: 0.05
        citations:
          - Fant 1997 (connected-speech source contour onset rise)
      ee_onset_rise_db:
        value: 1.0
        citations:
          - Fant 1997 (phrase-initial source effort rise)
      ee_declination_db_per_sec:
        value: 2.0
        citations:
          - Fant 1997 (connected-speech declination slope)
      ee_final_fall_db_per_sec:
        value: 6.0
        citations:
          - Fant 1997 (enhanced phrase-final source fall)
      ee_final_window_min_sec:
        value: 0.3
        citations:
          - Fant 1997 (terminal source-fall window lower bound)
      ee_final_window_max_sec:
        value: 0.5
        citations:
          - Fant 1997 (terminal source-fall window upper bound)
      ee_final_window_ratio:
        value: 0.35
        citations:
          - Fant 1997 (terminal source window scales with phrase duration)
      rd_final_offset:
        value: 0.18
        citations:
          - Fant 1997 (phrase-final Rd softening companion to Ee fall)
          - Hanson et al. 2001 (phrase-final spectral tilt and nonmodal events motivate increased final softness)
    formant:
      coarticulation_weight: 0.3
      transition_time_ms: 30
      # DECtalk 4.63 p_us_st1.c Special Rule 2:
      # PAP.pspesh = 52 for onset of a voiced non-obstruent from silence or
      # a voiceless open-vocal-tract fricative (/f, th, s, sh/), with a
      # 40 ms backward smoothing span.
      voiceless_open_tract_breathy_onset_ms: 40
      voiceless_open_tract_breathy_onset_db: 52
      # DECtalk 4.63 p_us_st1.c backward smoothing uses a boundary value of
      # target-10 dB when source amplitude is increasing.
      source_onset_boundary_drop_db: 10
      # DECtalk 4.63 p_us_st1.c keeps voicing onset non-abrupt after a voiced
      # fricative. The original code uses the normal source-smoothing path;
      # Qlatt approximates that with a 40 ms prefix window. # engineering approximation
      voiced_fricative_voicing_onset_ms: 40
      # DECtalk 4.63 p_us_st1.c backward smoothing:
      # a syllabic voiced non-nasal segment offsets into silence with a long
      # breathy tail (PAP.pspesh = 52, NF130MS).
      vowel_breathy_offset_ms: 130
      vowel_breathy_offset_db: 52
      # DECtalk 4.63 p_us_st1.c special hack for /th, dh/:
      # fric gains are suppressed until durfon - 3, leaving only a weak final
      # frication tail. Qlatt models this as a 30 ms suffix window at the
      # 100 Hz frame cadence used by the runtime. # engineering approximation
      weak_interdental_fricative_tail_ms: 30
      citations:
        - "DECtalk 4.63 ph_setar.c"
        - "DECtalk 4.63 p_us_st1.c (source-amplitude special rules)"
    speaker:
      base_f0_hz:
        value: 122
        citations: ["DECtalk 4.63 Paul default AP"]
      formant_scale:
        value: 1.0
        citations: ["DECtalk 4.63 Paul male"]
      rd_default:
        value: 0.7
        citations: ["DECtalk 4.63 Paul BR=0, male base 0.7"]
      spectral_tilt_offset_db:
        value: 0
        citations: ["DECtalk 4.63 Paul BR=0"]
      f0_minimum:
        value: 1100
        citations: ["DECtalk 4.63 Paul (AP-12)*10, ph_vset.c general path"]
      f0_scale_factor:
        value: 4100
        citations: ["DECtalk 4.63 Paul PR*41, ph_vset.c"]
      f0_lp_filter:
        value: 2100
        citations: ["DECtalk 4.63 Paul 1500+15*QU, ph_vset.c general path"]
      f0_lp_filter_alpha:
        value: 0.5126953125
        citations: ["DECtalk 4.63 Ph_drwt02.c filter coefficient 2100/4096 (Paul)"]
      hat_rise_hz10:
        value: 180
        citations: ["DECtalk 4.63 Paul HR*10, ph_vset.c general path"]
      scale_str_rise:
        value: 32
        citations: ["DECtalk 4.63 Paul SR direct"]
      assertiveness:
        value: 2870
        citations: ["DECtalk 4.63 Paul AS*41, ph_vset.c"]
      baseline_fall_hz10:
        value: 180
        citations: ["DECtalk 4.63 Paul BF*10"]
output:
  blend:
    default_weight: 0.5
  min_duration:
    default: 30
  transition_ms: 30
  final_silence_ms: 100
transcription:
  diagnostic_symbols:
    aa: [AA1]
    ae: [AE1]
    ah: [AH1]
    ao: [AO1]
    aw: [AW1]
    ay: [AY1]
    b: [B]
    ch: [CH]
    d: [D]
    dh: [DH]
    eh: [EH1]
    el: [EL]
    en: [EN]
    er: [ER1]
    ey: [EY1]
    f: [F]
    g: [G]
    gs: [GS]
    hh: [HH]
    ih: [IH1]
    iy: [IY1]
    jh: [JH]
    k: [K]
    l: [L]
    m: [M]
    n: [N]
    ng: [NG]
    ow: [OW1]
    oy: [OY1]
    p: [P]
    r: [R]
    s: [S]
    sh: [SH]
    t: [T]
    th: [TH]
    uh: [UH1]
    uw: [UW1]
    v: [V]
    w: [W]
    y: [Y]
    z: [Z]
    zh: [ZH]
  punctuation_tokens: [",", ".", "?", "!", ";", ":"]
