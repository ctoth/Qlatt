source:
  paper: Henrich_2001_SpectralOqAsymmetry
claims:
- id: claim_0050
  type: observation
  statement: 'H1*-H2* is NOT a reliable measure of open quotient alone. For the LF
    model, H1*-H2* depends jointly on both open quotient and asymmetry coefficient.
    Only KLGLOTT88 (with fixed alpha_m = 2/3) gives a unique Oq-to-H1*-H2* mapping.

    '
  concepts:
  - speech_0012
  - speech_0002
  - speech_0011
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 2
    figure: Fig 3
- id: claim_0051
  type: parameter
  concept: speech_0012
  value: 2.5
  unit: dB
  conditions:
  - open_quotient >= 0.2
  - open_quotient <= 0.9
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 2
    figure: Fig 3
  lower_bound: -5.0
  upper_bound: 10.0
- id: claim_0052
  type: observation
  statement: 'Experimental H1*-H2* measurements in singing range from -30 to +20 dB,
    far exceeding any glottal flow model''s predicted range of approximately -5 to
    +15 dB. This suggests source/filter interaction or model inadequacy.

    '
  concepts:
  - speech_0012
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 3
    figure: Fig 6
- id: claim_0053
  type: observation
  statement: 'At any fixed asymmetry coefficient, increasing open quotient increases
    H1*-H2*. At any fixed open quotient, increasing asymmetry coefficient decreases
    H1*-H2*.

    '
  concepts:
  - speech_0012
  - speech_0002
  - speech_0011
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 2
    section: Testable Properties
