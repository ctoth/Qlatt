version: v12-cel
parameters:
  policy:
    duration:
      vot_target_ms:
        p:
          value: 58
          citations:
            - Lisker & Abramson 1964
        t:
          value: 70
          citations:
            - Lisker & Abramson 1964
        k:
          value: 80
          citations:
            - Lisker & Abramson 1964
      vot_split_fallback_share:
        value: 0.5
        citations:
          - Allen et al. 1987 Table C-1
      weak_release_min_ms:
        value: 15
        citations:
          - Allen et al. 1987 Table C-1
      weak_release_scale:
        value: 0.5
        citations:
          - Allen et al. 1987 Table C-1
      stress_primary_multiplier:
        value: 1.3
        citations:
          - Klatt 1976 §III.B
      stress_unstressed_multiplier:
        value: 0.8
        citations:
          - Klatt 1976 §III.B
      punctuation_pause_comma_ms:
        value: 150
        citations:
          - Allen et al. 1987 Ch.8
      punctuation_pause_phrase_break_ms:
        value: 200
        citations:
          - Allen et al. 1987 Ch.8
          - >-
            Engineering estimate: semicolon/colon pause is typically stronger than comma and weaker than terminal
            punctuation
      punctuation_pause_terminal_ms:
        value: 300
        citations:
          - Allen et al. 1987 Ch.8
      vowel_shortening_end_multiplier:
        value: 1.2
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiced_fricative_multiplier:
        value: 1.6
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiced_stop_multiplier:
        value: 1.2
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_nasal_multiplier:
        value: 0.85
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiceless_stop_multiplier:
        value: 0.7
        citations:
          - Allen et al. 1987 Ch.9
      pre_boundary_terminal_multiplier:
        value: 1.4
        citations:
          - Klatt 1976 §III.A
          - Crystal & House 1988
      pre_boundary_terminal_obstruent_multiplier:
        value: 1.15
        citations:
          - Crystal & House 1988
          - "Engineering estimate: obstruents show weaker phrase-final lengthening than sonorants/vowels"
      pre_boundary_word_multiplier:
        value: 1.1
        citations:
          - Klatt 1976 §III.A
      s_cluster_aspiration_ms:
        value: 10
        citations:
          - Lisker & Abramson 1964
          - Zue 1976
      s_cluster_ah_reduction_db:
        value: 10
        citations:
          - Zue 1976
      non_word_initial_consonant_multiplier:
        value: 0.7
        citations:
          - Klatt 1976 Table III
      unstressed_consonant_multiplier:
        value: 0.8
        citations:
          - Klatt 1976 Table III
      word_initial_lengthening_multiplier:
        value: 1.2
        citations:
          - White 2014
      fricative_min_sibilant_ms:
        value: 30
        citations:
          - Jongman 1989
      fricative_min_labiodental_ms:
        value: 50
        citations:
          - Jongman 1989
      fricative_min_dental_ms:
        value: 60
        citations:
          - Jongman 1989
      fricative_min_glottal_ms:
        value: 40
        citations:
          - Engineering estimate (Jongman 1989 does not test glottal /hh/)
      vowel_vl_stop_shortening_phrasefinal_ms:
        value: -45
        citations:
          - Klatt 1976 Table I
      vowel_vl_stop_shortening_other_ms:
        value: -15
        citations:
          - Klatt 1976 Table I
      word_medial_consonant_multiplier:
        value: 0.85
        citations:
          - Klatt 1976 Table III
      stop_unreleasing_min_ms:
        value: 5
        citations:
          - Crystal & House 1988
          - Miller 1998
    f0:
      base_hz:
        value: 110
        citations:
          - O'Shaughnessy 1976
      fall_rate_hz:
        value: 20
        citations:
          - O'Shaughnessy 1976
      declination_floor_ratio:
        value: 0.6
        citations:
          - O'Shaughnessy 1976
      stress_rise:
        value: 1.15
        citations:
          - O'Shaughnessy 1976
      question_rise_hz:
        value: 30
        citations:
          - O'Shaughnessy 1976
      question_rise_ratio:
        value: 1.2
        citations:
          - O'Shaughnessy 1976
      question_target_floor_hz:
        value: 170
        citations:
          - O'Shaughnessy 1976
      question_target_ceiling_hz:
        value: 190
        citations:
          - O'Shaughnessy 1976
      voiceless_onset_raise:
        value: 1.2
        citations:
          - "O'Shaughnessy 1976 (synthesis rule: +20% F0 after voiceless onset)"
          - >-
            Hombert et al. 1979 (empirical: ~8% perturbation; 1.2 follows O'Shaughnessy's synthesis heuristic, not
            Hombert's measured value)
      voiced_onset_lower:
        value: 0.95
        citations:
          - O'Shaughnessy 1976
      continuation_rise_hz:
        value: 8
        citations:
          - O'Shaughnessy 1976
      continuation_minor_rise_hz:
        value: 5
        citations:
          - O'Shaughnessy 1976
          - "Engineering estimate: semicolon/colon continuation rise is milder than comma rise"
      question_base_hz:
        value: 125
        citations:
          - O'Shaughnessy 1976
      question_scan_window_tokens:
        value: 30
        citations:
          - Pierrehumbert 1980
          - Ladd 2008 Ch.5
          - "Engineering estimate: token scan window for detecting upcoming question boundary"
      question_last_stress_lookback_tokens:
        value: 12
        citations:
          - O'Shaughnessy 1976
          - Ladd 2008 Ch.5
          - "Engineering estimate: lookback window for placing pre-boundary question-rise onset"
    formant:
      bilabial_f2_locus:
        value: 1200
        citations:
          - Stevens & House 1956 (locus varies 700-1500 Hz by vowel context)
          - Allen et al. 1987 Ch.11 (1200 Hz midpoint approximation)
      alveolar_f2_locus:
        value: 1800
        citations:
          - Stevens & House 1956
          - Allen et al. 1987 Ch.11
      alveolar_f2_locus_front:
        value: 1900
        citations:
          - Stevens & House 1956
      alveolar_f2_locus_back:
        value: 1700
        citations:
          - Stevens & House 1956
      nasal_fnz_m:
        value: 900
        citations:
          - Stevens 1998 Ch.10 (nasal consonant oral cavity zeros)
          - Fujimura 1962 (nasal consonant antiresonances by place)
      nasal_fnz_n:
        value: 1700
        citations:
          - Stevens 1998 Ch.10 (nasal consonant oral cavity zeros)
          - Fujimura 1962 (nasal consonant antiresonances by place)
      nasal_fnz_ng:
        value: 2800
        citations:
          - Stevens 1998 Ch.10 (nasal consonant oral cavity zeros)
          - Fujimura 1962 (nasal consonant antiresonances by place)
      dark_l_f2:
        value: 900
        citations:
          - Sproat & Fujimura 1993 (dark /l/ F2 ~800-1000 Hz)
          - Recasens 2012 (American English dark /l/ mean F2 ~860-900 Hz)
      dark_l_f3:
        value: 2400
        citations:
          - Recasens 2012
      r_f3_onset:
        value: 1600
        citations:
          - Espy-Wilson 2000
      r_f3_coda:
        value: 1400
        citations:
          - Espy-Wilson 2000
      f1_release_labial:
        value: 250
        citations:
          - Stevens 1998 Ch.8
      f1_release_alveolar:
        value: 300
        citations:
          - Stevens 1998 Ch.8
      f1_release_velar:
        value: 280
        citations:
          - Stevens 1998 Ch.8
      vowel_reduction_schwa_f1:
        value: 500
        citations:
          - Peterson & Barney 1952
      vowel_reduction_schwa_f2:
        value: 1500
        citations:
          - Peterson & Barney 1952
      vowel_reduction_rate:
        value: 0.4
        citations:
          - Allen et al. 1987 Ch.9
      nasalization_b1_multiplier:
        value: 2
        citations:
          - Chen 1997
      palatal_f2_locus:
        value: 2600
        citations:
          - Stevens & House 1956
          - Allen et al. 1987 Ch.11
      palatal_f2_back_vowel:
        value: 2400
        citations:
          - Stevens & House 1956
          - Allen et al. 1987 Ch.11
      vcv_coarticulation_rate:
        value: 0.3
        citations:
          - Ohman 1966
predicates:
  is_question_boundary: current.phoneme == 'SIL' && current.punctuationSymbol == '?'
  is_stressed_vowel: current.type == 'vowel' && has(current.stress) && current.stress == 1
streams:
  phone:
    type: base
    features:
      type:
        - vowel
        - stop
        - stop_closure
        - stop_release
        - stop_aspiration
        - fricative
        - affricate
        - silence
        - liquid
        - nasal
        - glide
    scalars:
      duration:
        unit: ms
        resolution: klatt
        max: 500
  f0:
    type: point
    value_type: number
    unit: Hz
phases:
  - name: postlexical
    rules:
      - the_prevocalic_reduction
      - t_flapping
  - name: structural
    rules:
      - remap_stops_to_closures
      - expand_diphthongs
      - insert_voiceless_stop_release_and_aspiration
      - insert_voiceless_stop_release_and_aspiration_final
      - insert_voiced_stop_release
      - insert_voiced_stop_release_final
  - name: duration
    rules:
      - k_context_cl_f2
      - k_context_rel_copy
      - bilabial_f2_locus
      - bilabial_rel_copy
      - alveolar_f2_locus
      - alveolar_rel_copy
      - palatal_f2_locus
      - nasal_antiformant_by_place
      - nasal_place_assimilation
      - dark_l_allophony
      - r_f3_lowering
      - f1_stop_onset
      - burst_spectral_template
      - vcv_coarticulation
      - vowel_reduction
      - anticipatory_nasalization
      - non_word_initial_consonant_shortening
      - word_medial_consonant_shortening
      - unstressed_consonant_shortening
      - word_initial_lengthening
      - punctuation_pause
      - stress_duration
      - vowel_shortening
      - vowel_before_voiceless_stop_shortening
      - pre_boundary_lengthening
      - fricative_minimum_duration
      - lock_stop_release_duration
      - stop_unreleasing
      - s_cluster_aspiration_reduction
      - sw_explicit_override
      - sw_default_assignment
    resolve_scalars:
      - duration
  - name: prosody
    rules:
      - f0_baseline_start
      - f0_question_baseline_raise
      - f0_pitch_reset
      - f0_targets
      - f0_voiceless_onset_perturbation
      - f0_voiced_onset_perturbation
      - f0_stress_peak
      - f0_continuation_rise
      - f0_question_rise_onset
      - f0_question_rise
  - name: finalize
    after:
      - duration
      - prosody
    rules: []
    compute_times: true
    resolve_points:
      - f0
include:
  - rules/postlexical.yaml
  - rules/structural.yaml
  - rules/duration.yaml
  - rules/formant.yaml
  - rules/prosody.yaml
output:
  blend:
    factor: 0.35
    keys:
      - F1
      - F2
      - F3
      - B1
      - B2
      - B3
    smooth_types:
      - vowel
      - nasal
      - liquid
      - glide
    citations:
      - Ohman 1966 (VCV coarticulation model)
  min_duration:
    stop_release_ms: 5
    default_ms: 20
    citations:
      - Allen et al. 1987 Ch.8
  transition_ms: 30
  final_silence_ms: 100
transcription:
  diagnostic_symbols:
    b:
      - B
    ch:
      - CH
    d:
      - D
    dh:
      - DH
    f:
      - F
    g:
      - G
    hh:
      - HH
    jh:
      - JH
    k:
      - K
    l:
      - L
    m:
      - M
    "n":
      - "N"
    ng:
      - NG
    p:
      - P
    r:
      - R
    s:
      - S
    sh:
      - SH
    t:
      - T
    th:
      - TH
    v:
      - V
    w:
      - W
    "y":
      - "Y"
    z:
      - Z
    zh:
      - ZH
  punctuation_tokens:
    - ","
    - .
    - "?"
    - "!"
    - ;
    - ":"
