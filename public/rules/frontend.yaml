        value: 0.85
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiceless_stop_multiplier:
        value: 0.7
        citations:
          - Allen et al. 1987 Ch.9
      pre_boundary_terminal_multiplier:
        value: 1.4
        citations:
          - Klatt 1976 §III.A
      pre_boundary_word_multiplier:
        value: 1.1
        citations:
          - Klatt 1976 §III.A
      s_cluster_aspiration_ms:
        value: 10
        citations:
          - Lisker & Abramson 1964
          - Zue 1976
      s_cluster_ah_reduction_db:
        value: 10
        citations:
          - Zue 1976
      non_word_initial_consonant_multiplier:
        value: 0.7
        citations:
          - Klatt 1976 Table III
      unstressed_consonant_multiplier:
        value: 0.8
        citations:
