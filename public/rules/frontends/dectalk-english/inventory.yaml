  # Retroflex /r/ vowel (US_RR).  Target from DECtalk us_maltar[] (steady portion
  # of the RR diphthong: F1 450->390, F2/F3 steady 1320/1540) and us_mindur[]
  # (inherent 180 / minimum 90).  RR is the vowel produced by AX+R fusion ("letter",
  # "actor" -> ...RR) and by the A5 R-before-syllabic rewrite; it is a syllabic
  # rhotic, hence type: vowel + rhotic: true (like ER/AR/...).  No stress variant:
  # AX is the reduced schwa and RR inherits its unstressed quality.
