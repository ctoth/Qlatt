tags:
  boundary: adjusts a segment at a prosodic boundary
  clause_final: lengthens a phrase-final segment
  cluster: adjusts a consonant in a cluster
  coarticulation: blends neighboring articulatory targets
  consonant_position: adjusts duration by consonant position
  consonant_stress: adjusts a consonant beside a stressed vowel
  word_initial_consonant: marks a consonant before its word's first syllabic
  rime_boundary: records the type of the boundary that follows a final rime
  postvocalic_lateral: selects the postvocalic allophone of a lateral
  duration_floor: enforces a segment-duration floor
  emphasis: strengthens an emphasized segment
  emphasis_syllabic: strengthens the syllabic portion of an emphasized word
  fallback_primary_stress: assigns primary stress when none is present
  fricative_spectrum: shapes a fricative-noise spectrum
  function_word_th: reduces the function-word pronunciation of th
  medial_syllable: adjusts a word-medial syllable
  nasal_bandwidth: widens formant bandwidth beside a nasal
  non_final: shortens a non-final segment
  nt_cluster: adjusts an alveolar stop in an nt cluster
  phrase_initial: adjusts a phrase-initial segment
  polysyllabic: adjusts duration in a polysyllabic word
  post_plosive: adjusts a segment following a plosive
  pre_df_flap: adjusts a vowel before an eligible flap
  pre_ng: adjusts a vowel before a velar nasal
  pre_voiced: adjusts a segment before a voiced consonant
  pre_voiceless: adjusts a segment before a voiceless consonant
  rate: scales timing for speaking rate
  segmental_context: adjusts a target from its neighboring segments
  short_phrase: adjusts a segment in a short phrase
  silence_boundary: shapes source parameters at silence
  source_contour: shapes phrase-level source parameters
  source_routing: selects the voiced or noise source route
  stress: adjusts a stressed or unstressed segment
  syllabification: records syllable structure for downstream rules
  the_iy: selects the full-vowel pronunciation of the
  two_vowel: adjusts a word containing two vowels
  unstressed: reduces an unstressed segment
  unstressed_floor: enforces the duration floor of an unstressed segment
  word_final_obstruent: adjusts a word-final obstruent
  word_initial_stressed: adjusts a stressed word-initial segment
  timing_setup: starts an allophone's duration state from its inherent values
  schwa_by_flap: lengthens a reduced vowel beside a flap or h
  adjacent_nasals: lengthens a nasal after a different nasal
  retroflex_minimum: keeps a retroflex vowel above its minimum length
  allophone_duration: sets a segment's duration from its allophone's frame count
