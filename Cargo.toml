[workspace]
members = [
  "crates/klatt-wasm-common",
  "crates/resonator",
  "crates/antiresonator",
  "crates/lf-source",
  "crates/signal-switch",
  "crates/edge-detector",
  "crates/decay-envelope",
  "crates/square-source",
  "crates/triangular-source",
  "crates/impulsive-source",
  "crates/tilt-filter",
  "crates/pitch-sync-mod",
  "crates/oversampled-glottal-source",
  "crates/fujisaki-resonator",
  "crates/aerodynamic-model",
  "crates/biquad-notch",
  "crates/dynamics-compressor",
  "crates/reconstruction-filter",
  "crates/f0-filters",
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Audio and control filters are hot for every rendered sample/frame. Keep the
# workspace's size-first WASM default for other primitives, but let these
# measured kernels use the speed optimizer.
[profile.release.package.antiresonator]
opt-level = 3

[profile.release.package.biquad-notch]
opt-level = 3

[profile.release.package.reconstruction-filter]
opt-level = 3

[profile.release.package.f0-filters]
opt-level = 3
