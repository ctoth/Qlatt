- id: claim12
  type: equation
  expression: 'U''_g(t) = \begin{cases}

    -E_e \dfrac{e^{\alpha t} \sin(\omega_g(t + T_e))}{\sin \omega_g T_e} & -T_e \leq
    t < 0 \\[2ex]

    -E_e \dfrac{e^{-\varepsilon t} - e^{-\varepsilon T_b}}{1 - e^{-\varepsilon T_a}}
    & 0 \leq t < T_b

    \end{cases}'
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim13
  type: equation
  expression: E_0 = -E_e \cdot e^{-\alpha T_e} / \sin \omega_g T_e
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim14
  type: equation
  expression: T_a = (1 - e^{-\varepsilon T_b}) / \varepsilon
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim15
  type: equation
  expression: T_e = \frac{1 + R_k}{2 R_g f_0}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim16
  type: equation
  expression: \omega_g = 2\pi R_g f_0
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim17
  type: equation
  expression: H_{LFopen}(s) = \frac{E_e \csc \omega_g T_e \left( \cos \omega_g T_e
    - e^{(s-\alpha)T_e} \right)}{[s - (\alpha + j\omega_g)] \times [s - (\alpha -
    j\omega_g)]}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim18
  type: equation
  expression: H_{LFret}(s) = -E_e \frac{s - \varepsilon e^{-\varepsilon T_b}(1 - e^{-\varepsilon
    T_b})^{-1}(1 - e^{-sT_b})}{s(s + \varepsilon)}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim19
  type: equation
  expression: H_{LF}(s) = H_{LFopen}(s) + H_{LFret}(s)
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim20
  type: equation
  expression: A_o(f) = E_e \times \frac{\sqrt{[\text{Re}_1(f)]^2 + [\text{Im}_1(f)]^2}}{\sqrt{\alpha^2
    + (2\pi f - \omega_g)^2} \sqrt{\alpha^2 + (2\pi f + \omega_g)^2}}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim21
  type: equation
  expression: \text{Re}_1(f) = \omega_g \left( \cot \omega_g T_e - e^{-\alpha T_e}
    \frac{\cos 2\pi f T_e}{\sin \omega_g T_e} \right) - \alpha
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim22
  type: equation
  expression: \text{Im}_1(f) = 2\pi f - \omega_g e^{-\alpha T_e} \frac{\sin 2\pi f
    T_e}{\sin \omega_g T_e}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim23
  type: equation
  expression: \phi_o(f) = \text{atan2}(\text{Im}_1(f), \text{Re}_1(f)) - \text{atan2}(2\pi
    f - \omega_g, -\alpha) - \text{atan2}(2\pi f + \omega_g, -\alpha)
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim24
  type: equation
  expression: A_r(f) = E_e \times \frac{\sqrt{[\text{Re}_2(f)]^2 + [\text{Im}_2(f)]^2}}{2\pi
    f \sqrt{\varepsilon^2 + (2\pi f)^2}}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim25
  type: equation
  expression: \text{Re}_2(f) = \frac{\varepsilon e^{-\varepsilon T_b}}{1 - e^{-\varepsilon
    T_b}} (1 - \cos 2\pi f T_b)
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim26
  type: equation
  expression: \text{Im}_2(f) = \frac{\varepsilon e^{-\varepsilon T_b}}{1 - e^{-\varepsilon
    T_b}} \sin 2\pi f T_b - 2\pi f
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim27
  type: equation
  expression: \phi_r(f) = \text{atan2}(\text{Im}_2(f), \text{Re}_2(f)) - \text{atan2}(2\pi
    f, \varepsilon) - \frac{\pi}{2}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim28
  type: equation
  expression: A_{LF}(f) = \sqrt{A_o^2 + A_r^2 + 2 A_o A_r \cos(\phi_o - \phi_r)}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim29
  type: equation
  expression: \phi_{LF}(f) = \text{atan2}(A_o \sin \phi_o + A_r \sin \phi_r, A_o \cos
    \phi_o + A_r \cos \phi_r)
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim30
  type: equation
  expression: \text{atan2}(y, x) = \arctan\left(\frac{y}{x}\right) \cdot \text{sgn}(x)^2
    + \pi \left( \frac{1 - \text{sgn}(x)}{2} \right) \left( 1 + \text{sgn}(y) - \text{sgn}(y)^2
    \right)
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim31
  type: equation
  expression: f_k = \frac{k F_s}{N} \quad \text{for } k = 0, 1, 2, \ldots, N/2 - 1
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim32
  type: equation
  expression: \text{Normalization factor} = \frac{F_s}{N}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
- id: claim33
  type: equation
  expression: \phi_{delay} = -2\pi f \cdot t_{start,n}
  provenance:
    paper: Gobl_2021_LFModelFrequencyDomain
    page: 0
