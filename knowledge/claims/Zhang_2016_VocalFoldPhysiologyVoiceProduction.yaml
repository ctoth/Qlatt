- id: claim_0092
  type: observation
  statement: 'CQ and OQ are generally inversely correlated (CQ + OQ approximately
    1) but can decorrelate when vocal fold stiffness is very high or medial surface
    is very thin. In those cases, vocal folds vibrate but may not contact, giving
    CQ = 0 but OQ < 1.

    '
  concepts:
  - speech_0013
  - speech_0002
  provenance:
    paper: Zhang_2016_VocalFoldPhysiologyVoiceProduction
    page: 10
    section: CQ vs OQ Relationship
- id: claim_0093
  type: observation
  statement: 'Intensity is primarily controlled by subglottal pressure (nearly linear
    in dB scale), with secondary effects from medial surface thickness and vocal fold
    stiffness.

    '
  concepts:
  - speech_0018
  - speech_0004
  provenance:
    paper: Zhang_2016_VocalFoldPhysiologyVoiceProduction
    page: 8
    section: Intensity Control
- id: claim_0094
