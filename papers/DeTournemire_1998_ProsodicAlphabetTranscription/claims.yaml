- id: claim11
  type: observation
  statement: '**Elasticity uniformity**: Within non-final syllables, segments should
    be lengthened/shortened by approximately the same z-score k, regardless of segment
    type'
  concepts: []
  provenance:
    paper: DeTournemire_1998_ProsodicAlphabetTranscription
    page: 0
- id: claim12
  type: observation
  statement: '**4-point F0 adequacy**: Linear interpolation through 4 syllable points
    should produce F0 contours perceptually indistinguishable from the original (verified
    by the paper at 1 Hz mean error)'
  concepts: []
  provenance:
    paper: DeTournemire_1998_ProsodicAlphabetTranscription
    page: 0
- id: claim13
  type: observation
  statement: '**Threshold robustness**: The 1/6 semitone boundaries for F0 shapes
    should produce consistent labelling across utterances of similar prosodic structure'
  concepts: []
  provenance:
    paper: DeTournemire_1998_ProsodicAlphabetTranscription
    page: 0
- id: claim14
  type: observation
  statement: '**Break-to-shape correlation**: In French declarative sentences, specific
    break types should associate predominantly with specific F0 shapes (e.g., sentence-final
    breaks with falls)'
  concepts: []
