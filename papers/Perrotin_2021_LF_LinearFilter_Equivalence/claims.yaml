  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim20
  type: equation
  expression: H_{LM_{open}}(s) = \frac{Es}{(a_{LM} - s)^2 + b_{LM}^2}
