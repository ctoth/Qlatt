version: v1
rules:
  # ==========================================================================
  # DECtalk Hat-Pattern F0 Model (Klatt 1982)
  #
  # Generates F0 layer commands for the layered additive F0 engine.
  # Five components:
  #   1. Baseline declination (profile layer) -- 17-point piecewise-linear
  #   2. Hat rise (persistent/hat layer) -- STEP at first stressed vowel
  #   3. Hat fall (persistent/hat layer) -- negative STEP at last stressed vowel
  #   4. Stress impulses (impulse/stress layer) -- at each stressed vowel
  #   5. Boundary reset (persistent/hat layer) -- reset at SIL boundaries
  #
  # All values are in DECtalk internal units (Hz*10).  Speaker scaling in
  # renderLayeredF0() converts to final Hz via the DECtalk formula:
  #   Hz = (f0minimum + (total - 1300) * f0scalefac / 4096) / 10
  #
  # Citations:
  #   - Klatt 1982 "The KLATTalk text-to-speech conversion system"
  #   - DECtalk 4.63 ph_inton1.c (hat-pattern command generation)
  #   - DECtalk 4.63 Ph_drwt02.c (baseline profiles, frame-level realization)
  #   - Fujisaki, H. "Information, Prosody, and Modeling" (additive F0 layers)
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Rule 1: Baseline Declination Profile (long declaratives)
  #
  # Fires at the first phoneme of each phrase (first non-SIL after SIL, or
  # the very first phoneme).  Inserts a 17-point piecewise-linear profile
  # into the baseline layer that spans the entire utterance duration.
  #
  # Source: Ph_drwt02.c f0basetypes[0][] (declarative clause type,
  # number_words > 3).
  # Values are in DECtalk internal units (Hz*10); speaker scaling converts
  # to final Hz.
  #
  # Citations:
  #   - DECtalk 4.63 Ph_drwt02.c (17-point baseline profile)
  #   - Klatt 1982 (declination as baseline component)
  # --------------------------------------------------------------------------
  dectalk_baseline_declination:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
        && word_count() > 3
    insert:
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points:
        - 1157
        - 1145
        - 1139
        - 1127
        - 1113
        - 1109
        - 1095
        - 1082
        - 1079
        - 1065
        - 1053
        - 1040
        - 1038
        - 1024
        - 980
        - 952
        - 863
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c f0basetypes[0][] (declarative baseline, number_words > 3)"
      - "Klatt 1982 (baseline declination component)"

  # --------------------------------------------------------------------------
  # Rule 1b: Short Declarative Baseline
  #
  # DECtalk uses a separate, flatter profile for declarative clauses with one
  # to three words: clausetype 0 selects f0basetypes[4][] when number_words <= 3.
  # --------------------------------------------------------------------------
  dectalk_short_declarative_baseline_declination:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.phoneme != "SIL"
        && (prev == null || prev.phoneme == "SIL")
        && word_count() <= 3
    insert:
      layer: baseline
      at: at_sync(current.sync_left)
      value: 0
      profile_points:
        - 1160
        - 1150
        - 1140
        - 1152
        - 1132
        - 1140
        - 1130
        - 1124
        - 1110
        - 1100
        - 1080
        - 1060
        - 1040
        - 1020
        - 980
        - 960
        - 950
      tag: f0_baseline
    citations:
      - "DECtalk 4.63 Ph_drwt02.c f0basetypes[4][] (short declarative baseline, number_words <= 3)"
      - "Klatt 1982 (baseline declination component)"

  # --------------------------------------------------------------------------
  # Rule 2: Hat Rise (STEP into hat layer)
  #
  # Fires at the first stressed vowel in each phrase.  Detection: current is
  # a primary-stressed vowel AND looking backward, the nearest stressed vowel
  # or SIL is either SIL or not found (meaning no prior stressed vowel in
  # this phrase).
  #
  # Source: ph_inton1.c Rule 1 (FHAT_BEGINS -> STEP command).
  # ph_aloph.c (FHAT_BEGINS placed on first stressed syllabic in phrase).
  #
  # Citations:
  #   - DECtalk 4.63 ph_inton1.c Rule 1 (hat rise generation)
  #   - DECtalk 4.63 ph_aloph.c (FHAT_BEGINS placement)
  #   - Klatt 1982 (hat-pattern: rise at first accent)
  # --------------------------------------------------------------------------
  dectalk_hat_rise:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.type == "vowel"
        && has(current.stress) && current.stress == 1
    define:
      # Look backward for the nearest token that is either a stressed vowel
      # or a SIL boundary.  If the result is SIL or null, current is the
      # first stressed vowel in the phrase (hat begins).
      nearest_back: >-
        look_back_where(current, 100, '(candidate.type == "vowel" && has(candidate.stress) && candidate.stress == 1) || candidate.phoneme == "SIL"')
      is_hat_begins: >-
        nearest_back == null || nearest_back.phoneme == "SIL"
      rise_hz: >-
        word_count() < params.policy.f0.short_phrase_hat_word_limit
        ? params.policy.f0.hat_rise_hz / params.policy.f0.short_phrase_hat_divisor
        : params.policy.f0.hat_rise_hz
    constraint: is_hat_begins
    insert:
      layer: hat
      at: at_sync(current.sync_left)
      value: rise_hz
      # Smooth GLIDE onset of the hat accent: ramp to the rise target over
      # hat_rise_glide_frames rather than an instantaneous step (DECtalk renders
      # the hat rise as a GLIDE, ph_inton1.c:715). The hat layer is type: glide,
      # so this command ramps then holds; fall/reset use span 0 (instant).
      duration_frames: params.policy.f0.hat_rise_glide_frames
      tag: f0_hat_rise
    citations:
      - "DECtalk 4.63 ph_inton1.c:713-715 (FHAT_BEGINS hat rise; GLIDE form length 30)"
      - "DECtalk 4.63 ph_inton1.c (number_words < 3 quarters all hat gestures)"
      - "Klatt 1982 (hat rise at first accent in phrase)"

  # --------------------------------------------------------------------------
  # Rule 3: Hat Fall (negative STEP into hat layer)
  #
  # Fires at the last stressed vowel in each phrase.  Detection: current is
  # a primary-stressed vowel AND looking forward, the nearest stressed vowel
  # or SIL is either SIL or not found (meaning no later stressed vowel in
  # this phrase).
  #
  # The fall magnitude = hat_rise + final_fall (returns to baseline AND goes
  # below by final_fall amount).
  #
  # Source: ph_inton1.c Rule 3 (FHAT_ENDS -> negative STEP).
  #
  # Citations:
  #   - DECtalk 4.63 ph_inton1.c Rule 3 (hat fall generation)
  #   - Klatt 1982 (hat fall at last accent + phrase-final lowering)
  # --------------------------------------------------------------------------
  dectalk_hat_fall:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.type == "vowel"
        && has(current.stress) && current.stress == 1
    define:
      # Look forward for the nearest stressed vowel or SIL boundary.
      # If the result is SIL or null, current is the last stressed vowel.
      nearest_forward: >-
        look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')
      is_hat_ends: >-
        nearest_forward == null || nearest_forward.phoneme == "SIL"
      # Clause type of the boundary this hat ends into.  When is_hat_ends is
      # true via the SIL branch, nearest_forward IS the terminal SIL, whose
      # punctuationSymbol names the clause type ('.', '!', '?', ',', ';', ':').
      # Null (utterance-internal SIL or no SIL) falls through to declarative.
      # DECtalk 4.63 ph_inton1.c keys f0fall on the boundary feature
      # (FQUENEXT/FCBNEXT/FPERNEXT) of the clause-final stressed vowel.
      terminal: >-
        nearest_forward != null && nearest_forward.phoneme == "SIL"
        && has(nearest_forward.punctuationSymbol)
        ? nearest_forward.punctuationSymbol
        : null
      # Clause-dependent terminal fall depth (DECtalk internal Hz*10):
      #   '?' -> F0_QSYLL_FALL = 80   (smallest; the rise gesture dominates)
      #   ',' -> F0_COMMA_FALL = 120
      #   ';'/':' -> F0_NON_FINAL_FALL = 150
      #   '.'/'!'/null -> F0_FINAL_FALL = 180  (largest)
      # Source: ph_inton1.c:1125 (final), :1137 (comma), :1142 (non-final),
      # :1210 (question).
      clause_fall_hz: >-
        terminal == "?" ? params.policy.f0.question_fall_hz
        : terminal == "," ? params.policy.f0.comma_fall_hz
        : (terminal == ";" || terminal == ":") ? params.policy.f0.non_final_fall_hz
        : params.policy.f0.final_fall_hz
      hat_size_hz: >-
        word_count() < params.policy.f0.short_phrase_hat_word_limit
        ? params.policy.f0.hat_rise_hz / params.policy.f0.short_phrase_hat_divisor
        : params.policy.f0.hat_rise_hz
      has_following_sonorant: >-
        next != null
        && (next.type == "vowel" || next.type == "liquid" || next.type == "nasal" || next.type == "glide")
      fall_delay_ms: >-
        has_following_sonorant
        ? params.policy.f0.hat_fall_following_sonorant_delay_ms
        : (
            current.duration - params.policy.f0.hat_fall_early_offset_ms < params.policy.f0.hat_fall_min_delay_ms
            ? params.policy.f0.hat_fall_min_delay_ms
            : current.duration - params.policy.f0.hat_fall_early_offset_ms
          )
      fall_ratio: >-
        current.duration > 0 ? fall_delay_ms / current.duration : 0
      # Total fall: hat_rise (cancel the rise) + clause_fall (below baseline,
      # depth selected by terminal clause type per DECtalk f0fall).
      fall_hz: >-
        hat_size_hz + clause_fall_hz
    constraint: is_hat_ends
    insert:
      layer: hat
      at: >-
        merge(current, {"ratio": fall_ratio})
      value: "-(fall_hz)"
      tag: f0_hat_fall
    citations:
      - "DECtalk 4.63 ph_inton1.c Rule 3 (FHAT_ENDS timing and negative STEP)"
      - "DECtalk 4.63 ph_inton1.c:1125,:1137,:1142,:1210 (clause-type f0fall: final 180 / comma 120 / non-final 150 / question 80)"
      - "DECtalk 4.63 ph_inton1.c (number_words < 3 quarters all hat gestures)"
      - "Klatt 1982 (hat fall: cancel rise + phrase-final lowering)"

  # --------------------------------------------------------------------------
  # Rule 3b: Question Terminal Rise (boundary IMPULSE pair)
  #
  # Fires on the clause-final STRESSED vowel of a phrase that ends in '?'.
  # Emits the DECtalk yes/no-question gesture pair into the `boundary` impulse
  # layer: a small dip (-151) earlier in the vowel, then a large rise (+451) at
  # the very end of the vowel.  Combined with the reduced question hat-fall
  # (question_fall_hz=80, applied by dectalk_hat_fall above), the +451 rise
  # dominates and the contour RISES at the clause end -- DECtalk's signature
  # yes/no terminal rise.
  #
  # The live DECtalk path (ph_inton1.c:1308-1378, guarded FCBNEXT||FQUENEXT)
  # requires a STRESSED final syllable; the unstressed-final question rise
  # (Rule 6) is #ifdef CUT_THIS_RULE and dead in 4.63.  So this rule, like the
  # live source, fires only on the final STRESSED vowel (is_hat_ends).
  # wh- vs yes/no is NOT distinguished by ph_inton1.c -- all '?' rise.
  #
  # Citations:
  #   - DECtalk 4.63 ph_inton1.c:1288-1292 (Rule 4 comment: positive pulse for
  #     question terminal rise)
  #   - DECtalk 4.63 ph_inton1.c:1351-1352 (F0_QGesture1=-151, F0_QGesture2=+451
  #     IMPULSE pair on the final stressed vowel, length 24)
  # --------------------------------------------------------------------------
  # The f0_layer rule kind emits exactly one impulse per rule (parser maps a
  # single `insert:` to insert_f0_layer).  DECtalk's gesture is a PAIR of
  # impulses, so each gesture is two rules: a dip then a rise.  Both share the
  # same final-stressed-vowel selector and clause-terminal detection.
  dectalk_question_dip:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.type == "vowel"
        && has(current.stress) && current.stress == 1
    define:
      nearest_forward: >-
        look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')
      is_hat_ends: >-
        nearest_forward == null || nearest_forward.phoneme == "SIL"
      terminal: >-
        nearest_forward != null && nearest_forward.phoneme == "SIL"
        && has(nearest_forward.punctuationSymbol)
        ? nearest_forward.punctuationSymbol
        : null
    constraint: 'is_hat_ends && terminal == "?"'
    # Small dip earlier in the vowel (DECtalk F0_QGesture1=-151).
    insert:
      layer: boundary
      at: 'merge(current, {"ratio": 0.75})'
      value: params.policy.f0.question_gesture_dip_hz
      duration_frames: params.policy.f0.boundary_gesture_duration_frames
      tag: f0_question_dip
    citations:
      - "DECtalk 4.63 ph_inton1.c:1288-1292 (Rule 4: positive pulse for question terminal rise)"
      - "DECtalk 4.63 ph_inton1.c:1351 (F0_QGesture1=-151 IMPULSE on final stressed vowel)"

  dectalk_question_rise:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.type == "vowel"
        && has(current.stress) && current.stress == 1
    define:
      nearest_forward: >-
        look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')
      is_hat_ends: >-
        nearest_forward == null || nearest_forward.phoneme == "SIL"
      terminal: >-
        nearest_forward != null && nearest_forward.phoneme == "SIL"
        && has(nearest_forward.punctuationSymbol)
        ? nearest_forward.punctuationSymbol
        : null
    constraint: 'is_hat_ends && terminal == "?"'
    # Large rise toward the end of the vowel (DECtalk F0_QGesture2=+451).
    # Rendered as a GLIDE on the dedicated `question_glide` layer: F0 ramps
    # linearly up to the +451 target over question_rise_glide_frames and HOLDS,
    # giving a smooth, sustained terminal RISE that dominates the reduced
    # question hat-fall -- rather than a transient impulse spike that decays
    # away. (DECtalk's GLIDE-form question gesture, ph_inton1.c:1635.)
    insert:
      layer: question_glide
      at: 'merge(current, {"ratio": 0.5})'
      value: params.policy.f0.question_gesture_rise_hz
      duration_frames: params.policy.f0.question_rise_glide_frames
      tag: f0_question_rise
    citations:
      - "DECtalk 4.63 ph_inton1.c:1288-1292 (Rule 4: positive pulse for question terminal rise)"
      - "DECtalk 4.63 ph_inton1.c:1352 (F0_QGesture2=+451 on final stressed vowel)"
      - "DECtalk 4.63 ph_inton1.c:1635 (GLIDE-form question rise: F0_QGesture2 ramped over the final vowel)"

  # --------------------------------------------------------------------------
  # Rule 3b-reset: Question-glide clause-local reset
  #
  # The question_glide layer is a GLIDE (ramped persistent) that HOLDS its
  # accumulated +451 after the ramp completes.  At the next SIL boundary, emit a
  # canceling glide command (-question_gesture_rise_hz, span 0 = instant) so the
  # elevated F0 does not bleed into the following clause -- the question rise is
  # a clause-local terminal gesture (DECtalk re-derives F0 fresh per clause via
  # F0_RESET, ph_inton1.c Rules 7-8).
  # --------------------------------------------------------------------------
  dectalk_question_glide_reset:
    kind: f0_layer
    select:
      stream: phone
      # Only at a question boundary SIL: that is the only place a +451 question
      # rise was added to question_glide (dectalk_question_rise fires when the
      # final stressed vowel looks ahead to THIS '?' SIL).  Resetting elsewhere
      # would push the layer to a spurious -451.
      where: >-
        current.phoneme == "SIL"
        && prev != null && prev.phoneme != "SIL"
        && has(current.punctuationSymbol) && current.punctuationSymbol == "?"
    insert:
      layer: question_glide
      at: at_sync(current.sync_left)
      value: "-(params.policy.f0.question_gesture_rise_hz)"
      duration_frames: 0
      tag: f0_boundary_reset
    citations:
      - "DECtalk 4.63 ph_inton1.c Rules 7-8 (F0_RESET at GEN_SIL: clause-local gestures)"
      - "Klatt 1982 (hat state reset at clause boundaries)"

  # --------------------------------------------------------------------------
  # Rule 3c: Comma Continuation Rise (boundary IMPULSE pair)
  #
  # Fires on the clause-final STRESSED vowel of a clause that ends in ','.
  # Emits the DECtalk comma gesture pair (+171, +250) into the `boundary`
  # impulse layer, producing a continuation rise at the comma so the contour
  # signals "more to come" rather than falling fully.  Paired with the reduced
  # comma hat-fall (comma_fall_hz=120, applied by dectalk_hat_fall above).
  #
  # Citations:
  #   - DECtalk 4.63 ph_inton1.c:1367-1368 (F0_CGesture1=+171, F0_CGesture2=+250
  #     IMPULSE pair on the final stressed vowel for a comma boundary)
  #   - DECtalk 4.63 ph_inton1.c:1364 (comma gesture timed delayf0 -= NF20MS)
  # --------------------------------------------------------------------------
  dectalk_comma_rise1:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.type == "vowel"
        && has(current.stress) && current.stress == 1
    define:
      nearest_forward: >-
        look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')
      is_hat_ends: >-
        nearest_forward == null || nearest_forward.phoneme == "SIL"
      terminal: >-
        nearest_forward != null && nearest_forward.phoneme == "SIL"
        && has(nearest_forward.punctuationSymbol)
        ? nearest_forward.punctuationSymbol
        : null
    constraint: 'is_hat_ends && terminal == ","'
    insert:
      layer: boundary
      at: 'merge(current, {"ratio": 0.75})'
      value: params.policy.f0.comma_gesture1_hz
      duration_frames: params.policy.f0.boundary_gesture_duration_frames
      tag: f0_comma_rise
    citations:
      - "DECtalk 4.63 ph_inton1.c:1367 (F0_CGesture1=+171 comma IMPULSE)"
      - "DECtalk 4.63 ph_inton1.c:1364 (comma gesture timing delayf0 -= NF20MS)"

  dectalk_comma_rise2:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.type == "vowel"
        && has(current.stress) && current.stress == 1
    define:
      nearest_forward: >-
        look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')
      is_hat_ends: >-
        nearest_forward == null || nearest_forward.phoneme == "SIL"
      terminal: >-
        nearest_forward != null && nearest_forward.phoneme == "SIL"
        && has(nearest_forward.punctuationSymbol)
        ? nearest_forward.punctuationSymbol
        : null
    constraint: 'is_hat_ends && terminal == ","'
    insert:
      layer: boundary
      at: 'merge(current, {"ratio": 1.0})'
      value: params.policy.f0.comma_gesture2_hz
      duration_frames: params.policy.f0.boundary_gesture_duration_frames
      tag: f0_comma_rise
    citations:
      - "DECtalk 4.63 ph_inton1.c:1368 (F0_CGesture2=+250 comma IMPULSE)"
      - "DECtalk 4.63 ph_inton1.c:1364 (comma gesture timing delayf0 -= NF20MS)"

  # --------------------------------------------------------------------------
  # Rule 4: Stress Impulse (decaying pulse into stress layer)
  #
  # Fires at every primary-stressed vowel.  Inserts an impulse whose magnitude
  # is stress_level_primary + a fixed phrase-position component (simplified
  # from the position-dependent f0_mphrase_position[] table).
  #
  # The impulse decays over stress_impulse_duration_frames (20 frames = 100ms)
  # using halving decay (DECtalk style: value -= decay, decay /= 2).
  #
  # Simplification: DECtalk tracks nrises_sofar to index into
  # f0_mphrase_position[], which requires stateful counting.  We use a fixed
  # average of the first 4 entries: (140+90+60+40)/4 = 82.5 Hz*10.
  #
  # Source: ph_inton1.c Rule 2 (stress impulse at FSTRESS_1).
  #
  # Citations:
  #   - DECtalk 4.63 ph_inton1.c Rule 2 (stress impulse generation)
  #   - Klatt 1982 (stress component: impulse at stressed syllables)
  # --------------------------------------------------------------------------
  dectalk_stress_impulse:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.type == "vowel"
        && has(current.stress) && current.stress == 1
    define:
      # Impulse magnitude = stress level + phrase position component.
      # Scaled by scale_str_rise / 32 (Paul: 32/32 = 1.0).
      stress_component: >-
        params.policy.f0.stress_level_primary_hz
      position_component: >-
        params.policy.f0.stress_phrase_position_hz
      scale_factor: >-
        params.policy.speaker.scale_str_rise / 32.0
      impulse_hz: >-
        (stress_component + position_component) * scale_factor
    insert:
      layer: stress
      at: at_sync(current.sync_left)
      value: impulse_hz
      duration_frames: params.policy.f0.stress_impulse_duration_frames
      tag: f0_stress_impulse
    citations:
      - "DECtalk 4.63 ph_inton1.c Rule 2 (stress impulse)"
      - "Klatt 1982 (stress-component F0 impulse)"

  # --------------------------------------------------------------------------
  # Rule 5: Boundary Reset (persistent hat layer reset at SIL)
  #
  # At phrase boundaries (SIL tokens), reset the hat layer to 0 by inserting
  # a STEP that cancels the accumulated hat level.  In DECtalk this is handled
  # by F0_RESET at clause boundaries (ph_inton1.c Rules 7-8).
  #
  # Implementation: emit a persistent hat command with value =
  # -(hat_rise - (hat_rise + final_fall)) = final_fall.  This cancels the
  # net hat fall that was applied: rise (+180) then fall (-360) = net -180,
  # so a reset of +180 brings it back to 0.
  #
  # Source: ph_inton1.c Rules 7-8 (F0_RESET at GEN_SIL/FSENTENDS).
  #
  # Citations:
  #   - DECtalk 4.63 ph_inton1.c Rules 7-8 (boundary F0 reset)
  #   - Klatt 1982 (hat state machine reset at clause boundaries)
  # --------------------------------------------------------------------------
  dectalk_boundary_reset:
    kind: f0_layer
    select:
      stream: phone
      where: >-
        current.phoneme == "SIL"
        && prev != null && prev.phoneme != "SIL"
    define:
      # After a complete hat pattern (rise + fall), the persistent hat level is:
      #   hat_rise_hz + (-(hat_rise_hz + final_fall_hz)) = -final_fall_hz
      # To reset to 0, add +final_fall_hz.
      reset_value: >-
        params.policy.f0.final_fall_hz
    insert:
      layer: hat
      at: at_sync(current.sync_left)
      value: reset_value
      tag: f0_boundary_reset
    citations:
      - "DECtalk 4.63 ph_inton1.c Rules 7-8 (F0_RESET at GEN_SIL)"
      - "Klatt 1982 (hat state reset at clause boundaries)"

  # --------------------------------------------------------------------------
  # Rule 6: Connected-speech source contour (Fant 1997)
  #
  # Applies phrase-level Ee/Rd shaping on voiced segments to preserve
  # connected-speech source dynamics in the Klatt parameter stream.
  # --------------------------------------------------------------------------
  dectalk_connected_speech_source_contour:
    kind: scalar
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL'
        && current.params != null
        && ((current.params.AV != null && current.params.AV > 0)
            || (current.params.AVS != null && current.params.AVS > 0))
    contour:
      domain: phrase
      # Silverman et al. 1992 ToBI: BI=4 marks intonational phrase boundaries.
      reset_break_index: 4
      apply:
        - field: params.EePhraseDb
          op: add
          value: ee_total_db
          tag: source_contour
        - field: params.RdPhraseOffset
          op: add
          value: "params.policy.source_contour.rd_final_offset * final_progress"
          tag: source_contour
    define:
      onset_rise_db: >-
        contour.elapsed_sec < params.policy.source_contour.ee_onset_rise_sec
        ? -params.policy.source_contour.ee_onset_rise_db
          * (1.0 - contour.elapsed_sec / params.policy.source_contour.ee_onset_rise_sec)
        : 0.0
      declination_db: >-
        -params.policy.source_contour.ee_declination_db_per_sec * contour.elapsed_sec
      final_window_sec: >-
        min([
          params.policy.source_contour.ee_final_window_max_sec,
          max([
            params.policy.source_contour.ee_final_window_min_sec,
            contour.phrase_duration_sec * params.policy.source_contour.ee_final_window_ratio
          ])
        ])
      final_window_start_sec: >-
        max([
          params.policy.source_contour.ee_onset_rise_sec,
          contour.phrase_duration_sec - final_window_sec
        ])
      final_fall_db: >-
        contour.elapsed_sec > final_window_start_sec
        ? -(params.policy.source_contour.ee_final_fall_db_per_sec
            - params.policy.source_contour.ee_declination_db_per_sec)
          * (contour.elapsed_sec - final_window_start_sec)
        : 0.0
      final_progress: >-
        contour.elapsed_sec <= final_window_start_sec
        ? 0.0
        : min([1.0, (contour.elapsed_sec - final_window_start_sec) / final_window_sec])
      ee_total_db: >-
        onset_rise_db + declination_db + final_fall_db
    citations:
      - Fant 1997 (connected-speech source contour model for Ee and Rd shaping)
      - Hanson et al. 2001 (phrase-final spectral tilt and breathiness support Rd softening near boundaries)
      - Silverman et al. 1992 (ToBI break index tier; BI>=4 reset for major phrase boundaries)
