version: v1

# Phone normalization rules.
# Maps G2P-internal symbols to inventory-compatible ARPABET.
# Runs as the first pipeline phase, before postlexical rules.
#
# Currently handles Elovitz LTS notation divergences.
# Structural expansions (bare stops -> closures, affricates, diphthongs)
# are handled in structural.yaml.

rules:
  normalize_schwa:
    kind: postlexical
    select:
      relation: phone
      where: current.phoneme == 'AX'
    define:
      # AX always maps to AH; stress digit preserved from Hunnicutt assignment.
      # cel-js lacks int(); use ternary chain for stress-keyed inventory lookup.
      ah_key: >-
        has(current.stress) && current.stress != null
        ? (current.stress == 1 ? "AH1" : (current.stress == 2 ? "AH2" : "AH0"))
        : "AH0"
      ah_target: target(ah_key)
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: '"AH"'
          type: ah_target.type
          duration: ah_target.duration
          inherentDuration: ah_target.inherentDuration
          params: ah_target.params
    citations:
      - Elovitz et al. 1976

  normalize_velar_nasal:
    kind: postlexical
    select:
      relation: phone
      where: current.phoneme == 'NX'
    define:
      ng_target: target("NG")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: '"NG"'
          type: ng_target.type
          duration: ng_target.duration
          inherentDuration: ng_target.inherentDuration
          params: ng_target.params
    citations:
      - Elovitz et al. 1976

  normalize_wh_merger:
    kind: postlexical
    select:
      relation: phone
      where: current.phoneme == 'WH'
    define:
      w_target: target("W")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: '"W"'
          type: w_target.type
          duration: w_target.duration
          inherentDuration: w_target.inherentDuration
          params: w_target.params
    citations:
      - >-
        Labov, Ash & Boberg 2006, Atlas of North American English
        (wh-merger is the norm in General American English)
