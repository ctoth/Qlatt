# Stevens 1991 Higher-Level Parameters — Semantics Overrides
#
# This experiment exposes the paper's 10 HL controls (Table I):
#   f1 f2 f3 f4 f0 ag ac an st pm
# and maps them onto KL controls with aerodynamic/acoustic approximations.
#
# Stevens & Bickley (1991) "Constraints among parameters simplify
#   control of Klatt formant synthesizer" Journal of Phonetics 19, 161-174
# Stevens (1998) "Acoustic Phonetics" MIT Press

params:
  # HL natural frequencies and f0 (Table I)
  f1:
    type: float
    range: [180, 800]
    default: 500
    unit: "Hz"
  f2:
    type: float
    range: [800, 2500]
    default: 1500
    unit: "Hz"
  f3:
    type: float
    range: [2000, 3500]
    default: 2500
    unit: "Hz"
  f4:
    type: float
    range: [3000, 4500]
    default: 3500
    unit: "Hz"
  f0:
    type: float
    range: [0, 500]
    default: 120
    unit: "Hz"

  # HL quasi-articulatory controls (Table I)
  ag:
    type: float
    range: [0, 0.4]
    default: 0.05
    unit: "cm2"
    description: "HL ag: glottal area (modal ~0.03-0.05)"
  ac:
    type: float
    range: [0, 0.4]
    default: 0.4
    unit: "cm2"
    description: "HL ac: oral constriction area for consonants"
  an:
    type: float
    range: [0, 1.0]
    default: 0.0
    unit: "cm2"
    description: "HL an: velopharyngeal opening area"
  st:
    type: float
    range: [-10, 0]
    default: 0.0
    unit: "dB"
    description: "HL st: stridency correction (0=max, -10=min)"
  pm:
    type: float
    range: [-0.5, 0.2]
    default: 0.0
    unit: "fraction of Ps"
    description: "HL pm: active pressure manipulation as fraction of Ps"
  useHlFormants:
    type: integer
    range: [0, 1]
    default: 0
    description: "0=use track F0/F1-F4 (default), 1=use HL f0/f1-f4 mapping"
  useAerodynamicModel:
    type: integer
    range: [0, 1]
    default: 0
    description: "0=legacy Klatt gains, 1=drive source gains from aerodynamic model"

realize:
  # Map HL natural frequencies to KL formants.
  # Keep track compatibility by default; HL mapping is opt-in via useHlFormants.
  F0:
    expr: "useHlFormants == 1 ? f0 : F0"
    deps: [useHlFormants, f0]

  f1ShiftFromAg:
    expr: "useHlFormants == 1 && ag > 0.1 ? (ag - 0.1) * 600 : 0"
    deps: [useHlFormants, ag]
    description: "Approximation of F1 shift with large glottal opening"

  F1:
    expr: "useHlFormants == 1 ? (f1 + f1ShiftFromAg) : F1"
    deps: [useHlFormants, f1, f1ShiftFromAg]
  F2:
    expr: "useHlFormants == 1 ? f2 : F2"
    deps: [useHlFormants, f2]
  F3:
    expr: "useHlFormants == 1 ? f3 : F3"
    deps: [useHlFormants, f3]
  F4:
    expr: "useHlFormants == 1 ? f4 : F4"
    deps: [useHlFormants, f4]

  # OQ/TL proxies from ag for topology parameters that expect these effects.
  OQ:
    expr: "min(90, max(40, 50 + (ag - 0.05) * 130))"
    deps: [ag]
    description: "Approximate open-quotient percent from ag"
  TL:
    expr: "min(30, max(0, (OQ - 50) * 0.75))"
    deps: [OQ]
    description: "Approximate high-frequency tilt proxy from OQ"

  # Keep baseline gains unless aerodynamic model is explicitly enabled.
  # (Model outputs are additively connected to AudioParams in graph.yaml.)
  voiceGain:
    expr: "useAerodynamicModel == 1 ? 0.0 : dbToLinear(GO + AV + ndbScale.AV)"
    deps: [useAerodynamicModel, GO, AV]
    description: "Baseline voice gain (or 0 when aerodynamic model is enabled)"
  aspGain:
    expr: "useAerodynamicModel == 1 ? 0.0 : dbToLinear(GO + AH + ndbScale.AH)"
    deps: [useAerodynamicModel, GO, AH]
    ramp: true
    description: "Baseline aspiration gain (or 0 when aerodynamic model is enabled)"
  fricGain:
    expr: "useAerodynamicModel == 1 ? 0.0 : dbToLinear(GO + fricDbAdjusted + ndbScale.AF)"
    deps: [useAerodynamicModel, GO, fricDbAdjusted]
    ramp: true
    description: "Baseline frication gain (or 0 when aerodynamic model is enabled)"
  fricGainScaled:
    expr: "useAerodynamicModel == 1 ? 0.0 : dbToLinear(GO + fricDbAdjusted + ndbScale.AF) * parallelScale"
    deps: [useAerodynamicModel, GO, fricDbAdjusted, parallelScale]
    ramp: true
    description: "Baseline scaled frication gain (or 0 when aerodynamic model is enabled)"
