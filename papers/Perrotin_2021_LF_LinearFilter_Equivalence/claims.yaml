- id: claim15
  type: equation
  expression: h_{LF_{open}}(t) = \frac{-E}{\sin\left(\frac{\pi}{\alpha_m}\right)}
    e^{a_{LF} t} \sin\left(\frac{\pi}{\alpha_m O_q T_0} t + \frac{\pi}{\alpha_m}\right),
    \quad t \in [-O_q T_0, 0]
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim16
  type: equation
  expression: H_{LF_{open}}(s) = \frac{G_{LF} b_{LF} (e^{-sT_{LF}} - 1) + Es}{(a_{LF}
