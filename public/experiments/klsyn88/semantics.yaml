# klsyn88 Synthesizer Semantics
# Matches klsyn88 parwav.c parameter mapping and gain scaling.

bacon: "0.1"
name: klsyn88

params:
  F0:
    type: float
    range: [0, 500]
    default: 0
    unit: Hz

  # Cascade formant frequencies. Defaults/ranges = Klatt 1988 KLSYN88 manual
  # Table I (neutral schwa-like configuration); F7/F8 fixed at 6500/7500.
  F1:
    type: float
    range: [180, 1300]   # manual Table I: F1 >= 180 Hz always (cavity-wall mass)
    default: 500
    unit: Hz
  F2:
    type: float
    range: [550, 3000]
    default: 1500
    unit: Hz
  F3:
    type: float
    range: [1200, 4800]  # manual Table I F3 max 4800
    default: 2500
    unit: Hz
  F4:
    type: float
    range: [2400, 4990]  # manual Table I F4 2400-4990
    default: 3250         # manual Table I F4 default 3250
    unit: Hz
  F5:
    type: float
    range: [3000, 4990]  # manual Table I F5 3000-4990
    default: 3700         # manual Table I F5 default 3700
    unit: Hz
  F6:
    type: float
    range: [1200, 4990]  # manual Table I f6 3000-4990; keep wide low bound
    default: 4990         # manual Table I f6 default 4990 (was 5500, OUTSIDE old range)
    unit: Hz

  # Cascade bandwidths. Defaults/ranges = Klatt 1988 manual Table I (b1..b6).
  B1:
    type: float
    range: [30, 1000]    # manual Table I b1 min 30
    default: 60
    unit: Hz
  B2:
    type: float
    range: [40, 1000]
    default: 90
    unit: Hz
  B3:
    type: float
    range: [60, 1000]    # manual Table I b3 min 60
    default: 150
    unit: Hz
  B4:
    type: float
    range: [100, 1000]   # manual Table I b4 min 100
    default: 200
    unit: Hz
  B5:
    type: float
    range: [100, 1500]   # manual Table I b5 100-1500
    default: 200
    unit: Hz
  B6:
    type: float
    range: [100, 4000]   # manual Table I b6 100-4000
    default: 500
    unit: Hz

  B1p:
    type: float
    range: [40, 1000]
    default: 80
    unit: Hz
  B2p:
    type: float
    range: [40, 1000]
    default: 200
    unit: Hz
  B3p:
    type: float
    range: [40, 1000]
    default: 350
    unit: Hz
  B4p:
    type: float
    range: [40, 1000]
    default: 500
    unit: Hz
  B5p:
    type: float
    range: [100, 1500]   # manual Table I p5 100-1500
    default: 600
    unit: Hz
  B6p:
    type: float
    range: [100, 4000]   # manual Table I p6 100-4000
    default: 800
    unit: Hz

  # Nasal pole/zero pair. Defaults/ranges = Klatt 1988 manual Table I (fz/fp).
  # fz=fp cancels the pair (non-nasal default).
  FNZ:
    type: float
    range: [180, 800]    # manual Table I fz 180-800
    default: 280          # manual Table I fz default 280
    unit: Hz
  BNZ:
    type: float
    range: [40, 1000]
    default: 90
    unit: Hz
  FNP:
    type: float
    range: [180, 500]    # manual Table I fp 180-500
    default: 280          # manual Table I fp default 280
    unit: Hz
  BNP:
    type: float
    range: [40, 1000]
    default: 90
    unit: Hz

  # Tracheal (subglottal) pole-zero pair. Klatt & Klatt 1990, "Analysis,
  # synthesis, and perception of voice quality variations among female and male
  # talkers", JASA 87(2), Table XII. Models subglottal coupling for breathy
  # voice. Defaults place the pole and zero coincident (FTP=FTZ=2150,
  # BTP=BTZ=180) so the pair cancels and is transparent; separate FTZ from FTP
  # to enable. Bound directly to the cascade tz/tp nodes (see graph.yaml).
  FTP:
    type: float
    range: [300, 3000]
    default: 2150
    unit: Hz
  BTP:
    type: float
    range: [40, 1000]
    default: 180
    unit: Hz
  FTZ:
    type: float
    range: [300, 3000]
    default: 2150
    unit: Hz
  BTZ:
    type: float
    range: [40, 2000]
    default: 180
    unit: Hz

  # Overall gain (Gain0). Klatt 1988 manual Table I g0: default 60, range 0-80.
  # Effective Gain0 = GO - 3 (parwv.c offset), so default 60 => 57 dB == klsyn88
  # g0=60 reference level. (Was 57 => 54 dB, ~3 dB below reference.)
  GO:
    type: float
    range: [0, 80]       # manual Table I g0 0-80
    default: 60           # manual Table I g0 default 60
    unit: dB
    description: "Overall gain (Gain0); effective Gain0 = GO - 3 (parwv.c)"

  # Source amplitudes. Manual Table I av/ah/ap ranges 0-80 (defaults track-driven
  # to 0 here; av neutral default is 60 in the manual but Qlatt drives it per token).
  AV:
    type: float
    range: [0, 80]       # manual Table I av 0-80
    default: 0
    unit: dB
  AVS:
    type: float
    range: [0, 80]       # manual Table I ap (parallel voicing) 0-80
    default: 0
    unit: dB
  AH:
    type: float
    range: [0, 80]       # manual Table I ah 0-80
    default: 0
    unit: dB
  AF:
    type: float
    range: [0, 80]
    default: 0
    unit: dB

  # Master source gains (Klatt & Klatt 1990 Table XI: GV/GH/GF = "Gain for
  # AV/AH/AF", each min 0 / default 60 / max 80 dB). The shipped parwv.c does
  # NOT expose these as runtime knobs: it folds them into the fixed per-source
  # scales (voicing implicit in the source x0.03 return, aspiration x0.05,
  # frication x0.25 -- signalpath §2.9/§3.3/§3.4) at their nominal 60 dB. We
  # expose them as the spec's explicit dB gains and apply each as a (GX - 60)
  # dB offset on its source gain. At the default 60 the offset is +0 dB (unity),
  # so the folded shipped-C behavior is reproduced as an EXACT no-op. Raising
  # GV to 66 raises cascade voicing by +6 dB (=x2 in the klsyn amptable), etc.
  GV:
    type: float
    range: [0, 80]       # Klatt & Klatt 1990 Table XI GV 0/60/80
    default: 60
    unit: dB
    description: "Master gain for voicing AV (Klatt & Klatt 1990 Table XI). Applied as (GV-60) dB offset on the cascade voicing gain; default 60 = no-op."
  GH:
    type: float
    range: [0, 80]       # Klatt & Klatt 1990 Table XI GH 0/60/80
    default: 60
    unit: dB
    description: "Master gain for aspiration AH (Klatt & Klatt 1990 Table XI). Applied as (GH-60) dB offset on the aspiration gain; default 60 = no-op."
  GF:
    type: float
    range: [0, 80]       # Klatt & Klatt 1990 Table XI GF 0/60/80
    default: 60
    unit: dB
    description: "Master gain for frication AF (Klatt & Klatt 1990 Table XI). Applied as (GF-60) dB offset on the frication gain; default 60 = no-op."

  # Frontend-facing voice-quality controls. klsyn88 itself is not an LF-source
  # synthesizer, so these are implemented as proxies onto its native Kopen/TLTdb
  # and excitation gains rather than passed through directly.
  # Citations:
  # - Fant 1997 (Rd, Ee, B1/B2 leakage and OQ covariation)
  # - Klatt & Klatt 1990 (OQ/TL as explicit source controls)
  Rd:
    type: float
    range: [0.3, 2.7]
    default: 0.7
    description: "Fant 1997 voice-source shape proxy for klsyn88 backend"

  RdRef:
    type: float
    range: [0.3, 2.7]
    default: 0.7
    description: "Reference Rd for Fant 1997 proxy covariation"

  RdPhraseOffset:
    type: float
    range: [-0.5, 0.5]
    default: 0
    description: "Connected-speech Rd offset proxy for phrase-final source softening"

  EePhraseDb:
    type: float
    range: [-12, 6]
    default: 0
    unit: dB
    description: "Connected-speech Ee contour offset in dB"

  OQ:
    type: float
    range: [0, 99]
    default: 0
    description: "Klatt 1990 open quotient override in percent. 0 = derive proxy from Rd"

  # Spectral tilt. THE canonical spectral-tilt control (Klatt & Klatt 1990
  # Table XII TL, "Glottal spectral tilt", dB attenuation at 3 kHz). The 1990
  # spec has a SINGLE tilt parameter; klsyn88 implements it through the one-pole
  # lineartilt[35] table (parwv.c §3.6), whose highest index is 34, so the
  # effective ceiling is 34 dB (not the paper's nominal 41 -- the C table does
  # not reach it; audit §3.1). `TLTdb` below is a deprecated back-compat alias
  # for this same control (see effectiveTiltDb). 0 = derive a proxy from Rd.
  TL:
    type: float
    range: [0, 34]       # ceiling = lineartilt[35] last index (parwv.c §3.6)
    default: 0
    unit: dB
    description: "Canonical Klatt 1990 spectral tilt (Table XII TL), dB at 3 kHz. 0 = derive proxy from Rd. Supersedes the TLTdb alias."

  A1:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  A2:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  A3:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  A4:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  A5:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  A6:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  AN:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  AB:
    type: float
    range: [0, 80]
    default: 0
    unit: dB

  dF1hz:
    type: float
    range: [0, 100]      # manual Table I dF 0-100
    default: 0
    unit: Hz
  dB1hz:
    type: float
    range: [0, 400]      # manual Table I db 0-400
    default: 0
    unit: Hz

  ss:
    type: int
    range: [1, 4]
    default: 2
    description: "Source select: 1=impulsive, 2=natural (KLGLOTT88, default), 3=LF (modified LF model, Fant 1985), 4=square. Klatt & Klatt 1990 Table XI."

  # Speed quotient (LF source only, SS=3). Klatt & Klatt 1990 Table XII:
  # SQ = ratio of opening to closing duration of the open phase, in percent,
  # range 100-500, default 200. Drives the LF return/steepness Rk = 100/SQ
  # (Fant 1988 normalized R-params). Inert for SS!=3.
  SQ:
    type: float
    range: [100, 500]
    default: 200
    unit: "%"
    description: "Speed quotient percent (LF source SS=3 only). Klatt & Klatt 1990 Table XII."

  Kopen:
    type: float
    range: [0, 100]
    default: 50
    description: "Open quotient percent"

  Kskew:
    type: float
    range: [0, 100]      # manual Table I sk 0-100 (25 us units)
    default: 0
    description: "Skewness (manual Table I sk, 25 us units)"

  as:
    type: float
    range: [0, 100]
    default: 50
    description: "Triangular asymmetry percent"

  Aturb:
    type: float
    range: [0, 80]
    default: 0
    unit: dB

  # DEPRECATED alias for TL (above). Retained for back-compat with callers that
  # set the manual symbol `tl` (Klatt 1988 Table I, 0-34 dB). Collapsed into the
  # single canonical tilt control: effectiveTiltDb now resolves TL first, then
  # this alias, then the Rd proxy. Prefer TL in new configs. Default 0 -> no-op.
  TLTdb:
    type: float
    range: [0, 34]
    default: 0
    unit: dB
    description: "DEPRECATED alias for TL (Klatt 1988 manual tl, 0-34 dB). Use TL."

  NFCASC:
    type: int
    range: [1, 8]
    default: 5
    description: "Number of cascade formants. Klatt&Klatt 1990 Table XI, Klatt 1988 manual Table I (nf), and parwv.c all default to 5 (~17 cm tract at 10 kHz)."

  seed:
    type: int
    range: [1, 8191]     # Klatt & Klatt 1990 Table XI RS range 1-8191
    default: 1
    description: "Random seed. Range 1-8191 per Klatt & Klatt 1990 Table XI (RS). Default kept at 1 (shipped parwv.c ranseed) to preserve the no-op baseline; the paper's nominal default is 8."

  # F0 flutter percent. Klatt & Klatt 1990, eq. 1:
  #   Δf0(t) = (FL/50)*(F0/100)*[sin(2π·12.7t)+sin(2π·7.1t)+sin(2π·4.7t)] Hz
  # Default 0 = no flutter (synthesizer output bit-identical). Applied in the
  # oversampled glottal source per period from absolute utterance time.
  FL:
    type: float
    range: [0, 100]
    default: 0
    unit: "%"
    description: "F0 flutter percent (Klatt & Klatt 1990 eq. 1)"

  # Diplophonia percent. Klatt & Klatt 1990, §3 (alternate-pulse perturbation):
  #   delay      = (DI/100)*(1 - OQ/100)*T0   (delays every alternate glottal pulse)
  #   amp_factor = 1 - DI/100                 (attenuates that pulse; DI=50 -> -6 dB)
  # Default 0 = no diplophonia (synthesizer output bit-identical). Applied per period
  # in the oversampled glottal source; produces a perceived F0/2 subharmonic without
  # changing the mean F0.
  DI:
    type: float
    range: [0, 100]
    default: 0
    unit: "%"
    description: "Diplophonia percent (Klatt & Klatt 1990 §3)"

constants:
  F7: 6500
  B7: 500
  F8: 7500
  B8: 600

  # PLSTEP burst detection threshold and amplitude offset.
  # Klatt 1980 PARCOE.FOR:
  #   IF (NNAF-NAFLAS.LT.49) ...
  #   PLSTEP=GETAMP(NNG0+NDBSCA(11)+44)
  # With Qlatt's GO-centered dB conversion this is exposed as GO - 75 dB,
  # matching the klatt80-baseline semantics constants.
  plstepThreshold: 49
  plstepBurstOffsetDb: 75

realize:
  effectiveRd:
    expr: "min(2.7, max(0.3, Rd + RdPhraseOffset))"
    deps: [Rd, RdPhraseOffset]

  # Fant 1997: 1 dB increase in 1/Rd corresponds to a 2 dB increase in Ee.
  # We apply the same gain covariation here even though the backend source is
  # klsyn88's classic glottal model, so unified frontend voice-quality controls
  # continue to affect source strength across experiments.
  eeCovaryDb:
    expr: "40.0 * log(max(RdRef, 0.3) / effectiveRd) / log(10.0)"
    deps: [RdRef, effectiveRd]

  eeGainDb:
    expr: "eeCovaryDb + EePhraseDb"
    deps: [eeCovaryDb, EePhraseDb]

  # Fant 1997 Table 1 gives OQi values at discrete Rd samples. klsyn88 uses
  # Kopen as a percent open phase, so we interpolate those table points and let
  # an explicit OQ override take precedence.
  rdDerivedOpenQuotientPct:
    expr: >-
      effectiveRd <= 0.5
        ? 35.0 + (effectiveRd - 0.3) * 60.0
        : (effectiveRd <= 0.7
            ? 47.0 + (effectiveRd - 0.5) * 42.5
            : (effectiveRd <= 1.0
                ? 55.5 + (effectiveRd - 0.7) * 31.6666666667
                : (effectiveRd <= 1.4
                    ? 65.0 + (effectiveRd - 1.0) * 20.0
                    : (effectiveRd <= 2.0
                        ? 73.0 + (effectiveRd - 1.4) * 8.3333333333
                        : 78.0 + (effectiveRd - 2.0) * 1.4285714286))))
    deps: [effectiveRd]

  effectiveKopen:
    expr: "min(99.0, max(5.0, OQ > 0 ? OQ : rdDerivedOpenQuotientPct))"
    deps: [OQ, rdDerivedOpenQuotientPct]

  # klsyn88 exposes explicit spectral tilt (TLTdb) rather than LF Rd. Use an
  # engineering proxy from the Fant 1997 Rd->OQ trend when TL is not supplied.
  rdDerivedTiltDb:
    expr: "min(34.0, max(0.0, (rdDerivedOpenQuotientPct - 50.0) * 0.6))"
    deps: [rdDerivedOpenQuotientPct]

  # Single canonical spectral-tilt resolution (TL/TLTdb collapse, audit §3.1).
  # The 1990 spec has ONE tilt control. Resolution order: explicit canonical TL
  # wins; else the deprecated TLTdb alias; else the Rd-derived proxy. At defaults
  # (TL=0, TLTdb=0) this is exactly rdDerivedTiltDb -- identical to the previous
  # `TLTdb + (TL>0?TL:rdDerivedTiltDb)` formula (0 + rdDerivedTiltDb), so the
  # no-op baseline is preserved byte-for-byte. Ceiling 34 = lineartilt[35].
  effectiveTiltDb:
    expr: "min(34.0, max(0.0, TL > 0 ? TL : (TLTdb > 0 ? TLTdb : rdDerivedTiltDb)))"
    deps: [TL, TLTdb, rdDerivedTiltDb]

  # ---------------------------------------------------------------------------
  # LF glottal source (SS=3) — Fant 1985/1988/1997, Klatt & Klatt 1990 Table XI
  # ---------------------------------------------------------------------------
  # The LF crate (crates/lf-source) is Rd-driven with an optional Klatt OQ
  # override. We drive it from the Klatt controls as follows:
  #  - OQ override = effectiveKopen  (Klatt 1990 open quotient, %) -> sets the
  #    glottal-formant Fg/Bg in the crate (honors OQ exactly).
  #  - SQ -> Rd: the crate ties steepness Rk = (22.4+11.8*Rd)/100 (Fant 1997
  #    Eq. A1) and the open/close asymmetry alpha_m = 1/(1+Rk) (= speed quotient,
  #    Doval 2003). Setting Rk = 100/SQ (Fant 1988 normalized R-params) and
  #    inverting gives Rd = (10000/SQ - 22.4)/11.8, clamped to the crate's
  #    valid Rd range [0.3, 2.7]. So SQ controls the LF closing steepness /
  #    spectral slope; OQ controls the glottal-formant frequency.
  #  - TL override = effectiveTiltDb resolves the ta-vs-TL double-tilt ambiguity
  #    (spec §6 #10): SS=3 expresses spectral tilt through the crate's TL
  #    override path, not through ta.
  # Known approximation (spec §6 #7/#8): the crate's Rd-default Rk covariation
  # caps fully-independent SQ control near the Rd clamp ends (SQ<~184 saturates
  # at Rd=2.7, SQ>~386 at Rd=0.3); within ~[184,386] SQ maps cleanly. Accepted:
  # standard CALM-biquad LF realization (Perrotin 2021), not a literal
  # time-domain integrator.
  lfRd:
    expr: "min(2.7, max(0.3, (10000.0 / SQ - 22.4) / 11.8))"
    deps: [SQ]

  # Route the LF source onto the voice path only when SS=3 (signal-switch
  # selector: <0.5 = oversampled KLGLOTT88 voice, >=0.5 = LF). SS!=3 keeps the
  # default oversampled path bit-identical.
  lfSelect:
    expr: "ss == 3 ? 1.0 : 0.0"
    deps: [ss]

  # LFLM causal mode (1) for the realtime LF crate (Perrotin 2021; LFCALM maps
  # to LFLM internally for sample-by-sample rendering).
  lfModeVal:
    expr: "1.0"
    deps: []

  # Amplitude makeup gain bringing the LF crate's normalized output (~1.0 scale,
  # RMS ~0.22 at SQ=200/OQ=50/F0=120) up to the klsyn88 fixed-point voice scale
  # (oversampled KLGLOTT88 voice RMS ~2069 at the same settings) so the LF voice
  # feeds voiceGain/parVoiceGain at the same level as the native source.
  # Engineering estimate (RMS-matched, measured); not a paper constant.
  lfMakeupGain:
    expr: "9600.0"
    deps: []

  # Pitch-synchronous F1 modulation source type. The LF source (SS=3) has no
  # triangular open-phase shape, so the F1 pitch-sync modulator treats it like
  # the natural source (2). SS!=3 passes ss through unchanged (SS=2 -> 2, so the
  # default path is bit-identical).
  psmSource:
    expr: "ss == 3 ? 2 : ss"
    deps: [ss]

  # Tracheal pole-zero coincidence bypass (Klatt & Klatt 1990 Table XII,
  # "coincident pole+zero => transparent"). When the tracheal pole and zero
  # share frequency AND bandwidth they cancel exactly in continuous math, so
  # the pair contributes nothing to the spectrum. Rather than run two extra
  # f32 IIR biquads (whose finite-precision cancellation leaves a sub-LSB
  # residual that perturbs the rendered samples), we route both node
  # frequencies to 0 when coincident, which trips each node's bypassAtZero
  # passthrough -> the cascade signal is forwarded bit-for-bit. This makes the
  # default coincident state an EXACT no-op (its mathematically-correct value)
  # instead of an f32 approximation of it. Separating FTZ from FTP (or BTZ from
  # BTP) makes the pair non-coincident -> the real zero/pole are inserted.
  trachealCoincident:
    expr: "(FTP == FTZ && BTP == BTZ) ? 1.0 : 0.0"
    deps: [FTP, FTZ, BTP, BTZ]
  trachealZeroFreq:
    expr: "trachealCoincident > 0.5 ? 0.0 : FTZ"
    deps: [trachealCoincident, FTZ]
  trachealPoleFreq:
    expr: "trachealCoincident > 0.5 ? 0.0 : FTP"
    deps: [trachealCoincident, FTP]

  Ra:
    expr: "max(-1.0 + 4.8 * effectiveRd, 0.0)"
    deps: [effectiveRd]

  RaRef:
    expr: "max(-1.0 + 4.8 * RdRef, 0.0)"
    deps: [RdRef]

  deltaB1:
    expr: "250.0 * pow(F1 / 500.0, 2.0) * (Ra - RaRef) / 12.0"
    deps: [F1, Ra, RaRef]

  deltaB2:
    expr: "deltaB1 * F1 / (2.0 * F2)"
    deps: [deltaB1, F1, F2]

  effectiveB1:
    expr: "max(B1 + deltaB1, 40.0)"
    deps: [B1, deltaB1]

  effectiveB1p:
    expr: "max(B1p + deltaB1, 40.0)"
    deps: [B1p, deltaB1]

  effectiveB2:
    expr: "max(B2 + deltaB2, 40.0)"
    deps: [B2, deltaB2]

  effectiveB2p:
    expr: "max(B2p + deltaB2, 40.0)"
    deps: [B2p, deltaB2]

  avDb:
    expr: "max(AV - 7, 0)"
    deps: [AV]

  # Master gain GV (Klatt & Klatt 1990 Table XI) folded as a (GV-60) dB offset.
  # Default GV=60 -> +0 dB -> argument unchanged -> exact no-op.
  voiceGain:
    expr: "dbToLinearKlsyn(max(avDb + eeGainDb + (GV - 60.0), 0))"
    deps: [avDb, eeGainDb, GV]

  # Parallel voicing (AVS = manual `ap`) is a distinct amplitude; the spec's GV
  # pairs with cascade AV, so GV is not applied here (faithful to parwv.c, which
  # has no GV on the parallel voicing path either).
  parVoiceGain:
    expr: "dbToLinearKlsyn(max(AVS + eeGainDb, 0))"
    deps: [AVS, eeGainDb]

  # Master gain GH (Table XI) folded as a (GH-60) dB offset on aspiration.
  # dbToLinearKlsyn returns 0 for negative dB, so no extra clamp is needed.
  # Default GH=60 -> +0 dB -> exact no-op.
  aspGain:
    expr: "dbToLinearKlsyn(AH + (GH - 60.0)) * 0.05"
    deps: [AH, GH]

  # Master gain GF (Table XI) folded as a (GF-60) dB offset on frication.
  # Default GF=60 -> +0 dB -> exact no-op.
  fricGain:
    expr: "dbToLinearKlsyn(AF + (GF - 60.0)) * 0.25"
    deps: [AF, GF]

  a1Gain:
    expr: "dbToLinearKlsyn(A1) * 0.4"
    deps: [A1]

  a2Gain:
    expr: "-dbToLinearKlsyn(A2) * 0.15"
    deps: [A2]

  a3Gain:
    expr: "dbToLinearKlsyn(A3) * 0.06"
    deps: [A3]

  a4Gain:
    expr: "-dbToLinearKlsyn(A4) * 0.04"
    deps: [A4]

  a5Gain:
    expr: "dbToLinearKlsyn(A5) * 0.022"
    deps: [A5]

  a6Gain:
    expr: "-dbToLinearKlsyn(A6) * 0.03"
    deps: [A6]

  anpGain:
    expr: "dbToLinearKlsyn(AN) * 0.6"
    deps: [AN]

  abGain:
    expr: "dbToLinearKlsyn(AB) * 0.05"
    deps: [AB]

  gain0Db:
    expr: "(GO - 3) <= 0 ? 57 : (GO - 3)"
    deps: [GO]

  # klsyn88 fixed-point to WebAudio float normalization:
  # The C implementation (parwav.c) works in 16-bit fixed-point throughout,
  # with glottal sources emitting values up to ±13,000,000 (DOUBLET constant).
  # At output, parwv_truncate() clamps to [-32768, 32767] before writing PCM.
  # Our WASM primitives emit the same raw klsyn88-scale values, but WebAudio
  # expects [-1, 1] floats. Multiplying by 1/32768 here (where amp_gain0 is
  # applied in C, just before truncation) normalizes to the correct output range.
  gain0Linear:
    expr: "dbToLinearKlsyn(gain0Db) * 0.000030517578125"
    deps: [gain0Db]

  cascadePolarity:
    expr: "NFCASC % 2 == 0 ? -1 : 1"
    deps: [NFCASC]

  cascadeF2Freq:
    expr: "NFCASC >= 2 ? F2 : 0"
    deps: [NFCASC, F2]

  cascadeF2Bw:
    expr: "NFCASC >= 2 ? effectiveB2 : 0"
    deps: [NFCASC, effectiveB2]

  cascadeF3Freq:
    expr: "NFCASC >= 3 ? F3 : 0"
    deps: [NFCASC, F3]

  cascadeF3Bw:
    expr: "NFCASC >= 3 ? B3 : 0"
    deps: [NFCASC, B3]

  cascadeF4Freq:
    expr: "NFCASC >= 4 ? F4 : 0"
    deps: [NFCASC, F4]

  cascadeF4Bw:
    expr: "NFCASC >= 4 ? B4 : 0"
    deps: [NFCASC, B4]

  cascadeF5Freq:
    expr: "NFCASC >= 5 ? F5 : 0"
    deps: [NFCASC, F5]

  cascadeF5Bw:
    expr: "NFCASC >= 5 ? B5 : 0"
    deps: [NFCASC, B5]

  cascadeF6Freq:
    expr: "NFCASC >= 6 ? F6 : 0"
    deps: [NFCASC, F6]

  cascadeF6Bw:
    expr: "NFCASC >= 6 ? B6 : 0"
    deps: [NFCASC, B6]

  cascadeF7Freq:
    expr: "NFCASC >= 7 ? F7 : 0"
    deps: [NFCASC, F7]

  cascadeF7Bw:
    expr: "NFCASC >= 7 ? B7 : 0"
    deps: [NFCASC, B7]

  cascadeF8Freq:
    expr: "NFCASC >= 8 ? F8 : 0"
    deps: [NFCASC, F8]

  cascadeF8Bw:
    expr: "NFCASC >= 8 ? B8 : 0"
    deps: [NFCASC, B8]

  # PLSTEP constants are consumed by the shared interpreter telemetry path.
  # Keep them declarative here so experiment configs do not rely on hidden
  # interpreter defaults.
  plstepThreshold:
    expr: "plstepThreshold"
    deps: []

  plstepBurstOffsetDb:
    expr: "plstepBurstOffsetDb"
    deps: []
