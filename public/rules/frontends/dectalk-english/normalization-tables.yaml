# Text normalization lookup tables for dectalk-english frontend.
#
# English number/ordinal word tables. These are the same English words used by
# qlatt-english (DECtalk's l_us_con.c phoneme tables spell the identical words);
# the dectalk frontend keeps its own copy so its normalization pipeline is fully
# self-contained data, including the year-reading step the shared pipeline omits.
#
# Citations:
#   - Allen, Hunnicutt & Klatt 1987 Ch.3 (MITalk text analysis)
#   - DECtalk 4.63 l_us_con.c (punits/pteens/ptens/pordin number-word tables)

