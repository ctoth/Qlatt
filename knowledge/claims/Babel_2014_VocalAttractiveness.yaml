source:
  paper: Babel_2014_VocalAttractiveness
claims:
- id: claim146
  type: observation
  statement: 'For female voices: breathier voice quality (higher H1-A3, lower CPP)
    should correlate positively with perceived attractiveness'
  concepts:
  - voice_quality
  provenance:
    paper: Babel_2014_VocalAttractiveness
    page: 0
- id: claim147
  type: observation
  statement: 'For male voices: shorter segment durations and lower F1 for high vowels
    should correlate with higher attractiveness'
  concepts:
  - f1
  - duration
  provenance:
    paper: Babel_2014_VocalAttractiveness
    page: 0
- id: claim148
  type: observation
  statement: f0 should have a weak negative correlation with female voice attractiveness
    (slightly lower = more attractive)
  concepts:
  - f0
  provenance:
    paper: Babel_2014_VocalAttractiveness
    page: 0
- id: claim149
  type: observation
  statement: f0 should not significantly predict male voice attractiveness when other
    measures are controlled
  concepts:
  - f0
  provenance:
    paper: Babel_2014_VocalAttractiveness
    page: 0
