version: v1
functions:
  # Bundled condition inventory (#133): the rime boundary (annotation), the
  # postlexical bindings and structural in_s_cluster share dectalk_same_word;
  # test/declarative-frontend-same-word.test.ts names every caller. It is
  # false whenever either Segment is in no word. dectalk_fuse_vowel_r keeps
  # its permissive form (a Segment in no word passes) by testing
  # dectalk_word_id itself; Qlatt/beauty's named predicates stay separate.
  # A Segment's word is its Word Item (its SylStructure parent's parent), not
  # the word's text: in "sip sip." the two words have the same text and are
  # two words. The id of that Item, or '' for a Segment in no word.
  dectalk_word_id:
    params: [item]
    body: >-
      item == null || path(item, 'R:SylStructure.parent.parent') == null ? ''
      : path(item, 'R:SylStructure.parent.parent').id
    description: The id of the Word Item a Segment belongs to; '' when it belongs to none.
    citations:
      - "Taylor, Black & Caley 2001 (heterogeneous relation graphs: a Segment's Word through SylStructure)"
  dectalk_same_word:
    params: [a, b]
    body: "dectalk_word_id(a) != '' && dectalk_word_id(a) == dectalk_word_id(b)"
    description: Whether two Segments belong to one Word Item; callers retain their item-null and navigation conditions.
    citations:
      - "Taylor, Black & Caley 2001 (heterogeneous relation graphs: a Segment's Word through SylStructure)"
      - "Qlatt #133 engineering convention: same word requires both Segments to be in a word"
  # us_phcluster(first, second) as data: 'cluster', 's_onset' (CLUSTER_TRYS) or
  # 'none'. Arguments are phone names.
  dectalk_onset_cluster:
    params: [first, second]
    body: "get(get(params.policy.structure.onset_clusters, first, null), second, 'none')"
    description: Kind of two-consonant onset, from the frontend's onset cluster table.
    citations:
      - "DECtalk 4.63 p_us_sr1.c:175-228 us_phcluster"
  # --- Accessors for the duration rules (p_us_tim.c) -----------------------
  # An absent neighbour is the silence that bounds every DECtalk clause.
  dectalk_name:
    params: [item]
    body: >-
      item == null ? 'SIL'
      : regexReplace(get(params.policy.timing.port_names, item.phoneme, item.phoneme), '[0-9]$', '', '')
    description: DECtalk's allophone name for a Segment (port spelling and stress digit removed).
    citations:
      - "DECtalk 4.63 l_all_ph.h US_<name> allophone codes"
  dectalk_has:
    params: [item, feature]
    body: "feature in get(params.policy.timing.features, dectalk_name(item), [])"
    description: Whether DECtalk's feature word for the Segment's allophone has the named bit.
    citations:
      - "DECtalk 4.63 p_us_rom.h us_featb; ph_romi.c:214-225 phone_feature"
  # --- The speaking rate (ph_timng.c init_timing) --------------------------
  # Three numbers from the rate in words per minute. The argument is always
  # params.policy.timing.speaking_rate_wpm; integer division is a floor here
  # because every operand is positive.
  dectalk_sprat0:
    params: [wpm]
    body: >-
      max([params.policy.timing.rate_scaling.sprat0_minimum,
           wpm > params.policy.timing.rate_scaling.linear_above
             ? params.policy.timing.rate_scaling.linear_above
               + floor((wpm - params.policy.timing.rate_scaling.linear_above) / 2.0)
             : wpm])
    description: DECtalk's sprat0, the rate with its part above 250 halved and a floor of 75.
    citations:
      - "DECtalk 4.63 PH/ph_timng.c:238-247 (sprat0 = 250 + ((sprate - 250) >> 1) above 250)"
      - "DECtalk 4.63 PH/ph_timng.c:262-267 (SLOWTALK: sprat0 is at least 75)"
  dectalk_sprat1:
    params: [wpm]
    body: >-
      dectalk_sprat0(wpm) >= params.policy.timing.rate_scaling.neutral
        ? floor(16384.0
            * (params.policy.timing.rate_scaling.sprat1_fast.offset - dectalk_sprat0(wpm) < 0.0
                ? 1.0 : params.policy.timing.rate_scaling.sprat1_fast.offset - dectalk_sprat0(wpm))
            / params.policy.timing.rate_scaling.sprat1_fast.divisor)
        : floor(16384.0
            * (params.policy.timing.rate_scaling.sprat1_slow.offset - dectalk_sprat0(wpm))
            / params.policy.timing.rate_scaling.sprat1_slow.divisor)
    description: DECtalk's sprat1, the fraction of 16384 that scales pauses and the added part of a duration.
    citations:
      - "DECtalk 4.63 PH/ph_timng.c:273-288 (sprat1 = FRAC_ONE * (400 - sprat0) / 220 at 180 and above, FRAC_ONE * (300 - sprat0) / 120 below; a negative numerator is 1)"
      - "DECtalk 4.63 PH/ph_defs.h:793 muldv; ph_defs.h:418 FRAC_ONE 16384"
  dectalk_sprat2:
    params: [wpm]
    body: >-
      dectalk_sprat0(wpm) > params.policy.timing.rate_scaling.neutral
        ? floor(16384.0
            * (params.policy.timing.rate_scaling.sprat2_fast.offset - dectalk_sprat0(wpm) <= 0.0
                ? 1.0 : params.policy.timing.rate_scaling.sprat2_fast.offset - dectalk_sprat0(wpm))
            / params.policy.timing.rate_scaling.sprat2_fast.divisor)
        : floor((dectalk_sprat1(wpm) + 16384.0) / 2.0)
    description: DECtalk's sprat2, the fraction of 16384 that scales the multiplied part of a duration.
    citations:
      - "DECtalk 4.63 PH/ph_timng.c:290-302 (sprat2 = FRAC_ONE * (460 - sprat0) / 280 above 180, a numerator of 0 or less is 1; otherwise (sprat1 + FRAC_ONE) >> 1)"
  # A pause of Rule 1 at the current rate, from its length at 180.
  dectalk_pause_frames:
    params: [frames]
    body: >-
      max([params.policy.timing.rate_scaling.pause_minimum_frames,
           dectalk_mlsh1(frames, dectalk_sprat1(params.policy.timing.speaking_rate_wpm))])
    description: Frames of a clause pause after the speaking rate is applied; never fewer than two.
    citations:
      - "DECtalk 4.63 p_us_tim.c:261-268 (dpause = mlsh1(dpause, sprat1); a pause shorter than 2 frames is 2)"
  # Rule 1's pause at the head of a clause, from the clause's first phone.
  dectalk_clause_initial_pause_frames:
    params: [item]
    body: >-
      dectalk_pause_frames(
        dectalk_has(item, 'voiced') || dectalk_has(item, 'obstruent') || dectalk_has(item, 'plosive')
          ? params.policy.timing.pause_frames.clause_initial
          : params.policy.timing.pause_frames.clause_initial_other)
    description: Frames of the pause DECtalk puts before a clause whose first phone is the given Segment.
    citations:
      - "DECtalk 4.63 p_us_tim.c:229-232 (dpause = 4 when the next phone is FVOICD, FOBST or FPLOSV, else 5)"
      - "DECtalk 4.63 p_us_tim.c:261-268 (the pause is scaled by the speaking rate)"
  # A phone as the duration routine sees it when looking AHEAD from an earlier
  # phone. The routine turns the /t/ of [nt] into [d] while it times the /n/
  # (p_us_tim.c:627-638), so the vowel and the /n/ before it still saw a /t/.
  dectalk_ahead_name:
    params: [item]
    body: >-
      item == null ? 'SIL'
      : (get(item, 'voiced_from_t', false) ? 'T'
      : regexReplace(get(params.policy.timing.port_names, item.phoneme, item.phoneme), '[0-9]$', '', ''))
    description: DECtalk's allophone name for a later Segment, as it was when an earlier one was timed.
    citations:
      - "DECtalk 4.63 p_us_tim.c:627-638 (the /t/ of [nt] becomes [d] during the /n/'s turn)"
  dectalk_ahead_has:
    params: [item, feature]
    body: "feature in get(params.policy.timing.features, dectalk_ahead_name(item), [])"
    description: Whether a later Segment's allophone, as it was when an earlier one was timed, has the named feature bit.
    citations:
      - "DECtalk 4.63 p_us_tim.c:627-638"
      - "DECtalk 4.63 p_us_rom.h us_featb"
  dectalk_boundary:
    params: [item]
    body: "item == null ? 0.0 : get(params.policy.timing.boundary, get(item, 'rime_boundary', ''), 0.0)"
    description: FBOUNDARY value of a Segment's structure word; 0 when it has none.
    citations:
      - "DECtalk 4.63 ph_defs.h:249-262 FBOUNDARY"
  # A phone as the duration dictionary's keys spell it: its DECtalk name, with
  # an apostrophe in front when it is a vowel with primary stress.
  dectalk_dictionary_token:
    params: [item]
    body: >-
      (item.type == 'vowel' && get(item, 'stress', 0) == 1 ? "'" : "") + dectalk_name(item)
    description: The spelling of a phone in a duration dictionary key.
    citations:
      - "DECtalk 4.63 PH/ph_sort.c:192-215 durdic (S1 before the stressed vowel of a pattern)"
  dectalk_stress:
    params: [item]
    body: "item == null ? 0.0 : get(item, 'stress', 0.0)"
    description: FSTRESS value of a Segment's structure word.
    citations:
      - "DECtalk 4.63 ph_defs.h:219-226 FSTRESS"
  dectalk_next:
    params: [item]
    body: "item == null ? null : look_ahead_pred(item, 8, 'is_dectalk_allophone')"
    description: The next DECtalk allophone (a stop's release pieces and the dummy vowel are skipped).
    citations:
      - "DECtalk 4.63 p_us_tim.c:195-199 (phonex, strucnex, feanex)"
  dectalk_prev:
    params: [item]
    body: "item == null ? null : look_back_pred(item, 8, 'is_dectalk_allophone')"
    description: The previous DECtalk allophone.
    citations:
      - "DECtalk 4.63 p_us_tim.c:184-188 (pholas, struclas, fealas)"
  dectalk_mlsh1:
    params: [x, y]
    body: "floor(x * y / 16384.0)"
    description: Product of two numbers where one is a fraction of 16384, rounded down.
    citations:
      - "DECtalk 4.63 ph_defs.h:794 mlsh1(x,y) = (S16)(((S32)x * (S32)y) >> 14)"
  # A Segment's Word. What the lexicon says of a word (its form classes, the
  # phrase it starts) is kept there, because allophone rules replace Segments.
  dectalk_has_class:
    params: [item, name]
    body: >-
      item != null && path(item, 'R:SylStructure.parent.parent') != null
      && !isTrue(path(item, 'R:SylStructure.parent.parent'), 'clause_break_before')
      && name in get(path(item, 'R:SylStructure.parent.parent'), 'form_classes', [])
    description: >-
      Whether a Segment's word has a form class. A word with a clause break
      before it has none: its class was sent ahead of the break's comma.
    citations:
      - "Taylor, Black & Caley 2001 (heterogeneous relation graphs: a Segment's Word through SylStructure)"
      - "DECtalk 4.63 INCLUDE/fc_def.tab (form class bits)"
      - "DECtalk 4.63 PH/ph_task.c:590-600 (wordclass of each symbol is its word's class)"
      - "DECtalk 4.63 LTS/ls_util.c:808-853 (WORD_CLASS is written, then the break's COMMA)"
      - "DECtalk 4.63 PH/ph_task.c:931 (speak_now clears the held class when a clause is spoken)"
  # The class of a word with a clause break before it, asked of the Segment
  # after the break's silence: it arrives in the clause that the break ends.
  dectalk_late_class:
    params: [item, name]
    body: >-
      item != null && path(item, 'R:SylStructure.parent.parent') != null
      && isTrue(path(item, 'R:SylStructure.parent.parent'), 'clause_break_before')
      && name in get(path(item, 'R:SylStructure.parent.parent'), 'form_classes', [])
    description: Whether the word that follows a clause break has a form class.
    citations:
      - "DECtalk 4.63 LTS/ls_util.c:808-853 (WORD_CLASS is written, then the break's COMMA)"
      - "DECtalk 4.63 PH/ph_task.c:598-626 (the class is counted when it arrives)"
  # A word's class as the lexicon gives it, wherever it was sent.
  dectalk_word_class:
    params: [item, name]
    body: >-
      item != null && path(item, 'R:SylStructure.parent.parent') != null
      && name in get(path(item, 'R:SylStructure.parent.parent'), 'form_classes', [])
    description: Whether a Segment's word has a form class in the lexicon.
    citations:
      - "DECtalk 4.63 INCLUDE/fc_def.tab (form class bits)"
  dectalk_phrase_start:
    params: [item]
    body: >-
      item == null || path(item, 'R:SylStructure.parent.parent') == null ? ''
      : get(path(item, 'R:SylStructure.parent.parent'), 'phrase_start', '')
    description: The phrase a Segment's word starts ('vp' or 'pp'), or ''.
    citations:
      - "DECtalk 4.63 LTS/ls_dict.c:774-778 (PPSTART and VPSTART ahead of a dictionary entry)"
  dectalk_phrase_state:
    params: [item]
    body: >-
      item == null || path(item, 'R:SylStructure.parent.parent') == null ? ''
      : get(path(item, 'R:SylStructure.parent.parent'), 'phrase_start_state', '')
    description: >-
      What became of the prepositional-phrase start of a Segment's word: 'pp'
      kept, 'word' dropped; '' for any other word.
    citations:
      - "DECtalk 4.63 ph_sort.c:1055-1070"
  dectalk_word_start:
    params: [item]
    body: >-
      path(item, 'R:SylStructure.parent.parent') != null
      && (behind(item, 1) == null
          || path(behind(item, 1), 'R:SylStructure.parent.parent') == null
          || path(behind(item, 1), 'R:SylStructure.parent.parent').id
             != path(item, 'R:SylStructure.parent.parent').id)
    description: Whether a Segment is the first of its word.
    citations:
      - "DECtalk 4.63 PH/ph_task.c:598-600 (a word's class arrives ahead of its first phone)"
  # The clause's first allophone after its opening pause: nothing before it,
  # or the silence that ends the clause before. A silence phonemic text wrote
  # is an allophone inside its clause (ph_sort.c:1331-1333): it can be the
  # first ("[_<600>m'uwn]."), and the phone after one starts no clause
  # ("[m'uw_n]").
  dectalk_clause_first:
    params: [item]
    body: >-
      (item.phoneme != 'SIL' || isTrue(item, 'written_silence'))
      && (behind(item, 1) == null
          || (behind(item, 1).phoneme == 'SIL' && !isTrue(behind(item, 1), 'written_silence')))
    description: Whether a Segment is the first allophone of its clause.
    citations:
      - "DECtalk 4.63 PH/ph_task.c:657-668, 931 (a clause is what stands between two clause-ending symbols)"
      - "DECtalk 4.63 PH/ph_sort.c:1331-1333 (a silence symbol in the input is a phone of the clause)"
  # The text stage's "first word of a sentence" state is reset where its
  # delimiter routine reads a period, a question mark or an exclamation mark.
  # The two periods after an initial ("J. Smith") do not pass through that
  # routine: the initial rule eats the written period and the periods are
  # sent as phones. The text rule that speaks an initial says so of its two
  # periods (lexical.yaml tn_initial, terminal kind 'sent_mark'), and their
  # silences carry it as punctuation_sent. Measured on say.exe: in "Who is J.
  # Is it Bob? Ask." the "Is" keeps its unstressed form and the question
  # mark is sent as a period; in "Who is he. Is it Bob? Ask." neither.
  dectalk_ends_sentence:
    params: [item]
    body: >-
      item != null && item.phoneme == 'SIL'
      && get(item, 'punctuationSymbol', null) in ['.', '?', '!']
      && !isTrue(item, 'punctuation_sent')
    description: Whether a silence is a sentence end that resets the text stage's first-word state.
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:1160, 1195, 1220 and 1236 (ls_task_do_right_punct resets wstate at a period, a question mark, an exclamation mark and a flush)"
      - "DECtalk 4.63 LTS/ls_task.c:2612-2617 (the initial rule reads the period itself), 1516-1519 and 1547-1549 (its two periods are sent as phones)"
      - "DECtalk 4.63 LTS/ls_task.c:1590 (ls_task_set_what_state acts only when the state has been reset)"
predicates:
  # Scanning back from a question mark: the sentence end that reset the
  # first-word state, or the utterance's first Segment.
  is_sentence_reset_or_first: >-
    dectalk_ends_sentence(current) || behind(current, 1) == null
  # A Segment that stands for one DECtalk allophone: every phone, a stop by its
  # closure, the silence at a clause boundary, and a silence phonemic text
  # wrote.
  is_dectalk_allophone: >-
    !(current.type in ["stop_release", "stop_aspiration"])
    && (current.phoneme != "SIL" || get(current, "punctuationSymbol", null) != null
        || isTrue(current, "written_silence"))
  is_dectalk_phone: >-
    !(current.type in ["stop_release", "stop_aspiration"]) && current.phoneme != "SIL"
  # An allophone inside a clause: a phone, or a silence phonemic text wrote.
  is_clause_allophone: >-
    !(current.type in ["stop_release", "stop_aspiration"])
    && (current.phoneme != "SIL" || isTrue(current, "written_silence"))
  is_clause_silence: >-
    current.phoneme == "SIL" && get(current, "punctuationSymbol", null) != null
  # Never true: the stop of a count that runs to the utterance's start.
  is_never: "false"
  # The first phone of the utterance's second clause, when that clause comes
  # after a break the text stage inserted (the word has clause_break_before):
  # the utterance's first clause ended at an inserted break.
  is_first_clause_break_start: >-
    current.phoneme != "SIL" && behind(current, 1) != null
    && behind(current, 1).phoneme == "SIL"
    && get(behind(current, 1), "punctuationSymbol", null) != null
    && isTrue(path(current, 'R:SylStructure.parent.parent'), 'clause_break_before')
    && count_back_pred(current, 1000, 'is_never', 'is_clause_silence') == 1.0
  # A clause silence the text wrote (a sentence end, a comma, colon or
  # semicolon), not one DECtalk put in front of a word itself. LTS starts its
  # form-class index again at each of these (LTS/ls_task.c:1255-1256,
  # 1272-1273); a break it inserts leaves the index alone (ls_util.c:824-853).
  is_written_clause_silence: >-
    current.phoneme == "SIL" && get(current, "punctuationSymbol", null) != null
    && !(next != null && path(next, 'R:SylStructure.parent.parent') != null
         && isTrue(path(next, 'R:SylStructure.parent.parent'), 'clause_break_before'))
  # Phones that stand for two of DECtalk's input phones: a vowel fused with
  # its /r/, and the survivor of a deleted geminate.
  is_fused_vowel: isTrue(current, "fused_with_r")
  is_geminate_survivor: isTrue(current, "after_deleted_geminate")
  # The first Segment of a word: number_words counts one per word of the
  # clause (ph_sort.c:1462-1464).
  is_dectalk_word_start: dectalk_word_start(current)
  # ph_task.c:611-614: the first Segment of a word DECtalk counts as a verb.
  is_verb_count_word_start: >-
    dectalk_word_start(current)
    && (dectalk_has_class(current, "verb") || dectalk_has_class(current, "ed")
        || dectalk_has_class(current, "be") || dectalk_has_class(current, "ing"))
  # ph_task.c:624: a counted verb that is also a function word.
  is_function_verb_word_start: >-
    dectalk_word_start(current)
    && (dectalk_has_class(current, "verb") || dectalk_has_class(current, "ed")
        || dectalk_has_class(current, "be") || dectalk_has_class(current, "ing"))
    && dectalk_has_class(current, "func")
  # ph_sort.c:1272-1284: a word reaches the verb branch only if it is neither a
  # noun nor an adjective.
  is_verb_branch_word_start: >-
    dectalk_word_start(current)
    && (dectalk_has_class(current, "verb") || dectalk_has_class(current, "ed"))
    && !dectalk_has_class(current, "noun") && !dectalk_has_class(current, "adj")
  # The first Segment of a word DECtalk's number_words counts: one entered
  # with a word boundary, which a verb-phrase start replaces (ph_sort.c:1464).
  # A word after phonemic text has none either (phrase state 'alone').
  is_counted_word_start: >-
    dectalk_word_start(current) && dectalk_phrase_start(current) != "vp"
    && dectalk_phrase_state(current) != "alone"
  # The same with the clause's first word, which always counts: the words
  # that make up number_words. DECtalk itself reports 2 for "I want to go."
  # and 3 for "The president arrived yesterday." (pht0draw's number_words,
  # read from an instrumented build).
  is_number_word_start: >-
    dectalk_word_start(current)
    && ((dectalk_phrase_start(current) != "vp" && dectalk_phrase_state(current) != "alone")
        || behind(current, 1) == null || behind(current, 1).phoneme == "SIL")
  # A word counted a second time: "to", "and" or "for" at its clause's end.
  # It comes in as word boundary, SPECIALWORD, PPSTART, and the phone sort
  # turns that PPSTART into another word boundary (ph_sort.c:1055-1070):
  # DECtalk itself counts 4 words in "It is for." and 5 in "What is it for."
  is_twice_counted_word_start: >-
    dectalk_word_start(current) && dectalk_phrase_state(current) == "word"
  # FSYLL: a vowel or a syllabic consonant.
  is_dectalk_syllabic: >-
    current.type == "vowel" || current.phoneme in ["EL", "EM", "EN"]
  # A syllabic where the hat rises and whose previous allophone is FSON1: the
  # hat rise there sets phinton's gesture_ref (Ph_inton2.c:849-852).
  is_hat_rise_reference: >-
    (current.type == "vowel" || current.phoneme in ["EL", "EM", "EN"])
    && isTrue(current, "hat_begins")
    && dectalk_has(dectalk_prev(current), "son1")
  # A syllabic with any FSTRESS bit: primary, secondary or emphasis
  # (Ph_inton2.c:926, the stress impulse's test).
  is_stressed_syllabic: >-
    (current.type == "vowel" || current.phoneme in ["EL", "EM", "EN"])
    && get(current, "stress", 0) > 0
  # A syllabic whose stress is FSTRESS_2 alone: what promote_last_2 looks for
  # (ph_aloph.c:1701-1704).
  is_secondary_syllabic: >-
    (current.type == "vowel" || current.phoneme in ["EL", "EM", "EN"])
    && get(current, "stress", 0) == 2
  # Scanning back from a syllabic: the syllabic the hat pattern processed
  # before it, or the start of its stretch (is_clause_or_phrase_start),
  # whichever is nearer. promote_last_2's scans are counted a stretch at a time.
  is_hat_state_or_stretch_start: >-
    get(current, "hat_top", null) != null
    || (current.phoneme == "SIL" && get(current, "punctuationSymbol", null) != null)
    || (dectalk_word_start(current) && dectalk_phrase_state(current) == "pp")
    || (dectalk_word_start(current) && dectalk_phrase_start(current) == "vp"
        && behind(current, 1) != null && isTrue(behind(current, 1), "morpheme_boundary_after"))
  # A syllabic with FSTRESS_1: primary stress or emphasis.
  is_primary_syllabic: >-
    (current.type == "vowel" || current.phoneme in ["EL", "EM", "EN"])
    && (get(current, "stress", 0) == 1 || get(current, "stress", 0) == 3)
  # The Segment after one whose boundary is a verb phrase or stronger, or the
  # clause's final silence: where remaining_stresses_til(FVPNEXT) stops.
  is_past_phrase_boundary: >-
    (current.phoneme == "SIL" && get(current, "punctuationSymbol", null) != null)
    || (behind(current, 1) != null
        && get(behind(current, 1), "rime_boundary", "") in ["vp", "comma", "period", "question", "exclaim"])
    || (dectalk_word_start(current) && dectalk_phrase_state(current) == "pp")
  # A phrase start with no word boundary before it (state 'alone') leaves
  # FPPNEXT alone on the phone before it, which is below FVPNEXT and FCBNEXT:
  # neither scan stops there. At 140 words per minute or slower that phone
  # has FVPNEXT, which its rime_boundary says (the test above).
  # Where remaining_stresses_til(FCBNEXT) stops: the clause's final silence, or
  # the first Segment of a word whose phrase start left the comma value on the
  # phone before it. The word start is tested, not that phone's boundary:
  # DECtalk's scan runs before its rules delete or fuse the phone. The same
  # for the part of a hyphenated word that starts a verb phrase: the phone
  # before it has the hyphen's value and the phrase start's, which together
  # are the comma value (dectalk_rime_boundary).
  is_clause_or_phrase_start: >-
    (current.phoneme == "SIL" && get(current, "punctuationSymbol", null) != null)
    || (dectalk_word_start(current) && dectalk_phrase_state(current) == "pp")
    || (dectalk_word_start(current) && dectalk_phrase_start(current) == "vp"
        && behind(current, 1) != null && isTrue(behind(current, 1), "morpheme_boundary_after"))
  # The same two stops for the count of primary stresses ahead, which also
  # ends at any silence (ph_aloph.c:1663-1664, `phonemes[m] == GEN_SIL`): a
  # silence phonemic text wrote inside the clause ends it too.
  is_stress_count_phrase_stop: >-
    (current.phoneme == "SIL"
     && (get(current, "punctuationSymbol", null) != null || isTrue(current, "written_silence")))
    || (behind(current, 1) != null
        && get(behind(current, 1), "rime_boundary", "") in ["vp", "comma", "period", "question", "exclaim"])
    || (dectalk_word_start(current) && dectalk_phrase_state(current) == "pp")
  is_stress_count_clause_stop: >-
    (current.phoneme == "SIL"
     && (get(current, "punctuationSymbol", null) != null || isTrue(current, "written_silence")))
    || (dectalk_word_start(current) && dectalk_phrase_state(current) == "pp")
    || (dectalk_word_start(current) && dectalk_phrase_start(current) == "vp"
        && behind(current, 1) != null && isTrue(behind(current, 1), "morpheme_boundary_after"))
  is_question_boundary: 'current.phoneme == "SIL" && current.punctuationSymbol == "?"'
  is_stressed_vowel: 'current.type == "vowel" && has(current.stress) && current.stress == 1'
  is_stressed_vowel_or_boundary: >-
    (current.type == "vowel" && has(current.stress) && current.stress == 1)
    || (current.phoneme == "SIL" && !isTrue(current, "written_silence"))
  is_syllabic_or_boundary: >-
    current.type == "vowel" || current.phoneme in ["EL", "EM", "EN"]
    || current.phoneme == "SIL"
# Syllabification tables (DATA) for the generic `syllabify` pass.  Extracted
# from DECtalk 4.63 by scripts/dt10-extract-syllable-tables.ts:
#   - nuclei         <- p_us_sy1.c us_syl_vowels
#   - onset_clusters <- p_us_sy1.c us_syl_cons (legal onsets, longest-first)
#   - affixes        <- p_us_sy1.c us_common_affixes
#   - ascky          <- p_us_sy1.c us_ascky_check[] indexed by the US_* phone
#                       enum (l_all_ph.h); the phone NAME is the port ARPABET
#                       symbol (port renames HX->HH, NX->NG, Q->GS).
# The r-colored vowels IR/ER/AR/OR/UR are mapped to the syllabic-r nucleus char
# 'R' (= US_RR) although DECtalk's us_ascky_check marks them 0: DECtalk
# syllabifies BEFORE r-fusion (the word still has a separate /R/), whereas the
# Qlatt port fuses in the postlexical phase before this annotation pass, so the
# fused rhotic vowel is the syllable nucleus here.
# Citation: DECtalk 4.63 p_us_sy1.c (us_syl_vowels, us_syl_cons,
#   us_common_affixes, us_ascky_check); l_all_ph.h (US_* phone enum).
