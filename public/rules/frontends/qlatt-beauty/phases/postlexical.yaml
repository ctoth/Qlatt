version: v1
patterns:
  palatalization_dy_pattern:
    relation: Segment
    sequence:
      - capture: d_token
        where:
          all:
            - current.phoneme == 'D'
            - { predicate: next_diff_word }
      - capture: y_token
        where: >-
          current.phoneme == 'Y'
  palatalization_ty_pattern:
    relation: Segment
    sequence:
      - capture: t_token
        where:
          all:
            - current.phoneme == 'T'
            - { predicate: next_diff_word }
      - capture: y_token
        where: >-
          current.phoneme == 'Y'
rules:
  the_prevocalic_reduction:
    kind: postlexical
    select:
      relation: Segment
      where: >-
        current.phoneme == 'AH' && (has(current.stress) ? current.stress == 0 : false) && (has(current.word) ?
        current.word == 'the' : false) && next != null && (has(next.word) ? next.word != 'the' : false) && next.type ==
        'vowel'
    define:
      ih_target: target("IH0")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
            - duration
            - inherentDuration
            - type
          phoneme: "\"IH\""
          target: ih_target
    citations:
      - Miller 1998 (postlexical rule inventory)
  to_reduction:
    kind: postlexical
    select:
      relation: Segment
      where: >-
        current.phoneme == 'UW' && (has(current.stress) ? current.stress == 0 : false) &&
        (has(current.word) ? current.word == 'to' : false) &&
        next != null && next.type != 'vowel'
    define:
      schwa_target: target("AH0")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
            - duration
            - inherentDuration
            - type
          phoneme: "\"AH\""
          target: schwa_target
    citations:
      - Miller 1998 (function word reduction)
      - Klatt 1979
  t_flapping:
    kind: postlexical
    select:
      relation: Segment
      where: >-
        current.phoneme == 'T' && prev != null && prev.type == 'vowel' && (has(prev.stress) ? prev.stress == 1 : false)
        && next != null && next.type == 'vowel' && (has(next.stress) ? next.stress == 0 : false)
    define:
      dx_target: target("DX")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: "\"DX\""
          type: "\"flap\""
          duration: "params.policy.duration.flap_duration_ms"
          inherentDuration: "params.policy.duration.flap_duration_ms"
          target: dx_target
    citations:
      - Miller 1998 (postlexical rule inventory)
  t_deletion:
    kind: postlexical
    select:
      relation: Segment
      where:
        all:
          - "current.phoneme == 'T'"
          - "prev != null && prev.type != 'vowel'"
          - predicate: prev_same_word
          - "next != null && next.type != 'vowel'"
          - not:
              predicate: next_same_word
    apply:
      - field: duration
        op: set
        value: 0
        tag: t_deletion
      - field: inherentDuration
        op: set
        value: 0
        tag: t_deletion
      - field: AV
        op: set
        value: 0
        tag: t_deletion
      - field: AF
        op: set
        value: 0
        tag: t_deletion
      - field: AH
        op: set
        value: 0
        tag: t_deletion
    citations:
      - Miller 1998 (t-deletion in coda clusters)
      - Allen et al. 1987
  t_glottalization:
    kind: postlexical
    select:
      relation: Segment
      where:
        all:
          - "current.phoneme == 'T'"
          - "next != null && (next.type == 'nasal' || next.type == 'liquid' || next.type == 'glide')"
          - predicate: next_same_word
    define:
      gs_target: target("GS")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: "\"GS\""
          target: gs_target
          duration: 30
          inherentDuration: 30
          type: "\"stop_closure\""
    citations:
      - Miller 1998 (t-glottalization before sonorants)
      - Allen et al. 1987
  d_flapping:
    kind: postlexical
    select:
      relation: Segment
      where: >-
        current.phoneme == 'D' && prev != null && prev.type == 'vowel' && (has(prev.stress) ? prev.stress == 1 : false)
        && next != null && next.type == 'vowel' && (has(next.stress) ? next.stress == 0 : false)
    define:
      dx_target: target("DX")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: "\"DX\""
          type: "\"flap\""
          duration: "params.policy.duration.flap_duration_ms"
          inherentDuration: "params.policy.duration.flap_duration_ms"
          target: dx_target
    citations:
      - Miller 1998 (postlexical rule inventory -- /d/ flapping mirrors /t/ flapping)
  d_deletion:
    kind: postlexical
    select:
      relation: Segment
      where:
        all:
          - "current.phoneme == 'D'"
          - "prev != null && prev.type != 'vowel'"
          - predicate: prev_same_word
          - "next != null && next.type != 'vowel'"
          - not:
              predicate: next_same_word
    apply:
      - field: duration
        op: set
        value: 0
        tag: d_deletion
      - field: inherentDuration
        op: set
        value: 0
        tag: d_deletion
      - field: AV
        op: set
        value: 0
        tag: d_deletion
      - field: AF
        op: set
        value: 0
        tag: d_deletion
      - field: AH
        op: set
        value: 0
        tag: d_deletion
    citations:
      - Miller 1998 (d-deletion in coda clusters, mirrors t-deletion)
      - Allen et al. 1987
  palatalization_dy:
    kind: postlexical
    match: palatalization_dy_pattern
    define:
      jh_target: target("JH")
    splice:
      type: replace_range
      range_left: d_token.sync_left
      range_right: y_token.sync_right
      suppress:
        - d_token
        - y_token
      insert:
        - copy_from: d_token
          copy_fields:
            - stress
            - word
          phoneme: "\"JH\""
          target: jh_target
          type: "\"affricate\""
          duration: 80
          inherentDuration: 80
    citations:
      - Klatt 1979
      - Miller 1998
  palatalization_ty:
    kind: postlexical
    match: palatalization_ty_pattern
    define:
      ch_target: target("CH")
    splice:
      type: replace_range
      range_left: t_token.sync_left
      range_right: y_token.sync_right
      suppress:
        - t_token
        - y_token
      insert:
        - copy_from: t_token
          copy_fields:
            - stress
            - word
          phoneme: "\"CH\""
          target: ch_target
          type: "\"affricate\""
          duration: 90
          inherentDuration: 90
    citations:
      - Klatt 1979
  glottal_stop_insertion:
    kind: postlexical
    select:
      relation: Segment
      where:
        all:
          - "current.type == 'vowel'"
          - "has(current.stress) && current.stress >= 1"
          - predicate: prev_diff_word
          - "prev == null || prev.type == 'vowel' || has(prev.boundary)"
    define:
      gs_target: target("GS")
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - phoneme: "\"GS\""
          target: gs_target
          duration: 30
          inherentDuration: 30
          type: "\"stop_closure\""
          voiceless: true
          glottal: true
          word: current.word
        - copy_from: current
    citations:
      - Allen et al. 1987
      - Miller 1998 (21% glottalization rate)
