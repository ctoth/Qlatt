      r_f3_coda:
        value: 1400
        citations:
          - Espy-Wilson 2000
      f1_release_labial:
        value: 250
        citations:
          - Stevens 1998 Ch.8
      f1_release_alveolar:
        value: 300
        citations:
          - Stevens 1998 Ch.8
      f1_release_velar:
        value: 280
        citations:
          - Stevens 1998 Ch.8
      vowel_reduction_schwa_f1:
        value: 500
        citations:
          - Peterson & Barney 1952
      vowel_reduction_schwa_f2:
        value: 1500
        citations:
          - Peterson & Barney 1952
      vowel_reduction_rate:
        value: 0.4
        citations:
          - Allen et al. 1987 Ch.9
      nasalization_b1_multiplier:
        value: 2.0
        citations:
          - Chen 1997
      palatal_f2_locus:
        value: 2600
        citations:
          - Stevens & House 1956
          - Allen et al. 1987 Ch.11
      palatal_f2_back_vowel:
        value: 2400
        citations:
          - Stevens & House 1956
          - Allen et al. 1987 Ch.11
      vcv_coarticulation_rate:
        value: 0.3
        citations:
          - Ohman 1966
predicates:
  is_question_boundary: >-
    current.phoneme == 'SIL' && current.punctuationSymbol == '?'
  is_stressed_vowel: >-
    current.type == 'vowel' && has(current.stress) && current.stress == 1
streams:
  phone:
    type: base
    features:
      type:
        - vowel
        - stop
        - stop_closure
        - stop_release
        - stop_aspiration
        - fricative
        - affricate
        - silence
        - liquid
        - nasal
        - glide
    scalars:
      duration:
        unit: ms
        resolution: klatt
        max: 500
  f0:
    type: point
    value_type: number
    unit: Hz
phases:
  - name: postlexical
    rules:
      - the_prevocalic_reduction
      - t_flapping
  - name: structural
    rules:
      - insert_voiceless_stop_release_and_aspiration
      - insert_voiced_stop_release
  - name: duration
    rules:
      - k_context_cl_f2
      - k_context_rel_copy
      - bilabial_f2_locus
      - bilabial_rel_copy
      - alveolar_f2_locus
      - alveolar_rel_copy
      - palatal_f2_locus
      - nasal_antiformant_by_place
      - nasal_place_assimilation
      - dark_l_allophony
      - r_f3_lowering
      - f1_stop_onset
      - burst_spectral_template
      - vcv_coarticulation
      - vowel_reduction
      - anticipatory_nasalization
      - non_word_initial_consonant_shortening
      - word_medial_consonant_shortening
      - unstressed_consonant_shortening
      - word_initial_lengthening
      - punctuation_pause
      - stress_duration
      - vowel_shortening
      - vowel_before_voiceless_stop_shortening
      - pre_boundary_lengthening
      - fricative_minimum_duration
      - lock_stop_release_duration
      - stop_unreleasing
      - s_cluster_aspiration_reduction
      - sw_explicit_override
      - sw_default_assignment
    resolve_scalars:
      - duration
  - name: prosody
    rules:
      - f0_baseline_start
      - f0_question_baseline_raise
      - f0_pitch_reset
      - f0_targets
      - f0_voiceless_onset_perturbation
      - f0_voiced_onset_perturbation
      - f0_stress_peak
      - f0_continuation_rise
      - f0_question_rise_onset
      - f0_question_rise
  - name: finalize
    after:
      - duration
      - prosody
    rules: []
    compute_times: true
    resolve_points:
      - f0
rules:
  the_prevocalic_reduction:
    kind: postlexical
    citation: Miller 1998, Pronunciation Modeling in Speech Synthesis (postlexical rule inventory)
    select:
      stream: phone
      where: >-
        current.phoneme == 'AH0'
        && (has(current.word) ? current.word == 'the' : false)
        && next != null
        && (has(next.word) ? next.word != 'the' : false)
        && next.type == 'vowel'
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
            - params
            - duration
            - inherentDuration
            - type
          phoneme: '"IH0"'
  t_flapping:
    kind: postlexical
    citation: Miller 1998, Pronunciation Modeling in Speech Synthesis (postlexical rule inventory)
    select:
      stream: phone
      where: >-
        current.phoneme == 'T_CL'
        && prev != null && prev.type == 'vowel'
        && (has(prev.stress) ? prev.stress == 1 : false)
        && next != null && next.type == 'vowel'
        && (has(next.stress) ? next.stress == 0 : false)
    define:
      dx_target: target("DX")
      dx_params: dx_target.params
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: '"DX"'
          type: '"flap"'
          duration: '30'
          inherentDuration: '30'
          params: dx_params
  insert_voiceless_stop_release_and_aspiration:
    kind: structural
    citation: Lisker & Abramson 1964 (English long-lag VOT isolated /p/=58, /t/=70, /k/=80 ms; sentence-initial /p/=28, /t/=39, /k/=43 ms); Stevens 1998 Ch.8; Allen et al. 1987 Table C-1
    select:
      stream: phone
      where: >-
        current.phoneme in ['P_CL', 'T_CL', 'K_CL'] && (next != null ? !(next.type in ['stop', 'stop_closure',
        'stop_release', 'stop_aspiration']) : false)
    define:
      rel: >-
        current.phoneme == "P_CL" ? "P_REL" : (current.phoneme == "T_CL" ? "T_REL" : "K_REL")
      asp: >-
        current.phoneme == "P_CL" ? "P_ASP" : (current.phoneme == "T_CL" ? "T_ASP" : "K_ASP")
      next_token: next
      weak: >-
        next_token != null ? next_token.phoneme == "SIL" : false
      rel_target: target(rel)
      asp_target: target(asp)
      vot_target: >-
        rel == "P_REL" ? params.policy.duration.vot_target_ms.p : (rel == "T_REL" ?
        params.policy.duration.vot_target_ms.t : params.policy.duration.vot_target_ms.k)
      vot_sum: 'rel_target.duration + asp_target.duration'
      rel_share: >-
        vot_sum > 0 ? rel_target.duration / vot_sum : params.policy.duration.vot_split_fallback_share
      rel_duration_base: 'vot_target * rel_share'
      asp_duration_base: 'vot_target - rel_duration_base'
      rel_params: >-
        weak ? merge(rel_target.params, {'AF': max([0, rel_target.params.AF - 10]), 'AH': max([0, rel_target.params.AH -
        10])}) : rel_target.params
      asp_params: >-
        weak ? merge(asp_target.params, {'AF': max([0, asp_target.params.AF - 10]), 'AH': max([0, asp_target.params.AH -
        10])}) : asp_target.params
      rel_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms,
        rel_duration_base * params.policy.duration.weak_release_scale]) : rel_duration_base
      asp_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms,
        asp_duration_base * params.policy.duration.weak_release_scale]) : asp_duration_base
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - phoneme: rel
          stress: 'has(current.stress) ? current.stress : null'
          word: 'has(current.word) ? current.word : null'
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: 'has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)'
        - phoneme: asp
          stress: 'has(current.stress) ? current.stress : null'
          word: 'has(current.word) ? current.word : null'
          weak: weak
          params: asp_params
          duration: asp_duration
          inherentDuration: asp_target.inherentDuration
          type: asp_target.type
          inventorySW: 'has(asp_target.inventorySW) ? asp_target.inventorySW : (has(asp_params.SW) ? asp_params.SW : 0)'
        - copy_from: next_token
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - params
            - duration
            - inherentDuration
            - type
            - punctuationSymbol
  insert_voiced_stop_release:
    kind: structural
    citation: Lisker & Abramson 1964 (English voiced stop short-lag mode for /b d g/ in initial position); Stevens 1998 Ch.8; Allen et al. 1987 Table C-1
    select:
      stream: phone
      where: >-
        current.phoneme in ['B_CL', 'D_CL', 'G_CL'] && (next != null ? !(next.type in ['stop', 'stop_closure',
        'stop_release', 'stop_aspiration']) : false)
    define:
      rel: >-
        current.phoneme == "B_CL" ? "B_REL" : (current.phoneme == "D_CL" ? "D_REL" : "G_REL")
      next_token: next
      weak: >-
        next_token != null ? next_token.phoneme == "SIL" : false
      rel_target: target(rel)
      rel_params: >-
        weak ? merge(rel_target.params, {'AF': max([0, rel_target.params.AF - 10]), 'AH': max([0, rel_target.params.AH -
        10])}) : rel_target.params
      rel_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms,
        rel_target.duration * params.policy.duration.weak_release_scale]) : rel_target.duration
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - phoneme: rel
          stress: 'has(current.stress) ? current.stress : null'
          word: 'has(current.word) ? current.word : null'
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: 'has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)'
        - copy_from: next_token
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - params
            - duration
            - inherentDuration
            - type
            - punctuationSymbol
  stress_duration:
    kind: scalar
    citation: Klatt 1976 §III.B
    select:
      stream: phone
      where: current.type == 'vowel'
    apply:
      - field: duration
        op: mul
        value: >-
          has(current.stress) && current.stress == 1 ? params.policy.duration.stress_primary_multiplier :
          ((has(current.stress) && current.stress == 0) ? params.policy.duration.stress_unstressed_multiplier : 1)
        tag: stress
  k_context_cl_f2:
    kind: scalar
    citation: Allen et al. 1987 Ch.11 (velar locus)
    select:
      stream: phone
      where: current.phoneme == 'K_CL'
    define:
      cand: >-
        next != null && next.phoneme == "K_REL" ? ahead(current, 2) : next
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: >-
              cand != null && cand.type == 'vowel' && (has(cand.back) ? cand.back == true : false)
            value: 1200
          - when: >-
              cand != null && cand.type == 'vowel' && ((has(cand.front) ? cand.front == true : false) || (has(cand.hi)
              ? cand.hi == true : false))
            value: 1900
          - default: 1500
  k_context_rel_copy:
    kind: scalar
    citation: Allen et al. 1987 Ch.11 (velar locus transitions)
    select:
      stream: phone
      where: >-
        current.phoneme == "K_REL" && (prev != null ? prev.phoneme == "K_CL" : false)
    apply:
      - field: params.F2
        op: set
        value: 'prev != null && has(prev.params.F2) ? prev.params.F2 : 1500'
  bilabial_f2_locus:
    kind: scalar
    citation: "Stevens & House 1956 (locus varies 700-1500 Hz by vowel context; 1200 Hz is midpoint approximation per Allen et al. 1987 Ch.11)"
    select:
      stream: phone
      where: current.phoneme in ['P_CL', 'B_CL', 'M']
    define:
      cand: >-
        current.phoneme == "P_CL" ? (next != null && next.phoneme == "P_REL" ? ahead(current, 2) : next) :
        (current.phoneme == "B_CL" ? (next != null && next.phoneme == "B_REL" ? ahead(current, 2) : next) : next)
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: >-
              cand != null && cand.type == 'vowel' && ((has(cand.front) ? cand.front == true : false) || (has(cand.hi)
              ? cand.hi == true : false))
            value: 1350
          - when: >-
              cand != null && cand.type == 'vowel' && (has(cand.back) ? cand.back == true : false)
            value: 1100
          - default: params.policy.formant.bilabial_f2_locus
  bilabial_rel_copy:
    kind: scalar
    citation: Stevens & House 1956; Allen et al. 1987 Ch.11 (bilabial locus transitions)
    select:
      stream: phone
      where: >-
        current.phoneme in ["P_REL", "B_REL"] && (prev != null ? prev.phoneme in ["P_CL", "B_CL"] : false)
    apply:
      - field: params.F2
        op: set
        value: 'prev != null && has(prev.params.F2) ? prev.params.F2 : params.policy.formant.bilabial_f2_locus'
  alveolar_f2_locus:
    kind: scalar
    citation: Stevens & House 1956 (formant transitions); Allen et al. 1987 Ch.11 (alveolar F2 locus ~1800 Hz)
    select:
      stream: phone
      where: current.phoneme in ['T_CL', 'D_CL', 'N']
    define:
      cand: >-
        current.phoneme == "T_CL" ? (next != null && next.phoneme == "T_REL" ? ahead(current, 2) : next) :
        (current.phoneme == "D_CL" ? (next != null && next.phoneme == "D_REL" ? ahead(current, 2) : next) : next)
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: >-
              cand != null && cand.type == 'vowel' && ((has(cand.front) ? cand.front == true : false) || (has(cand.hi)
              ? cand.hi == true : false))
            value: params.policy.formant.alveolar_f2_locus_front
          - when: >-
              cand != null && cand.type == 'vowel' && (has(cand.back) ? cand.back == true : false)
            value: params.policy.formant.alveolar_f2_locus_back
          - default: params.policy.formant.alveolar_f2_locus
  alveolar_rel_copy:
    kind: scalar
    citation: Stevens & House 1956; Allen et al. 1987 Ch.11 (alveolar locus transitions)
    select:
      stream: phone
      where: >-
        current.phoneme in ["T_REL", "D_REL"] && (prev != null ? prev.phoneme in ["T_CL", "D_CL"] : false)
    apply:
      - field: params.F2
        op: set
        value: 'prev != null && has(prev.params.F2) ? prev.params.F2 : params.policy.formant.alveolar_f2_locus'
  nasal_antiformant_by_place:
    kind: scalar
    citation: Stevens 1998 Ch.10 (nasal consonant oral cavity zeros); Fujimura 1962 (nasal consonant antiresonances by place)
    select:
      stream: phone
      where: current.type == 'nasal'
    apply:
      - field: params.FNZ
        op: set
        dispatch:
          - when: current.phoneme == 'M'
            value: params.policy.formant.nasal_fnz_m
          - when: current.phoneme == 'N'
            value: params.policy.formant.nasal_fnz_n
          - when: current.phoneme == 'NG'
            value: params.policy.formant.nasal_fnz_ng
          - default: 'has(current.params.FNZ) ? current.params.FNZ : 480'
  dark_l_allophony:
    kind: scalar
    citation: Recasens 2012 (lateral allophones); Sproat & Fujimura 1993 (syllable-final /l/ darkening)
    select:
      stream: phone
      where: current.phoneme == 'L'
    define:
      n: next
      is_coda: >-
        n == null || n.phoneme == 'SIL' || n.type in ['stop', 'stop_closure', 'fricative', 'nasal', 'affricate']
        || (has(n.word) && has(current.word) && n.word != current.word)
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: is_coda
            value: params.policy.formant.dark_l_f2
          - default: 'has(current.params.F2) ? current.params.F2 : 1050'
      - field: params.F3
        op: set
        dispatch:
          - when: is_coda
            value: params.policy.formant.dark_l_f3
          - default: 'has(current.params.F3) ? current.params.F3 : 2600'
  r_f3_lowering:
    kind: scalar
    citation: Espy-Wilson 2000 (acoustic modeling of American /r/); Stevens 1998 Ch.9
    select:
      stream: phone
      where: current.phoneme == 'R'
    define:
      n: next
      is_coda: >-
        n == null || n.phoneme == 'SIL' || n.type in ['stop', 'stop_closure', 'fricative', 'nasal', 'affricate']
        || (has(n.word) && has(current.word) && n.word != current.word)
    apply:
      - field: params.F3
        op: set
        dispatch:
          - when: is_coda
            value: params.policy.formant.r_f3_coda
          - default: params.policy.formant.r_f3_onset
  f1_stop_onset:
    kind: scalar
    citation: Stevens 1998 Ch.8 (stop consonant acoustics -- low F1 at release onset)
    select:
      stream: phone
      where: current.type == 'stop_release'
    apply:
      - field: params.F1
        op: set
        dispatch:
          - when: has(current.bilabial) && current.bilabial == true
            value: params.policy.formant.f1_release_labial
          - when: has(current.alveolar) && current.alveolar == true
            value: params.policy.formant.f1_release_alveolar
          - when: has(current.velar) && current.velar == true
            value: params.policy.formant.f1_release_velar
          - default: 280
  s_cluster_aspiration_reduction:
    kind: scalar
    citation: Lisker & Abramson 1964 (s-cluster VOT); Zue 1976 (s-clusters reduce VOT to voice-like values)
    select:
      stream: phone
      where: current.type == 'stop_aspiration'
    define:
      s_token: >-
        look_back_where(current, 4, "current.phoneme == 'S'")
    constraint: 's_token != null'
    apply:
      - field: duration
        op: set
        value: params.policy.duration.s_cluster_aspiration_ms
      - field: params.AH
        op: add
        value: >-
          -(params.policy.duration.s_cluster_ah_reduction_db)
  vowel_reduction:
    kind: scalar
    citation: Allen et al. 1987 Ch.9 (unstressed vowel centralization); Klatt 1976 (unstressed shortening); Peterson & Barney 1952 (schwa formants)
    select:
      stream: phone
      where: >-
        current.type == 'vowel' && has(current.params) && has(current.params.F1)
        && (has(current.stress) ? current.stress == 0 : false)
    apply:
      - field: params.F1
        op: set
        value: >-
          current.params.F1 + (params.policy.formant.vowel_reduction_schwa_f1 - current.params.F1) * params.policy.formant.vowel_reduction_rate
      - field: params.F2
        op: set
        value: >-
          current.params.F2 + (params.policy.formant.vowel_reduction_schwa_f2 - current.params.F2) * params.policy.formant.vowel_reduction_rate
  anticipatory_nasalization:
    kind: scalar
    citation: Chen 1997 (nasalized vowel acoustics -- B1 increase 1.5-3x); Hawkins & Stevens 1985 (nasal vowel correlates)
    select:
      stream: phone
      where: >-
        current.type == 'vowel' && (next != null ? next.type == 'nasal' : false)
    apply:
      - field: params.B1
        op: mul
        value: params.policy.formant.nasalization_b1_multiplier
  non_word_initial_consonant_shortening:
    kind: scalar
    citation: Klatt 1976 Table III (non-word-initial consonant K=0.7)
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate']
        && (prev != null ? (has(prev.word) && has(current.word) ? prev.word == current.word : false) : false)
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.non_word_initial_consonant_multiplier
        tag: consonant_position
  unstressed_consonant_shortening:
    kind: scalar
    citation: Klatt 1976 Table III (unstressed consonant K=0.8)
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate']
        && (has(current.stress) ? current.stress == 0 : false)
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.unstressed_consonant_multiplier
        tag: consonant_stress
  word_initial_lengthening:
    kind: scalar
    citation: White 2014 (localized word-initial lengthening +20-30% on onset consonants)
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate']
        && (prev == null ? true : (has(prev.word) && has(current.word) ? prev.word != current.word : true))
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.word_initial_lengthening_multiplier
        tag: word_initial
  fricative_minimum_duration:
    kind: scalar
    citation: "Jongman 1989 (sibilant/labiodental identification thresholds; dental fricatives poorly identified even at full duration; glottal /hh/ not tested -- value is engineering estimate)"
    select:
      stream: phone
      where: current.type == 'fricative'
    apply:
      - field: duration
        op: set
        dispatch:
          - when: >-
              current.phoneme in ['S', 'Z', 'SH', 'ZH']
            value: >-
              current.duration > params.policy.duration.fricative_min_sibilant_ms ? current.duration : params.policy.duration.fricative_min_sibilant_ms
          - when: >-
              current.phoneme in ['F', 'V']
            value: >-
              current.duration > params.policy.duration.fricative_min_labiodental_ms ? current.duration : params.policy.duration.fricative_min_labiodental_ms
          - when: >-
              current.phoneme in ['TH', 'DH']
            value: >-
              current.duration > params.policy.duration.fricative_min_dental_ms ? current.duration : params.policy.duration.fricative_min_dental_ms
          - when: current.phoneme == 'HH'
            value: >-
              current.duration > params.policy.duration.fricative_min_glottal_ms ? current.duration : params.policy.duration.fricative_min_glottal_ms
          - default: current.duration
  punctuation_pause:
    kind: scalar
    citation: Allen et al. 1987 Ch.8 (pause insertion)
    select:
      stream: phone
      where: current.phoneme == 'SIL' && has(current.punctuationSymbol)
    apply:
      - field: duration
        op: set
        value: >-
          current.punctuationSymbol == ',' ? params.policy.duration.punctuation_pause_comma_ms :
          (current.punctuationSymbol in ['.', '?', '!'] ? params.policy.duration.punctuation_pause_terminal_ms :
          current.duration)
  vowel_shortening:
    kind: scalar
    citation: Klatt 1976; Allen et al. 1987 Ch.9 (postvocalic context duration factors)
    select:
      stream: phone
      where: current.type == 'vowel'
    define:
      'n': next
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: "n == null ? true : n.phoneme == 'SIL'"
            value: params.policy.duration.vowel_shortening_end_multiplier
          - when: >-
              n == null ? false : (has(n.voiced) && n.voiced == true && n.type == 'fricative')
            value: params.policy.duration.vowel_shortening_voiced_fricative_multiplier
          - when: >-
              n == null ? false : (has(n.voiced) && n.voiced == true && n.type in ['stop', 'stop_release'])
            value: params.policy.duration.vowel_shortening_voiced_stop_multiplier
          - when: "n == null ? false : n.type == 'nasal'"
            value: params.policy.duration.vowel_shortening_nasal_multiplier
          - when: >-
              n == null ? false : (has(n.voiceless) && n.voiceless == true && n.type in ['stop', 'stop_closure'])
            value: params.policy.duration.vowel_shortening_voiceless_stop_multiplier
          - default: 1
        tag: segmental_context
  pre_boundary_lengthening:
    kind: scalar
    citation: Klatt 1976 §III.A
    select:
      stream: phone
      where: current.phoneme != 'SIL'
    define:
      'n': next
      cur_word: >-
        has(current.word) ? current.word : ""
      next_word: >-
        n != null && has(n.word) ? n.word : ""
    apply:
      - field: duration
        op: mul
        dispatch:
          - when: "n == null"
            value: params.policy.duration.pre_boundary_terminal_multiplier
          - when: "n.phoneme == 'SIL' && has(n.punctuationSymbol)"
            value: params.policy.duration.pre_boundary_terminal_multiplier
          - when: "n.phoneme != 'SIL' && cur_word != '' && next_word != '' && cur_word != next_word"
            value: params.policy.duration.pre_boundary_word_multiplier
          - default: 1
        tag: boundary
  lock_stop_release_duration:
    kind: scalar
    citation: Allen et al. 1987 Table C-1 (fixed burst/aspiration durations)
    select:
      stream: phone
      where: current.type in ['stop_release', 'stop_aspiration']
    apply:
      - field: duration
        op: set
        value: 'has(current.inherentDuration) ? current.inherentDuration : current.duration'
  sw_explicit_override:
    kind: scalar
    citation: Klatt 1980 (SW switch); Allen et al. 1987 Table 12-1
    select:
      stream: phone
      where: has(current.inventorySW)
    apply:
      - field: params.SW
        op: set
        value: current.inventorySW
  sw_default_assignment:
    kind: scalar
    citation: Klatt 1980 (cascade/parallel source routing)
    select:
      stream: phone
      where: '!has(current.inventorySW)'
    apply:
      - field: params.SW
        op: set
        value: >-
          current.type in ['fricative', 'affricate', 'stop_release', 'stop_aspiration'] ? 1 : 0
  f0_baseline_start:
    kind: point
    citation: Pierrehumbert 1980; O'Shaughnessy 1976
    select:
      stream: phone
      where: prev == null
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.policy.f0.base_hz
      tag: f0_baseline
  f0_targets:
    kind: point
    citation: Pierrehumbert 1980; Allen et al. 1987; O'Shaughnessy 1976
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL' && ((has(current.params.AV) && current.params.AV > 0) || (has(current.params.AVS) &&
        current.params.AVS > 0))
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: >-
        max([((params.policy.f0.base_hz - params.policy.f0.fall_rate_hz * (phrase_total <= 1 ? 0 :
        (double(phrase_index) / double(phrase_total - 1)))) * (has(current.params.F0_Factor) ?
        current.params.F0_Factor : 1)), params.policy.f0.base_hz * params.policy.f0.declination_floor_ratio])
      tag: f0_declination
  f0_stress_peak:
    kind: point
    citation: O'Shaughnessy 1976; Allen et al. 1987
    select:
      stream: phone
      where: >-
        current.type == 'vowel' && current.stress == 1 && ((has(current.params.AV) && current.params.AV > 0) ||
        (has(current.params.AVS) && current.params.AVS > 0))
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: >-
        (prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) * params.policy.f0.stress_rise
      tag: f0_stress
  f0_question_rise:
    kind: point
    citation: O'Shaughnessy 1976 (Tune B final rise targets 170-190 Hz and ~20% lift); Pierrehumbert 1980; Ladd 2008
    select:
      stream: phone
      where:
        predicate: is_question_boundary
    define:
      prev_f0: prev_point('f0')
      prior_f0_hz: 'prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value'
      rise_target_hz: >-
        max([prior_f0_hz + params.policy.f0.question_rise_hz, prior_f0_hz * params.policy.f0.question_rise_ratio,
        params.policy.f0.question_target_floor_hz])
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        rise_target_hz > params.policy.f0.question_target_ceiling_hz ? params.policy.f0.question_target_ceiling_hz :
        rise_target_hz
      tag: f0_question
  f0_question_rise_onset:
    kind: point
    citation: O'Shaughnessy 1976 (rise begins before final boundary); Pierrehumbert 1980; Ladd 2008 Ch.5
    select:
      stream: phone
      where:
        predicate: is_question_boundary
    define:
      last_stress: >-
        look_back_pred(current, 8, "is_stressed_vowel")
      prev_f0: prev_point('f0')
    constraint: 'last_stress != null'
    insert_point:
      stream: f0
      at: at_ratio(last_stress, 0.8)
      value: 'prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value'
      tag: f0_question_onset
  f0_voiceless_onset_perturbation:
    kind: point
    citation: "O'Shaughnessy 1976 (synthesis rule: +20% F0 after voiceless onset); cf. Hombert et al. 1979 (empirical: ~8% perturbation)"
    select:
      stream: phone
      where: >-
        current.type == 'vowel'
        && (prev != null ? (prev.type in ['stop_release', 'stop_aspiration']
            ? (has(prev.voiceless) ? prev.voiceless == true : false)
            : (prev.type == 'fricative'
               ? (has(prev.voiceless) ? prev.voiceless == true : false)
               : false))
           : false)
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        (prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) * params.policy.f0.voiceless_onset_raise
      tag: f0_onset_perturbation
  f0_voiced_onset_perturbation:
    kind: point
    citation: O'Shaughnessy 1976 (after voiced onset F0 starts ~5% lower, peak delayed)
    select:
      stream: phone
      where: >-
        current.type == 'vowel'
        && (prev != null ? (prev.type in ['stop_closure', 'stop_release']
            ? (has(prev.voiced) ? prev.voiced == true : false)
            : false)
           : false)
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        (prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) * params.policy.f0.voiced_onset_lower
      tag: f0_onset_perturbation
  f0_continuation_rise:
    kind: point
    citation: O'Shaughnessy 1976 (continuation rise +8 Hz at non-terminal boundaries like commas)
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL'
        && (has(current.punctuationSymbol) ? current.punctuationSymbol == ',' : false)
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        (prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) + params.policy.f0.continuation_rise_hz
      tag: f0_continuation
  palatal_f2_locus:
    kind: scalar
    citation: Stevens & House 1956 (formant transitions); Allen et al. 1987 Ch.11 (palatal F2 locus ~2600 Hz)
    select:
      stream: phone
      where: current.phoneme == 'Y'
    apply:
      - field: params.F2
        op: set
        dispatch:
          - when: >-
              next != null ? (next.type == 'vowel' ? (has(next.back) ? next.back == true : false) : false) : false
            value: params.policy.formant.palatal_f2_back_vowel
          - default: params.policy.formant.palatal_f2_locus
  vowel_before_voiceless_stop_shortening:
    kind: scalar
    citation: Klatt 1976 Table I (vowel shortening before voiceless stops)
    select:
      stream: phone
      where: >-
        current.type == 'vowel'
        && (next != null ? (next.type == 'stop_closure'
            ? (has(next.voiceless) ? next.voiceless == true : false)
            : false)
           : false)
    define:
      nn: ahead(current, 2)
      phrase_final: >-
        nn == null ? true : nn.phoneme == 'SIL'
    apply:
      - field: duration
        op: add
        dispatch:
          - when: phrase_final
            value: params.policy.duration.vowel_vl_stop_shortening_phrasefinal_ms
          - default: params.policy.duration.vowel_vl_stop_shortening_other_ms
        tag: voiceless_context
  burst_spectral_template:
    kind: scalar
    citation: Blumstein & Stevens 1979 (burst spectral invariance); Zue 1976 (burst amplitude by place)
    select:
      stream: phone
      where: current.type == 'stop_release'
    apply:
      - field: params.A2
        op: set
        dispatch:
          - when: has(current.bilabial) && current.bilabial == true
            value: 50
          - when: has(current.alveolar) && current.alveolar == true
            value: 40
          - when: has(current.velar) && current.velar == true
            value: 45
          - default: 'has(current.params.A2) ? current.params.A2 : 0'
      - field: params.A3
        op: set
        dispatch:
          - when: has(current.bilabial) && current.bilabial == true
            value: 40
          - when: has(current.alveolar) && current.alveolar == true
            value: 50
          - when: has(current.velar) && current.velar == true
            value: 50
          - default: 'has(current.params.A3) ? current.params.A3 : 0'
      - field: params.A4
        op: set
        dispatch:
          - when: has(current.bilabial) && current.bilabial == true
            value: 35
          - when: has(current.alveolar) && current.alveolar == true
            value: 50
          - when: has(current.velar) && current.velar == true
            value: 55
          - default: 'has(current.params.A4) ? current.params.A4 : 0'
      - field: params.A5
        op: set
        dispatch:
          - when: has(current.bilabial) && current.bilabial == true
            value: 45
          - when: has(current.alveolar) && current.alveolar == true
            value: 45
          - when: has(current.velar) && current.velar == true
            value: 40
          - default: 'has(current.params.A5) ? current.params.A5 : 0'
      - field: params.A6
        op: set
        dispatch:
          - when: has(current.bilabial) && current.bilabial == true
            value: 30
          - when: has(current.alveolar) && current.alveolar == true
            value: 50
          - when: has(current.velar) && current.velar == true
            value: 35
          - default: 'has(current.params.A6) ? current.params.A6 : 0'
  nasal_place_assimilation:
    kind: scalar
    citation: Allen et al. 1987 Ch.10 (nasal place assimilation); research-coarticulation.md
    select:
      stream: phone
      where: current.phoneme == 'N'
    define:
      n: next
      next_is_obstruent: >-
        n != null ? (n.type in ['stop_closure', 'stop_release', 'fricative', 'affricate']) : false
      next_bilabial: >-
        next_is_obstruent ? (has(n.bilabial) ? n.bilabial == true : false) : false
      next_velar: >-
        next_is_obstruent ? (has(n.velar) ? n.velar == true : false) : false
    constraint: next_is_obstruent
    apply:
      - field: params.FNZ
        op: set
        dispatch:
          - when: next_bilabial
            value: params.policy.formant.nasal_fnz_m
          - when: next_velar
            value: params.policy.formant.nasal_fnz_ng
          - default: 'has(current.params.FNZ) ? current.params.FNZ : 1700'
      - field: params.F2
        op: set
        dispatch:
          - when: next_bilabial
            value: params.policy.formant.bilabial_f2_locus
          - when: next_velar
            value: 'has(current.params.F2) ? current.params.F2 : 1400'
          - default: 'has(current.params.F2) ? current.params.F2 : 1400'
  stop_unreleasing:
    kind: scalar
    citation: Miller 1998 (unreleased stops before non-sonorants); Crystal & House 1988
    select:
      stream: phone
      where: current.type == 'stop_release'
    define:
      n: next
    constraint: >-
      n != null ? n.type == 'stop_closure' : false
    apply:
      - field: params.AF
        op: set
        value: 0
      - field: duration
        op: set
        value: params.policy.duration.stop_unreleasing_min_ms
  word_medial_consonant_shortening:
    kind: scalar
    citation: Klatt 1976 Table III (word-medial consonant K=0.7)
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate']
        && (prev != null ? (has(prev.word) && has(current.word) ? prev.word == current.word : false) : false)
        && (next != null ? (has(next.word) && has(current.word) ? next.word == current.word : false) : false)
    apply:
      - field: duration
        op: mul
        value: params.policy.duration.word_medial_consonant_multiplier
        tag: consonant_medial
  vcv_coarticulation:
    kind: scalar
    citation: Ohman 1966 (VCV coarticulation model, F2 varies ~280 Hz by transconsonantal vowel); Allen et al. 1987 Ch.11
    select:
      stream: phone
      where: >-
        current.type in ['stop_closure', 'nasal', 'liquid', 'glide']
        && (prev != null ? prev.type == 'vowel' : false)
    define:
      n: next
      next_vowel: >-
        n == null ? null : (n.type == 'vowel' ? n :
        (has(n.type) ? (n.type in ['stop_release', 'stop_aspiration'] ? ahead(current, 2) : null) : null))
      has_flanking: >-
        next_vowel != null ? (next_vowel.type == 'vowel' ? true : false) : false
      prev_f2: >-
        has(prev.params.F2) ? prev.params.F2 : 1500
      next_f2: >-
        has_flanking ? (has(next_vowel.params.F2) ? next_vowel.params.F2 : 1500) : 1500
      flanking_avg_f2: >-
        has_flanking ? (prev_f2 + next_f2) / 2 : 0
      cur_f2: >-
        has(current.params.F2) ? current.params.F2 : 1500
    constraint: has_flanking
    apply:
      - field: params.F2
        op: set
        value: >-
          cur_f2 + (flanking_avg_f2 - cur_f2) * params.policy.formant.vcv_coarticulation_rate
  f0_question_baseline_raise:
    kind: point
    citation: O'Shaughnessy 1976 (question baseline 125 Hz vs declarative 110 Hz)
    select:
      stream: phone
      where: prev == null
    define:
      question_ahead: >-
        look_ahead_pred(current, 20, "is_question_boundary")
    constraint: 'question_ahead != null'
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.policy.f0.question_base_hz
      tag: f0_question_baseline
  f0_pitch_reset:
    kind: point
    citation: Pierrehumbert 1980; Ladd 2008 Ch.5 (declination reset at intonational phrase boundaries)
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL'
        && (prev != null ? (prev.phoneme == 'SIL'
            ? (has(prev.punctuationSymbol) ? true : false)
            : false)
           : false)
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.policy.f0.base_hz
      tag: f0_reset
