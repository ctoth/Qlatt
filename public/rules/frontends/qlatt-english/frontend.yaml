parameters:
  policy:
    rate:
      undershoot_coefficient:
        value: 0.3
        citations:
          - Lindblom 1963 (articulatory undershoot at fast rates)
          - "Engineering estimate: 0.3 coefficient maps rate excess to undershoot factor"
      f0_range_exponent:
        value: 0.5
        citations:
          - Ladd 2008 Ch.9 (F0 range narrows at fast speaking rates; sqrt = exponent 0.5)
      transition_scale_exponent:
        value: 1.0
        citations:
          - Broad & Fertig 1970 (formant transition durations scale inversely with rate)
    duration:
      rate_scale:
        value: 1.0
        citations:
          - Klatt 1976 §III (speech rate scaling)
      vot_target_ms:
        initial:
          p:
            value: 28
            citations:
              - Lisker & Abramson 1964 Table 17 (English sentence-initial /p/)
          t:
            value: 39
            citations:
              - Lisker & Abramson 1964 Table 17 (English sentence-initial /t/)
          k:
            value: 43
            citations:
              - Lisker & Abramson 1964 Table 17 (English sentence-initial /k/)
        noninitial:
          p:
            value: 34
            citations:
              - Lisker & Abramson 1964 Table 17 (English sentence non-initial /p/)
          t:
            value: 37
            citations:
              - Lisker & Abramson 1964 Table 17 (English sentence non-initial /t/)
          k:
            value: 49
            citations:
              - Lisker & Abramson 1964 Table 17 (English sentence non-initial /k/)
      vot_split_fallback_share:
        value: 0.5
        citations:
          - Allen et al. 1987 Table C-1
      weak_release_min_ms:
        # Reverted from 05e057a3 and 7b285e8d: no-rationale tune commits
        # shipped without updating load-bearing tests; Allen 1987 supports 15 ms.
        value: 15
        citations:
          - Allen et al. 1987 Table C-1
      weak_release_scale:
        value: 0.5
        citations:
          - Allen et al. 1987 Table C-1
      stress_primary_multiplier:
        value: 1.3
        citations:
          - Klatt 1976 §III.B
      stress_unstressed_multiplier:
        value: 0.8
        citations:
          - Klatt 1976 §III.B
      punctuation_pause_comma_ms:
        value: 150
        citations:
          - Allen et al. 1987 Ch.8
      punctuation_pause_phrase_break_ms:
        value: 200
        citations:
          - Allen et al. 1987 Ch.8
          - >-
            Engineering estimate: semicolon/colon pause is typically stronger than comma and weaker than terminal
            punctuation
      punctuation_pause_terminal_ms:
        value: 300
        citations:
          - Allen et al. 1987 Ch.8
      vowel_shortening_end_multiplier:
        value: 1.2
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiced_fricative_multiplier:
        value: 1.6
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiced_fricative_medial_multiplier:
        value: 1.1
        citations:
          - "Klatt 1979 (voicing effect reduced phrase-medially; ~1.1x vs ~1.6x phrase-finally)"
      vowel_shortening_voiced_stop_multiplier:
        value: 1.2
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_nasal_multiplier:
        value: 0.85
        citations:
          - Allen et al. 1987 Ch.9
      vowel_shortening_voiceless_stop_multiplier:
        value: 0.7
        citations:
          - Allen et al. 1987 Ch.9
      # Break-index pre-boundary lengthening (replaces old punctuation-based proxy).
      # Citation: Wightman et al. 1992, Klatt 1976 §III.A, Crystal & House 1988
      # BI threshold values for categorization (ToBI break index tier is 0-4).
      pre_boundary_bi4_threshold:
        value: 4
        citations:
          - Silverman et al. 1992 (ToBI break index tier, level 4 = intonational phrase)
      pre_boundary_bi3_threshold:
        value: 3
        citations:
          - Silverman et al. 1992 (ToBI break index tier, level 3 = intermediate phrase)
      pre_boundary_bi2_threshold:
        value: 2
        citations:
          - Silverman et al. 1992 (ToBI break index tier, level 2 = weak intermediate phrase)
      pre_boundary_bi4_multiplier:
        value: 1.5
        citations:
          - Wightman et al. 1992 (intonational phrase boundary, breakIndex=4)
          - Klatt 1976 §III.A (phrase-final ~2x, conservative 1.5 with other rules stacking)
      pre_boundary_bi4_obstruent_multiplier:
        value: 1.2
        citations:
          - Crystal & House 1988 (obstruents show weaker phrase-final lengthening)
          - Wightman et al. 1992
      pre_boundary_bi3_multiplier:
        value: 1.3
        citations:
          - Wightman et al. 1992 (intermediate phrase boundary, breakIndex=3)
      pre_boundary_bi3_obstruent_multiplier:
        value: 1.1
        citations:
          - Crystal & House 1988
          - Wightman et al. 1992
      pre_boundary_bi2_multiplier:
        value: 1.15
        citations:
          - Wightman et al. 1992 (weak intermediate phrase, breakIndex=2)
      pre_boundary_bi1_multiplier:
        value: 1.0
        citations:
          - Wightman 1992 (break index 0 and 1 are indistinguishable for duration)
          - Klatt 1976 §III.A (word boundary, small effect)
          - White 2014 (word-boundary lengthening is a secondary cue)
      # Accent-based vowel lengthening
      accent_nuclear_multiplier:
        value: 1.25
        citations:
          - van Santen 1994 (nuclear accent amplification)
          - "Engineering estimate: ~25% nuclear accent lengthening on stressed vowel"
      accent_stressed_multiplier:
        value: 1.15
        citations:
          - van Santen 1994 (prenuclear accent lengthening)
          - "Engineering estimate: ~15% prenuclear accent lengthening on stressed vowel"
      accent_unstressed_multiplier:
        value: 1.05
        citations:
          - White 2014 (accent distributes across word, small effect on unstressed)
          - "Engineering estimate"
      incompressibility_ratio_vowel:
        value: 0.42
        citations:
          - "Klatt 1976 Eq. 1 (MINDUR = 0.42 * inherent duration as compressibility floor)"
      incompressibility_ratio_consonant:
        value: 0.6
        citations:
          - "Engineering estimate: consonants have higher incompressibility floor than vowels"
      # Duration cap — prevents pathological stacking of multiple lengthening rules
      max_duration_ratio:
        value: 2.0
        citations:
          - Klatt 1976 (phrase-final vowels up to 2x longer)
          - "Engineering estimate: 2.0x inherent duration as hard cap"
      s_cluster_aspiration_ms:
        value: 10
        citations:
          - Lisker & Abramson 1964
          - Zue 1976
      s_cluster_ah_reduction_db:
        value: 10
        citations:
          - Zue 1976
      aspiration_frication_t_af_db:
        value: 18
        citations:
          - Hanson & Stevens 2003 (alveolar /t/ often shows frication dominance into aspiration interval)
          - "Engineering estimate: conservative AF carryover level for /t/ aspiration segment"
      aspiration_frication_k_af_db:
        value: 0
        citations:
          - Stevens 1998 (voiceless stop aspiration is glottal source, not supraglottal frication)
          - Klatt 1980 (AF is zero during aspiration interval; only AH is nonzero)
      aspiration_frication_p_af_db:
        value: 0
        citations:
          - Hanson & Stevens 2003 (labial /p/ follows classical aspiration model in all subjects)
      aspiration_frication_weak_scale:
        value: 0.5
        citations:
          - "Engineering estimate: weak/final stop releases reduce non-modal noise sources"
      non_word_initial_consonant_multiplier:
        value: 0.7
        citations:
          - Klatt 1976 Table III
      unstressed_consonant_multiplier:
        value: 0.8
        citations:
          - Klatt 1976 Table III
      word_initial_lengthening_multiplier:
        value: 1.2
        citations:
          - White 2014
      fricative_min_sibilant_ms:
        value: 30
        citations:
          - Jongman 1989
      fricative_min_labiodental_ms:
        value: 50
        citations:
          - Jongman 1989
      fricative_min_dental_ms:
        value: 60
        citations:
          - Jongman 1989
      fricative_min_glottal_ms:
        value: 40
        citations:
          - Engineering estimate (Jongman 1989 does not test glottal /hh/)
      affricate_frication_min_ms:
        value: 20
        citations:
          - Allen et al. 1987 Table C-1
          - Stevens 1998 Ch.8
      word_medial_consonant_multiplier:
        value: 0.85
        citations:
          - Klatt 1976 Table III
      stop_unreleasing_min_ms:
        value: 5
        citations:
          - Crystal & House 1988
          - Miller 1998
      flap_duration_ms:
        value: 30
        citations:
          - Miller 1998, Pronunciation Modeling in Speech Synthesis
      diphthong_nucleus_share:
        value: 0.6
        citations:
          - Standard diphthong decomposition for formant synthesis
      rhotic_nucleus_min_share:
        value: 0.6
        citations:
          - Allen et al. 1987 Table C-5 (ER behaves as an r-colored vowel with diphthong-like internal timing)
          - Stevens 1998 §9.3 (liquid formant movement is transitional rather than a longer independent segment)
          - Engineering estimate (keep the vocalic nucleus dominant in short coda-rhotic tokens)
      liquid_rhotic_tail_floor_ms:
        value: 30
        citations:
          - Klatt 1976 Table III (minimum consonant durations; liquids require ~30 ms for perceptible formant transition)
          - Engineering estimate (prevents duration-rule stacking from collapsing rhotic tails below audibility)
      weak_release_amplitude_reduction_db:
        value: 10
        citations:
          - Allen et al. 1987 Table C-1
          - Stevens 1998 Ch.8
      polysyllabic_shortening_factor:
        value: 0.78
        citations:
          - Klatt 1976 Rule 4 (polysyllabic shortening)
      cluster_first_shortening:
        value: 0.88
        citations:
          - Klatt 1973 (cluster shortening, first consonant)
      cluster_subsequent_shortening:
        value: 0.78
        citations:
          - Klatt 1973 (cluster shortening, subsequent consonants)
    f0:
      # --- Pitch Range Model (Pierrehumbert 1980, Ladd 2008) ---
      base_hz:
        value: 110
        citations:
          - O'Shaughnessy 1976
          - Pierrehumbert 1980
      range_hz:
        value: 80
        citations:
          - "Pierrehumbert 1980 (male typical range ~80 Hz: top ~190 Hz, baseline ~110 Hz)"
          - Ladd 2008 Ch.5
      # --- Accent targets (fraction of range) ---
      h_star_height:
        value: 0.85
        citations:
          - "Pierrehumbert 1980 (H* target near top of range)"
          - Ladd 2008
      l_star_height:
        value: 0.15
        citations:
          - "Pierrehumbert 1980 (L* target near bottom of range)"
      # --- Downstep ---
      downstep_k:
        value: 0.6
        citations:
          - "Pierrehumbert 1980 (k ≈ 0.60)"
          - "Ladd 2008 (confirmed cross-linguistically)"
      downstep_floor_fraction:
        value: 0.25
        citations:
          - "Engineering estimate: prevents F0 collapse on long sentences"
          - "Derived from Pierrehumbert 1980 exponential floor behavior"
      # --- Boundary tones (fraction of range) ---
      boundary_l_pct_fraction:
        value: 0.0
        citations:
          - "Pierrehumbert 1980 Rule 6: L% = 0 (on baseline)"
      boundary_h_pct_fraction:
        value: 0.8
        citations:
          - "Pierrehumbert 1980 (H% near top of range)"
      upstep_factor:
        value: 0.2
        citations:
          - "Pierrehumbert 1980 Rule 9 / upstep formula (a ≈ 0.2)"
          - "Ladd 2008 Ch.3 (H% final rise modeled as local upstep)"
      # --- Final lowering ---
      final_lowering_factor:
        value: 0.85
        citations:
          - "Ladd 2008 pp.79-80 (final accent lower than downstep predicts)"
          - "Pierrehumbert 1980 (final lowering as separate effect)"
      # --- Sagging transitions (H*-H* interpolation) ---
      sag_depth_hz:
        value: 12
        citations:
          - "Pierrehumbert 1980 (H*-H* nonmonotonic interpolation)"
          - "Ladd 2008 pp.155-157 (sagging transition between H* accents)"
          - "Engineering estimate: 12 Hz below linear midpoint"
      sag_min_span_ms:
        value: 150
        citations:
          - "Pierrehumbert 1980 (closer H* accents show less/no dipping)"
          - "Engineering estimate: minimum span for audible sag"
      # --- Microprosodic (segmental, kept from O'Shaughnessy 1976) ---
      voiceless_onset_raise:
        value: 1.08
        citations:
          - "Hombert 1979 (~8% measured perturbation after voiceless onset)"
          - "O'Shaughnessy 1976 (synthesis rule: +20% F0 after voiceless onset)"
      voiced_onset_lower:
        value: 0.95
        citations:
          - O'Shaughnessy 1976
      # --- Continuation rise (kept for intermediate phrase boundaries) ---
      continuation_rise_hz:
        value: 8
        citations:
          - O'Shaughnessy 1976
      continuation_minor_rise_hz:
        value: 5
        citations:
          - O'Shaughnessy 1976
          - "Engineering estimate: semicolon/colon continuation rise is milder than comma rise"
