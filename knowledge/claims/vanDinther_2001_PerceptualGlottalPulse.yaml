source:
  paper: vanDinther_2001_PerceptualGlottalPulse
claims:
- id: claim_0095
  type: observation
  statement: 'Ra (return phase ratio) is the most perceptually relevant LF R-parameter.
    Rk (asymmetry) is secondary. Ro (open phase) has very low perceptual relevance.
    The 3-parameter LF model effectively operates as a 1-2 parameter model perceptually.

    '
  concepts:
  - speech_0008
  - speech_0007
  - speech_0002
  provenance:
    paper: vanDinther_2001_PerceptualGlottalPulse
    page: 3
    section: Perceptual Relevance Hierarchy
- id: claim_0096
  type: observation
  statement: 'Strong similarities in perceptual relevance between vowels /a/, /i/,
    /u/. Same trajectory in R-parameter space applies across vowels. R-parameter sets
    from different voice qualities lie on a single trajectory in parameter space.

    '
  concepts:
  - speech_0008
  - speech_0007
  - speech_0002
  provenance:
    paper: vanDinther_2001_PerceptualGlottalPulse
    page: 4
    section: Cross-Vowel Consistency
