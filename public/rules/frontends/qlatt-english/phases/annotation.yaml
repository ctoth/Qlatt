version: v1
rules:
  syllable_count_annotation:
    kind: scalar
    select:
      relation: Segment
      where: "current.type == 'vowel'"
    apply:
      - field: word_syllable_count
        op: set
        value: "count_word_vowels()"
        tag: syllable_count
    citations:
      - Klatt 1976 Rule 4 (polysyllabic shortening)

  cluster_position_annotation:
    kind: scalar
    select:
      relation: Segment
      where: "current.type != 'vowel' && current.phoneme != 'SIL' && has(current.word) && current.word != ''"
    apply:
      - field: cluster_position
        op: set
        value: "cluster_position_in_word()"
        tag: cluster_position
    citations:
      - Klatt 1973 (cluster shortening)

  # Word-class classification (former prosodic-annotator markFunctionWords pass).
  # A word is a function word iff its lower-cased orthography is in the declared
  # `function_words` set (pipeline.yaml string_sets); otherwise it is a content
  # word. SIL tokens are neither. Matches the imperative classifyWordProsody
  # exactly: absent/empty word folds to "" (a content word), and the lookup is
  # case-folded via lower(). These flags gate accent assignment downstream.
  mark_function_words:
    kind: scalar
    select:
      relation: Segment
    apply:
      - field: isFunctionWord
        op: set
        value: >-
          current.phoneme == 'SIL'
            ? false
            : ((has(current.word) ? lower(current.word) : '') in sets.function_words)
        tag: word_class
      - field: isContentWord
        op: set
        value: >-
          current.phoneme == 'SIL'
            ? false
            : !((has(current.word) ? lower(current.word) : '') in sets.function_words)
        tag: word_class
    citations:
      - O'Shaughnessy 1976
      - Allen, Hunnicutt & Klatt 1987

  # Accent assignment (former prosodic-annotator assignAccent pass).
  #
  # A word is accented iff it is a content word (require_content_word: true in
  # accent-policy.yaml) AND some phone in its contiguous word run carries primary
  # stress (required_stress: 1). Every phone of an accented word receives
  # isAccented=true; the accent CARRIER is the first primary-stressed phone of the
  # run (carrier_selection: first_primary_stress), which keeps expanded-diphthong
  # offglides from receiving separate pitch accents.
  #
  # The word run is the maximal contiguous run of like-`word` phones (SIL/word
  # change bound the run); two adjacent identical words merge, matching the
  # imperative pass byte-for-byte. Suppressed phones are invisible to selection
  # so they neither receive nor carry accent, exactly as before.
  #
  # These flags gate the downstream nuclear-accent, accent-type, and downstep
  # (accent_index_in_phrase) passes.
  assign_accent:
    kind: scalar
    select:
      relation: Segment
      where: "current.phoneme != 'SIL'"
    apply:
      - field: isAccented
        op: set
        value: >-
          isTrue(current, 'isContentWord') && word_run_has_primary_stress()
        tag: accent
      - field: isAccentCarrier
        op: set
        value: >-
          isTrue(current, 'isContentWord') && word_run_has_primary_stress()
            && is_first_primary_stress_in_word_run()
        tag: accent
    citations:
      - O'Shaughnessy 1976
      - Allen, Hunnicutt & Klatt 1987

  # Nuclear-accent identification (former prosodic-annotator identifyNuclearAccent
  # pass). The nuclear accent is the LAST accent carrier within the intonational
  # phrase (Ladd 2008, designated terminal element). The phrase-domain scan groups
  # the selected carriers by the same boundary logic as the imperative
  # `identifyPhrases`: a group ends at an ACTIVE SIL that carries a punctuation
  # symbol (period, comma, etc.). Each group's last carrier receives
  # isNuclearAccent=true; earlier carriers get false, feeding the accent-type pass
  # (prenuclear vs nuclear) and downstep suppression downstream.
  #
  # Suppressed punctuation SILs (e.g. a comma-SIL wedged mid-word) are excluded
  # from selection on both sides, so they never split a phrase — matching the
  # imperative `!isSuppressedToken` guard on the phrase boundary.
  identify_nuclear_accent:
    kind: scalar
    select:
      relation: Segment
      where: "isTrue(current, 'isAccentCarrier')"
    scan:
      domain: phrase
      reset_where: >-
        current.phoneme == 'SIL'
        && (has(current.punctuationSymbol) ? current.punctuationSymbol != null : false)
    apply:
      - field: isNuclearAccent
        op: set
        value: "phrase.is_last"
        tag: nuclear_accent
    citations:
      - Ladd 2008
      - Pierrehumbert 1980

  # Accent-type assignment (former prosodic-annotator assignAccentTypes pass).
  # Each accent carrier receives a Pierrehumbert/Ladd pitch-accent label drawn
  # from the tune inventory (was policy/tune-grammar.yaml) keyed by the phrase's
  # terminal punctuation type:
  #   - nuclear (last carrier): nuclear.with_prenuclear when the phrase has >=2
  #     carriers, else nuclear.without_prenuclear;
  #   - first prenuclear carrier (index 0): prenuclear.first;
  #   - later prenuclear carriers: prenuclear.later (H+!H*).
  # The phrase-domain scan groups carriers by the same punctuation-SIL boundary
  # as the nuclear pass; `phrase.count` gives the has-prenuclear test (a phrase
  # with 2+ carriers necessarily has a non-nuclear carrier) and `phrase.index`
  # the prenuclear ordinal. `phrase_terminal_punctuation()` reads the phrase's
  # trailing punctuation symbol (declarative/question/exclamation/continuation;
  # anything else, including none, defaults to declarative).
  #
  # Citations: Pierrehumbert 1980 (accent inventory), Ladd 2008 Ch.3 (tunes).
  assign_accent_types:
    kind: scalar
    select:
      relation: Segment
      where: "isTrue(current, 'isAccentCarrier')"
    scan:
      domain: phrase
      reset_where: >-
        current.phoneme == 'SIL'
        && (has(current.punctuationSymbol) ? current.punctuationSymbol != null : false)
    define:
      phrase_punct: "phrase_terminal_punctuation()"
      phrase_type: >-
        phrase_punct == '?' ? 'question'
          : phrase_punct == '!' ? 'exclamation'
          : (phrase_punct == ',' || phrase_punct == ';' || phrase_punct == ':') ? 'continuation'
          : 'declarative'
      has_prenuclear: "phrase.count >= 2"
    apply:
      - field: accentType
        op: set
        value: >-
          phrase.is_last
            ? (has_prenuclear
                ? {'declarative': 'H*+L', 'question': 'L*+H', 'exclamation': 'H*+L', 'continuation': 'H+L*'}[phrase_type]
                : {'declarative': 'H*', 'question': 'L*', 'exclamation': 'H*+L', 'continuation': 'H+L*'}[phrase_type])
            : (phrase.index == 0
                ? {'declarative': 'L+H*', 'question': 'L+H*', 'exclamation': 'L+H*', 'continuation': 'H*+H'}[phrase_type]
                : 'H+!H*')
        tag: accent_type
    citations:
      - Pierrehumbert 1980
      - Ladd 2008 Ch.3
