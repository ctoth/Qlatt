      fricative_min_labiodental_ms:
        value: 50
        citations:
          - Jongman 1989
      fricative_min_dental_ms:
        value: 60
        citations:
          - Jongman 1989
      fricative_min_glottal_ms:
        value: 40
        citations:
          - Jongman 1989
      vowel_vl_stop_shortening_phrasefinal_ms:
        value: -45
        citations:
          - Klatt 1976 Table I
      vowel_vl_stop_shortening_other_ms:
        value: -15
        citations:
          - Klatt 1976 Table I
      word_medial_consonant_multiplier:
        value: 0.85
        citations:
          - Klatt 1976 Table III
      stop_unreleasing_min_ms:
        value: 5
        citations:
          - Crystal & House 1988
          - Miller 1998
    f0:
      base_hz:
        value: 110
        citations:
          - O'Shaughnessy 1976
      fall_rate_hz:
        value: 20
        citations:
          - O'Shaughnessy 1976
      declination_floor_ratio:
        value: 0.6
        citations:
          - O'Shaughnessy 1976
      stress_rise:
        value: 1.15
        citations:
          - O'Shaughnessy 1976
      question_rise_hz:
