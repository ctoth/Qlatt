  # The next line: its value moves toward the next phone's beginning by the
  # phone's fraction (formant frequencies only); its slope is
  # mlsh1(divtab[frames], (new - old) << 3), a C division from 50 frames up,
  # and zero with old value and time kept when the line has no length.
  fd_diphthong_next_line_f1:
    kind: frame
    program: formants
    unit: "u.dip_F1"
    when: "f.index > r.durlin_F1 && r.durlin_F1 >= 0 && r.line_F1 + 1 < size(u.dv_F1)"
    set:
      - { register: cur_F1, value: "r.cur_F1 + floor(r.dipcum_F1 / 8)", tag: formant_diphthong }
      - { register: dipcum_F1, value: "0", tag: formant_diphthong }
      - { register: line_F1, value: "r.line_F1 + 1", tag: formant_diphthong }
      - register: dip_new
        value: >-
          u.dv_F1[r.line_F1] + (r.nxr_F1 > 0
            ? floor((r.nxr_F1 - u.dv_F1[r.line_F1])
              * (u.stressed ? params.policy.formant_drawing.coarticulation.stressed
                 : params.policy.formant_drawing.coarticulation.unstressed) / 16384)
            : 0)
        tag: formant_diphthong
      - { register: shr_ms, value: "r.line_F1 < size(u.dt_F1) ? u.dt_F1[r.line_F1] : -1", tag: formant_diphthong }
      - *shr_1
      - *shr_2
      - *shr_3
      - *shr_4
      - *shr_5
      - *shr_6
      - *shr_7
      - { register: dip_span, value: "r.shr - r.told_F1", tag: formant_diphthong }
      - register: deldip_F1
        value: >-
          r.dip_span == 0 ? 0
          : (r.dip_span > 0 && r.dip_span < 50
            ? floor(params.policy.formant_drawing.divtab[r.dip_span] * (r.dip_new - r.dold_F1) * 8 / 16384)
            : ((r.dip_new - r.dold_F1) * 8 / r.dip_span < 0
              ? ceil((r.dip_new - r.dold_F1) * 8 / r.dip_span)
              : floor((r.dip_new - r.dold_F1) * 8 / r.dip_span)))
        tag: formant_diphthong
      - { register: dold_F1, value: "r.dip_span == 0 ? r.dold_F1 : r.dip_new", tag: formant_diphthong }
      - { register: told_F1, value: "r.dip_span == 0 ? r.told_F1 : r.shr", tag: formant_diphthong }
      - { register: durlin_F1, value: "r.shr", tag: formant_diphthong }
    citations:
      - "DECtalk 4.63 PH/ph_draw.c:359-365; ph_setar.c:1301-1386"
