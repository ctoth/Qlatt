version: v1
rules:
  # A vowel's diphthong lines and the locus at a stop are drawn frame by frame
  # in phases/formant-drawing.yaml; no rule here turns them into windows.
  dectalk_insert_voiceless_stop_release_into_silence:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme in ['P', 'T', 'K'] && next != null && next.phoneme == 'SIL'
    define:
      rel: "current.phoneme + \"_REL\""
      weak: "true"
      next_token: next
      rel_target: target(rel)
      # Ph_inton2.c:1701-1706: the dummy vowel is IX after a phone whose
      # beginning type is front (us_begtyp == 1), AX otherwise. The second test
      # there, phone_feature(phocur) & FALVEL, reads the manner word with a
      # place mask (FALVEL = FSON1 = 010) and is never true of a plosive.
      dummy_phone: "dectalk_name(prev) in params.policy.timing.front_onset_phones ? 'IX' : 'AX'"
      ix_target: "target(dummy_phone + '0')"
      dummy_duration: params.policy.duration.dummy_vowel_duration_ms
      rel_burst_duration: "has(rel_target.burstDuration) ? rel_target.burstDuration : rel_target.duration"
      # DECtalk 4.63 p_us_st1.c:231-237 us_gettar() selects the burst-amplitude
      # row from the beginning type of the following phone, the dummy vowel.
      rel_profile: >-
        dummy_phone == 'IX' ? rel_target.stopReleaseProfiles.front_vowel
        : rel_target.stopReleaseProfiles.back_unrounded_vowel
      rel_duration: "min([current.duration, rel_burst_duration])"
      open_glottis_b1: "ix_target.B1 + params.policy.duration.open_glottis_b1_widen_hz"
      open_glottis_b2: "ix_target.B2 + params.policy.duration.open_glottis_b2_widen_hz"
      carrier_params: "merge(ix_target, {'TL': params.policy.duration.dummy_vowel_tilt_db, 'SW': 0})"
      rel_window_params: >-
        {'AF': rel_target.AF,
        'A2': rel_profile.A2 >= params.policy.duration.dummy_vowel_burst_reduction_db ? rel_profile.A2 - params.policy.duration.dummy_vowel_burst_reduction_db : rel_profile.A2,
        'A3': rel_profile.A3 >= params.policy.duration.dummy_vowel_burst_reduction_db ? rel_profile.A3 - params.policy.duration.dummy_vowel_burst_reduction_db : rel_profile.A3,
        'A4': rel_profile.A4 >= params.policy.duration.dummy_vowel_burst_reduction_db ? rel_profile.A4 - params.policy.duration.dummy_vowel_burst_reduction_db : rel_profile.A4,
        'A5': rel_profile.A5 >= params.policy.duration.dummy_vowel_burst_reduction_db ? rel_profile.A5 - params.policy.duration.dummy_vowel_burst_reduction_db : rel_profile.A5,
        'A6': rel_profile.A6 >= params.policy.duration.dummy_vowel_burst_reduction_db ? rel_profile.A6 - params.policy.duration.dummy_vowel_burst_reduction_db : rel_profile.A6,
        'AB': rel_profile.AB >= params.policy.duration.dummy_vowel_burst_reduction_db ? rel_profile.AB - params.policy.duration.dummy_vowel_burst_reduction_db : rel_profile.AB,
        'SW': 1}
      asp_window_params: >-
        {'AV': 0,
        'AH': (dummy_phone == 'IX' ? params.policy.duration.voiceless_vot_aspiration_front_db
               : params.policy.duration.voiceless_vot_aspiration_nonfront_db)
              - (get(current, 'stress', 0) > 0 ? 0 : params.policy.duration.voiceless_vot_aspiration_unstressed_reduction_db)
              - params.policy.duration.dummy_vowel_aspiration_reduction_db,
        'B1': open_glottis_b1, 'B2': open_glottis_b2}
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: next_token.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - control_windows
            - duration
            - inherentDuration
            - minimumDuration
            - type
            - voiced
            - voiceless
            - is_obstruent
            - is_stop_base
            - bilabial
            - alveolar
            - velar
            - punctuationSymbol
          control_windows:
            - suffix_ms: rel_duration
              target: "'current'"
              fields: rel_window_params
              tag: "'stop_burst'"
        - phoneme: "'SIL'"
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          dummy_vowel: true
          dummy_phone: dummy_phone
          target: carrier_params
          duration: dummy_duration
          inherentDuration: dummy_duration
          minimumDuration: 0
          type: "'silence'"
          control_windows:
            - start_ms: 0
              target: "'current'"
              end_ms: dummy_duration
              fields: asp_window_params
              tag: "'stop_aspiration'"
        - copy_from: next
    citations:
      - "DECtalk 4.63 p_us_st1.c Special Rule 1 (burst duration is carved out of plosive closure)"
      - "DECtalk 4.63 p_us_st1.c Special Rule 2 (a dummy vowel releases a final voiceless plosive into silence)"
      - "DECtalk 4.63 p_us_st1.c (dummy-vowel release reduces burst by 3 dB, aspiration by 6 dB, and widens B1/B2 during the open-glottis interval)"
      - "DECtalk 4.63 Ph_inton2.c:1683-1722 Rule 9 (SCHWA2/IX after a front-beginning phone, SCHWA1/AX otherwise, NF40MS)"
      - "DECtalk 4.63 p_us_st1.c:1367-1387 (aspiration 48 dB before a front beginning, 50 otherwise, 3 less when unstressed)"
      - "DECtalk 4.63 p_us_rom.h (US_IX and US_AX target values, us_begtyp)"
      - "Engineering representation: keep the dummy vowel non-syllabic so fixed Rule 9 duration survives later vowel rules"

  # Rule 9 releases a voiced plosive into the same dummy vowel. It is voiced
  # throughout, 12 dB below the vowel's own level.
  dectalk_insert_voiced_stop_dummy_vowel:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme in ['B', 'D', 'G'] && next != null && next.phoneme == 'SIL'
    define:
      next_token: next
      dummy_phone: "dectalk_name(prev) in params.policy.timing.front_onset_phones ? 'IX' : 'AX'"
      dummy_target: "target(dummy_phone + '0')"
      dummy_duration: params.policy.duration.dummy_vowel_duration_ms
      carrier_params: >-
        merge(dummy_target, {'AV': dummy_target.AV - params.policy.duration.dummy_vowel_voicing_reduction_db,
        'TL': params.policy.duration.dummy_vowel_tilt_db, 'SW': 0})
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: next_token.sync_right
      insert:
        - copy_from: current
        - phoneme: "'SIL'"
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          dummy_vowel: true
          dummy_phone: dummy_phone
          target: carrier_params
          duration: dummy_duration
          inherentDuration: dummy_duration
          minimumDuration: 0
          type: "'silence'"
        - copy_from: next
    citations:
      - "DECtalk 4.63 Ph_inton2.c:1683-1722 Rule 9 (a schwa releases [p,t,k,b,d,g] into silence; NF40MS)"
      - "DECtalk 4.63 p_us_st1.c:172-176 (dummy vowel has 12 dB less voicing)"
      - "DECtalk 4.63 p_us_rom.h (US_IX and US_AX target values, us_begtyp)"
      - "Engineering representation: keep the dummy vowel non-syllabic so fixed Rule 9 duration survives later vowel rules"

  dectalk_insert_voiceless_stop_release_and_aspiration:
    kind: structural
    select:
      relation: Segment
      where: >-
        current.phoneme in ['P', 'T', 'K'] && (next != null ? !(next.type in ['stop_closure',
        'stop_release', 'stop_aspiration']) : false) && (next != null ? next.phoneme != 'SIL' : false)
    define:
      rel: "current.phoneme + \"_REL\""
      asp: "current.phoneme + \"_ASP\""
      next_token: next
      weak: "next_token != null ? next_token.phoneme == \"SIL\" : false"
      rel_target: target(rel)
      asp_target: target(asp)
      prev_token: prev
      next_unstressed: >-
        has(next_token.stress) ? next_token.stress != 1 :
        (next_token.type == 'vowel' ? true : false)
      next_is_sonorant_consonant: "next_token.type in ['liquid', 'nasal', 'glide']"
      next_is_front_vowel: "next_token.phoneme in ['IY', 'IH', 'IX', 'EY', 'EH', 'AE']"
      in_s_cluster: >-
        prev_token != null && prev_token.phoneme == 'S' &&
        dectalk_same_word(prev_token, current)
      rel_burst_duration: "has(rel_target.burstDuration) ? rel_target.burstDuration : rel_target.duration"
      profile_ref: >-
        next_token != null && next_token.phoneme != 'SIL' ? next_token :
        (prev_token != null && prev_token.phoneme != 'SIL' ? prev_token : current)
      profile_class: >-
        has(profile_ref.is_obstruent) && profile_ref.is_obstruent == true ? 'obstruent' :
        (profile_ref.type == 'vowel' && has(profile_ref.front) && profile_ref.front == true ? 'front_vowel' :
        (has(profile_ref.is_back_rounded) && profile_ref.is_back_rounded == true ? 'back_rounded_vowel' : 'back_unrounded_vowel'))
      rel_profile: "rel_target.stopReleaseProfiles[profile_class]"
      vot_target: >-
        next_is_sonorant_consonant ?
        ((next_unstressed ? params.policy.duration.voiceless_vot_unstressed_ms : params.policy.duration.voiceless_vot_base_ms) +
        params.policy.duration.voiceless_vot_sonorant_consonant_bonus_ms) :
        (in_s_cluster ? params.policy.duration.voiceless_vot_s_cluster_ms :
        (next_unstressed ? params.policy.duration.voiceless_vot_unstressed_ms :
        params.policy.duration.voiceless_vot_base_ms))
      rel_duration_base: "min([vot_target, rel_burst_duration])"
      asp_duration_base: vot_target - rel_duration_base
      asp_window_ah: >-
        (next_is_front_vowel ? params.policy.duration.voiceless_vot_aspiration_front_db :
        params.policy.duration.voiceless_vot_aspiration_nonfront_db) -
        (next_unstressed ? params.policy.duration.voiceless_vot_aspiration_unstressed_reduction_db : 0) +
        (next_is_sonorant_consonant || next_token.phoneme in ['ER', 'RR'] ? params.policy.duration.voiceless_vot_aspiration_sonorant_bonus_db : 0)
      rel_params: >-
        merge(rel_target, merge(rel_profile, {'AF': weak ? max([0, rel_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]) : rel_target.AF,
        'AH': max([0, asp_window_ah])}))
      asp_window_params: >-
        {'AH': max([0, asp_window_ah]), 'AV': 0, 'B1': next_token.B1 + params.policy.duration.open_glottis_b1_widen_hz,
        'B2': next_token.B2 + params.policy.duration.open_glottis_b2_widen_hz}
      rel_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms, rel_duration_base *
        params.policy.duration.weak_release_scale]) : rel_duration_base
      asp_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms, asp_duration_base *
        params.policy.duration.weak_release_scale]) : asp_duration_base
      current_min_duration: "has(current.minimumDuration) ? current.minimumDuration : 0"
      closure_duration: "max([current_min_duration, current.duration - rel_duration])"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: next_token.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - control_windows
            - duration
            - inherentDuration
            - minimumDuration
            - type
            - voiced
            - voiceless
            - is_obstruent
            - is_stop_base
            - bilabial
            - alveolar
            - velar
            - punctuationSymbol
          duration: closure_duration
        - phoneme: rel
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          target: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          minimumDuration: "has(rel_target.minimumDuration) ? rel_target.minimumDuration : null"
          type: rel_target.type
          inventorySW: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
          control_windows:
            - start_ms: 0
              target: "'next'"
              end_ms: asp_duration
              fields: asp_window_params
              tag: "'stop_aspiration'"
        - copy_from: next
    citations:
      - "DECtalk 4.63 p_us_st1.c Special Rule 1 (burst duration is carved out of plosive closure)"
      - "DECtalk 4.63 p_us_st1.c Special Rule 2 (aspiration/VOT extends into the following sonorant)"
      - "DECtalk 4.63 p_us_rom.h (us_burdr and us_ptram/us_malamp stop burst timing + spectra)"
      - "DECtalk 4.63 ph_defs.h (NF60MS, NF15MS, NF7MS constants)"
      - "Engineering approximation: represent DECtalk's PAV/PAP/PB1/PB2 timed overrides as a timed prefix window on the following segment without shortening that segment"

  # No rule here for a voiceless stop that is the last segment of all: the
  # text rules close every text as a sentence (the clause end in the text
  # parser's output, tn_parser_clause_end), as DECtalk does at a flush, so a
  # stop always has a silence
  # after it and the rule above for a release into silence takes it.
  dectalk_insert_voiced_stop_release:
    kind: structural
    select:
      relation: Segment
      where: >-
        current.phoneme in ['B', 'D', 'G'] && (next != null ? !(next.type in ['stop_closure',
        'stop_release', 'stop_aspiration']) : false)
    define:
      rel: "current.phoneme + \"_REL\""
      next_token: next
      weak: "next_token != null ? next_token.phoneme == \"SIL\" : false"
      rel_target: target(rel)
      profile_ref: >-
        next_token != null && next_token.phoneme != 'SIL' ? next_token :
        (prev != null && prev.phoneme != 'SIL' ? prev : current)
      profile_class: >-
        has(profile_ref.is_obstruent) && profile_ref.is_obstruent == true ? 'obstruent' :
        (profile_ref.type == 'vowel' && has(profile_ref.front) && profile_ref.front == true ? 'front_vowel' :
        (has(profile_ref.is_back_rounded) && profile_ref.is_back_rounded == true ? 'back_rounded_vowel' : 'back_unrounded_vowel'))
      rel_profile: "rel_target.stopReleaseProfiles[profile_class]"
      rel_params: >-
        weak ? merge(rel_target, merge(rel_profile, {'AF': max([0, rel_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.AH -
        params.policy.duration.weak_release_amplitude_reduction_db])})) : merge(rel_target, rel_profile)
      rel_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms, (has(rel_target.burstDuration) ? rel_target.burstDuration : rel_target.duration) *
        params.policy.duration.weak_release_scale]) : (has(rel_target.burstDuration) ? rel_target.burstDuration : rel_target.duration)
      current_min_duration: "has(current.minimumDuration) ? current.minimumDuration : 0"
      closure_duration: "max([current_min_duration, current.duration - rel_duration])"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: next_token.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - control_windows
            - duration
            - inherentDuration
            - minimumDuration
            - type
            - voiced
            - voiceless
            - is_obstruent
            - is_stop_base
            - bilabial
            - alveolar
            - velar
            - punctuationSymbol
          duration: closure_duration
        - phoneme: rel
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          target: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          minimumDuration: "has(rel_target.minimumDuration) ? rel_target.minimumDuration : null"
          type: rel_target.type
          inventorySW: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
        - copy_from: next
    citations:
      - "DECtalk 4.63 p_us_st1.c Special Rule 1 (burst duration is carved out of plosive closure)"
      - "DECtalk 4.63 p_us_st1.c Special Rule 3 (voiced stop burst/voicebar is realized within the burst interval, not as added segment time)"
      - "DECtalk 4.63 p_us_rom.h (us_burdr and us_ptram/us_malamp stop burst timing + spectra)"
      - "Engineering approximation: represent DECtalk's in-stop burst by reallocating closure time to an inserted release segment"

  dectalk_insert_voiced_stop_release_final:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme in ['B', 'D', 'G'] && next == null
    define:
      rel: "current.phoneme + \"_REL\""
      weak: "true"
      rel_target: target(rel)
      profile_ref: "prev != null && prev.phoneme != 'SIL' ? prev : current"
      profile_class: >-
        has(profile_ref.is_obstruent) && profile_ref.is_obstruent == true ? 'obstruent' :
        (profile_ref.type == 'vowel' && has(profile_ref.front) && profile_ref.front == true ? 'front_vowel' :
        (has(profile_ref.is_back_rounded) && profile_ref.is_back_rounded == true ? 'back_rounded_vowel' : 'back_unrounded_vowel'))
      rel_profile: "rel_target.stopReleaseProfiles[profile_class]"
      rel_params: "merge(rel_target, merge(rel_profile, {'AF': max([0, rel_target.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.AH - params.policy.duration.weak_release_amplitude_reduction_db])}))"
      rel_duration: >-
        max([params.policy.duration.weak_release_min_ms, (has(rel_target.burstDuration) ? rel_target.burstDuration : rel_target.duration) *
        params.policy.duration.weak_release_scale])
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
        - phoneme: rel
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          target: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          minimumDuration: "has(rel_target.minimumDuration) ? rel_target.minimumDuration : null"
          type: rel_target.type
          inventorySW: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
    citations:
      - "Lisker & Abramson 1964 (utterance-final voiced stops receive weak release)"
      - "DECtalk 4.63 p_us_rom.h (us_burdr and us_ptram/us_malamp stop burst timing + spectra)"
      - "Engineering bridge: reuse qlatt structural weak-release policy for the final-release attenuation shape while using DECtalk burst timing"

  dectalk_weaken_interdental_frication:
    kind: structural
    select:
      relation: Segment
      where: current.phoneme in ['TH', 'DH']
    define:
      next_token: next
      active_tail_window: >-
        {'AF': has(current.AF) ? current.AF : 0,
        'SW': 1}
      breathy_next_ms: >-
        current.phoneme == 'TH' &&
        (next_token != null ? (next_token.type in ['vowel', 'liquid', 'nasal', 'glide']) : false) &&
        (next_token != null ? isTrue(next_token, 'voiced') : false) ?
        params.policy.formant.voiceless_open_tract_breathy_onset_ms : 0
      voiced_onset_ms: >-
        current.phoneme == 'DH' &&
        (next_token != null ? (next_token.type in ['vowel', 'liquid', 'nasal', 'glide']) : false) &&
        (next_token != null ? isTrue(next_token, 'voiced') : false) ?
        params.policy.formant.voiced_fricative_voicing_onset_ms : 0
      voiced_onset_av: >-
        max([
          has(current.AV) ? current.AV : 0,
          (has(next_token.AV) ? next_token.AV : 0) - params.policy.formant.source_onset_boundary_drop_db
        ])
      breathy_window: "{'AH': params.policy.formant.voiceless_open_tract_breathy_onset_db}"
      voiced_onset_window: "{'AV': voiced_onset_av}"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          AF: 0
          SW: 0
          inventorySW: 0
          control_windows:
            - suffix_ms: params.policy.formant.weak_interdental_fricative_tail_ms
              target: "'current'"
              fields: active_tail_window
              tag: "'weak_dental_frication'"
            - start_ms: 0
              target: "'next'"
              end_ms: breathy_next_ms
              fields: breathy_window
              tag: "'breathy_onset'"
            - start_ms: 0
              target: "'next'"
              end_ms: voiced_onset_ms
              fields: voiced_onset_window
              tag: "'soft_voicing_onset'"
    citations:
      - "DECtalk 4.63 p_us_st1.c (special hack: /th, dh/ fric gains suppressed until durfon - 3)"
      - "DECtalk 4.63 p_us_st1.c (PAP backward smoothing: onset of a vowel from /th/ is breathy)"
      - "DECtalk 4.63 p_us_st1.c (PAV onset is not made abrupt after /dh/)"
      - "Klatt 1980 (SW controls cascade/parallel branch routing)"
      - "Engineering approximation: model the remaining /th, dh/ frication as a 30 ms suffix window"

  dectalk_add_voiced_fricative_soft_voicing_onset:
    kind: structural
    select:
      relation: Segment
      where: >-
        current.phoneme in ['V', 'Z', 'ZH', 'JH'] &&
        (next != null ? (next.type in ['vowel', 'liquid', 'nasal', 'glide']) : false) &&
        (next != null ? isTrue(next, 'voiced') : false)
    define:
      next_token: next
      voiced_onset_av: >-
        max([
          has(current.AV) ? current.AV : 0,
          (has(next_token.AV) ? next_token.AV : 0) - params.policy.formant.source_onset_boundary_drop_db
        ])
      voiced_onset_window: "{'AV': voiced_onset_av}"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: next_token.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - control_windows
            - duration
            - inherentDuration
            - minimumDuration
            - type
            - punctuationSymbol
            - voiced
            - voiceless
            - labiodental
            - alveolar
            - postalveolar
          control_windows:
            - start_ms: 0
              target: "'next'"
              end_ms: params.policy.formant.voiced_fricative_voicing_onset_ms
              fields: voiced_onset_window
              tag: "'soft_voicing_onset'"
        - copy_from: next
    citations:
      - "DECtalk 4.63 p_us_st1.c (PAV onset is abrupt except after a voiced fricative)"
      - "DECtalk 4.63 p_us_st1.c (source onset boundary value is target-10 dB when amplitude is increasing)"
      - "Engineering approximation: represent DECtalk's non-abrupt voiced-fricative voicing onset as a 40 ms prefix window on the following voiced sonorant"

  dectalk_add_voiceless_fricative_breathy_onset:
    kind: structural
    select:
      relation: Segment
      where: >-
        current.phoneme in ['F', 'S', 'SH'] &&
        (next != null ? (next.type in ['vowel', 'liquid', 'nasal', 'glide']) : false) &&
        (next != null ? isTrue(next, 'voiced') : false)
    define:
      next_token: next
      breathy_window: "{'AH': params.policy.formant.voiceless_open_tract_breathy_onset_db}"
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: next_token.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - control_windows
            - duration
            - inherentDuration
            - minimumDuration
            - type
            - punctuationSymbol
            - voiced
            - voiceless
            - dental
            - labiodental
            - alveolar
            - postalveolar
          control_windows:
            - start_ms: 0
              target: "'next'"
