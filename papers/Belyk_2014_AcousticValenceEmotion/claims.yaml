  concepts: []
  provenance:
    paper: Belyk_2014_AcousticValenceEmotion
    page: 0
- id: claim19
  type: observation
  statement: '**Motivational positive > negative**: For motivational emotions, positive
    valence should produce higher F0 and higher amplitude'
  concepts: []
  provenance:
    paper: Belyk_2014_AcousticValenceEmotion
    page: 0
- id: claim20
  type: observation
  statement: '**Moral reversal**: For moral emotions, positive valence should produce
    higher F0 but *lower* amplitude than negative'
  concepts: []
  provenance:
    paper: Belyk_2014_AcousticValenceEmotion
    page: 0
- id: claim21
  type: observation
  statement: '**Aesthetic reversal**: For aesthetic emotions, positive valence should
    produce *lower* F0 and *lower* amplitude than negative'
  concepts: []
  provenance:
    paper: Belyk_2014_AcousticValenceEmotion
    page: 0
- id: claim22
  type: observation
  statement: '**Intensity monotonicity**: Regardless of valence or family, increasing
