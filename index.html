<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QLATT - Klatt Formant Synthesizer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/test/test-harness.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>QLATT Synth Harness</h1>
          <div class="sub">LF source → diff → cascade resonators</div>
        </div>
        <div class="row">
          <button id="startBtn">Start Audio</button>
          <button id="stopBtn">Stop Audio</button>
        </div>
      </header>

      <section class="panel">
        <div class="row" style="margin-bottom: 16px;">
          <label for="phrase">Phrase</label>
          <input id="phrase" type="text" value="hello world" style="flex: 1; min-width: 220px;" />
          <label for="baseF0">Base F0</label>
          <input id="baseF0" type="number" value="110" min="60" max="500" step="1" style="width: 80px;" />
          <label for="rate">Rate</label>
          <input id="rate" type="range" min="0.5" max="5.0" step="0.05" value="1.0" style="width: 120px;" />
          <span id="rateValue">1.0x</span>
          <button id="speakBtn">Speak</button>
        </div>
        <div style="margin-bottom: 16px;">
          <label>
            <span>Backend:</span>
            <select id="experimentSelect" style="margin-left: 4px;">
              <option value="klatt80-baseline">Loading...</option>
            </select>
          </label>
        </div>
        <div style="margin-bottom: 16px;">
          <label>
            <span>Frontend:</span>
            <select id="frontendSelect" style="margin-left: 4px;">
              <option value="qlatt-english">Qlatt English</option>
              <option value="dectalk-english">DECtalk 4.63 English</option>
            </select>
          </label>
          <label id="speakerLabel" style="margin-left: 16px; display: none;">
            <span>Voice:</span>
            <select id="speakerSelect" style="margin-left: 4px;"></select>
          </label>
        </div>
        <div class="grid" id="controls"></div>
      </section>
      <section class="panel" style="margin-top: 18px;">
        <div class="row" style="margin-bottom: 10px;">
          <strong>Diagnostics</strong>
          <button id="copyDiagBtn">Copy diagnostics</button>
          <button id="clearDiagBtn">Clear</button>
          <label style="margin-left: 12px;"><input type="checkbox" id="diagEngineToggle" /> Engine diagnostics</label>
        </div>
        <textarea id="diagnostics" rows="8" style="width: 100%; font-family: Consolas, 'Courier New', monospace;" readonly></textarea>
      </section>
      <section class="panel spectrogram" style="margin-top: 18px;">
        <div class="row" style="margin-bottom: 10px;">
          <strong>Spectrogram</strong>
          <button id="clearSpecBtn">Clear</button>
        </div>
        <canvas id="spectrogram" width="900" height="240"></canvas>
      </section>
      <p class="status" id="status">Status: idle</p>
    </main>

    <script type="module" src="/test/test-harness.js"></script>
  </body>
</html>
