version: v1

# Canonical speaker default profile for the current English frontend.
# Citations:
# - O'Shaughnessy 1976
# - Kent & Vorperian 2018
# - Fant 1997 Table 1
# - Klatt & Klatt 1990
citations:
  - O'Shaughnessy 1976
  - Kent & Vorperian 2018
  - Fant 1997 Table 1
  - Klatt & Klatt 1990

# Composition policy: use the first finite runtime source, then the field value.
# Requests inherit the selected frontend voice; omitted values retain that voice.
default_profile:
  # Offline area-function generation controls. Unity preserves the measured
  # Story geometry; runtime does not reinterpret these as formant multipliers.
  tract_length_scale:
    sources: [request.tract_length_scale, voice.tract_length_scale]
    value: 1
    citations:
      - Fitch & Giedd 1999 (tract length and regional morphology)
      - "Nordstrom 1977 (1975 report), length-scaling experiment"
  pharynx_scale:
    sources: [request.pharynx_scale, voice.pharynx_scale]
    value: 1
    citations:
      - "Nordstrom 1977 (1975 report), experiment 2 (regional length and area scaling)"
  mouth_scale:
    sources: [request.mouth_scale, voice.mouth_scale]
    value: 1
    citations:
      - "Nordstrom 1977 (1975 report), experiment 2 (regional length and area scaling)"
  base_f0_hz:
    sources: [request.base_f0_hz, baseF0, voice.base_f0_hz]
    value: 110
    citations:
      - O'Shaughnessy 1976
  # Pitch span: the width of the speaker's range above the base (the floor).
  # The prosody rules read it as params.policy.f0.range_hz.
  f0_range_hz:
    sources: [request.f0_range_hz, voice.f0_range_hz]
    value: 80
    citations:
      - "Pierrehumbert 1980 (male typical range ~80 Hz: top ~190 Hz, baseline ~110 Hz)"
      - Ladd 2008 Ch.5
  formant_scale:
    sources: [request.formant_scale, voice.formant_scale]
    value: 1.0
    citations:
      - Kent & Vorperian 2018
  rd_default:
    sources: [request.rd_default, voice.rd_default]
    value: 0.7
    citations:
      - Fant 1997 Table 1
  spectral_tilt_offset_db:
    sources: [request.spectral_tilt_offset_db, voice.spectral_tilt_offset_db]
    value: 0
    citations:
      - Klatt & Klatt 1990

# Pitch composition policy: how a requested pitch composes with the level
# (base_f0_hz) and the span (f0_range_hz) resolved above. src/speaker-profile.ts
# applies it after the fields are resolved.
pitch_composition:
  # A request's pitch as a ratio, where base_f0_hz is a request's pitch in Hz:
  #   effective base = base_f0_hz * pitch_scale
  # base_f0_hz is resolved first (an absolute request, else the selected
  # voice's, else the default), so one ratio moves whichever voice is selected
  # by the same interval. Unity is no request.
  pitch_scale:
    sources: [request.pitch_scale, pitchScale]
    value: 1
    citations:
      - "Ladd 2008 p.204 (F0 = F_R * T * N * r: a speaker's targets are multiples of the reference level F_R)"
      - "Pierrehumbert 1980 (baseline transform P-hat = (P - B) / B: targets are in baseline units above the baseline)"
  # Span follows level. A target is a fixed number of baseline units above the
  # speaker's level, so its height above the level in Hz grows with the level:
  #   ratio = effective base / reference base
  #   span  = f0_range_hz * ratio
  # The reference base is the selected voice's base_f0_hz, or this document's
  # base_f0_hz value when no voice gives one: at the reference, the span is the
  # one resolved above. A span the request gives is used as given.
  # The sources describe how targets compare between speakers of different
  # levels; using that relation for a requested pitch is an engineering
  # application of it.
  span_follows_level:
    level: base_f0_hz
    span: f0_range_hz
    reference_sources: [voice.base_f0_hz]
    unscaled_span_sources: [request.f0_range_hz]
    citations:
      - "Pierrehumbert 1980 Fig 1.20 p.271 (proportional scaling of targets across speakers, in baseline units)"
      - "Ladd 2008 p.204 (F0 = F_R * T * N * r: between speakers, targets scale with the reference level F_R)"
      - "Liberman & Pierrehumbert 1984 pp.161, 168-169 (ratios between accent targets are invariant under changes of pitch range)"
