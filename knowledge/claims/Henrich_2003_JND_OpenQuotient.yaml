- id: claim_0056
  type: observation
  statement: 'The relative JND of open quotient is constant across Oq values (Weber''s
    law): approximately 14% for untrained listeners and 10% for trained listeners.
    This means delta_Oq/Oq is constant.

    '
  concepts:
  - speech_0002
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 489
    section: Results
- id: claim_0057
  type: observation
  statement: 'Asymmetry coefficient JND is approximately 0.033 (untrained) and 0.027
    (trained) at alpha_m = 2/3, decreasing to 0.027 and 0.022 at alpha_m = 0.8. JND
    is NOT constant (does not follow Weber''s law for alpha_m directly).

    '
  concepts:
  - speech_0011
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 489
    table: Table 2
- id: claim_0058
  type: observation
  statement: 'No significant effect of vowel choice or pitch (130 Hz vs 196 Hz) on
    open quotient JND. Vibrato slightly increases JND. Amplitude condition has the
    largest effect on JND.

    '
  concepts:
  - speech_0002
  provenance:
    paper: Henrich_2003_JND_OpenQuotient
    page: 490
    table: Table 4
