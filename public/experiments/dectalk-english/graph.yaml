bacon: "0.1"
name: dectalk-463-synth
meta:
  primitives: ./registry.yaml
  semantics: ./semantics.yaml
  description: |
    DECtalk 4.63-oriented cascade/parallel formant topology.
    Derived from the klatt80-baseline graph, but trimmed to the core
    DECtalk-style path: impulse-first source defaults, eight-formant bank,
    and direct output summing without the baseline reconstruction filter.
    Citations: Klatt 1980; DECtalk 4.63 COEWAV/PARWAV descendants.

formantBanks:
  main:
    cascade:
      input: np
      output: cascadeOutGain
    parallel:
      output: parallelSum
    proximity:
      - { pair: [1, 2], offset: 0 }
      - { pair: [2, 3], offset: 50 }
      - { pair: [3, 4], offset: 150 }
    formants:
      - index: 1
        freqRange: [200, 1000]
        freqDefault: 500
        bwRange: [40, 1000]
        bwDefault: 60
        ndbScale: -58
        sign: 1
        parallelSource: parallelSourceGain
        bypassAtZero: true
      - index: 2
        freqRange: [500, 3000]
        freqDefault: 1500
        bwRange: [40, 1000]
        bwDefault: 90
        ndbScale: -65
        sign: -1
        parallelSource: parallelDiffSum
      - index: 3
        freqRange: [1500, 4000]
        freqDefault: 2500
        bwRange: [40, 1000]
        bwDefault: 150
        ndbScale: -73
        sign: 1
        parallelSource: parallelDiffSum
      - index: 4
        freqRange: [2500, 5000]
        freqDefault: 3500
        bwRange: [100, 1000]
        bwDefault: 200
        ndbScale: -78
        sign: -1
        parallelSource: parallelDiffSum
      - index: 5
        freqRange: [3500, 6000]
        freqDefault: 4500
        bwRange: [100, 1000]
        bwDefault: 200
        ndbScale: -79
        sign: 1
        parallelSource: parallelFricGain
      - index: 6
        freqRange: [4000, 7000]
        freqDefault: 5500
        bwRange: [100, 1000]
        bwDefault: 500
        ndbScale: -80
        sign: -1
        parallelSource: parallelFricGain
      # F7-F8: Keep the first two high-formant slots for fricative coloration.
      # Engineering choice: the DECtalk experiment stays on the core eight-band
      # path here so we do not inherit the full ten-formant baseline voicing tail.
      # Citations: Klatt 1980 cascade/parallel topology;
      # DECtalk 4.63 COEWAV/PARWAV family; Rabiner (1968) Q-factor bandwidths.
      - index: 7
        freqRange: [5000, 8000]
        freqDefault: 6500
        bwRange: [200, 2000]
        bwDefault: 722
        parallelSource: parallelFricGain
        ndbScale: -81
        sign: 1
        # Rabiner (1968) Q=9; parallel source: frication only (same as F5-F6)
      - index: 8
        freqRange: [6000, 9000]
        freqDefault: 7500
        bwRange: [400, 3000]
        bwDefault: 1250
        parallelSource: parallelFricGain
        ndbScale: -82
        sign: -1
        # Rabiner (1968) Q=6; parallel source: frication only (same as F5-F6)

nodes:
  # ---------------------------------------------------------------------------
  # SOURCE NODES
  # ---------------------------------------------------------------------------
  # Source selection (impulse vs LF vs bypass) is implemented via gain gates.
  # Semantics.yaml computes lfSourceSwitch/impulseSourceSwitch from sourceMode.

  lfSource:
    type: lf-source
    params:
      f0: { bind: F0 }
      rd: { bind: Rd }
      lfMode: { bind: lfMode }
      oq: { bind: OQ }
      tl: { bind: TL }
      flutter: { bind: flutter }
      jitter: { bind: jitter }

  impulseSource:
    type: impulse-train
    params:
      f0: { bind: F0 }
      gain: 1.0
      openPhaseRatio: { bind: openPhaseRatio }

  # klsyn88 KLGLOTT88 source (oversampled-glottal-source crate). Active when
  # sourceMode == 3 (selectable; default stays 0=impulse so Paul is byte-identical).
  # Emits voice (port 0) and integrated turbulence noise (port 1). We use VOICE
  # (port 0) ONLY; port 1 is intentionally left unconnected so dectalk's seeded
  # noiseSource/fricationSource stay the aspiration/frication path (no double-noise).
  # av binds raw AV dB but the crate uses av only to gate noise modulation — it does
  # NOT scale voice level, so the master GO+AV loudness is still applied downstream
  # at voiceGain (no double-apply). tilt binds the per-phoneme TL (crate applies its
  # own tilt internally; the impulse-path tiltFilter is off at sourceMode 3).
  # Citations: DECtalk 4.63 VTM/vtm3.c KLGLOTT88; klsyn88 parwv.c.
  klglottSource:
    type: oversampled-glottal-source
    params:
      f0:           { bind: F0 }
      av:           { bind: AV }
      aturb:        { bind: AH }
      tilt:         { bind: TL }
      openQuotient: 50.0
      skew:         0.0
      asymmetry:    50.0
      source:       2.0
      seed:         305419889.0

  # Gain gate for the klglott source (gain = klglottSourceSwitch, 1 at sourceMode 3).
  klglottGain:
    type: gain
    params:
      gain: { bind: klglottSourceSwitch }

  noiseSource:
    type: noise-source
    # Fixed seed -> deterministic noise (DECtalk is reproducible: same text =>
    # same audio). Without a seed the worklet falls back to Math.random(), which
    # the live/browser runtime hits (node seeds via per-node override), causing
    # the spy's state_leak failure (output varies across identical plays).
    # Distinct from fricationSource so aspiration/frication noise are uncorrelated.
    options:
      seed: 305419896
    params:
      gain: 1.0
      cutoff: { bind: noiseCutoff }

  fricationSource:
    type: noise-source
    options:
      seed: 2271560481
    params:
      gain: 1.0
      cutoff: { bind: fricationCutoff }

  # Glottal modulation - 50% square wave synchronized to glottal cycle
  glottalMod:
    type: glottal-mod
    params:
      f0: { bind: F0 }

  # ---------------------------------------------------------------------------
  # PLSTEP BURST MECHANISM
  # ---------------------------------------------------------------------------
  # Klatt 80 PLSTEP: DC step injection triggered by AF or AH rise >= 49 dB
  # Creates transient rarefaction pulse at stop/fricative onsets
  #
  # From PARCOE.FOR:
  #   IF (NNAF - NAFLAS >= 49) PLSTEP = GETAMP(G0 - 28)
  #   IF (NNAH - NAHLAS >= 49) PLSTEP = GETAMP(G0 - 28)
  # Decay: 0.995 per sample at 10kHz (~92ms time constant)

  # Edge detector for AF (frication amplitude)
  afEdgeDetector:
    type: edge-detector
    params:
      threshold: { bind: plstepThreshold }  # Klatt 80: 49 dB rise (from semantics constant)
      input: { bind: AF }  # Monitor frication amplitude

  # Edge detector for AH (aspiration amplitude)
  ahEdgeDetector:
    type: edge-detector
    params:
      threshold: { bind: plstepThreshold }  # Klatt 80: 49 dB rise (from semantics constant)
      input: { bind: AH }  # Monitor aspiration amplitude

  # Sum triggers (OR gate - either AF or AH trigger fires the envelope)
  plstepTriggerSum:
    type: gain
    params:
      gain: 1.0

  # Decay envelope - exponential decay starting at -amplitude (rarefaction)
  plstepEnvelope:
    type: decay-envelope
    params:
      trigger: 0  # Driven by audio connection from trigger sum
      amplitude: { bind: plstepAmplitude }  # From semantics: dbToLinear(G0 - 75)
      decay: 0  # Auto-calculate from sample rate

  # ---------------------------------------------------------------------------
  # SOURCE ROUTING/MIXING
  # ---------------------------------------------------------------------------
  # Gain gates implement conditional switching based on sourceMode parameter.
  # Values computed in semantics.yaml: lfSourceSwitch, impulseSourceSwitch, etc.

  lfSourceGain:
    type: gain
    params:
      gain: { bind: lfSourceSwitch }

  impulseGain:
    type: gain
    params:
      gain: { bind: impulseSourceSwitch }

  # Source spectral tilt (DECtalk OUT_TLT). One-pole lowpass on the voiced
  # impulse source ONLY (matches DECtalk, where TILT is a source param and the
  # LF branch — off at sourceMode=0 — carries its own tl). tilt=0 is a unity
  # passthrough, so Paul (TL=0) is byte-identical.
  # Citations: DECtalk 4.63 ph_draw.c OUT_TLT; klsyn88 c/parwv.c 706-711.
  tiltFilter:
    type: tilt-filter
    params:
      tilt: { bind: TL }

  sourceSum:
    type: gain
    params:
      gain: 1.0

  # Source mode switching for cascade path
  sourceBypassGain:
    type: gain
    params:
      gain: { bind: sourceBypassSwitch }

  sourceDirectGain:
    type: gain
    params:
      gain: { bind: sourceDirectSwitch }

  sourceDiffGain:
    type: gain
    params:
      gain: { bind: sourceDiffSwitch }

  # ---------------------------------------------------------------------------
  # GLOTTAL SHAPING - CASCADE PATH (RGP/RGZ)
  # ---------------------------------------------------------------------------

  # Glottal resonator pole (RGP)
  rgp:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGP }
      bandwidth: { bind: BGP }

  # Glottal resonator zero (RGZ) - antiresonator
  rgz:
    type: antiresonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGZ }
      bandwidth: { bind: BGZ }

  # Glottal source resonator (RGS) - for AVS path
  rgs:
    type: resonator
    params:
      frequency: 0
      bandwidth: { bind: BGS }

  # ---------------------------------------------------------------------------
  # GLOTTAL SHAPING - PARALLEL PATH (RGP_AVS/RGZ_AVS)
  # ---------------------------------------------------------------------------
  # Separate filter instances from cascade path (rgp/rgz) to maintain
  # independent filter states. Both paths share FGP/BGP parameters.

  rgpAvs:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGP }
      bandwidth: { bind: BGP }

  rgzAvs:
    type: antiresonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGZ }
      bandwidth: { bind: BGZ }

  # ---------------------------------------------------------------------------
  # RADIATION FILTERS
  # ---------------------------------------------------------------------------
  # Chalker & Mackerras 1985 two-term radiation impedance approximation.

  radiationDiff:
    type: chalker-radiation

  radiationDiffAvs:
    type: chalker-radiation

  # Differentiator for parallel branch (UGLOT1 = first diff of UGLOT)
  diff:
    type: differentiator

  # ---------------------------------------------------------------------------
  # VOICE/ASPIRATION GAIN NODES
  # ---------------------------------------------------------------------------

  voiceGain:
    type: gain
    params:
      gain: { bind: voiceGain }

  avsGain:
    type: gain
    params:
      gain: { bind: avsGain }

  noiseGain:
    type: gain
    params:
      gain: { bind: aspGain }

  # ---------------------------------------------------------------------------
  # PARALLEL VOICE PATH GAINS
  # ---------------------------------------------------------------------------

  # AVS path source mode switching (reuses same switches as cascade)
  avsBypassGain:
    type: gain
    params:
      gain: { bind: sourceBypassSwitch }

  avsDirectGain:
    type: gain
    params:
      gain: { bind: sourceDirectSwitch }

  avsDiffGain:
    type: gain
    params:
      gain: { bind: sourceDiffSwitch }

  # ---------------------------------------------------------------------------
  # NASAL RESONATORS
  # ---------------------------------------------------------------------------

  # Nasal antiresonator (zero) — biquad notch filter
  # Replaces Klatt FIR antiresonator which is numerically unstable at 48 kHz.
  # Bristow-Johnson Audio EQ Cookbook biquad notch: same spectral zero,
  # coefficients near unity at any sample rate.
  nz:
    type: biquad-notch
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNZ }
      bandwidth: { bind: BNZ }

  # Nasal resonator (pole)
  np:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNP }
      bandwidth: { bind: BNP }

  # Parallel nasal resonator
  parallelNasal:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNP }
      bandwidth: { bind: BNP }

  parallelNasalGain:
    type: gain
    params:
      gain: { bind: anLinear }  # was anGainScaled

  parallelBypassGain:
    type: gain
    params:
      gain: { bind: abLinear }  # was abGainScaled

  # ---------------------------------------------------------------------------
  # PARALLEL MIXING
  # ---------------------------------------------------------------------------

  mixer:
    type: gain
    params:
      gain: 1.0

  parallelMixer:
    type: gain
    params:
      gain: 1.0

  parallelSourceGain:
    type: gain
    params:
      gain: { bind: parallelVoiceGain }

  parallelDiffGain:
    type: gain
    params:
      gain: { bind: parallelVoiceGain }

  parallelFricGain:
    type: gain
    params:
      gain: { bind: fricGainScaled }

  parallelDiffSum:
    type: gain
    params:
      gain: 1.0

  parallelSum:
    type: gain
    params:
      # No branch-specific scale needed: parallel-to-cascade balance matches
      # Klatt 1980 COEWAV.FOR when both branches share the same output path.
      # The FORTRAN's 170x (line 251) is a global 16-bit DAC scale, not a
      # parallel correction.
      gain: 1.0

  # ---------------------------------------------------------------------------
  # OUTPUT MIXING
  # ---------------------------------------------------------------------------

  # Cascade output gain - gates cascade branch based on SW
  # SW=0 (cascade): cascadeGain=1, SW=1 (parallel): cascadeGain=0
  # NOTE: Both cascade and parallel are SUMMED (per COEWAV.FOR line 251)
  # Parallel voicing is gated by parallelVoiceGain, frication always flows through
  cascadeOutGain:
    type: gain
    params:
      gain: { bind: cascadeGain }

  outputSum:
    type: gain
    params:
      gain: 1.0

  # Direct output sum for the DECtalk experiment.
  # Engineering choice: keep the summed source/cascade/parallel signal visible
  # without the baseline reconstruction-filter stage while we align the core
  # cascade/parallel path to DECtalk's actual output behavior.
  masterGain:
    type: gain
    params:
      gain: { bind: masterGain }

  # DynamicsCompressorNode — mimics FORTRAN 16-bit hard clipping.
  # See klatt80-baseline/graph.yaml for rationale.
  outputCompressor:
    type: dynamics-compressor
    params:
      threshold: -24
      knee: 12
      ratio: 12
      attack: 0.003
      release: 0.1

  outputGain:
    type: gain
    params:
      gain: { bind: outputGain }

# =============================================================================
# CONNECTIONS
# =============================================================================
connections:
  # ---------------------------------------------------------------------------
  # Source routing
  # ---------------------------------------------------------------------------
  - [lfSource, lfSourceGain]
  - [lfSourceGain, sourceSum]
  - [impulseSource, impulseGain]
  - [impulseGain, tiltFilter]
  - [tiltFilter, sourceSum]
  # klglott (KLGLOTT88) voice = port 0 only → gain gate. Port 1 (noise) intentionally
  # unconnected (dectalk keeps its seeded noiseSource/fricationSource). The crate is a
  # SELF-CONTAINED glottal source (radiation + spectral tilt baked in), so — exactly as
  # klsyn88 wires it (voice → voiceGain → cascadeMix) — it feeds the cascade and parallel
  # voice-mix points DIRECTLY, bypassing the impulse-tuned glottal resonators rgp/rgz and
  # the radiationDiff stage. This also leaves sourceSum empty at sourceMode 3 (lf+impulse
  # both gated off, klglott no longer feeds it), so rgp/rgz see silence — no antiresonator
  # blow-up. The downstream voiceGain/avsGain still apply the GO+AV master loudness once.
  - [{ node: klglottSource, port: 0 }, klglottGain]
  - [klglottGain, voiceGain]
  - [klglottGain, avsGain]

  # ---------------------------------------------------------------------------
  # Glottal shaping - cascade path
  # ---------------------------------------------------------------------------
  - [sourceSum, rgp]
  - [sourceSum, rgs]
  - [rgs, rgpAvs]

  # Voice cascade path - three parallel routes merged at voiceGain
  - [sourceSum, sourceBypassGain]
  - [sourceBypassGain, voiceGain]
  - [rgp, sourceDirectGain]
  - [sourceDirectGain, voiceGain]
  - [rgp, rgz]
  - [rgz, radiationDiff]
  - [radiationDiff, sourceDiffGain]
  - [sourceDiffGain, voiceGain]
  - [voiceGain, mixer]

  # ---------------------------------------------------------------------------
  # Glottal shaping - parallel AVS path
  # ---------------------------------------------------------------------------
  - [sourceSum, avsBypassGain]
  - [avsBypassGain, avsGain]
  - [rgpAvs, avsDirectGain]
  - [avsDirectGain, avsGain]
  - [rgpAvs, rgzAvs]
  - [rgzAvs, radiationDiffAvs]
  - [radiationDiffAvs, avsDiffGain]
  - [avsDiffGain, avsGain]
  - [avsGain, parallelMixer]

  # ---------------------------------------------------------------------------
  # Aspiration/frication routing
  # ---------------------------------------------------------------------------
  - [glottalMod, noiseSource]
  - [glottalMod, fricationSource]
  - [noiseSource, noiseGain]
  - [noiseGain, mixer]
  - [noiseGain, parallelMixer]

  # ---------------------------------------------------------------------------
  # Cascade branch: NZ -> NP -> F1 -> F2 -> F3 -> F4 -> F5 -> F6
  # ---------------------------------------------------------------------------
  # NOTE: This matches Figure 6's conceptual diagram from Klatt 1980.
  # COEWAV.FOR processes in reverse order (F6->F5->F4->F3->F2->F1->NZ->NP)
  # "to minimize transients" (line 175), but the transfer function is
  # mathematically equivalent since cascaded filters commute.
  # ---------------------------------------------------------------------------
  - [mixer, nz]
  - [nz, np]
  # Cascade formant chain (np -> F1..F6 -> cascadeOutGain) generated by formantBanks
  - [cascadeOutGain, outputSum]

  # ---------------------------------------------------------------------------
  # Parallel branch routing
  # ---------------------------------------------------------------------------
  - [parallelMixer, parallelSourceGain]
  - [parallelMixer, diff]
  - [diff, parallelDiffGain]
  - [parallelDiffGain, parallelDiffSum]
  - [fricationSource, parallelFricGain]
  - [parallelFricGain, parallelDiffSum]

  # Parallel formant channels (source -> F{N} -> F{N}Gain -> parallelSum) generated by formantBanks

  # Parallel nasal uses UGLOT
  - [parallelSourceGain, parallelNasal]
  - [parallelNasal, parallelNasalGain]
  - [parallelNasalGain, parallelSum]

  # Parallel bypass
  - [parallelFricGain, parallelBypassGain]
  - [parallelBypassGain, parallelSum]

  # Parallel output - summed with cascade (per COEWAV.FOR line 251: ULIPS=(ULIPSV+ULIPSF+STEP)*(170.))
  # Parallel voicing gated by parallelVoiceGain, frication always flows through
  - [parallelSum, outputSum]

  # ---------------------------------------------------------------------------
  # PLSTEP burst - edge detection triggers decay envelope
  # ---------------------------------------------------------------------------
  - [afEdgeDetector, plstepTriggerSum]
  - [ahEdgeDetector, plstepTriggerSum]
  - [plstepTriggerSum, plstepEnvelope]  # Connect sum output to trigger input
  - [plstepEnvelope, outputSum]

  # ---------------------------------------------------------------------------
  # Output chain
  # ---------------------------------------------------------------------------
  - [outputSum, masterGain]
  - [masterGain, outputCompressor]
  - [outputCompressor, outputGain]

# =============================================================================
# OUTPUTS
# =============================================================================
outputs:
  - outputGain
