# DECtalk 4.63 ls_util.c:598-622 and l_us_pr1.c:422-440,980-1069.
maps:
  tn_recognition_policy:
    years: 'yes'
    fractions: 'yes'
    # Numbers inside dates and money, which the text rules still write out.
    hundreds: hundred
    # A bare number or year stays digits: DECtalk speaks it from its own phone
    # lists (LTS/l_us_pr1.c), not from the words in its dictionary.
    bare_numbers: digits
    # A dollar amount, a clock time, a plural number and a number with
    # thousands separators or fraction digits stay as written too: DECtalk's
    # text task reads each from the word itself (LTS/ls_task.c:3181-3513
    # money, 3622-3652 time, 3747-3825 and 3936-4046 numbers and plurals),
    # with its own boundaries between the parts.
    number_tokens: source
    fraction_exception: '100'
    # A capital letter followed by a period is an initial: it is spelled and
    # its period is sent twice (LTS/ls_task.c:2612-2623, 1516-1519,
    # 1547-1549). "I." is not: DECtalk's dictionary search, which runs before
    # the single-letter rules (ls_task.c main loop), takes "I" as the pronoun
    # (PH receives the class PRON|FUNC for it, 00802000, and one period).
    # "I" is the whole measured set: DECtalk 4.63 say.exe speaks each of
    # "A." to "Z." except "I." as the letter's name and two clause ends
    # (test/fixtures/dectalk-oracle/dectalk-us-letters-v1.frames.json,
    # letters-initial-a and initial-b to initial-z against letters-pronoun-i).
    initials: spelled
    initial_exceptions: 'I'
    # An apostrophe in front of a letter stays on its word, as one after a
    # letter does: DECtalk looks the word up as written before it strips the
    # punctuation at its ends (LTS/ls_task.c:2161, then 2244-2325 and
    # 2477-2478). Measured on say.exe: "'n" is EN and "'em" IX M (the
    # dictionary's words), "'tis", "'cause", "'bout", "'hello'" the same as
    # without the marks, "'n'" EH N and "'em'" EH M.
    lexical_apostrophe: "(?<=[a-z])'|'(?=[a-z])"
    # Abbreviations are the dictionary's entries that end in a period
    # (dictionary-abbreviations.yaml, generated), not the shared list: a word
    # followed by a period is looked up with it and a hit eats the period
    # (LTS/ls_task.c:2040-2160). Measured on say.exe: "No." is "no" and a
    # sentence end, "Main St. near" is "street" with no break, "The Dept. and"
    # is "department" while "The dept. and" is not (the entry is "Dept."),
    # "See fig. 3" is "figure" while "See Fig. 3" is "fig" and a sentence end.
    abbreviations: dictionary
    # A word of capitals with periods between is spelled, each letter a word,
    # and the period after it is eaten (LTS/ls_task.c:2840-2890). Measured on
    # say.exe: "The U.S. flag was raised." is one clause with Y UW, EH S;
    # "The U.S.A. is large." has EY for the A; "He works for the F.B.I." ends
    # the sentence at the text's end. The shared rule, which also takes lower
    # case and speaks the letters as words, is off.
    initialisms: capitals
# A text that does not end in punctuation is still closed as a sentence: when
# the text is flushed the text task sends a breath break (LTS/ls_task.c:1236-1260,
# the VT case) and the clause ends as one that ends in a period. Measured on
# DECtalk 4.63 say.exe, as the symbols the phonemic stage receives: "cat" is
# K AE T, a word boundary and the period symbol; the same for "1st", "42",
# "hello world", "Mr" (spelled, then the period) and "B".
rules:
  tn_text_end:
    kind: structural
    select:
      relation: Normalization
      where: >-
        current.outputType == 'terminal' && next == null
        && !(current.text in transcription.punctuation_tokens)
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "[{'type': 'terminal', 'text': current.text}, {'type': 'terminal', 'text': '.'}]"
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:1236-1260 (the flush character ends the clause with a breath break)"
phases:
  - name: normalization_text_end
    after: [normalization_terminal_words]
    rules: [tn_text_end]
