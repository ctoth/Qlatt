version: v1
predicates:
  is_question_boundary: current.phoneme == 'SIL' && current.punctuationSymbol == '?'
  is_stressed_vowel: current.type == 'vowel' && has(current.stress) && current.stress == 1
  is_pausable_consonant: current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate']
  is_sonorant: current.type in ['nasal', 'liquid', 'glide']
  is_vowel_or_sonorant: current.type == 'vowel' || current.type in ['nasal', 'liquid', 'glide']
  prev_same_word: has(prev.word) && has(current.word) && prev.word == current.word
  next_same_word: has(next.word) && has(current.word) && next.word == current.word
  prev_diff_word: prev == null || (has(prev.word) && has(current.word) && prev.word != current.word)
  is_coda: >-
    next == null || next.phoneme == 'SIL' ||
    next.type in ['stop', 'stop_closure', 'fricative', 'nasal', 'affricate'] ||
    (has(next.word) && has(current.word) && next.word != current.word)
  # NOTE: "coronal" is the disjunction of alveolar and postalveolar feature flags.
  # No token in this codebase carries a `coronal: true` annotation.
  prev_coronal: (has(prev.alveolar) && prev.alveolar == true) || (has(prev.postalveolar) && prev.postalveolar == true)
  next_coronal: (has(next.alveolar) && next.alveolar == true) || (has(next.postalveolar) && next.postalveolar == true)
  both_coronal: ((has(prev.alveolar) && prev.alveolar == true) || (has(prev.postalveolar) && prev.postalveolar == true)) && ((has(next.alveolar) && next.alveolar == true) || (has(next.postalveolar) && next.postalveolar == true))
  one_coronal: (has(prev.alveolar) && prev.alveolar == true) || (has(prev.postalveolar) && prev.postalveolar == true) || (has(next.alveolar) && next.alveolar == true) || (has(next.postalveolar) && next.postalveolar == true)
  is_bilabial: has(current.bilabial) && current.bilabial == true
  is_alveolar: has(current.alveolar) && current.alveolar == true
  is_velar: has(current.velar) && current.velar == true
  is_voiced: has(current.voiced) && current.voiced == true
  is_voiceless: has(current.voiceless) && current.voiceless == true
  is_back_vowel: has(current.back_vowel) && current.back_vowel == true
  is_front_vowel: has(current.front_vowel) && current.front_vowel == true
  is_high_vowel: has(current.high_vowel) && current.high_vowel == true
streams:
  orthography:
    type: base
    features:
      tokenType:
        - word
        - punctuation
  phone:
    type: base
    features:
      type:
        - vowel
        - stop
        - stop_closure
        - stop_release
        - stop_aspiration
        - fricative
        - affricate
        - silence
        - liquid
        - nasal
        - glide
    scalars:
      duration:
        unit: ms
        resolution: klatt
        max: 500
        floor_field: durationFloor
  f0:
    type: point
    value_type: number
    unit: Hz
phases:
  - name: orthography
    rules:
      - spelling_mode_letter_names
  - name: normalize
    rules:
      - normalize_schwa
      - normalize_velar_nasal
      - normalize_wh_merger
  - name: postlexical
    rules:
      - the_prevocalic_reduction
      - to_reduction
      - t_flapping
      - d_flapping
      - t_deletion
      - d_deletion
      - t_glottalization
      - palatalization_dy
      - palatalization_ty
      - glottal_stop_insertion
  - name: structural
    rules:
      - remap_stops_to_closures
      - expand_affricates_with_closure
      - expand_diphthongs
      - expand_rhotic_vowels
      - insert_voiceless_stop_release_and_aspiration
      - insert_voiceless_stop_release_and_aspiration_final
      - insert_voiced_stop_release
      - insert_voiced_stop_release_final
  - name: annotation
    rules:
      - syllable_count_annotation
      - cluster_position_annotation
  - name: duration
    rules:
      - non_word_initial_consonant_shortening
      - word_medial_consonant_shortening
      - unstressed_consonant_shortening
      - word_initial_lengthening
      - punctuation_pause
      - pause_rate_scaling
      - stress_duration
      - accent_vowel_lengthening
      - polysyllabic_shortening
      - cluster_shortening
      - vowel_shortening
      - pre_boundary_lengthening
      - speech_rate_scaling
      - duration_cap
      - fricative_minimum_duration
      - lock_stop_release_duration
      - stop_unreleasing
      - s_cluster_aspiration_reduction
      - aspiration_frication_carryover
    resolve_scalars:
      - duration
  - name: formant
    after:
      - duration
    rules:
      - k_context_cl_f2
      - k_context_rel_copy
      - bilabial_f2_locus
      - bilabial_rel_copy
      - alveolar_f2_locus
      - alveolar_rel_copy
      - palatal_f2_locus
      - dark_l_allophony
      - r_f3_lowering
      - f1_stop_onset
      - burst_spectral_template
      - weak_stop_release_parallel_attenuation
      - weak_final_voiced_stop_closure_attenuation
      - vcv_coarticulation
      - vowel_reduction
      - schwa_coronal_fronting
      - uw_coronal_fronting
      - vowel_rate_undershoot
      - nasal_place_assignment
      - nasal_place_assimilation
      - nasal_windows
      - sw_explicit_override
      - sw_default_assignment
  - name: prosody
    rules:
      - tobi_baseline_init
      - tobi_initial_boundary_high
      - tobi_accent_h_star
      - tobi_accent_h_star_plus_l_peak
      - tobi_accent_h_star_plus_l_tail
      - tobi_accent_l_plus_h_star_lead
      - tobi_accent_l_plus_h_star_peak
      - tobi_accent_h_plus_downstepped_h_star_lead
      - tobi_accent_h_plus_downstepped_h_star_peak
      - tobi_accent_h_star_plus_h_peak
      - tobi_accent_h_star_plus_h_tail
      - tobi_accent_h_plus_l_star_lead
      - tobi_accent_h_plus_l_star_peak
      - tobi_accent_l_star
      - tobi_accent_l_star_plus_h_trailing
      - tobi_unaccented_declination
      - tobi_phrase_accent_high
      - tobi_phrase_accent_low
      - tobi_boundary_low
      - tobi_boundary_rise
      - tobi_register_reset
      - sagging_transition
      - connected_speech_source_contour
      - f0_voiceless_onset_perturbation
      - f0_voiced_onset_perturbation
      - f0_continuation_rise
  - name: finalize
    after:
      - duration
      - prosody
    rules: []
    compute_times: true
    resolve_points:
      - f0
