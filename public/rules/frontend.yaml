version: v12-cel
parameters:
  base_f0: 110
  fall_rate_hz: 20
  stress_rise: 1.15
  question_rise_hz: 30
streams:
  phone:
    type: base
    scalars:
      duration:
        unit: ms
        resolution: klatt
        max: 500
  f0:
    type: point
    value_type: number
    unit: Hz
phases:
  - name: structural
    rules:
      - insert_voiceless_stop_release_and_aspiration
      - insert_voiced_stop_release
  - name: duration
    rules:
      - k_context_cl_f2
      - k_context_rel_copy
      - punctuation_pause
      - stress_duration
      - vowel_shortening
      - pre_boundary_lengthening
      - lock_stop_release_duration
      - sw_explicit_override
      - sw_default_assignment
    resolve_scalars:
      - duration
  - name: prosody
    rules:
      - f0_baseline_start
      - f0_targets
      - f0_stress_peak
      - f0_question_rise
  - name: finalize
    after:
      - duration
      - prosody
    rules: []
    compute_times: true
    resolve_points:
      - f0
rules:
  insert_voiceless_stop_release_and_aspiration:
    kind: structural
    citation: Stevens 1998 Ch.8; Allen et al. 1987 Table C-1
    select:
      stream: phone
      where: >-
        (current.phoneme == 'P_CL' || current.phoneme == 'T_CL' || current.phoneme == 'K_CL') && (next != null ?
        !(next.type == 'stop' || next.type == 'stop_closure' || next.type == 'stop_release' || next.type ==
        'stop_aspiration') : false)
    define:
      rel: 'current.phoneme == ''P_CL'' ? ''P_REL'' : (current.phoneme == ''T_CL'' ? ''T_REL'' : ''K_REL'')'
      asp: 'current.phoneme == ''P_CL'' ? ''P_ASP'' : (current.phoneme == ''T_CL'' ? ''T_ASP'' : ''K_ASP'')'
      next_token: next
      weak: 'next_token != null ? next_token.phoneme == ''SIL'' : false'
      rel_target: target(rel)
      asp_target: target(asp)
      rel_params: >-
        weak ? merge(rel_target.params, {'AF': max([0, rel_target.params.AF - 10]), 'AH': max([0, rel_target.params.AH -
        10])}) : rel_target.params
      asp_params: >-
        weak ? merge(asp_target.params, {'AF': max([0, asp_target.params.AF - 10]), 'AH': max([0, asp_target.params.AH -
        10])}) : asp_target.params
      rel_duration: 'weak ? max([15, rel_target.duration * 0.5]) : rel_target.duration'
      asp_duration: 'weak ? max([15, asp_target.duration * 0.5]) : asp_target.duration'
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - phoneme: rel
          stress: 'has(current.stress) ? current.stress : null'
          word: 'has(current.word) ? current.word : null'
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: 'has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)'
        - phoneme: asp
          stress: 'has(current.stress) ? current.stress : null'
          word: 'has(current.word) ? current.word : null'
          weak: weak
          params: asp_params
          duration: asp_duration
          inherentDuration: asp_target.inherentDuration
          type: asp_target.type
          inventorySW: 'has(asp_target.inventorySW) ? asp_target.inventorySW : (has(asp_params.SW) ? asp_params.SW : 0)'
        - phoneme: next_token.phoneme
          stress: 'has(next_token.stress) ? next_token.stress : null'
          word: 'has(next_token.word) ? next_token.word : null'
          weak: 'has(next_token.weak) ? next_token.weak : null'
          params: 'has(next_token.params) ? next_token.params : {}'
          duration: 'has(next_token.duration) ? next_token.duration : null'
          inherentDuration: 'has(next_token.inherentDuration) ? next_token.inherentDuration : null'
          type: next_token.type
          punctuationSymbol: 'has(next_token.punctuationSymbol) ? next_token.punctuationSymbol : null'
  insert_voiced_stop_release:
    kind: structural
    citation: Stevens 1998 Ch.8; Allen et al. 1987 Table C-1
    select:
      stream: phone
      where: >-
        (current.phoneme == 'B_CL' || current.phoneme == 'D_CL' || current.phoneme == 'G_CL') && (next != null ?
        !(next.type == 'stop' || next.type == 'stop_closure' || next.type == 'stop_release' || next.type ==
        'stop_aspiration') : false)
    define:
      rel: 'current.phoneme == ''B_CL'' ? ''B_REL'' : (current.phoneme == ''D_CL'' ? ''D_REL'' : ''G_REL'')'
      next_token: next
      weak: 'next_token != null ? next_token.phoneme == ''SIL'' : false'
      rel_target: target(rel)
      rel_params: >-
        weak ? merge(rel_target.params, {'AF': max([0, rel_target.params.AF - 10]), 'AH': max([0, rel_target.params.AH -
        10])}) : rel_target.params
      rel_duration: 'weak ? max([15, rel_target.duration * 0.5]) : rel_target.duration'
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - phoneme: rel
          stress: 'has(current.stress) ? current.stress : null'
          word: 'has(current.word) ? current.word : null'
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: 'has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)'
        - phoneme: next_token.phoneme
          stress: 'has(next_token.stress) ? next_token.stress : null'
          word: 'has(next_token.word) ? next_token.word : null'
          weak: 'has(next_token.weak) ? next_token.weak : null'
          params: 'has(next_token.params) ? next_token.params : {}'
          duration: 'has(next_token.duration) ? next_token.duration : null'
          inherentDuration: 'has(next_token.inherentDuration) ? next_token.inherentDuration : null'
          type: next_token.type
          punctuationSymbol: 'has(next_token.punctuationSymbol) ? next_token.punctuationSymbol : null'
  stress_duration:
    kind: scalar
    citation: Klatt 1976 §III.B
    select:
      stream: phone
      where: current.type == 'vowel'
    apply:
      - field: duration
        op: mul
        value: 'has(current.stress) && current.stress == 1 ? 1.3 : ((has(current.stress) && current.stress == 0) ? 0.8 : 1)'
        tag: stress
  k_context_cl_f2:
    kind: scalar
    citation: Allen et al. 1987 Ch.11 (velar locus)
    select:
      stream: phone
      where: current.phoneme == 'K_CL'
    define:
      cand: 'next != null && next.phoneme == ''K_REL'' ? next2 : next'
    apply:
      - field: params.F2
        op: set
        value: >-
          cand != null && cand.type == 'vowel' ? ((has(cand.back) && cand.back == true) ? 1200 : (((has(cand.front) &&
          cand.front == true) || (has(cand.hi) && cand.hi == true)) ? 1900 : 1500)) : 1500
  k_context_rel_copy:
    kind: scalar
    citation: Allen et al. 1987 Ch.11 (velar locus transitions)
    select:
      stream: phone
      where: 'current.phoneme == ''K_REL'' && (prev != null ? prev.phoneme == ''K_CL'' : false)'
    apply:
      - field: params.F2
        op: set
        value: 'prev != null && has(prev.params.F2) ? prev.params.F2 : 1500'
  punctuation_pause:
    kind: scalar
    citation: Allen et al. 1987 Ch.8 (pause insertion)
    select:
      stream: phone
      where: current.phoneme == 'SIL' && has(current.punctuationSymbol)
    apply:
      - field: duration
        op: set
        value: >-
          current.punctuationSymbol == ',' ? 150 : ((current.punctuationSymbol == '.' || current.punctuationSymbol ==
          '?' || current.punctuationSymbol == '!') ? 300 : current.duration)
  vowel_shortening:
    kind: scalar
    citation: Chen 1970; Wells 1990
    select:
      stream: phone
      where: current.type == 'vowel'
    define:
      'n': next
    apply:
      - field: duration
        op: mul
        value: >-
          n == null ? 1.2 : (n.phoneme == 'SIL' ? 1.2 : ((has(n.voiceless) && n.voiceless == true && (n.type == 'stop'
          || n.type == 'stop_closure')) ? 0.7 : ((has(n.voiceless) && n.voiceless == true && n.type == 'fricative') ?
          0.85 : 1)))
        tag: segmental_context
  pre_boundary_lengthening:
    kind: scalar
    citation: Klatt 1976 §III.A
    select:
      stream: phone
      where: current.phoneme != 'SIL'
    define:
      'n': next
      cur_word: 'has(current.word) ? current.word : '''''
      next_word: 'n != null && has(n.word) ? n.word : '''''
    apply:
      - field: duration
        op: mul
        value: >-
          n == null ? 1.4 : ((n.phoneme == 'SIL' && has(n.punctuationSymbol)) ? 1.4 : ((n.phoneme != 'SIL' && cur_word
          != '' && next_word != '' && cur_word != next_word) ? 1.1 : 1))
        tag: boundary
  lock_stop_release_duration:
    kind: scalar
    citation: Allen et al. 1987 Table C-1 (fixed burst/aspiration durations)
    select:
      stream: phone
      where: current.type == 'stop_release' || current.type == 'stop_aspiration'
    apply:
      - field: duration
        op: set
        value: 'has(current.inherentDuration) ? current.inherentDuration : current.duration'
  sw_explicit_override:
    kind: scalar
    citation: Klatt 1980 (SW switch); Allen et al. 1987 Table 12-1
    select:
      stream: phone
      where: has(current.inventorySW)
    apply:
      - field: params.SW
        op: set
        value: current.inventorySW
  sw_default_assignment:
    kind: scalar
    citation: Klatt 1980 (cascade/parallel source routing)
    select:
      stream: phone
      where: '!has(current.inventorySW)'
    apply:
      - field: params.SW
        op: set
        value: >-
          (current.type == 'fricative' || current.type == 'affricate' || current.type == 'stop_release' || current.type
          == 'stop_aspiration') ? 1 : 0
  f0_baseline_start:
    kind: point
    citation: Pierrehumbert 1980; O'Shaughnessy 1976
    select:
      stream: phone
      where: prev == null
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.base_f0
      tag: f0_baseline
  f0_targets:
    kind: point
    citation: Pierrehumbert 1980; Allen et al. 1987; O'Shaughnessy 1976
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL' && ((has(current.params.AV) && current.params.AV > 0) || (has(current.params.AVS) &&
        current.params.AVS > 0))
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: >-
        max([((params.base_f0 - params.fall_rate_hz * (phrase_total <= 1 ? 0 : (double(phrase_index) /
        double(phrase_total - 1)))) * (has(current.params.F0_Factor) ? current.params.F0_Factor : 1)), params.base_f0 *
        0.6])
      tag: f0_declination
  f0_stress_peak:
    kind: point
    citation: O'Shaughnessy 1976; Allen et al. 1987
    select:
      stream: phone
      where: >-
        current.type == 'vowel' && current.stress == 1 && ((has(current.params.AV) && current.params.AV > 0) ||
        (has(current.params.AVS) && current.params.AVS > 0))
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: '(prev_f0 == null ? params.base_f0 : prev_f0.value) * params.stress_rise'
      tag: f0_stress
  f0_question_rise:
    kind: point
    citation: Pierrehumbert 1980; Ladd 2008; O'Shaughnessy 1976
    select:
      stream: phone
      where: current.phoneme == 'SIL' && current.punctuationSymbol == '?'
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: '(prev_f0 == null ? params.base_f0 : prev_f0.value) + params.question_rise_hz'
      tag: f0_question
