id: speech_0014
canonical_name: harmonic_richness_factor
status: proposed
definition: Ratio of summed upper harmonic amplitudes to the fundamental amplitude.
  HRF = sum(H_i for i>=2) / H1. Higher HRF indicates more harmonic energy relative
  to fundamental (pressed voice), lower HRF indicates fundamental dominance (breathy/falsetto).
