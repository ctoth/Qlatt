id: speech_0009
canonical_name: rd_parameter
status: proposed
definition: Unified waveshape descriptor for the LF glottal source model. Single parameter
  that predicts default values for Ra, Rk, Rg. Rd = (Uo/Ee)*(F0/110)*1000. Low Rd
  (0.3-0.5) = pressed voice, mid Rd (0.7-1.0) = modal, high Rd (2.0-2.7) = breathy.
