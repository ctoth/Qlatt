- id: claim8
  type: observation
  statement: '**KLGLOTT88 Oq-H1*-H2* monotonicity**: In the KLGLOTT88 model, H1*-H2*
    must be a monotonically increasing function of Oq'
  concepts:
  - open_quotient
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 0
- id: claim9
  type: observation
  statement: '**LF model H1*-H2* range**: For the LF model with abrupt closure, H1*-H2*
    must fall in approximately [-5, +10] dB for Oq in [0.2, 0.9] and alpha_m in [2/3,
    0.9]'
  concepts:
  - open_quotient
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 0
- id: claim10
  type: observation
  statement: '**R++ model wider range**: R++ H1*-H2* domain is strictly wider than
    LF H1*-H2* domain for the same Oq range'
  concepts:
  - open_quotient
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 0
- id: claim11
  type: observation
  statement: '**Ambiguity**: For LF model, any H1*-H2* value in [0, 5] dB must correspond
    to at least two distinct (Oq, alpha_m) pairs'
  concepts:
  - open_quotient
  provenance:
    paper: Henrich_2001_SpectralOqAsymmetry
    page: 0
- id: claim12
  type: observation
  statement: '**Increasing Oq increases H1*-H2* (at fixed alpha_m)**: At any fixed
    asymmetry coefficient, increasing Oq must increase H1*-H2*'
  concepts:
  - open_quotient
  provenance:
