      voiceless_open_tract_breathy_onset_ms: 40
      voiceless_open_tract_breathy_onset_db: 52
      # DECtalk 4.63 p_us_st1.c backward smoothing uses a boundary value of
      # target-10 dB when source amplitude is increasing.
      source_onset_boundary_drop_db: 10
      # DECtalk 4.63 p_us_st1.c keeps voicing onset non-abrupt after a voiced
      # fricative. The original code uses the normal source-smoothing path;
      # Qlatt approximates that with a 40 ms prefix window. # engineering approximation
      voiced_fricative_voicing_onset_ms: 40
      # DECtalk 4.63 p_us_st1.c backward smoothing uses an NF130MS source span,
      # but the rendered AP tail decays to zero over ~90 ms in the DECtalk
      # trace for the single-word final-vowel case.
      vowel_breathy_offset_ms: 90
