transcription:
  # A text made only of phoneme symbols is ordinary text here: "B." is the
  # letter. DECtalk takes phonemes only inside brackets, and only after
  # [:phoneme on]: the mode starts off (CMD/Cmd_init.c:87) and the parser
  # tests it before reading a bracket as phonemes (CMD/cm_pars.c:361).
  diagnostic_symbol_input: false
  # The dictionary is searched by the written word: "n" does not find "'n",
  # "em" does not find "'em". Measured on DECtalk 4.63 say.exe (symbols into
  # ph_sort): "Plan n is ready." has EH N, "Plan 'n is ready." EN;
  # "Plan em is ready." has EH M, "Plan 'em is ready." IX M.
  elided_apostrophe_lookup: false
  # A word that misses as written is looked up again without the apostrophes
  # at its ends (LTS/ls_task.c:2161 as written, 2244-2325 strip, 2477-2478
  # again).
  #
  # What this frontend's lexicon is, for the decision record of each word.
  sources:
    dictionary:
      name: DECtalk dictionary
      citation: "DECtalk 4.63 dapi/src/dic/Dic_us.txt, converted by scripts/build-dectalk-dict.ts (/dectalk-dictionary.json)"
    morphology:
      name: DECtalk suffix stripping against the dictionary
      citation: "DECtalk 4.63 LTS/ls_suff.c (ls_suff_suffix_find, ls_suff_append_pron), as src/g2p/table-suffix.ts"
    lts-rules:
      name: DECtalk letter-to-sound rules
      citation: "DECtalk 4.63 LTS/lsa_rta.c compiled rule tables, run as LTS/l_us_ru1.c runs them (/rules/frontends/dectalk-english/lts-table.json)"
    spelling:
      name: DECtalk letter names
      citation: "DECtalk 4.63 LTS/ls_task.c:2760-2775 (a one-letter word is spelled), INCLUDE/usa_type.tab lower-case rows (the names)"
    position:
      name: DECtalk's two forms of the word "a"
      citation: "DECtalk 4.63 LTS/ls_task.c:2647-2673 ([x] when no punctuation was stripped and none follows, else the spelling entry's ['e]), as wordsByPunctuation in /rules/frontends/dectalk-english/lts-table.json"
    number-abbreviation:
      name: DECtalk's unit abbreviations after a number
      citation: "DECtalk 4.63 LTS/l_us_con.c:366 nabtab[] (singular and plural phones), LTS/ls_task.c:2125-2152 (looked up before the dictionary while a number stands at most two words back), as numberAbbreviations in /rules/frontends/dectalk-english/lts-table.json"
    hyphenated:
      name: DECtalk's reading of a hyphenated word by its parts
      citation: "DECtalk 4.63 LTS/ls_task.c:4208-4435 ls_task_process_word (each part between hyphens looked up, then by rule or spelled; HYPHEN after a first part the dictionary has :4330 and after a part the rules read :4374)"
  # The characters that end the stretch of text DECtalk parses at once when a
  # written word ends in one and a space follows: DECtalk 4.63
  # LTS/ls_task.c:362-368 (the text is handed on at a space after a
  # MARK_clause character) with CMD/cm_char.c:93-123 (the characters that
  # have MARK_clause). An abbreviation's period is one.
  word_stretch_end_characters: "!',-.:;?"
  # The same stretch also ends by its length alone: DECtalk 4.63
  # LTS/ls_task.c:371-372, the gathered text is handed on at white space once
  # more than 400 characters have been gathered (`temp>400`), and at any
  # character past 480 (`temp>480`). A clause of some 450 characters with no
  # mark in it is therefore two stretches, and the clause breaks of the second
  # are counted from its own first word.
  word_stretch_length_limits: [400, 480]
  # The names of the letters, for a token the orthography phase marks as a
  # spelled letter: DECtalk 4.63 INCLUDE/usa_type.tab, the lower-case rows,
  # the same phones as letterPhones in lts-table.json (a test holds the two
  # equal).
  letter_names:
    LETTER_A: [EY1]
    LETTER_B: [B, IY1]
    LETTER_C: [S, IY1]
    LETTER_D: [D, IY1]
    LETTER_E: [IY1]
    LETTER_F: [EH1, F]
    LETTER_G: [JH, IY1]
    LETTER_H: [EY1, CH]
