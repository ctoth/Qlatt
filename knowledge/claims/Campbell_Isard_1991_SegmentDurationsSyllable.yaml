    page: 0
- id: claim1089
  type: observation
  statement: '**Uniform compression**: In short, sentence-internal syllables, z-scores
    should be approximately constant across onset, peak, and coda positions (within
    ~0.15 SD)'
  concepts: []
  provenance:
    paper: Campbell_Isard_1991_SegmentDurationsSyllable
    page: 0
- id: claim1090
  type: observation
  statement: '**Final lengthening asymmetry**: Peak and coda z-scores in final syllables
    should be significantly higher than onset z-scores (by ~0.7-0.8 SD)'
  concepts: []
  provenance:
    paper: Campbell_Isard_1991_SegmentDurationsSyllable
    page: 0
- id: claim1091
  type: observation
  statement: '**Pre-voicing effect size**: Vowels before voiced stops should be ~0.25
    SD longer than before voiceless stops in sentence-internal syllables'
  concepts: []
  provenance:
    paper: Campbell_Isard_1991_SegmentDurationsSyllable
    page: 0
- id: claim1092
  type: observation
  statement: '**Log-normal distribution**: Raw segment durations should be approximately
    log-normally distributed (positive skew in raw, near-normal after log transform)'
  concepts: []
  provenance:
    paper: Campbell_Isard_1991_SegmentDurationsSyllable
    page: 0
- id: claim1093
  type: observation
  statement: '**Elasticity range**: z-scores should fall within [-3, +3] with 0.998
    probability'
  concepts: []
  provenance:
    paper: Campbell_Isard_1991_SegmentDurationsSyllable
    page: 0
- id: claim1094
  type: observation
  statement: '**Syllable-level prediction**: Solving Eq. 2 for k and applying uniformly
    should reconstruct segment durations within the syllable to reasonable accuracy
    for non-final syllables'
  concepts: []
  provenance:
    paper: Campbell_Isard_1991_SegmentDurationsSyllable
    page: 0
