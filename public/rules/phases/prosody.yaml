version: v2-tobi
rules:
  # ==========================================================================
  # ToBI Intonation Model
  #
  # Replaces the O'Shaughnessy 1976 exponential-declination F0 model with a
  # Pierrehumbert 1980 / Ladd 2008 pitch-range model using:
  #   - Accent-type-specific F0 targets (H*, L*)
  #   - Iterative downstep (k^n) instead of global declination
  #   - Boundary tones (L%, H%) for phrase-final contour
  #   - Register reset at IP boundaries (breakIndex >= 4)
  #
  # Citations:
  #   - Pierrehumbert 1980 (pitch accent inventory, downstep formula, boundary tones)
  #   - Ladd 2008 (pitch range normalization, final lowering, sagging transitions)
  #   - Silverman et al. 1992 (ToBI labeling standard)
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Rule 1: Baseline initialization
  # --------------------------------------------------------------------------
  tobi_baseline_init:
    kind: point
    select:
      stream: phone
      where: prev == null
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.policy.f0.base_hz
      tag: f0_baseline
    citations:
      - Pierrehumbert 1980 (baseline initialization)
      - Ladd 2008 Ch.5

  # --------------------------------------------------------------------------
  # Rule 2: H* accent targets with downstep and final lowering
  # --------------------------------------------------------------------------
  tobi_accent_h_star:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'H*'
        && ((has(current.?params.AV) && current.params.AV > 0)
            || (has(current.?params.AVS) && current.params.AVS > 0))
    define:
      accent_idx: "has(current.accentIndexInPhrase) && current.accentIndexInPhrase >= 0 ? current.accentIndexInPhrase : 0"
      downstep_factor: >-
        pow(params.policy.f0.downstep_k, accent_idx)
      final_lower: >-
        (has(current.isNuclearAccent) && current.isNuclearAccent == true) ? params.policy.f0.final_lowering_factor : 1.0
      raw_height: >-
        params.policy.f0.h_star_height * downstep_factor * final_lower
      clamped_height: >-
        max([raw_height, params.policy.f0.downstep_floor_fraction])
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * clamped_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_h_star
    citations:
      - "Pierrehumbert 1980 (H* pitch accent, downstep formula H_n = V * k^n)"
      - "Ladd 2008 Ch.2 (constant-proportion downstep ratio k ≈ 0.6)"
      - "O'Shaughnessy 1976 (peak position at 45% of vowel)"

  # --------------------------------------------------------------------------
  # Rule 3: L* accent targets (questions)
  # --------------------------------------------------------------------------
  tobi_accent_l_star:
    kind: point
    select:
      stream: phone
      where: >-
        has(current.isAccented) && current.isAccented == true && current.stress == 1
        && has(current.accentType) && current.accentType == 'L*'
        && ((has(current.?params.AV) && current.params.AV > 0)
            || (has(current.?params.AVS) && current.params.AVS > 0))
    define:
      target_hz: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.l_star_height
    insert_point:
      stream: f0
      at: at_ratio(current, 0.45)
      value: target_hz
      tag: f0_l_star
    citations:
      - Pierrehumbert 1980 (L* pitch accent)
      - Ladd 2008 Ch.3 (L* in questions)

  # --------------------------------------------------------------------------
  # Rule 4: Unaccented voiced segment declination (gentle sag)
  # --------------------------------------------------------------------------
  tobi_unaccented_declination:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL'
        && (has(current.isAccented) ? current.isAccented != true : true)
        && ((has(current.?params.AV) && current.params.AV > 0)
            || (has(current.?params.AVS) && current.params.AVS > 0))
    define:
      prev_f0: prev_point('f0')
      base: params.policy.f0.base_hz
      fallback: "prev_f0 == null ? base : prev_f0.value"
      target: >-
        max([fallback * 0.98, base])
    insert_point:
      stream: f0
      at: at_sync(current.sync_right)
      value: target
      tag: f0_unaccented
    citations:
      - "Pierrehumbert 1980 (inter-accent interpolation: sagging transition)"
      - "Ladd 2008 pp.155-157 (sagging transition between H* accents)"

  # --------------------------------------------------------------------------
  # Rule 5: L% boundary tone (declarative final fall)
  # --------------------------------------------------------------------------
  tobi_boundary_low:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL'
        && has(current.boundaryTone) && current.boundaryTone != null
        && current.boundaryTone == 'L%'
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_l_pct_fraction
      tag: f0_boundary_low
    citations:
      - "Pierrehumbert 1980 Rule 6: L% = 0 (on baseline)"
      - Ladd 2008 (L-L% declarative final lowering)

  # --------------------------------------------------------------------------
  # Rule 6: H% boundary tone (question rise, continuation rise)
  # --------------------------------------------------------------------------
  tobi_boundary_rise:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL'
        && has(current.boundaryTone) && current.boundaryTone != null
        && current.boundaryTone == 'H%'
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: >-
        params.policy.f0.base_hz + params.policy.f0.range_hz * params.policy.f0.boundary_h_pct_fraction
      tag: f0_boundary_rise
    citations:
      - "Pierrehumbert 1980 (H% boundary tone near top of range)"
      - Ladd 2008 Ch.3

  # --------------------------------------------------------------------------
  # Rule 7: Register reset at IP boundaries (breakIndex >= 4)
  # --------------------------------------------------------------------------
  tobi_register_reset:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme != 'SIL'
        && (prev != null
            ? (prev.phoneme == 'SIL'
                ? (has(prev.breakIndex) && prev.breakIndex != null ? prev.breakIndex >= 4 : false)
                : false)
            : false)
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: params.policy.f0.base_hz
      tag: f0_register_reset
    citations:
      - Pierrehumbert 1980 (register reset at IP boundaries)
      - Ladd 2008 Ch.5 (declination reset at intonational phrase boundaries)

  # ==========================================================================
  # Microprosodic / Segmental F0 Perturbation (Kept Unchanged)
  #
  # These are NOT intonational — they are segmental effects caused by the
  # aerodynamic/mechanical properties of voiceless/voiced consonants.
  # They are orthogonal to the ToBI intonation model.
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Rule 8: Voiceless onset perturbation (+20% F0)
  # --------------------------------------------------------------------------
  f0_voiceless_onset_perturbation:
    kind: point
    select:
      stream: phone
      where: |-
        current.type == 'vowel' && (prev != null ? (prev.type in ['stop_release', 'stop_aspiration']
            ? (has(prev.voiceless) ? prev.voiceless == true : false)
            : (prev.type == 'fricative'
               ? (has(prev.voiceless) ? prev.voiceless == true : false)
               : false))
           : false)
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: "(prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) * params.policy.f0.voiceless_onset_raise"
      tag: f0_onset_perturbation
    citations:
      - "O'Shaughnessy 1976 (synthesis rule: +20% F0 after voiceless onset)"
      - "cf. Hombert et al. 1979 (empirical: ~8% perturbation)"

  # --------------------------------------------------------------------------
  # Rule 9: Voiced onset perturbation (-5% F0)
  # --------------------------------------------------------------------------
  f0_voiced_onset_perturbation:
    kind: point
    select:
      stream: phone
      where: |-
        current.type == 'vowel' && (prev != null ? (prev.type in ['stop_closure', 'stop_release']
            ? (has(prev.voiced) ? prev.voiced == true : false)
            : false)
           : false)
    define:
      prev_f0: prev_point('f0')
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: "(prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) * params.policy.f0.voiced_onset_lower"
      tag: f0_onset_perturbation
    citations:
      - O'Shaughnessy 1976 (after voiced onset F0 starts ~5% lower, peak delayed)

  # --------------------------------------------------------------------------
  # Rule 10: Continuation rise at clause boundaries
  #
  # Kept from O'Shaughnessy 1976 — applies at intermediate phrase boundaries
  # (commas, semicolons, colons). The ToBI boundary tone rules handle H%
  # at these same positions, but the continuation rise provides a simple
  # additive boost. Both fire on the same SIL token: the boundary tone sets
  # the target level, and the continuation rise nudges it up slightly.
  # --------------------------------------------------------------------------
  f0_continuation_rise:
    kind: point
    select:
      stream: phone
      where: >-
        current.phoneme == 'SIL' && (has(current.punctuationSymbol) ? current.punctuationSymbol in [',', ';', ':'] :
        false)
    define:
      prev_f0: prev_point('f0')
      continuation_rise: >-
        current.punctuationSymbol == ',' ? params.policy.f0.continuation_rise_hz :
        params.policy.f0.continuation_minor_rise_hz
    insert_point:
      stream: f0
      at: at_sync(current.sync_left)
      value: "(prev_f0 == null ? params.policy.f0.base_hz : prev_f0.value) + continuation_rise"
      tag: f0_continuation
    citations:
      - O'Shaughnessy 1976 (continuation rise at non-terminal boundaries)
      - "Engineering estimate: semicolon/colon rise magnitude"
