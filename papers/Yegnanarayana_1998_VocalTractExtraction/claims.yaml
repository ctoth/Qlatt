    page: 0
- id: claim31
  type: equation
  expression: Y(m,n) = \frac{1}{\sqrt{N}} \sum_{k=0}^{N-1} k \cdot w_a(k) x(k - mS)
    e^{-ikn(2\pi/N)}
  provenance:
    paper: Yegnanarayana_1998_VocalTractExtraction
    page: 0
- id: claim32
  type: equation
  expression: \tau(m,n) = \frac{X_R(m,n) Y_R(m,n) + X_I(m,n) Y_I(m,n)}{X_R^2(m,n)
    + X_I^2(m,n)}
  provenance:
    paper: Yegnanarayana_1998_VocalTractExtraction
    page: 0
- id: claim33
  type: equation
  expression: r(n) = \sum_{k=1}^{p} A_k \rho_k^n e^{i\theta_k n} = \sum_{l=1}^{p/2}
