bacon: "0.1"
name: klsyn88-synth
meta:
  primitives: ./registry.yaml
  semantics: ./semantics.yaml
  description: |
    klsyn88 formant synthesizer topology (parwav.c):
    - Oversampled glottal source with integrated noise/tilt
    - Pitch-synchronous F1 modulation
    - Fujisaki compensation on cascade F2/F3
    - Fixed F7/F8 when NFCASC >= 7/8

nodes:
  glottalSource:
    type: oversampled-glottal-source
    params:
      f0: { bind: F0 }
      av: { bind: avDb }
      aturb: { bind: Aturb }
      tilt: { bind: effectiveTiltDb }
      openQuotient: { bind: effectiveKopen }
      skew: { bind: Kskew }
      asymmetry: { bind: as }
      source: { bind: ss }
      seed: { bind: seed }
      flutter: { bind: FL }
      diplophonia: { bind: DI }

  # LF glottal source (Klatt & Klatt 1990 SS=3, "modified LF model", Fant 1985).
  # Rd-driven crate with Klatt OQ/TL overrides; SQ enters via lfRd. Only routed
  # onto the voice path when SS=3 (see voiceSwitch); inert otherwise.
  lfSource:
    type: lf-source
    params:
      f0: { bind: F0 }
      rd: { bind: lfRd }
      oq: { bind: effectiveKopen }
      tl: { bind: effectiveTiltDb }
      lfMode: { bind: lfModeVal }
      flutter: { bind: FL }
      di: { bind: DI }

  # Makeup gain: LF crate output (~1.0 normalized) -> klsyn88 voice scale.
  lfScale:
    type: gain
    params:
      gain: { bind: lfMakeupGain }

  # Source selector: SS=3 -> LF (input1), otherwise oversampled KLGLOTT88 (input0).
  # selector<0.5 copies input0 sample-for-sample (Klatt 1980 SW instantaneous
  # switch), so the default SS=2 path is bit-identical.
  voiceSwitch:
    type: signal-switch
    params:
      selector: { bind: lfSelect }

  voiceGain:
    type: gain
    params:
      gain: { bind: voiceGain }

  parVoiceGain:
    type: gain
    params:
      gain: { bind: parVoiceGain }

  aspGain:
    type: gain
    params:
      gain: { bind: aspGain }

  fricGain:
    type: gain
    params:
      gain: { bind: fricGain }

  cascadeMix:
    type: gain
    params:
      gain: 1.0

  parallelVoiceMix:
    type: gain
    params:
      gain: 1.0

  diff:
    type: differentiator

  parallelSourceSum:
    type: gain
    params:
      gain: 1.0

  nz:
    type: antiresonator
    options:
      bypassAtZero: true
      # klsyn88 uses fixed-point-scale internal signals before final 16-bit
      # normalization; the raw nasal-zero output can legitimately exceed the
      # Klatt80 float-scale debug threshold without clipping final output.
      explosionRmsThreshold: 1000000
    params:
      frequency: { bind: FNZ }
      bandwidth: { bind: BNZ }

  np:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNP }
      bandwidth: { bind: BNP }

  # Tracheal (subglottal) pole-zero pair (Klatt & Klatt 1990, "Analysis,
  # synthesis, and perception of voice quality variations", JASA 87(2), §
  # "New Features" + Table XII). Models acoustic coupling of the open glottis
  # to the subglottal/tracheal system, prominent in breathy voice. Mirrors the
  # nasal RNZ/RNP pair: a zero (antiresonator FTZ/BTZ) then a pole (resonator
  # FTP/BTP), placed after the nasal pole/zero and before F1. With the default
  # coincident placement (FTP=FTZ=2150, BTP=BTZ=180) the pair cancels exactly
  # and is transparent; "enabling" it means separating FTZ from FTP (there is
  # no on/off or amplitude knob in the cascade).
  tz:
    type: antiresonator
    options:
      bypassAtZero: true
      # Same fixed-point-scale rationale as the nasal zero `nz`: the raw
      # tracheal-zero output can exceed the float-scale debug threshold without
      # clipping the final 16-bit-normalized output.
      explosionRmsThreshold: 1000000
    params:
      # frequency = trachealZeroFreq (=0 when coincident with the pole -> the
      # node bypasses to an exact passthrough; = FTZ when separated).
      frequency: { bind: trachealZeroFreq }
      bandwidth: { bind: BTZ }

  tp:
    type: resonator
    options:
      bypassAtZero: true
    params:
      # frequency = trachealPoleFreq (=0 when coincident with the zero -> exact
      # passthrough; = FTP when separated).
      frequency: { bind: trachealPoleFreq }
      bandwidth: { bind: BTP }

  cascadePolarityGain:
    type: gain
    params:
      gain: { bind: cascadePolarity }

  cascadeF8:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: cascadeF8Freq }
      bandwidth: { bind: cascadeF8Bw }

  cascadeF7:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: cascadeF7Freq }
      bandwidth: { bind: cascadeF7Bw }

  cascadeF6:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: cascadeF6Freq }
      bandwidth: { bind: cascadeF6Bw }

  cascadeF5:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: cascadeF5Freq }
      bandwidth: { bind: cascadeF5Bw }

  cascadeF4:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: cascadeF4Freq }
      bandwidth: { bind: cascadeF4Bw }

  cascadeF3:
    type: fujisaki-resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: cascadeF3Freq }
      bandwidth: { bind: cascadeF3Bw }

  cascadeF2:
    type: fujisaki-resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: cascadeF2Freq }
      bandwidth: { bind: cascadeF2Bw }

  cascadeF1:
    type: pitch-sync-mod
    params:
      f0: { bind: F0 }
      openQuotient: { bind: effectiveKopen }
      f1: { bind: F1 }
      b1: { bind: effectiveB1 }
      dF1: { bind: dF1hz }
      dB1: { bind: dB1hz }
      skew: { bind: Kskew }
      source: { bind: psmSource }

  parallelF1:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: F1 }
      bandwidth: { bind: effectiveB1p }

  parallelNasal:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNP }
      bandwidth: { bind: BNP }

  parallelF2:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: F2 }
      bandwidth: { bind: effectiveB2p }

  parallelF3:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: F3 }
      bandwidth: { bind: B3p }

  parallelF4:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: F4 }
      bandwidth: { bind: B4p }

  parallelF5:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: F5 }
      bandwidth: { bind: B5p }

  parallelF6:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: F6 }
      bandwidth: { bind: B6p }

  parallelF1Gain:
    type: gain
    params:
      gain: { bind: a1Gain }

  parallelNasalGain:
    type: gain
    params:
      gain: { bind: anpGain }

  parallelF2Gain:
    type: gain
    params:
      gain: { bind: a2Gain }

  parallelF3Gain:
    type: gain
    params:
      gain: { bind: a3Gain }

  parallelF4Gain:
    type: gain
    params:
      gain: { bind: a4Gain }

  parallelF5Gain:
    type: gain
    params:
      gain: { bind: a5Gain }

  parallelF6Gain:
    type: gain
    params:
      gain: { bind: a6Gain }

  parallelBypassGain:
    type: gain
    params:
      gain: { bind: abGain }

  parallelSum:
    type: gain
    params:
      # No branch-specific scale needed: parallel-to-cascade balance matches
      # Klatt 1980 COEWAV.FOR when both branches share the same output path.
      # The FORTRAN's 170x (line 251) is a global 16-bit DAC scale, not a
      # parallel correction.
      gain: 1.0

  outputSum:
    type: gain
    params:
      gain: 1.0

  gain0Gain:
    type: gain
    params:
      gain: { bind: gain0Linear }

  finalPolarityGain:
    type: gain
    params:
      gain: -1.0

connections:
  # Voice-source selection (SS=3 -> LF, else oversampled KLGLOTT88).
  # glottalSource voice (port 0) -> switch input0; LF (scaled) -> switch input1.
  - [{ node: glottalSource, port: 0 }, { node: voiceSwitch, port: 0 }]
  - [lfSource, lfScale]
  - [lfScale, { node: voiceSwitch, port: 1 }]

  # Selected voice -> cascade and parallel voice gains.
  - [voiceSwitch, voiceGain]
  - [voiceSwitch, parVoiceGain]

  # Glottal source noise output (port 1) -> aspiration + frication (unchanged).
  - [{ node: glottalSource, port: 1 }, aspGain]
  - [{ node: glottalSource, port: 1 }, fricGain]

  # Cascade source mix (voice + aspiration)
  - [voiceGain, cascadeMix]
  - [aspGain, cascadeMix]

  # Parallel voicing mix (par voice + aspiration)
  - [parVoiceGain, parallelVoiceMix]
  - [aspGain, parallelVoiceMix]

  # UGLOT1 = diff(par_glotout)
  - [parallelVoiceMix, diff]

  # Parallel source = UGLOT1 + frication
  - [diff, parallelSourceSum]
  - [fricGain, parallelSourceSum]

  # Cascade chain: NZ -> NP -> TZ -> TP -> polarity -> F8 -> F7 -> F6 -> F5 -> F4 -> F3 -> F2 -> F1
  - [cascadeMix, nz]
  - [nz, np]
  - [np, tz]
  - [tz, tp]
  - [tp, cascadePolarityGain]
  - [cascadePolarityGain, cascadeF8]
  - [cascadeF8, cascadeF7]
  - [cascadeF7, cascadeF6]
  - [cascadeF6, cascadeF5]
  - [cascadeF5, cascadeF4]
  - [cascadeF4, cascadeF3]
  - [cascadeF3, cascadeF2]
  - [cascadeF2, cascadeF1]
  - [cascadeF1, outputSum]

  # Parallel F1 and nasal (input = par_glotout)
  - [parallelVoiceMix, parallelF1]
  - [parallelF1, parallelF1Gain]
  - [parallelF1Gain, outputSum]

  - [parallelVoiceMix, parallelNasal]
  - [parallelNasal, parallelNasalGain]
  - [parallelNasalGain, outputSum]

  # Parallel F2-F6 and bypass (input = UGLOT1 + frication)
  - [parallelSourceSum, parallelF2]
  - [parallelF2, parallelF2Gain]
  - [parallelF2Gain, parallelSum]

  - [parallelSourceSum, parallelF3]
  - [parallelF3, parallelF3Gain]
  - [parallelF3Gain, parallelSum]

  - [parallelSourceSum, parallelF4]
  - [parallelF4, parallelF4Gain]
  - [parallelF4Gain, parallelSum]

  - [parallelSourceSum, parallelF5]
  - [parallelF5, parallelF5Gain]
  - [parallelF5Gain, parallelSum]

  - [parallelSourceSum, parallelF6]
  - [parallelF6, parallelF6Gain]
  - [parallelF6Gain, parallelSum]

  - [parallelSourceSum, parallelBypassGain]
  - [parallelBypassGain, parallelSum]

  # Parallel sum into output
  - [parallelSum, outputSum]

  # Final gain and polarity
  - [outputSum, gain0Gain]
  - [gain0Gain, finalPolarityGain]

outputs:
  - finalPolarityGain
