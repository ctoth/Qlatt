source:
  paper: Zhang_2016_VocalFoldPhysiologyVoiceProduction
claims:
- id: claim_0089
  type: observation
  statement: 'Medial surface thickness is the dominant voice quality controller. T
    < 1 mm produces breathy phonation (incomplete closure, high OQ, high H1-H2). T
    = 1-3 mm produces modal phonation (moderate CQ 0.3-0.5). T > 3 mm produces pressed
    phonation (high CQ > 0.6, low H1-H2).

    '
  concepts:
  - speech_0002
  - speech_0013
  - speech_0012
  provenance:
    paper: Zhang_2016_VocalFoldPhysiologyVoiceProduction
    page: 10
    section: Voice Quality Control via Medial Surface Thickness
- id: claim_0090
  type: parameter
  concept: speech_0009
  value: 2.7
  unit: dimensionless
  conditions:
  - voice_quality_type == 'soft'
  provenance:
    paper: Zhang_2016_VocalFoldPhysiologyVoiceProduction
    page: 13
    table: Table II
- id: claim_0091
  type: parameter
  concept: speech_0009
  value: 0.72
  unit: dimensionless
