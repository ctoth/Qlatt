version: v1
rules:
  remap_stops_to_closures:
    kind: structural
    select:
      stream: phone
      where: current.phoneme in ['P', 'T', 'K', 'B', 'D', 'G']
    define:
      cl_key: current.phoneme + "_CL"
      cl_target: target(cl_key)
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: cl_key
          type: cl_target.type
          duration: cl_target.duration
          inherentDuration: cl_target.inherentDuration
          params: cl_target.params
          voiceless: "has(cl_target.voiceless) ? cl_target.voiceless : null"
          voiced: "has(cl_target.voiced) ? cl_target.voiced : null"
          bilabial: "has(cl_target.bilabial) ? cl_target.bilabial : null"
          alveolar: "has(cl_target.alveolar) ? cl_target.alveolar : null"
          velar: "has(cl_target.velar) ? cl_target.velar : null"
          inventorySW: "has(cl_target.inventorySW) ? cl_target.inventorySW : 0"
    citations:
      - Klatt 1980
  expand_affricates_with_closure:
    kind: structural
    select:
      stream: phone
      where: current.phoneme in ['CH', 'JH']
    define:
      cl_key: current.phoneme + "_CL"
      cl_target: target(cl_key)
      fr_target: target(current.phoneme)
      fr_duration: max([params.policy.duration.affricate_frication_min_ms, current.duration - cl_target.duration])
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: cl_key
          type: cl_target.type
          duration: cl_target.duration
          inherentDuration: cl_target.inherentDuration
          params: cl_target.params
          voiceless: "has(cl_target.voiceless) ? cl_target.voiceless : null"
          voiced: "has(cl_target.voiced) ? cl_target.voiced : null"
          postalveolar: "has(cl_target.postalveolar) ? cl_target.postalveolar : null"
          inventorySW: "has(cl_target.inventorySW) ? cl_target.inventorySW : 0"
        - copy_from: current
          copy_fields:
            - stress
            - word
          phoneme: current.phoneme
          type: fr_target.type
          duration: fr_duration
          inherentDuration: fr_target.inherentDuration
          params: fr_target.params
          voiceless: "has(fr_target.voiceless) ? fr_target.voiceless : null"
          voiced: "has(fr_target.voiced) ? fr_target.voiced : null"
          postalveolar: "has(fr_target.postalveolar) ? fr_target.postalveolar : null"
          inventorySW: "has(fr_target.inventorySW) ? fr_target.inventorySW : 0"
    citations:
      - Klatt 1980
      - Stevens 1998 (affricate stop-gap + frication cue sequence)
  expand_diphthongs:
    kind: structural
    select:
      stream: phone
      where: current.phoneme in ['EY', 'AY', 'OW', 'OY', 'AW']
    define:
      stress_suffix: "has(current.stress) && current.stress == 1 ? \"1\" : \"0\""
      comp1_base: >-
        current.phoneme == "EY" ? "EH" : current.phoneme == "AY" ? "AA" : current.phoneme == "OW" ? "AO" :
        current.phoneme == "OY" ? "AO" : current.phoneme == "AW" ? "AE" : "SIL"
      comp2_base: >-
        current.phoneme == "EY" ? "IH" : current.phoneme == "AY" ? "IH" : current.phoneme == "OW" ? "UH" :
        current.phoneme == "OY" ? "IH" : current.phoneme == "AW" ? "UH" : "SIL"
      comp1_key: comp1_base + stress_suffix
      comp2_key: comp2_base + stress_suffix
      comp1_target: target(comp1_key)
      comp2_target: target(comp2_key)
      total_dur: current.duration
      comp1_duration: total_dur * params.policy.duration.diphthong_nucleus_share
      comp2_duration: total_dur * (1 - params.policy.duration.diphthong_nucleus_share)
    splice:
      type: replace_range
      range_left: current.sync_left
      range_right: current.sync_right
      insert:
        - phoneme: comp1_key
          params: comp1_target.params
          duration: comp1_duration
          inherentDuration: comp1_target.inherentDuration
          type: comp1_target.type
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
        - phoneme: comp2_key
          params: comp2_target.params
          duration: comp2_duration
          inherentDuration: comp2_target.inherentDuration
          type: comp2_target.type
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
    citations:
      - Standard diphthong decomposition for formant synthesis (nucleus + offglide)
  insert_voiceless_stop_release_and_aspiration:
    kind: structural
    select:
      stream: phone
      where: >-
        current.phoneme in ['P_CL', 'T_CL', 'K_CL'] && (next != null ? !(next.type in ['stop', 'stop_closure',
        'stop_release', 'stop_aspiration']) : false)
    define:
      rel: "current.phoneme == \"P_CL\" ? \"P_REL\" : (current.phoneme == \"T_CL\" ? \"T_REL\" : \"K_REL\")"
      asp: "current.phoneme == \"P_CL\" ? \"P_ASP\" : (current.phoneme == \"T_CL\" ? \"T_ASP\" : \"K_ASP\")"
      next_token: next
      weak: "next_token != null ? next_token.phoneme == \"SIL\" : false"
      rel_target: target(rel)
      asp_target: target(asp)
      vot_target: >-
        rel == "P_REL" ? params.policy.duration.vot_target_ms.p : (rel == "T_REL" ?
        params.policy.duration.vot_target_ms.t : params.policy.duration.vot_target_ms.k)
      vot_sum: rel_target.duration + asp_target.duration
      rel_share: "vot_sum > 0 ? rel_target.duration / vot_sum : params.policy.duration.vot_split_fallback_share"
      rel_duration_base: vot_target * rel_share
      asp_duration_base: vot_target - rel_duration_base
      rel_params: >-
        weak ? merge(rel_target.params, {'AF': max([0, rel_target.params.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.params.AH -
        params.policy.duration.weak_release_amplitude_reduction_db])}) : rel_target.params
      asp_params: >-
        weak ? merge(asp_target.params, {'AF': max([0, asp_target.params.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, asp_target.params.AH -
        params.policy.duration.weak_release_amplitude_reduction_db])}) : asp_target.params
      rel_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms, rel_duration_base *
        params.policy.duration.weak_release_scale]) : rel_duration_base
      asp_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms, asp_duration_base *
        params.policy.duration.weak_release_scale]) : asp_duration_base
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - phoneme: rel
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
        - phoneme: asp
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          params: asp_params
          duration: asp_duration
          inherentDuration: asp_target.inherentDuration
          type: asp_target.type
          inventorySW: "has(asp_target.inventorySW) ? asp_target.inventorySW : (has(asp_params.SW) ? asp_params.SW : 0)"
        - copy_from: next_token
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - params
            - duration
            - inherentDuration
            - type
            - punctuationSymbol
    citations:
      - >-
        Lisker & Abramson 1964 (English long-lag VOT isolated /p/=58, /t/=70, /k/=80 ms; sentence-initial /p/=28,
        /t/=39, /k/=43 ms)
      - Stevens 1998
      - Allen et al. 1987
  insert_voiceless_stop_release_and_aspiration_final:
    kind: structural
    select:
      stream: phone
      where: current.phoneme in ['P_CL', 'T_CL', 'K_CL'] && next == null
    define:
      rel: "current.phoneme == \"P_CL\" ? \"P_REL\" : (current.phoneme == \"T_CL\" ? \"T_REL\" : \"K_REL\")"
      asp: "current.phoneme == \"P_CL\" ? \"P_ASP\" : (current.phoneme == \"T_CL\" ? \"T_ASP\" : \"K_ASP\")"
      weak: "true"
      rel_target: target(rel)
      asp_target: target(asp)
      vot_target: >-
        rel == "P_REL" ? params.policy.duration.vot_target_ms.p : (rel == "T_REL" ?
        params.policy.duration.vot_target_ms.t : params.policy.duration.vot_target_ms.k)
      vot_sum: rel_target.duration + asp_target.duration
      rel_share: "vot_sum > 0 ? rel_target.duration / vot_sum : params.policy.duration.vot_split_fallback_share"
      rel_duration_base: vot_target * rel_share
      asp_duration_base: vot_target - rel_duration_base
      rel_params: "merge(rel_target.params, {'AF': max([0, rel_target.params.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.params.AH - params.policy.duration.weak_release_amplitude_reduction_db])})"
      asp_params: "merge(asp_target.params, {'AF': max([0, asp_target.params.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, asp_target.params.AH - params.policy.duration.weak_release_amplitude_reduction_db])})"
      rel_duration: max([params.policy.duration.weak_release_min_ms, rel_duration_base * params.policy.duration.weak_release_scale])
      asp_duration: max([params.policy.duration.weak_release_min_ms, asp_duration_base * params.policy.duration.weak_release_scale])
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: current.sync_right
      insert:
        - phoneme: rel
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
        - phoneme: asp
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          params: asp_params
          duration: asp_duration
          inherentDuration: asp_target.inherentDuration
          type: asp_target.type
          inventorySW: "has(asp_target.inventorySW) ? asp_target.inventorySW : (has(asp_params.SW) ? asp_params.SW : 0)"
    citations:
      - Lisker & Abramson 1964 (utterance-final voiceless stops receive weak release)
      - Stevens 1998
  insert_voiced_stop_release:
    kind: structural
    select:
      stream: phone
      where: >-
        current.phoneme in ['B_CL', 'D_CL', 'G_CL'] && (next != null ? !(next.type in ['stop', 'stop_closure',
        'stop_release', 'stop_aspiration']) : false)
    define:
      rel: "current.phoneme == \"B_CL\" ? \"B_REL\" : (current.phoneme == \"D_CL\" ? \"D_REL\" : \"G_REL\")"
      next_token: next
      weak: "next_token != null ? next_token.phoneme == \"SIL\" : false"
      rel_target: target(rel)
      rel_params: >-
        weak ? merge(rel_target.params, {'AF': max([0, rel_target.params.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.params.AH -
        params.policy.duration.weak_release_amplitude_reduction_db])}) : rel_target.params
      rel_duration: >-
        weak ? max([params.policy.duration.weak_release_min_ms, rel_target.duration *
        params.policy.duration.weak_release_scale]) : rel_target.duration
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: next_token.sync_right
      insert:
        - phoneme: rel
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
        - copy_from: next_token
          copy_fields:
            - phoneme
            - stress
            - word
            - weak
            - params
            - duration
            - inherentDuration
            - type
            - punctuationSymbol
    citations:
      - Lisker & Abramson 1964 (English voiced stop short-lag mode for /b d g/ in initial position)
      - Stevens 1998
      - Allen et al. 1987
  insert_voiced_stop_release_final:
    kind: structural
    select:
      stream: phone
      where: current.phoneme in ['B_CL', 'D_CL', 'G_CL'] && next == null
    define:
      rel: "current.phoneme == \"B_CL\" ? \"B_REL\" : (current.phoneme == \"D_CL\" ? \"D_REL\" : \"G_REL\")"
      weak: "true"
      rel_target: target(rel)
      rel_params: "merge(rel_target.params, {'AF': max([0, rel_target.params.AF - params.policy.duration.weak_release_amplitude_reduction_db]), 'AH': max([0, rel_target.params.AH - params.policy.duration.weak_release_amplitude_reduction_db])})"
      rel_duration: >-
        max([params.policy.duration.weak_release_min_ms, rel_target.duration *
        params.policy.duration.weak_release_scale])
    splice:
      type: replace_range
      range_left: current.sync_right
      range_right: current.sync_right
      insert:
        - phoneme: rel
          stress: "has(current.stress) ? current.stress : null"
          word: "has(current.word) ? current.word : null"
          weak: weak
          params: rel_params
          duration: rel_duration
          inherentDuration: rel_target.inherentDuration
          type: rel_target.type
          inventorySW: "has(rel_target.inventorySW) ? rel_target.inventorySW : (has(rel_params.SW) ? rel_params.SW : 0)"
    citations:
      - Lisker & Abramson 1964 (utterance-final voiced stops receive weak release)
      - Stevens 1998
