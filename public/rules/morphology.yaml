# Citation: Hunnicutt 1976; Allen, Hunnicutt & Klatt 1987 Ch.4-5
# Morphological affix tables for G2P decomposition

suffixes:
  # Ordered longest-first for matching priority
  - affix: "ation"
    pronunciation: [EY1, SH, AH0, N]
    stress_type: forcing
    stress_target: penult
    min_root: 3
  - affix: "tion"
    pronunciation: [SH, AH0, N]
    stress_type: forcing
    stress_target: penult
    min_root: 3
  - affix: "sion"
    pronunciation: [ZH, AH0, N]
    stress_type: forcing
    stress_target: penult
    min_root: 3
  - affix: "ness"
    pronunciation: [N, AH0, S]
    stress_type: non_affecting
    min_root: 3
  - affix: "ment"
    pronunciation: [M, AH0, N, T]
    stress_type: non_affecting
    min_root: 3
  - affix: "able"
    pronunciation: [AH0, B, AH0, L]
    stress_type: non_affecting
    min_root: 3
  - affix: "ible"
    pronunciation: [AH0, B, AH0, L]
    stress_type: non_affecting
    min_root: 3
  - affix: "ful"
    pronunciation: [F, AH0, L]
    stress_type: non_affecting
    min_root: 3
  - affix: "less"
    pronunciation: [L, AH0, S]
    stress_type: non_affecting
    min_root: 3
  - affix: "ing"
    pronunciation: [IH0, NG]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - affix: "er"
    pronunciation: [ER0]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - affix: "est"
    pronunciation: [AH0, S, T]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - affix: "ed"
    pronunciation: contextual  # depends on final consonant voicing
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - affix: "ly"
    pronunciation: [L, IY0]
    stress_type: non_affecting
    min_root: 3
  - affix: "es"
    pronunciation: [IH0, Z]
    stress_type: non_affecting
    min_root: 3
  - affix: "s"
    pronunciation: contextual  # Z after voiced, S after voiceless
    stress_type: non_affecting
    min_root: 3

prefixes:
  - affix: "un"
    pronunciation: [AH0, N]
    min_remainder: 3
  - affix: "re"
    pronunciation: [R, IY0]
    min_remainder: 3
  - affix: "dis"
    pronunciation: [D, IH0, S]
    min_remainder: 3
  - affix: "mis"
    pronunciation: [M, IH0, S]
    min_remainder: 3
  - affix: "pre"
    pronunciation: [P, R, IY0]
    min_remainder: 3
  - affix: "over"
    pronunciation: [OW1, V, ER0]
    min_remainder: 3
  - affix: "out"
    pronunciation: [AW1, T]
    min_remainder: 3

ed_pronunciation:
  voiceless_finals: [CH, F, K, P, S, SH, TH]  # -> T
  after_t_or_d: true  # -> IH0 D
  # everything else -> D
