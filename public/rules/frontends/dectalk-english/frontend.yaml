  lowering:
    id: dectalk-english-track-lowering
    # Stable Klatt backend vocabulary captured by the production-frame oracle.
    columns: [F1, F2, F3, F4, B4, F5, B5, F6, B6, B1, B2, B3, AV, AF, AH, AVS, F0, sourceMode, lfMode, breathiness, Rd, RdRef, OQ, TL, flutter, jitter, EePhraseDb, RdPhraseOffset, FNZ, FNP, BNP, BNZ, AN, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, AB, SW, FGP, BGP, FGZ, BGZ, BGS, NFC, GO]
    timeline:
      initial_silence_ms:
        value: 19.2
        citations:
          - "DECtalk 4.63 -lt oracle trace: clause-initial GEN_SIL before voiced obstruent spans 3 synthesis frames at 6.4ms"
      final_silence_ms:
        value: 0
        citations:
          - "DECtalk 4.63 p_us_tim.c: terminal punctuation silence is emitted as GEN_SIL duration"
      duration_floors:
        stop_release_ms:
          value: 7
          citations:
            - "DECtalk 4.63 ph_defs.h: NF7MS = 1 synthesis frame; frtoms(1) is approximately 7ms at NSAMP_FRAME=71"
        default_ms:
          value: 30
          citations:
            - "DECtalk 4.63 ph_defs.h: NF30MS = 5 synthesis frames; named 30ms floor preserves legacy frontend default"
      event_points:
        include_segment_start: true
        include_control_boundaries: true
        include_f0_anchors: true
        include_transition_steady_time: true
    transitions:
      default_transition_ms:
        value: 30
        citations:
          - "DECtalk 4.63 p_us_st1.c: default durtran assignments commonly use NF30MS; ph_defs.h defines NF30MS = 5 synthesis frames"
      blend:
        factor:
          value: 0.5
          citations:
            - "Engineering estimate: preserves legacy DECtalk frontend 50% formant-transition blend"
        keys: [F1, F2, F3, B1, B2, B3]
        smooth_types: [vowel, nasal, liquid, glide]
        # DECtalk smooths every parameter at every boundary (p_us_st1.c
        # us_forw/back_smooth_rules; default 50% midpoint, ph_setar.c:784-785,
        # 903-904). Enable the universal midpoint fallback so obstruent-adjacent
        # and no-locus boundaries — and B1-B3 at obstruent boundaries — get a
        # transition instead of stepping abruptly. Only F1-F3/B1-B3 move; burst
        # amplitudes (AF/AH/PLSTEP) ride control windows and stay crisp. The
        # ~25 obstruents with locus data still use their locus (more specific);
        # this only fills the gaps. qlatt-english omits this flag -> unchanged.
        smooth_all_boundaries: true
      sonorant_f2:
        key: F2
        span_ms:
          value: 45
          citations:
            - "DECtalk 4.63 p_us_st1.c:442-455,837-849 (sonorant-edge F2 smoothing uses NF45MS)"
        neighbor_weight:
          value: 0.75
          citations:
            - "DECtalk 4.63 p_us_st1.c:442-455,837-849 (sonorant-edge F2 boundary uses a 75/25 neighbor weighting)"
        current_type: vowel
        neighbor_types: [nasal, liquid, glide]
        forward: true
        backward: true
      locus_glue_types: [stop_release, stop_aspiration]
      # Obstruent->sonorant formant LOCUS tables (DATA), extracted from
      # DECtalk 4.63 PH/p_us_rom.h us_maleloc[] (Paul / male voice) via the
      # dectalk repo scripts/extract_loci.py, reshaped by
      # scripts/gen-dectalk-loci-yaml.mjs. setloc indexing:
