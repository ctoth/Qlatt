streams:
  phone:
    type: base
    features:
      type: [vowel, stop_closure, stop_release, stop_aspiration, fricative, affricate, silence, liquid, nasal, glide, flap]
    scalars:
      # DECtalk ph_defs.h defines NF640MS=100 frames; terminal nfperiod=94
      # frames must survive scalar validation for punctuation pauses.
      duration: { unit: ms, resolution: klatt, max: 640, floor_field: minimumDuration }
  f0:
    type: point
    value_type: number
    unit: Hz
  f0_layer:
    type: point
    value_type: number
    unit: Hz
phases:
  - name: duration
    rules:
      - dectalk_single_word_fallback_primary_retarget
      - dectalk_pause_duration
      - dectalk_clause_final_lengthening
      # Rule 7 durmin adjustment must precede duration multipliers because the
      # Qlatt scalar resolver captures minimumDuration as the duration floor.
      - dectalk_unstressed_nonobstruent_floor_adjustment
      - dectalk_non_final_shortening
      # Rule 4 splits into a monosyllable stress branch and a polysyllable
      # non-word-final branch (DECtalk p_us_tim.c:355-373 vs :374-394), keyed on
      # the real syllable_position_in_word() annotation; Rule 5 follows.
      - dectalk_monosyllable_stress_shortening
      - dectalk_polysyllable_nonfinal_shortening
      - dectalk_polysyllabic_shortening
      - dectalk_non_initial_consonant_shortening
      - dectalk_unstressed_shortening
      - dectalk_emphasis_lengthening
      - dectalk_postvocalic_voiceless_shortening
      - dectalk_postvocalic_voiced_lengthening
      # Rule 9 [nt] cluster nasal shortening (p_us_tim.c:628-639).
      - dectalk_nt_cluster_nasal_shortening
      - dectalk_consonant_cluster_shortening
      - dectalk_phrase_initial_vowel_lengthening
      # Added numbered rules 10/11/19/20/23/24 (p_us_tim.c:647-889), in source
      # order, keyed on syllable annotations and flap/NG allophones.
      - dectalk_two_vowel_first_lengthening
      - dectalk_word_initial_stressed_vowel_lengthening
      - dectalk_function_word_final_th_shortening
      - dectalk_the_iy_prevocalic_lengthening
      - dectalk_pre_df_flap_shortening
      - dectalk_pre_ng_shortening
      - dectalk_short_phrase_duration_bonus
      - dectalk_rate_scaling
    resolve_scalars: [duration]
  - name: postlexical
    # Order encodes DECtalk ph_aloph.c source precedence (each /t,d/ rule has goto
    # endrul3, so the rewrites are mutually exclusive per /t,d/): palatalization
    # (L878) wins over glottalization (L912) wins over flapping (L958).  The
    # dental /dh/ -> DZ rule (L1066) runs LAST because it reads the preceding
    # token's already-rewritten phoneme (last_outph) as its trigger.
    #
    # The /R/ rules (rhotic) operate on a different segment class than the /t,d/
    # rules, so they do not conflict with them.  Within the /R/ rules, fusion
    # (A13, L835-872) runs BEFORE prevocalic R->RR (A5, L636-648): in the source
    # A5 sets RR but A13 re-reads the input /R/ and, for an inter-vocalic /R/,
    # deletes it and fuses into the preceding vowel (fusion wins).  Running fusion
    # first reproduces this -- once fusion deletes the /R/, A5 has nothing to
    # match, leaving A5 to catch only the residual prevocalic (e.g. word-initial)
    # /R/ before a syllabic.
    #
    # The three minor rewrites added in chunk dt-9 slot in at their source
    # positions:
    #   - dectalk_geminate_delete (A1, ph_aloph.c:558) runs FIRST -- in the source
    #     it executes before the FBLOCK skip and every other allophone rule.
    #   - dectalk_assimilate_sibilant_sh (A4, L715) keys on /s,z/, a segment class
    #     disjoint from the /t,d/ and /R/ rules, so its position is non-conflicting;
    #     it is placed right after geminate to mirror its early source position
    #     (L715, ahead of glottalization at L912).
    #   - dectalk_syllabic_n_after_tx (A19/Rule 3a, L1042) reads the PRIOR token's
    #     already-rewritten output (== TX from glottalization), so it MUST follow
    #     glottalization and flapping; it sits just before the dental /dh/ rule
    #     (L1066), which stays LAST because it likewise reads last_outph.
    rules:
      - dectalk_reduce_article_a
      - dectalk_geminate_delete
      - dectalk_assimilate_sibilant_sh
      - dectalk_palatalize_t
      - dectalk_palatalize_d
      - dectalk_glottalize_t
      - dectalk_flap_t
      - dectalk_flap_d
      - dectalk_fuse_vowel_r
      - dectalk_prevocalic_r_rr
      - dectalk_syllabic_n_after_tx
      - dectalk_dental_dh
  - name: structural
    rules:
      - dectalk_apply_diphthong_trajectories
      - dectalk_insert_voiceless_stop_release_and_aspiration
      - dectalk_insert_voiceless_stop_release_and_aspiration_final
      - dectalk_insert_voiced_stop_release
      - dectalk_insert_voiced_stop_release_final
      - dectalk_weaken_interdental_frication
      - dectalk_add_voiced_fricative_soft_voicing_onset
      - dectalk_add_voiceless_fricative_breathy_onset
      - dectalk_add_vowel_breathy_offset
  # Syllable-structure annotation.  tts-frontend.ts runs the `annotation` phase
  # after structural and before duration, so syllable fields are available to
  # later duration rules.  ANNOTATION ONLY -- nothing reads these fields yet.
  - name: annotation
    rules:
      - syllable_index_annotation
      - syllable_role_annotation
      - syllable_position_annotation
      - dectalk_single_word_fallback_primary_stress
      - dectalk_onset_y_stress
  - name: formant
    rules:
      - dectalk_sw_explicit_override
      - dectalk_sw_default_assignment
      - dectalk_obstruent_parallel_amplitudes
      - dectalk_special_coartic_f3
      - dectalk_special_coartic_f2
      - dectalk_silence_carries_formants
  - name: prosody
    rules:
      - dectalk_short_declarative_baseline_declination
      - dectalk_baseline_declination
      - dectalk_hat_rise
      - dectalk_hat_fall
      - dectalk_question_dip
      - dectalk_question_rise
      - dectalk_comma_rise1
      - dectalk_comma_rise2
      - dectalk_stress_impulse
      - dectalk_boundary_reset
      - dectalk_connected_speech_source_contour
  - name: finalize
    after: [duration, structural, formant, prosody]
    rules: []
    compute_times: true
    resolve_points: [f0, f0_layer]
