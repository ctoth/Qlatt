version: v1
# Syllable-structure annotation (DECtalk 4.63 ph_syl.c maximal-onset + affix).
#
# These rules write per-token syllable metadata (syllable_index, syllable_role,
# syllable_position_in_word) using the generic data-driven `syllabify` builtins.
# The linguistic DATA (onset clusters, nuclei, affixes, ARPABET->ascky map) lives
# in the pipeline-level `syllabification:` block, extracted from p_us_sy1.c by
# scripts/dt10-extract-syllable-tables.ts.  The builtins run the maximal-onset +
# affix-stripping algorithm over each word once (memoized) and return this
# token's field.  ANNOTATION ONLY -- nothing in the render path reads these
# fields yet, so output is byte-identical.
#
# Selection excludes SIL/silence and word-less tokens (the builtins return null
# for them anyway; the guard avoids writing null fields).
rules:
  syllable_index_annotation:
    kind: scalar
    select:
      relation: phone
      where: "current.phoneme != 'SIL' && has(current.word) && current.word != ''"
    apply:
      - field: syllable_index
        op: set
        value: "syllable_index()"
        tag: syllabification
    citations:
      - DECtalk 4.63 ph_syl.c ph_syllab (backward maximal-onset syllabification)
      - DECtalk 4.63 p_us_sy1.c us_syl_cons/us_syl_vowels (onset-cluster + nucleus tables)

  syllable_role_annotation:
    kind: scalar
    select:
      relation: phone
      where: "current.phoneme != 'SIL' && has(current.word) && current.word != ''"
    apply:
      - field: syllable_role
        op: set
        value: "syllable_role()"
        tag: syllabification
    citations:
      - DECtalk 4.63 ph_syl.c ph_syllab (onset/nucleus/coda assignment via SBOUND placement)
      - DECtalk 4.63 p_us_sy1.c us_syl_vowels (nucleus membership)

  syllable_position_annotation:
    kind: scalar
    select:
      relation: phone
      where: "current.phoneme != 'SIL' && has(current.word) && current.word != ''"
    apply:
      - field: syllable_position_in_word
        op: set
        value: "syllable_position_in_word()"
        tag: syllabification
    citations:
      - DECtalk 4.63 ph_syl.c ph_syllab (word-position from syllable index + count)

  dectalk_single_word_fallback_primary_stress:
    kind: scalar
    select:
      relation: phone
      where: "current.type == 'vowel' && word_count() == 1"
    define:
      prev_primary_or_boundary: >-
        look_back_where(current, 100,
          '(candidate.type == "vowel" && has(candidate.stress) && candidate.stress == 1) || candidate.phoneme == "SIL"')
      next_primary_or_boundary: "look_ahead_pred(current, 100, 'is_stressed_vowel_or_boundary')"
      prior_vowel_in_word: >-
        find_within_word(current,
          "current.type == 'vowel'",
          "behind")
      no_primary_in_clause: >-
        (prev_primary_or_boundary == null || prev_primary_or_boundary.phoneme == 'SIL')
        && (next_primary_or_boundary == null || next_primary_or_boundary.phoneme == 'SIL')
    constraint: "no_primary_in_clause && prior_vowel_in_word == null"
    apply:
      - field: stress
        op: set
        value: 1
        tag: fallback_primary_stress
    citations:
      - "DECtalk 4.63 ph_sort2.c find_syll_to_stress (no primary stress: stress first vowel of last word)"

  dectalk_onset_y_stress:
    kind: scalar
    select:
      relation: phone
      where: >-
        current.phoneme == 'Y'
        && has(current.word) && current.word != ''
        && has(current.syllable_role) && current.syllable_role == 'onset'
        && has(current.syllable_index)
    define:
      stressed_nucleus: >-
        find_within_word(current,
          "current.type == 'vowel' && has(current.stress) && current.stress != 0 && has(current.syllable_index) && current.syllable_index == source.syllable_index",
          "both")
    constraint: "stressed_nucleus != null"
    apply:
      - field: stress
        op: set
        value: stressed_nucleus.stress
        tag: consonant_stress
    citations:
      - "DECtalk 4.63 p_us_sr1.c:73-162 get_stress_of_conson (stress legal consonant cluster before stressed vowel)"
      - "DECtalk 4.63 p_us_sr1.c:179-228 us_phcluster (legal pre-vocalic onset clusters)"
