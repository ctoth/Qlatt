tags:
  boundary: adjusts a segment at a prosodic boundary
  clause_final: lengthens a phrase-final segment
  cluster: adjusts a consonant in a cluster
  coarticulation: blends neighboring articulatory targets
  consonant_position: adjusts duration by consonant position
  consonant_stress: adjusts a consonant beside a stressed vowel
  word_initial_consonant: marks a consonant before its word's first syllabic
  rime_boundary: records the type of the boundary that follows a final rime
  hat_pattern: marks where the pitch rises onto the hat pattern and falls off it
  postvocalic_lateral: selects the postvocalic allophone of a lateral
  duration_floor: enforces a segment-duration floor
  emphasis: strengthens an emphasized segment
  emphasis_syllabic: strengthens the syllabic portion of an emphasized word
  fallback_primary_stress: assigns primary stress when none is present
  fricative_spectrum: shapes a fricative-noise spectrum
  function_word_th: reduces the function-word pronunciation of th
  medial_syllable: adjusts a word-medial syllable
  nasal_bandwidth: widens formant bandwidth beside a nasal
  non_final: shortens a non-final segment
  nt_cluster: adjusts an alveolar stop in an nt cluster
  orthography: maps written tokens to pronunciation keys
  phrase_initial: adjusts a phrase-initial segment
  polysyllabic: adjusts duration in a polysyllabic word
  post_plosive: adjusts a segment following a plosive
  pre_df_flap: adjusts a vowel before an eligible flap
  pre_ng: adjusts a vowel before a velar nasal
  pre_voiced: adjusts a segment before a voiced consonant
  pre_voiceless: adjusts a segment before a voiceless consonant
  rate: scales timing for speaking rate
  segmental_context: adjusts a target from its neighboring segments
  short_phrase: adjusts a segment in a short phrase
  silence_boundary: shapes source parameters at silence
  source_contour: shapes phrase-level source parameters
  source_routing: selects the voiced or noise source route
  stress: adjusts a stressed or unstressed segment
  syllabification: records syllable structure for downstream rules
  the_iy: selects the full-vowel pronunciation of the
  two_vowel: adjusts a word containing two vowels
  unstressed: reduces an unstressed segment
  unstressed_floor: enforces the duration floor of an unstressed segment
  word_final_obstruent: adjusts a word-final obstruent
  word_initial_stressed: adjusts a stressed word-initial segment
  timing_setup: starts an allophone's duration state from its inherent values
  schwa_by_flap: lengthens a reduced vowel beside a flap or h
  hat_fall: lengthens a stressed vowel where the pitch falls off the hat pattern
  adjacent_nasals: lengthens a nasal after a different nasal
  retroflex_minimum: keeps a retroflex vowel above its minimum length
  allophone_duration: sets a segment's duration from its allophone's frame count
relations:
  Segment:
    type: base
    features:
      # The frames phases/articulation.yaml computes for this Segment.
      articulation_frames: []
      # The frames phases/formant-drawing.yaml computes for this Segment.
      formant_frames: []
      A1: []
      A2: []
      A3: []
      A4: []
      A5: []
      A6: []
      A7: []
      A8: []
      A9: []
      A10: []
      AB: []
      AV: []
      B1: []
      B2: []
      B3: []
      EePhraseDb: []
      effort: []
      F1: []
      F2: []
      F3: []
      RdPhraseOffset: []
      SW: []
      TL: []
      breakIndex: []
      control_windows: []
      inherentDuration: []
      minimumDuration: []
      stress: []
      syllable_index: []
      syllable_position_in_word: []
      # FTYPESYL of a syllabic (ph_sort2.c init_med_final).
      syllable_type: { kind: string, values: [only, first, medial, final] }
      syllable_role: []
      alveolar: []
      bilabial: []
      boundary: []
      dac: []
      fricative_min_ms: []
      inventorySW: []
      next_boundary: []
      phoneme: []
      postalveolar: []
      punctuationSymbol: []
      syllable: []
      velar: []
      voiced: []
      voiceless: []
      weak: []
      word: []
      # On a clause's final silence: how many of its words DECtalk counts as
      # verbs, how many of those are function words, and how many reach the
      # verb branch of its phone sort (ph_task.c:611-626, ph_sort.c:1272-1284).
      clause_verb_count: { kind: number }
      clause_function_verb_count: { kind: number }
      clause_verb_branch_count: { kind: number }
      # A vowel the helper-verb promotion gave secondary stress.
      helper_verb_promoted: { kind: boolean }
      # The last phone before a word that keeps a phrase start (ph_sort.c:1487-1496).
      phrase_start_follows: { kind: boolean }
      # An obstruent whose identical neighbour before it was deleted
      # (ph_aloph.c:558-562); DECtalk's "two phones back" still counts that one.
      after_deleted_geminate: { kind: boolean }
      # A [d] that the duration routine made from the /t/ of [nt] (p_us_tim.c:627-638).
      voiced_from_t: { kind: boolean }
      word_initial_consonant: { kind: boolean }
      # The phone before a morpheme boundary inside its word (MBOUND, e.g.
      # "nine|teen" in DECtalk's number lists).
      morpheme_boundary_after: { kind: boolean }
      # A punctuation silence whose mark a text rule sent itself: no routine
      # read it as a word's delimiter (an initial's two periods,
      # LTS/ls_task.c:2612-2617).
      punctuation_sent: { kind: boolean }
      # A duration the duration dictionary gives the phone (ph_sort.c:192-215),
      # in ms; the duration rules are not applied to it.
      dictionary_duration_ms: { kind: number }
      # A silence phonemic text wrote among a word's phones ("[m'uw_n]"): one
      # of DECtalk's allophones, and no clause boundary (ph_sort.c:1331-1333
      # makes every symbol below MAX_PHONES a phone, silence included).
      written_silence: { kind: boolean }
      # A duration written on the phone in phonemic text ("[uw<400>]",
      # CMD/cm_phon.c:225-330, PH/ph_task.c:835-852), in ms; the duration
      # rules are not applied to it either.
      written_duration_ms: { kind: number }
      # The vowel has absorbed the /r/ after it (ph_aloph.c:835-872); it was
      # two phones when DECtalk's rules looked ahead at it.
      fused_with_r: { kind: boolean }
      # FBLOCK: the dictionary marks the phone (`~` before it) and DECtalk skips
      # every allophone rule in that phone's turn, and the hat pattern
      # (ph_sort.c:1611-1612, ph_aloph.c:563-567). The geminate deletion comes
      # before the skip and still applies.
      rules_blocked: { kind: boolean }
      # 'pp' is a prepositional-phrase start with no word boundary before it
      # (FPPNEXT alone); after a word boundary the two are the comma value.
      rime_boundary: { kind: string, values: [morpheme, word, pp, vp, comma, period, question, exclaim] }
      # FHAT_BEGINS and FHAT_ENDS of a syllabic, and the state DECtalk's walk
      # leaves after it (ph_aloph.c:1396-1525).
      hat_begins: { kind: boolean }
      hat_ends: { kind: boolean }
      hat_top: { kind: boolean }
      hat_locked: { kind: boolean }
      hat_stresses: { kind: number }
      hat_delay: { kind: number }
      # For the hat pattern's counts of what lies ahead: the clause's total
      # and the count up to and including this Segment (annotation.yaml,
      # dectalk_clause_phone_counts).
      input_phones_total: { kind: number }
      input_phones_through: { kind: number }
      syllabics_total: { kind: number }
      syllabics_through: { kind: number }
      # The walk called promote_last_2 at this syllabic (ph_aloph.c:1470-1474).
      hat_promotes: { kind: boolean }
      # promote_last_2's scans open after this syllabic, and the promotions
      # in its stretch so far (annotation.yaml, dectalk_hat_pattern).
      promotion_scans: { kind: number }
      promotion_taken: { kind: number }
      # The syllabic at which DECtalk's intonation routine leaves its loop
      # (Ph_inton2.c:809-819).
      intonation_stops: { kind: boolean }
      # On a clause's first phone: DECtalk's number_words for the clause
      # (prosody.yaml, dectalk_clause_number_words).
      number_words: { kind: number }
      # On every phone: its place in its clause from 1, whether phinton's walk
      # reaches it, and the stressed syllabics of the clause before it
      # (prosody.yaml, dectalk_clause_running_state).
      intonation_position: { kind: number }
      intonation_reached: { kind: boolean }
      stressed_before: { kind: number }
      # State of DECtalk's duration routine for one allophone (p_us_tim.c), in
      # its own units: frames, and a percentage where 128 is 100%.
      clause_position: { kind: number }
      clause_length: { kind: number }
      # On every phone, for the flapping rules: the clause's words that came
      # in with a word boundary (postlexical.yaml, dectalk_clause_counted_words).
      clause_counted_words: { kind: number }
      timing_inherent_frames: { kind: number }
      timing_minimum_frames: { kind: number }
      timing_percent: { kind: number }
      timing_added_frames: { kind: number }
      timing_factor: { kind: number }
      timing_fixed_frames: { kind: number }
      timing_frames: { kind: number }
      # On the utterance's first Segment: the opening pause as the synthesizer
      # hears it (p_us_tim.c:229-232 less ph_claus.c:759-766). Lowering reads
      # it through output.lowering.timeline.initial_silence_key.
      utterance_initial_silence_ms: { kind: number }
      AF: []
      AH: []
      AN: []
      AVS: []
      B4: []
      B5: []
      B6: []
      BGP: []
      BGS: []
      BGZ: []
      BNP: []
      BNZ: []
      breathiness: []
      dummy_vowel: []
      # Which schwa DECtalk's Rule 9 releases the plosive into (Ph_inton2.c:1701-1706).
      dummy_phone: { kind: string, values: [IX, AX] }
      F0: []
      F4: []
      F5: []
      F6: []
      FGP: []
      FGZ: []
      flutter: []
      FNP: []
      FNZ: []
      GO: []
      is_stop_base: []
      jitter: []
      lfMode: []
      low: []
      NFC: []
      OQ: []
      Rd: []
      RdRef: []
      sourceMode: []
      trajectory: []
      type: [vowel, stop_closure, stop_release, stop_aspiration, fricative, affricate, silence, liquid, nasal, glide, flap]
    scalars:
      # A duration is a whole number of DECtalk frames times the frame period,
      # set once per allophone by dectalk_allophone_duration; nothing rounds or
      # floors it afterwards. The longest is a sentence pause with the next
      # clause's opening pause at the slowest rate: sprat0 75 gives sprat1
      # 30720 (ph_timng.c:262-288), so mlsh1(94, 30720) + mlsh1(5, 30720) =
      # 176 + 9 = 185 frames of 6.4 ms.
      duration: { unit: ms, max: 1184 }
  # Word over Syllable over Segment. A Segment's Word carries what the lexicon
  # says of the word: form_classes and phrase_start.
  SylStructure:
    type: span
  Word:
    type: parallel
    features:
      text: []
      form_classes: []
      # The classes as DECtalk's text stage has them (form_classes are what
      # its phonetic stage receives), and the word's place among the words up
      # to the next punctuation mark.
      text_form_classes: []
      clause_word_index: []
      clause_word_count: []
      # The word's place among the stretch's words as they are spoken; 0 for
      # a word the routine before it read ahead.
      clause_spoken_index: []
      # The stretch ends at the text's end with no mark written, and the
      # word's part in a conjunction of several words (LTS/proverbs.h).
      clause_end_supplied: [true, false]
      conjunction_sequence: [first, rest]
      # The quotation marks and parentheses the written word still has when
      # letter-to-sound parses it (frontend.yaml written_word_marks).
      written_marks: []
      # LTS/ls_task.c:5129-5229: a word that may carry a clause break, one
      # whose slot in the parse has a break, and one a break is spoken before.
      break_marker: [true, false]
      break_slot: [true, false]
      clause_break_before: [true, false]
      phrase_start: [vp, pp]
      # The word before is phonemic text, which has no word boundary after it.
      phrase_start_unbounded: [true, false]
      # What the phone sort makes of a prepositional-phrase start: kept or
      # dropped (ph_sort.c:1055-1070), or kept with no word boundary before
      # it ('alone').
      phrase_start_state: [pp, word, alone]
  F0Point:
    type: point
    value_type: number
    unit: Hz
  PhraseCommand:
    type: point
    value_type: number
    unit: Hz
  Tilt:
    type: point
    value_type: number
    unit: Hz
  Token:
    type: parallel
    features:
      pronunciationKey: []
      word: []
      tokenType:
        - word
        - punctuation
phases:
  # Runs on the written tokens, before pronunciation (phases/orthography.yaml).
  - name: orthography
    rules:
      - dectalk_spelled_letter
  - name: duration
    rules:
      # p_us_tim.c, one rule per branch, in source order. Every rule reads and
      # writes the allophone's timing_* state; only the last two write duration.
      - dectalk_pause_duration
      - dectalk_written_silence_duration
      - dectalk_utterance_initial_pause
      - dectalk_timing_setup
      - dectalk_timing_dictionary_duration
      - dectalk_timing_2_clause_final_rime
      - dectalk_timing_3_non_phrase_final_syllabic
      - dectalk_timing_3_adjacent_nasals
      - dectalk_timing_4_monosyllable_stress
      - dectalk_timing_4_polysyllable_non_word_final
      - dectalk_timing_5_polysyllable
      - dectalk_timing_6_word_final_fricative
      - dectalk_timing_6_non_word_initial_consonant
      - dectalk_timing_7_unstressed_minimum
      - dectalk_timing_7_unstressed_syllabic
      - dectalk_timing_7_schwa_by_flap
      - dectalk_timing_7_unstressed_consonant
      - dectalk_timing_7_hat_fall
      - dectalk_timing_8_emphasis
      - dectalk_timing_9_postvocalic_context
      - dectalk_timing_10_syllabic_before_syllabic
      - dectalk_timing_11_first_syllable_primary
      - dectalk_timing_12_syllabic_before_lx
      - dectalk_timing_13_cluster_first
      - dectalk_timing_13_before_sh
      - dectalk_timing_13_cluster_second
      - dectalk_timing_14_sonorant_after_voiceless_plosive
      - dectalk_timing_15_vowel_after_silence
      - dectalk_timing_16_vowel_after_glide
      - dectalk_timing_17_short_clause
      - dectalk_timing_18_glide_after_obstruent
      - dectalk_timing_19_unstressed_final_th
      - dectalk_timing_20_unstressed_final_iy
      - dectalk_timing_21_plosive_between_obstruents
      - dectalk_timing_23_before_df
      - dectalk_timing_23_retroflex_minimum
      - dectalk_timing_24_before_velar_nasal
      - dectalk_timing_frames
      - dectalk_allophone_duration
      - dectalk_stop_closure_duration
      - dectalk_stop_release_duration
    resolve_scalars: [duration]
  - name: postlexical
    # Order encodes DECtalk ph_aloph.c source precedence (each /t,d/ rule has goto
    # endrul3, so the rewrites are mutually exclusive per /t,d/): palatalization
    # (L878) wins over glottalization (L912) wins over flapping (L958).  The
    # dental /dh/ -> DZ rule (L1066) runs LAST because it reads the preceding
    # token's already-rewritten phoneme (last_outph) as its trigger.
    #
    # The /R/ rules (rhotic) operate on a different segment class than the /t,d/
    # rules, so they do not conflict with them.  The /R/ rule is the fusion of
    # a vowel with a following unstressed /r/ (A13, L835-872).  The R->RR rule
    # at L636-648 is for the German /r/ and has no US counterpart.
    #
    # The three minor rewrites added in chunk dt-9 slot in at their source
    # positions:
    #   - dectalk_geminate_delete (A1, ph_aloph.c:558) runs FIRST -- in the source
    #     it executes before the FBLOCK skip and every other allophone rule.
    #   - dectalk_assimilate_sibilant_sh (A4, L715) keys on /s,z/, a segment class
    #     disjoint from the /t,d/ and /R/ rules, so its position is non-conflicting;
    #     it is placed right after geminate to mirror its early source position
    #     (L715, ahead of glottalization at L912).
    #   - dectalk_syllabic_n_after_tx (A19/Rule 3a, L1042) reads the PRIOR token's
    #     already-rewritten output (== TX from glottalization), so it MUST follow
    #     glottalization and flapping; it sits just before the dental /dh/ rule
    #     (L1066), which stays LAST because it likewise reads last_outph.
    rules:
      # A wh-question's "?" becomes "." before anything reads the punctuation.
      - dectalk_wh_question_period
      - dectalk_sentence_initial_auxiliary
      - dectalk_sentence_initial_had
      # The text stage's clause breaks: a comma the phonetic stage then reads
      # like a written one.
      - dectalk_break_marker
      - dectalk_clause_break
      - dectalk_clause_break_place
      - dectalk_clause_break_comma
      # ph_sort.c:1313-1329: looked up on the symbols as they come in, before
      # any rule below changes a phone or its stress.
      - dectalk_duration_dictionary
      # ph_sort.c:1055-1110, ahead of the stress rules: a dropped
      # prepositional-phrase start gives its word primary stress.
      - dectalk_pp_start_state
      - dectalk_pp_dropped_stress
      - dectalk_pp_dropped_unreduce
      - dectalk_phrase_start_follows
      # ph_sort.c structure-word fields that the allophone rules below read.
      - dectalk_breath_group_primary_stress
      - dectalk_exclamation_emphasis
      # After both: DECtalk's promotion adds to whatever stress the vowel has.
      - dectalk_clause_verb_summary
      - dectalk_helper_verb_promotion
      - dectalk_word_initial_consonant
      - dectalk_consonant_stress
      # Rule 1a reads the input /dh/, before the dental rule at the end
      # rewrites it.
      - dectalk_the_before_vowel
      # Rule 1c counts the clause's phones as they come in, before a rule
      # below deletes one.
      - dectalk_clause_initial_and
      - dectalk_at_reduced
      - dectalk_cited_lone_schwa
      - dectalk_geminate_delete
      - dectalk_assimilate_sibilant_sh
      - dectalk_palatalize_t
      - dectalk_palatalize_d
      - dectalk_glottalize_t
      - dectalk_to_before_vowel
      - dectalk_clause_counted_words
      - dectalk_flap_t
      - dectalk_flap_d
      - dectalk_fuse_vowel_r
      - dectalk_postvocalic_liquid
      - dectalk_syllabic_n_after_tx
      - dectalk_dental_dh
      # From the duration routine, so after every allophone rule.
      - dectalk_nt_voicing
  - name: structural
    rules:
      - dectalk_insert_voiceless_stop_release_into_silence
      - dectalk_insert_voiceless_stop_release_and_aspiration
      - dectalk_insert_voiced_stop_dummy_vowel
      - dectalk_insert_voiced_stop_release
      - dectalk_insert_voiced_stop_release_final
      - dectalk_weaken_interdental_frication
      - dectalk_add_voiced_fricative_soft_voicing_onset
      - dectalk_add_voiceless_fricative_breathy_onset
      - dectalk_add_vowel_breathy_offset
  # Syllable-structure annotation.  tts-frontend.ts runs the `annotation` phase
  # after structural and before duration, so syllable fields are available to
  # later duration rules.  ANNOTATION ONLY -- nothing reads these fields yet.
  - name: annotation
    rules:
      - assign_punctuation_break_index
      - syllable_index_annotation
      - syllable_role_annotation
      - syllable_position_annotation
      - dectalk_syllable_type
      # Authored stress directions (for example emphasis on a word) are applied
      # by the frontend driver after the postlexical phase. Run consonant stress
      # again so an onset follows its syllabic's authored level. DECtalk has
      # the marks in its input before phsort(), so it needs no second pass.
      - dectalk_consonant_stress
      - dectalk_rime_boundary
      - dectalk_clause_phone_counts
      # Reads the stress and boundary of every phone of the clause.
      - dectalk_hat_pattern
      - dectalk_intonation_stops
      - dectalk_drop_dummy_vowel_after_intonation_stop
  - name: formant
    rules:
      - dectalk_sw_explicit_override
      - dectalk_sw_default_assignment
      - dectalk_obstruent_parallel_amplitudes
      - dectalk_silence_carries_formants
  - name: prosody
    rules:
      - dectalk_clause_number_words
      - dectalk_clause_running_state
      - dectalk_short_declarative_baseline_declination
      - dectalk_baseline_declination
      - dectalk_comma_baseline
      - dectalk_short_exclamation_baseline
      - dectalk_question_baseline
      - dectalk_female_baseline_declination
      - dectalk_female_comma_baseline
      - dectalk_female_question_baseline
      - dectalk_female_exclamation_range
      - dectalk_empty_clause_baseline
      - dectalk_empty_clause_comma_baseline
      - dectalk_empty_clause_exclamation_baseline
      - dectalk_empty_clause_question_baseline
      - dectalk_female_empty_clause_baseline
      - dectalk_female_empty_clause_comma_baseline
      - dectalk_female_empty_clause_question_baseline
      - dectalk_female_empty_clause_exclamation_range
      - dectalk_break_f0_floor
      - dectalk_empty_clause_break_f0_floor
      # phinton's order on one syllabic: hat rise, stress impulse, question
      # gestures (Ph_inton2.c Rules 1, 2, 4).
      - dectalk_hat_rise
      - dectalk_stress_impulse
      - dectalk_question_dip
      - dectalk_question_rise
      # One command per DECtalk allophone, in clause order (pht0draw).
      - dectalk_segmental_f0_initial_silence
      - dectalk_empty_clause_f0_opening_silence
      - dectalk_segmental_f0_phone
      - dectalk_segmental_f0_phone_after_intonation_stop
      - dectalk_segmental_f0_written_silence
      - dectalk_segmental_f0_dummy_vowel
      - dectalk_segmental_f0_final_silence
      - dectalk_connected_speech_source_contour
  - name: finalize
    after: [duration, structural, formant, prosody]
    rules: []
    compute_times: true
    resolve_points: [F0Point, PhraseCommand, Tilt]
