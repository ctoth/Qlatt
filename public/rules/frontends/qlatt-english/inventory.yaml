phoneme_targets:
  # Core monophthong steady-state targets use Peterson & Barney (1952) adult male
  # averages for F1-F3. B1-B3 use Kent & Vorperian (2018) typical adult-male
  # bandwidth ranges. Unstressed variants keep the same spectral targets; vowel
  # reduction is handled by duration/formant rules rather than baked into the lexicon.
  # A7-A10 parallel formant amplitudes for higher-frequency shaping.
  # F7~6500 Hz, F8~7500 Hz, F9~8500 Hz, F10~9500 Hz.
  # Values derived from:
  #   Shadle et al. (2023) — fricative spectra to 15 kHz
  #   Monson et al. (2014) — perceptual significance of HF energy
  # Non-sibilants (/f/, /th/) have flat/rising HF spectra: A8 >= A7.
  # Sibilants (/s/) peak lower and roll off: A7 > A8 > A9 > A10.
