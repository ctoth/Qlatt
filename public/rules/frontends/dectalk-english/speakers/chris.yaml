# NOT IN THIS BUILD'S VOICE TABLE. DECtalk 4.63's US build defines us_chris
# (PH/P_us_vdf1.h:751) but nothing refers to it: voidef[9], where a tenth
# voice would be, is var_val, a copy of the current voice (PH/ph_main.c:520,
# ph_vset.c:481-497). So DECtalk cannot speak with this definition and there
# is nothing to check this file against. Unlike the other nine it was not
# regenerated by scripts/oracle/import-dectalk-voices.ts: its values below
# are the old converter's, taken from the 8 kHz definition chris_8, except
# fnscale.
