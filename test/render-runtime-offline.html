<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QLATT Runtime Offline Renderer</title>
  </head>
  <body>
    <script type="module">
      import { createDiagnostics } from "../src/diagnostics.ts";
      import { loadExperimentConfig } from "../src/experiments/load-experiment-config.ts";
      import { preloadF0Filters } from "../src/f0-filters-loader.ts";
      import { createKlattInterpreter } from "../src/klatt-interpreter.ts";
      import { createKlattRuntime } from "../src/klatt-runtime.ts";
      import { summarizeTrack } from "../src/rendering/track-summary.ts";
      import { textToKlattTrackDetailed } from "../src/tts-frontend.ts";

      const F0_FILTERS_WASM_URL = `${import.meta.env.BASE_URL}worklets/f0-filters.wasm`;

      async function renderOfflineRuntime({
        phrase,
        baseF0 = 110,
        frontendId = "qlatt-english",
        experimentId = "klatt80-baseline",
        rate = 1,
        // A voice of the frontend's registry, as the page's voice selection
        // gives it (test/harness/runtime.js). Absent: the frontend's default.
        speaker,
        transitionMs = 30,
        sampleRate = 48000,
        leadTime = 0.05,
        tailTime = 0.2,
        track,
        includeTrack = false,
        // "float32-base64": the samples as the bytes of a Float32Array, exact
        // and far smaller than a JSON array of numbers. Absent: the array.
        encodeSamples,
      }) {
        const config = await loadExperimentConfig(experimentId, Array.isArray(track) ? undefined : frontendId);
        // Layered-additive F0 frontends (e.g. dectalk-english) call a
        // synchronous WASM kernel; preload its bytes before the sync call.
        if (!Array.isArray(track)) {
          await preloadF0Filters(F0_FILTERS_WASM_URL);
        }
        const resolvedTrack = Array.isArray(track)
          ? track
          : // A base F0 of null is none: the voice keeps its own (undefined
            // does not survive the driver's serialization and would be 110).
            textToKlattTrackDetailed(phrase, baseF0 === null ? undefined : baseF0, transitionMs, {
              frontendId,
              rate,
              ...(speaker ? { speaker } : {}),
            }).track;
        const totalTime =
          (resolvedTrack.length ? resolvedTrack[resolvedTrack.length - 1].time : 0) +
          leadTime +
          tailTime;
        const length = Math.max(1, Math.ceil(totalTime * sampleRate));

        const ctx = new OfflineAudioContext(1, length, sampleRate);
        // What the graph's nodes report (where a run started, a fallback, a
        // fault) goes back with the samples.
        const diagnostics = createDiagnostics({ maxEntries: 1000 });
        const runtime = await createKlattRuntime({
          diagnostics,
          audioContext: ctx,
          graph: config.graph,
          semantics: config.semantics,
          registry: config.registry,
          workletBasePath: `${import.meta.env.BASE_URL}worklets/`,
        });
        runtime.connectToDestination();

        const interpreter = createKlattInterpreter({
          audioContext: ctx,
          runtime,
          semantics: config.semantics,
          bindingMap: runtime.getBindingMap(),
        });
        interpreter.scheduleTrack(resolvedTrack, leadTime);

        const buffer = await ctx.startRendering();
        // Worklet messages are delivered on a later turn of the event loop.
        await new Promise((resolve) => setTimeout(resolve, 0));
        runtime.disconnect();

        const channel = new Float32Array(buffer.length);
        buffer.copyFromChannel(channel, 0);
        let rms = 0;
        let peak = 0;
        const encoded = encodeSamples === "float32-base64";
        const samples = encoded ? [] : new Array(channel.length);
        for (let i = 0; i < channel.length; i += 1) {
          const value = channel[i];
          if (!encoded) samples[i] = value;
          rms += value * value;
          const absValue = Math.abs(value);
          if (absValue > peak) peak = absValue;
        }
        rms = channel.length ? Math.sqrt(rms / channel.length) : 0;
        let samplesBase64;
        if (encoded) {
          const bytes = new Uint8Array(channel.buffer, channel.byteOffset, channel.byteLength);
          let binary = "";
          for (let i = 0; i < bytes.length; i += 32768) {
            binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
          }
          samplesBase64 = btoa(binary);
        }

        return {
          phrase,
          baseF0,
          frontendId,
          experimentId,
          rate,
          speaker,
          transitionMs,
          sampleRate,
          leadTime,
          tailTime,
          length,
          metrics: { rms, peak },
          trackSummary: summarizeTrack(resolvedTrack),
          track: includeTrack ? resolvedTrack : undefined,
          samples,
          samplesBase64,
          diagnostics: diagnostics.getEntries().map((entry) => ({
            level: entry.level,
            code: entry.code,
            message: entry.message,
            data: entry.data,
          })),
        };
      }

      const renderState = {
        status: "idle",
        phase: "ready",
        error: null,
        startedAt: null,
        finishedAt: null,
        result: null,
        task: null,
      };

      function snapshotRenderState() {
        return {
          status: renderState.status,
          phase: renderState.phase,
          error: renderState.error,
          startedAt: renderState.startedAt,
          finishedAt: renderState.finishedAt,
          hasResult: renderState.result != null,
        };
      }

      function startOfflineRenderRuntime(opts) {
        if (renderState.status === "running") {
          return snapshotRenderState();
        }

        renderState.status = "running";
        renderState.phase = "rendering";
        renderState.error = null;
        renderState.startedAt = Date.now();
        renderState.finishedAt = null;
        renderState.result = null;
        renderState.task = (async () => {
          try {
            const result = await renderOfflineRuntime(opts);
            renderState.result = result;
            renderState.status = "complete";
            renderState.phase = "complete";
          } catch (error) {
            renderState.error =
              error instanceof Error ? error.stack || error.message : String(error);
            renderState.status = "error";
            renderState.phase = "error";
          } finally {
            renderState.finishedAt = Date.now();
            renderState.task = null;
          }
        })();

        return snapshotRenderState();
      }

      function consumeOfflineRenderRuntimeResult() {
        if (renderState.status !== "complete" || renderState.result == null) {
          throw new Error("Offline render result is not ready.");
        }
        const result = renderState.result;
        renderState.result = null;
        renderState.status = "idle";
        renderState.phase = "ready";
        renderState.error = null;
        return result;
      }

      window.renderOfflineRuntime = renderOfflineRuntime;
      window.offlineRenderDriver = {
        startRender: startOfflineRenderRuntime,
        getStatus: snapshotRenderState,
        consumeResult: consumeOfflineRenderRuntimeResult,
      };
    </script>
  </body>
</html>
