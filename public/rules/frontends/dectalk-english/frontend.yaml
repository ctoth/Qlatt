            - "DECtalk 4.63 PH/ph_task.c:711-712 (SLOWTALK: sprate = deadstop(rate, 50, 550))"
        # Rates whose rate-dependent rules are all in this rulepack. Not ported:
        # 350 and above, ph_draw.c:4069-4072 (the glottal area's speed is
        # forced to 1).
        # Below 100 the citation rules are in (timing.citation_below_wpm).
        # What else the source tests there changes nothing this frontend
        # produces: the voicing amplitude targets of p_us_st1.c:169-171 and
        # 184-190 are not read by the HLSYN build, and a glottal stop
        # (p_us_tim.c:906-908) is never put into the phone string by the US
        # English rules. p_us_st1.c:1429 (above 300) is compiled only with
        # FASTTYPING_MODE, which this build does not define.
        ported_minimum: 50
        ported_maximum: 349
      undershoot_coefficient:
        value: 0.3
        citations:
          - Lindblom 1963 (articulatory undershoot at fast rates)
          - "Engineering estimate: 0.3 coefficient maps rate excess to undershoot factor"
      f0_range_exponent:
        value: 0.5
        citations:
          - Ladd 2008 Ch.9 (F0 range narrows at fast speaking rates; sqrt = exponent 0.5)
      transition_scale_exponent:
        value: 1.0
        citations:
          - Broad & Fertig 1970 (formant transition durations scale inversely with rate)
    duration:
      rate_scale: 1.0
      # The frontend API's rate (textToKlattTrack options.rate) is a multiplier
      # of the neutral rate. With the reference at 1.0 it is taken as given;
      # rate.words_per_minute above turns it into DECtalk's words per minute,
      # and rate_scale stays 1 for this frontend.
      rate_reference: 1.0
      # Duration floors consumed by the duration_floor_* rules. The canonical
      # magnitudes live in output.lowering.timeline.duration_floors (also read by
      # lowerToFrames); tts-frontend injects those values here at runtime, so
      # these declarations mirror them and satisfy the rule policy-path validator.
      # DECtalk 4.63 ph_defs.h: NF7MS (~7ms/1 frame) and NF30MS (30ms/5 frames).
      stop_release_floor_ms: 7
      default_floor_ms: 30
      vot_target_ms:
        p: 58
        t: 70
        k: 80
      voiceless_vot_base_ms: 60
      voiceless_vot_unstressed_ms: 7
      voiceless_vot_s_cluster_ms: 15
      voiceless_vot_sonorant_consonant_bonus_ms: 5
      # DECtalk 4.63 p_us_st1.c Special Rule 2:
      # PAP.pspesh defaults to 48 dB, rises to 50 dB before non-front targets,
      # drops by 3 dB when the following sonorant is unstressed, and rises by
      # 5 dB when the following sonorant is a consonant (/r, l, m, n, w, y/).
      voiceless_vot_aspiration_front_db: 48
      voiceless_vot_aspiration_nonfront_db: 50
      voiceless_vot_aspiration_unstressed_reduction_db: 3
      voiceless_vot_aspiration_sonorant_bonus_db: 5
      # DECtalk 4.63 p_us_st1.c: dummy-vowel release into silence reduces burst
      # amplitudes by 3 dB and aspiration by 6 dB.
      dummy_vowel_burst_reduction_db: 3
      dummy_vowel_aspiration_reduction_db: 6
      # DECtalk 4.63 Ph_inton2.c:1683-1722 Rule 9 inserts a schwa for NF40MS
      # after a burst plosive before silence; ph_defs.h:440 defines NF40MS as
      # 6 frames of 6.4 ms.
      dummy_vowel_duration_ms: 38.4
      # DECtalk 4.63 p_us_st1.c:172-176: a dummy vowel's AV target is 12 dB lower.
      dummy_vowel_voicing_reduction_db: 12
      # DECtalk 4.63 p_us_st1.c us_gettar() assigns TL=10 to FDUMMY_VOWEL.
      dummy_vowel_tilt_db: 10
      # DECtalk 4.63 p_us_st1.c: open-glottis interval widens B1/B2 by +250/+70 Hz.
      open_glottis_b1_widen_hz: 250
      open_glottis_b2_widen_hz: 70
      vot_split_fallback_share: 0.5
      weak_release_min_ms: 15
      weak_release_scale: 0.5
      weak_release_amplitude_reduction_db: 10
      stress_secondary_level: 2
      pause_comma_ms: 150
      # DECtalk 4.63 English sets nfperiod=94 frames in ph_claus.c, and
      # p_us_tim.c applies it directly at the neutral [:ra 180] rate.
      pause_period_ms: 602
      pause_clause_initial_ms: 32
      clause_final_lengthening_ms: 38
      clause_final_voiced_obstruent_ms: 19
      non_final_shortening: 0.70
      non_final_low_vowel_shortening: 0.50
      stress_secondary: 0.85
      stress_unstressed: 0.70
      medial_syllable_shortening: 0.85
      polysyllabic_shortening: 0.80
      non_initial_consonant_shortening: 0.85
      word_final_obstruent_lengthening_ms: 19
      word_final_voiceless_fricative_lengthening_ms: 46
      unstressed_syllabic_shortening: 0.70
      unstressed_consonant_shortening: 0.70
      unstressed_glide_shortening: 0.50
      # Rule 7 (p_us_tim.c:432-447) lowers durmin for unstressed non-obstruents:
      # no stress halves durmin, secondary stress subtracts durmin/4, then clamps
      # to at least 3 DECtalk frames.  At the 6.4 ms control cadence this is 19 ms.
      unstressed_no_stress_min_duration_factor: 0.50
      unstressed_secondary_min_duration_factor: 0.75
      unstressed_min_duration_floor_ms: 19
      emphasis_lengthening_ms: 19
      emphasis_syllabic_extra_ms: 38
      pre_voiceless_fricative_shortening: 0.80
      pre_voiceless_plosive_shortening: 0.70
      pre_voiced_obstruent_lengthening: 1.20
      pre_nasal_shortening: 0.85
      cluster_shortening: 0.70
      post_voiceless_plosive_lengthening_ms: 19
      phrase_initial_vowel_lengthening_ms: 19
      # --- chunk dt-11: syllable-keyed Rule 4 monosyllable branch + added
      #     numbered rules 10/11/19/20/23/24 and the Rule 9 [nt] cluster case.
      #     Multipliers from ph_defs.h N*PRCNT (FRAC_ONE=16384 == 1.0); additive
      #     ms from NF*MS frame counts at the established 6.33 ms/frame factor
      #     (NF20MS=3fr=19ms, NF40MS=6fr=38ms already in use above).
      # Rule 4 (p_us_tim.c:355-373) monosyllable: secondary N85PRCNT(=0.85),
      # unstressed N70PRCNT(=0.70); primary-stressed monosyllable unchanged
      # (the N90 arg is dead code -- mlsh1 runs only when FSTRESS_1 IS_MINUS).
      monosyllable_secondary_shortening: 0.85
      monosyllable_unstressed_shortening: 0.70
      # Rule 4 (p_us_tim.c:374-394) non-monosyllable, non-word-final segment:
      # N85PRCNT (FFIRSTSYL/FMEDIALSYL/FFINALSYL all 0.85 in this build).
      polysyllable_nonfinal_shortening: 0.85
      # Rule 7 (p_us_tim.c:452-456) unstressed word-MEDIAL syllabic: prcnt>>1
      # (== x0.5).  Non-medial unstressed syllabic stays N70PRCNT (0.70 above).
      unstressed_medial_syllabic_shortening: 0.50
      # Rule 10 (p_us_tim.c:647-655) first vowel of a two-vowel sequence: +NF30MS.
      two_vowel_first_lengthening_ms: 32
      # Rule 11 (p_us_tim.c:657-664) word-initial stressed vowel of a polysyllable:
      # +NF25MS.
      word_initial_stressed_vowel_lengthening_ms: 25
      # Rule 19 (p_us_tim.c:819-826) function-word-final unstressed monosyllable
      # TH (e.g. "with"): N60PRCNT.
      function_word_final_th_shortening: 0.60
      # Rule 20 (p_us_tim.c:828-836) unstressed monosyllable IY before a vowel
      # ("the/me/he"): N150PRCNT.
      the_iy_prevocalic_lengthening: 1.50
      # Rule 23 (p_us_tim.c:859-868) vowel before a /t/ flap DF ("writing" vs
      # "riding"): N35PRCNT.
      pre_df_flap_shortening: 0.35
      # Rule 24 (p_us_tim.c:882-889) segment before NG ("ing"): N60PRCNT.
      pre_ng_shortening: 0.60
      # Rule 17 (p_us_tim.c:790-805) utterances with nallotot < 10 add 30 to prcnt before
      # the durinh/durmin interpolation.  The YAML duration model applies this
      # as the equivalent fraction of the compressible duration range.
      short_phrase_prcnt_bonus: 30
      prcnt_denominator: 128
      # Rule 9 [nt] cluster (p_us_tim.c:628-639): word-internal /n/ before a
      # non-word-initial unstressed /t/ shortened to N10PRCNT.  The companion
      # N->D rewrite (L635) is allophonic and lives in the postlexical phase, not
      # here; only the durational shortening of the /n/ is modelled.
      nt_cluster_nasal_shortening: 0.10
      citations:
        - "DECtalk 4.63 p_us_tim.c"
        - "DECtalk 4.63 ph_defs.h (NF*MS constants)"
    f0:
      # All F0 policy values are in DECtalk internal units (Hz*10), matching
      # the values used by Ph_drwt02.c and ph_inton1.c.  Speaker scaling
      # converts these to final Hz via:
      #   Hz = (f0minimum + (val - 1300) * f0scalefac / 4096) / 10
      #
      # Baseline declination profile: Ph_drwt02.c f0basetypes[0][] (declarative).
      # 17 equidistant points spanning the utterance duration.
      baseline_declarative:
        - 1157
        - 1145
        - 1139
        - 1127
        - 1113
        - 1109
        - 1095
        - 1082
        - 1079
        - 1065
        - 1053
        - 1040
        - 1038
        - 1024
        - 980
        - 952
        - 863
      # The hat rise itself, size_hat_rise, is the voice rule field
      # hat_rise_hz10. Ph_inton2.c adds 70 when the stressed nucleus is in the
      # first syllable.
      hat_first_syllable_bonus_hz: 70
      # Ph_inton2.c:830: the 70 is added when `nphon <= 2`.
      hat_first_syllable_through_allophone: 2
      # Ph_inton2.c:822-828: 15 more when `nphon > 10`.
      hat_late_after_allophone: 10
      hat_late_bonus_hz: 15
      # Ph_inton2.c:854-861: the rise is 2 frames early when gesture_ref <= 2.
      hat_rise_early_through_allophone: 2
      hat_rise_early_frames: 2
      # Ph_inton2.c:860: otherwise allodurs[gesture_ref] >> 1.
      hat_rise_delay_divisor: 2
      # Ph_inton2.c:961: a stress impulse starts allodurs[nphon] >> 2 into the vowel.
      stress_delay_divisor: 4
      # Ph_inton2.c:955-958: targf0 >>= 2 in a clause that ends in "?".
      stress_question_divisor: 4
      # Ph_inton2.c:1005-1012: muldv(scale_str_rise, targf0, 32); under
      # emphasis a scale_str_rise below 16 is taken as 16.
      stress_scale_divisor: 32
      stress_emphasis_scale_minimum: 16
      # ph_defs.h FEMPHASIS: stress level 3.
      stress_emphasis_level: 3
      # Ph_inton2.c:488: phinton starts its command clock at cumdur = -6.
      command_clock_lead_frames: 6
      # The stress impulse's two terms, by stresses so far in the clause and
      # by stress level (none, primary, secondary, emphasis), for each sex
      # (Ph_inton2.c:936-946 chooses by malfem). Ph_inton2.c:313, 323-324:
      # us_f0_mphrase_position and us_f0_mstress_level; 328-329, 333:
      # us_f0_fphrase_position and us_f0_fstress_level.
      stress_phrase_position:
        male: [160, 80, 60, 40, 30, 20, 20, 5]
        female: [180, 80, 70, 60, 50, 40, 34, 30]
      stress_level:
        male: [1, 81, 61, 261]
        female: [1, 80, 70, 161]
      # Ph_inton2.c:585, 1059-1062: MAX_NRISES; the count goes back to 1 there.
      stress_max_rises: 7
      # Ph_inton2.c:960-973: the clause's last stress, or a syllabic before a
      # period, starts NF20MS (3 frames) early and is 50 lower, never below 30.
      stress_final_early_frames: 3
      stress_final_reduction_hz: 50
      stress_final_floor_hz: 30
      # Ph_inton2.c:976-979: emphasis starts NF7MS (1 frame) into the vowel.
      stress_emphasis_delay_frames: 1
      # Ph_inton2.c:815: phinton() leaves its allophone loop at a syllabic that
      # begins and ends the hat when `nphon > 4`.
      intonation_stop_after_allophone: 4
      # Ph_drwt02.c:1660-1663, 1686-1689: a period clause of more than 3 words
      # and an exclamation of more than 2 take the long declarative baseline.
      baseline_long_declarative_words: 3
      baseline_long_exclamation_words: 2
      # Ph_drwt02.c:3240: in the female routine a comma clause of more than 4
      # words takes the declarative baseline.
      baseline_long_comma_words: 4
      # Ph_drwt02.c:3805-3808: the female routine scales an exclamation by
      # f0scalefac + 500.
      exclamation_range_added: 500
      # LTS/ls_util.c:829-837: around a clause break it inserts, the text
      # stage saves "compause", sets it to -12, has the clause before the
      # break spoken, and puts the saved value back. The field it reaches
      # under that name is the phonetic stage's f0minimum (the two stages see
      # pDph_t three shorts apart; read from an instrumented build). So that
      # clause is spoken with an F0 floor of -12, unless it is the first of
      # the run and loads the voice at its start.
      break_floor: -12
      # Switch for that: false leaves the voice's own floor in such a clause.
      # A running DECtalk does this at every inserted break after its first
      # clause.
      break_floor_applies: true
      # What the text stage saves and puts back when no clause has been
      # spoken yet: f0minimum before the voice is loaded. DECtalk's packets
      # are recorded one phrase to a process, so this is what every clause
      # after such a break is spoken with.
      unloaded_floor: 0
      # Switch for that. This is the fresh-process behaviour of say.exe: it
      # arises only when the utterance's first clause is the first the process
      # speaks. A long-running DECtalk differs (the saved value is then the
      # voice's floor); set false to speak as one.
      unloaded_floor_applies: true
      # Ph_inton2.c:580-581: the US question gestures, internal Hz*10.
      question_gesture_dip_hz: -151
      question_gesture_rise_hz: 451
      # Ph_inton2.c:1253-1262: the dip is 5 frames early in a one-word clause
      # and 6 otherwise, length 15. The rise of a one-word clause is 100 lower,
      # at the syllabic's end, length 24; otherwise it is at a quarter of the
      # syllabic less 4 frames, length 20.
      question_dip_early_frames_one_word: 5
      question_dip_early_frames: 6
      question_dip_frames: 15
      question_rise_one_word_reduction_hz: 100
      question_rise_frames_one_word: 24
      question_rise_back_frames: 4
      question_rise_frames: 20
      # Ph_inton2.c:899: the US hat rise is a STEP whose descriptor length is 15.
      hat_rise_glide_frames: 15
      # Stress impulse duration in native DECtalk control frames.
      # Source: Ph_inton2.c:1056 make_f0_command(IMPULSE, 2, targf0, delayf0, 20, ...).
      stress_impulse_duration_frames: 20
      segmental:
        # us_f0msegtars[] and us_f0fsegtars[]: incremental segmental F0 target
        # per phone, internal Hz*10, for the phones whose entry is not 0. A
        # phone not listed here has target 0. Keys are this port's phone names
        # (SI is SIL). The tables are read by position, so the female one is
        # given as its numbers fall: 500 for S, SH, B, T and K, none for P.
        targets:
          male:
            SIL: 50
            IY: 140
            IH: 80
            EY: 50
            EH: 30
            AH: 20
            OW: 30
            OY: 60
            UH: 80
            UW: 140
            RR: 50
            YU: 140
            AX: 30
            IX: 70
            IR: 110
            W: 100
            Y: 140
            Z: -200
          female:
            SIL: 50
            IY: 190
            IH: 120
            EY: 60
            EH: 40
            AH: 40
            OW: 60
            OY: 80
            UH: 190
            UW: 190
            RR: 80
            YU: 150
            AX: 60
            IX: 80
            IR: 120
            ER: 80
            OR: 50
            UR: 120
            W: 80
            Y: 80
            # DECtalk's HX.
            HH: 90
            S: 500
            Z: -20
            SH: 500
            B: 500
            T: 500
            K: 500
        # The controller counts durations in these frames. The clause-initial
        # pause's frames are timing.pause_frames.clause_initial(_other).
        frame_ms: 6.4
        citations:
          - "DECtalk 4.63 Ph_drwt02.c:662-684 us_f0msegtars"
          - "DECtalk 4.63 Ph_drwt02.c:686-705 us_f0fsegtars"
          - "DECtalk 4.63 ph_claus.c (6.4 ms controller frames)"
      citations:
        - "DECtalk 4.63 ph_inton1.c (hat-pattern F0 model)"
        - "DECtalk 4.63 Ph_drwt02.c (baseline profiles, speaker scaling)"
        - "Klatt 1982 (hat-pattern: baseline + hat + stress + segmental)"
    source_contour:
      # Fant 1997 Fig. 10 contour defaults for connected speech source dynamics.
      ee_onset_rise_sec:
        value: 0.05
        citations:
          - Fant 1997 (connected-speech source contour onset rise)
      ee_onset_rise_db:
        value: 1.0
        citations:
          - Fant 1997 (phrase-initial source effort rise)
      ee_declination_db_per_sec:
        value: 2.0
        citations:
          - Fant 1997 (connected-speech declination slope)
      ee_final_fall_db_per_sec:
        value: 6.0
        citations:
          - Fant 1997 (enhanced phrase-final source fall)
      ee_final_window_min_sec:
        value: 0.3
        citations:
          - Fant 1997 (terminal source-fall window lower bound)
      ee_final_window_max_sec:
        value: 0.5
        citations:
          - Fant 1997 (terminal source-fall window upper bound)
      ee_final_window_ratio:
        value: 0.35
        citations:
          - Fant 1997 (terminal source window scales with phrase duration)
      rd_final_offset:
        value: 0.18
        citations:
          - Fant 1997 (phrase-final Rd softening companion to Ee fall)
          - Hanson et al. 2001 (phrase-final spectral tilt and nonmodal events motivate increased final softness)
    formant:
      coarticulation_weight: 0.3
      transition_time_ms: 30
      # DECtalk 4.63 p_us_st1.c Special Rule 2:
      # PAP.pspesh = 52 for onset of a voiced non-obstruent from silence or
      # a voiceless open-vocal-tract fricative (/f, th, s, sh/), with a
      # 40 ms backward smoothing span.
      voiceless_open_tract_breathy_onset_ms: 40
      voiceless_open_tract_breathy_onset_db: 52
      # DECtalk 4.63 p_us_st1.c backward smoothing uses a boundary value of
      # target-10 dB when source amplitude is increasing.
      source_onset_boundary_drop_db: 10
      # DECtalk 4.63 p_us_st1.c keeps voicing onset non-abrupt after a voiced
      # fricative. The original code uses the normal source-smoothing path;
      # Qlatt approximates that with a 40 ms prefix window. # engineering approximation
      voiced_fricative_voicing_onset_ms: 40
      # DECtalk 4.63 p_us_st1.c backward smoothing uses an NF130MS source span,
      # but the rendered AP tail decays to zero over ~90 ms in the DECtalk
      # trace for the single-word final-vowel case.
      vowel_breathy_offset_ms: 90
      vowel_breathy_offset_db: 52
      # DECtalk 4.63 p_us_st1.c special hack for /th, dh/:
      # fric gains are suppressed until durfon - 3, leaving only a weak final
      # frication tail. Qlatt models this as a 30 ms suffix window at the
      # 100 Hz frame cadence used by the runtime. # engineering approximation
      weak_interdental_fricative_tail_ms: 30
      citations:
        - "DECtalk 4.63 ph_setar.c"
        - "DECtalk 4.63 p_us_st1.c (source-amplitude special rules)"
    speaker:
      base_f0_hz:
        value: 122
        citations: ["DECtalk 4.63 Paul default AP"]
      formant_scale:
        value: 1.0
        citations: ["DECtalk 4.63 Paul male"]
      rd_default:
        value: 0.7
        citations: ["DECtalk 4.63 Paul BR=0, male base 0.7"]
      spectral_tilt_offset_db:
        value: 0
        citations: ["DECtalk 4.63 Paul BR=0"]
      f0_minimum:
        value: 1100
        citations: ["DECtalk 4.63 Paul (AP-12)*10, ph_vset.c general path"]
      f0_scale_factor:
        value: 4100
        citations: ["DECtalk 4.63 Paul PR*41, ph_vset.c"]
      f0_lp_filter:
        value: 2100
        citations: ["DECtalk 4.63 Paul 1500+15*QU, ph_vset.c general path"]
      f0_lp_filter_alpha:
        value: 0.128173828125
        citations: ["DECtalk 4.63 Ph_drwt02.c filter coefficient 2100/16384 (Paul)"]
      hat_rise_hz10:
        value: 120
        citations: ["DECtalk 4.63 Paul HR*10, ph_vset.c general path"]
      scale_str_rise:
        value: 32
        citations: ["DECtalk 4.63 Paul SR direct"]
      assertiveness:
        value: 2870
        citations: ["DECtalk 4.63 Paul AS*41, ph_vset.c"]
      baseline_fall_hz10:
        value: 180
        citations: ["DECtalk 4.63 Paul BF*10"]
output:
  lowering:
    id: dectalk-english-track-lowering
    # Stable Klatt backend vocabulary captured by the production-frame oracle.
    columns: [F1, F2, F3, F4, B4, F5, B5, F6, B6, B1, B2, B3, AV, AF, AH, AVS, F0, sourceMode, lfMode, breathiness, Rd, RdRef, OQ, TL, flutter, jitter, EePhraseDb, RdPhraseOffset, FNZ, FNP, BNP, BNZ, AN, A1, A2, A3, A4, A5, A6, A7, A8, A9, A10, AB, SW, FGP, BGP, FGZ, BGZ, BGS, NFC, GO, PS, CNK, AG, PH, run, AL, ABLADE, ATB, AREA_N, DC, UE, A2_CODE, BRST, PLACE, SPD_R4CB, SPD_R4CC, SPD_R5CB, SPD_R5CC, SPD_R4PB, SPD_R5PB, SPD_T0JIT, SPD_R5CA, SPD_R4CA, SPD_R3CA, SPD_R2CA, SPD_R1CA, SPD_NOPEN1, SPD_NOPEN2, SPD_ATURB, SPD_AFGAIN, SPD_AZGAIN, SPD_APGAIN, SPD_SEX, last_voice, NOM_Open_Quo, Tiltm]
    timeline:
      initial_silence_ms:
        value: 19.2
        citations:
          - "DECtalk 4.63 -lt oracle trace: clause-initial GEN_SIL before voiced obstruent spans 3 synthesis frames at 6.4ms"
      # The duration rules compute the opening pause from the first phone
      # (dectalk_utterance_initial_pause); the value above stands only when no
      # Segment carries one.
      initial_silence_key: utterance_initial_silence_ms
      final_silence_ms:
        value: 0
        citations:
          - "DECtalk 4.63 p_us_tim.c: terminal punctuation silence is emitted as GEN_SIL duration"
      duration_floors:
        # The duration rules already give every allophone DECtalk's frame
        # count; lowering adds no floor of its own.
        stop_release_ms:
          value: 0
          citations:
            - "DECtalk 4.63 p_us_tim.c:895-941 (the duration rules set the final frame count; nothing floors it afterwards)"
        default_ms:
          value: 0
          citations:
            - "DECtalk 4.63 p_us_tim.c:895-941 (the duration rules set the final frame count; nothing floors it afterwards)"
      event_points:
        include_segment_start: true
        include_control_boundaries: true
        include_f0_anchors: true
        include_transition_steady_time: true
    transitions:
      native_frame_ms:
        value: 6.4
        citations:
          - "DECtalk 4.63 ph_defs.h: NSAMP_FRAME=71 at 11.025kHz; -lt oracle traces expose the controller cadence as 6.4ms"
          - "DECtalk 4.63 ph_draw.c: current ftran contributes to output before dftran is subtracted once per synthesis frame"
      min_transition_edge_ms:
        value: 20
        citations:
          - "Engineering estimate: preserve the 20 ms minimum offset inside each segment for transition edges"
      default_transition_ms:
        value: 30
        citations:
          - "DECtalk 4.63 p_us_st1.c: default durtran assignments commonly use NF30MS; ph_defs.h defines NF30MS = 5 synthesis frames"
      blend:
        factor:
          value: 0.5
          citations:
