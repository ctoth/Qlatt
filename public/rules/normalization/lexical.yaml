# Allen, Hunnicutt & Klatt 1987 FORMAT. The quote/apostrophe and punctuation
# patterns preserve the completed Qlatt #16 contract; all matching is declared.
tags:
  normalization_lexical: Orthographic normalization and terminal word separation
maps:
  tn_abbreviations:
    dr.: doctor
    mr.: mister
    mrs.: missus
    ms.: miss
    st.: saint
    ave.: avenue
    blvd.: boulevard
    rd.: road
    sr.: senior
    jr.: junior
    prof.: professor
    gen.: general
    sgt.: sergeant
    cpl.: corporal
    pvt.: private
    capt.: captain
    lt.: lieutenant
    col.: colonel
    govt.: government
    dept.: department
    univ.: university
    assn.: association
    bros.: brothers
    inc.: incorporated
    corp.: corporation
    co.: company
    no.: number
    approx.: approximately
    vs.: versus
    etc.: etcetera
  tn_lexical_policy:
    apostrophe_quotes: '[\u2018\u2019\u201A\u2032]'
    double_quotes: '[\u201C\u201D\u201E]'
    ellipsis: '\u2026'
    lexical_apostrophe: "(?<=[a-z])'(?=[a-z]|[^a-z]|$)"
    unlisted: "[^\\w\\s'\uE000]"
    whitespace: '\s+'
functions:
  # Two digits as phonemic text, from the frontend's number phone lists:
  # "05" zero five, "15" fifteen, "30" thirty, "31" thirty one.
  tn_phonemic_two_digits:
    params: [first, second]
    body: >-
      first == '0'
        ? vocabulary('tn_number_phonemes', 'units.0') + maps.tn_phonemic_text.word_boundary
          + vocabulary('tn_number_phonemes', 'units.' + second)
        : first == '1'
          ? vocabulary('tn_number_phonemes', 'teens.' + second)
          : vocabulary('tn_number_phonemes', 'tens.' + first)
            + (second == '0' ? '' : maps.tn_phonemic_text.word_boundary
              + vocabulary('tn_number_phonemes', 'units.' + second))
    citations: ['DECtalk 4.63 LTS/l_us_pr1.c:297-315 (ls_proc_do_2_digits: pzero and the unit after a 0, pteens[] after a 1, ptens[] and the unit otherwise)']
  tn_clean_text:
    params: [text]
    body: >-
      regexReplace(regexReplace(regexReplace(regexReplace(regexReplace(regexReplace(
        lower(text), maps.tn_lexical_policy.apostrophe_quotes, "'", 'g'),
        maps.tn_lexical_policy.double_quotes, '"', 'g'),
        maps.tn_lexical_policy.ellipsis, '...', 'g'),
        get(maps.tn_recognition_policy, 'lexical_apostrophe',
          maps.tn_lexical_policy.lexical_apostrophe), '\uE000', 'g'),
        "'", ' ', 'g'),
        '\uE000', "'", 'g')
    citations: ['Issue #16: lexical apostrophe and punctuation contract']
rules:
  tn_abbreviation:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'abbreviation' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: "tn_words(vocabulary('tn_abbreviations', lower(current.payload.key)) + lower(current.payload.tail))"
    citations:
      - "Allen, Hunnicutt & Klatt 1987; abbreviation expansion"
  tn_initialism:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'initialism' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: "tn_words(split(lower(current.text), '.').filter(letter, letter != '').join(' '))"
    citations:
      - "Allen, Hunnicutt & Klatt 1987; initialisms"
  # An initial is spelled, and its period reaches the phonetics twice: once
  # from the spelling routine and once from the routine that reads the next
  # word. The second period is a clause of its own with no phone in it.
  tn_initial:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'initial' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: >-
        [{'type': 'request', 'kind': 'words', 'payload': {'text': lower(current.payload.letter)}},
         {'type': 'request', 'kind': 'words', 'payload': {'text': '.'}},
         {'type': 'request', 'kind': 'words', 'payload': {'text': '.'}}]
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:2612-2623 (the initial: rbphone = PERIOD, the word is spelled)"
      - "DECtalk 4.63 LTS/ls_task.c:1516-1519 (the spelling routine sends the PERIOD), 1547-1549 (the next-word routine sends it again)"
  # An abbreviation the frontend's dictionary holds with its period: one
  # terminal, the word with the period, which the dictionary then speaks. The
  # period is not a sentence end, but the text's end still is one: measured on
  # DECtalk 4.63 say.exe, "We live at 12 Oak Ave." ends in "avenue" and the
  # period symbol, and "Ask Mr. Then go." is one clause. A unit's
  # abbreviation after a number is the same token, read by the lexicon from
  # its table of units.
  tn_dictionary_abbreviation:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind in ['dictionary_abbreviation', 'number_abbreviation'] && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal, request]
      tag: normalization_lexical
      output: >-
        get(current.payload, 'final', '') == '.'
          ? [{'type': 'terminal', 'text': lower(current.payload.word) + '.'},
             {'type': 'request', 'kind': 'words', 'payload': {'text': '.'}}]
          : [{'type': 'terminal', 'text': lower(current.payload.word) + '.'}]
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:2040-2160 (the abbreviation hit sends the dictionary entry's phones and eats the period)"
  # A word of capitals and periods: each letter a terminal written as the
  # letter and a period, the form the frontend's orthography rule speaks as
  # the letter's name. The text's end is still a sentence end.
  tn_dotted_capitals:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'dotted_capitals' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal, request]
      tag: normalization_lexical
      output: >-
        split(lower(current.payload.letters), '.').map(letter, {'type': 'terminal', 'text': letter + '.'})
          + (get(current.payload, 'final', '') == '.'
              ? [{'type': 'request', 'kind': 'words', 'payload': {'text': '.'}}]
              : [])
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:2840-2890 (each letter through the spelling routine, a word boundary between, the last period eaten)"
  # A word of capitals that is spelled: each letter a spelled-letter terminal.
  tn_spelled_capitals:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'spelled_capitals' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "regexSplit(lower(current.payload.word), '').map(letter, {'type': 'terminal', 'text': letter + '.'})"
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:2512-2545 (ls_task_spell_vs_speak: the word goes to the spelling routine), LTS/ls_spel.c ls_spel_spell"
  # A hyphenated word or a dictionary word with a slash: one terminal, as
  # written, which the frontend's lexicon reads.
  tn_whole_word:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'whole_word' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "[{'type': 'terminal', 'text': lower(current.payload.word)}]"
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:4208-4435 (a hyphenated word is read part by part by ls_task_process_word), 2040-2160 (a word the dictionary has as written is spoken from it)"
  # A word with a mark written on it ahead of the clause's own mark: one
  # terminal, the word with that mark, and the clause's mark after it. A
  # period there is left off the word: it is not spoken.
  tn_marked_word:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'marked_word' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal, request]
      tag: normalization_lexical
      output: >-
        [{'type': 'terminal', 'text': lower(current.payload.word) + (current.payload.inner == '.' ? '' : current.payload.inner)},
         {'type': 'request', 'kind': 'words', 'payload': {'text': current.payload.last}}]
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:4118-4150 (the word with the mark on it goes to the spelling routine; the last mark ends the clause)"
  # A hyphen standing alone: one terminal, the hyphen, which the frontend's
  # dictionary speaks.
  tn_lone_dash:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'lone_dash' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "[{'type': 'terminal', 'text': '-'}]"
    citations:
      - "DECtalk 4.63 dapi/src/dic/dtalk_us.dic (the entry \"-\"), LTS/ls_task.c:2040-2160 (the word is looked up as written)"
  # A symbol standing alone that the frontend's dictionary holds: one
  # terminal, declared a word, so that a mark among them ("?", "!", ",") is
  # spoken by its name and does not end a clause.
  tn_symbol_word:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'symbol_word' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "[{'type': 'terminal', 'text': current.payload.word, 'kind': 'word'}]"
    citations:
      - "DECtalk 4.63 dapi/src/dic/dtalk_us.dic (the entries with no letter and no digit), LTS/ls_task.c:697 and 746 (the dictionary search comes before punctuation is stripped)"
  tn_bare_number_request:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind in ['cardinal', 'ordinal'] && current.outputType == 'source'"
    # A frontend whose lexicon speaks digits itself keeps a bare cardinal as
    # one terminal (tn_recognition_policy.bare_numbers: digits), so the number
    # is not confused with the same words typed out. The same for a number
    # with an ordinal ending ("42nd"), kept as written, under the policy
    # tn_recognition_policy.ordinal_numbers: source.
    expand_text:
      allowed_types: [request, terminal]
      tag: normalization_lexical
      output: >-
        maps.tn_recognition_policy.bare_numbers == 'digits' && current.kind == 'cardinal'
          ? [{'type': 'terminal', 'text': current.payload.value}]
          : current.kind == 'ordinal' && get(maps.tn_recognition_policy, 'ordinal_numbers', 'words') == 'source'
            ? [{'type': 'terminal', 'text': lower(current.text)}]
          : tn_number_request(double(current.payload.value), current.kind == 'ordinal' ? 'hundred' : maps.tn_recognition_policy.hundreds, current.kind == 'ordinal', '')
    citations:
      - "Issue #144: explicit bare-number convention"
      - "DECtalk 4.63 LTS/ls_task.c:3776-3806 (an all-digit word is spoken by the number routines, not looked up)"
  # A number-like word recognised whole (tn_number_token_source) stays one
  # terminal, as written: the frontend's lexicon reads it.
  tn_number_token:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'number_token' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "[{'type': 'terminal', 'text': current.payload.token}]"
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:3181-3513, 3622-3652, 3747-3825 (money, times and numbers are read from the word as written, by the number routines)"
  # A clock time (tn_clock_time_source) written out as one word of phonemic
  # text, as DECtalk's time routine speaks it: the hour, a verb-phrase start,
  # the minutes unless they are "00", and the seconds after another
  # verb-phrase start. The phone lists are the frontend's generated map
  # tn_number_phonemes; ")" is the verb-phrase start and a space the word
  # boundary in the frontend's phonemic text (maps.tn_phonemic_text). The
  # word boundary at the end is the one letter-to-sound sends after a word
  # it has read.
  tn_clock_time:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'clock_time' && current.outputType == 'source'"
    define:
      hour: "current.payload.hour"
      s1: "get(current.payload, 's1', '')"
      hourText: >-
        size(hour) == 1
          ? vocabulary('tn_number_phonemes', 'units.' + hour)
          : tn_phonemic_two_digits(substring(hour, 0, 1), substring(hour, 1, 2))
      minuteText: >-
        current.payload.m1 == '0' && current.payload.m2 == '0'
          ? ''
          : tn_phonemic_two_digits(current.payload.m1, current.payload.m2)
      secondText: >-
        s1 == null || s1 == ''
          ? ''
          : maps.tn_phonemic_text.verb_phrase + tn_phonemic_two_digits(s1, current.payload.s2)
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: >-
        [{'type': 'terminal', 'kind': 'word',
          'text': maps.tn_phonemic_text.open + hourText + maps.tn_phonemic_text.verb_phrase
            + minuteText + secondText + maps.tn_phonemic_text.word_boundary
            + maps.tn_phonemic_text.close}]
    citations:
      - "DECtalk 4.63 LTS/l_us_pr1.c:1182-1209 (ls_proc_do_time: the hour from punits[] or by ls_proc_do_2_digits, VPSTART, the minutes unless 00, VPSTART and the seconds)"
      - "DECtalk 4.63 LTS/l_us_pr1.c:297-315 (ls_proc_do_2_digits)"
      - "DECtalk 4.63 LTS/ls_task.c:3622-3625 (the word boundary is sent after the time)"
  # A pause the text parser asks for (tn_parser_pause_source) is the comma: the
  # phoneme the parser names is the one a written comma gives.
  tn_parser_pause:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'parser_pause' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: "[{'type': 'request', 'kind': 'words', 'payload': {'text': ','}}]"
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:1266-1279 (a written comma sends the COMMA phoneme); CMD/cm_text.c:1139 (phonemic text is sent as its phonemes)"
  # Other phonemic text of the text parser (tn_parser_phones_source) stays one
  # terminal with its marks: the frontend's lexicon reads the phonemes.
  tn_parser_phones:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'parser_phones' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "[{'type': 'terminal', 'text': current.text}]"
    citations:
      - "DECtalk 4.63 CMD/cm_text.c:1118-1144 (phonemic text is sent as its phonemes, with no dictionary lookup)"
  # A clause end that has words to end (tn_parser_clause_end_source) ends them
  # as a period does.
  tn_parser_clause_end:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'parser_clause_end' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: "[{'type': 'request', 'kind': 'words', 'payload': {'text': '.'}}]"
    citations:
      - "DECtalk 4.63 PH/ph_task.c:665-676 (pending symbols are ended with PERIOD when a control item arrives)"
  tn_unmatched_words:
    kind: structural
    select:
      relation: Normalization
      where: "current.outputType == 'source' && current.kind in ['', 'word']"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: >-
        regexSplit(tn_clean_text(current.text), '(' + literalPattern(transcription.punctuation_tokens) + ')')
          .map(part, {'type': 'request', 'kind': 'words', 'payload': {'text':
            part in transcription.punctuation_tokens ? part
              : regexReplace(regexReplace(part, maps.tn_lexical_policy.unlisted, ' ', 'g'), maps.tn_lexical_policy.whitespace, ' ', 'g')}})
    citations:
      - "Issue #16: declared punctuation cleanup"
      - "Allen, Hunnicutt & Klatt 1987; case and whitespace normalization"
phases:
  - name: normalization_lexical
    rules: [tn_dictionary_abbreviation, tn_abbreviation, tn_dotted_capitals, tn_spelled_capitals, tn_whole_word, tn_marked_word, tn_lone_dash, tn_symbol_word, tn_initialism, tn_initial, tn_bare_number_request, tn_number_token, tn_clock_time, tn_parser_pause, tn_parser_phones, tn_parser_clause_end, tn_unmatched_words]
