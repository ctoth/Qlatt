bacon: "0.1"
name: klatt80-synth-stevens91
meta:
  primitives: ./registry.yaml
  semantics: ./semantics.yaml
  description: |
    Stevens 1991 higher-level parameter experiment.
    Extends Klatt 80 topology with a paper-aligned HL layer.
    Exposes HL controls f1 f2 f3 f4 f0 ag ac an st pm and derives
    AV/AH/AF/B1/FNP/FNZ plus OQ/TL proxies using explicit approximations.

    Stevens & Bickley (1991) "Constraints among parameters simplify
      control of Klatt formant synthesizer" Journal of Phonetics 19, 161-174
    Stevens (1998) "Acoustic Phonetics" MIT Press

formantBanks:
  main:
    cascade:
      input: np
      output: cascadeOutGain
    parallel:
      output: parallelSum
    proximity:
      - { pair: [1, 2], offset: 0 }
      - { pair: [2, 3], offset: 50 }
      - { pair: [3, 4], offset: 150 }
    formants:
      - index: 1
        freqRange: [200, 1000]
        freqDefault: 500
        bwRange: [40, 1000]
        bwDefault: 60
        ndbScale: -58
        sign: 1
        parallelSource: parallelSourceGain
        bypassAtZero: true
      - index: 2
        freqRange: [500, 3000]
        freqDefault: 1500
        bwRange: [40, 1000]
        bwDefault: 90
        ndbScale: -65
        sign: -1
        parallelSource: parallelDiffSum
      - index: 3
        freqRange: [1500, 4000]
        freqDefault: 2500
        bwRange: [40, 1000]
        bwDefault: 150
        ndbScale: -73
        sign: 1
        parallelSource: parallelDiffSum
      - index: 4
        freqRange: [2500, 5000]
        freqDefault: 3500
        bwRange: [100, 1000]
        bwDefault: 200
        ndbScale: -78
        sign: -1
        parallelSource: parallelDiffSum
      - index: 5
        freqRange: [3500, 6000]
        freqDefault: 4500
        bwRange: [100, 1000]
        bwDefault: 200
        ndbScale: -79
        sign: 1
        parallelSource: parallelFricGain
      - index: 6
        freqRange: [4000, 7000]
        freqDefault: 5500
        bwRange: [100, 1000]
        bwDefault: 500
        ndbScale: -80
        sign: -1
        parallelSource: parallelFricGain
      # Cascade-only higher formants — Rabiner (1968) defaults
      # At 44.1 kHz sample rate, the z-transform pole repetition that provided
      # automatic higher-pole correction at Klatt's 10 kHz is above audibility.
      # Explicit resonators F7-F10 compensate for this.
      # Refs: Rabiner (1968), Fant (1960) Eq. 1.3-4, Holmes (1983)
      - index: 7
        freqRange: [5000, 8000]
        freqDefault: 6500
        bwRange: [200, 2000]
        bwDefault: 722
        # Rabiner (1968) — cascade-only higher formant, Q=9
      - index: 8
        freqRange: [6000, 9000]
        freqDefault: 7500
        bwRange: [400, 3000]
        bwDefault: 1250
        # Rabiner (1968) — cascade-only higher formant, Q=6
      - index: 9
        freqRange: [7000, 10000]
        freqDefault: 8500
        bwRange: [500, 5000]
        bwDefault: 2125
        # Rabiner (1968) — cascade-only higher formant, Q=4
      - index: 10
        freqRange: [8000, 12000]
        freqDefault: 9500
        bwRange: [1000, 8000]
        bwDefault: 4750
        # Rabiner (1968) — cascade-only higher formant, Q=2

nodes:
  # ---------------------------------------------------------------------------
  # SOURCE NODES
  # ---------------------------------------------------------------------------
  # Source selection (impulse vs LF vs bypass) is implemented via gain gates.
  # Semantics.yaml computes lfSourceSwitch/impulseSourceSwitch from sourceMode.

  lfSource:
    type: lf-source
    params:
      f0: { bind: F0 }
      rd: { bind: Rd }
      lfMode: { bind: lfMode }

  impulseSource:
    type: impulse-train
    params:
      f0: { bind: F0 }
      gain: 1.0
      openPhaseRatio: { bind: openPhaseRatio }

  noiseSource:
    type: noise-source
    params:
      gain: 1.0
      cutoff: { bind: noiseCutoff }

  fricationSource:
    type: noise-source
    params:
      gain: 1.0
      cutoff: { bind: fricationCutoff }

  # Glottal modulation - 50% square wave synchronized to glottal cycle
  glottalMod:
    type: glottal-mod
    params:
      f0: { bind: F0 }

  # ---------------------------------------------------------------------------
  # AERODYNAMIC MODEL — Stevens & Bickley (1991)
  # Outputs:
  #   [0] AV linear, [1] AH linear, [2] AF linear, [3] B1 Hz
  #   [4] FNP Hz, [5] FNZ Hz, [6] OQ ratio, [7] TL proxy dB
  # ---------------------------------------------------------------------------
  aeroModel:
    type: aerodynamic-model
    params:
      enable: { bind: useAerodynamicModel }
      ag: { bind: ag }
      ac: { bind: ac }
      an: { bind: an }
      st: { bind: st }
      pm: { bind: pm }
      ps: 8.0

  # ---------------------------------------------------------------------------
  # PLSTEP BURST MECHANISM
  # ---------------------------------------------------------------------------
  # Klatt 80 PLSTEP: DC step injection triggered by AF or AH rise >= 49 dB.
  # Keep baseline trigger behavior for track compatibility.
  # Creates transient rarefaction pulse at stop/fricative onsets
  #
  # From PARCOE.FOR:
  #   IF (NNAF - NAFLAS >= 49) PLSTEP = GETAMP(G0 - 28)
  #   IF (NNAH - NAHLAS >= 49) PLSTEP = GETAMP(G0 - 28)
  # Decay: 0.995 per sample at 10kHz (~92ms time constant)

  # Edge detector for AF (frication amplitude)
  afEdgeDetector:
    type: edge-detector
    params:
      threshold: 49.0
      input: { bind: AF }

  # Edge detector for AH (aspiration amplitude)
  ahEdgeDetector:
    type: edge-detector
    params:
      threshold: 49.0
      input: { bind: AH }

  # Sum triggers (OR gate - either AF or AH trigger fires the envelope)
  plstepTriggerSum:
    type: gain
    params:
      gain: 1.0

  # Decay envelope - exponential decay starting at -amplitude (rarefaction)
  plstepEnvelope:
    type: decay-envelope
    params:
      trigger: 0  # Driven by audio connection from trigger sum
      amplitude: { bind: plstepAmplitude }  # From semantics: dbToLinear(G0 - 75)
      decay: 0  # Auto-calculate from sample rate

  # ---------------------------------------------------------------------------
  # SOURCE ROUTING/MIXING
  # ---------------------------------------------------------------------------
  # Gain gates implement conditional switching based on sourceMode parameter.
  # Values computed in semantics.yaml: lfSourceSwitch, impulseSourceSwitch, etc.

  lfSourceGain:
    type: gain
    params:
      gain: { bind: lfSourceSwitch }

  impulseGain:
    type: gain
    params:
      gain: { bind: impulseSourceSwitch }

  sourceSum:
    type: gain
    params:
      gain: 1.0

  # Spectral tilt proxy (TL) for source shaping
  tiltFilter:
    type: tilt-filter
    params:
      tilt: 0.0

  # Source mode switching for cascade path
  sourceBypassGain:
    type: gain
    params:
      gain: { bind: sourceBypassSwitch }

  sourceDirectGain:
    type: gain
    params:
      gain: { bind: sourceDirectSwitch }

  sourceDiffGain:
    type: gain
    params:
      gain: { bind: sourceDiffSwitch }

  # ---------------------------------------------------------------------------
  # GLOTTAL SHAPING - CASCADE PATH (RGP/RGZ)
  # ---------------------------------------------------------------------------

  # Glottal resonator pole (RGP)
  rgp:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGP }
      bandwidth: { bind: BGP }

  # Glottal resonator zero (RGZ) - antiresonator
  rgz:
    type: antiresonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGZ }
      bandwidth: { bind: BGZ }

  # Glottal source resonator (RGS) - for AVS path
  rgs:
    type: resonator
    params:
      frequency: 0
      bandwidth: { bind: BGS }

  # ---------------------------------------------------------------------------
  # GLOTTAL SHAPING - PARALLEL PATH (RGP_AVS/RGZ_AVS)
  # ---------------------------------------------------------------------------
  # Separate filter instances from cascade path (rgp/rgz) to maintain
  # independent filter states. Both paths share FGP/BGP parameters.

  rgpAvs:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGP }
      bandwidth: { bind: BGP }

  rgzAvs:
    type: antiresonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FGZ }
      bandwidth: { bind: BGZ }

  # ---------------------------------------------------------------------------
  # RADIATION FILTERS
  # ---------------------------------------------------------------------------
  # Chalker & Mackerras 1985 two-term radiation impedance approximation.

  radiationDiff:
    type: chalker-radiation

  radiationDiffAvs:
    type: chalker-radiation

  # Differentiator for parallel branch (UGLOT1 = first diff of UGLOT)
  diff:
    type: differentiator

  # ---------------------------------------------------------------------------
  # VOICE/ASPIRATION GAIN NODES
  # ---------------------------------------------------------------------------
  # Baseline gains come from semantics; aerodynamic model may drive additively.

  voiceGain:
    type: gain
    params:
      gain: { bind: voiceGain }

  avsGain:
    type: gain
    params:
      gain: { bind: avsGain }

  noiseGain:
    type: gain
    params:
      gain: { bind: aspGain }

  # ---------------------------------------------------------------------------
  # PARALLEL VOICE PATH GAINS
  # ---------------------------------------------------------------------------

  # AVS path source mode switching (reuses same switches as cascade)
  avsBypassGain:
    type: gain
    params:
      gain: { bind: sourceBypassSwitch }

  avsDirectGain:
    type: gain
    params:
      gain: { bind: sourceDirectSwitch }

  avsDiffGain:
    type: gain
    params:
      gain: { bind: sourceDiffSwitch }

  # ---------------------------------------------------------------------------
  # NASAL RESONATORS
  # ---------------------------------------------------------------------------

  # Nasal antiresonator (zero)
  nz:
    type: antiresonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNZ }
      bandwidth: { bind: BNZ }

  # Nasal resonator (pole)
  np:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNP }
      bandwidth: { bind: BNP }

  # Parallel nasal resonator
  parallelNasal:
    type: resonator
    options:
      bypassAtZero: true
    params:
      frequency: { bind: FNP }
      bandwidth: { bind: BNP }

  parallelNasalGain:
    type: gain
    params:
      gain: { bind: anLinear }  # was anGainScaled

  parallelBypassGain:
    type: gain
    params:
      gain: { bind: abLinear }  # was abGainScaled

  # ---------------------------------------------------------------------------
  # PARALLEL MIXING
  # ---------------------------------------------------------------------------

  mixer:
    type: gain
    params:
      gain: 1.0

  parallelMixer:
    type: gain
    params:
      gain: 1.0

  parallelSourceGain:
    type: gain
    params:
      gain: { bind: parallelVoiceGain }

  parallelDiffGain:
    type: gain
    params:
      gain: { bind: parallelVoiceGain }

  parallelFricGain:
    type: gain
    params:
      gain: { bind: fricGainScaled }

  parallelDiffSum:
    type: gain
    params:
      gain: 1.0

  parallelSum:
    type: gain
    params:
      # No branch-specific scale needed: parallel-to-cascade balance matches
      # Klatt 1980 COEWAV.FOR when both branches share the same output path.
      # The FORTRAN's 170x (line 251) is a global 16-bit DAC scale, not a
      # parallel correction.
      gain: 1.0

  # ---------------------------------------------------------------------------
  # OUTPUT MIXING
  # ---------------------------------------------------------------------------

  # Cascade output gain - gates cascade branch based on SW
  # SW=0 (cascade): cascadeGain=1, SW=1 (parallel): cascadeGain=0
  # NOTE: Both cascade and parallel are SUMMED (per COEWAV.FOR line 251)
  # Parallel voicing is gated by parallelVoiceGain, frication always flows through
  cascadeOutGain:
    type: gain
    params:
      gain: { bind: cascadeGain }

  outputSum:
    type: gain
    params:
      gain: 1.0

  # Klatt (1980) Fig. 1 and Appendix A place an external 5 kHz low-pass
  # after the D/A converter. This dedicated DSP node models that output stage.
  outputLp:
    type: reconstruction-filter

  masterGain:
    type: gain
    params:
      gain: { bind: masterGain }

  # DynamicsCompressorNode — mimics FORTRAN 16-bit hard clipping.
  # See klatt80-baseline/graph.yaml for rationale.
  outputCompressor:
    type: dynamics-compressor
    params:
      threshold: -24
      knee: 12
      ratio: 12
      attack: 0.003
      release: 0.1

  outputGain:
    type: gain
    params:
      gain: { bind: outputGain }

# =============================================================================
# CONNECTIONS
# =============================================================================
connections:
  # ---------------------------------------------------------------------------
  # Source routing
  # ---------------------------------------------------------------------------
  - [lfSource, lfSourceGain]
  - [lfSourceGain, sourceSum]
  - [impulseSource, impulseGain]
  - [impulseGain, sourceSum]
  - [sourceSum, tiltFilter]

  # ---------------------------------------------------------------------------
  # Glottal shaping - cascade path
  # ---------------------------------------------------------------------------
  - [tiltFilter, rgp]
  - [tiltFilter, rgs]
  - [rgs, rgpAvs]

  # Voice cascade path - three parallel routes merged at voiceGain
  - [tiltFilter, sourceBypassGain]
  - [sourceBypassGain, voiceGain]
  - [rgp, sourceDirectGain]
  - [sourceDirectGain, voiceGain]
  - [rgp, rgz]
  - [rgz, radiationDiff]
  - [radiationDiff, sourceDiffGain]
  - [sourceDiffGain, voiceGain]
  - [voiceGain, mixer]

  # ---------------------------------------------------------------------------
  # Glottal shaping - parallel AVS path
  # ---------------------------------------------------------------------------
  - [tiltFilter, avsBypassGain]
  - [avsBypassGain, avsGain]
  - [rgpAvs, avsDirectGain]
  - [avsDirectGain, avsGain]
  - [rgpAvs, rgzAvs]
  - [rgzAvs, radiationDiffAvs]
  - [radiationDiffAvs, avsDiffGain]
  - [avsDiffGain, avsGain]
  - [avsGain, parallelMixer]

  # ---------------------------------------------------------------------------
  # Aspiration/frication routing
  # ---------------------------------------------------------------------------
  - [glottalMod, noiseSource]
  - [glottalMod, fricationSource]
  - [noiseSource, noiseGain]
  - [noiseGain, mixer]
  - [noiseGain, parallelMixer]

  # ---------------------------------------------------------------------------
  # Cascade branch: NZ -> NP -> F1 -> F2 -> F3 -> F4 -> F5 -> F6
  # ---------------------------------------------------------------------------
  # NOTE: This matches Figure 6's conceptual diagram from Klatt 1980.
  # COEWAV.FOR processes in reverse order (F6->F5->F4->F3->F2->F1->NZ->NP)
  # "to minimize transients" (line 175), but the transfer function is
  # mathematically equivalent since cascaded filters commute.
  # ---------------------------------------------------------------------------
  - [mixer, nz]
  - [nz, np]
  # Cascade formant chain (np -> F1..F6 -> cascadeOutGain) generated by formantBanks
  - [cascadeOutGain, outputSum]

  # ---------------------------------------------------------------------------
  # Parallel branch routing
  # ---------------------------------------------------------------------------
  - [parallelMixer, parallelSourceGain]
  - [parallelMixer, diff]
  - [diff, parallelDiffGain]
  - [parallelDiffGain, parallelDiffSum]
  - [fricationSource, parallelFricGain]
  - [parallelFricGain, parallelDiffSum]

  # Parallel formant channels (source -> F{N} -> F{N}Gain -> parallelSum) generated by formantBanks

  # Parallel nasal uses UGLOT
  - [parallelSourceGain, parallelNasal]
  - [parallelNasal, parallelNasalGain]
  - [parallelNasalGain, parallelSum]

  # Parallel bypass
  - [parallelFricGain, parallelBypassGain]
  - [parallelBypassGain, parallelSum]

  # Parallel output - summed with cascade (per COEWAV.FOR line 251: ULIPS=(ULIPSV+ULIPSF+STEP)*(170.))
  # Parallel voicing gated by parallelVoiceGain, frication always flows through
  - [parallelSum, outputSum]

  # ---------------------------------------------------------------------------
  # PLSTEP burst - edge detection triggers decay envelope
  # ---------------------------------------------------------------------------
  - [afEdgeDetector, plstepTriggerSum]
  - [ahEdgeDetector, plstepTriggerSum]
  - [plstepTriggerSum, plstepEnvelope]  # Connect sum output to trigger input
  - [plstepEnvelope, outputSum]

  # ---------------------------------------------------------------------------
  # Output chain
  # ---------------------------------------------------------------------------
  - [outputSum, outputLp]
  - [outputLp, masterGain]
  - [masterGain, outputCompressor]
  - [outputCompressor, outputGain]

  # ---------------------------------------------------------------------------
  # Aerodynamic model -> AudioParam connections
  # Stevens & Bickley (1991) HL controls -> derived KL controls
  # ---------------------------------------------------------------------------
  - from: { node: aeroModel, port: 0 }
    to: { node: voiceGain, param: gain }
  - from: { node: aeroModel, port: 1 }
    to: { node: noiseGain, param: gain }
  - from: { node: aeroModel, port: 2 }
    to: { node: parallelFricGain, param: gain }
  - from: { node: aeroModel, port: 3 }
    to: { node: cascadeF1, param: bandwidth }
  - from: { node: aeroModel, port: 3 }
    to: { node: parallelF1, param: bandwidth }
  - from: { node: aeroModel, port: 4 }
    to: { node: np, param: frequency }
  - from: { node: aeroModel, port: 4 }
    to: { node: parallelNasal, param: frequency }
  - from: { node: aeroModel, port: 5 }
    to: { node: nz, param: frequency }
  - from: { node: aeroModel, port: 6 }
    to: { node: impulseSource, param: openPhaseRatio }
  - from: { node: aeroModel, port: 7 }
    to: { node: tiltFilter, param: tilt }

# =============================================================================
# OUTPUTS
# =============================================================================
outputs:
  - outputGain
