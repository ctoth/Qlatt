# Allen, Hunnicutt & Klatt 1987 FORMAT. The quote/apostrophe and punctuation
# patterns preserve the completed Qlatt #16 contract; all matching is declared.
tags:
  normalization_lexical: Orthographic normalization and terminal word separation
maps:
  tn_abbreviations:
    dr.: doctor
    mr.: mister
    mrs.: missus
    ms.: miss
    st.: saint
    ave.: avenue
    blvd.: boulevard
    rd.: road
    sr.: senior
    jr.: junior
    prof.: professor
    gen.: general
    sgt.: sergeant
    cpl.: corporal
    pvt.: private
    capt.: captain
    lt.: lieutenant
    col.: colonel
    govt.: government
    dept.: department
    univ.: university
    assn.: association
    bros.: brothers
    inc.: incorporated
    corp.: corporation
    co.: company
    no.: number
    approx.: approximately
    vs.: versus
    etc.: etcetera
  tn_lexical_policy:
    apostrophe_quotes: '[\u2018\u2019\u201A\u2032]'
    double_quotes: '[\u201C\u201D\u201E]'
    ellipsis: '\u2026'
    lexical_apostrophe: "(?<=[a-z])'(?=[a-z]|[^a-z]|$)"
    unlisted: "[^\\w\\s'\uE000]"
    whitespace: '\s+'
functions:
  tn_clean_text:
    params: [text]
    body: >-
      regexReplace(regexReplace(regexReplace(regexReplace(regexReplace(regexReplace(
        lower(text), maps.tn_lexical_policy.apostrophe_quotes, "'", 'g'),
        maps.tn_lexical_policy.double_quotes, '"', 'g'),
        maps.tn_lexical_policy.ellipsis, '...', 'g'),
        get(maps.tn_recognition_policy, 'lexical_apostrophe',
          maps.tn_lexical_policy.lexical_apostrophe), '\uE000', 'g'),
        "'", ' ', 'g'),
        '\uE000', "'", 'g')
    citations: ['Issue #16: lexical apostrophe and punctuation contract']
rules:
  tn_abbreviation:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'abbreviation' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: "tn_words(vocabulary('tn_abbreviations', lower(current.payload.key)) + lower(current.payload.tail))"
    citations:
      - "Allen, Hunnicutt & Klatt 1987; abbreviation expansion"
  tn_initialism:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'initialism' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: "tn_words(split(lower(current.text), '.').filter(letter, letter != '').join(' '))"
    citations:
      - "Allen, Hunnicutt & Klatt 1987; initialisms"
  # An initial is spelled, and its period reaches the phonetics twice: once
  # from the spelling routine and once from the routine that reads the next
  # word. The second period is a clause of its own with no phone in it.
  tn_initial:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'initial' && current.outputType == 'source'"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: >-
        [{'type': 'request', 'kind': 'words', 'payload': {'text': lower(current.payload.letter)}},
         {'type': 'request', 'kind': 'words', 'payload': {'text': '.'}},
         {'type': 'request', 'kind': 'words', 'payload': {'text': '.'}}]
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:2612-2623 (the initial: rbphone = PERIOD, the word is spelled)"
      - "DECtalk 4.63 LTS/ls_task.c:1516-1519 (the spelling routine sends the PERIOD), 1547-1549 (the next-word routine sends it again)"
  # An abbreviation the frontend's dictionary holds with its period: one
  # terminal, the word with the period, which the dictionary then speaks. The
  # period is not a sentence end, but the text's end still is one: measured on
  # DECtalk 4.63 say.exe, "We live at 12 Oak Ave." ends in "avenue" and the
  # period symbol, and "Ask Mr. Then go." is one clause.
  tn_dictionary_abbreviation:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'dictionary_abbreviation' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal, request]
      tag: normalization_lexical
      output: >-
        get(current.payload, 'final', '') == '.'
          ? [{'type': 'terminal', 'text': lower(current.payload.word) + '.'},
             {'type': 'request', 'kind': 'words', 'payload': {'text': '.'}}]
          : [{'type': 'terminal', 'text': lower(current.payload.word) + '.'}]
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:2040-2160 (the abbreviation hit sends the dictionary entry's phones and eats the period)"
  tn_bare_number_request:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind in ['cardinal', 'ordinal'] && current.outputType == 'source'"
    # A frontend whose lexicon speaks digits itself keeps a bare cardinal as
    # one terminal (tn_recognition_policy.bare_numbers: digits), so the number
    # is not confused with the same words typed out.
    expand_text:
      allowed_types: [request, terminal]
      tag: normalization_lexical
      output: >-
        maps.tn_recognition_policy.bare_numbers == 'digits' && current.kind == 'cardinal'
          ? [{'type': 'terminal', 'text': current.payload.value}]
          : tn_number_request(double(current.payload.value), current.kind == 'ordinal' ? 'hundred' : maps.tn_recognition_policy.hundreds, current.kind == 'ordinal', '')
    citations:
      - "Issue #144: explicit bare-number convention"
      - "DECtalk 4.63 LTS/ls_task.c:3776-3806 (an all-digit word is spoken by the number routines, not looked up)"
  # A number-like word recognised whole (tn_number_token_source) stays one
  # terminal, as written: the frontend's lexicon reads it.
  tn_number_token:
    kind: structural
    select:
      relation: Normalization
      where: "current.kind == 'number_token' && current.outputType == 'source'"
    expand_text:
      allowed_types: [terminal]
      tag: normalization_lexical
      output: "[{'type': 'terminal', 'text': current.payload.token}]"
    citations:
      - "DECtalk 4.63 LTS/ls_task.c:3181-3513, 3622-3652, 3747-3825 (money, times and numbers are read from the word as written, by the number routines)"
  tn_unmatched_words:
    kind: structural
    select:
      relation: Normalization
      where: "current.outputType == 'source' && current.kind in ['', 'word']"
    expand_text:
      allowed_types: [request]
      tag: normalization_lexical
      output: >-
        regexSplit(tn_clean_text(current.text), '(' + literalPattern(transcription.punctuation_tokens) + ')')
          .map(part, {'type': 'request', 'kind': 'words', 'payload': {'text':
            part in transcription.punctuation_tokens ? part
              : regexReplace(regexReplace(part, maps.tn_lexical_policy.unlisted, ' ', 'g'), maps.tn_lexical_policy.whitespace, ' ', 'g')}})
    citations:
      - "Issue #16: declared punctuation cleanup"
      - "Allen, Hunnicutt & Klatt 1987; case and whitespace normalization"
phases:
  - name: normalization_lexical
    rules: [tn_dictionary_abbreviation, tn_abbreviation, tn_initialism, tn_initial, tn_bare_number_request, tn_number_token, tn_unmatched_words]
