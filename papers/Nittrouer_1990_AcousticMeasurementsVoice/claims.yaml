source:
  paper: Nittrouer_1990_AcousticMeasurementsVoice
claims:
- id: claim1
  type: observation
  statement: After voiceless stops, F0 should be higher than after voiced stops by
    approximately 7-10 Hz (men) or 14-16 Hz (women)
  concepts:
  - f0
  provenance:
    paper: Nittrouer_1990_AcousticMeasurementsVoice
    page: 0
- id: claim2
  type: observation
  statement: For female voices, H1-H2 should be approximately 2-4 dB higher than for
    male voices
  concepts:
  - h1_h2
  provenance:
    paper: Nittrouer_1990_AcousticMeasurementsVoice
    page: 0
- id: claim3
  type: observation
  statement: Jitter for female voices should be substantially less than for male voices
    (roughly 0.03 ms vs 0.08-0.15 ms)
  concepts:
  - jitter
  provenance:
    paper: Nittrouer_1990_AcousticMeasurementsVoice
    page: 0
