version: v1
citations:
  - Hunnicutt 1976
  - Allen, Hunnicutt & Klatt 1987 Ch.4-5
suffixes:
  # Ordered longest-first for matching priority
  - spelling: "ation"
    condition_class: always
    output_phonemes: [EY1, SH, AH0, N]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: forcing
    stress_target: penult
    min_root: 3
  - spelling: "tion"
    condition_class: always
    output_phonemes: [SH, AH0, N]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: forcing
    stress_target: penult
    min_root: 3
  - spelling: "sion"
    condition_class: always
    output_phonemes: [ZH, AH0, N]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: forcing
    stress_target: penult
    min_root: 3
  - spelling: "ness"
    condition_class: always
    output_phonemes: [N, AH0, S]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "ment"
    condition_class: always
    output_phonemes: [M, AH0, N, T]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "able"
    condition_class: always
    output_phonemes: [AH0, B, AH0, L]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "ible"
    condition_class: always
    output_phonemes: [AH0, B, AH0, L]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "ful"
    condition_class: always
    output_phonemes: [F, AH0, L]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "less"
    condition_class: always
    output_phonemes: [L, AH0, S]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "ing"
    condition_class: always
    output_phonemes: [IH0, NG]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - spelling: "er"
    condition_class: always
    output_phonemes: [ER0]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - spelling: "est"
    condition_class: always
    output_phonemes: [AH0, S, T]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - spelling: "ed"
    condition_class: td_finals
    output_phonemes: [IH0, D]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - spelling: "ed"
    condition_class: voiceless_finals
    output_phonemes: [T]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - spelling: "ed"
    condition_class: default
    output_phonemes: [D]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]
    stress_type: non_affecting
    min_root: 3
    try_silent_e: true
  - spelling: "ly"
    condition_class: always
    output_phonemes: [L, IY0]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "es"
    condition_class: always
    output_phonemes: [IH0, Z]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "s"
    condition_class: sibilant_finals
    output_phonemes: [IH0, Z]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "s"
    condition_class: voiceless_consonants
    output_phonemes: [S]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]
    stress_type: non_affecting
    min_root: 3
  - spelling: "s"
    condition_class: default
    output_phonemes: [Z]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]
    stress_type: non_affecting
    min_root: 3

prefixes:
  - spelling: "un"
    condition_class: always
    output_phonemes: [AH0, N]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    min_remainder: 3
  - spelling: "re"
    condition_class: always
    output_phonemes: [R, IY0]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    min_remainder: 3
  - spelling: "dis"
    condition_class: always
    output_phonemes: [D, IH0, S]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    min_remainder: 3
  - spelling: "mis"
    condition_class: always
    output_phonemes: [M, IH0, S]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    min_remainder: 3
  - spelling: "pre"
    condition_class: always
    output_phonemes: [P, R, IY0]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    min_remainder: 3
  - spelling: "over"
    condition_class: always
    output_phonemes: [OW1, V, ER0]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    min_remainder: 3
  - spelling: "out"
    condition_class: always
    output_phonemes: [AW1, T]
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
    min_remainder: 3

clitics:
  - spelling: "'s"
    allomorph_spelling: "s"
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.5"]

heuristics:
  minimum_word_length:
    value: 4
    estimate: avoids over-decomposing short function words
  consonant_undoubling_minimum_root_length:
    value: 4
    estimate: avoids collapsing short doubled-letter roots
  silent_e_letter:
    value: "e"
    citations: ["Allen, Hunnicutt & Klatt 1987 Ch.4-5"]
