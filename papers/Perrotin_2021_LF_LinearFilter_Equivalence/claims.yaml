    0]
  provenance:
    paper: Perrotin_2021_LF_LinearFilter_Equivalence
    page: 0
- id: claim18
  type: equation
  expression: H_{CALM_{open}}(s) = \frac{(1 + e^{(a_{CALM}-s)T_{CALM}}) Es}{(a_{CALM}
