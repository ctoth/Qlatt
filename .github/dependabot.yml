version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # ts-node and check-registry-bindings use the pre-7 JavaScript compiler API.
    # Remove this 7.x ignore once both consumers support TypeScript 7's API.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      npm-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
