version: v1
predicates:
  is_question_boundary: current.phoneme == 'SIL' && current.punctuationSymbol == '?'
  is_stressed_vowel: current.type == 'vowel' && has(current.stress) && current.stress == 1
  is_pausable_consonant: current.type in ['stop_closure', 'fricative', 'nasal', 'liquid', 'glide', 'affricate']
  is_sonorant: current.type in ['nasal', 'liquid', 'glide']
  is_vowel_or_sonorant: current.type == 'vowel' || current.type in ['nasal', 'liquid', 'glide']
  prev_same_word: has(prev.word) && has(current.word) && prev.word == current.word
  next_same_word: has(next.word) && has(current.word) && next.word == current.word
  prev_diff_word: prev == null || !has(prev.word) || !has(current.word) || prev.word != current.word
  is_coda: >-
    next == null || next.phoneme == 'SIL' ||
    next.type in ['stop', 'stop_closure', 'fricative', 'nasal', 'affricate'] ||
    (has(next.word) && has(current.word) && next.word != current.word)
  # NOTE: "coronal" is the disjunction of alveolar and postalveolar feature flags.
  # No token in this codebase carries a `coronal: true` annotation.
  prev_coronal: (has(prev.alveolar) && prev.alveolar == true) || (has(prev.postalveolar) && prev.postalveolar == true)
  next_coronal: (has(next.alveolar) && next.alveolar == true) || (has(next.postalveolar) && next.postalveolar == true)
  both_coronal: ((has(prev.alveolar) && prev.alveolar == true) || (has(prev.postalveolar) && prev.postalveolar == true)) && ((has(next.alveolar) && next.alveolar == true) || (has(next.postalveolar) && next.postalveolar == true))
  one_coronal: (has(prev.alveolar) && prev.alveolar == true) || (has(prev.postalveolar) && prev.postalveolar == true) || (has(next.alveolar) && next.alveolar == true) || (has(next.postalveolar) && next.postalveolar == true)
  is_bilabial: has(current.bilabial) && current.bilabial == true
  is_alveolar: has(current.alveolar) && current.alveolar == true
  is_velar: has(current.velar) && current.velar == true
  is_voiced: has(current.voiced) && current.voiced == true
  is_voiceless: has(current.voiceless) && current.voiceless == true
  is_back_vowel: has(current.back_vowel) && current.back_vowel == true
  is_front_vowel: has(current.front_vowel) && current.front_vowel == true
  is_high_vowel: has(current.high_vowel) && current.high_vowel == true
  prev_is_voiced: prev != null && has(prev.voiced) && prev.voiced == true
  prev_is_voiceless: prev != null && has(prev.voiceless) && prev.voiceless == true
  # next_diff_word uses strict semantics (matches original bare `current.word != next.word` literal,
  # which would throw on missing fields; we preserve "any missing = no match" by returning false).
  next_diff_word: next != null && has(next.word) && has(current.word) && next.word != current.word
string_sets:
  # ASCII single-letter words. Used by `spelling_mode_letter_names`
  # (phases/orthography.yaml) to detect runs of letter tokens like "U C L A".
  ascii_letter: ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm',
                 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z']
  place_locus_closures: [K_CL, P_CL, B_CL, M, T_CL, D_CL, N, Y]
  place_locus_releases: [K_REL, P_REL, B_REL, T_REL, D_REL]
  # Canonical English function words (lower-cased). Single source of truth for
  # the `mark_function_words` prosody-annotation rule, which classifies each
  # word as function (unaccentable) or content via
  # `lower(current.word) in sets.function_words`. Previously duplicated in
  # policy/accent-policy.yaml; unified here as the declarative membership set.
  # Citations: O'Shaughnessy 1976 (accent priority by word class),
  #            Allen, Hunnicutt & Klatt 1987 (MITalk POS-to-accent mapping).
  function_words:
    - a
    - an
    - the
    - and
    - or
    - but
    - so
