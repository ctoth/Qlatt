version: v13-cel
inventory_path: /rules/frontends/dectalk-english/inventory.yaml
lts_path: /rules/frontends/dectalk-english/lts-rules.yaml
include:
  - pipeline.yaml
  - phases/duration.yaml
  - phases/prosody.yaml
parameters:
  policy:
    duration:
      rate_scale: 1.0
      pause_comma_ms: 150
      pause_period_ms: 300
      pause_clause_initial_ms: 32
      clause_final_lengthening_ms: 38
      clause_final_voiced_obstruent_ms: 19
      non_final_shortening: 0.70
      stress_secondary: 0.85
      stress_unstressed: 0.70
      medial_syllable_shortening: 0.85
      polysyllabic_shortening: 0.80
      non_initial_consonant_shortening: 0.85
      word_final_obstruent_lengthening_ms: 19
      unstressed_syllabic_shortening: 0.70
      unstressed_consonant_shortening: 0.70
      unstressed_glide_shortening: 0.50
      emphasis_lengthening_ms: 19
      emphasis_syllabic_extra_ms: 38
      pre_voiceless_fricative_shortening: 0.80
      pre_voiceless_plosive_shortening: 0.70
      pre_voiced_obstruent_lengthening: 1.20
      pre_nasal_shortening: 0.85
      cluster_shortening: 0.70
      post_voiceless_plosive_lengthening_ms: 19
      phrase_initial_vowel_lengthening_ms: 19
      citations:
        - "DECtalk 4.63 p_us_tim.c"
        - "DECtalk 4.63 ph_defs.h (NF*MS constants)"
    f0:
      pitch_range:
        hat_rise_semitones: 4
        hat_fall_semitones: -6
        baseline_declination_st_per_sec: -1.5
      stress_f0_boost:
        primary_semitones: 3
        secondary_semitones: 1.5
      question_final_rise_semitones: 6
      citations:
        - "DECtalk 4.63 ph_inton.c"
    formant:
      coarticulation_weight: 0.3
      transition_time_ms: 30
      citations:
        - "DECtalk 4.63 ph_setar.c"
    speaker:
      base_f0_hz:
        value: 122
        citations: ["DECtalk 4.63 Paul default AP"]
      formant_scale:
        value: 1.0
        citations: ["DECtalk 4.63 Paul male"]
      rd_default:
        value: 0.7
        citations: ["DECtalk 4.63 Paul BR=0, male base 0.7"]
      spectral_tilt_offset_db:
        value: 0
        citations: ["DECtalk 4.63 Paul BR=0"]
      f0_minimum:
        value: 1100
        citations: ["DECtalk 4.63 Paul (AP-12)*10, ph_vset.c general path"]
      f0_scale_factor:
        value: 4100
        citations: ["DECtalk 4.63 Paul PR*41, ph_vset.c"]
      f0_lp_filter:
        value: 2100
        citations: ["DECtalk 4.63 Paul 1500+15*QU, ph_vset.c general path"]
      hat_rise_hz10:
        value: 180
        citations: ["DECtalk 4.63 Paul HR*10, ph_vset.c general path"]
      scale_str_rise:
        value: 32
        citations: ["DECtalk 4.63 Paul SR direct"]
      assertiveness:
        value: 2870
        citations: ["DECtalk 4.63 Paul AS*41, ph_vset.c"]
      baseline_fall_hz10:
        value: 180
        citations: ["DECtalk 4.63 Paul BF*10"]
output:
  blend:
    default_weight: 0.5
  min_duration:
    default: 30
  transition_ms: 30
  final_silence_ms: 100
transcription:
  diagnostic_symbols:
    aa: [AA1]
    ae: [AE1]
    ah: [AH1]
    ao: [AO1]
    aw: [AW1]
    ay: [AY1]
    b: [B]
    ch: [CH]
    d: [D]
    dh: [DH]
    eh: [EH1]
    el: [EL]
    en: [EN]
    er: [ER1]
    ey: [EY1]
    f: [F]
    g: [G]
    gs: [GS]
    hh: [HH]
    ih: [IH1]
    iy: [IY1]
    jh: [JH]
    k: [K]
    l: [L]
    m: [M]
    n: [N]
    ng: [NG]
    ow: [OW1]
    oy: [OY1]
    p: [P]
    r: [R]
    s: [S]
    sh: [SH]
    t: [T]
    th: [TH]
    uh: [UH1]
    uw: [UW1]
    v: [V]
    w: [W]
    y: [Y]
    z: [Z]
    zh: [ZH]
  punctuation_tokens: [",", ".", "?", "!", ";", ":"]
