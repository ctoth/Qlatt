      - { register: durlin_F1, value: "u.dip_F1 ? r.durlin_F1 : f.count", tag: formant_diphthong }
      - { register: durlin_F2, value: "u.dip_F2 ? r.durlin_F2 : f.count", tag: formant_diphthong }
      - { register: durlin_F3, value: "u.dip_F3 ? r.durlin_F3 : f.count", tag: formant_diphthong }
      - { register: durlin_B2, value: "u.dip_B2 ? r.durlin_B2 : f.count", tag: formant_diphthong }
      - { register: durlin_B3, value: "u.dip_B3 ? r.durlin_B3 : f.count", tag: formant_diphthong }
