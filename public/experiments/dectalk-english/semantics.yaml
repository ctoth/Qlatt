# DECtalk 4.63 English Experiment — Semantics Overrides
#
# Extends klatt80-baseline with defaults appropriate for the DECtalk 4.63
# English frontend parameter set.
#
# DECtalk 4.63 uses the KLGLOTT88 source (VTM/vtm3.c), but sourceMode
# defaults to 0 until the mode 3 runtime worklet voice-output bug is fixed.
# The frontend's inventory.yaml already sets these per-frame, but
# having the experiment default match avoids silent frames before the
# first frontend frame arrives.
#
# Source: DECtalk 4.63 dapi/src (ph_vdef.c, phinton.c, COEWAV.FOR)

params:
  # DECtalk's graph binds the Klatt 1980 raw nasal controls directly.
  # These belong to this experiment, not the area-controlled baseline solver.
  FNP:
    type: float
    default: 0
    unit: Hz
  FNZ:
    type: float
    default: 0
    unit: Hz
  BNP:
    type: float
    default: 0
    unit: Hz
  BNZ:
    type: float
    default: 0
    unit: Hz
  # Preserve this experiment's documented eight-stage cascade.
  NFC:
    type: int
    range: [1, 8]
    default: 8
  # Klatt 1980 dB amplitude controls for the frontend's parallel-only extensions.
  A9:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  A10:
    type: float
    range: [0, 80]
    default: 0
    unit: dB
  # DECtalk packet words the dectalk-english frontend emits for the dectalk-vtm
  # experiment (scripts/oracle/dectalk-debug/ph-contract.md), in the packet's
  # integer scale. No node of this graph binds them; they are declared here so
  # that the frontend's columns are all known to the experiment it ships with.
  PS:
    description: "OUT_PS, subglottal pressure (packet word; unused by this graph)"
    type: int
    default: 0
  CNK:
    description: "OUT_CNK, posterior glottal chink area (packet word; unused by this graph)"
    type: int
    default: 0
  AG:
    description: "OUT_AG, glottal area (packet word; unused by this graph)"
    type: int
    default: 0
  PH:
    description: "OUT_PH, (font << 8) | allophone code (packet word; unused by this graph)"
    type: int
    default: 0
  run:
    description: "Frame clock of the dectalk-vtm node: 1 while packets are sent (unused by this graph)"
    type: int
    default: 0
  AL:
    description: "OUT_AL, lip area (packet word; unused by this graph)"
    type: int
    default: 0
  ABLADE:
    description: "OUT_ABLADE, tongue blade area (packet word; unused by this graph)"
    type: int
    default: 0
  ATB:
    description: "OUT_ATB, tongue body area (packet word; unused by this graph)"
    type: int
    default: 0
  AREA_N:
    description: "OUT_AN, velopharyngeal area (packet word; unused by this graph)"
    type: int
    default: 0
  DC:
    description: "OUT_DC (packet word; unused by this graph)"
    type: int
    default: 0
  UE:
    description: "OUT_UE (packet word; unused by this graph)"
    type: int
    default: 0
  A2_CODE:
    description: "OUT_A2, frication place code (packet word; unused by this graph)"
    type: int
    default: 0
  BRST:
    description: "OUT_BRST, burst marker (packet word; unused by this graph)"
    type: int
    default: 0
  PLACE:
    description: "OUT_PLACE, velar place (packet word; unused by this graph)"
    type: int
    default: 0
  # The selected voice's speaker definition packet words and the three values
  # DECtalk's VTM thread reads beside them, which the frontend emits for the
  # dectalk-vtm experiment (ph-contract.md, "Per speaker"). No node of this
  # graph binds them; declared for the same reason as the packet words above.
  SPD_R4CB: { type: int, default: 0, description: "Speaker packet r4cb (unused by this graph)" }
  SPD_R4CC: { type: int, default: 0, description: "Speaker packet r4cc (unused by this graph)" }
  SPD_R5CB: { type: int, default: 0, description: "Speaker packet r5cb (unused by this graph)" }
  SPD_R5CC: { type: int, default: 0, description: "Speaker packet r5cc (unused by this graph)" }
  SPD_R4PB: { type: int, default: 0, description: "Speaker packet r4pb (unused by this graph)" }
  SPD_R5PB: { type: int, default: 0, description: "Speaker packet r5pb (unused by this graph)" }
  SPD_T0JIT: { type: int, default: 0, description: "Speaker packet t0jit (unused by this graph)" }
  SPD_R5CA: { type: int, default: 0, description: "Speaker packet r5ca (unused by this graph)" }
  SPD_R4CA: { type: int, default: 0, description: "Speaker packet r4ca (unused by this graph)" }
  SPD_R3CA: { type: int, default: 0, description: "Speaker packet r3ca (unused by this graph)" }
  SPD_R2CA: { type: int, default: 0, description: "Speaker packet r2ca (unused by this graph)" }
  SPD_R1CA: { type: int, default: 0, description: "Speaker packet r1ca (unused by this graph)" }
  SPD_NOPEN1: { type: int, default: 0, description: "Speaker packet nopen1 (unused by this graph)" }
  SPD_NOPEN2: { type: int, default: 0, description: "Speaker packet nopen2 (unused by this graph)" }
  SPD_ATURB: { type: int, default: 0, description: "Speaker packet aturb (unused by this graph)" }
  SPD_AFGAIN: { type: int, default: 0, description: "Speaker packet afgain (unused by this graph)" }
  SPD_AZGAIN: { type: int, default: 0, description: "Speaker packet azgain (unused by this graph)" }
  SPD_APGAIN: { type: int, default: 0, description: "Speaker packet apgain (unused by this graph)" }
  SPD_SEX: { type: int, default: 0, description: "Speaker packet sex (unused by this graph)" }
  last_voice: { type: int, default: 0, description: "DECtalk voice number (unused by this graph)" }
  NOM_Open_Quo: { type: int, default: 0, description: "hlsyn modal open quotient (unused by this graph)" }
  Tiltm: { type: int, default: 0, description: "hlsyn modal spectral tilt (unused by this graph)" }
  # DECtalk 4.63 uses KLGLOTT88, but the runtime default remains the impulse
  # fallback while mode 3 emits no voiced waveform.
  sourceMode:
    description: "Voice source selection (0=impulse fallback default, 1=LF, 2=bypass, 3=KLGLOTT88 selectable but currently blocked)"
    type: integer
    default: 0
    range: [0, 3]

  lfMode:
    description: "LF branch shape (0=Legacy, 1=LFLM, 2=LFCALM mapped to LFLM, 3=Veldhuis 1998 R++, 4=Rosenberg 1971 C); sourceMode selects the branch"
    type: integer
    default: 0
    range: [0, 4]

  # Per-voice breathiness (DECtalk BR). ph_vset.c:786 sets aturb = BR, i.e. the
  # voice's breathiness drives the KLGLOTT88 source's open-phase turbulence noise
  # amplitude. Stamped per-voice via speaker_frame_params; bound to klglottSource
  # aturb. Paul BR=0 -> no breathiness. (B1-widening BR^2/2, ph_vset.c:703, is a
  # separate follow-up pending Hz-unit verification.)
  breathiness:
    description: "Per-voice breathiness BR -> KLGLOTT88 aturb (turbulence amplitude). DECtalk ph_vset.c:786."
    type: float
    default: 0
    range: [0, 100]

  # Parallel-only F9/F10 use the baseline's high-frequency extension defaults:
  # Fant neutral spacing; Rabiner (1968) Q=4 and Q=2 bandwidths.
  F9:
    description: "Ninth parallel formant frequency"
    type: float
    default: 8500
    range: [7000, 12000]

  F10:
    description: "Tenth parallel formant frequency"
    type: float
    default: 9500
    range: [8000, 14000]

  B9:
    description: "Ninth parallel formant bandwidth"
    type: float
    default: 2125
    range: [100, 6000]

  B10:
    description: "Tenth parallel formant bandwidth"
    type: float
    default: 4750
    range: [100, 8000]

realize:
  # Lin (1995) PFE amplitude convention, extrapolated to these parallel-only
  # extensions against the existing eight-formant bank. Engineering extension:
  # neither branch adds a cascade pole or changes the existing A1-A8 corrections.
  # Signs and dB offsets are the baseline F9/F10 extension calibration.
  a9Linear:
    expr: >-
      A9 > 0 ? dbToLinear(A9 + ndbScale.A9
        + resonatorMagnitudeDb(F9, F1, B1, sampleRate)
        + resonatorMagnitudeDb(F9, F2, B2, sampleRate)
        + resonatorMagnitudeDb(F9, F3, B3, sampleRate)
        + resonatorMagnitudeDb(F9, F4, B4, sampleRate)
        + resonatorMagnitudeDb(F9, F5, B5, sampleRate)
        + resonatorMagnitudeDb(F9, F6, B6, sampleRate)
        + resonatorMagnitudeDb(F9, F7, B7, sampleRate)
        + resonatorMagnitudeDb(F9, F8, B8, sampleRate)) * parallelScale : 0
    deps: [A9, F9, F1, B1, F2, B2, F3, B3, F4, B4, F5, B5, F6, B6, F7, B7, F8, B8, sampleRate, parallelScale]
  a10Linear:
    expr: >-
      A10 > 0 ? -dbToLinear(A10 + ndbScale.A10
        + resonatorMagnitudeDb(F10, F1, B1, sampleRate)
        + resonatorMagnitudeDb(F10, F2, B2, sampleRate)
        + resonatorMagnitudeDb(F10, F3, B3, sampleRate)
        + resonatorMagnitudeDb(F10, F4, B4, sampleRate)
        + resonatorMagnitudeDb(F10, F5, B5, sampleRate)
        + resonatorMagnitudeDb(F10, F6, B6, sampleRate)
        + resonatorMagnitudeDb(F10, F7, B7, sampleRate)
        + resonatorMagnitudeDb(F10, F8, B8, sampleRate)) * parallelScale : 0
    deps: [A10, F10, F1, B1, F2, B2, F3, B3, F4, B4, F5, B5, F6, B6, F7, B7, F8, B8, sampleRate, parallelScale]
  # klsyn88 KLGLOTT88 source gate. Active only at sourceMode 3. step (not ramped):
  # source selection must switch instantaneously, like the other source switches.
  klglottSourceSwitch:
    expr: "sourceMode == 3 ? 1.0 : 0.0"
    deps: [sourceMode]
    step: true
    description: "Gates the klglott (KLGLOTT88) source on at sourceMode 3"

  # Override the inherited baseline rule (sourceMode != 1 ? 1 : 0). With a 4th mode,
  # the impulse source must be ON only at sourceMode 0 — otherwise it would also play
  # at sourceMode 3 and double the voice.
  impulseSourceSwitch:
    expr: "sourceMode == 0 ? 1.0 : 0.0"
    deps: [sourceMode]
    step: true
    description: "Impulse source active only at sourceMode 0 (was !=1; narrowed for mode 3)"

  # At sourceMode 3 the klglott source feeds voiceGain/avsGain directly, so the impulse
  # diff route must contribute nothing. Baseline expr gives 1 at any mode not 1/2; narrow
  # so mode 3 is also 0. (bypass/direct switches are already 0 at mode 3.) Shared by the
  # cascade (sourceDiffGain) and parallel (avsDiffGain) paths.
  sourceDiffSwitch:
    expr: "(sourceMode == 2 || sourceMode == 3) ? 0.0 : (sourceMode == 1 ? 0.0 : 1.0)"
    deps: [sourceMode]
    step: true
    description: "Impulse diff route active only at sourceMode 0 (off at mode 3: klglott feeds voiceGain directly)"
